<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2efe4">
<title>一亩稻</title>
<style>
  :root{
    --paper:#f2efe4; --card:#fffdf6; --ink:#282c22; --dim:#8a8574;
    --green:#41603a; --green-d:#2b3f26; --gold:#a87d24; --gold-l:#f7efd8;
    --line:#ddd6c2; --bad:#9e4029; --good:#37623f; --clay:#8a6b4a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;min-height:100%}
  body{
    background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:17px;line-height:1.85;-webkit-font-smoothing:antialiased;
    display:flex;justify-content:center;
  }
  #app{width:100%;max-width:520px;min-height:100vh;min-height:100dvh;
    padding:24px 22px 40px;display:flex;flex-direction:column}

  /* 顶上这一整块钉住 —— 手机上选项在下面，翻下去看选项就看不见数了。
     里面两行：数值 + 进度表。你读选项的时候，账和走到哪儿了一直摆在眼前。 */
  .head{position:sticky;top:0;z-index:8;background:var(--paper);
    margin:0 -22px 20px;padding:15px 22px 0;border-bottom:1px solid var(--line);
    box-shadow:0 7px 14px -12px rgba(0,0,0,.5)}
  .hud{display:flex;gap:4px;font-size:12px;line-height:1.35;color:var(--dim);
    padding-bottom:11px}
  .hud .c{flex:1;text-align:center}
  .hud .c b{display:block;font-size:18px;font-weight:600;color:var(--ink);
    font-variant-numeric:tabular-nums;transition:color .35s}
  .hud .c.up b{color:var(--good)} .hud .c.dn b{color:var(--bad)}
  .hud .c.low b{color:var(--bad);opacity:.6}
  .hud .c.m b{font-size:15px;color:var(--gold);padding-top:3px}
  .hud .c.s b{font-size:15px;color:var(--clay);padding-top:3px}
  .hud .c.s.low b{color:var(--bad);opacity:1}
  .hud .c.snd{flex:0 0 26px;cursor:pointer;user-select:none;font-size:15px;
    color:var(--dim);opacity:.65;text-align:right}
  .hud .c.snd.off{opacity:.3}

  /* 一季的进程表 —— 八个格子，走过的沉下去，眼下的点着。
     「种到哪儿了、还剩几个」这件事，不该要玩家自己数。 */
  .tstrip{display:flex;gap:3px;padding-bottom:9px}
  .tstrip .td{flex:1;text-align:center;font-size:10.5px;line-height:1.3;
    color:#c8c2b1;transition:color .3s}
  .tstrip .td i{display:block;height:4px;border-radius:2px;background:#e3ddcb;
    margin-bottom:4px;transition:background .3s,box-shadow .3s}
  .tstrip .td.过{color:#8a8574}
  .tstrip .td.过 i{background:var(--green)}
  .tstrip .td.今{color:var(--green-d);font-weight:600}
  .tstrip .td.今 i{background:var(--gold);box-shadow:0 0 0 2px rgba(168,125,36,.22)}
  .tstrip .td.收{color:#c8c2b1}
  .tstrip .td.收 i{background:#cfc9b6}

  .step{font-size:12.5px;color:var(--dim);letter-spacing:.16em;margin-bottom:8px}
  .term{font-size:38px;line-height:1.2;font-weight:600;letter-spacing:.06em;color:var(--green-d);margin:0}
  .term small{display:block;font-size:12.5px;font-weight:400;letter-spacing:.2em;color:var(--dim);margin-top:6px}
  /* 决策屏的抬头收小一点 —— 手机上选项得尽早露出来 */
  .term.cmp{font-size:27px}
  .term.cmp small{display:inline;margin:0 0 0 12px;letter-spacing:.14em}
  .title{font-size:21px;font-weight:600;margin:18px 0 8px}
  .title.cmp{font-size:19px;margin:8px 0 7px}
  .brief{color:#5a5f4e;margin:0 0 18px}
  .brief.cmp{margin:0 0 14px;font-size:16px;line-height:1.75}
  .spacer{flex:1;min-height:16px}

  .field{background:#eef1e6;border-radius:10px;padding:13px 16px;margin:0 0 16px;
    font-size:15px;color:#4e5744;line-height:1.75}
  .field .wh{display:block;font-size:11.5px;letter-spacing:.18em;color:#7d8a6e;margin-bottom:3px}

  .say{background:var(--card);border-left:3px solid var(--clay);
    border-radius:0 10px 10px 0;padding:13px 16px;margin:0 0 16px}
  .say .who{font-size:12px;letter-spacing:.14em;color:var(--clay);display:block;margin-bottom:3px}
  .say p{margin:0}
  .say p+p{margin-top:8px}

  .event{background:var(--gold-l);border-left:3px solid var(--gold);
    border-radius:0 10px 10px 0;padding:13px 16px;margin-bottom:11px;
    opacity:0;transform:translateY(8px);animation:rise .45s ease-out forwards}
  .event .tag{font-size:11.5px;letter-spacing:.16em;color:var(--gold);display:block;margin-bottom:3px}
  .event p{margin:0}
  .event .from{display:block;margin-top:7px;font-size:12px;color:var(--clay);
    letter-spacing:.02em;border-top:1px dashed #ddd0b4;padding-top:6px}
  .event .from b{font-weight:600;color:#7a5c3c}
  .event .dl{display:block;margin-top:5px;font-size:13px;font-variant-numeric:tabular-nums}
  .event .dl.neg{color:var(--bad)} .event .dl.pos{color:var(--good)}
  .event.bad{border-left-color:var(--bad);background:#f9efea} .event.bad .tag{color:var(--bad)}
  .event.good{border-left-color:var(--good);background:#eef4ee} .event.good .tag{color:var(--good)}

  /* 年景是这一局的底牌 —— 抽到哪一档，一眼就得看出来。
     上上（金·扫光）/ 上（青）/ 中（素）/ 下（暗红）/ 下下（深红·扫光） */
  .yc{background:var(--green-d);color:#f0ede0;border-radius:12px;
    padding:16px 18px;margin:0 0 22px;position:relative;overflow:hidden;
    animation:flip .52s cubic-bezier(.2,.8,.3,1) both}
  .yc .tier{position:absolute;top:0;right:0;font-size:12px;letter-spacing:.2em;
    text-indent:.2em;padding:5px 13px;border-radius:0 12px 0 10px;
    background:rgba(255,255,255,.08);color:#b6c2b0}
  .yc .k{font-size:11.5px;letter-spacing:.24em;color:#9fb39a;display:block;margin-bottom:5px}
  .yc b{font-size:22px;font-weight:600;letter-spacing:.08em}
  .yc b.a{color:#e8c86a} .yc b.d{color:#e79a7e}
  .yc p{margin:7px 0 0;font-size:14.5px;color:#c9d3c4;line-height:1.7}

  .yc.SR{border:1px solid rgba(150,182,136,.5);
    box-shadow:0 8px 24px -12px rgba(0,0,0,.6)}
  .yc.SR .tier{background:rgba(150,182,136,.2);color:#d6e2cf}
  .yc.SSR{border:1px solid #c9a227;
    box-shadow:0 0 0 1px rgba(201,162,39,.25), 0 10px 30px -10px rgba(201,162,39,.55)}
  .yc.SSR .tier{background:linear-gradient(180deg,#e8c86a,#c9a227);color:#3a2c08;font-weight:600}
  .yc.xiong{border-color:rgba(200,84,58,.5);
    box-shadow:0 8px 24px -12px rgba(0,0,0,.6)}
  .yc.xiong .tier{background:rgba(200,84,58,.22);color:#f0c3b4}
  .yc.xiong.SSR{border-color:#c8543a;
    box-shadow:0 0 0 1px rgba(200,84,58,.28), 0 10px 30px -10px rgba(200,84,58,.6)}
  .yc.xiong.SSR .tier{background:linear-gradient(180deg,#e79a7e,#c8543a);color:#3a1008;font-weight:600}
  /* 上上和下下独有的那道扫光 —— 稀有的东西该有稀有的动静 */
  .yc.SSR::after{content:"";position:absolute;inset:0;border-radius:inherit;
    background:linear-gradient(105deg,transparent 38%,rgba(255,240,200,.32) 50%,transparent 62%);
    animation:sweep 1.15s .35s ease-out both}
  @keyframes sweep{from{transform:translateX(-135%)}to{transform:translateX(135%)}}
  @keyframes flip{0%{opacity:0;transform:translateY(16px) scale(1.045)}
                  100%{opacity:1;transform:none}}

  /* 翻牌那一屏：整张卡单独占一屏，抽完再进田 */
  .pull{display:flex;flex-direction:column;justify-content:center;flex:1;
    padding:8px 0 22px}
  .pull .lead2{text-align:center;font-size:12.5px;letter-spacing:.34em;
    text-indent:.34em;color:var(--dim);margin:0 0 18px}

  /* 晚上回宿舍 —— 白天那个没想明白的事儿，翻书翻出来了。
     术语全部锁在「书上说」这一层，后面必须跟一句人话。 */
  .note{background:#f6f3ea;border:1px solid #e2dbc6;border-radius:12px;
    padding:15px 17px;margin:16px 0 14px;
    opacity:0;transform:translateY(8px);animation:rise .5s .18s ease-out forwards}
  .note .k{font-size:11.5px;letter-spacing:.22em;color:var(--clay);
    display:block;margin-bottom:11px}
  .note .q{font-weight:600;color:#3f4636;margin:0 0 11px;font-size:15.5px;line-height:1.7}
  .note .s{font-size:13.5px;color:#7a7867;line-height:1.72;margin:0 0 11px;
    padding-left:12px;border-left:2px solid #ded7c2}
  .note .s b{display:block;font-size:10.5px;font-weight:600;letter-spacing:.18em;
    color:#a8a28e;margin-bottom:3px}
  .note .p{font-size:15.5px;color:#333a2c;margin:0;line-height:1.85}
  .note .p b{display:block;font-size:10.5px;font-weight:600;letter-spacing:.18em;
    color:var(--green);margin-bottom:3px}

  /* 编号变化才是反馈屏的主角 —— 大字、带色，不用去表里找 */
  .deltas{display:flex;gap:10px;margin:8px 0 20px}
  .deltas .dl-big{flex:1;border-radius:12px;padding:13px 8px;text-align:center;
    border:1px solid var(--line);background:var(--card);
    opacity:0;transform:translateY(10px) scale(.96);
    animation:pop .46s cubic-bezier(.2,.9,.3,1) forwards}
  .deltas .dl-big b{display:block;font-size:31px;font-weight:600;line-height:1.1;
    font-variant-numeric:tabular-nums}
  .deltas .dl-big span{font-size:11.5px;letter-spacing:.14em;color:var(--dim)}
  .deltas .dl-big.u{border-color:#bdd3bc;background:#f1f7f0}
  .deltas .dl-big.u b{color:var(--good)}
  .deltas .dl-big.d{border-color:#e5c5ba;background:#fbf1ed}
  .deltas .dl-big.d b{color:var(--bad)}
  @keyframes pop{to{opacity:1;transform:none}}

  .fb{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;margin-bottom:14px}
  .fb .k{font-size:11.5px;letter-spacing:.2em;color:var(--dim);display:block;margin-bottom:7px}
  .fb .row{display:flex;align-items:center;gap:9px;font-size:13.5px;margin-bottom:6px}
  .fb .row:last-child{margin-bottom:0}
  .fb .row .n{width:32px;flex:none;color:var(--dim)}
  .fb .row .a{color:#b0aa98;width:44px;text-align:right;font-variant-numeric:tabular-nums}
  .fb .row .ar{color:#c9c3b0;flex:none;font-size:11px}
  .fb .row .b{width:48px;font-weight:600;font-variant-numeric:tabular-nums}
  .fb .row .b.up{color:var(--good)} .fb .row .b.dn{color:var(--bad)}

  .btn{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);
    border:1px solid var(--line);border-radius:12px;padding:15px 17px;
    font:inherit;line-height:1.7;cursor:pointer;margin-bottom:9px;
    transition:border-color .15s,transform .1s,background .15s}
  .btn:hover{border-color:#bdb598;background:#fff}
  .btn:active{transform:scale(.986)}
  /* 点下去先亮一下再翻屏 —— 让"我选了"这个动作有落点 */
  .btn.pick{border-color:var(--green);background:#eef4ee;box-shadow:0 0 0 1px var(--green)}
  .btn .cost{display:block;font-size:12.5px;color:var(--dim);margin-top:6px;letter-spacing:.02em}
  .btn .cost i{font-style:normal;color:var(--clay)}
  .btn .cost i.hard{color:var(--bad)}

  .go{display:block;width:100%;background:var(--green);color:#fff;border:none;
    border-radius:12px;padding:15px;font:inherit;font-size:17px;letter-spacing:.14em;
    cursor:pointer;margin-top:4px}
  .go:active{transform:scale(.986)}
  .go.ghost{background:transparent;color:var(--green-d);border:1px solid var(--green);font-weight:600}
  .go.sm{padding:12px;font-size:15px;letter-spacing:.08em}

  .cover{flex:1;display:flex;flex-direction:column;justify-content:center;padding:14px 0 26px}
  .cover .name{font-size:50px;font-weight:600;letter-spacing:.2em;text-indent:.2em;
    color:var(--green-d);margin:0;text-align:center}
  .cover .sub{font-size:12.5px;letter-spacing:.3em;text-indent:.3em;color:var(--dim);
    margin:12px 0 30px;text-align:center}
  .cover .lead{color:#4e5343;margin:0 0 26px;font-size:16.5px}
  .cover .lead p{margin:0 0 14px}
  .cover .lead em{font-style:normal;color:var(--green-d);font-weight:600}

  /* 揭晓台 —— 四档四套排面。
     a 特级：金底 + 扫光 + 五颗星芒 + 砸字
     b 一级：银绿底 + 扫光 + 三颗星芒 + 砸字（稍轻）
     c 二级：青绿底 + 一颗星芒 + 淡入上浮
     d 等外：土黄底 + 淡入上浮　　　　—— 没种好也是种出来了，一样有台子站
     四档都有的一样东西：那句话（.praise）。先夸人，再讲米。 */
  .grade-wrap{position:relative;text-align:center;padding:26px 22px 22px;
    border-radius:14px;overflow:hidden;margin:4px 0 14px;
    box-shadow:inset 0 0 0 1px var(--line);animation:rise .6s ease-out both}
  .grade-wrap.a{background:linear-gradient(180deg,#fdf7e3,#f5e9c6);
    box-shadow:inset 0 0 0 1px #e3ce92, 0 14px 38px -16px rgba(168,125,36,.65)}
  .grade-wrap.b{background:linear-gradient(180deg,#f2f7ee,#e4efdf);
    box-shadow:inset 0 0 0 1px #b9d0b2, 0 12px 32px -18px rgba(74,110,68,.5)}
  .grade-wrap.c{background:linear-gradient(180deg,#f6f8f2,#eaf0e4);
    box-shadow:inset 0 0 0 1px #cfd9c4}
  .grade-wrap.d{background:linear-gradient(180deg,#faf6ec,#f2ead8);
    box-shadow:inset 0 0 0 1px #ddcfae}
  /* 扫光只给 a 和 b —— 到了这个成色，才配一道光擦过去 */
  .grade-wrap.a::after,.grade-wrap.b::after{content:"";position:absolute;inset:0;
    background:linear-gradient(105deg,transparent 34%,rgba(255,251,235,.8) 50%,transparent 66%);
    animation:sweep 1.05s .4s ease-out both}
  .grade-name{font-size:46px;font-weight:600;letter-spacing:.16em;text-indent:.16em;
    color:var(--green-d);animation:slam .6s cubic-bezier(.12,.9,.24,1) both}
  .grade-name.a{color:var(--gold);text-shadow:0 2px 20px rgba(232,200,106,.7)}
  .grade-name.b{color:#3f6b38;text-shadow:0 2px 16px rgba(120,164,110,.5)}
  .grade-name.c{font-size:40px;color:#5c7a52}
  .grade-name.d{font-size:36px;color:#8a7440;animation:rise .7s ease-out both}
  @keyframes slam{0%{opacity:0;transform:scale(1.65);letter-spacing:.62em;
    filter:blur(7px)}100%{opacity:1;transform:none;letter-spacing:.16em;filter:none}}
  .grade-tag{font-size:12.5px;letter-spacing:.24em;color:var(--dim);margin-top:6px;
    opacity:0;animation:rise .5s .42s ease-out forwards}
  /* 那句话 —— 每档都有。不教训人，只说这一季做成了什么 */
  .praise{margin:16px 0 0;font-size:15px;line-height:1.85;color:#4e5544;
    text-align:left;padding-top:14px;border-top:1px solid rgba(0,0,0,.07);
    opacity:0;animation:rise .6s .62s ease-out forwards}
  .grade-note{color:#5a5f4e;margin:22px 0 0}
  /* 星芒，颗数跟着档位走 */
  .spark{position:absolute;width:5px;height:5px;border-radius:50%;background:#f0d68a;
    box-shadow:0 0 10px 3px rgba(240,214,138,.95);opacity:0;
    animation:spark 1.5s ease-out forwards}
  .grade-wrap.b .spark{background:#cfe6c4;box-shadow:0 0 9px 3px rgba(190,222,176,.9)}
  @keyframes spark{0%{opacity:0;transform:scale(.2)}
    30%{opacity:1}100%{opacity:0;transform:translateY(-30px) scale(1)}}

  /* ── 成就弹牌 —— 种到一半蹦出来那一下，得有落到手上的分量 ── */
  .pop{position:fixed;left:50%;top:16px;transform:translate(-50%,-130%);
    width:min(420px,calc(100% - 32px));z-index:30;pointer-events:none;
    display:flex;gap:13px;align-items:center;
    padding:15px 18px;border-radius:14px;background:var(--card);
    box-shadow:0 16px 40px -14px rgba(0,0,0,.5),inset 0 0 0 1px var(--line);
    opacity:0;transition:transform .42s cubic-bezier(.16,.9,.3,1.05),opacity .3s}
  .pop.on{transform:translate(-50%,0);opacity:1;pointer-events:auto;cursor:pointer}
  .pop .lv{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;
    font-size:15px;font-weight:600;color:#fff;background:#b0a68e}
  .pop b{display:block;font-size:16.5px;font-weight:600;margin-bottom:2px}
  .pop p{margin:0;font-size:13px;color:var(--dim);line-height:1.5}
  .pop.铜{box-shadow:0 16px 40px -14px rgba(0,0,0,.45),inset 0 0 0 1px #d8cbb0}
  .pop.铜 .lv{background:linear-gradient(160deg,#c9b48a,#a08a5e)}
  .pop.银{box-shadow:0 16px 40px -14px rgba(0,0,0,.5),inset 0 0 0 1px #c3d0c0}
  .pop.银 .lv{background:linear-gradient(160deg,#b9c9be,#8ba394)}
  .pop.金{background:linear-gradient(180deg,#fffdf4,#fbf3d9);
    box-shadow:0 18px 46px -14px rgba(168,125,36,.7),inset 0 0 0 1px #e3ce92}
  .pop.金 .lv{background:linear-gradient(160deg,#e8c86a,#c39a2e);
    box-shadow:0 0 0 3px rgba(232,200,106,.32),0 0 18px 2px rgba(232,200,106,.6)}
  .pop.金 b{color:var(--gold)}

  .ledger{margin:4px 0 0}
  .ledger .li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;
    border-bottom:1px solid var(--line);font-size:15.5px;
    opacity:0;transform:translateY(6px);animation:rise .42s ease-out forwards}
  .ledger .li .k{color:#5a5f4e}
  .ledger .li .v{font-variant-numeric:tabular-nums;white-space:nowrap}
  .ledger .li.sub{padding-left:16px;font-size:14.5px;color:var(--dim)}
  .ledger .li.sub .k{color:var(--dim)}
  .ledger .li.sum{border-bottom:none;border-top:2px solid var(--ink);margin-top:4px;
    padding-top:12px;font-weight:600;font-size:17px}
  .ledger .li.big .v{font-size:26px;font-weight:600;color:var(--green-d)}
  .ledger .li .v.neg{color:var(--bad)}
  @keyframes rise{to{opacity:1;transform:translateY(0)}}

  /* ── 年终：季评 + 净收益 + 收入构成 ──
     这一屏是八个节气的收口，不能比验米那一屏还素。
     顺序是刻意的：先给一句人话（季评），再给数（净收益），
     最后给这个数的来路（构成条）—— 先被认可，再被说服。 */
  .yearend-wrap{position:relative;text-align:center;padding:26px 22px 22px;
    border-radius:14px;overflow:hidden;margin:6px 0 18px;
    box-shadow:inset 0 0 0 1px var(--line);animation:rise .6s ease-out both}
  .yearend-wrap.a{background:linear-gradient(180deg,#fdf7e3,#f5e9c6);
    box-shadow:inset 0 0 0 1px #e3ce92,0 14px 38px -16px rgba(168,125,36,.65)}
  .yearend-wrap.b{background:linear-gradient(180deg,#f2f7ee,#e4efdf);
    box-shadow:inset 0 0 0 1px #b9d0b2,0 12px 32px -18px rgba(74,110,68,.5)}
  .yearend-wrap.c{background:linear-gradient(180deg,#f6f8f2,#eaf0e4);
    box-shadow:inset 0 0 0 1px #cfd9c4}
  .yearend-wrap.d{background:linear-gradient(180deg,#faf6ec,#f2ead8);
    box-shadow:inset 0 0 0 1px #ddcfae}
  .yearend-wrap.a::after{content:"";position:absolute;inset:0;
    background:linear-gradient(105deg,transparent 34%,rgba(255,251,235,.8) 50%,transparent 66%);
    animation:sweep 1.05s .4s ease-out both}
  .yr-name{font-size:52px;font-weight:600;letter-spacing:.2em;text-indent:.2em;
    color:var(--green-d);animation:slam .62s cubic-bezier(.12,.9,.24,1) both}
  .yr-name.a{color:var(--gold);text-shadow:0 2px 20px rgba(232,200,106,.7)}

  { id:"抢",    级:"银", 名:"抢在雨前",    说:"秋淋那年，你没等 —— 提前开了镰", when:S=>S.年景.名==="秋淋"&&S.flags["早收"] },
  { id:"老周",  级:"银", 名:"老周点了头",  说:"净收益过两万，且验出一级以上",   when:(S,r)=>r&&r.净收益>=20000&&r.grade.min>=62 },

  /* ── 金 ── */
  { id:"满贡",  级:"金", 名:"满贡",        说:"特级，且净收益过两万二",         when:(S,r)=>r&&r.grade.名==="特级"&&r.净收益>=22000 },
  { id:"三头",  级:"金", 名:"三头并进",    说:"一产、二产、三产都挣到了钱",     when:(S,r)=>r&&r.一产>0&&r.二产>0&&r.三产>0 },
  { id:"逆天",  级:"金", 名:"逆天",        说:"抽到下下签（秋淋），还种出了特级", when:(S,r)=>r&&S.年景.名==="秋淋"&&r.grade.名==="特级" },
  { id:"全须",  级:"金", 名:"顺风顺水",    说:"八个节气走完，好回响比坏回响多三记", when:S=>S.termIndex>=8&&S.回响-S.负面>=3 },
  { id:"不认命",级:"金", 名:"不认命",      说:"生态 90 以上，还挣过两万",       when:(S,r)=>r&&S.stats.ecology>=90&&r.净收益>=20000 },
  { id:"空手",  级:"金", 名:"地不骗人",    说:"等外，而且三产一分钱没有",       when:(S,r)=>r&&r.grade.名==="等外"&&r.三产===0 },
  { id:"全勤",  级:"金", 名:"一页没落",    说:"八步全翻过资料，还拿了特级",     when:(S,r)=>r&&r.grade.名==="特级"&&Object.keys(S.查过).length>=8 },
];


/* ══════════════════════════ 8. 逻辑层（不碰 DOM） ══════════════════════════ */

const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
const clampStat = (k, n) => { const [lo,hi] = LIMITS[k]||[0,100]; return clamp(n,lo,hi); };

/* 一局的节气表 = 4 个必经 + 4 个随机抽，再按物候排序。
   谷雨(序1) 一定在最前、秋分(序11) 一定在最后 —— 这是物理必然，不参与抽签。
   抽中的 4 个从池子里出，所以每一局你要做的那 8 个决定，有 4 个是不一样的。 */
const 一局节气 = () => {
  const 锚 = DECISIONS.filter(d => d.锚);
  const 池 = DECISIONS.filter(d => !d.锚).slice();
  for (let i = 池.length - 1; i > 0; i--) {          // Fisher–Yates
    const j = Math.floor(Math.random() * (i + 1));
    [池[i], 池[j]] = [池[j], 池[i]];
  }
  return 锚.concat(池.slice(0, 8 - 锚.length)).sort((a, b) => a.序 - b.序);
};

/* 按权重抽年景 —— 平年最多，上上和下下都少见 */
function 抽年景() {
  const 总 = 年景池.reduce((a, y) => a + (y.重 || 1), 0);
  let r = Math.random() * 总;
  for (const y of 年景池) { r -= (y.重 || 1); if (r < 0) return y; }
  return 年景池[0];
}

function newSeason(固定) {
  const f = 固定 || {};
  const 节气 = f.节气 || 一局节气();
  const 年景 = f.年景 || 抽年景();
  /* 随机事件池：开局就把这一局会撞上哪几条定下来 */
  const 抽中 = 随机池.map(e => Math.random() < e.p);
  return {
    stats: { harvest: NUM.亩产基准, quality: NUM.品质基准, ecology: NUM.生态基准 },
    stamina: NUM.体力基准,
    cost: 0, flags: {}, fired: {}, log: [],
    codex: {}, ach: {}, 查过: {}, 本季成就: [],
    雇过: false, 回响: 0, 负面: 0,
    显数: {}, 待查: null,
    termIndex: 0, chainIndex: 0,
    节气, 年景, 抽中, 年景已发: false,
    grain: 0, soldGrain: 0, rate: 0, channel: "", third: "",
  };
}

function applyEffect(state, effect) {
  const d = {};
  for (const k in (effect || {})) {
    const before = state.stats[k];
    state.stats[k] = clampStat(k, state.stats[k] + effect[k]);
    d[k] = state.stats[k] - before;
  }
  return d;
}
const unlock = (state, k) => { if (k && !state.codex[k]) { state.codex[k] = true; return k; } return null; };

/* 某个生长阶段的最后一步是哪一步 —— 年景要等这一步做完才翻牌。
   为什么不是第一步？因为"对冲"这个动作就发生在同阶段的某一步上，
   提前翻了，玩家就没有补救的机会，那不叫难，叫不讲理。 */
function 阶段末位(state, 阶段) {
  let last = -1;
  state.节气.forEach((d, i) => { if (d.阶段 === 阶段) last = i; });
  return last;
}

function dueEvents(state, termIndex) {
  const out = [];
  const push = (line, mood, effect, from, codex, 查) => {
    if (codex) unlock(state, codex);
    const 前 = { ...state.stats };
    const delta = applyEffect(state, effect);
    const item = { line, mood, delta, from: from || null, 查: 查 || null,
                   前, 后: { ...state.stats } };
    if (mood === "bad") state.负面++; else if (mood === "good") state.回响++;
    out.push(item); state.log.push(item);
  };
  const here = state.节气[termIndex];
  const 名 = here ? here.term : "收尾";
  const 段 = here ? here.阶段 : "收尾";

  /* 一个阶段可能摊到好几个节气（苗期最多能有三个）。
     抽中的意外要摊开落，不能全砸在第一个节气上 —— 那是刷屏，不是节奏。 */
  const 同位 = state.节气.map((d, i) => (d.阶段 === 段 ? i : -1)).filter(i => i >= 0);
  const 槽 = 同位.indexOf(termIndex);
  const 轮到 = ev => {
    if (同位.length <= 1) return true;
    const 同阶 = 随机池.filter(e => e.at === 段);
    return 同阶.indexOf(ev) % 同位.length === 槽;
  };

  /* ① 年景 —— 这一局的底牌，到它那个阶段的最后一步才翻。
       你要是提前做了对冲的活儿，这一下就砸不实。 */
  const Y = state.年景;
  if (Y && Y.hit && !state.年景已发 && 阶段末位(state, Y.hit) === termIndex) {
    state.年景已发 = true;
    const 挡住 = Y.对冲 && state.flags[Y.对冲];
    push(挡住 && Y.对冲线 ? Y.对冲线 : Y.line,
         Y.色 === "a" ? "good" : "bad",
         挡住 ? (Y.对冲后 || Y.effect) : Y.effect,
         ["年景", Y.名], null, 查资料["年景-" + Y.名]);
  }

  /* ② 你埋的因 —— 到点结果。at 可以是节气名，也可以是阶段名 */
  EVENTS.forEach((ev, i) => {
    if (state.fired[i] || (ev.at !== 名 && ev.at !== 段) || !ev.when(state)) return;
    state.fired[i] = true;
    push(ev.line, ev.mood, ev.effect, ev.from, ev.codex, ev.查);
  });

  /* ③ 这一局抽中的意外 —— 同一件事，种法不同挨的程度不同 */
  随机池.forEach((ev, i) => {
    if (!state.抽中[i] || state.fired["r" + i] || ev.at !== 段) return;
    if (ev.需 && !ev.需(state)) return;
    if (!轮到(ev)) return;
    state.fired["r" + i] = true;
    const 挡住 = ev.对冲 && state.flags[ev.对冲];
    push(挡住 && ev.对冲线 ? ev.对冲线 : ev.line, ev.mood,
         挡住 ? (ev.对冲后 || ev.effect) : ev.effect, null, null, ev.查);
  });

  return out;
}

function choose(state, decisionIndex, optionIndex) {
  const d = state.节气[decisionIndex];
  const o = d.options[optionIndex];
  const 前 = { ...state.stats }, 体力前 = state.stamina;
  const 缺口 = Math.max(0, o.stam - state.stamina);
  state.stamina = Math.max(0, state.stamina - o.stam);
  const 雇工费 = 缺口 * NUM.雇工价;
  if (雇工费 > 0) state.雇过 = true;
  state.cost += o.cost + 雇工费;
  const delta = applyEffect(state, o.effect);
  (o.flags || []).forEach(f => { state.flags[f] = true; });
  const 新图鉴 = unlock(state, o.codex);
  /* 晚上回宿舍 —— 这个决定到底对不对，你翻了资料才知道。
     翻不翻由你定：看了才记进 查过，"一季没翻过书"那块牌子才算数。 */
  const 查 = 查资料[`${d.term}-${optionIndex}`] || null;
  return { text: o.result, note: o.note || null, delta, 查, 节气名: d.term,
           前, 后: { ...state.stats }, 体力前, 体力: state.stamina, 花销: o.cost,
           雇工费, 缺口, 新图鉴 };
}

function gradeOf(quality) {
  let g = 等级表[0]; 等级表.forEach(x => { if (quality >= x.min) g = x; }); return g;
}

/* 田的样子 —— 把干瘪的数字翻译成"你现在看到什么" */
function 田的样子(S) {
  const { ecology: e, quality: q, harvest: h } = S.stats, out = [];
  if (e >= 85) out.push("田水清，看得见螺蛳贴着泥走。天一黑，蛙声一大片。");
  else if (e >= 70) out.push("田埂上能碰见青蛙，水里也有小虫在游。");
  else if (e >= 50) out.push("田里不算脏，可也没什么活物。土踩上去是实的。");
  else if (e >= 32) out.push("土有点板。蹲下去翻，蚯蚓少见。");
  else out.push("水发浑，田埂边积着一层白膜。田里静得吓人，一声虫叫都没有。");

  if (q >= 78) out.push("叶片挺，颜色正，秆子捏着硬。");
  else if (q >= 62) out.push("长势中规中矩，看不出什么毛病。");
  else if (q >= 45) out.push("叶色偏深，有点贪青 —— 剑叶还黑绿着不褪。");
  else out.push("叶子黑绿得发亮，秆子捏着发软，基部节间拉得老长 —— 长得太猛了。");

  if (h >= 1100) out.push("稻子密，人走进去要拨开。");
  else if (h <= 600) out.push("田里稀，风一吹能看见地皮。");
  return out.join("");
}

function 验米(state) {
  const g = gradeOf(state.stats.quality);
  let 眼力;
  if (g.名 === "特级") 眼力 = "抓一把摊在手心，米粒匀、透亮，没白肚。他捏了几粒放进嘴里嚼，点了点头，没说话。";
  else if (g.名 === "一级") 眼力 = "摊开看了看，米是好米，就是有几粒不太匀。他说：够得上一级。";
  else if (g.名 === "二级") 眼力 = "捏起来搓了搓，穗上带下来的青粒不少。他皱了皱眉：按二级走吧。";
  else 眼力 = "他抓了一把，看了看就放下了：这米，按商品粮收吧，进不了等级。";
  return { grade: g, 眼力 };
}

function 年终(state) {
  const g = gradeOf(state.stats.quality), 米价 = g.价;
  const 谷价 = Math.round(米价 * NUM.原粮折扣 * NUM.出米率_代碾 * 10) / 10;
  const 已卖谷 = state.soldGrain, 留谷 = state.grain - 已卖谷;
  const 米 = Math.round(留谷 * state.rate);
  const 一产 = Math.round(已卖谷 * 谷价);

  /* 认养的人要兑米 —— 那部分米不能再卖一遍 */
  let 兑米 = 0, 份 = 0, 人 = 0, 三产 = 0, 三产说明 = "田闲着，一分钱没挣";
  const 生态够 = state.stats.ecology >= NUM.三产门槛;
  if (state.third !== "无" && 生态够) {
    const 系数 = clamp((state.stats.ecology - NUM.三产门槛) / 30, 0.5, 1.25);
    if (state.third === "认养") {
      份 = Math.round(NUM.认养份数 * 系数);
      份 = Math.min(份, Math.floor(米 / NUM.认养兑米));   // 你手里得真有这些米才兑得出
      兑米 = 份 * NUM.认养兑米;
      三产 = Math.round(份 * NUM.认养单价);
      三产说明 = `${份} 份被认养，兑出去 ${兑米} 斤米`;
    } else {
      人 = Math.round(NUM.研学人数 * 系数);
      三产 = Math.round(人 * NUM.研学单价);
      三产说明 = `${人} 人次来研学`;
    }
  } else if (state.third !== "无") 三产说明 = "生态没养起来，没人愿意来";

  const 可售米 = Math.max(0, 米 - 兑米);
  const cap = g.礼盒;
  let 礼盒量 = 0, 加工量 = 0;
  if (state.channel === "礼盒") { 礼盒量 = Math.min(可售米, cap); 加工量 = 可售米 - 礼盒量; }
  else if (state.channel === "深加工") { 加工量 = 可售米; }
  else { 礼盒量 = Math.min(可售米, cap); 加工量 = 可售米 - 礼盒量; }
  const 二产 = Math.round(礼盒量 * 米价 * NUM.礼盒溢价 + 加工量 * NUM.深加工价);

  const 毛收入 = 一产 + 二产 + 三产 + NUM.粮补;
  return { grade: g, 米价, 谷价, 米, 已卖谷, 留谷, 兑米, 可售米,
           一产, 二产, 三产, 三产说明, 礼盒量, 加工量,
           毛收入, 补贴: NUM.粮补, 成本: state.cost, 净收益: 毛收入 - state.cost };
}

/* ── 成就 ──
   两件事跟以前不一样：
   ① 中途就发牌，不是憋到年终一起倒给你。种到一半蹦出一块金牌，
      这一局才有"再往下走一步看看"的劲儿。
   ② 发牌本身是个动作 —— 有牌子、有响、有档位。拿金牌那一下，
      跟拿铜牌不是同一种感觉。
   收尾时 r 传进来，那些要看账本的成就才判得出来。 */
function 结成就(S, r) {
  const got = [];
  ACH.forEach(a => { if (!S.ach[a.id] && a.when(S, r)) { S.ach[a.id] = true; S.本季成就.push(a); got.push(a); } });
  return got;
}

/* 发牌队列 —— 一次结算可能同时中好几块，排队一块一块弹 */
let 成就队 = [], 牌计时 = null;
function 发牌(ach) { ach.forEach(a => 成就队.push(a)); 弹牌(); }
function 弹牌() {
  const el = document.getElementById("pop");
  if (!el) return;
  const a = 成就队[0];
  clearTimeout(牌计时);
  if (!a) { el.className = "pop"; el.innerHTML = ""; return; }
  el.className = "pop on " + (a.级 || "铜");
  el.innerHTML = `<span class="lv">${a.级 || "铜"}</span>
    <div><b>${esc(a.名)}</b><p>${esc(a.说)}</p></div>`;
  响(a.级 === "金" ? "金" : a.级 === "银" ? "好" : "tap");
  牌计时 = setTimeout(收牌, a.级 === "金" ? 4000 : 3000);
}
function 收牌() { 成就队.shift(); 弹牌(); }
window.onPop = function () { if (成就队.length) 收牌(); else { 成就队 = []; 弹牌(); } };

/* 中途也会发牌：每次选完、每次回响落地，都重新扫一遍 */
function 扫成就(r) { const got = 结成就(S, r); if (got.length) 发牌(got); return got; }


/* ══════════════════════════ 9. 渲染层 ══════════════════════════ */

const app = document.getElementById('app');
const LABEL = { harvest: "产量", quality: "品质", ecology: "生态" };
const UNIT  = { harvest: "斤", quality: "分", ecology: "分" };

let S = newSeason();
let screen = "cover", pendingEvents = [], lastResult = null, flash = {},
    miban = null, result = null, newAch = [], toastTimer = null, tab = "田";

function reset() {
  S = newSeason(); screen = "cover"; pendingEvents = []; lastResult = null;
  flash = {}; miban = null; result = null; newAch = [];
}
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
/* 白天动手，晚上翻书 —— 这一块是"农大实习生"这个身份真正落地的地方 */
const 查块 = c => !c ? "" : `<div class="note">
  <span class="k">晚 上 回 宿 舍 · 翻 资 料</span>
  <p class="q">${esc(c.问)}</p>
  <p class="s"><b>书 上 说</b>${esc(c.书)}</p>
  <p class="p"><b>说 白 了</b>${esc(c.白)}</p></div>`;
const yuan = n => Number(n).toLocaleString("zh-CN");
const para = s => String(s).split("\n").map(l => `<p>${esc(l)}</p>`).join("");

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), 2300);
}

/* ── 声音（WebAudio 现场合成，不引任何文件） ──
   一个单文件原型不该为几声动静多背几百 KB。 */
let 声 = null, 开声 = true;
function 音(频, 起, 长, 型, 量) {
  const o = 声.createOscillator(), g = 声.createGain();
  const t = 声.currentTime + 起;
  o.type = 型; o.frequency.value = 频;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(量, t + .012);
  g.gain.exponentialRampToValueAtTime(.0001, t + 长);
  o.connect(g); g.connect(声.destination);
  o.start(t); o.stop(t + 长 + .03);
}
function 响(k) {
  if (!开声) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!声) 声 = new AC();
    if (声.state === "suspended") 声.resume();
    (音效[k] || 音效.tap)();
  } catch (e) { /* 静音就静音，不能把游戏搞崩 */ }
}
const 音效 = {
  tap:  () => 音(620, 0, .07, "triangle", .08),
  好:   () => { 音(587, 0, .13, "sine", .11); 音(880, .085, .20, "sine", .10); },
  坏:   () => { 音(392, 0, .15, "sine", .11); 音(262, .10, .26, "sine", .11); },
  钱:   () => { 音(1046, 0, .09, "square", .06); 音(1318, .07, .18, "square", .05); },
  翻:   () => 音(440, 0, .06, "triangle", .05),
  抽:   () => { for (let i = 0; i < 7; i++) 音(240 + i * 46, i * .035, .18, "triangle", .045); },
  /* 上上 / 下下 独有的三个音 —— 稀有的东西该有稀有的动静 */
  金:   () => [523, 659, 784, 1047].forEach((f, i) => 音(f, i * .085, .55, "triangle", .10)),
  凶:   () => [330, 262, 196, 165].forEach((f, i) => 音(f, i * .10, .55, "sawtooth", .06)),
};

/* ── 进度表：八个格子，走过的沉下去，眼下的点着 ── */
function 节气条() {
  if (screen === "cover") return "";
  const 全收 = screen === "miban" || screen === "chain" || screen === "yearend"
            || S.termIndex >= S.节气.length;
  const cells = S.节气.map((d, i) => {
    const cls = 全收 || i < S.termIndex ? "过" : i === S.termIndex ? "今" : "";
    return `<div class="td ${cls}"><i></i><span>${d.term}</span></div>`;
  }).join("");
  return `<div class="tstrip">${cells}</div>`;
}

function hud(withField) {
  const cells = ["harvest","quality","ecology"].map(k => {
    const v = S.stats[k], f = flash[k];
    const cls = f > 0 ? "up" : f < 0 ? "dn" : (v <= 25 ? "low" : "");
    /* 把上一次显示的数写进 DOM —— 渲染完再滚过去，数字才是"变"出来的 */
    const 从 = S.显数[k], 滚 = (f && 从 !== undefined && 从 !== v) ? ` data-from="${从}"` : "";
    S.显数[k] = v;
    return `<div class="c ${cls}"><b${滚}>${v}</b>${LABEL[k]}</div>`;
  }).join("");
  return `<div class="head"><div class="hud">${cells}
    <div class="c s ${S.stamina <= 15 ? "low" : ""}"><b>${S.stamina}</b>体力</div>
    <div class="c m"><b>${S.cost ? "-" + yuan(S.cost) : "0"}</b>已投入</div>
    <div class="c snd ${开声 ? "" : "off"}" onclick="onSound()">${开声 ? "♪" : "×"}</div>
  </div>${节气条()}</div>${withField ? `<div class="field"><span class="wh">田 里 的 样 子</span>${esc(田的样子(S))}</div>` : ""}`;
}

/* 渲染之后的动作：数字滚过去、条形长出来 —— 都是"变"给人看的 */
function 起动画() {
  if (!app.querySelectorAll) return;
  /* 数字滚动：从上一个值爬到新值，爬的过程本身就是一个反馈 */
  app.querySelectorAll("[data-from]").forEach(el => {
    const 从 = +el.dataset.from, 到 = +el.textContent;
    delete el.dataset.from;
    if (从 === 到 || !isFinite(从) || !isFinite(到)) return;
    const t0 = performance.now(), 时长 = 430;
    const 走 = t => {
      const p = Math.min(1, (t - t0) / 时长);
      el.textContent = Math.round(从 + (到 - 从) * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(走); else el.textContent = 到;
    };
    requestAnimationFrame(走);
  });
  /* 验米那三条：一条一条长出来，比一起蹦出来有看头 */
  app.querySelectorAll("[data-w]").forEach((el, i) => {
    const 宽 = el.dataset.w;
    setTimeout(() => {
      el.style.transition = "width .85s cubic-bezier(.2,.8,.3,1)";
      el.style.width = 宽;
    }, 150 + i * 130);
  });
  /* 净收益：从 0 爬到那个数。爬的过程就是"这一季攒出来了"的过程 */
  app.querySelectorAll("[data-count]").forEach(el => {
    const 到 = +el.dataset.count;
    delete el.dataset.count;
    if (!isFinite(到)) return;
    const 负 = 到 < 0, t0 = performance.now(), 时长 = 1150;
    const 走 = t => {
      const p = Math.min(1, (t - t0) / 时长);
      const v = Math.round(到 * (1 - Math.pow(1 - p, 3)));
      el.textContent = (负 && v !== 0 ? "−" : "") + Math.abs(v).toLocaleString("zh-CN");
      if (p < 1) requestAnimationFrame(走);
      else el.textContent = (负 ? "−" : "") + Math.abs(到).toLocaleString("zh-CN");
    };
    setTimeout(() => requestAnimationFrame(走), 320);
  });
  /* 收入构成那条横条：整体从左往右擦出来，不逐段长 —— 逐段会长得参差不齐 */
  app.querySelectorAll("[data-wipe]").forEach(el => {
    setTimeout(() => el.classList.add("go"), 260);
  });
}

function deltaText(d) {
  return Object.keys(d).filter(k => d[k])
    .map(k => `${LABEL[k]} ${d[k] > 0 ? "+" : ""}${d[k]}${UNIT[k]}`).join("　");
}

/* 年景卡 —— 开局那一屏和每局的决策屏都用它，保证抽到什么都长一个样 */

}

/* ── 事件屏 ── */
function viewEvent() {
  const blocks = pendingEvents.map((e, n) => {
    const dt = deltaText(e.delta);
    const 负 = Object.keys(e.delta).some(k => e.delta[k] < 0);
    const 标 = e.from && e.from[0] === "年景" ? `今 年 的 天 · ${S.年景.签 || ""}`
      : e.mood === "good" ? "有 回 响" : "出 事 了";
    return `<div class="event ${e.mood}" style="animation-delay:${n*.1}s">
      <span class="tag">${标}</span>
      <p>${esc(e.line)}</p>
      ${dt ? `<span class="dl ${负?"neg":"pos"}">${dt}</span>` : ""}
      ${e.from ? `<span class="from">这笔账来自 <b>${e.from.join(" ")}</b></span>` : ""}
    </div>${查块(e.查)}`;
  }).join("");
  const d = S.节气[Math.min(S.termIndex, S.节气.length - 1)];
  return `${hud()} <div class="step">第 ${S.termIndex + 1} / ${S.节气.length} 个节气</div>

/* ── 决策屏 ── */
function viewDecision() {
  const d = S.节气[S.termIndex];
  const buttons = d.options.map((o, i) => {
    const 缺口 = Math.max(0, o.stam - S.stamina);
    const 钱 = o.cost + 缺口 * NUM.雇工价;
    const bits = [`${o.stam} 点体力`];
    if (缺口 > 0) bits.push(`自己干不完，雇 ${缺口} 个人工 <i class="hard">+${yuan(缺口*NUM.雇工价)} 元</i>`);
    if (o.cost > 0) bits.push(`花 <i>${yuan(o.cost)} 元</i>`);
    return `<button class="btn" onclick="onChoose(${i})">
      ${esc(o.text)}<span class="cost">${bits.join("　·　")}</span></button>`;
  }).join("");

  return `${hud(true)}
    <div class="step">第 ${S.termIndex + 1} / ${S.节气.length} 个节气</div>

/* ── 反馈屏 ──
   一屏只说一件事：这一手把三个数变成了什么样。
   老表格式的三行"前→后"删了 —— 顶上那条随时在显示当前值，重复一遍就是噪音。
   查资料挪去它自己那屏（见 viewNote）—— 白天动手、晚上翻书，本来就是两件事。 */
function viewResult() {
  const d = S.节气[S.termIndex], R = lastResult;

/* ── 验米 ── */
/* ── 验米揭晓 ──
   这是全季攒了八个节气之后第一次听见响。
   每一档都得有排面 —— 特级是特级那一种，等外是等外那一种，
   但都得是"你种出来的"这件事被正正经经地摆上台面。
   档位（气）不同，舞台不同：金光、银绿、青绿、土黄。
   不变的只有一件事 —— 先夸人，再讲米。 */
function viewMiban() {
  const g = miban.grade, 气 = g.气 || "c";
  /* 星芒数量跟档位走：特级五颗，一级三颗，二级一颗，等外没有 */
  const 星数 = { a: 5, b: 3, c: 1, d: 0 }[气];
  const 位置 = [[22,26],[74,20],[48,14],[30,64],[68,58]];
  const 星 = 位置.slice(0, 星数)
    .map(([x,y],i) => `<span class="spark" style="left:${x}%;top:${y}%;animation-delay:${.45+i*.14}s"></span>`).join("");
  const 牌 = { a: "够 得 上 贡 米", b: "地 头 现 碾 鲜 米", c: "收 粮 等 级", d: "这 一 季 的 米" }[气];
  /* 条形不用 transition，交给渲染后的 起动画() 一条一条长出来 */
  const bar = (k, v) => {
    const pct = k === "harvest" ? clamp((v-400)/8, 0, 100) : clamp(v, 0, 100);
    return `<div style="display:flex;align-items:center;gap:10px;font-size:13px;color:var(--dim);margin-bottom:7px">

  };

    <p class="grade-note" style="color:var(--dim)">这个等级决定了你的米按什么价走 —— ${yuan(g.价)} 元一斤。${esc(g.口感)}。</p>
    <div class="field" style="margin-top:18px"><span class="wh">这 一 季 的 田</span>${esc(田的样子(S))}</div>
    ${S.log.length ? `<h3 class="title" style="font-size:17px">地里的账</h3>
      ${S.log.map(e => `<p class="note-line">${esc(e.line)}</p>`).join("")}` : ""}
    <div class="spacer"></div>

/* ── 年终账本 ── */
/* ── 年终 ──
   全季的收口。八个节气的因，到这里合成一个数。
   一个数是不够的 —— 得让人看清楚这个数是怎么来的（收入构成），
   得有人对着一季说一句话（季评），也得把这一季攒下的牌子摆出来（成就）。
   排场是给"你真种了一季"这件事的，不是给分数的 —— 所以每一档都有话说。 */
const 季评 = [
  { 名:"下下", min:-1e9, 气:"d",
    说:"往里贴了钱。镇属那家三十来号人的公司，年年也都在往里贴 —— 京西稻就是这么留下来的，你这一亩今年也算了一份。" },
  { 名:"下",   min:3000, 气:"d",
    说:"贴进去一些，不多。一亩稻头一年种，这本账本来就难平 —— 不是你的问题，是这行当的问题。" },
  { 名:"中",   min:12000, 气:"c",
    说:"收支打平，还余了一点。一亩地头一年能不往里掏钱，这就算站住了。" },
  { 名:"上",   min:17500, 气:"b",
    说:"账是正的，还宽裕。这一亩地今年自己养活了自己，还余出钱来 —— 在海淀，这件事已经不常听见了。" },
  { 名:"上上", min:22000, 气:"a",
    说:"一亩地挣出了镇上一个人小半年的工钱。京西稻到今天还能留在地里，靠的就是这个数。" },
];
const 评等级 = v => { let g = 季评[0]; 季评.forEach(x => { if (v >= x.min) g = x; }); return g; };

/* ── 今年最赚的一手、最坑的一手 ──
   "哪一步出了问题"这种话，游戏自己算得出来 —— 日志里每一步的因果都在，
   那就直接点名，别让玩家去悟。这一块也是全季唯一一次把因果链摊开讲。 */
function 关键两手(S) {
  const 分 = e => Object.keys(e.delta)
    .reduce((a, k) => a + (k === "harvest" ? e.delta[k] * 0.12 : e.delta[k] * 1.6), 0);
  const 有 = S.log.filter(e => e.from && e.from.length);
  if (有.length < 2) return null;
  const 排 = 有.slice().sort((a, b) => 分(a) - 分(b));
  const 坑 = 排[0], 赚 = 排[排.length - 1];
  const 因 = e => e.from.filter(x => x !== "＋").join("　→　");
  return { 坑: 分(坑) < -1.2 ? { 因: 因(坑), e: 坑 } : null,
           赚: 分(赚) > 1.2 ? { 因: 因(赚), e: 赚 } : null };
}

function viewYearEnd() {
  const r = result, 评 = 评等级(r.净收益), 两手 = 关键两手(S);

  /* 收入构成 —— 一二三产不是三个词，是一条能看出来的比例。
     这条横条是整个结算里最该被看见的东西：钱是从哪条路上来的。 */
  const 源 = [
    { 名:"一产 · 卖原粮", v:r.一产, 色:"var(--green)" },
    { 名:"二产 · 礼盒",   v:r.二产, 色:"var(--gold)" },
    { 名:"三产 · " + r.三产说明.split("，")[0], v:r.三产, 色:"var(--clay)" },
    { 名:"政策 · 粮补",   v:r.补贴, 色:"#a8a294" },
  ].filter(x => x.v > 0);
  const 总 = 源.reduce((a, x) => a + x.v, 0) || 1;
  const 条 = 源.map(x => `<span style="width:${(x.v/总*100).toFixed(1)}%;background:${x.色}"></span>`).join("");
  const 图例 = 源.map(x => `<div class="mix-li">
      <span class="dot" style="background:${x.色}"></span>
      <span class="nm">${esc(x.名)}</span>
      <span class="pc">${(x.v/总*100).toFixed(0)}%</span>

  const li = (k, v) => `<div class="li"><span class="k">${k}</span><span class="v">${v}</span></div>`;

  /* 成就 —— 按档位从高到低排，金牌先上场 */

  const 牌 = newAch.slice().sort((a,b) => 序[a.级] - 序[b.级]);

    ${牌.map((a,i) => `<div class="ach ${a.级}" style="animation-delay:${i*.07}s">
      <span class="d">${a.级}</span><div><b>${esc(a.名)}</b><span>${esc(a.说)}</span></div></div>`).join("")}`
    : `<h3 class="title" style="font-size:17px">这一季，没有牌子</h3>
       <p class="grade-note" style="margin-top:0">走了一条没人走过的路 —— 下一季换个走法试试。</p>`;

  return `<div style="margin:0 0 16px">${节气条()}</div>
    <div class="step">年终 · 账本</div>
    <h2 class="term" style="font-size:30px">一季的账<small>一 亩 地</small></h2>

    <div class="yearend-wrap ${评.气}">
      <div class="yr-name ${评.气}">${评.名}</div>
      <div class="yr-tag">这 一 季 的 收 成</div>
      <p class="praise">${esc(评.说)}</p>
    </div>

    <div class="netbig ${r.净收益 >= 0 ? "u" : "d"}">
      <span class="k">净 收 益</span>
      <b data-count="${r.净收益}">0</b><i>元</i>
      <span class="sub">毛收入 ${yuan(r.毛收入)} 元　－　本季投入 ${yuan(r.成本)} 元</span>
    </div>

    <h3 class="title" style="font-size:17px">钱是从哪条路上来的</h3>
    <div class="mixbar" data-wipe>${条}</div>
    <div class="mix">${图例}</div>

    ${两手 ? `<h3 class="title" style="font-size:17px">这一季的两个转折</h3>
      <div class="keymoves">
        ${两手.赚 ? `<div class="km u"><span class="tag">最赚的一手</span>
          <b>${esc(两手.赚.因)}</b><p>${esc(两手.赚.e.line)}</p></div>` : ""}
        ${两手.坑 ? `<div class="km d"><span class="tag">最亏的一手</span>
          <b>${esc(两手.坑.因)}</b><p>${esc(两手.坑.e.line)}</p></div>` : ""}
      </div>` : ""}

    <h3 class="title" style="font-size:17px">底账</h3>
    <div class="ledger">
      ${li("打下来的稻谷", yuan(S.grain) + " 斤")}
      ${li("验米等级", r.grade.名 + "（" + yuan(r.米价) + " 元/斤）")}
      ${li("折成米", yuan(r.米) + " 斤" + (r.兑米 ? "（认养兑走 " + r.兑米 + " 斤）" : ""))}
      ${li("二产 · 礼盒 " + yuan(r.礼盒量) + " 斤 / 深加工 " + yuan(r.加工量) + " 斤", yuan(r.二产) + " 元")}
      ${li("三产 · " + r.三产说明, yuan(r.三产) + " 元")}
    </div>
    ${ach}
    ${回学校(S, r)}
    <div class="spacer"></div>
    <button class="go ghost" onclick="restart()">再 种 一 季</button>
    <p class="foot">换个走法，账就不是这个数</p>`;
}

/* ── 回学校 ──
   你是农大派来实习的学生，一季种完得有个交代。
   带队老师看的是表，老周看的是别的 —— 这一局收在这里。 */
function 回学校(S, r) {
  const 级 = r.grade.名;
  /* 老师这一条按"你留下了什么"分岔，不按分数高低训人 ——
     第一季就下地八个节气，本来就没什么可训的。 */
  const 王 = 级 === "特级"
    ? { t: "「这块地能这么种。」带队老师把表推回来，\n「你把过程写下来，下次组会讲一次。」" }
    : 级 === "一级"
    ? { t: "「一级，可以了。」带队老师说，\n「我以为你们下去就是拍拍照 —— 看来不是。」" }
    : r.净收益 >= 15000
    ? { t: "「账算得不错。」带队老师翻了两页，\n「可我更想知道，你那一亩地明年还能不能这么种。」" }
    : r.三产 > 0
    ? { t: "「你把米卖出去这一手，比米本身有意思。」带队老师说，\n「镇上的公司愁的就是这个。你接着说。」" }
    : { t: "「第一季，正常。」带队老师把表合上，\n「明年下去，把每天干了什么都记上 —— 这个比最后那个数有用。」" };

  const 留 = S.stats.ecology >= 65 || r.三产 > 0;
  const 周 = 留
    ? { t: "老周蹲在田埂上，把最后一捆稻把子码齐。\n「这一亩地，明年还归你。」他说，\n「你要是还来。」" }
    : { t: "老周把锹往肩上一扛，走了两步，回头说：\n「头一年能收回一仓，不赖了。\n我头一年种的，还没你这个数。」" };

  return `<h3 class="title" style="font-size:17px">收完了，回学校</h3>
    <div class="say"><span class="who">带队老师 · 组会前</span><p style="white-space:pre-line">${esc(王.t)}</p></div>
    <div class="say"><span class="who">老周 · 田埂上</span><p style="white-space:pre-line">${esc(周.t)}</p></div>`;
}

/* ── 图鉴 / 成就 ── */
const 分类 = ["田里的", "手上的", "肥", "水", "虫", "收", "药", "灾"];
function viewBook() {
  const keys = Object.keys(CODEX);
  const got = keys.filter(k => S.codex[k]).length;
  const groups = 分类.filter(c => keys.some(k => CODEX[k][0] === c));
  let body;
  if (tab === "成就") {
    /* 按档位分组，每组标出 x/y —— 差一块金牌没拿到，比"成就 7/24"勾人 */
    body = ["金","银","铜"].map(级 => {
      const 组 = ACH.filter(a => (a.级 || "铜") === 级);
      if (!组.length) return "";
      const 得 = 组.filter(a => S.ach[a.id]).length;
      return `<h3 class="title" style="font-size:15px;letter-spacing:.14em;margin:20px 0 6px">
          <span class="lvdot ${级}"></span>${级}牌 · ${得}/${组.length}</h3>`
        + 组.map(a => {
          const has = S.ach[a.id];
          return `<div class="cx ${has?"":"lock"}"><div class="h">
            <b>${has ? esc(a.名) : "？ ？ ？"}</b></div>
            <p>${has ? esc(a.说) : "还没拿到"}</p></div>`;
        }).join("");
    }).join("");
  } else if (tab === "全部") {
    body = keys.map(k => {
      const has = S.codex[k], [cat, txt] = CODEX[k];
      return has
        ? `<div class="cx"><div class="h"><b>${k}</b><span class="cat">${cat}</span></div><p>${txt}</p></div>`
        : `<div class="cx lock"><div class="h"><b>？ ？ ？</b><span class="cat">${cat}</span></div><p>还没见过</p></div>`;
    }).join("");
  } else {
    body = 分类.filter(c => c !== "肥" || tab === "肥").map(c => {
      const inC = keys.filter(k => CODEX[k][0] === c);
      if (!inC.length) return "";
      return `<h3 class="title" style="font-size:15px;color:var(--dim);letter-spacing:.14em;margin:20px 0 4px">${c}</h3>`
        + inC.map(k => {
          const has = S.codex[k];
          return `<div class="cx ${has?"":"lock"}"><div class="h"><b>${has ? k : "？ ？ ？"}</b></div><p>${has ? CODEX[k][1] : "还没见过"}</p></div>`;
        }).join("");
    }).join("");
  }
  const 成就数 = ACH.filter(a => S.ach[a.id]).length;
  return `<div class="step">这一季记住的东西</div>
    <div class="tabs">
      <button class="${tab==="田"?"on":""}" onclick="setTab('田')">田里的</button>
      <button class="${tab==="手上的"?"on":""}" onclick="setTab('手上的')">手上的</button>
      <button class="${tab==="全部"?"on":""}" onclick="setTab('全部')">全部 ${got}/${keys.length}</button>
      <button class="${tab==="成就"?"on":""}" onclick="setTab('成就')">成就 ${成就数}/${ACH.length}</button>
    </div>${body}<div class="spacer"></div>
    <button class="go sm ghost" onclick="backToGame()">回 到 田 里</button>`;
}

function render() {
  app.innerHTML =
    screen === "cover"    ? viewCover()    :
    screen === "pull"     ? viewPull()     :
    screen === "event"    ? viewEvent()    :
    screen === "decision" ? viewDecision() :
    screen === "result"   ? viewResult()   :
    screen === "note"     ? viewNote()     :
    screen === "miban"    ? viewMiban()    :
    screen === "chain"    ? viewChain()    :
    screen === "book"     ? viewBook()     :
                            viewYearEnd();
  const p = screen === "cover" || screen === "pull" ? 0
    : screen === "chain" ? (8 + (S.chainIndex||0)) / 12
    : screen === "miban" ? 8/12
    : Math.min(S.termIndex, 8) / 12;
  document.getElementById("bar").style.transform = `scaleX(${p})`;
  起动画();
  window.scrollTo(0, 0);
}

/* ── 流程 ── */
function nextTerm() {
  pendingEvents = dueEvents(S, S.termIndex);
  flash = {};
  pendingEvents.forEach(e => { for (const k in e.delta) if (e.delta[k]) flash[k] = e.delta[k]; });
  screen = pendingEvents.length ? "event" : "decision";
  render();
  扫成就(null);   // 回响落地，顺手看看这一下有没有撞出个什么
}

window.startGame = function () {
  S.termIndex = 0; screen = "pull"; render();
  /* 抽卡的动静按档位给 —— 上上/下下的琶音，其余只翻个页 */
  const y = S.年景, 级 = y.级 || "R";
  响(级 === "SSR" ? (y.色 === "d" ? "凶" : "金") : "抽");
};
window.toField   = function () { nextTerm(); };
window.toDecision = function () { screen = "decision"; render(); };

window.onSound = function () {
  开声 = !开声;
  if (开声) 响("tap");
  render();
};

window.onChoose = function (i) {
  /* 先用一下按下的手感，再翻屏 —— 不然"我选了"这个动作没有落点 */
  const btn = document.querySelectorAll ? document.querySelectorAll(".btn")[i] : null;
  if (btn) btn.classList.add("pick");
  响("tap");
  setTimeout(() => {
    lastResult = choose(S, S.termIndex, i);
    flash = {};
    for (const k in lastResult.delta) if (lastResult.delta[k]) flash[k] = lastResult.delta[k];
    if (lastResult.新图鉴) toast(`记下了 · ${lastResult.新图鉴}`);
    screen = "result"; render();
    响(Object.keys(lastResult.delta).some(k => lastResult.delta[k] < 0) ? "坏" : "好");
    扫成就(null);
  }, 160);
};

window.onContinue = function (skip) {
  /* 白天那一手的结果先看，晚上再翻书 —— 两件事分两屏，各看各的。
     不想翻也行：跳过就不记这笔，图鉴里"凭感觉"那块牌子是留给跳的人的。 */
  if (screen === "result" && lastResult && lastResult.查 && skip !== true) {
    S.待查 = lastResult.查; lastResult.查 = null;
    S.查过[S.节气[S.termIndex].term] = true;
    screen = "note"; render(); return;
  }
  if (screen === "result" && lastResult) lastResult.查 = null;
  S.待查 = null;
  S.termIndex++; flash = {};
  if (S.termIndex >= S.节气.length) {
    dueEvents(S, S.节气.length);   // 收尾那一趟：粮进场了才回过味来的账
    flash = {};
    S.log.forEach(e => { for (const k in e.delta) if (e.delta[k]) flash[k] = e.delta[k]; });
    S.grain = S.stats.harvest;
    miban = 验米(S);
    screen = "miban"; render();
    响(miban.grade.名 === "特级" ? "金" : miban.grade.名 === "等外" ? "坏" : "好");
    扫成就(null);
  } else nextTerm();
};

window.toChain = function () { S.chainIndex = 0; screen = "chain"; render(); };

window.onChain = function (i) {
  const c = CHAIN[S.chainIndex];
  if (!c || !c.options[i]) return;   // 连点或越界，直接吞掉，别把最后一屏点崩
  c.options[i].pick(S);
  S.chainIndex++;
  if (S.chainIndex >= CHAIN.length) {
    /* 这里不再弹牌 —— 年终这一屏本身就是发奖的地方，
       弹一遍再列一遍，是打自己的脸 */
    result = 年终(S); 结成就(S, result); newAch = S.本季成就; screen = "yearend";
  }
  响(S.chainIndex >= CHAIN.length ? "钱" : "tap");
  render();
};

window.setTab = function (t) { tab = t; render(); };
window.backToGame = function () { screen = S.termIndex >= S.节气.length ? "yearend" : "decision"; render(); };
window.openBook = function () { screen = "book"; render(); };
window.restart = function () { reset(); 成就队 = []; 弹牌(); render(); };

render();
</script>
</body>
</html>
