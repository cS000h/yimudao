  /** 一枚线条图标。尺寸不给就 16 —— 顶栏、标签、动作行用的都是这一档。 */
  static svg(name, size = 16, cls = '') {
    const d = UIRenderer.ICONS[name];
    if (!d) throw new Error(`图标表里没有「${name}」`);
    return `<svg class="ic${cls ? ' ' + cls : ''}" width="${size}" height="${size}"
      viewBox="0 0 20 20" aria-hidden="true"><path d="${d}"/></svg>`;
  }

  /** 四个页签各贴一枚 —— 键是 data-tab，加页签得跟着补。 */
  static TAB_ICON = { field:'rice', schedule:'calendar', people:'people', relics:'jar' };
  /** 天气图标按 weather 的 id 查，不碰 GameData 里那个 icon 字段 ——
   *  那一格写的是彩色 emoji，数据层不许动，视图层不印它就是了。 */
  static WEATHER_ICON = {
    sunny:'sun', windy:'cloudwind', rain:'rain', cold_rain:'rain', scorching:'flame'
  };
  /** 五个地点各配一枚。键是 location.id，加地点得跟着补一个，
   *  漏了就用「田」那一枚垫底 —— 认错地方总比什么都不画强。 */
  static LOC_ICON = { field:'field', shed:'shed', plot:'plot', village:'village', town:'town' };

  /* ── 小工具 ───────────────────────────────────────────────── */
  static toastTimer = null;
  toast(text) {
    const t = this.el.toast;
    t.textContent = text;
    t.className = 'on';
    clearTimeout(UIRenderer.toastTimer);
    UIRenderer.toastTimer = setTimeout(() => { t.className = ''; }, 1900);
  }
  static gaugeColor(v, higherIsBetter) {
    const good = higherIsBetter ? v >= 60 : v <= 40;
    const bad  = higherIsBetter ? v <= 25 : v >= 75;
    return good ? 'var(--ok)' : bad ? 'var(--bad)' : 'var(--warn)';
  }
  static duration(minutes) {
    if (minutes < 60) return `${minutes}分`;
    const h = minutes / 60;
    return (h % 1 === 0 ? h : h.toFixed(1)) + '小时';
  }
  /** 把一段带换行的文本铺成 <p>。 */
  static paragraphs(text) {
    return (text || '').split('\n').map(line => `<p>${line}</p>`).join('');
  }
  /** 开销那一串：耗时 / 体力 / 钱 / 筹码。
   *  动作池的按钮和决策方案共用同一套写法 —— 说好每个选项都要先把成本摆出来的，
   *  决策那屏早先漏了这一段，一屏一千二的插秧机点下去才知道要花钱。 */
  static costs(a) {
    const bits = [];
    if (a.costTimeMinutes) bits.push(`耗时${UIRenderer.duration(a.costTimeMinutes)}`);
    if (a.costStamina > 0) bits.push(`体力-${a.costStamina}`);
    if (a.costStamina < 0) bits.push(`体力+${-a.costStamina}`);
    if (a.costMoney) bits.push(`${a.costMoney}元`);
    if (a.costHookNpc) bits.push('筹码-1');
    // 压力也摆出来：歇会儿、焖锅饭这一类，回的那口气全在压力上，
    // 不写出来就只剩「体力+20」，看着像白捡的。
    if (a.stressDelta) bits.push(`压力${a.stressDelta > 0 ? '+' : ''}${a.stressDelta}`);
    // 每一项都包个 span 再回去。.act-sub 是个 flex，
    // 光把几个字符串扔进去，它们会并成**一块**匿名文本 —— 中间那个间隔就不生效了，
    // 读出来是「耗时30分体力-6」。包成元素才各自是一个 flex item。
    return bits.map(t => `<span class="bit">${t}</span>`);
  }
  /** 效果里那几个数字，缩成一行「这一步的账」。 */
  static ledger(effect) {
    if (!effect) return '';
    const parts = [];
    if (effect.yieldDelta)   parts.push(`亩产 ${effect.yieldDelta > 0 ? '+' : ''}${effect.yieldDelta}`);
    if (effect.qualityDelta) parts.push(`米质 ${effect.qualityDelta > 0 ? '+' : ''}${effect.qualityDelta}`);
    if (effect.moneyDelta)   parts.push(`钱 ${effect.moneyDelta > 0 ? '+' : ''}${effect.moneyDelta}`);
    return parts.join(' · ');
  }
  static modifierRows(effect) {
    if (!effect?.modifiers) return '';
    return effect.modifiers.map(m =>
      `<div class="chk-row"><span class="mk">${UIRenderer.svg(m.good ? 'tick' : 'cross', 12)}
        ${m.name}</span><span class="mk">${m.desc}</span></div>`).join('');
  }

  /* ══════════════════════════════════════════════════════════════
     田头视窗
     ══════════════════════════════════════════════════════════════
     满屏只有框和字的时候，人是不会想点下去的 —— 得让他先看见自己的田：
     天是什么天、站在哪儿、田里的苗长到哪一节了。
     这一条 76 像素高：天光归 CSS（红日、雨丝、热浪都在外头那层），
     山、田埂、苗、人归这张 SVG。SVG 用 viewBox 480×76 横向拉满，
     所以里面不用圆——横拉会把圆压成椭圆，圆都交给外头的 CSS 画。 */
  /** 十一个节气，苗一格一格地变：
   *  露头 → 疏朗 → 密得封了行 → 抽穗 → 低下头的金黄。
   *
   *  【待作者过目】这几个高度 / 叶片数是我配的，不是总表上的数 ——
   *  它只管画出来像不像，跟游戏里的亩产米质一点关系都没有。
   *  季节跟节气的对位是照总表来的（谷雨落谷 → 秋分收），这个不能动；
   *  至于「大暑该画到多高」，看着不顺眼改数字就行。 */
  static RICE_STAGE = [
    { leaf:1, h:6,  w:1.3, head:0, gold:0 },   // 谷雨 刚露头
    { leaf:2, h:9,  w:1.3, head:0, gold:0 },   // 立夏
    { leaf:3, h:13, w:1.4, head:0, gold:0 },   // 小满
    { leaf:4, h:18, w:1.4, head:0, gold:0 },   // 芒种
    { leaf:5, h:24, w:1.5, head:0, gold:0 },   // 夏至
    { leaf:6, h:29, w:1.5, head:0, gold:0 },   // 小暑  封行
    { leaf:6, h:32, w:1.6, head:0, gold:0 },   // 大暑
    { leaf:6, h:31, w:1.6, head:1, gold:0 },   // 立秋  抽穗
    { leaf:6, h:30, w:1.6, head:2, gold:0 },   // 处暑
    { leaf:5, h:29, w:1.6, head:2, gold:1 },   // 白露  转黄
    { leaf:5, h:27, w:1.7, head:3, gold:1 }    // 秋分  沉甸甸
  ];
  /** 一株。jitter 是这一棵歪多少 —— 整整齐齐一排看着像栅栏。 */
  static ricePlant(x, baseY, s, jitter) {
    const out = [], n = s.leaf;
    let cx = x, cy = baseY - s.h;
    for (let i = 0; i < n; i++) {
      const t = n === 1 ? 0 : i / (n - 1) * 2 - 1;
      const dir = t + jitter;
      const dx = dir * s.h * 0.40;
      const hh = s.h * (1 - Math.abs(dir) * 0.26);
      const tipX = x + dx, tipY = baseY - hh;
      out.push(`<path class="dio-leaf${s.gold ? ' gold' : ''}"
        style="stroke-width:${s.w}" d="M${x} ${baseY}Q${(x + dx * 0.28).toFixed(1)} ${
        (baseY - hh * 0.66).toFixed(1)} ${tipX.toFixed(1)} ${tipY.toFixed(1)}"/>`);
      // 穗长在当间那一支的头上：|dir| 最小的那支离中线最近
      if (Math.abs(dir) < 0.22) { cx = tipX; cy = tipY; }
    }
    if (s.head) {
      // 1 抽出来、2 立着、3 低着头 —— 秋分那一档转过 58°，就是「沉甸甸」
      const rot = s.head === 1 ? -16 : s.head === 2 ? -32 : 58;
      const ry = s.head === 3 ? 3.6 : 3.1;
      out.push(`<ellipse class="dio-head${s.gold ? '' : ' green'}"
        cx="${cx.toFixed(1)}" cy="${(cy - 1.4).toFixed(1)}" rx="1.5" ry="${ry}"
        transform="rotate(${rot} ${cx.toFixed(1)} ${(cy - 1.4).toFixed(1)})"/>`);
    }
    return out.join('');
  }
  /** 站在田埂上的人 + 一句话。剪影就够了 —— 这个地方不用画脸。
   *  气泡里得有三个点：光一个空框，看着像是图没加载出来。 */
  static asideFigure(bubble) {
    return `<g class="dio-man">
      <circle cx="30" cy="52" r="3.1"/>
      <path d="M30 55.6c-4.4 0-6.6 3-6.6 7.4v9.4h13.2V63c0-4.4-2.2-7.4-6.6-7.4z"/></g>`
      + (bubble
        ? `<path class="dio-sig" d="M36 31.5h30v13h-17l-5.5 6v-6H36z"/>`
          + `<g class="dio-dots">
               <circle cx="44" cy="38" r="1.1"/><circle cx="51" cy="38" r="1.1"/>
               <circle cx="58" cy="38" r="1.1"/></g>`
        : '');
  }
  /** 五个地方各一个剪影：田埂水口、砖房电锅、白牌子、老槐树、集市幡旗。 */
  static MARK = {
    field:   '<path class="dio-ridge" d="M0 65.5h480M296 65.5v6.5M316 65.5v6.5M296 72h20"/>',
    shed:    '<path class="dio-sig" d="M372 70V48h36v22zM368 48l22-13 22 13M386 70V58h9v12"/>'
           + '<path class="dio-steam" d="M410 40c3.4-3-3.4-5.4 0-8.6"/>',
    plot:    '<path class="dio-sig" d="M382 38h34v15h-34zM399 53v17"/>'
           + '<path class="dio-mark" d="M388 44h22M388 48.5h14"/>',
    village: '<path class="dio-canopy" d="M392 44c-8 1-12-6-7.6-11 .8-6 9.6-8 13.6-4 5-3 11 1 9.6 7'
           + '4 5-2 10-8.6 9z"/><path class="dio-ridge" d="M392 44v26"/>'
           + '<path class="dio-sig" d="M358 70v-9h26v9"/>',
    town:    '<path class="dio-ridge" d="M370 40v30M370 42h16l-3.2 4.6 3.2 4.6h-16z"/>'
           + '<path class="dio-sig" d="M348 70v-8h44v8"/>'
  };

  renderDiorama() {
    const st = this.engine.state;
    const box = this.el.diorama;
    if (!box) return;
    const w = st.time.weather;
    const sky = (UIRenderer.DIORAMA_SKY[w] || 'dio-sunny')
      + (w === 'cold_rain' ? ' cold' : '');
    const s = UIRenderer.RICE_STAGE[st.time.solarTermIndex] || UIRenderer.RICE_STAGE[0];
    const here = st.player.location;
    const mate = this.engine.classmateHere();

    // 十四株，一株比一株歪得不一样。jitter 拿编号算，不用随机数 ——
    // 每次重画都得是同一片田，不然每点一下就抖一回。
    let rice = '';
    for (let i = 0; i < 14; i++) {
      const x = 18 + i * 34;
      const jitter = ((i * 7) % 5 - 2) * 0.05;
      const one = UIRenderer.ricePlant(x, 71 - Math.round(Math.sin(i * 1.7) * 1.6), s, jitter);
      // 矮苗不摇 —— 刚露头那几节要是也摇，看着像水底下的草。
      // 长起来的才套一层会摇的 <g>：一株一个相位，错开摇才成浪，
      // 十四株一起摆那就是一张画在抖。
      rice += s.h >= 15
        ? `<g class="dio-rice" style="animation-delay:${(-(i * 0.43) % 6).toFixed(2)}s">${one}</g>`
        : one;
    }
    box.className = sky;
    box.innerHTML = `<svg class="dio" viewBox="0 0 480 76" preserveAspectRatio="none"
        aria-hidden="true">
      <path class="dio-far" d="M0 46q52-16 104 0t104-6 104 8 68-8v36H0z"/>
      <path class="dio-hill" d="M0 54q64-13 128 1t128-7 130 9 94-6v25H0z"/>
      <rect class="dio-water" x="0" y="57" width="480" height="7"/>
      ${rice}
      ${UIRenderer.MARK[here] || UIRenderer.MARK.field}
      ${mate ? UIRenderer.asideFigure(true) : ''}
    </svg>`;
  }

  /** 天光那一层是 CSS 画的，类和天气 id 对上就行。 */
  static DIORAMA_SKY = {
    sunny:'dio-sunny', windy:'dio-windy', rain:'dio-rain',
    cold_rain:'dio-rain', scorching:'dio-scorching'
  };

  /* ── 总渲染 ───────────────────────────────────────────────── */
  renderAll() {
    this.renderTopBar();
    this.renderDiorama();
    const scene = this.renderScene();
    this.renderNarrative(scene);
    this.renderDuty();
    this.renderActions();
    this.renderLocationBar();
    if (this.drawerVisible()) this.renderDrawer();
  }

  /** 体力、压力这两样的满格是多少。引擎那边没这个常数 ——
   *  开局的 100 / 0 是配置里的数值，不是上限定义。这儿只为画进度条，
   *  所以夹一下就够了，别把它当成一条真规则到处用。 */
  static STAT_MAX = 100;

  renderTopBar() {
    const st = this.engine.state;
    const w = this.data.weather[st.time.weather];
    this.renderClock();
    this.el.weather.innerHTML = UIRenderer.svg(UIRenderer.WEATHER_ICON[st.time.weather]
      || 'cloudwind') + `<span>${w.label}</span>`;
    // 取整再印。引擎那边压力是按 0.35 这样的系数加上去的
    // （changeStress(actual * 0.35)），一次拔草就出来 5.25，
    // 再撞上一回浮点余数，顶栏上就敢印「2.6999999999999997」——
    // 十七位数挤在「压力」两个字后头，看着像坏了。
    // 玩家看的是「压力 5」，进度条那一格本来也填不出 5.25 的差别。
    this.el.stamina.textContent = Math.round(st.player.stamina);
    this.el.stress.textContent = Math.round(st.player.stress);
    this.el.money.textContent = Math.round(st.player.money);

    // 圆点和刻度条一个色。光晕在这儿一起写进去 ——
    // 样式里只能写 currentColor，那是墨色的，配红的绿的圆点不对。
    const tint = (dot, bar, v, higherIsBetter) => {
      const c = UIRenderer.gaugeColor(v, higherIsBetter);
      dot.style.background = c;
      dot.style.boxShadow = `0 0 6px -1px ${c}`;
      bar.style.background = c;
      bar.style.width = Math.max(0, Math.min(100,
        v / UIRenderer.STAT_MAX * 100)).toFixed(0) + '%';
    };
    tint(this.el.dotStamina, this.el.barStamina, st.player.stamina, true);
    tint(this.el.dotStress,  this.el.barStress,  st.player.stress,  false);

    this.el.chips.innerHTML = this.engine.statusChips()
      .map(c => `<span class="buff ${c.good ? 'good' : 'bad'}">${c.text}</span>`).join('');

    // 数字一变，就在那个数上头飘一颗小字。差值是从「上一回画顶栏时是多少」
    // 里减出来的 —— 视图不猜引擎刚干了什么，只看结果差了多少，所以
    // 换种子、交节、睡到天亮，走哪条路都会飘。
    // 那颗小字是绝对定位的浮子，挂在 .gauge / .tb-time 上，
    // **不能**塞进 #tbStamina / #tbStress / #tbMoney 里头：
    // 那三个 ID 的 textContent 是要逐字对过的。
    const st2 = this.engine.state;
    const now = {
      term:    st2.time.solarTermIndex,
      stamina: st2.player.stamina,
      stress:  st2.player.stress,
      money:   st2.player.money,
      clock:   st2.time.day * 1440 + st2.time.minutes
    };
    const was = this.snap;
    this.snap = now;
    if (!was) return;                       // 头一回画没有「上一回」可比
    // 差值也取整。压力加的是 actual * 0.35 这种带小数的数，不取整就会
    // 飘一颗「+2.6999999999999996」出来 —— 那颗是浮子，把底下的刻度条
    // 和「经费」一起盖住了。取整之后最短也最像话。
    const d = (k) => Math.round(now[k]) - Math.round(was[k]);
    if (d('stamina')) this.floatDelta(this.el.stamina.closest('.gauge'),
      (d('stamina') > 0 ? '+' : '') + d('stamina'), d('stamina') > 0 ? 'up' : 'down');
    if (d('stress')) this.floatDelta(this.el.stress.closest('.gauge'),
      (d('stress') > 0 ? '+' : '') + d('stress'), d('stress') > 0 ? 'down' : 'up');
    if (d('money')) this.floatDelta(this.el.money.closest('.gauge'),
      (d('money') > 0 ? '+' : '') + d('money') + '元', d('money') > 0 ? 'up' : 'gold');
    // 交节那一下日子是从头数起的，差值算出来是负的几千分钟 —— 那一笔不飘，
    // 节气印自己会变，再飘一颗「-20小时」只会把人看糊涂。
    if (now.term === was.term && d('clock')) this.floatDelta(this.el.time,
      (d('clock') > 0 ? '+' : '') + UIRenderer.duration(Math.abs(d('clock'))), 'dim');
  }

  /** 往某一块上丢一颗往上飘的小字，飘完自己走。
   *  1800 毫秒是 CSS 那条动画的长度，这边留一点余量再删。 */
  floatDelta(host, text, cls) {
    if (!host || !text) return;
    const el = document.createElement('span');
    el.className = 'delta ' + cls;
    el.textContent = text;
    host.appendChild(el);
    setTimeout(() => el.remove(), 1800);
  }

  /** 顶栏那一行时间：节气做成一枚朱砂方印，钟点另起一小段灰字。
   *  clockText() 本来就是「谷雨 · 第1天 08:00（清晨）」一整句，
   *  这儿只是把开头那个节气名切出来单独上色 —— 所以切不动就整句照放，
   *  文案是引擎那边出的，视图不许自己拼。 */
  renderClock() {
    const term = this.engine.currentTerm.id;
    const text = this.engine.clockText();
    const rest = text.startsWith(term) ? text.slice(term.length) : '';
    this.el.time.innerHTML = rest
      ? `<span class="tb-term">${term}</span><span class="tb-clock">${rest}</span>`
      : `<span class="tb-clock">${text}</span>`;
  }

  renderScene() {
    const loc = this.engine.location(this.engine.state.player.location);
    const mate = this.engine.classmateHere();
    this.el.sceneName.textContent = loc.name;
    // 那枚菱形是 CSS 的 ::before 画的，不进 textContent ——
    // 不在场时这里得**空着**，空才落得上 :empty 那条「别挂条空下划线」。
    this.el.sceneWho.textContent = mate ? `${mate.name} 在此` : '';
    return mate;
  }

  /**
   * 叙事区：地点一句话 + 在场的人 + **刚发生的那一把**。
   *
   * v7.2.0 起这儿是「单屏焦点」，不是滚动窗了：
   * 一次动作有时候连出好几笔（比如陷进泥里：干了什么、出了什么事、
   * 该怎么办），这一把全留在屏上 —— 但**再往前的就不留了**。
   * 往回翻着看是旧手账的读法，人在田里没有那工夫：
   * 主屏只回答「我这一下换来了什么」，更早的收在 #logBtn 后头。
   * 判据是 this.seenEvents：它记着上一回画到第几条，
   * 比它新的才上主屏（走 fadeUp 洇出来），刚好在它前头那一笔留作底。
   */
  /** 叙事区那一行是什么来头。sys 和 travel 是一路的（地方交代，
   *  压暗一档）；年景、备货、兆头各给一个自己的调子 ——
   *  二三月里飘过的兆头，跟「你刚拔了半垄草」不该长一个样。 */
  static KIND_CLASS = {
    sys:'sys', travel:'sys',
    year:'year', warn:'warn', omen:'omen'
  };
  /** 主屏最多留几笔。留一笔底是为了让人看得见「上一步是啥」，
   *  三笔之外就该去手记里翻了。 */
  static FOCUS_MAX = 3;

  renderNarrative(mate) {
    const box = this.el.narr;
    const all = this.engine.peekEvents(80);
    // 这一把：最新的几笔。slice(-n) 而不是「第几条之后」——
    // 一笔动作连出四行的时候，宁可把最上头那行挤掉，也不让屏面长出去。
    const focus = all.slice(-UIRenderer.FOCUS_MAX);

    const parts = [`<p class="scene-desc">${
      this.engine.location(this.engine.state.player.location).desc}</p>`];
    if (mate) parts.push(`<p class="said">${mate.presenceText.replace(/\n/g, '<br>')}</p>`);

    if (focus.length) {
      const from = all.length - focus.length;
      parts.push('<div class="focus">' + focus.map((e, i) => {
        const cls = UIRenderer.KIND_CLASS[e.kind] || 'ev';
        const fresh = from + i >= this.seenEvents;
        return `<p class="${cls}${fresh ? ' fresh' : ' past'}">${
          e.text.replace(/\n/g, '<br>')}</p>`;
      }).join('') + '</div>');
    }

    box.innerHTML = parts.join('');
    box.scrollTop = 0;                       // 焦点在当间，屏面从不往下翻
    this.seenEvents = all.length;
    this.renderLogButton(all.length - focus.length);
  }

  /** 场景抬头右肩那枚小按钮：「往期手记 (N)」。N 是**没上主屏的**有几笔。
   *  一笔没攒下就不亮它 —— 挂个 (0) 在那儿只会让人白点一下。 */
  renderLogButton(hidden) {
    const b = this.el.logBtn;
    if (!b) return;
    const n = Math.max(0, hidden | 0);
    b.hidden = n === 0;
    b.innerHTML = `${UIRenderer.svg('book', 12)}<span>往期手记 (${n})</span>`;
  }

  /** 往期手记：整本流水摊开，一条不落。
   *  这儿是「翻回头看」的地方，所以行距照旧、不带动画 ——
   *  四十行一起 fadeUp 是拿磁盘换热闹。 */
  openLogSheet() {
    const all = this.engine.peekEvents(80);
    const lines = all.map(e => {
      const cls = UIRenderer.KIND_CLASS[e.kind] || 'ev';
      return `<p class="${cls} log-line">${e.text.replace(/\n/g, '<br>')}</p>`;
    }).join('');
    this.setSheet(`
      <div class="sh-title">往期手记</div>
      <div class="sh-sub">这一天里出过的每一件事，从早到晚。</div>
      <div class="log-list">${lines || '<p class="log-line">还没落笔。</p>'}</div>
      <button class="sh-btn ghost" id="sheetClose">合上</button>`);
    this.el.sheet.querySelector('#sheetClose').onclick = () => this.closeSheet();
  }

  /* ── 当务之急 ─────────────────────────────────────────────── */
  /** 下一个节气。翻到头就回头数第一个。 */
  nextTerm() {
    const t = this.data.solarTerms;
    return t[(this.engine.state.time.solarTermIndex + 1) % t.length];
  }
  /** 这个节气还剩多少分钟。跟日程表那一屏用的是同一笔账。 */
  termMinutesLeft() {
    const term = this.engine.currentTerm, st = this.engine.state;
    return Math.max(0, term.days * 24 * 60 - ((st.time.day - 1) * 24 * 60 + st.time.minutes));
  }
  /** 脚上那双要是陷过泥，报上它的名字；没事就 null。 */
  muddyFeet() {
    const item = this.engine.state.player.equipment.feet;
    return item && (item.states || []).includes('陷过泥') ? item : null;
  }

  /**
   * 当务之急：贴在 #sceneHead 下头那一条。
   *
   * 四档，按轻重排：**砸下来的灾** > **该定的事** > **身上的毛病** > **没别的事**。
   * 一次只报一条 —— 横幅要是能同时说三件事，就等于什么都没说。
   * 字全是从引擎和数据里取的：视图不许自己编一句「建议你先去……」，
   * 那不是这局游戏说的话。
   */
  renderDuty() {
    const box = this.el.duty;
    if (!box) return;
    const e = this.engine, st = e.state;
    const alert = e.pendingAlert(), decision = e.currentDecision();
    const mud = this.muddyFeet();
    let cls = 'calm', icon = 'tick', text;

    if (alert) {
      // 灾警是这一节里唯一有期限的那件事，拖到交节就按「没搭理」印折。
      // 只报头一句：urgent 有时候是两行，横幅撑不下第二行。
      cls = 'urgent'; icon = 'bell';
      text = `紧急灾情：${alert.disaster.urgent.split('\n')[0]}`;
    } else if (decision) {
      const row = this.data.solarTerms.find(t => t.id === decision.solarTerm);
      cls = 'due'; icon = 'pin';
      text = `当务之急：${e.currentTerm.id}第${st.time.day}天 · `
           + `需定下【${row ? row.taskWindow : decision.screenName}】方案`
           + `（距${this.nextTerm().id}还剩 ${Math.floor(this.termMinutesLeft() / 60)} 小时）`;
    } else if (mud) {
      // 陷泥这一条只说两件事：这双鞋叫什么、它自己那条 effect.desc。
      // 一个字都不是这儿编的 —— 早先在这后头还接了半句
      // 「镇上集市的五金铺有胶鞋，穿戴上就不用再拖着腿走」，
      // 那是视图在教人怎么玩：提示归提示，替玩家拿主意是另一回事，
      // 何况该去哪儿、该买什么，镇上那一屏和陷泥那件事自己会讲。
      cls = 'tip'; icon = 'bulb';
      text = `提示：脚上这双${mud.name}陷过泥 —— ${mud.effect?.desc || ''}`;
    } else {
      text = `眼下没有非定不可的事 —— ${e.currentTerm.id}还剩 `
           + `${Math.floor(this.termMinutesLeft() / 60)} 小时`;
    }

    box.className = 'duty ' + cls;
    box.innerHTML =
      `<span class="duty-ic">${UIRenderer.svg(icon, 15)}</span>
       <span class="duty-t">${text}</span>`;
  }

  /**
   * 动作区：一屏分三班。
   *
   * ① 主线横幅（.mainline）—— 灾警与农时要务，整行的大卡，压在格子上头。
   *    灾警是这一节里唯一有期限的事（拖到交节直接印「折」），
   *    农时要务是「今天非得拍板」的那一张。两样都不是「有空再干的活计」，
   *    跟一摞农活挤在同一个半格里，扫一眼就漏过去了。
   *    所以要整行、要左肩一枚节气印、右下角一颗【去拍板 ▸】。
   *
   * ② 自由闲逛（.act-grid）—— 这个地儿寻常能干的事，两列清爽格子。
   *    每格只写三样：干什么（.act-main）、要花什么（.act-sub）、
   *    多大把握（.act-badge 那枚小印）。说明（.act-note）在格子里压到最小，
   *    它是「点开之前想知道的」，不是「扫的时候要读的」。
   *
   * ③ 轮不到的（.shutbar）—— 干不了的（.locked，比如手上没那份筹码）
   *    收进底下一条折叠带，默认合着：不占主屏，也没弄丢。
   *    原来它们混在中间，跟能干的排在一起，扫一眼分不出哪个点得动。
   *
   * 注：决策卡必须还在 #actions 里、还挂着 .act.decision ——
   * 引擎那边 sleepToNextDecision 就是按 `#actions .act.decision` 找它的。
   */
  renderActions() {
    const box = this.el.actions;
    box.innerHTML = '';

    const live = [], shut = [], mainline = [];
    const put = el => (el.classList.contains('locked') ? shut : live).push(el);

    const alert = this.engine.pendingAlert();
    if (alert) mainline.push(this.alertCard(alert));

    const decision = this.engine.currentDecision();
    if (decision) {
      // 按钮上那行用的是日程表里的 taskWindow（泡种落谷 / 控水晒田 / 除草 …），
      // 整句照搬，不改字也不截字。
      // 早先写的是「该${屏名}了」—— 遇上屏名是「水」「草」「虫」的几屏，读出来不成话。
      const termRow = this.data.solarTerms.find(t => t.id === decision.solarTerm);
      // 左肩那枚印章刻的就是这一步的节气（谷雨 / 立夏…）。原文出自数据层，
      // 视图一个字不编；查不着就干脆不刻印，不拿别的字顶上。
      mainline.push(this.actionButton({
        id:'decision_' + decision.id,
        label: termRow ? `${termRow.taskWindow}的时候到了` : `该${decision.screenName}了`,
        detail:'这一步定下去，秋后才见账',
        isDecision:true,
        seal: termRow ? termRow.id : ''
      }));
    }
    for (const a of this.engine.actionsHere()) {
      if (a.opensPresale && this.engine.state.flags.presaleTaken) continue;
      put(this.actionButton(a));
    }

    if (!mainline.length && !live.length && !shut.length) {
      const d = document.createElement('div');
      d.className = 'act locked';
      d.innerHTML = '<div class="act-body"><div class="act-main">这儿这会儿没什么可干的</div></div>';
      box.appendChild(d);
      return;
    }

    if (mainline.length) {
      const zone = document.createElement('div');
      zone.className = 'mainline';
      mainline.forEach(el => zone.appendChild(el));
      box.appendChild(zone);
    }

    if (live.length) {
      const grid = document.createElement('div');
      grid.className = 'act-grid';
      live.forEach(el => grid.appendChild(el));
      box.appendChild(grid);
    }

    if (shut.length) {
      // 轻量折叠条：默认合着 —— 屏上没有灰的，想看的再点开。
      const bar = document.createElement('div');
      bar.className = 'shutbar';
      const head = document.createElement('button');
      head.className = 'shutbar-t';
      head.innerHTML = `${UIRenderer.svg('chev', 13)}<span>这会儿还轮不到 · ${shut.length} 项</span>`;
      head.onclick = () => bar.classList.toggle('open');
      const off = document.createElement('div');
      off.className = 'act-grid shut';
      shut.forEach(el => off.appendChild(el));
      bar.appendChild(head);
      bar.appendChild(off);
      box.appendChild(bar);
    }
  }

  /** 成功率按三档上色。检定面板和动作按钮共用同一个档位，
   *  免得同一个数在列表里是绿的、点进去变黄的。 */
  static chanceClass(chance) {
    return chance > 75 ? 'good' : chance > 50 ? 'mid' : 'low';
  }

  /**
   * 灾警那一张。跟决策卡长得像（都是这一屏最要紧的事），
   * 但左边那道色标是朱砂 —— 决策是「该定的事」，灾警是「已经砸下来了」。
   * 牌面只写年景名和要备什么，不剧透会怎样：
   * 灾害那一页说了，【好】【中】只写动作，后果是事后印的。
   */
  alertCard(p) {
    const el = document.createElement('div');
    el.className = 'act decision alert' + (p.enough ? '' : ' locked');
    const g = this.data.goods[p.need.kind];
    const have = this.engine.goodsCount(p.need.kind);
    const cover = p.cover
      ? (p.cover.by === 'stock'
          ? `备着的${g.label} ${have}${g.unit}`
          : `能拿 ${p.cover.relic.name} 顶一次`)
      : `手上没有${g.label}`;
    el.innerHTML =
      `<div class="act-body">
         <div class="act-kind">灾警 · ${p.card.name}</div>
         <div class="act-main">${p.disaster.urgent}</div>
         <div class="act-sub"><span class="cost">${cover}</span></div>
         <div class="act-note">顶这一夜要 ${p.need.stamina} 分体力 · 交节前不定就按没搭理算</div>
         <span class="act-go">去处置 ▸</span>
       </div>
       <div class="act-badge low"><b>!</b><span>急</span></div>`;
    el.onclick = () => this.openAlert(p);
    return el;
  }

  /** 灾警屏。两行动作，就照作者写的那样 —— 只写动作，不写会怎样。 */
  openAlert(p) {
    const g = this.data.goods[p.need.kind];
    const have = this.engine.goodsCount(p.need.kind);
    const st = this.engine.state.season;

    // 你在那屏决策上站的是哪一边，摊开给人看 ——
    // 这不是加分项，是让人明白自己这一季是怎么走到这一步的。
    let hedge = '';
    if (st.hedge) {
      const ok = st.hedge === 'counter';
      hedge = `<div class="mod ${ok ? '' : 'bad'}"><span>这一季你走的是
        <b>${st.hedgeLabel}</b></span>
        <span class="why">${ok ? '跟这块牌是顺的' : '跟这块牌反着'} </span></div>`;
    }

    const stockLine = have
      ? `<div class="chk-row"><span>屋角备着的${g.label}</span><b class="p">${have}${g.unit}</b></div>`
      : `<div class="chk-row off"><span>屋角备着的${g.label}
          <span class="mk">· 没备</span></span><b class="m">0</b></div>`;
    const relicRows = (this.data.goodsStandIn[p.need.kind] || [])
      .map(id => this.engine.findRelic(id))
      .filter(r => r && this.engine.state.player.relics.includes(r.id))
      // 标「备选」不是「能顶」：备的货先出，家什是拿一件以后还能使的
      // 东西换这一夜 —— 两样都写着「能顶」，看着像是要一起用掉。
      .map(r => `<div class="chk-row"><span>${r.name} <span class="mk">· ${r.effect.desc}</span></span>
        <b class="p">备选</b></div>`).join('');

    this.setSheet(
      `<h2 class="sh-title">${p.card.name} · ${p.term}</h2>
       <div class="sh-sec">这一节的事</div>
       <div class="alert-text">${p.disaster.urgent.replace(/\n/g, '<br>')}</div>
       ${hedge}
       <div class="sh-sec">顶这一夜的家底</div>
       ${stockLine}${relicRows}
       <div class="sh-sec">两行办法</div>
       <div class="sh-acts">
         <div class="sh-act ${p.enough ? '' : 'off'}" data-alert="good">
           <div class="sh-act-t"><span class="sh-act-k">好</span>${p.disaster.good}</div>
           <div class="sh-act-n">${p.enough
             ? `${p.cover.by === 'stock' ? `用掉一件${g.label}` : `${p.cover.relic.name} 顶掉，用完了`}
                · 体力 -${p.need.stamina}`
             : `手上没有能顶的${g.label} —— 这一手使不上`}</div>
         </div>
         <div class="sh-act" data-alert="fair">
           <div class="sh-act-t"><span class="sh-act-k mid">中</span>${p.disaster.fair}</div>
           <div class="sh-act-n">体力 -${p.need.stamina} · 再熬六个钟头 · 压力 +10</div>
         </div>
       </div>
       <div class="sh-acts"><button class="sh-btn ghost" id="sheetClose">先放一放</button></div>`);

    this.el.sheet.querySelectorAll('[data-alert]').forEach(node => {
      node.onclick = () => {
        const r = this.engine.answerAlert(node.dataset.alert);
        if (r.error) { this.toast(r.error); return; }
        this.closeSheet();
        this.renderAll();
        this.toast(node.dataset.alert === 'good' ? '顶住了' : '硬扛了一夜');
      };
    });
  }

  actionButton(a) {
    const el = document.createElement('div');
    const blocked = this.engine.describeBlocker(a);
    // 卡片上没有图标：原来那个 emoji 既说不清是什么事，
    // 又跟左边的色标、右边的邮戳各说各话。现在「是什么」靠色标，
    // 「多大把握」靠邮戳，都比一个闪电准。
    el.className = 'act' + (blocked ? ' locked' : '') + (a.isDecision ? ' decision' : '')
      + (a.check ? ' check' : '');

    const bits = UIRenderer.costs(a);
    // 说明另起一行。跟开销挤在同一行过 —— 说明里本来就常写着「30分 · 体力-6」，
    // 跟左边那几个数一对，看着像是重了一遍。
    const note = a.detail ? `<div class="act-note">${a.detail}</div>` : '';

    // 带检定的往右盖一枚双圈邮戳：大数字 + 小字注明这是「把握」
    let badge = '';
    if (a.check) {
      const chance = this.engine.resolveCheck(a.check).chance;
      badge = `<div class="act-badge ${UIRenderer.chanceClass(chance)}">
        <b>${chance}</b><span>把握</span></div>`;
    }

    // 决策卡是横幅那一版（.mainline 里的），多两样：
    //   .act-seal —— 左肩一枚节气朱印，刻的是这一步的节气（谷雨 / 立夏…）
    //   .act-go   —— 右下角那颗【去拍板 ▸】。整张卡本来就点得动，
    //               这一颗只是把「点了会发生什么」说出口，不另接一份 onclick。
    // 两样都装在 .act-body 里：.act 的直系孩子只许有 .act-body 和 .act-badge
    // （check-skin 逐张卡对过这条）。
    const seal = a.isDecision && a.seal
      ? `<span class="act-seal">${a.seal}</span>` : '';
    const go = a.isDecision ? `<span class="act-go">去拍板 ▸</span>` : '';

    el.innerHTML =
      // .act-body 这一层不能省：.act 是 flex 行，
      // 里头几个块要是直接当 flex item，就会**并排**摊开，
      // 说明和开销会跑到标题右边去。包一层，里头才是正常的竖着堆。
      `<div class="act-body">` +
        (a.isDecision ? `<div class="act-kind">农时要务</div>` : '') +
        seal +
        `<div class="act-main">${a.label}</div>` +
        `<div class="act-sub">${bits.join('')}</div>` +
        note +
        (blocked ? `<div class="act-why">${blocked}</div>` : '') +
        go +
      `</div>` + badge;

    if (!blocked) el.onclick = () => {
      if (a.isDecision) return this.openDecisionSheet();
      if (a.opensPresale) return this.openPresaleSheet();
      const r = this.engine.executeAction(a.id);
      if (r.error) return this.toast(r.error);
      this.renderAll();
      // 视窗里那一下回响（气泡 + 稻田那一片晃一晃）。
      // 重画会连田头视窗一起铲掉，所以这一下得摆在 renderAll **后头**。
      this.flashDiorama(UIRenderer.echoOf(a.label));
      if (r.check) this.showCheckResult(a.label, r.check, r.effect, r.text);
    };
    return el;
  }

  /* ── 田头视窗那点动静 ─────────────────────────────────────── */
  /**
   * 点下去以后，视窗里冒一句话、稻田晃一晃。
   * 那半秒钟解决的是「我刚才那一下到底算不算数」——
   * 数字挪了 6 点体力，眼睛不一定抓得住；人影子边上冒出「拔草中…」就抓住了。
   * 气泡里那句话**不是总表里的**：它就是这一下的回响，跟动作卡上的字对得上就行。
   * 1000 毫秒是 CSS 那条动画的长度。
   */
  flashDiorama(say) {
    const box = this.el.diorama;
    if (!box) return;
    box.classList.add('busy');
    setTimeout(() => box.classList.remove('busy'), 1000);
    if (!say) return;
    const b = document.createElement('span');
    b.className = 'bub';
    b.textContent = say;
    box.appendChild(b);
    setTimeout(() => b.remove(), 1700);
  }

  /** 动作名 → 视窗里那句话。对上哪个算哪个，一个都对不上就说「忙活着」。
   *  【不是总表里的】—— 这几个字只出现在田头视窗的小气泡里。 */
  static ECHO = [
    ['拔', '拔草中…'], ['看一圈', '看田…'], ['清沟', '清沟中…'],
    ['打药', '打药中…'], ['歇', '歇一会儿…'], ['睡', '睡下了…'],
    ['买', '买办中…'], ['修', '修补中…'], ['量', '量苗中…'],
    ['记', '记数据…'], ['洗', '洗家伙…']
  ];
  static echoOf(label) {
    for (const [key, say] of UIRenderer.ECHO) if (label.includes(key)) return say;
    return '忙活着…';
  }

  renderLocationBar() {
    const bar = this.el.navbar;
    bar.innerHTML = '';
    const here = this.engine.state.player.location;
    for (const loc of this.data.locations) {
      const isHere = loc.id === here;
      const minutes = isHere ? 0 : this.engine.walkMinutes(here, loc.id);
      // 直线距离就是「不穿鞋也不陷泥」时的耗时（见 engine.walkMinutes）——
      // 视图自己拿坐标算，不必再问引擎要一个「没加成要多久」的重载。
      // 比它慢，就是身上那身行头拖的（胶鞋走泥路慢一半），点个小泥点。
      const pure = Math.round(Math.hypot(loc.x - this.engine.location(here).x,
                                        loc.y - this.engine.location(here).y));
      const slowed = !isHere && minutes > pure;

      const b = document.createElement('div');
      b.className = 'loc' + (isHere ? ' here' : '') + (slowed ? ' far' : '');
      b.innerHTML =
        `<div class="loc-ic">${UIRenderer.svg(UIRenderer.LOC_ICON[loc.id] || 'field', 17)}</div>
         <div class="loc-n">${loc.name}</div>
         <div class="loc-t">${isHere ? '就在这儿'
           : `<span class="wl">${minutes} 分钟</span>`}</div>`;
      if (!isHere) b.onclick = () => {
        const r = this.engine.moveTo(loc.id);
        this.renderAll();
        if (r?.travelEvent) this.toast(r.travelEvent);
      };
      bar.appendChild(b);
    }
  }

  /* ── 开局仪式 ─────────────────────────────────────────────── */
  /**
   * 牌面上那几个字：年景名、成色（稀有度 · 上中下）、老周定调的那句话。
   * 全从年景表里拿 —— 视图不编年景，一个字都不编。
   * 灾年牌（color 'd'，见 GameData.yearCards）不扫金光，压一圈朱砂：
   * 进游戏头一眼就得知道，这一季不是顺水年。
   */
  syncIntro() {
    const card = this.engine.activeCard();
    if (!card || !this.el.ioCardName) return;
    this.el.ioCardName.textContent = card.name;
    this.el.ioCardTag.textContent = `${card.rarity} · ${card.tag}`;
    this.el.ioCardSay.textContent = card.say;
    const bad = card.color === 'd';
    this.el.ioReveal.classList.toggle('gold', !bad);
    this.el.ioReveal.classList.toggle('warn', bad);
  }
  /** 看完了，落田。只是把这一层让开 —— 引擎、时间、叙事，一概没动。 */
  closeIntro() {
    this.el.intro.classList.add('off');
  }
  /** 顶栏「年景」：把那一层原样喊回来（底牌内容按眼下这一局重刷一遍）。 */
  openIntro() {
    this.syncIntro();
    this.el.intro.classList.remove('off');
  }

  /* ── 抽屉 ─────────────────────────────────────────────────── */
  /** 1024 是桌面那一档断点（style.css 里同一条线，改要一起改）：
   *  那一档只管桌面上的手感 —— 田头视窗抬高一截、滚动条露出来。
   *  v7.3.0 起**不再管布局**：抽屉在任何宽度下都得由顶栏 [☰ 状态] 抽出来。 */
  static isWide() {
    return typeof window.matchMedia === 'function'
      && window.matchMedia('(min-width:1024px)').matches;
  }
  /** 抽屉这会儿开着没：不问宽度，只看那个 .on。
   *  v7.2.0 那会儿宽屏上抽屉摆成右栏、永远不带 .on，所以得 `isWide() ||` 一下；
   *  现在宽屏上也归顶栏那枚按钮管，就不再问宽度了。 */
  drawerVisible() {
    return this.el.drawer.classList.contains('on');
  }
  openDrawer() {
    this.el.drawer.classList.add('on');
    this.el.mask.classList.add('on');
    this.renderDrawer();
  }
  closeDrawer() {
    this.el.drawer.classList.remove('on');
    this.el.mask.classList.remove('on');
  }
  renderDrawer() {
    ({ field:this.renderFieldTab, schedule:this.renderScheduleTab,
       people:this.renderPeopleTab, relics:this.renderRelicTab })[this.tab]
      .call(this, this.el.drawerBody);
  }

  /* ① 田况与穿戴 */
  /** 一张读表：大数字 + 一条「误差半径」尺子。
   *  尺子中间那道准星是估值的中点，两边铺开的宽窄就是这颗心的虚实 ——
   *  越宽越没数。误差范围是引擎给的，视图只负责画出来。
   *  满量程取多少：亩产按 1200 斤封顶，米质按 100 分。*/
  static gaugeCard(label, unit, lo, hi, margin, span) {
    const mid = (lo + hi) / 2;
    const width = Math.min(100, margin * 2 / span * 100);
    const pct = v => Math.max(0, Math.min(100, v / span * 100));
    // 单位前面那个空格是**留着的**，不是手滑：
    // 「840 ~ 920 斤」这句是连着读的，单位贴死在数上会读成「920斤」一坨。
    return `<div class="stat">
      <div class="stat-l">${label}</div>
      <div class="stat-v">${lo} ~ ${hi}<span class="stat-u"> ${unit}</span></div>
      <div class="radius">
        <div class="radius-bar">
          <div class="radius-band" style="left:${pct(mid - margin).toFixed(1)}%;
            width:${width.toFixed(1)}%"></div>
          <div class="radius-mid" style="left:${pct(mid).toFixed(1)}%"></div>
        </div>
        <div class="radius-foot">误差 ±${margin} ${unit}</div>
      </div>
    </div>`;
  }

  /**
   * 「今年是什么年，备了什么，还有几步到」。
   * 这段是常驻的 —— 灾年那四段报是滚动一行一行飘过去的，
   * 飘完就捞不回来了；人得有个地方能静下来看一眼自己站到哪一步了。
   */
  seasonBlock() {
    const e = this.engine, card = e.activeCard();
    if (!card) return '';
    const s = e.state.season, terms = this.data.solarTerms;
    const d = e.activeDisaster(), h = e.hitTermIndex();

    // 四段报 + 发作，各落在哪个节气上
    let ladder = '';
    if (d && h >= 0) {
      const steps = ['stock', 'omen', 'sign', 'urgent'];
      const names = { stock:'备货', omen:'兆', sign:'显', urgent:'急' };
      ladder = `<div class="ladder">` + steps.map((k, i) => {
        const t = terms[Math.max(0, h - 4 + i)];
        const done = !!s.warned[k];
        const here = e.state.time.solarTermIndex === Math.max(0, h - 4 + i);
        return `<div class="lad${done ? ' done' : ''}${here ? ' here' : ''}">
          <i></i><span>${names[k]}</span><b>${t.id}</b></div>`;
      }).join('') + `<div class="lad hit${s.outcome ? ' done' : ''}">
        <i></i><span>发作</span><b>${card.stageTerm}</b></div></div>`;
    }

    // 备着的那三样。今年要哪一样，那一样挑出来说 ——
    // 「屋角有没有那件东西」就是这一季唯一的硬条件。
    const goods = ['membrane', 'fertilizer', 'labor'].map(kind => {
      const g = this.data.goods[kind], n = e.goodsCount(kind);
      const need = d?.need.kind === kind;
      return `<div class="gd${need ? ' need' : ''}${n ? '' : ' none'}">
        <span class="gd-n">${g.label}</span>
        <b class="gd-v">${n}<span class="gd-u"> ${g.unit}</span></b>
        ${need ? '<span class="gd-t">今年要这个</span>' : `<span class="gd-t">${g.desc}</span>`}
      </div>`;
    }).join('');

    // 走到哪一步了。过了发作那一节就印事后那个字。
    let stage;
    if (s.outcome) {
      const tier = this.data.disasterOutcome[s.outcome] || this.data.goodYearOutcome[s.outcome];
      stage = `<span class="why">${card.name} · <b>${tier.name}</b> ·
        亩产 ${tier.yield >= 0 ? '+' : ''}${tier.yield} 米质 ${tier.quality >= 0 ? '+' : ''}${tier.quality}</span>`;
    } else if (d && e.state.time.solarTermIndex === h) {
      stage = `<span class="why">就是这一节 —— 灾警摆出来了</span>`;
    } else if (d) {
      stage = `<span class="why">到 ${card.stageTerm} 见账</span>`;
    } else if (h >= 0) {
      stage = `<span class="why">到 ${card.stageTerm} 看这一季收成</span>`;
    } else {
      stage = `<span class="why">一季太平</span>`;
    }

    // 去年那一季结的果。牌一换 season 就是新的了，上一季的账在 lastSeason 上。
    const last = e.state.lastSeason;
    const lastTier = last?.outcome &&
      (this.data.disasterOutcome[last.outcome] || this.data.goodYearOutcome[last.outcome]);
    const past = lastTier
      ? `<div class="past">去年：${last.name} · <b>${lastTier.name}</b></div>` : '';

    return `
      <h3>今年的年景</h3>
      <div class="year">
        <div class="year-h"><b>${card.name}</b>${stage}</div>
        <div class="year-say">${card.say.replace(/\n/g, '<br>')}</div>
      </div>
      ${ladder}
      <div class="goods">${goods}</div>
      ${past}`;
  }

  renderFieldTab(box) {
    const e = this.engine;
    const [y0, y1] = e.yieldRange(), [q0, q1] = e.qualityRange();
    const margin = e.yieldErrorMargin(), qMargin = e.qualityErrorMargin();
    const passive = e.relicMargin().yield;
    const fit = margin <= 35 ? '收得挺窄了' : margin <= 55 ? '大致有数' : '还虚着';

    box.innerHTML = `
      ${this.seasonBlock()}
      <h3>田里的估值</h3>
      <div class="stat-cards">
        ${UIRenderer.gaugeCard('预估亩产', '斤', y0, y1, margin, 1200)}
        ${UIRenderer.gaugeCard('预估米质', '分', q0, q1, qMargin, 100)}
      </div>
      <div class="mod plain"><span>这把尺子</span>
        <span class="why">${fit}${passive
          ? ` · 手里的家什替你收窄了 ${-passive} 斤` : ''}</span></div>
      <h3>田况词条</h3>
      ${e.state.field.modifiers.length
        ? e.state.field.modifiers.map(m => `
            <div class="mod ${m.good ? '' : 'bad'}">
              <span>${m.name} <span class="why">（${m.desc}）</span></span></div>`).join('')
        : '<div class="mod plain">还没什么攒下来</div>'}
      <h3>身上的穿戴</h3>
      ${this.slotRow('head','hat')}${this.slotRow('feet','boot')}
      ${this.slotRow('tool','tool')}${this.slotRow('accessory','bag')}`;

    // 四行行头整行可点。点开的是【随身行头整备单】——
    // 换、刷、补、脱都在那一张上，这一屏只管「我现在穿着什么」。
    box.querySelectorAll('.slot').forEach(el => {
      el.onclick = () => this.openEquipSheet(el.dataset.slot);
    });
  }

  /** 身上一件行头那一行。**整行可点** —— 点开是【随身行头整备单】。
   *  原来这里只是一张说明卡：看得见自己穿着什么，换不了也打理不了；
   *  陷了泥的鞋也只好那么拖着（田况里那条词条明明白白摆着，人却没处下手）。 */
  slotRow(slot, icon) {
    const item = this.engine.state.player.equipment[slot];
    const head = `<div class="slot-ic">${UIRenderer.svg(icon, 19)}</div>`;
    const go = `<div class="slot-go"><span>点击更换 / 打理</span>${
      UIRenderer.svg('chev', 11)}</div>`;
    if (!item) {
      return `<div class="slot empty" data-slot="${slot}">
        <div class="slot-row">${head}
          <div class="slot-b"><div class="slot-t slot-empty">${
            SLOT_NAMES[slot]}位空着</div></div></div>
        ${go}</div>`;
    }
    // 陷了泥、开了线这些「身上带着的毛病」走 warn 那一档色，
    // 跟「这件东西的好处」分开 —— 原来两样都是同一个灰标签。
    const states = (item.states || []).map(s => `<span class="tag warn">${s}</span>`).join('');
    const good = item.effect?.desc ? `<span class="tag g">${item.effect.desc}</span>` : '';
    const dur = item.durability;
    return `<div class="slot" data-slot="${slot}">
      <div class="slot-row">
        ${head}
        <div class="slot-b">
          <div class="slot-t">${item.name}</div>
          <div class="slot-e">${item.quote || ''}</div>
          <div class="tags">${states}${good}</div>
        </div>
        ${dur === undefined ? '' : `<div class="dur"><span>耐久</span><b>${dur}%</b></div>`}
      </div>
      ${dur === undefined ? '' :
        `<div class="dur-bar"><i class="${dur <= 30 ? 'low' : ''}" style="width:${dur}%"></i></div>`}
      ${go}
    </div>`;
  }

  /** 工具是「握在手里」，别的都是「穿戴上身」。 */
  static wearLabel(slot) { return slot === 'tool' ? '握在手里' : '穿戴上身'; }

  /** 整备单上一件东西那一行：穿没穿、什么成色、右边一颗按钮。 */
  static wearRow(item, on) {
    const effect = item.effect?.desc ? `<span class="tag g">${item.effect.desc}</span>` : '';
    const states = (item.states || []).map(s => `<span class="tag warn">${s}</span>`).join('');
    const dur = item.durability;
    return `<div class="wear${on ? ' on' : ''}">
      <div class="wear-b">
        <div class="wear-n">${on ? UIRenderer.svg('tick', 12) : ''}${item.name}${
          dur === undefined ? '' : `<em>耐久 ${dur}%</em>`}</div>
        <div class="wear-q">${item.quote || ''}</div>
        <div class="tags">${states}${effect}</div>
      </div>
      <button class="wear-btn${on ? ' off' : ''}" data-wear="${item.id}">${
        on ? '脱下来' : '穿戴上身'}</button>
    </div>`;
  }

  /**
   * 【随身行头整备单】。在一行行头上按一下开出来的那一屏。
   *
   * 一、换：这一格能穿的都在单子上 —— 藏品册里到手的家什，
   *     加上开局那双运动鞋。它没有编号，不在藏品册里，
   *     所以脱下去以后得从 this.stash 里捞回来（耐久、脏没脏都还留着）。
   *     换人上身走的是引擎的 equip() —— 换完 sweepModifiers() 会把
   *     那件东西自己的词条一起撤了（「走泥路慢一半」是**运动鞋**的账，
   *     换上胶鞋它就该没了，这条写在引擎里，视图只管调用）。
   *
   * 二、打理：刷泥、修补、脱下来。**这三样是视图层的**，
   *     引擎里没有「刷鞋」这回事 —— 它们花的是时间和体力，
   *     改的是这件东西自己身上那几个字段（states / durability）。
   *     它们**不动**田况里那几条修正：刷掉的是鞋帮上的黑泥，
   *     不是「这双鞋是双薄底网面鞋」这件事本身 ——
   *     那双鞋下田还是会陷，除非换一双。
   */
  openEquipSheet(slot) {
    const e = this.engine, name = SLOT_NAMES[slot];
    const cur = e.state.player.equipment[slot];
    const rows = [];

    // 开局那双运动鞋不在藏品册里（没编号），得单独摆出来
    if (slot === 'feet') {
      const g = this.data.starterGear;
      const shown = cur?.id === g.id ? cur : (this.stash[slot] || g);
      rows.push(UIRenderer.wearRow(shown, cur?.id === g.id));
    }
    for (const r of this.data.relics) {
      if (r.slot !== slot || !e.state.player.relics.includes(r.id)) continue;
      const on = cur?.id === r.id;
      rows.push(UIRenderer.wearRow(on ? cur : r, on));
    }

    // 打理那几颗按钮：有什么毛病才出什么法子。
    const care = [];
    if (cur) {
      const dur = cur.durability ?? 100;
      if ((cur.states || []).includes('陷过泥')) care.push({
        act:'wash', icon:'wash', t:'去水渠边刷洗黑泥', c:'耗时10分 · 体力-2' });
      if (dur < 100) care.push({
        act:'mend', icon:'tool', t:'拿细铁丝和胶水修补',
        c:`耗时15分 · 体力-3 · 耐久+25%（眼下 ${dur}%）` });
      care.push({ act:'off', icon:'hanger', t:'先脱下来搁屋里', c:`${name}位就空着` });
    }

    this.setSheet(`
      <div class="sh-title">随身行头 · ${name}</div>
      <div class="sh-sub">${cur
        ? `这会儿在身上的：${cur.name}`
        : `${name}位空着 —— 手上有能上身的就换上`}</div>
      <div class="sh-sec">这一格能上身的</div>
      ${rows.join('') || `<p class="wear-q">这一格还没有能上身的家什。</p>`}
      ${care.length ? `<div class="sh-sec">打理</div>
        <div class="care-list">${care.map(c => `<button class="care" data-care="${c.act}">
          <span class="care-ic">${UIRenderer.svg(c.icon, 15)}</span>
          <span class="care-t">${c.t}</span>
          <span class="care-c">${c.c}</span></button>`).join('')}</div>` : ''}
      <button class="sh-btn ghost" id="sheetClose">收起来</button>`);

    this.el.sheet.querySelectorAll('[data-wear]').forEach(btn => {
      btn.onclick = () => {
        // 正穿着的那一行，按钮是「脱下来」——
        // 不接这根线的话它就是颗点不动的死键，比没有还气人。
        if (btn.closest('.wear').classList.contains('on')) {
          if (this.takeOff(slot)) this.afterGearChange(slot, null);
          return;
        }
        const id = btn.dataset.wear;
        if (id === this.data.starterGear.id) this.wearStarter();
        else if (!e.equip(id)) return this.toast('这件上不了身');
        this.afterGearChange(slot,
          `换上了${e.state.player.equipment[slot]?.name || ''}。`);
      };
    });
    this.el.sheet.querySelectorAll('[data-care]').forEach(btn => {
      btn.onclick = () => {
        const act = btn.dataset.care;
        if (act === 'off') {
          if (this.takeOff(slot)) this.afterGearChange(slot, null);
          return;
        }
        const it = e.state.player.equipment[slot];
        if (!it) return this.toast('这儿身上什么都没有');
        if (act === 'wash') {
          e.advanceTime(10);
          e.changeStamina(-2);
          // 泥洗掉了：身上那枚「陷过泥」的标签换成「微潮」。
          // 只动这一件东西自己 —— 田况里那条「走泥路慢一半」不撤，
          // 那是这双薄底鞋的账，不是泥的账。
          it.states = ['微潮'];
          e.pushEvent('sys', UIRenderer.WASH_TEXT);
        } else {
          e.advanceTime(15);
          e.changeStamina(-3);
          it.durability = Math.min(100, (it.durability ?? 100) + 25);
          e.pushEvent('sys', `你找了段细铁丝，蘸着胶水把${it.name}开线的地方一点点抿平，`
            + `搁在窗台上晾着。眼下耐久 ${it.durability}%。`);
        }
        this.afterGearChange(slot, null);
      };
    });
    this.el.sheet.querySelector('#sheetClose').onclick = () => this.closeSheet();
  }

  /** 把那件东西脱下来搁屋里。挂在它身上的词条跟着撤（见引擎 sweepModifiers）。
   *  这儿只管把状态改掉 —— 接下来该重画哪一屏，
   *  从整备单里脱跟从藏品册里卸不是一回事，交给上头决定。 */
  takeOff(slot) {
    const e = this.engine, it = e.state.player.equipment[slot];
    if (!it) return null;
    this.stash[slot] = it;
    e.state.player.equipment[slot] = null;
    e.sweepModifiers();
    e.pushEvent('sys', `你把${it.name}脱下来搁在屋角。${SLOT_NAMES[slot]}位就空着。`);
    return it;
  }

  /** 刷鞋那一句话。作者给的原文，一个字没动。
   *  它进的是叙事区，不是动作卡 —— 动作卡上的字有测试逐字对着，
   *  这一句只在人真去洗的时候才出现。 */
  static WASH_TEXT = '你蹲在渠口拿稻草把鞋帮上的黑泥刷掉，水冰凉，鞋里总算清爽了。';

  /** 换完 / 打理完，把该重画的重画一遍，再把单子按新样子开一次。 */
  afterGearChange(slot, note) {
    this.renderAll();
    this.renderDrawer();          // 田况那一屏在抽屉里，也一起换新的
    this.openEquipSheet(slot);
    if (note) this.toast(note);
  }

  /** 把开局那双运动鞋穿回去。引擎的 equip() 只认藏品册里的编号，
   *  shoe0 不在册子上（findRelic 找不到它），所以这一件得视图自己放回去 ——
   *  脱下来的那一双存在 this.stash 里，穿回去还是原来那双。 */
  wearStarter() {
    const g = this.data.starterGear;
    const kept = this.stash.feet?.id === g.id ? this.stash.feet : null;
    this.engine.state.player.equipment.feet = kept
      ? { ...kept, effect: { ...kept.effect } }
      : { ...g, states: [], effect: { ...g.effect } };
    this.engine.sweepModifiers();
    return true;
  }

  /* ② 日程与农时 */
  renderScheduleTab(box) {
    const e = this.engine, st = e.state, term = e.currentTerm;
    const total = term.days * 24 * 60;
    const elapsed = (st.time.day - 1) * 24 * 60 + st.time.minutes;
    const left = Math.max(0, total - elapsed);
    const next = this.data.solarTerms[
      (st.time.solarTermIndex + 1) % this.data.solarTerms.length];
    const now = e.currentDecision(), late = e.overdueDecisions();

    box.innerHTML = `
      <h3>农时窗口</h3>
      <div class="clock">
        <div class="clock-t">距【${next.id}·${next.taskWindow}】开始<br>
          <b>${Math.floor(left / 60)} 小时 ${left % 60} 分</b></div>
        <div class="bar"><i style="width:${Math.round(elapsed / total * 100)}%"></i></div>
        <div style="font-size:12.5px;color:var(--dim);margin-top:7px">
          ${term.id} 第 ${st.time.day} / ${term.days} 天 · 这个节气的事：${term.work}</div>
      </div>
      <h3>备忘录</h3>
      ${now ? `<div class="memo soon">【${now.solarTerm}·${now.screenName}】还没定。
        这一步定下去，秋后才见账。</div>` : ''}
      ${late.map(d => `<div class="memo soon">【${d.solarTerm}·${d.screenName}】拖过了，还欠着。</div>`).join('')}
      ${(!now && !late.length) ? '<div class="memo done">到这会儿的正事都定了</div>' : ''}
      ${st.flags.presaleOwed
        ? '<div class="memo soon">欠着一百份预售的米。秋天交不出来，钱得退。</div>' : ''}
      ${st.player.stress >= 60 ? '<div class="memo soon">压力快到顶了。找个地方歇一歇。</div>' : ''}
      <div class="memo">镇上粮站挂着今年的收购价。</div>`;
  }

  /* ③ 人物 */
  /** 圆形头像里放什么：老周是姓，两位同窗是自己名字末尾那个「A」「B」。
   *  两个同窗全程去性别化 —— 头像也得是字母，不能是头像剪影。 */
  static avatarOf(n) {
    if (n.id === 'zhou') return n.name.slice(-1);
    const m = n.name.match(/[A-Z]$/);
    return m ? m[0] : n.name.slice(0, 1);
  }

  renderPeopleTab(box) {
    // 好感度是 -100 ~ +100 的两极条（引擎那边起始 0）。
    // 底数写成常数，免得三处各写一个 100。
    const OPINION_MAX = 100;
    /** 好坏只看「正负」，浓淡看「多少」—— 三档色 */
    const tint = v => v >= 30 ? 'var(--green)' : v < 0 ? 'var(--bad)' : 'var(--warn)';

    box.innerHTML = '<h3>人物关系</h3>' + this.data.npcs.map((n, i) => {
      const s = this.engine.state.npcs[n.id];
      const stage = s.opinion >= 60 ? '能开口求事' : s.opinion >= 30 ? '说得上话'
                  : s.opinion >= 0 ? '点头之交' : s.opinion > -30 ? '不太待见你' : '躲着你走';
      const color = tint(s.opinion);
      // 条子从中线往一边长。正的长右边，负的长左边 ——
      // 半格就是对满 100（不是整格）：+100 正好顶到右端，
      // 写成整格的话 +100 会长出条子外头去。
      const pct = Math.min(50, Math.abs(s.opinion) / OPINION_MAX * 50).toFixed(1);
      const barSide = s.opinion >= 0
        ? `<i class="opi-fill p" style="width:${pct}%"></i>`
        : `<i class="opi-fill m" style="width:${pct}%"></i>`;
      return `<div class="npc">
        <div class="npc-h">
          <div class="npc-av c${i % 3}">${UIRenderer.avatarOf(n)}</div>
          <div class="npc-hd">
            <div class="npc-n">${n.name}</div>
            <div class="npc-r">${n.role}</div>
          </div>
          <div class="npc-o" style="color:${color}">${s.opinion >= 0 ? '+' : ''}${s.opinion}</div>
        </div>
        <div class="opi">
          <div class="opi-mid"></div>${barSide}
        </div>
        <div class="opi-foot"><span>-100</span><span>0</span><span>+100</span></div>
        <div class="npc-d">${stage}${s.hooks
          ? ` · 人情筹码 ${s.hooks}` : ''}</div>
        <div class="npc-d">${n.voice}</div>
        <div class="npc-log">
          ${s.opinionLogs.length
            ? s.opinionLogs.map(l => `<div><span>${l.reason}</span>
                <b style="color:${l.delta >= 0 ? 'var(--ok)' : 'var(--bad)'}">
                ${l.delta >= 0 ? '+' : ''}${l.delta}</b></div>`).join('')
            : '<div><span>还没有来往</span><b></b></div>'}
        </div></div>`;
    }).join('');

    box.querySelectorAll('.npc').forEach(el => {
      el.querySelector('.npc-h').onclick = () => el.classList.toggle('open');
    });
  }

  /* ④ 藏品册 */
  renderRelicTab(box) {
    const owned = this.engine.state.player.relics;
    box.innerHTML =
      `<h3>藏品册 ${owned.length} / 36</h3><div class="relics" id="relicGrid"></div>`;
    const grid = box.querySelector('#relicGrid');

    for (const r of this.data.relics) {
      const has = owned.includes(r.id);
      const el = document.createElement('div');
      el.className = 'relic' + (has ? '' : ' lock') +
                     (this.selectedRelic === r.id ? ' sel' : '');
      // 类别次序照 relics 自己的排列（见 GameData 的注释）：
      // 免灾 01–06、免代价 07–12、换信息 13–18、换人情 19–24、换钱 25–30、顶货 31–36。
      // 一格一个色调，翻册子时一眼能看出是哪一路。
      el.dataset.cat = String(Math.floor((Number(r.id) - 1) / 6));
      // 角上挂个编号。没到手的那格也挂 —— 缺的是第几号，本来就该看得见。
      el.innerHTML = `<div class="relic-no">${r.id}</div>
                      <div class="relic-n">${has ? r.name : '？？'}</div>
                      <div class="relic-c">${has ? r.category : '未到手'}</div>`;
      if (has) el.onclick = () => {
        this.selectedRelic = this.selectedRelic === r.id ? null : r.id;
        this.renderRelicTab(box);
      };
      grid.appendChild(el);
    }

    const sel = this.selectedRelic ? this.engine.findRelic(this.selectedRelic) : null;
    if (sel) {
      const d = document.createElement('div');
      d.className = 'relic-d';
      // 带槽位的东西在详情卡底下多一颗按钮：不用再绕回田况那一屏去换。
      // 已经穿着的那件，按钮变成「已穿戴在身 · 卸下」。
      const slot = sel.slot;
      const on = !!slot && this.engine.state.player.equipment[slot]?.id === sel.id;
      const wear = slot ? `<button class="sh-btn wear-btn${on ? ' on' : ''}"
          data-wear="${sel.id}" data-slot="${slot}">${
          on ? UIRenderer.svg('tick', 13) + '已穿戴在身 · 卸下'
             : UIRenderer.wearLabel(slot)}</button>` : '';
      d.innerHTML = `<div class="t">${sel.id} ${sel.name}
          <em>${sel.category}类${
            slot ? ' · 可穿戴：' + SLOT_NAMES[slot] : ''}</em></div>
        <div>${sel.quote}</div>
        <div class="q">来历：${sel.origin}</div>
        ${sel.effect?.desc ? `<div class="e">${UIRenderer.svg('tick', 13)}${sel.effect.desc}</div>` : ''}
        ${wear}`;
      if (slot) d.querySelector('[data-wear]').onclick = () => {
        if (on) this.takeOff(slot);
        else if (!this.engine.equip(sel.id)) return this.toast('这件上不了身');
        this.renderAll();
        this.renderRelicTab(box);
      };
      grid.appendChild(d);
    }
  }

  /* ── 决策层：CK3 式三选一 ───────────────────────────────────
     一屏决策原来要翻两页：先在一串选项里点一下，**整页换掉**，
     看完检定再点「退回去」回到那一串 —— 想比一比两条路，
     就得来回翻四趟。人在田埂上做决定不是那么做的。
     现在是一卷摊开的手风琴：三个选项一直在纸上，
     点哪一条，哪一条**就地张开**（成功率的罗盘、加减的账、翻车的后果），
     张开的底下就是【拍板定下】。同一时间只张一条 ——
     两条一起张，屏上就有两处「要不要」在抢人。
     换一条张，张开的这条自己收回去，选中状态（.on）跟着挪。 */
  openDecisionSheet(activeId = null) {
    const d = this.engine.currentDecision();
    if (!d) return this.toast('这会儿没有要定的事');
    this.sheetDecision = d;

    const rows = d.options.map(o => {
      const blocked = this.engine.describeBlocker(o);
      const panel = o.check ? this.engine.resolveCheck(o.check) : null;
      const bits = UIRenderer.costs(o);
      if (panel) bits.push(`<span class="bit chk">把握 ${panel.chance}%</span>`);
      else if (UIRenderer.ledger(o.onSuccess)) bits.push(
        `<span class="bit chk">${UIRenderer.ledger(o.onSuccess)}</span>`);
      // 张不张开：按 id 认。锁着的那条永远张不开（点不动）。
      const open = !blocked && o.id === activeId;
      // .act-body 这一层不能省，跟 actionButton 那边是同一个道理：
      // .act 是 flex 行，标题 / 开销 / 说明要是直接当它的孩子，
      // 就会**并排**摊成三栏 —— 读出来是「用自家留的种｜耗时3小时｜晒一天…」。
      // 测试逮不着这个（DOM 都在、字都在），只有拿眼睛看才发现。
      return `<div class="act opt${blocked ? ' locked' : ''}${open ? ' on' : ''}"
          data-option="${o.id}">
        <div class="act-body">
          <div class="act-main">${o.label}${open ? '' :
            `<span class="opt-chev">${UIRenderer.svg('chev', 11)}</span>`}</div>
          <div class="act-sub">${bits.join('')}</div>
          <div class="act-note">${o.detail}</div>
          ${blocked ? `<div class="act-why">${blocked}</div>` : ''}
          ${open ? this.optionDetail(d, o) : ''}
        </div></div>`;
    }).join('');

    this.setSheet(`
      <div class="sh-title">${d.solarTerm} · ${d.screenName}</div>
      <div class="sh-sub">${d.brief}</div>
      <div class="sh-body">${UIRenderer.paragraphs(d.story)}</div>
      <div class="sh-sec">这一步怎么走 · 点开看把握</div>
      ${rows}
      <button class="sh-btn ghost" id="sheetClose">再想想</button>`);

    this.el.sheet.querySelectorAll('[data-option]').forEach(el => {
      if (el.classList.contains('locked')) return;
      el.onclick = ev => {
        // 张开的这一条里头有它自己的按钮（拍板 / 收起详情），
        // 那几下自己接线，别再弹回这一层重画一遍 ——
        // 不然「拍板」刚把结果屏摆上来，紧接着又被这一屏盖回去。
        if (ev.target.closest && ev.target.closest('.opt-d')) return;
        const id = el.dataset.option;
        this.openDecisionSheet(id === activeId ? null : id);   // 再点一下就是收起来
      };
    });
    this.el.sheet.querySelector('#sheetClose').onclick = () => this.closeSheet();

    // 张开的那一条里那两个按钮（拍板 / 收起详情）接线。
    // 跟上面那一圈分开摆，是因为这两个 id 只在**张开**的时候才存在。
    const opened = activeId
      ? d.options.find(o => o.id === activeId && !this.engine.describeBlocker(o)) : null;
    if (opened) this.wireOptionDetail(d, opened);

    // 张开了的那一条得在眼前：一屏放不下三个选项加一整套账的时候，
    // 不推这一把，人只会看到自己刚点的那个标题，账在屏外头。
    const on = this.el.sheet.querySelector('.act.on');
    if (on && typeof on.scrollIntoView === 'function') {
      try { on.scrollIntoView({ block:'nearest' }); } catch (err) { /* 老浏览器不认参数 */ }
    }
  }

  /* ── 选项详情：就地张开的那一整块 ───────────────────────────
     它不是单独一屏了，是手风琴张开的那一节（.opt-d）。
     但**接口没变**：openOptionDetail(decision, o) 还能照老样子调 ——
     谁在外面用它，都还是「把这一条摊开给人看」。 */
  openOptionDetail(decision, o) {
    this.openDecisionSheet(o?.id);
  }

  /** 一条路摊开来的那一节：它是什么、成功率怎么算的、翻车会怎样。
   *  底下那颗【拍板定下：XXX】和旁边那颗轻量的「收起详情」，
   *  是两个**同时挂在页面上**的 id —— 收起详情那颗不是装饰，
   *  它就是原来那句「退回去」的位置：手风琴收起来，回到三选一那一屏。 */
  optionDetail(decision, o) {
    let html = '<div class="opt-d">';
    if (o.hinge) html += `<div class="opt-hinge">${o.hinge}</div>`;
    if (o.pitch) html += `<div class="sh-body opt-pitch">${UIRenderer.paragraphs(o.pitch)}</div>`;

    if (o.check) {
      const panel = this.engine.resolveCheck(o.check);
      const cls = panel.chance >= 75 ? '' : panel.chance >= 50 ? 'mid' : 'low';
      // 那只罗盘靠 --p 转指针：走到百分之几，就是成功率百分之几。
      html += `<div class="sh-sec">检定 · ${panel.name}</div>
        <div class="chk-big">
          <div class="chk-num ${cls}" style="--p:${panel.chance}"><span>${panel.chance}%</span></div>
          <div class="chk-lbl">掷一颗 d100，掷出不超过这个数就算过<br>
            底子 <b>${panel.baseChance}</b>，底下每一笔加减都摊开了</div></div>
        <div class="chk-row base"><span>基础成功率</span><b>${panel.baseChance}%</b></div>`;
      // 加上了的正常列，没加上的一律灰着、写明差在哪 ——
      // 原来没加成的只写「没加成」，看不出到底是没这个条件还是条件不够。
      for (const m of panel.entries) {
        if (m.applied > 0) {
          html += `<div class="chk-row"><span>${m.source}</span>
            <b class="p">+${m.applied}%</b></div>`;
        } else {
          const why = m.global ? '缺一条' : '未持有 / 未达标';
          html += `<div class="chk-row off"><span>${m.source}
            <span class="mk">· ${why}</span></span><b class="m">${
              m.applied < 0 ? m.applied + '%' : '0'}</b></div>`;
        }
      }
      html += `<div class="sh-sec">万一不过</div>
        <div class="chk-row risk"><span>${(o.check.onFailText || '').split('\n')[0]}</span>
          <b>${UIRenderer.ledger(o.check.onFail) || '—'}</b></div>`;
    } else {
      html += `<div class="sh-sec">这一步干了什么</div>
        <div class="chk-row"><span>这一步的账</span>
          <b>${UIRenderer.ledger(o.onSuccess) || '不亏不赚'}</b></div>
        ${UIRenderer.modifierRows(o.onSuccess)}`;
    }

    html += `<div class="opt-go">
        <button class="sh-btn" id="sheetGo">拍板定下：${o.label}</button>
        <button class="sh-btn ghost" id="sheetBack">收起详情</button>
      </div></div>`;
    return html;
  }

  /** 那一节接上电。跟 openDecisionSheet 分在两处摆：
   *  手风琴每次重画都要重接一次线，写在一块儿容易漏。 */
  wireOptionDetail(decision, o) {
    const go = this.el.sheet.querySelector('#sheetGo');
    if (go) go.onclick = () => {
      const r = this.engine.chooseDecision(decision.id, o.id);
      if (r.error) return this.toast(r.error);
      this.closeSheet();
      this.renderAll();
      this.flashDiorama('定了。');
      this.showCheckResult(`${decision.solarTerm}·${decision.screenName} · ${o.label}`,
                           r.check, r.effect, r.text);
    };
    const back = this.el.sheet.querySelector('#sheetBack');
    if (back) back.onclick = () => this.openDecisionSheet(null);   // 收起详情，回到三选一
  }

  /* ── 预售层 ───────────────────────────────────────────────── */
  openPresaleSheet() {
    const p = this.data.presale;
    this.setSheet(`
      <div class="sh-title">新米预售</div>
      <div class="sh-sub">同学B 出的主意 · 一百份，一份五十</div>
      <div class="sh-body">${UIRenderer.paragraphs(p.intro)}</div>
      <div class="sh-sec">挂多少</div>
      ${p.options.map(o => `<div class="act" data-presale="${o.id}">
        <div class="act-body"><div class="act-main">${o.label}</div>
        <div class="act-sub"><span class="bit">${o.detail}</span></div></div></div>`).join('')}
      <button class="sh-btn ghost" id="sheetClose">先不提这事</button>`);

    this.el.sheet.querySelectorAll('[data-presale]').forEach(el => {
      el.onclick = () => {
        const o = this.engine.takePresale(el.dataset.presale);
        this.closeSheet();
          this.renderAll();
        this.showCheckResult('新米预售 · ' + o.label, null, o.onSuccess, o.onSuccessText);
      };
    });
    this.el.sheet.querySelector('#sheetClose').onclick = () => this.closeSheet();
  }

  /* ── 结果层 ───────────────────────────────────────────────── */
  showCheckResult(title, check, effect, text) {
    let html = `<div class="sh-title">${title}</div>`;
    if (check) {
      html += `<div class="sh-sub">检定 · ${check.name}</div>
        <div class="chk-big">
          <!-- 这只罗盘这回指的是掷出来的点数：指针停在 68，就是掷出了 68 -->
          <div class="chk-num ${check.passed ? '' : 'low'}"
               style="--p:${check.d100}"><span>${check.d100}</span></div>
          <div class="chk-lbl">掷出 ${check.d100}，要不超过 ${check.chance} ——
            <b class="p" style="color:${check.passed ? 'var(--ok)' : 'var(--bad)'}">
              ${check.passed ? '过了' : '没过'}</b></div>
        </div>`;
    }
    html += `<div class="sh-body">${UIRenderer.paragraphs(text)}</div>`;
    if (UIRenderer.ledger(effect)) {
      html += `<div class="chk-row"><span>这一步的账</span>
        <b>${UIRenderer.ledger(effect)}</b></div>`;
    }
    html += UIRenderer.modifierRows(effect);
    html += `<button class="sh-btn" id="sheetClose">知道了</button>`;
    this.setSheet(html);
    this.el.sheet.querySelector('#sheetClose').onclick = () => this.closeSheet();
  }

  /** 每张弹层顶上那条把手，统一在这儿加 —— 三个 open* 各写一遍容易漏。
   *  宽屏上弹层是个居中对话框，那条把手就没意义了，CSS 里收掉。 */
  setSheet(html) {
    this.el.sheet.innerHTML = `<div class="sh-grab"></div>` + html;
    this.el.modal.className = 'on';
  }
  closeSheet() { this.el.modal.className = ''; }
}

/* ============================================================================
   ◆ BOOT —— 引导：把 DOM 和引擎接起来
   ============================================================================ */
const engine   = new GameEngine(GameData);
const renderer = new UIRenderer(engine, GameData, document.getElementById('phone'));
renderer.mount();
</script>
</body>
</html>
