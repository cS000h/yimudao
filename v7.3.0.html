================================================================================
  一亩稻 v7.3.0 —— 移动端竖屏重构骨架
  Intent → Spec → Implementation · 第一步
================================================================================

  这一版交付的是【架构骨架 + 四个标杆闭环的数据】，不是完整游戏。

  ── 三层解耦 ─────────────────────────────────────────────────
  按 spec，从这一版起游戏拆成三层，中间不许串门：

    GameData     纯配置。只有数据，没有逻辑，没有 DOM
    GameEngine   纯逻辑。不碰 document / window / localStorage
    UIRenderer   只干一件事：读 GameEngine 的状态，画到屏幕上

  前两层可以原样复制进 Cocos Creator 的 .ts 文件（补上 export 就行）。
  自查办法：把 ◆ VIEW 以上抠出来，搜 document / window / localStorage
  这三个标识符（属性名和字符串不算），应该一个都没有。

  ── 命名约定 ─────────────────────────────────────────────────
  接口上的名字（GameState、ActionOption 的字段，moveTo / executeAction
  这些方法名）一律照 spec 走英文，为的是搬 TypeScript 时能一一对上。
  文案、地名、人名、注释照旧是中文；函数名、参数名、变量名一律英文，
  连 C:\tmp\ymd7\ 下面那几个自查脚本也一样。

  ── 段落标记 ─────────────────────────────────────────────────
    ◆ DATA  ◆ ENGINE  ◆ VIEW  ◆ BOOT

  ── 文案来源（分三路，别混） ─────────────────────────────────
  ① 照抄总表，一个字没动 —— 已逐字校验
      36 件藏品的 name / quote / origin      ← 藏品模块全量修订 01-36
      11 屏决策的屏名、brief、story、选N 的按钮文案、
        关、说、result、锁说                  ← 4-农事决策.md
      11 个节气名、5 个地点名、3 个人的名字和身份
      校验：C:\tmp\ymd7\check-relics.mjs    （108 项）
            C:\tmp\ymd7\check-decisions.mjs （253 项，11 屏全在）

      立夏到秋分这八屏是 build-decisions.mjs 从源表里机器抄的，
      人没经手，所以不会错字；重跑一次是替换，不会叠成两份。

  ② 重构时新写的过渡文案，等作者过目
      地点描述 5 句、人物嗓音 3 句、动作回执 19 句、两位同窗的在场
      与互动、压力失控旁白 3 句、夏至那屏的 story、13 条决策的 onFailText。
      每一处上面压了一行注释写着「不是总表里的」，搜这句能全找到。

  ③ 这一版我配的数值，也等作者过目
      藏品的 effect、检定的 baseChance 与各项加成、动作的耗时耗力、
      以及 26 个决策选项各自的加减账。

  文件里另有 1 处写着【待作者过目】的（镇上那双高筒黑胶鞋），
  是我留给作者的问题，不是总表原文 —— 搜这四个字就能找到。

  ── 自查 ─────────────────────────────────────────────────────
  C:\tmp\ymd7\ 下十一个脚本，共 1462 项，全绿（跑 check-all.mjs 一次全过）：
    check-boundary.mjs   红线：◆ VIEW 以上那一块，哈希对得上一个字没动
    check-engine.mjs     把 ◆ VIEW 以上抠出来单独在 node 里跑（235 项）
    check-disaster.mjs   灾年那一套：抽牌 / 四段报 / 灾警屏 / 季末印字（158 项）
    check-ui.mjs         整份 HTML 丢进 jsdom，照真人那样点（206 项）
    check-emoji.mjs      去 AI 感：屏幕上不许再有一个彩色 emoji（90 项）
    check-skin.mjs       新皮：田头视窗 / 朱砂印 / 邮戳 / 路牌 / 罗盘（164 项）
    check-relics.mjs     36 件藏品逐字对源表（108 项）
    check-decisions.mjs  11 屏决策逐字对源表（253 项）
    check-gen.mjs        生成器自己产出的东西逐字对源表（248 项）
  另有两个扫描器，各扫一遍「代码区还有没有汉字」：
    scan-html.mjs  扫这一份的 <script> 段   scan-ids.mjs  扫 C:\tmp\ymd7\*.mjs
  图标表那一项是数出来的：ICONS 里每多一枚，emoji 那本账就多两条

  check-ui.mjs 认一个 UID_SEED=123 的环境变量：引擎的掷点默认是

  ── 外皮 ─────────────────────────────────────────────────────
  换过四回皮。
  第一回（v7.0.0）：深灰绿底的一整套。能跑，但满屏二十几个半透明圆角框、
  胶囊标签、彩色 emoji —— 看着像加密币看板，不像一亩田。
  第二回（v7.1.0）：推倒重来。
    · 色：暖阳棉宣纸底 + 钢笔淡彩。朱砂（印章、急件）、秧绿、赭黄、
      渠水蓝四色点缀，之外一律是纸和墨。
    · 字：宋体走正文与标题，等宽体只给数字（耗时、斤两、成功率）。
    · 图：**一个彩色 emoji 都不留**，全部换成 20×20 的单色线条 SVG，
      走 UIRenderer.svg(name)。图标表见 UIRenderer.ICONS。
      注：GameData.weather 那五个 icon 字段是彩色 emoji，数据层不许动，

    · 田头视窗 #diorama：一条横截面。天光（晴/风/雨/毒日头）
      归 CSS，山、田埂、水、稻苗、人物剪影归 renderDiorama() 画。
      苗按 solarTermIndex 分十一档：谷雨露头 → 大暑封行 → 立秋抽穗 →
      秋分低头的金黄。五个地点各有一处剪影（田埂水口 / 砖房冒热气 /
      白牌子 / 老槐树 / 集市幡旗）。
    · 框套框全拆了：顶栏去卡片化（一行印 + 一行被双细线夹住的读数）、
      叙事区去黑框（.said 走朱砂细竖线）、动作是纸条（左 3px 色标：
      秧绿=平常、渠水蓝=带检定、朱砂=要紧事）、带检定的右肩盖一枚
      双圈邮戳写「把握」，检定详情是一只罗盘 + 一本虚线对齐的加减账。
    · 路牌 #navbar：五处之间一条淡淡虚线，当前那处用红笔圈出来。
  第三回（v7.2.0）：配色一枚像素没改，改的是「一屏怎么读」。
    · 当务之急那条横幅（#duty）贴在 #sceneHead 底下，四档次序：
      灾警 ＞ 该定还没定 ＞ 鞋陷了泥 ＞ 平常。
    · 叙事区拆成「一小片焦点 + 一本流水」：#narr 只留刚出来的那几条
      （FOCUS_MAX，现设 3），更早的进 [往期手记 (N)]（peekEvents(80)），
      主屏自己不滚。
    · 动作区：最多一张全宽的字条（决策或灾警），其余两栏格纸（宽屏三栏）。
      轮不到的压扁、虚线、半透明，收在「这会儿还轮不到」底下。
    · 决断卷（#modal / #sheet）：居中、92% 宽封顶 520，点开的这一条
      就地张开（罗盘 / 加减账 / 万一不过的后果与账目），末尾「拍板定下」；
      #sheetGo 与 #sheetBack 同时在 DOM 里，好让脚本找得到。
    · 行头能上手了：田况那四格点开是整备单，同槽位的藏品都能换
      （没藏品时把开局的运动鞋摆回来）；陷过泥的能去渠口刷，开线的能补。
      全在视图层改 state.player.equipment 和 states[]，账走引擎的
      changeStamina / advanceTime。
    · 顶栏的数字是「变」出来的：一动就飘一颗小字（绿=进账、朱砂=出血、
      赭金=花钱、灰=时间），田头视窗跟一记半秒的涟漪、稻苗摇两下，
      人物头顶起一颗 1.5 秒的气泡。顶栏那三个数还取了一次整 ——
      引擎压力按 0.35 的系数加（changeStress(actual * 0.35)），
      不取整敢印「2.6999999999999997」。
  第四回（v7.3.0，就是本版）：配色骨血仍是那套纸与墨，改的是「一屏怎么读」。
    · 开局仪式（#introOverlay）：进游戏头一眼是这一层 —— 大标题《一亩稻》、

      动手。」（逐字），底下把这一局抽到的年景底牌掀开（好年景一道金光斜扫，
      灾年牌压一圈朱砂，`color 'd'` 认的是年景表里那个字段），
      最底下一颗大按钮【记下了 · 下田（开始谷雨）】。顶栏留了枚「年景」
      （#yearBtn，一枚 book 图标），随时能把它原样喊回来重看。
      这一层从头到尾没碰引擎：开也好关也好，game 都还站在谷雨头一天 ——
      它是纯覆盖，jsdom 里对底层按钮的 .click() 一概不挡。
      （底牌上的字全由 syncIntro() 从年景表里拿，视图不编一个字。）
    · 动作区分三班（.mainline / .act-grid / .shutbar）：
      ① 主线横幅 —— 灾警与农时要务整行的大卡，左肩一枚节气朱印

<style>
/* ── 外皮 v4：暖纸手账 × 精致化重制（v7.3.0）─────────────────────
   前三回的皮：深灰绿后台 → 暖棉纸手账 → 一屏读法。
   这一回不动配色骨血（朱砂印泥 / 秧苗青 / 稻谷赭 / 渠水蓝，纸与墨），
   动的是三件事：

   一、开局有仪式。进游戏先落一层 #introOverlay：大标题、站里的落款、
       老周那句「来了就先看。别急着动手。」，底下把这一季抽到的
       年景底牌掀开（好年景走金光，灾年底牌压一圈朱砂）。看完了，
       按【记下了 · 下田】才落田。顶栏上留着一枚「年景」，随时重看。

   二、主次分开。动作区（#actions）分三班：
       ① .mainline —— 灾警与农时要务的整行大卡。左边一枚节气印，
          右下角一颗【去拍板 ▸】；深松绿衬底、朱砂描外、赭金压里，
          双层细线，跟一摞寻常活计拉开辈分。
       ② .act-grid —— 这个地儿寻常能干的事，两列清爽格子。
       ③ .shutbar —— 轮不到的（.locked）收进底下一条折叠带，默认合着。
       （.act / .act-body / .act-badge / .locked 这些名字一个没动——
        check-ui 与 check-skin 认的就是它们。）

   三、宽屏不再有常驻抽屉。v7.2.0 在 ≥1024px 把抽屉摆成右栏，
      人在电脑上看到的永远是一条竖着的面板，田中央反倒只剩一半。
       现在：≥520px 就是一张深色木案上摆一摞纸——#phone 居中、
       92vh 高、宽不超 480px；抽屉**任何宽度**都由顶栏 [☰ 状态]
       从左侧滑出。1024 那一档只剩桌面上的细节（滚动条、圆角、
       字距），跟 JS 里 UIRenderer.isWide() 还是同一个数。

   层级照旧靠「纸的深浅 + 一层层影子」，不靠框套框：
   浮起的是 --paper-card，凹下去的是 --paper-sunken，
   影子分三档 --sh-1 / --sh-2 / --sh-3，纸面上再补一道细白的
   内高光（--sh-glint），像光斜着落在纸边上。

   字：正文 15.5~16.5px、行高 1.75 起（叙事页 1.9）；UI 小字不再
   往 9~11px 里挤——最小一档 11.5px，常规读数 12.5px 起。
   宋体只留给标题、叙事、印章；数字一律等宽。 */
:root{
  /* 桌面木案与纸张层级 */
  --wood-1:#2a1f15;
  --wood-2:#171009;
  --paper:#f4efe6;
  --paper-card:#fbf7f0;
  --paper-sunken:#ebe4d7;
  --line:#d9cfbe;
  --line-dark:#b7a992;

  /* 墨色层级 */
  --ink:#2a241e;
  --ink-narr:#3a322b;
  --dim:#776c5f;
  --muted:#a59b8c;

  /* 植物与印泥点缀色 */
  --stamp-red:#c24632;
  --stamp-bg:rgba(194,70,50,.08);
  --sprout:#3d7a52;
  --sprout-bg:rgba(61,122,82,.10);
  --ochre:#b57c2c;
  --ochre-bg:rgba(181,124,44,.10);
  --water:#4a7c9b;

  /* 别名：旧名字留着，视图里有几处内联色还按老名字写。
     别名漏一个，那一处就静默地什么都没有 —— 宁可多留几行。 */
  --panel:var(--paper-sunken);
  --panel-elevated:var(--paper-card);
  --line-strong:var(--line-dark);
  --gold:var(--ochre);
  --gold-soft:var(--ochre-bg);
  --green:var(--sprout);
  --green-soft:var(--sprout-bg);
  --bad:var(--stamp-red);
  --bad-soft:var(--stamp-bg);
  --warn:var(--ochre);
  --blue:var(--water);
  --ok:var(--sprout);
  --paper-bg:var(--paper-card);
  --paper-border:var(--line);

  /* 影子三档 + 纸边细高光 */
  --sh-1:0 1px 2px rgba(42,36,30,.05), 0 2px 6px -4px rgba(42,36,30,.18);
  --sh-2:0 2px 5px -2px rgba(42,36,30,.14), 0 10px 26px -16px rgba(42,36,30,.34);
  --sh-3:0 18px 44px -20px rgba(24,18,12,.55), 0 6px 16px -10px rgba(24,18,12,.3);
  --sh-glint:inset 0 1px 0 rgba(255,255,255,.62);
  --sh-card:var(--sh-1);
  --sh-lift:0 3px 8px -4px rgba(42,36,30,.3), 0 14px 30px -20px rgba(42,36,30,.4);

  --radius:12px;
  --radius-sm:9px;

  --font-serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
  --font-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
              "Microsoft YaHei",sans-serif;
  --font-mono:"JetBrains Mono","SF Mono",Consolas,"Courier New",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:var(--wood-2);color:var(--ink);
  font-family:var(--font-sans);font-size:15.5px;line-height:1.75;overscroll-behavior:none}
body{display:flex;justify-content:center;align-items:stretch}

/* 单色线条图标：哪儿都不许出现彩色 emoji，能画的都在这儿画 */
.ic{display:block;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}

/* ── 手机壳：一屏放下，不许滚动 ─────────────────────────────── */
/* 底子三层：一层极淡的暖光、一层方格点阵（实习观察手记的那种纸）、底色本身。
   点阵是纯 CSS 画的，不引外部文件 —— 单文件得能离线打开。 */
#phone{width:100%;max-width:480px;height:100vh;height:100dvh;display:flex;
  flex-direction:column;overflow:hidden;position:relative;color:var(--ink);
  background:
    radial-gradient(ellipse at 50% -10%, rgba(214,196,160,.55), transparent 62%),
    radial-gradient(var(--line) .75px, transparent .75px),
    var(--paper);
  background-size:auto, 16px 16px, auto}

/* ── 顶栏：手账页眉 ─────────────────────────────────────────── */
/* 第一行是状态钮 + 节气印 + 钟点 + 年景 + 天气；第二行拿一道细线压住，
   体力 / 压力 / 经费 三个数摊在线上，像实验记录表的表头 ——
   一格一格的方框全部撤掉。 */
#topbar{flex:0 0 auto;padding:10px 13px 0;z-index:20;position:relative;
  background:linear-gradient(180deg, rgba(244,239,230,.97), rgba(244,239,230,.84));
  backdrop-filter:blur(8px) saturate(1.1)}
#topbar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:0;
  border-top:1px solid var(--line);border-bottom:2px double var(--line-dark)}
.tb-row1{display:flex;align-items:center;gap:8px}
#drawerBtn{flex:0 0 auto;display:flex;align-items:center;gap:5px;cursor:pointer;
  background:none;border:1px solid var(--line-dark);border-radius:8px;padding:5px 9px;
  color:var(--dim);font-family:var(--font-sans);
  transition:border-color .16s, color .16s, box-shadow .16s}
#drawerBtn:active{box-shadow:0 1px 3px -1px rgba(42,36,30,.3) inset}
#drawerBtn .ic{width:15px;height:15px}
.db-tx{font-size:12px;letter-spacing:1.5px}
.tb-time{flex:1 1 auto;min-width:0;display:flex;align-items:baseline;
  overflow:hidden;white-space:nowrap}
/* 节气：朱文方印。一屏里最先认出来的就是它。 */
.tb-term{font-family:var(--font-serif);font-size:15px;font-weight:700;letter-spacing:2px;
  color:var(--stamp-red);border:1.5px solid var(--stamp-red);border-radius:4px;
  padding:1px 7px 2px;flex:0 0 auto;transform:rotate(-1.5deg);
  background:var(--stamp-bg)}
.tb-clock{font-family:var(--font-mono);font-size:12.5px;color:var(--dim);letter-spacing:.2px;
  margin-left:9px;text-overflow:ellipsis;overflow:hidden}
/* 「年景」：开局仪式随时能重看 —— 一小卷书。 */
#yearBtn{flex:0 0 auto;display:flex;align-items:center;gap:4px;cursor:pointer;
  background:none;border:1px solid transparent;border-radius:8px;padding:5px 7px;
  color:var(--dim);font-family:var(--font-sans);
  transition:border-color .16s, color .16s}
#yearBtn .ic{width:14px;height:14px}
.yb-tx{font-size:12px;letter-spacing:1.5px}
#yearBtn:hover{border-color:var(--line-dark);color:var(--stamp-red)}
.tb-weather{flex:0 0 auto;display:flex;align-items:center;gap:5px;
  font-size:12.5px;color:var(--dim);white-space:nowrap}
.tb-weather .ic{width:16px;height:16px;color:var(--water)}

/* 三格读数：标签、条子、数字排成一行，中间不隔框 */
.tb-row2{display:flex;align-items:center;gap:13px;margin-top:8px;padding-bottom:9px}
.gauge{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:6px;white-space:nowrap}
.gauge-l{font-size:12px;color:var(--dim);letter-spacing:1px;flex:0 0 auto}
.gauge-h{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:6px}
.gauge-h b{font-family:var(--font-mono);font-size:15.5px;font-weight:700;color:var(--ink);
  line-height:1.2;flex:0 0 auto}
.gauge-u{font-family:var(--font-mono);font-size:12.5px;color:var(--dim);flex:0 0 auto}
/* 那点微光和颜色由 renderTopBar() 一起写进 style —— 光晕得跟圆点同色，
   写死在样式里就只能是 currentColor（墨色），跟红的绿的圆点对不上。 */
.gauge-dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:var(--muted)}
/* 条子是一根手画的刻度尺：底下衬一条点线，上面压一道实心 */
.gauge-bar{flex:1 1 auto;min-width:24px;height:5px;position:relative;overflow:hidden;
  border-radius:99px;
  background:repeating-linear-gradient(90deg, var(--line-dark) 0 1px, transparent 1px 6px)}
.gauge-bar i{display:block;height:100%;width:0;border-radius:99px;
  transition:width .35s ease, background .35s ease}
.gauge.money .gauge-h{justify-content:flex-end;gap:2px}

.buffs{display:flex;gap:6px;padding-bottom:8px;flex-wrap:wrap}
.buff{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;
  padding:3px 9px;cursor:pointer;white-space:nowrap;border-radius:6px;
  color:var(--sprout);background:var(--sprout-bg);
  border:1px solid rgba(61,122,82,.4);
  transition:background .16s, border-color .16s}
.buff::before{content:"";width:5px;height:5px;background:currentColor;
  flex:0 0 auto;transform:rotate(45deg)}
.buff.bad{color:var(--stamp-red);background:var(--stamp-bg);
  border-color:rgba(194,70,50,.45);animation:buffPulse 2.4s ease-in-out infinite}
@keyframes buffPulse{
  0%,100%{border-color:rgba(194,70,50,.32)}
  50%{border-color:rgba(194,70,50,.9)}}
@media (prefers-reduced-motion:reduce){
  .buff.bad{animation:none}
  .gauge-bar i{transition:none}
}

/* ── 舞台 ─────────────────────────────────────────────────── */
#stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}

/* ══════ 田头视窗：一亩稻田的横截面 ══════════════════════════
   80 像素高的一条，天、山、田、苗、人都在这儿 ——
   满屏都是字和框的时候，人是不会想点下去的。
   天光那几层是 CSS 画的（红日、雨丝、热浪），
   山水苗人是一张 SVG，viewBox 480×76、横向拉伸填满。 */
#diorama{flex:0 0 auto;position:relative;height:80px;overflow:hidden;
  border-bottom:1px solid var(--line)}
#diorama .dio{display:block;width:100%;height:80px}
#diorama .dio-rice{transform-box:fill-box;transform-origin:bottom center;
  animation:sway 6s ease-in-out infinite alternate}
@keyframes sway{from{transform:skewX(-1.1deg) translateY(0)}
  to{transform:skewX(1.4deg) translateY(-.6px)}}
/* 那一笔山水：颜色全走 var，跟纸面同一套色；
   一格一格的苗是引擎那边数出来的，这儿只管给它们上色。
   注：fill/stroke 写成**类**，不写成 fill="var(--x)" 那种属性 ——
   CSS 变量只在 CSS 属性里认，写在 SVG 属性上是不作数的。 */
.dio-far{fill:var(--line-dark);opacity:.22}
.dio-hill{fill:var(--line);opacity:.5}
.dio-water{fill:var(--water);opacity:.20}
.dio-ridge{stroke:var(--line-dark);stroke-width:1;fill:none}
.dio-sig{stroke:var(--line-dark);stroke-width:1.1;fill:var(--paper-card);
  stroke-linejoin:round}
.dio-mark{stroke:var(--dim);stroke-width:1;fill:none;stroke-linecap:round}
.dio-leaf{stroke:var(--sprout);fill:none;stroke-linecap:round;opacity:.92}
.dio-leaf.gold{stroke:var(--ochre)}
.dio-head{fill:var(--ochre);stroke:none}
.dio-head.green{fill:var(--sprout)}
.dio-man{fill:var(--ink);opacity:.5}
.dio-dots circle{fill:var(--dim);opacity:.75}
.dio-steam{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-linecap:round;
  animation:steam 3.4s ease-in-out infinite}
@keyframes steam{from{opacity:.25;transform:translateY(1.5px)}
  to{opacity:.75;transform:translateY(-2.5px)}}
@media (prefers-reduced-motion:reduce){.dio-steam{animation:none;opacity:.5}}
/* 天光：晴是暖米黄衬一轮红日，雨是微青灰，毒日头压一层热浪 */
.dio-sunny{background:linear-gradient(180deg,#f6e6c4,#f2ecdd 72%)}
.dio-sunny::before{content:"";position:absolute;right:12%;top:9px;width:17px;height:17px;
  border-radius:50%;background:radial-gradient(circle,#d9704f 0 55%,rgba(217,112,79,.28) 58% 100%)}
.dio-windy{background:linear-gradient(180deg,#efe9d9,#f1ecdf 72%)}
/* 刮风的几道风丝。角度要**贴近 0**，条纹才是横着走的 ——
   写成 96deg 出来的是竖线，一条一条立着，看着像栅栏，还像下雨。
   横着的才读得出「风从西边渠上过来」。 */
.dio-windy::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(4deg,
    rgba(120,110,98,.15) 0 1px, transparent 1px 34px);
  animation:gust 7s linear infinite}
@keyframes gust{from{transform:translateX(-34px)}to{transform:translateX(0)}}
.dio-rain{background:linear-gradient(180deg,#dfe3e2,#eeeae0 72%)}
.dio-rain::after{content:"";position:absolute;inset:-20% 0 0;pointer-events:none;
  background:repeating-linear-gradient(74deg, rgba(74,124,155,.34) 0 1px, transparent 1px 13px);
  animation:rainfall 1.1s linear infinite}
@keyframes rainfall{from{transform:translateY(-13px)}to{transform:translateY(0)}}
.dio-scorching{background:linear-gradient(180deg,#f7dfb4,#f4e9d4 72%)}
.dio-scorching::before{content:"";position:absolute;right:10%;top:6px;width:20px;height:20px;
  border-radius:50%;background:radial-gradient(circle,#cf6a3c 0 52%,rgba(207,106,60,.25) 56% 100%)}
.dio-scorching::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(180deg, rgba(207,106,60,.10) 0 1.5px, transparent 1.5px 5px);
  animation:heat 2.6s ease-in-out infinite alternate}
@keyframes heat{from{opacity:.45}to{opacity:.9}}
@media (prefers-reduced-motion:reduce){
  #diorama .dio-rice{animation:none}
  .dio-rain::after,.dio-scorching::after,.dio-windy::after{animation:none}
}

/* ── 场景抬头：一道朱砂竖线牵着地名 ─────────────────────────── */
#sceneHead{position:relative;flex:0 0 auto;padding:11px 14px 0 20px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#sceneHead::before{content:"";position:absolute;left:12px;top:13px;bottom:2px;width:3px;
  border-radius:2px;
  background:linear-gradient(180deg,var(--stamp-red),rgba(194,70,50,.06))}
#sceneName{font-family:var(--font-serif);font-size:20px;font-weight:700;color:var(--ink);
  letter-spacing:1.5px;line-height:1.25}
/* 谁在这儿，紧挨着地名；靠右那一角留给「往期手记」那枚小按钮。 */
#sceneWho{font-size:12px;color:var(--sprout);margin-left:6px;white-space:nowrap;
  display:inline-flex;align-items:center;gap:5px;
  border-bottom:1px dashed rgba(61,122,82,.5);padding-bottom:1px}
#sceneWho::before{content:"";width:5px;height:5px;background:var(--sprout);
  transform:rotate(45deg);flex:0 0 auto}
/* 没人在场就别挂一条空的下划线 */
#sceneWho:empty{display:none}

/* 往期手记：抬头右肩上一枚淡淡的签。主屏只留最新那几笔，
   更早的都收在这后头 —— 攒不起来的时候它自己收着（[hidden]）。 */
#logBtn{flex:0 0 auto;margin-left:auto;display:inline-flex;align-items:center;gap:4px;
  cursor:pointer;background:none;border:1px dashed var(--line-dark);border-radius:7px;
  padding:4px 8px;color:var(--dim);font-family:var(--font-sans);font-size:12px;
  letter-spacing:.5px;transition:border-color .16s, color .16s}
/* [hidden] 那条得自己写：上面把 display 定成了 inline-flex，
   浏览器自带的 [hidden]{display:none} 就压不住它了。 */
#logBtn[hidden]{display:none}
#logBtn .ic{width:13px;height:13px}

/* ── 当务之急：压在叙事上头的那一条细带 ───────────────────────
   主线的重头戏已经搬到动作区最上头的 .mainline 横幅里了，
   这一条退回「报个进度」的本分，四档照旧：
   朱砂 = 灾警、朱砂细边 = 该定的事还没定、赭黄 = 身上有点小毛病、灰 = 眼下没别的事。 */
#duty{flex:0 0 auto;margin:8px 13px 0}
.duty{display:flex;align-items:flex-start;gap:8px;padding:7px 11px 8px;
  border-radius:var(--radius-sm);border:1px solid var(--line);border-left:3px solid var(--ochre);
  background:linear-gradient(180deg, var(--paper-card), rgba(251,247,240,.7));
  box-shadow:var(--sh-glint);
  font-family:var(--font-serif);font-size:13.5px;line-height:1.7;color:var(--ink-narr)}
.duty-ic{flex:0 0 auto;margin-top:2px;color:var(--ochre)}
.duty-ic .ic{width:15px;height:15px}
.duty-t{flex:1 1 auto;min-width:0}
.duty.urgent{border-color:rgba(194,70,50,.5);border-left-color:var(--stamp-red);
  background:linear-gradient(90deg, var(--stamp-bg), transparent 78%), var(--paper-card);
  color:var(--ink)}
.duty.urgent .duty-ic{color:var(--stamp-red);animation:bellRing 2.2s ease-in-out infinite}
@keyframes bellRing{0%,86%,100%{transform:none}90%{transform:rotate(-14deg)}
  94%{transform:rotate(12deg)}}
.duty.due{border-left-color:var(--stamp-red);color:var(--ink);
  background:linear-gradient(90deg, var(--stamp-bg), transparent 62%), var(--paper-card)}
.duty.due .duty-ic{color:var(--stamp-red)}
.duty.tip{border-style:dashed;border-left-style:solid}
.duty.calm{border-left-color:var(--line-dark);color:var(--dim);font-size:13px}
.duty.calm .duty-ic{color:var(--muted)}
@media (prefers-reduced-motion:reduce){.duty.urgent .duty-ic{animation:none}}

/* ══ 叙事：一页手账，不是一条滚动窗 ══════════════════════════
   中段最要紧的一块（46vh 上下，正好是中段的 45%~50%）。
   16.5px 宋体、行距 1.9，底下垫着淡淡的手账横线。
   主屏只留刚发生的那一把（见 renderNarrative），
   所以它平常根本用不着滚 —— 留 max-height + overflow 是保命的闸。 */
#narr{flex:0 1 auto;margin:8px 14px 0;padding:2px 2px 6px 2px;
  max-height:46vh;min-height:22vh;overflow-y:auto;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
  font-family:var(--font-serif);font-size:16.5px;line-height:1.9;color:var(--ink-narr);
  background-image:repeating-linear-gradient(180deg,
    transparent 0 30.4px, rgba(184,171,150,.24) 30.4px 31.4px);
  background-attachment:local}
#narr::-webkit-scrollbar{display:none}
#narr p{margin:0 0 9px}
#narr p:last-child{margin-bottom:0}
/* 头一句是「这是什么地方」—— 交代性质，压暗一档，别跟正文抢 */
#narr .scene-desc{font-family:var(--font-sans);font-size:13px;color:var(--dim);
  line-height:1.7}
/* 有人说话：信笺摘录那样引一道朱砂细线 */
#narr .said{font-size:16px;color:var(--ink-narr);border-left:2px solid var(--stamp-red);
  padding-left:11px;margin-left:1px}
/* 刚发生的那一把：单起一块，上头压一道虚线跟「地方」分开 */
#narr .focus{border-top:1px dashed var(--line);padding-top:11px;margin-top:3px}
/* 刚冒出来的那一笔：段首一枚小菱形墨点，落下来的时候像墨洇上去 */
#narr .ev{font-size:16.5px;color:var(--ink);padding-left:16px;position:relative}
#narr .ev::before{content:"";position:absolute;left:2px;top:.66em;width:5px;height:5px;
  background:var(--ink-narr);transform:rotate(45deg)}
/* 更早的那一两笔留着当底（知道上一步干了什么），压暗一档 */
#narr .past{opacity:.6}
#narr .fresh{animation:fadeUp .42s ease-out both}
@keyframes fadeUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
#narr .sys{font-family:var(--font-sans);font-size:13.5px;color:var(--muted);
  padding-left:16px;position:relative;line-height:1.8}
#narr .sys::before{content:"";position:absolute;left:3px;top:.72em;width:4px;height:1px;
  background:var(--muted)}
@media (prefers-reduced-motion:reduce){#narr .fresh{animation:none}}

/* 往期手记那一整本：行距收回来，一行不落 */
.log-list p{margin:0 0 7px}
#sheet .log-line{animation:none;font-size:14.5px;line-height:1.85;opacity:.92}
#sheet .log-line.sys{font-size:13px;opacity:.75}

/* ── 动作区：主线横幅 / 自由闲逛 / 折叠带，三班分明 ─────────── */
#actions{flex:1 1 auto;min-height:0;overflow-y:auto;padding:12px 13px 18px;
  display:flex;flex-direction:column;gap:10px;scrollbar-width:none}
#actions::-webkit-scrollbar{display:none}

/* ① 主线横幅那一班 */
.mainline{display:flex;flex-direction:column;gap:10px}

/* ② 自由闲逛：两列清爽格子。
   原来一列排到底，八个动作就是一堵按钮墙；两列一格一事，
   扫一眼就知道这地儿这会儿有哪几样活。 */
.act-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}

/* ③ 折叠带：轮不到的那些，收进底下一条细带 */
.shutbar{display:flex;flex-direction:column;gap:0}
.shutbar-t{display:flex;align-items:center;gap:8px;width:100%;cursor:pointer;
  background:none;border:1px dashed var(--line-dark);border-radius:var(--radius-sm);
  padding:9px 13px;color:var(--muted);font-family:var(--font-serif);
  font-size:12.5px;letter-spacing:2px;text-align:left;
  transition:border-color .16s, color .16s}
.shutbar-t .ic{transition:transform .2s ease}
.shutbar.open .shutbar-t .ic{transform:rotate(90deg)}
.shutbar-t span{flex:1 1 auto}
.shutbar .act-grid.shut{display:none;margin-top:8px}
.shutbar.open .act-grid.shut{display:grid}
.act-grid.shut{gap:7px}
.act-grid.shut .act{border-style:dashed;border-color:var(--line-dark);
  background:var(--paper-sunken);box-shadow:none;padding:8px 10px 9px 13px}
.act-grid.shut .act::before{background:var(--muted);opacity:.4}
.act-grid.shut .act-main{font-size:13.5px;font-weight:600}
.act-grid.shut .act-note{font-size:12px;margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* flex:0 0 auto 不能省。#actions 是 flex 列，按钮要是能被压扁，
   一屏装不下时它们不会撑出去让容器滚，而是各自缩一截 —— 缩到比里头那两行字还矮。 */
.act{position:relative;overflow:hidden;flex:0 0 auto;
  display:flex;align-items:center;gap:12px;
  background:var(--paper-card);
  border:1px solid var(--line);
  border-radius:var(--radius);padding:12px 14px 12px 17px;
  cursor:pointer;box-shadow:var(--sh-1), var(--sh-glint);
  transition:transform .12s ease, border-color .16s ease, box-shadow .16s ease}
/* 左边那道色标线：普通动作是秧绿，带检定的是渠水蓝，决策与灾警是朱砂 */
.act::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--sprout);opacity:.55;
  transition:opacity .16s ease}
.act-body{flex:1 1 auto;min-width:0}
.act.locked{opacity:.5;cursor:default}
.act.locked::before{background:var(--muted);opacity:.5}
.act.locked .act-main{color:var(--dim)}
.act-main{font-size:15.5px;font-weight:600;color:var(--ink);line-height:1.4}
/* 开销摊成一行小字，中间用 · 隔开 —— 不套圆角胶囊 */
.act-sub{display:flex;flex-wrap:wrap;gap:0 6px;align-items:baseline;margin-top:5px}
.act-sub .bit{font-size:12.5px;color:var(--dim);white-space:nowrap}
.act-sub .bit + .bit::before{content:"·";margin-right:6px;color:var(--muted)}
.act-sub .chk{font-size:12.5px;color:var(--ochre)}
/* 被锁住的原因：铅笔斜体批注 */
.act-note{font-size:13px;color:var(--dim);margin-top:4px;line-height:1.6}
.act-why{font-family:var(--font-serif);font-style:italic;font-size:13px;
  color:var(--stamp-red);margin-top:5px;opacity:.85}

/* 带检定的动作：右边盖一枚双圈邮戳 */
.act.check::before{background:var(--water);opacity:.8}
.act-badge{position:relative;flex:0 0 auto;width:48px;height:48px;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:1.5px solid currentColor;color:var(--sprout);transform:rotate(-7deg)}
.act-badge::after{content:"";position:absolute;inset:3px;border-radius:50%;
  border:1px dashed currentColor;opacity:.45}
.act-badge b{font-family:var(--font-mono);font-size:17px;font-weight:700;line-height:1}
.act-badge span{font-size:11.5px;letter-spacing:1px;margin-top:2px;opacity:.85}
.act-badge.good{color:var(--sprout)}
.act-badge.mid{color:var(--ochre)}
.act-badge.low{color:var(--stamp-red)}

/* ══ 格子里的动作卡：紧凑版 ══════════════════════════════════
   半格宽的卡不兴有整行卡的排场。次序照旧是
   「干什么 → 要花什么 → 说明」，只是挤成了小一号；
   那枚双圈邮戳缩到 34px 见方，蹲在右上角。 */
.act-grid .act{align-items:flex-start;gap:9px;padding:10px 11px 11px 14px;
  box-shadow:var(--sh-1), var(--sh-glint)}
.act-grid .act .act-main{font-size:14.5px;line-height:1.4;font-weight:600}
.act-grid .act .act-sub{margin-top:3px;gap:0 5px}
.act-grid .act .act-sub .bit,
.act-grid .act .act-sub .chk{font-size:12px}
.act-grid .act .act-note{font-size:12.5px;margin-top:3px;line-height:1.55}
.act-grid .act .act-why{font-size:12.5px;margin-top:3px}
.act-grid .act .act-badge{width:34px;height:34px;border-width:1.2px;
  transform:rotate(-6deg);margin-top:1px}
.act-grid .act .act-badge::after{inset:2px}
.act-grid .act .act-badge b{font-size:13px}
.act-grid .act .act-badge span{font-size:11px;letter-spacing:.3px;margin-top:1px}

/* ══ 主线横幅：农时要务 / 灾警的大卡 ═════════════════════════
   整行、双层细线（外朱砂、里赭金），左侧一枚节气朱印，
   深松绿自右上角漫下来 —— 「该定的事」跟一摞寻常活计的辈分之差，
   就靠这一张的形状。 */
.act.decision{padding:14px 15px 14px 18px;border-color:rgba(194,70,50,.5);
  border-radius:var(--radius);
  box-shadow:var(--sh-2), var(--sh-glint);
  background:
    radial-gradient(150% 130% at 100% 0%, rgba(61,122,82,.13), transparent 55%),
    linear-gradient(180deg, rgba(194,70,50,.05), transparent 55%),
    var(--paper-card)}
.act.decision::before{width:4px;opacity:1;background:var(--stamp-red)}
/* 里圈那一笔赭金——双层细线是这张卡的辈分 */
.act.decision::after{content:"";position:absolute;inset:4px;pointer-events:none;
  border:1px solid rgba(181,124,44,.5);border-radius:8px}
.act.decision .act-body{position:relative;padding-left:56px;min-height:48px}
.act.decision .act-main{font-family:var(--font-serif);font-size:17.5px;font-weight:700;
  color:var(--ink);letter-spacing:.6px;line-height:1.5}
/* 方印。block + fit-content + margin-left:auto —— 靠右站，还不跟正文抢行。 */
.act-kind{display:block;width:fit-content;margin:0 0 7px auto;
  font-family:var(--font-serif);font-size:11.5px;font-weight:700;letter-spacing:2px;
  color:var(--stamp-red);border:1.5px solid var(--stamp-red);border-radius:4px;
  padding:1px 6px 2px;transform:rotate(-1.5deg);
  background:rgba(244,239,230,.6)}
/* 左肩那枚节气印：刻的是这一步的节气名（谷雨 / 立夏…），原文出自数据层 */
.act-seal{position:absolute;left:0;top:3px;width:44px;padding:7px 0 8px;
  text-align:center;font-family:var(--font-serif);font-size:15px;font-weight:700;
  letter-spacing:1px;line-height:1.2;color:var(--stamp-red);
  border:2px solid var(--stamp-red);border-radius:8px;transform:rotate(-3deg);
  background:linear-gradient(180deg, rgba(194,70,50,.12), rgba(194,70,50,.03));
  box-shadow:0 1px 0 rgba(255,255,255,.55) inset, 0 3px 8px -4px rgba(194,70,50,.6)}
/* 右下角那颗【去拍板 ▸】——整张卡都可点，这一颗只是把话说出来 */
.act-go{display:flex;align-items:center;gap:5px;width:fit-content;
  margin:11px 0 0 auto;padding:6px 13px;
  font-family:var(--font-sans);font-size:13.5px;font-weight:700;letter-spacing:1.5px;
  color:var(--stamp-red);border:1.5px solid var(--stamp-red);border-radius:9px;
  background:linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,.35));
  box-shadow:0 2px 6px -3px rgba(194,70,50,.55)}
.act.decision:hover .act-go{color:#fff;background:var(--stamp-red)}

/* ══════ 灾警：跟决策卡一个辈分，但它是砸下来的 ══════════
   牌面上只写年景名和要备的什么，不剧透会怎样。 */
.act.alert{border-color:rgba(194,70,50,.6);
  background:
    radial-gradient(130% 170% at 100% 50%, rgba(194,70,50,.15), transparent 62%),
    linear-gradient(180deg, rgba(194,70,50,.07), transparent 55%),
    var(--paper-card)}
.act.alert::before{width:4px;opacity:1;background:linear-gradient(180deg,#d3604a,#9c3323)}
.act.alert .act-body{padding-left:0;min-height:0}
.act.alert .act-kind{color:var(--paper-card);background:var(--stamp-red);
  border-color:var(--stamp-red)}
/* 急的那句话是整句原话，字号压一档、行距放开 —— 16px 宋体排三行太吵 */
.act.alert .act-main{font-family:var(--font-serif);font-size:15.5px;font-weight:700;
  line-height:1.65;color:var(--ink);letter-spacing:.2px}
.act-sub .cost{font-family:var(--font-mono);font-size:12.5px;color:var(--stamp-red);
  white-space:nowrap}

/* 灾警屏上那两行：好 / 中 */
.alert-text{font-family:var(--font-serif);font-size:15px;line-height:1.85;color:var(--ink-narr);
  background:var(--paper-card);border:1px solid var(--line);
  border-left:3px solid var(--stamp-red);border-radius:var(--radius-sm);
  padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh-glint)}
.sh-acts{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.sh-act{position:relative;overflow:hidden;cursor:pointer;
  background:var(--paper-card);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:12px 14px 12px 17px;
  box-shadow:var(--sh-1);
  transition:border-color .16s ease, transform .1s ease, box-shadow .16s ease}
.sh-act::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--sprout);opacity:.75}
.sh-act:active{transform:translateY(1px)}
.sh-act.off{opacity:.5;cursor:default}
.sh-act.off::before{background:var(--muted)}
.sh-act-t{font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.5}
/* 【好】是稻禾青，【中】是稻谷赭 —— 两条路，不是好坏两档 */
.sh-act-k{display:inline-block;font-family:var(--font-serif);font-size:11.5px;font-weight:700;
  letter-spacing:1px;color:var(--sprout);border:1.4px solid var(--sprout);border-radius:4px;
  padding:0 5px 1px;margin-right:7px;vertical-align:1px;transform:rotate(-2deg)}
.sh-act-k.mid{color:var(--ochre);border-color:var(--ochre)}
.sh-act-n{font-size:12.5px;color:var(--dim);margin-top:5px;line-height:1.6}

/* ══════ 叙事区里年景那几笔 ══════ */
#narr .year{font-family:var(--font-serif);font-size:15px;font-weight:700;
  color:var(--stamp-red);letter-spacing:.4px;padding-left:15px;position:relative}
#narr .year::before{content:"";position:absolute;left:2px;top:.62em;width:5px;height:5px;
  background:var(--stamp-red);transform:rotate(45deg)}
#narr .warn{font-size:14px;line-height:1.75;color:var(--ink-narr);
  background:var(--stamp-bg);border-left:2px solid var(--stamp-red);
  padding:7px 10px;margin:0 0 8px;border-radius:0 6px 6px 0}
#narr .omen{font-family:var(--font-serif);font-size:14px;line-height:1.75;
  color:var(--dim);border-left:2px solid var(--line-dark);
  padding-left:10px;margin:0 0 8px}

/* ══════ 田况页：今年是什么年 / 备了什么 / 还有几步 ══════ */
.year{background:var(--paper-card);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:11px 13px;margin-bottom:9px;
  box-shadow:var(--sh-1), var(--sh-glint)}
.year-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:7px;margin-bottom:6px}
.year-h b{font-family:var(--font-serif);font-size:17px;font-weight:700;
  color:var(--stamp-red);letter-spacing:1px}
.year-h .why{font-size:12px;color:var(--dim)}
.year-say{font-family:var(--font-serif);font-size:14px;line-height:1.8;color:var(--ink-narr)}

/* 四段报 + 发作，一格一格摆出来 */
.ladder{display:flex;gap:0;margin-bottom:9px;border:1px solid var(--line);
  border-radius:var(--radius-sm);overflow:hidden;background:var(--paper-card);
  box-shadow:var(--sh-glint)}
.lad{flex:1 1 0;min-width:0;text-align:center;padding:7px 2px 8px;
  border-left:1px dashed var(--line)}
.lad:first-child{border-left:none}
/* 每格顶上那一点：报了是绿的，还没到是灰的 */
.lad i{display:block;width:6px;height:6px;margin:0 auto 4px;background:var(--muted);
  opacity:.45;transform:rotate(45deg)}
.lad span{display:block;font-size:11.5px;color:var(--dim);letter-spacing:.5px}
.lad b{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lad.done{background:var(--sprout-bg)}
.lad.done i{background:var(--sprout);opacity:1}
.lad.done span{color:var(--sprout)}
.lad.here{background:var(--ochre-bg)}
.lad.here b{color:var(--ochre)}
.lad.hit span{color:var(--stamp-red)}
.lad.hit.done{background:var(--stamp-bg)}

/* 屋角那三样。今年要的那一样挑出来说 —— 那是这一季唯一的硬条件 */
.goods{display:flex;gap:8px}
.gd{flex:1 1 0;min-width:0;padding:8px 10px 9px;border-radius:var(--radius-sm);
  border:1px solid var(--line);background:var(--paper-card);
  box-shadow:var(--sh-glint)}
.gd-n{font-size:12px;color:var(--dim);letter-spacing:1px}
.gd-v{display:block;font-family:var(--font-mono);font-size:18px;font-weight:700;
  color:var(--ink);margin:2px 0 3px}
.gd-u{font-family:var(--font-sans);font-size:11.5px;font-weight:400;color:var(--muted)}
.gd-t{display:block;font-size:11.5px;color:var(--muted);line-height:1.5;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gd.none .gd-v{color:var(--muted)}
.gd.need{border-color:var(--ochre);background:var(--ochre-bg)}
.gd.need .gd-t{color:var(--ochre)}
.gd.need.none{border-color:var(--stamp-red);background:var(--stamp-bg)}
.gd.need.none .gd-t{color:var(--stamp-red)}

/* 去年那一季。写在最底下、比正文淡一档 —— 是个注脚，不是当下的正事 */
.past{margin-top:7px;font-size:12px;color:var(--muted);letter-spacing:.4px}
.past b{color:var(--dim);font-weight:700}

/* ── 底部地点移动栏：上庄乡间步程尺 ───────────────────────────
   五格平分，一个都不许被推出屏幕 ——
   移动栏要是还得横着划才够得着「镇上集市」，那它就不算「常驻」了。 */
#navbar{flex:0 0 auto;position:relative;
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
  padding:9px 6px calc(7px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);
  background:linear-gradient(180deg, rgba(250,246,239,.94), rgba(235,228,215,.98));
  backdrop-filter:blur(8px) saturate(1.08)}
/* 五格之间那条虚线 —— 像地图上量过的路。图标坐在纸片上，
   线从纸片后头穿过去，看着就是一站一站。 */
#navbar::before{content:"";position:absolute;left:9%;right:9%;top:27px;
  border-top:1px dashed var(--line-dark);opacity:.85}
.loc{position:relative;text-align:center;cursor:pointer;padding:0 4px;
  transition:transform .1s ease}
.loc-ic{width:34px;height:34px;margin:0 auto;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--paper-sunken);border:1px solid transparent;color:var(--dim);
  box-shadow:var(--sh-glint);
  transition:color .16s, border-color .16s, background .16s, box-shadow .16s}
.loc-ic .ic{width:18px;height:18px}
.loc-n{font-size:12.5px;font-weight:700;color:var(--dim);margin-top:4px;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc-t{font-family:var(--font-mono);font-size:12px;color:var(--muted);margin-top:2px;
  line-height:1.3;min-height:14px;white-space:nowrap}
.loc-t .wl{display:inline-block}
/* 站着的这一格：拿红笔圈出来 */
.loc.here .loc-ic{color:var(--stamp-red);border-color:var(--stamp-red);
  background:var(--paper-card);box-shadow:0 0 0 3px var(--stamp-bg), var(--sh-glint)}
.loc.here .loc-n{color:var(--ink)}
.loc.here .loc-t{color:var(--stamp-red)}
/* 鞋陷过泥、绕远了的，耗时旁边点一个小泥点 */
.loc.far .loc-t .wl{color:var(--ochre)}
.loc.far .loc-t .wl::after{content:"";display:inline-block;width:3px;height:3px;
  border-radius:50%;background:var(--ochre);margin-left:3px;vertical-align:middle}

/* ── 抽屉：牛皮纸档案夹（任何宽度都从左侧滑出来）───────────────── */
#mask{position:absolute;inset:0;background:rgba(30,24,18,.52);opacity:0;
  pointer-events:none;transition:opacity .24s;z-index:30;
  backdrop-filter:blur(2px)}
#mask.on{opacity:1;pointer-events:auto}
#drawer{position:absolute;top:0;left:0;bottom:0;width:90%;max-width:382px;z-index:40;
  display:flex;flex-direction:column;
  background:#efe8dc;
  border-right:1px solid var(--line-dark);border-radius:0 18px 18px 0;
  box-shadow:24px 0 60px -30px rgba(24,18,12,.75);
  transform:translateX(-102%);transition:transform .26s cubic-bezier(.3,.8,.3,1)}
#drawer.on{transform:translateX(0)}
#drawerHead{flex:0 0 auto;padding:15px 15px 0;border-bottom:1px solid var(--line-dark);
  background:linear-gradient(180deg, rgba(239,232,220,.96), rgba(239,232,220,.72));
  backdrop-filter:blur(6px)}
#drawerHead h2{margin:0 0 11px;font-family:var(--font-serif);font-size:17px;font-weight:700;
  color:var(--ink);letter-spacing:2px;display:flex;align-items:center;gap:9px}
#drawerHead h2::after{content:"";flex:1 1 auto;height:1px;
  background:linear-gradient(90deg,var(--line-dark),transparent)}
/* 档案袋上那四个凸起的索引签 */
#tabs{display:flex;gap:3px;align-items:flex-end}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;
  text-align:center;font-size:12.5px;padding:7px 2px;cursor:pointer;
  border:1px solid var(--line-dark);border-bottom:none;border-radius:8px 8px 0 0;
  color:var(--dim);background:var(--paper-sunken);margin-bottom:-1px;
  transition:background .16s, color .16s, border-color .16s}
.tab .ic{width:14px;height:14px}
.tab.on{background:var(--paper);color:var(--stamp-red);font-weight:700;
  border-color:var(--stamp-red);padding-bottom:8px}
#drawerBody{flex:1 1 auto;min-height:0;overflow-y:auto;padding:15px 15px 30px;
  background:var(--paper)}
#drawerBody h3{font-family:var(--font-serif);font-size:13px;font-weight:700;color:var(--dim);
  margin:21px 0 9px;letter-spacing:2px;display:flex;align-items:center;gap:9px}
#drawerBody h3::after{content:"";flex:1 1 auto;height:1px;
  background:linear-gradient(90deg,var(--line-dark),transparent)}
#drawerBody h3:first-child{margin-top:0}

/* 田况：两张读表 */
.stat-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--paper-card);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:11px 13px 12px;box-shadow:var(--sh-glint)}
.stat-l{font-size:12px;color:var(--muted);letter-spacing:1.5px}
.stat-v{font-family:var(--font-mono);font-size:19px;font-weight:700;color:var(--ochre);
  margin-top:6px;line-height:1.15;white-space:nowrap}
/* 前面的空格由模板里带出来，这儿不再补 margin —— 补了会宽出一格 */
.stat-u{font-size:11.5px;color:var(--dim);font-family:var(--font-sans)}
/* 误差半径：中间一道准星，两边一条渐隐的带子，越宽越没数 */
.radius{margin-top:9px}
.radius-bar{position:relative;height:8px;overflow:hidden;
  border-bottom:1px solid var(--line-dark);
  background:repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 10%)}
.radius-band{position:absolute;bottom:0;height:5px;
  background:linear-gradient(90deg, var(--ochre-bg), rgba(181,124,44,.6), var(--ochre-bg))}
.radius-mid{position:absolute;bottom:-2px;width:1px;height:9px;background:var(--ochre)}
.radius-foot{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.55}

.mod{display:flex;gap:8px;font-size:13px;padding:7px 0 7px 11px;
  border-left:2px solid var(--sprout);margin-bottom:5px;line-height:1.6;color:var(--ink-narr)}
.mod.bad{border-left-color:var(--stamp-red)}
.mod.plain{border-left-color:var(--line-dark);color:var(--dim)}
.mod .why{color:var(--muted)}

/* 穿戴槽位：底下一条耐久刻度 */
.slot{background:var(--paper-card);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:11px 13px 12px;margin-bottom:7px;
  box-shadow:var(--sh-1), var(--sh-glint)}
.slot-row{display:flex;align-items:center;gap:10px}
.slot-ic{flex:0 0 auto;width:22px;color:var(--dim)}
.slot-ic .ic{width:19px;height:19px;margin:0 auto}
.slot-b{flex:1 1 auto;min-width:0}
.slot-t{font-size:14.5px;font-weight:600;color:var(--ink)}
.slot-e{font-family:var(--font-serif);font-size:12.5px;color:var(--dim);margin-top:3px;
  line-height:1.6}
.slot-empty{opacity:.55;font-style:italic;font-family:var(--font-serif)}
.dur{flex:0 0 auto;text-align:right}
.dur b{display:block;font-family:var(--font-mono);font-size:14.5px;color:var(--ink);
  line-height:1.2}
.dur span{font-size:11.5px;color:var(--muted);letter-spacing:1px}
.dur-bar{height:4px;overflow:hidden;margin-top:9px;border-radius:99px;
  background:repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 5px)}
.dur-bar i{display:block;height:100%;background:var(--sprout);border-radius:99px}
.dur-bar i.low{background:var(--stamp-red)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{font-size:11.5px;padding:1px 7px;border-radius:6px;font-family:var(--font-serif);
  color:var(--stamp-red);background:var(--stamp-bg);border:1px solid rgba(194,70,50,.35)}
.tag.g{color:var(--sprout);background:var(--sprout-bg);border-color:rgba(61,122,82,.35)}
/* 陷了泥、开了线这些「身上正带着的毛病」：赭黄那一档，跟好处分开 */
.tag.warn{color:var(--ochre);background:var(--ochre-bg);
  border-color:rgba(181,124,44,.42)}

/* ══ 随身行头整备单 ══════════════════════════════════════════ */
.slot{cursor:pointer;transition:border-color .16s ease, transform .1s ease,
  box-shadow .16s ease}
.slot-go{display:flex;align-items:center;justify-content:flex-end;gap:4px;
  margin-top:9px;padding-top:7px;border-top:1px dashed var(--line);
  font-size:12px;color:var(--muted);letter-spacing:.5px}
.slot-go .ic{width:12px;height:12px}
.slot.empty .slot-go{color:var(--ochre)}

.wear{display:flex;align-items:flex-start;gap:9px;padding:10px 12px;margin-bottom:6px;
  border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--paper-card);
  box-shadow:var(--sh-glint)}
.wear.on{border-color:rgba(194,70,50,.5);
  background:linear-gradient(90deg, var(--stamp-bg), transparent 70%), var(--paper-card)}
.wear-b{flex:1 1 auto;min-width:0}
.wear-n{display:flex;align-items:baseline;gap:5px;font-size:14px;font-weight:600;
  color:var(--ink)}
.wear-n .ic{width:12px;height:12px;color:var(--stamp-red);transform:translateY(1px)}
.wear-n em{margin-left:auto;font-family:var(--font-mono);font-style:normal;
  font-size:11.5px;font-weight:400;color:var(--muted)}
.wear-q{font-family:var(--font-serif);font-size:12.5px;color:var(--dim);margin-top:3px;
  line-height:1.6}
.wear-btn{flex:0 0 auto;cursor:pointer;white-space:nowrap;font-family:var(--font-sans);
  font-size:12.5px;padding:6px 11px;border-radius:8px;background:none;
  border:1.3px solid var(--stamp-red);color:var(--stamp-red);
  transition:background .16s, color .16s}
.wear-btn.off{border-color:var(--line-dark);color:var(--dim)}
/* 藏品详情卡底下那颗「穿戴上身 / 握在手里」——填满一整片的红在抽屉里太响：
   改成朱砂描边，跟纸一个调子，按下去才泛红。 */
.relic-d .sh-btn{background:none;color:var(--stamp-red);box-shadow:none;
  border:1.3px solid var(--stamp-red);font-size:14px;font-weight:700;margin-top:11px}
.relic-d .sh-btn.on{color:var(--dim);border-color:var(--line-dark)}
.relic-d .sh-btn:hover{background:var(--stamp-bg)}

.care-list{display:flex;flex-direction:column;gap:6px}
.care{display:flex;align-items:center;gap:9px;width:100%;text-align:left;cursor:pointer;
  padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--line);
  background:var(--paper-card);color:var(--ink-narr);
  font-family:var(--font-sans);box-shadow:var(--sh-glint);
  transition:border-color .16s}
.care-ic{flex:0 0 auto;color:var(--ochre)}
.care-ic .ic{width:15px;height:15px}
.care-t{flex:1 1 auto;font-size:13.5px}
.care-c{flex:0 0 auto;font-family:var(--font-mono);font-size:11.5px;color:var(--dim);
  white-space:nowrap}

/* 日程 */
.clock{background:var(--paper-card);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;
  box-shadow:var(--sh-1), var(--sh-glint)}
.clock-t{font-size:14px;margin-bottom:8px;line-height:1.7;color:var(--ink-narr)}
.clock-t b{font-family:var(--font-mono);color:var(--ochre);font-size:15px}
.bar{height:5px;overflow:hidden;border-radius:99px;
  background:repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 5px)}
.bar i{display:block;height:100%;background:var(--sprout);border-radius:99px}
.memo{font-size:13.5px;padding:8px 0 8px 11px;margin-bottom:5px;line-height:1.6;
  color:var(--dim);border-left:2px solid var(--line-dark)}
.memo.soon{border-left-color:var(--ochre);color:var(--ink-narr)}
.memo.done{border-left-color:var(--sprout);color:var(--muted)}

/* 人物 */
.npc{background:var(--paper-card);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:12px 13px;margin-bottom:8px;
  box-shadow:var(--sh-1), var(--sh-glint)}
.npc-h{display:flex;align-items:center;gap:10px;cursor:pointer}
.npc-av{flex:0 0 auto;width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-serif);font-size:15px;font-weight:700;line-height:1;
  border:1.4px solid}
.npc-av.c0{color:var(--ochre);border-color:var(--ochre);background:var(--ochre-bg)}
.npc-av.c1{color:var(--sprout);border-color:var(--sprout);background:var(--sprout-bg)}
.npc-av.c2{color:var(--water);border-color:var(--water);
  background:rgba(74,124,155,.10)}
.npc-hd{flex:1 1 auto;min-width:0}
.npc-n{font-size:15px;font-weight:600;color:var(--ink)}
.npc-r{font-size:12px;color:var(--muted);margin-top:2px}
.npc-o{flex:0 0 auto;font-family:var(--font-mono);font-size:15.5px;font-weight:700}
/* 好感度：中间一道零线，往两边长 */
.opi{position:relative;height:5px;margin-top:9px;overflow:hidden;border-radius:99px;
  background:repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 8px)}
.opi-mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line-dark)}
.opi-fill{position:absolute;top:0;bottom:0}
.opi-fill.p{left:50%;background:var(--sprout);border-radius:0 99px 99px 0}
.opi-fill.m{right:50%;background:var(--stamp-red);border-radius:99px 0 0 99px}
.opi-foot{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);
  margin-top:3px;font-family:var(--font-mono)}
.npc-d{font-size:12.5px;color:var(--dim);margin-top:7px;line-height:1.6}
.npc-log{margin-top:10px;border-top:1px dashed var(--line-dark);padding-top:9px;display:none}
.npc.open .npc-log{display:block}
/* 时间轴：一条竖线串起一颗颗点 */
.npc-log div{position:relative;display:flex;justify-content:space-between;gap:10px;
  font-size:12.5px;color:var(--dim);padding:0 0 0 15px;line-height:1.55;min-height:21px}
.npc-log div::before{content:"";position:absolute;left:2px;top:6px;width:5px;height:5px;
  background:var(--line-dark);transform:rotate(45deg)}
.npc-log div::after{content:"";position:absolute;left:4px;top:13px;bottom:-2px;width:1px;
  background:var(--line)}
.npc-log div:last-child::after{display:none}
.npc-log b{flex:0 0 auto;font-family:var(--font-mono)}

/* 藏品册：36 格，六个类别各一个色调 */
.relics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.relic{position:relative;overflow:hidden;text-align:center;cursor:pointer;
  padding:11px 6px 10px;border-radius:var(--radius-sm);border:1px solid var(--line);
  background:var(--paper-card);
  box-shadow:var(--sh-glint);
  transition:transform .1s ease, border-color .16s ease, box-shadow .16s ease}
.relic-no{position:absolute;top:4px;right:6px;font-family:var(--font-mono);font-size:11px;
  color:var(--muted);letter-spacing:.5px}
.relic-n{font-size:12.5px;font-weight:600;color:var(--ink);line-height:1.4}
.relic-c{font-size:11.5px;color:var(--muted);margin-top:3px;letter-spacing:1px}
.relic.lock{opacity:.42;cursor:default}
.relic.sel{border-color:var(--stamp-red);box-shadow:0 0 0 3px var(--stamp-bg)}
/* 六个类别：0免灾 1免代价 2换信息 3换人情 4换钱 5顶货 */
.relic[data-cat="0"]{border-top:2px solid var(--stamp-red)}
.relic[data-cat="1"]{border-top:2px solid var(--ochre)}
.relic[data-cat="2"]{border-top:2px solid var(--water)}
.relic[data-cat="3"]{border-top:2px solid #8a6f9c}
.relic[data-cat="4"]{border-top:2px solid var(--sprout)}
.relic[data-cat="5"]{border-top:2px solid var(--line-dark)}
/* 详情：一张档案卡 */
.relic-d{grid-column:1/-1;border-radius:var(--radius-sm);padding:14px 16px;
  font-family:var(--font-serif);font-size:13.5px;line-height:1.85;color:var(--ink-narr);
  background:var(--paper-card);border:1px solid var(--line-dark);
  border-top:2px solid var(--stamp-red);box-shadow:var(--sh-1)}
.relic-d .t{font-size:16px;font-weight:700;color:var(--stamp-red);margin-bottom:8px;
  letter-spacing:1px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.relic-d .t em{font-family:var(--font-sans);font-style:normal;font-size:11.5px;
  color:var(--muted);letter-spacing:1px}
.relic-d .q{color:var(--dim);margin-top:8px;font-size:12.5px}
.relic-d .e{color:var(--sprout);margin-top:8px;display:flex;align-items:center;gap:5px}
.relic-d .e .ic{width:13px;height:13px}

/* ══ 弹层：《田间决断卷》 ════════════════════════════════════
   不论宽窄，一律是**居中摊开的一卷**：宽 92%、最宽 520px、最高 82vh，
   框是双线（外一道细边、内一道纸色的分界），四角压着朱砂的角饰。
   四角那八道小线是 background 画的，`background-attachment:scroll`
   让它钉在框上、不跟着正文滚。 */
#modal{position:absolute;inset:0;z-index:60;display:none;padding:16px;
  align-items:center;justify-content:center;
  background:rgba(30,24,18,.55);backdrop-filter:blur(3px) saturate(1.05)}
#modal.on{display:flex}
#sheet{width:92%;max-width:520px;max-height:82vh;overflow-y:auto;
  padding:16px 19px 20px;border-radius:8px;
  border:1px solid var(--line-dark);
  outline:1px solid var(--line);outline-offset:4px;
  box-shadow:var(--sh-3);
  animation:sheetUp .24s cubic-bezier(.3,.8,.3,1);
  background:
    linear-gradient(var(--stamp-red),var(--stamp-red)) 0 0/14px 1.5px no-repeat,
    linear-gradient(var(--stamp-red),var(--stamp-red)) 0 0/1.5px 14px no-repeat,
    linear-gradient(var(--stamp-red),var(--stamp-red)) 100% 0/14px 1.5px no-repeat,
    linear-gradient(var(--stamp-red),var(--stamp-red)) 100% 0/1.5px 14px no-repeat,
    linear-gradient(var(--stamp-red),var(--stamp-red)) 0 100%/14px 1.5px no-repeat,
    linear-gradient(var(--stamp-red),var(--stamp-red)) 0 100%/1.5px 14px no-repeat,
    linear-gradient(var(--stamp-red),var(--stamp-red)) 100% 100%/14px 1.5px no-repeat,
    linear-gradient(var(--stamp-red),var(--stamp-red)) 100% 100%/1.5px 14px no-repeat,
    linear-gradient(180deg, var(--paper-card), var(--paper) 30%)}
@keyframes sheetUp{from{transform:translateY(14px) scale(.99);opacity:.4}
  to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#sheet{animation:none}}
/* 那条把手是「从底下抽上来」那阵子的东西 —— 全尺寸都收掉。 */
.sh-grab{display:none}
/* 卷首：朱砂标题，底下压一道双线，把标题栏框出来 */
.sh-title{font-family:var(--font-serif);font-size:18.5px;font-weight:700;
  color:var(--stamp-red);letter-spacing:1.5px;line-height:1.4;
  padding-bottom:7px;margin-bottom:7px;
  border-bottom:2px double rgba(194,70,50,.55)}
.sh-sub{font-size:13.5px;color:var(--dim);margin-bottom:13px;line-height:1.65}
.sh-body{font-family:var(--font-serif);font-size:15px;line-height:1.9;color:var(--ink-narr);
  margin-bottom:14px}
.sh-body p{margin:0 0 7px}
.sh-body p:last-child{margin-bottom:0}
.sh-sec{font-family:var(--font-serif);font-size:13px;font-weight:700;color:var(--dim);
  letter-spacing:2px;margin:16px 0 9px;display:flex;align-items:center;gap:9px}
.sh-sec::after{content:"";flex:1 1 auto;height:1px;
  background:linear-gradient(90deg,var(--line-dark),transparent)}

/* ══ 手风琴：那三四个选项就地张开 ════════════════════════════
   点一条，它自己长出来（成功率的罗盘、加减的账、翻车的后果），
   底下跟着两颗按钮。同一时间只张一条。 */
.act.opt{transition:border-color .16s ease, box-shadow .16s ease}
.act.opt .act-main{display:flex;align-items:baseline;gap:6px}
.opt-chev{flex:0 0 auto;color:var(--muted);transform:translateY(1px)}
.opt-chev .ic{width:12px;height:12px}
.act.opt.on{border-color:var(--stamp-red);box-shadow:0 0 0 3px var(--stamp-bg);
  background-image:linear-gradient(180deg, rgba(194,70,50,.05), transparent 42%)}
.act.opt.on::before{background:var(--stamp-red);opacity:1}
.opt-d{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line-dark);
  animation:fadeUp .3s ease-out both}
.opt-d .sh-sec{margin:13px 0 8px}
.opt-hinge{font-family:var(--font-serif);font-style:italic;font-size:13.5px;
  color:var(--stamp-red);margin-bottom:7px;line-height:1.7}
.opt-pitch{font-size:14.5px;margin-bottom:12px}
.opt-go{margin-top:12px}
@media (prefers-reduced-motion:reduce){.opt-d{animation:none}}

/* CK3 检定面板：一只老罗盘 ─────────────────────────────────
   刻度是纸上印的一圈分度线，指针是朱砂的一道细线。 */
.chk-big{display:flex;align-items:center;gap:16px;margin-bottom:13px}
.chk-num{position:relative;flex:0 0 auto;width:88px;height:88px;border-radius:50%;
  color:var(--sprout);
  border:1.5px solid var(--line-dark);
  box-shadow:var(--sh-1);
  background:
    repeating-conic-gradient(from 180deg, var(--line-dark) 0 .7deg, transparent .7deg 18deg),
    radial-gradient(circle at 50% 62%, var(--paper-card), var(--paper-sunken))}
/* 指针：从圆心往上长出 26px，转 -90°(0%) → 0°(50%) → +90°(100%) */
.chk-num::before{content:"";position:absolute;left:50%;bottom:50%;width:2px;height:26px;
  background:currentColor;border-radius:1px;transform-origin:bottom center;
  transform:translateX(-50%) rotate(calc(-90deg + var(--p,0) * 1.8deg))}
.chk-num::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;
  border-radius:50%;background:var(--ink);transform:translate(-50%,-50%)}
.chk-num span{position:absolute;left:0;right:0;bottom:8px;text-align:center;
  font-family:var(--font-mono);font-size:15.5px;font-weight:700;color:currentColor}
.chk-num.mid{color:var(--ochre)}
.chk-num.low{color:var(--stamp-red)}
.chk-lbl{font-size:13px;color:var(--dim);line-height:1.7}
.chk-lbl b{font-family:var(--font-mono);color:var(--ink-narr)}
.chk-lbl b.p{color:var(--sprout)}

/* 加减项：手写账目那样，一行一条，底下压一道点线 */
.chk-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  font-size:13.5px;padding:6px 1px;line-height:1.6;
  border-bottom:1px dotted var(--line-dark);color:var(--ink-narr)}
.chk-row.base{border-bottom-style:solid;border-bottom-color:var(--line-dark);
  font-family:var(--font-serif)}
/* 没生效的那几条：压暗、灰掉，一眼看出差在哪 */
.chk-row.off{opacity:.55;color:var(--muted)}
.chk-row b{flex:0 0 auto;font-family:var(--font-mono)}
.chk-row b.p{color:var(--sprout)}
.chk-row b.m{color:var(--muted)}
.chk-row.risk{border-bottom-color:var(--stamp-red);color:var(--stamp-red);
  display:block;text-align:justify}
/* 那句后果和那笔账都短不了一块儿去：改成上下两行，账目自己站右边。 */
.chk-row.risk b{color:var(--stamp-red);display:block;text-align:right;
  margin-top:3px}
.chk-row .mk{color:var(--muted)}

.sh-btn{width:100%;border:1.5px solid var(--stamp-red);border-radius:9px;padding:12px;
  font-size:15.5px;font-weight:700;font-family:var(--font-sans);
  color:var(--paper-card);cursor:pointer;margin-top:9px;background:var(--stamp-red);
  box-shadow:0 6px 16px -10px rgba(194,70,50,.9), var(--sh-glint);
  transition:filter .16s ease, transform .1s ease}
.sh-btn:active{transform:translateY(1px)}
.sh-btn.ghost{background:none;color:var(--dim);border-color:var(--line-dark);
  box-shadow:none;font-weight:600}
/* 「收起详情」是这条详情末尾的一个小回头：不描边、不占满一行，
   灰字底下压一道虚线，像书页边上的一行小注。
   活儿照旧：check-ui.mjs 会找它、点它，DOM 里就在那儿等着。 */
#sheetBack{width:auto;display:block;margin:12px auto 2px;padding:5px 12px;
  font-size:13px;font-weight:400;color:var(--muted);
  border:none;background:none;box-shadow:none;
  text-decoration:underline dotted var(--line-dark);text-underline-offset:4px}
#sheetBack:hover{color:var(--ink-narr);text-decoration-color:var(--ink-narr)}
.sh-btn:disabled{opacity:.4;cursor:default;box-shadow:none}

/* ══ 数字上飘出来的那一颗小字 ════════════════════════════════
   绝对定位的浮子 —— **不进** #tbStamina / #tbStress / #tbMoney 里头：
   那三个 ID 的 textContent 是要逐字对过的。 */
.gauge{position:relative}
.tb-time{position:relative}
.delta{position:absolute;left:50%;top:-4px;transform:translateX(-50%);z-index:5;
  pointer-events:none;white-space:nowrap;
  font-family:var(--font-mono);font-size:12.5px;font-weight:700;
  animation:floatUp 1.8s ease-out both}
.delta.up{color:var(--sprout)}
.delta.down{color:var(--stamp-red)}
.delta.gold{color:var(--ochre)}
.delta.dim{color:var(--dim)}
@keyframes floatUp{
  0%{opacity:0;transform:translate(-50%,7px) scale(.86)}
  16%{opacity:1;transform:translate(-50%,-2px) scale(1)}
  64%{opacity:1;transform:translate(-50%,-15px)}
  100%{opacity:0;transform:translate(-50%,-26px)}}

/* ══ 田头视窗里那点动静 ══════════════════════════════════════
   点一下之后：稻田晃两下、边上过一道光、人影子边上冒出一句话。
   注：天光那几层用的是 #diorama 的 ::before/::after（雨丝、热浪），
   所以这一层动静走的是**元素自己的** box-shadow 和 .dio-rice。 */
#diorama.busy{animation:dioFlash .6s ease-out both}
@keyframes dioFlash{
  0%{box-shadow:inset 0 0 0 3px rgba(61,122,82,.5)}
  100%{box-shadow:inset 0 0 0 3px rgba(61,122,82,0)}}
#diorama.busy .dio-rice{animation:sway .6s ease-in-out 2}
#diorama .bub{position:absolute;left:50%;top:8px;z-index:3;white-space:nowrap;
  transform:translateX(-50%);
  padding:4px 10px 5px;border-radius:8px;font-family:var(--font-serif);font-size:12px;
  color:var(--ink-narr);background:rgba(251,247,240,.95);
  border:1px solid var(--line-dark);
  box-shadow:var(--sh-2);
  animation:bubPop 1.7s ease-out both}
#diorama .bub::after{content:"";position:absolute;left:50%;bottom:-4px;width:7px;height:7px;
  margin-left:-4px;background:inherit;
  border-right:1px solid var(--line-dark);border-bottom:1px solid var(--line-dark);
  transform:rotate(45deg)}
@keyframes bubPop{
  0%{opacity:0;transform:translate(-50%,5px)}
  12%{opacity:1;transform:translate(-50%,0)}
  76%{opacity:1;transform:translate(-50%,0)}
  100%{opacity:0;transform:translate(-50%,-5px)}}
@media (prefers-reduced-motion:reduce){
  #diorama.busy,#diorama.busy .dio-rice{animation:none}
  .delta{animation:fadePlain 1.8s ease-out both}
  .bub{animation:fadePlain 1.7s ease-out both}
}
@keyframes fadePlain{0%{opacity:0}14%{opacity:1}80%{opacity:1}100%{opacity:0}}

#toast{position:absolute;left:50%;bottom:106px;transform:translateX(-50%);z-index:80;
  max-width:86%;text-align:center;padding:9px 16px;font-size:13.5px;color:var(--ink);
  background:var(--paper-card);border:1px solid var(--line-dark);border-radius:10px;
  box-shadow:var(--sh-3);
  opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}

/* ══════ 开局仪式：这一局的底牌，先看一眼再下田 ══════════════════
   进游戏头一眼就是它。纯覆盖层：底下的一屏照常画好了在那儿等着，
   这一层只是把光挡住 —— 按了【记下了 · 下田】才让开。
   顶栏那枚「年景」随时能把它喊回来重看。 */
#introOverlay{position:absolute;inset:0;z-index:70;display:flex;
  align-items:flex-start;justify-content:center;
  padding:30px 18px 22px;overflow-y:auto;overscroll-behavior:contain;
  background:
    radial-gradient(130% 90% at 50% -12%, rgba(214,196,160,.5), transparent 60%),
    radial-gradient(120% 120% at 50% 115%, rgba(61,122,82,.12), transparent 55%),
    var(--paper);
  animation:ioIn .5s ease-out both}
#introOverlay.off{display:none}
@keyframes ioIn{from{opacity:0}to{opacity:1}}
.io-panel{width:100%;max-width:400px;margin:auto;display:flex;flex-direction:column;
  align-items:center;text-align:center}
.io-eyebrow{display:flex;align-items:center;gap:10px;width:100%;color:var(--muted);
  font-family:var(--font-serif);font-size:12.5px;letter-spacing:4px}
.io-eyebrow::before,.io-eyebrow::after{content:"";flex:1 1 auto;height:0;
  border-top:1px solid var(--line-dark)}
.io-title{margin:18px 0 0;font-family:var(--font-serif);font-size:44px;font-weight:700;
  color:var(--ink);letter-spacing:14px;text-indent:14px;line-height:1.2;
  text-shadow:0 1px 0 rgba(255,255,255,.7)}
/* 标题底下一枚朱印，刻的是这一局头一个节气 */
.io-seal{margin-top:13px;width:47px;padding:7px 0 8px;font-family:var(--font-serif);
  font-size:16px;font-weight:700;letter-spacing:2px;line-height:1.15;color:var(--stamp-red);
  border:2px solid var(--stamp-red);border-radius:9px;transform:rotate(-3deg);
  background:linear-gradient(180deg, rgba(194,70,50,.12), rgba(194,70,50,.03));
  box-shadow:0 1px 0 rgba(255,255,255,.55) inset, 0 4px 10px -5px rgba(194,70,50,.6)}
.io-sub{margin-top:15px;font-size:13.5px;color:var(--dim);letter-spacing:2.5px}
.io-quote{margin:22px 0 0;padding:2px 0 2px 15px;text-align:left;
  border-left:2.5px solid var(--stamp-red);
  font-family:var(--font-serif);font-size:17px;line-height:1.85;color:var(--ink-narr)}
.io-by{margin-top:5px;align-self:flex-end;font-family:var(--font-serif);font-size:12.5px;
  color:var(--muted);letter-spacing:2px;padding-right:6px}
/* 年景底牌 */
.io-reveal{position:relative;overflow:hidden;margin-top:24px;width:100%;
  border-radius:12px;padding:15px 17px 16px;text-align:left;
  background:linear-gradient(180deg, var(--paper-card), rgba(251,247,240,.7));
  border:1px solid var(--line-dark);
  box-shadow:var(--sh-2), var(--sh-glint)}
/* 好年景：一道金光斜着扫过底牌 */
.io-reveal.gold::after{content:"";position:absolute;top:-60%;bottom:-60%;width:44%;
  background:linear-gradient(100deg, transparent, rgba(214,178,102,.34) 45%,
    rgba(255,244,214,.6) 50%, rgba(214,178,102,.34) 55%, transparent);
  transform:translateX(-160%) skewX(-14deg);
  animation:ioSweep 2.6s ease-in-out .5s infinite}
@keyframes ioSweep{0%{transform:translateX(-160%) skewX(-14deg)}
  62%,100%{transform:translateX(320%) skewX(-14deg)}}
/* 灾年：这一圈朱砂压着框，不扫金光 */
.io-reveal.warn{border:1.5px solid rgba(194,70,50,.75);
  background:
    radial-gradient(130% 140% at 100% 0%, rgba(194,70,50,.13), transparent 60%),
    linear-gradient(180deg, rgba(194,70,50,.06), transparent 55%),
    var(--paper-card)}
.io-reveal.warn::after{content:"";position:absolute;inset:4px;pointer-events:none;
  border:1px solid rgba(194,70,50,.4);border-radius:8px}
.io-reveal-h{display:flex;align-items:center;gap:9px;
  font-family:var(--font-serif);font-size:12.5px;font-weight:700;color:var(--muted);
  letter-spacing:3px}
.io-reveal-h::after{content:"";flex:1 1 auto;height:1px;
  background:linear-gradient(90deg,var(--line-dark),transparent)}
.io-card-head{display:flex;align-items:baseline;gap:9px;margin-top:10px}
.io-card-name{font-family:var(--font-serif);font-size:23px;font-weight:700;
  color:var(--stamp-red);letter-spacing:3px}
.io-reveal.gold .io-card-name{color:var(--ochre)}
.io-card-tag{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);
  letter-spacing:1px}
.io-card-say{margin-top:8px;font-family:var(--font-serif);font-size:14.5px;line-height:1.85;
  color:var(--ink-narr)}
.io-go{margin-top:26px;width:100%;cursor:pointer;
  font-family:var(--font-sans);font-size:17px;font-weight:700;letter-spacing:2.5px;
  color:var(--paper-card);padding:15px 10px;border:1.5px solid var(--stamp-red);
  border-radius:12px;background:linear-gradient(180deg,#cd5440,var(--stamp-red));
  box-shadow:0 10px 24px -12px rgba(194,70,50,.95), var(--sh-glint);
  transition:filter .16s ease, transform .1s ease}
.io-go:active{transform:translateY(1px)}
.io-hint{margin-top:13px;font-size:12.5px;color:var(--muted);letter-spacing:.5px}
@media (prefers-reduced-motion:reduce){#introOverlay{animation:none}
  .io-reveal.gold::after{animation:none;opacity:0}}

/* ── 桌面：深色木案上摆一摞纸 ─────────────────────────────────── */
/* v7.3.0 起没有「右侧常驻抽屉」这一说了：宽屏上也只是把 #phone
   居中摆好，抽屉照旧从左边抽出来。520 是「手机竖屏整幅」的界线。 */
@media (min-width:520px){
  body{align-items:center;padding:20px;
    background:
      radial-gradient(120% 90% at 50% -6%, rgba(255,213,150,.08), transparent 58%),
      repeating-linear-gradient(93deg, rgba(255,255,255,.016) 0 2px, transparent 2px 9px),
      linear-gradient(180deg, var(--wood-1), var(--wood-2) 55%, #120c06)}
  #phone{height:92vh;
    border:1px solid rgba(255,255,255,.09);border-radius:20px;
    box-shadow:0 0 0 1px rgba(0,0,0,.55), 0 1px 0 rgba(255,255,255,.07) inset,
      0 46px 90px -46px #000, 0 18px 46px -28px rgba(0,0,0,.85)}
}

/* ── 桌面细节（1024 那一档）─────────────────────────────────────
   断点 1024 跟 UIRenderer.isWide() 里那个数是同一个，改要一起改。
   这一档**不再改布局**（抽屉永远抽出来，见上），只管桌面上的手感：
   更大的圆角、露出来的滚动条、田头视窗抬高一截。 */
@media (min-width:1024px){
  body{padding:26px}
  #phone{border-radius:24px}
  #diorama,#diorama .dio{height:96px}
  #sceneHead{padding:13px 24px 0 32px}
  #sceneHead::before{left:23px;top:15px}
  #duty{margin:11px 24px 0}
  #narr{margin:10px 24px 0;max-height:42vh;min-height:20vh;font-size:17px}
  #actions{padding:13px 24px 20px;gap:11px}
  .loc-n{font-size:13px}
  .loc-t{font-size:12.5px}
  .relics{grid-template-columns:repeat(4,1fr)}
  /* 桌面不兴把滚动条藏起来 */
  #drawerBody,#actions{scrollbar-width:thin;scrollbar-color:var(--line-dark) transparent}
  #drawerBody::-webkit-scrollbar,#actions::-webkit-scrollbar{display:block;width:9px}
  #drawerBody::-webkit-scrollbar-thumb,#actions::-webkit-scrollbar-thumb{
    background:var(--line-dark);border-radius:99px;border:2px solid transparent;
    background-clip:content-box}
  #drawerBody::-webkit-scrollbar-track,#actions::-webkit-scrollbar-track{background:transparent}
  #modal{padding:24px}
  #sheet{scrollbar-width:thin;scrollbar-color:var(--line-dark) transparent;
    padding:20px 26px 24px}
  #sheet::-webkit-scrollbar{display:block;width:9px}
  #sheet::-webkit-scrollbar-thumb{background:var(--line-dark);border-radius:99px;
    border:2px solid transparent;background-clip:content-box}
  /* 一对按钮在桌面上并排，省下一行的高度 —— 那点高度够让「收起详情」
     不用滚就看得见。（只有一枚按钮的弹层不加这个，:only-of-type 认的就是这个）
     减 10 而不是减 4：两个 inline-block 之间那个换行会渲染成一个空格。 */
  #sheet .sh-btn:not(:only-of-type){display:inline-block;width:calc(50% - 10px);
    vertical-align:top}
  #sheet .sh-btn + .sh-btn{margin-left:8px}
  #toast{bottom:122px}
}

/* 指针设备才给悬停 —— 触屏上 :hover 会粘住 */
@media (hover:hover) and (pointer:fine){
  #drawerBtn:hover{border-color:var(--stamp-red);color:var(--stamp-red)}
  .act:hover{transform:translateY(-1px);border-color:var(--line-dark);
    box-shadow:var(--sh-lift), var(--sh-glint)}
  .act:hover::before{opacity:1}
  .act.check:hover{border-color:var(--water)}
  .act.decision:hover{border-color:var(--stamp-red)}
  .act.alert:hover{border-color:var(--stamp-red)}
  .act.locked:hover{transform:none;box-shadow:var(--sh-1);border-color:var(--line)}
  .loc:hover .loc-ic{color:var(--ink);border-color:var(--line-dark)}
  .loc.here:hover .loc-ic{color:var(--stamp-red);border-color:var(--stamp-red)}
  .tab:hover{background:var(--paper-card);color:var(--ink)}
  .tab.on:hover{color:var(--stamp-red)}
  .buff:hover{border-color:rgba(61,122,82,.75)}
  .buff.bad:hover{border-color:rgba(194,70,50,.8)}
  .relic:hover:not(.lock){transform:translateY(-1px);border-color:var(--stamp-red);
    box-shadow:var(--sh-2)}
  .npc-h:hover .npc-n{color:var(--stamp-red)}
  .sh-act:hover:not(.off){border-color:var(--line-dark);box-shadow:var(--sh-2)}
  .sh-btn:hover:not(:disabled){filter:brightness(1.08)}
  .sh-btn.ghost:hover:not(:disabled){background:var(--paper-sunken);color:var(--ink)}
  #logBtn:hover{border-color:var(--stamp-red);color:var(--stamp-red)}
  .slot:hover{border-color:var(--stamp-red);box-shadow:var(--sh-2)}
  .slot:hover .slot-go{color:var(--stamp-red)}
  .slot:hover .slot-go .ic{transform:translateX(2px)}
  .care:hover{border-color:var(--ochre)}
  .wear-btn:hover{border-color:var(--stamp-red);background:var(--stamp-bg)}
  .wear-btn.off:hover{border-color:var(--line-dark);background:var(--paper-sunken);
    color:var(--ink)}
  .act.opt:hover:not(.on):not(.locked){border-color:var(--line-dark)}
  .shutbar-t:hover{border-color:var(--stamp-red);color:var(--stamp-red)}
  .io-go:hover{filter:brightness(1.06)}
}
</style>
</head>
<body>
<div id="phone">

  <!-- 页眉。第一行是状态钮、节气印、钟点、年景、天气；第二行被一道细线压住，
       体力 / 压力 / 经费 三个数摊在线上，像实验记录表的表头。
       数值一变动，renderTopBar() 会往这三格和钟点那一行里
       各丢一颗往上飘的小字（.delta）—— 那是绝对定位的浮子，
       不落在 #tbStamina / #tbStress / #tbMoney 里面：
       那三个 ID 的 textContent 是要被逐字对过的，多一个字都不行。 -->
  <div id="topbar">
    <div class="tb-row1">
      <!-- 抽屉按钮：一枚线条图标 + 「状态」两个字。任何宽度下抽屉都归它管
           —— v7.3.0 起没有「宽屏抽屉就摆在右边」那一说了。 -->
      <button id="drawerBtn"><span class="db-ic"></span><span class="db-tx">状态</span></button>
      <!-- 节气 / 钟点。里面的两颗 span 归 renderTopBar() 填，
           别在这儿先写死 —— #tbTime 是原样拼出来的。 -->
      <div class="tb-time" id="tbTime"></div>
      <!-- 年景：开局那一张底牌，看过了也留着，想再看一眼就点这儿
           （把 #introOverlay 原样喊回来）。 -->
      <button id="yearBtn" title="重看年景"><span class="yb-ic"></span><span class="yb-tx">年景</span></button>
      <div class="tb-weather" id="tbWeather"></div>
    </div>
    <!-- 三格读数。数字那个 <b> 只装数字本身：
         「元」得摆在外头，#tbMoney 的 textContent 是要被逐字对过的。 -->
    <div class="tb-row2">
      <div class="gauge" id="gaugeStamina">
        <div class="gauge-h">
          <span class="gauge-dot" id="dotStamina"></span>
          <span class="gauge-l">体力</span>
          <span class="gauge-bar"><i id="barStamina"></i></span>
          <b id="tbStamina"></b>
        </div>
      </div>
      <div class="gauge" id="gaugeStress">
        <div class="gauge-h">
          <span class="gauge-dot" id="dotStress"></span>
          <span class="gauge-l">压力</span>
          <span class="gauge-bar"><i id="barStress"></i></span>
          <b id="tbStress"></b>
        </div>
      </div>
      <div class="gauge money">
        <div class="gauge-h">
          <span class="gauge-l">经费</span>
          <span class="gauge-u">¥</span>
          <b id="tbMoney"></b>
        </div>
      </div>
    </div>
    <div class="buffs" id="tbChips"></div>
  </div>

  <div id="stage">
    <!-- 田头视窗：这一亩田的横截面，天、山、田、苗、人都在这一条里。
         内容整个由 renderDiorama() 画，留个空壳在这儿。
         干活的时候 flashDiorama() 会往里塞一句话的小气泡（.bub），
         那句话不是总表里的，就是给点下去的那一下一个即时回响。 -->
    <div id="diorama"></div>

    <!-- 场景抬头。右边那枚小按钮是「往期手记」：主屏只留最新的几笔，
         更早的都收在它后头，点开才看。 -->
    <div id="sceneHead">
      <div id="sceneName"></div>
      <div id="sceneWho"></div>
      <button id="logBtn" hidden></button>
    </div>

    <!-- 当务之急：一条细带，报个进度。真正的重头戏在动作区最上头那班
         —— 农时要务与灾警的整行大卡（.mainline）。 -->
    <div id="duty"></div>

    <div id="narr"></div>
    <!-- 动作区。renderActions() 把这儿分三班摆：
         ① .mainline  灾警 / 农时要务的大卡（左印节气、右下【去拍板 ▸】）
         ② .act-grid  这个地儿寻常能干的事，两列格子
         ③ .shutbar   这会儿轮不到的那些，一条折叠带收着 -->
    <div id="actions"></div>
  </div>

  <div id="navbar"></div>

  <div id="mask"></div>
  <div id="drawer">
    <div id="drawerHead">
      <h2>状态 / 日程</h2>
      <div id="tabs">
        <div class="tab on" data-tab="field">田况</div>
        <div class="tab" data-tab="schedule">日程</div>
        <div class="tab" data-tab="people">人物</div>
        <div class="tab" data-tab="relics">藏品</div>
      </div>
    </div>
    <div id="drawerBody"></div>
  </div>

  <div id="modal"><div id="sheet"></div></div>
  <div id="toast"></div>

  <!-- 开局仪式：进游戏头一眼就是这一层。纯覆盖，底下那一屏照常画好了
       在那儿等着 —— 这一层只是把光挡住，按了【记下了 · 下田】才让开。
       底牌的名字、成色、老周那句话由 syncIntro() 按这一局的年景填进来；
       顶栏那枚「年景」（#yearBtn）随时能把它喊回来重看。
       注：这儿从头到尾没动过引擎 —— 开了、关了，game 都还站在谷雨头一天。 -->
  <div id="introOverlay">
    <div class="io-panel">
      <div class="io-eyebrow">一年之计</div>
      <h1 class="io-title">一亩稻</h1>
      <div class="io-seal" id="ioSeal">谷雨</div>
      <div class="io-sub">京西稻 · 上庄试验站 · 第 1 季</div>
      <div class="io-quote">「来了就先看。别急着动手。」</div>
      <div class="io-by">—— 老周</div>
      <div class="io-reveal gold" id="ioReveal">
        <div class="io-reveal-h">年景底牌</div>
        <div class="io-card-head">
          <span class="io-card-name" id="ioCardName"></span>
          <span class="io-card-tag" id="ioCardTag"></span>
        </div>
        <div class="io-card-say" id="ioCardSay"></div>
      </div>
      <button class="io-go" id="introGo">记下了 · 下田（开始谷雨）</button>
      <div class="io-hint">这一步之后想看，顶栏上点「年景」</div>
    </div>
  </div>
</div>

<script>
"use strict";
/* ============================================================================
   ◆ DATA —— 第一层：配置层
   ----------------------------------------------------------------------------
   只有数据。没有逻辑，没有 DOM。
   搬 Cocos：整个 GameData 原样粘进一个 .ts，前面加 export。

   键名走英文（对齐 spec 的接口），值里是作者的原文，一个字没改。
   ============================================================================ */

const GameData = {

  /* ── 节气 11 个，顺序照现有游戏的 DECISIONS.序 ───────────────
     taskWindow 就是日程页上「距【立夏·保温催芽】开始」那句里的后半截。
     （不叫 window：那一层要能一眼看出没碰浏览器全局。）
     ─────────────────────────────────────────────────────────── */
  solarTerms: [
    { id:'谷雨', days:3, work:'落谷',   taskWindow:'泡种落谷' },
    { id:'立夏', days:3, work:'育秧',   taskWindow:'保温催芽' },
    { id:'小满', days:3, work:'田埂',   taskWindow:'清沟保水' },
    { id:'芒种', days:3, work:'插秧',   taskWindow:'抢插' },
    { id:'夏至', days:3, work:'水',     taskWindow:'控水晒田' },
    { id:'小暑', days:3, work:'草',     taskWindow:'除草' },
    { id:'大暑', days:3, work:'虫',     taskWindow:'防虫' },
    { id:'立秋', days:3, work:'穗肥',   taskWindow:'追肥' },
    { id:'处暑', days:3, work:'断水',   taskWindow:'断水' },
    { id:'白露', days:3, work:'叶面肥', taskWindow:'叶面肥' },
    { id:'秋分', days:3, work:'开镰',   taskWindow:'收割' }
  ],

  /* ── 天气 · 五档（照 spec 的 sunny / windy / rain / cold_rain / scorching） ── */
  weather: {
    sunny:     { label:'晴',     icon:'☀️' },
    windy:     { label:'微风',   icon:'🌤️' },
    rain:      { label:'雨',     icon:'🌧️' },
    cold_rain: { label:'冷雨',   icon:'🌧️' },
    scorching: { label:'毒日头', icon:'🔥' }
  },
  weatherPool: ['sunny','windy','windy','rain','rain','cold_rain','scorching'],

  /* ── 五个地点 ────────────────────────────────────────────────
     x / y 只用来算步行分钟数：距离 = 地图单位，1 单位 ≈ 1 分钟，
     再乘上穿戴带来的系数（胶鞋踩泥里快，运动鞋陷）。
     name 照 spec；底下的 desc 不是总表里的，是重构时补的一句场景话。
     ─────────────────────────────────────────────────────────── */
  locations: [
    { id:'field',   name:'一亩稻田',   x:0,  y:0,  time:'0分',
      desc:'一亩三分，田口在东边。水从西边渠里来。' },
    { id:'shed',    name:'田头工具房', x:5,  y:0,  time:'5分',
      desc:'一间砖房，一张板床，墙角堆着农具。' },
    { id:'plot',    name:'河西试验田', x:15, y:0,  time:'15分',
      desc:'河西一长条，插着白牌子，是站里的对照田。' },
    { id:'village', name:'上庄村里',   x:0,  y:15, time:'15分',
      desc:'老槐树底下坐着人。老周家在东头第二户。' },
    { id:'town',    name:'镇上集市',   x:0,  y:30, time:'30分',
      desc:'一条街，五金、农资、小吃摊。粮站在街尾。' }
  ],

  /* ── 人物 ────────────────────────────────────────────────────
     指纹照抄 data/人物性格.json（脾气 / 怎么说话 / 不会说）。
     name 和 role 照 spec；voice 不是总表里的，是照指纹重述的一句。
     两位同窗全程去性别化：代码和文案里都不出现「他」「她」。
     ─────────────────────────────────────────────────────────── */
  npcs: [
    { id:'zhou',       name:'老周',   role:'老农技员，57 岁', faction:'村',
      voice:'种了四十年的直脾气：话短，先看先尝再开口，损归损、该教的照教。不客套、不顺着书本说；夸你也夸得别扭。' },
    { id:'classmateA', name:'同学A',  role:'河西试验田 · 同届', faction:'同窗',
      voice:'话少，不解释、不圆场；事事记在自己那个本子上。能短就短，问一句答一句；偶尔一句很准，说完就不说了。' },
    { id:'classmateB', name:'同学B',  role:'农大新媒体 · 同级', faction:'同窗',
      voice:'傲娇毒舌：开口先贬，凶完立刻找补；绝不承认在乎。消息常常只有几个字。' }
  ],

  /* ── 藏品 36 件 ──────────────────────────────────────────────
     quote  / origin ：原样来自文字总表，一个字没改。
     effect          ：不是总表里的 —— 这一版我配的被动数值，待作者过目。
     slot            ：有槽的才穿得上身（head / feet / tool / accessory）。
     ─────────────────────────────────────────────────────────── */
  relics: [
    /* ═══ 免灾 01-06 ═══ */
    { id:'01', name:'雏鸭', category:'免灾',
      quote:'稻丛里走一趟,虫子少一半',
      origin:'开春在镇口碰见老周去捉鸭苗，你跟着挑了一窝精神的。',
      effect:{ desc:'虫口涨得慢' } },
    { id:'02', name:'抽水机', category:'免灾',
      quote:'老周借给你使过两回，拉绳启动那一下你总是拽不着劲。',
      origin:'借过两回后，老周懒得再跑，把水带往你田头一扔，让你往后自己拽绳。',
      effect:{ desc:'旱涝损失减三成' } },
    { id:'03', name:'老周的锹', category:'免灾', slot:'tool',
      quote:'木头锹把被汗手盘得溜光，握着比新买的顺手得多。',
      origin:'那天你在沟里急头白脸地瞎挖泥，老周在埂上实在看不下去，一脸嫌弃地把自己的锹递了下来。',
      effect:{ desc:'清沟省一半力气', stamina:{ ditch:0.5 } } },
    { id:'04', name:'镰刀', category:'免灾', slot:'tool',
      quote:'自己挑来的真家伙，开过刃，握在手里沉甸甸的。',
      origin:'开镰前几天你精心挑来的大镰刀，怪顺手的。老周说这孩咋恁没见识。',
      effect:{ desc:'抢收检定 +25' } },

  /* ══════ 挡灾的货 ══════
     「挡它的货」里那三样：膜 / 肥 / 工。
     前两样是买回来压在屋角的存货，用了就少一件；「工」是当场掏钱请的人，
     一样是存货 —— 备着不用，钱也还在手上，只是压着。

     ⚠ 这一块的价钱**不在这儿写**。买捆膜 / 买袋肥 / 请一天工这三件事
     各在动作池里有自己的动作，costMoney 就是唯一的价钱。
     灾年那边只记「要哪一种货」，两边对不上的可能从根上掐掉。

     standIn 是「顶货」那一路的六件里的四件：作者在藏品表上写死了
     「顶一次盖膜」「顶一次追肥」—— 「顶一次」就是**用掉**，
     所以走 standIn 顶上这一回，那件东西就从包里出去了。
     秧盘（34）带的是「育秧插秧省工」，管的是插秧那一天的工，
     不是灾头上的雇工，所以「工」这一路没有顶的，只能花钱请。
