倒","field.roots.1":"新根正往深土探","field.roots.2":"白根扎深，秆子敦实","field.weeds.0":"田面干净","field.weeds.1":"水口冒出嫩稗","field.weeds.2":"稗草压苗，得赶紧治","field.ecology.0":"蛙声稀少，田里太静","field.ecology.1":"青蛙还在，虫子不多","field.ecology.2":"蛙鸣蛛跃，虫害自压","field.stamina.0":"腰酸腿沉，铁锹都拎不动","field.stamina.1":"汗湿后背，还能接着干","field.stamina.2":"歇过劲来，浑身是力","field.caption.compose":"{water} · {soil}","metric.yield.low":"新苗偏少，秋后怕欠收","metric.yield.mid":"苗数够格，长势稳当","metric.yield.high":"根深秆壮，秋后穗子沉","metric.yield.harvested":"干谷扬净归袋，足秤实数","metric.quality.low":"谷粒偏瘪，碎米怕会多","metric.quality.mid":"籽粒匀称，成色中上","metric.quality.high":"谷粒饱、米质润，能卖好价","metric.quality.harvested":"干度达标，拉去粮站就能验","metric.ecology.low":"田里活物少，容易闹虫","metric.ecology.mid":"蛙蛛看家，虫子不多","metric.ecology.high":"蛙鸣蛛跃，不用乱撒药","term.guyu.name":"谷雨","term.guyu.stage":"选种下谷","term.lixia.name":"立夏","term.lixia.stage":"护苗清沟","term.mangzhong.name":"芒种","term.mangzhong.stage":"拔秧移栽","term.xiazhi.name":"夏至","term.xiazhi.stage":"看苗管水","term.dashu.name":"大暑","term.dashu.stage":"拔高怀穗","term.liqiu.name":"立秋","term.liqiu.stage":"抽穗看叶","term.bailu.name":"白露","term.bailu.stage":"长米定单","term.qiufen.name":"秋分","term.qiufen.stage":"开镰收谷","year.dry.name":"伏旱年景","year.dry.desc":"今年渠水比往年浅一截，日头毒、雨水少，水得省着用。","year.even_rain.name":"雨水匀年景","year.even_rain.desc":"隔三差五落场透雨，水口不缺水，就是稗草也跟着疯长。","soil.soft.name":"黏泥田","soil.soft.desc":"保水保肥是真好，可田心泥太黏重，想排干晒透得费点劲。","soil.loam.name":"油沙壤田","soil.loam.desc":"泥底有沙有泥、软硬适中，灌水排水都痛快，算是块省心地。","soil.sandy.name":"漏沙田","soil.sandy.desc":"泥底沙多，存不住水肥，田埂底下还常有黄鳝打的暗洞。","weather.sun.name":"烈日","weather.sun.desc":"日头白花花晃眼，浅水晒得温吞","weather.humid.name":"闷热","weather.humid.desc":"一丝风都没有，潮热气裹身，草芽和虫子动得快。","weather.cloud.name":"阴天","weather.cloud.desc":"云层压得低，下田干活倒是不晒。","weather.rain.name":"阵雨","weather.rain.desc":"刚下过一阵急雨，田埂湿滑","weather.heavy_rain.name":"暴雨","weather.heavy_rain.desc":"雨点砸得水面冒泡，沟渠水位直往上涨。","market.normal.name":"平稳行情","market.tight.name":"好粮紧俏","scene.guyu.title":"开春头一件事，把种定下","scene.guyu.p1":"谷雨到了，冻泥化透。你揣着本钱站在田头，老周背手点头：「开春头一脚，先定下种什么种。」","scene.guyu.p2":"新种裹了防病药衣，省心整齐；旧留种能省一百八，可没泡透催好芽，易出光蹿个子的怪苗。","scene.lixia.title":"小苗长出三片叶，对岸捎来了话","scene.lixia.p1":"立夏，秧苗长出三片叶。老周说，该让白根自己找食了。","scene.lixia.p2":"同学 A 捎话夏至缺人记数据，大田水沟又积满陈泥。","scene.lixia.c.seed":"红皮新种争气，秧床里没有一丝杂苗病苗。","scene.mangzhong.title":"芒种抢插，误不得农时","scene.mangzhong.p1":"老周念叨「春稻不插六月秧」。芒种一到，秧苗从秧床挪进大田，伤了根先蔫黄几天，返青后才接着长。","scene.mangzhong.p2":"一亩水田，自己弯腰退步插，腰得弯断；花点钱请两个村里快手，半天就能利索收工。","scene.xiazhi.title":"苗够数了，这一田水怎么管","scene.xiazhi.p1":"到了夏至，稻子一丛发够了十来根新苗，水口边也蹿出几撮稗草。","scene.xiazhi.p2":"老周磕了磕烟袋：「该搁田了。」","scene.xiazhi.c.commitment":"立夏时应下同学 A，这两天要去河西试验田帮着记数据。","scene.xiazhi.drain.title":"水口扒开了，田心还汪着水","scene.xiazhi.drain.p1":"出水口挖开了，四周泥面见干，唯独田心那块低洼地还汪着死水，晒不出「鸡爪细纹」。","scene.xiazhi.drain.p2":"是踩进泥里补拉一道腰沟，还是省下力气等它慢慢晾干？","scene.xiazhi.hold.title":"水蓄满了，田埂外头有点渗","scene.xiazhi.hold.p1":"田里灌上深水，外侧田埂的泥脚却慢慢洇湿了一片，一踩软绵绵的。","scene.xiazhi.hold.p2":"是趁现在挥锹挖黑泥把漏洞拍死，还是插根草标先记下位置？","scene.dashu.title":"三伏大暑，稻秆肚里怀了穗","scene.dashu.p1":"大暑三伏，稻子怀穗，最怕断水。","scene.dashu.p2":"连干半季，身上有些乏了，可眼下正是保住大穗头的关键几日。","scene.dashu.c.trench":"好在夏至拉的那道腰沟一直通着，急雨下来也没淹着怀穗的稻心。","scene.dashu.c.bank":"夏至拍实的田埂挺争气，把这一田护胎水牢牢锁住了。","scene.dashu.c.missed":"夏至失约，同学 A 独自顶着日头测完了全程。","scene.liqiu.title":"立秋穗尖探头，这一把肥补不补","scene.liqiu.p1":"立秋，稻苞裂口探出穗尖。补肥最考眼力：叶黄要补，叶黑再喂准贪青。","scene.liqiu.p2":"同学 B 想扛相机来拍稻花特写，你手头也正盘算着地里的水肥。","scene.liqiu.c.method":"兜里揣着同学 A 抄来的看叶补肥表。","scene.liqiu.c.leaf":"你刚迎光比过顶叶，绿得发沉，肥底子还足，别再喂氮肥了。","scene.bailu.title":"白露稻穗低头，收粮的先来了","scene.bailu.p1":"白露一过，稻叶正往谷里送养分。","scene.bailu.p2":"老陈晃到田头递烟：「签下二百斤包销单，当场给二百四定金。」","scene.bailu.c.grain":"掐开几粒谷子，白米浆已凝成半硬的玉色，再养十来天就熟透。","scene.bailu.c.quality":"搓开几穗看过，今年谷粒饱瘪不匀，签高分订单怕要悬。","scene.qiufen.title":"秋分开镰，落袋还是再赌三天","scene.qiufen.p1":"秋分，稻穗黄透九成，尾水已断，田面踩上去瓷实。","scene.qiufen.p2":"今天开镰稳当落袋；再晒三天，晚熟青粒也能长满，斤两和好米率还能涨——就怕变天，淋湿再晒裂出惊纹。","scene.qiufen.c.loan":"墙角还立着老周那把木把铁锹。说好秋分前刷净还，别让人家惦记。","scene.harvest.title":"晒干扬净，新谷抬上大秤","scene.harvest.p1":"镰刀收起，田里只剩齐整稻茬。毛谷摊晒两天，迎风扬净，咬开一粒嘎嘣脆，装袋上台秤。","scene.harvest.p2":"秤杆高高翘起，一季的汗、浇的水，总算变成足干足秤的实数。","scene.market.title":"磅房门口，怎么出手这批粮","scene.market.p1":"镇粮站门口排满送粮的农用车。老陈夹着皮包站在磅房台阶上，老远朝你的车斗瞄了一眼。","scene.market.p2":"粮站统收省事，过磅结现钱；谷子饱满、或拍过宣传照，也能走精品原粮多挣一笔。","scene.market.c.marketing":"同学 B 剪的田间短片火了一把，几家精品米坊托人来收你的原粮。","scene.market.c.order":"老陈攥着白露签的单子，正等你的谷子过秤验货。","scene.market.c.quality":"袋里夹着些青瘪粒，验质怕是拿不到高分。","scene.settlement.title":"田空人静，灯下盘一季的账","scene.settlement.p1":"谷子卖空，麻袋叠进墙角。你在工具房灯下，把买种、雇工、买肥的条子摊了一桌。","scene.settlement.p2":"哪笔钱花在刀刃上，哪脚泥踩得值当，算盘拨过一遍，心里就通透了。","action.guyu.buy_coated_seed.label":"去原种站买红皮包衣新种","action.guyu.buy_coated_seed.detail":"谷壳外头裹过防病药衣的良种，发芽齐整、不闹怪苗，就是得先掏一百八本钱。","action.guyu.buy_coated_seed.result":"你把新种扛回田头，解开袋口，谷粒裹着一层匀净的红色药衣。","action.guyu.use_saved_seed.label":"用自家去年的留种","action.guyu.use_saved_seed.detail":"拿盐水漂掉瘪谷省下买种钱；但没经过药水消毒催芽，出苗不如新种齐。","action.guyu.use_saved_seed.result":"你端起竹簸箕迎风颠出轻糠，又拿盐水漂去浮谷，把沉底的留种备好了。","action.guyu.soak_seed.label":"药水泡种消毒，催出白芽再播","action.guyu.soak_seed.detail":"花八块钱买袋杀菌药兑温水泡种，裹上草包催出白芽尖，多费一道手，换出苗又齐又无病。","action.guyu.soak_seed.result":"夜里守着温度翻了两回草包，第二天掀开一看，谷粒齐刷刷破口露了白芽尖。","action.guyu.inspect_soil.label":"蹲下抓把田泥捏一捏","action.guyu.inspect_soil.detail":"试试泥底是黏是沙、田埂漏不漏水，摸清了底子后面好管水。","action.guyu.inspect_soil.result":"你蹲在田口抓起一把湿泥，在手指间捻了捻，心里有了数。","action.lixia.help_classmate_a.label":"应下同学 A，约好夏至去帮忙","action.lixia.help_classmate_a.detail":"先去河西打个照面，答应夏至过去帮记半天对照数据，顺便请教看叶追肥的门道。","action.lixia.help_classmate_a.result":"同学 A 推了推眼镜，在记录夹上标好夏至的日期：「到时见。这页看叶色比氮肥的表你先拿去看。」","action.lixia.clear_ditch.label":"下沟把枯草和陈泥掏干净","action.lixia.clear_ditch.detail":"趁还没插秧先把大田进出水沟清通，到了夏至晒田灌水都听使唤。","action.lixia.clear_ditch.result":"你套着黑胶鞋跳进沟里，把堵在拐弯处的陈泥一锹锹铲上岸，渠水哗地一下顺畅了。","action.lixia.borrow_shovel.label":"去老周家借那把顺手铁锹","action.lixia.borrow_shovel.detail":"老周那把旧锹刃口快、木把溜光，后头挖沟拍埂离不开它，记得秋分前刷净还人家。","action.lixia.borrow_shovel.result":"老周磕了磕烟袋，从墙角拎出铁锹递给你：「拿去使。敢给我卷了刃，唯你是问。」","action.lixia.inspect_roots.label":"拔一棵三叶小苗看看白根","action.lixia.inspect_roots.detail":"洗掉泥看看刚吃完谷壳老本的小苗根须壮不壮、水口有没有冒稗草。","action.lixia.inspect_roots.result":"你在渠水里涮净泥巴，几根寸把长的白根在手心里张开，还没有扎深。","action.mangzhong.transplant_early.label":"趁天没亮，自己带泥起秧抢早插完","action.mangzhong.transplant_early.detail":"省下雇工钱，连着护根土铲起秧苗，从早到晚弯腰插满一亩地，抢出几天缓苗期。","action.mangzhong.transplant_early.result":"退着步在浅水里插了一整天，直起腰时骨头咔吧响，好在一亩青秧全立住了。","action.mangzhong.hire_help.label":"花钱请两个村里快手一块插","action.mangzhong.hire_help.detail":"花一百六工钱买轻松，老手插得浅深一致、缓苗快，自己只需在田头递秧补漏。","action.mangzhong.hire_help.result":"两位村里老嫂子手脚麻利，不到半下午就把一亩地插得像拿尺子量过一样齐。","action.mangzhong.transplant_sparse.label":"拉线放宽行距，稀植壮秆","action.mangzhong.transplant_sparse.detail":"把行距留宽些，株间透风透光、秆子壮实抗倒，只是总苗数会少一点。","action.mangzhong.transplant_sparse.result":"你照着拉线宽行距插完，风吹过行间毫无阻碍，每丛秧苗都敞亮。","action.mangzhong.buy_ruler.label":"去镇上买把不锈钢水尺","action.mangzhong.buy_ruler.detail":"花十五块添置件随身量具，插在田口看刻度，往后管水深浅不用再靠眼瞎估。","action.mangzhong.buy_ruler.result":"花了十五块买回半截铁尺，红漆刻度清清楚楚，随手揣进了裤兜。","action.xiazhi.drain_trench.label":"放水晒田，逼着根往深土扎","action.xiazhi.drain_trench.detail":"听老周的「够苗晒田」：放干田水晒出细纹，压住没用的小分叉，让白根往深处找水。","action.xiazhi.drain_trench.result":"出水口一扒开，温吞的田水哗哗流走，黑亮的泥面见了太阳。","action.xiazhi.shallow_care.label":"浅水勤灌，白天晒暖夜里护苗","action.xiazhi.shallow_care.detail":"留薄薄一寸水提高泥温促新根，早晚跑两趟水口，把稻苗养得温润匀称。","action.xiazhi.shallow_care.result":"白天放到泥背似露非露，天擦黑再补回薄水，秧苗看着格外精神。","action.xiazhi.hold_water.label":"灌满深水压草，腾出手干别的","action.xiazhi.hold_water.detail":"稗草比稻子怕水淹。深水闷住草芽、留住青蛙，人也不用天天盯水口，只是少发几根新苗。","action.xiazhi.hold_water.result":"渠水灌满田面，没过了稗草嫩尖，几只青蛙扑通跳进了水里。","action.xiazhi.help_classmate.label":"花钱托人看水口，去河西帮同学 A","action.xiazhi.help_classmate.detail":"给邻田老哥二十块工钱代看半天水，自己过马路把答应同学 A 的事办妥。","action.xiazhi.help_classmate.result":"跟同学 A 蹲在河西田埂上对完了整本数据，那人低声说了句：「你的田比公式算的稳。谢谢。」","action.xiazhi.inspect_water.label":"顺着田埂巡一圈水口与沟渠","action.xiazhi.inspect_water.detail":"看看田心积不积水、外侧田埂有没有黄鳝洞渗水的湿印。","action.xiazhi.inspect_water.result":"你绕着田埂细看了一圈，把水路的底细摸清了。","action.xiazhi.dig_extra_ditch.label":"拎着老周的锹，下田补拉一道腰沟","action.xiazhi.dig_extra_ditch.detail":"把田心低洼处的死水引出去，整块田晒出匀称的鸡爪细纹，后头暴雨也不怕内涝。","action.xiazhi.dig_extra_ditch.result":"你在软泥里拉通一条浅沟，汪在田心的死水顺着沟槽流得干干净净。","action.xiazhi.leave_drain.label":"不下泥了，等它顺着坡自己干","action.xiazhi.leave_drain.detail":"省下挖沟的力气，四周干得快、中间干得慢些，倒也过得去。","action.xiazhi.leave_drain.result":"你拄着锹歇了口气，由着田心的积水在日头底下慢慢蒸发。","action.xiazhi.patch_bank.label":"挖黑泥把渗水的埂脚拍瓷实","action.xiazhi.patch_bank.detail":"趁还没漏大，把黄鳝洞和松泥拍死，保住这一田水。","action.xiazhi.patch_bank.result":"几锹湿黑泥拍上去抹平，田埂背面的渗水立刻止住了。","action.xiazhi.accept_seep.label":"插根草标做记号，暂且不动","action.xiazhi.accept_seep.detail":"眼下渗得还不凶，先省点力气，只要后头不撞上大暴雨就没事。","action.xiazhi.accept_seep.result":"你折了根芦苇插在湿印旁，拍拍手先回屋了。","action.dashu.irrigate.label":"开闸引清凉渠水，护住怀穗苗","action.dashu.irrigate.detail":"稻秆肚里怀着小穗子最怕高温渴水，赶紧引一层活水降温护穗。","action.dashu.irrigate.result":"清凉的渠水顺着水口漫进稻行，原本正午微卷的稻叶舒展开来。","action.dashu.mulch.label":"削净田埂荒草，拔掉行间大稗","action.dashu.mulch.detail":"不花钱的实在功夫：剃平埂边杂草断掉害虫藏身窝，顺手拔净田里抢肥的大棵稗草。","action.dashu.mulch.result":"田埂剃得利利索索，行间冒头的几株大稗草也连根拔上岸晒干，水田里清亮透风。","action.dashu.spray_tonic.label":"买叶面营养肥兑水喷一遍","action.dashu.spray_tonic.detail":"花四十五块买磷酸二氢钾叶面肥，给正在怀穗的稻子补口劲，抗高温、促大穗。","action.dashu.spray_tonic.result":"趁着傍晚无风背桶走了一遭，细密的肥雾均匀挂在叶片上。","action.dashu.rest.label":"回工具房竹床上睡个晌午觉","action.dashu.rest.detail":"大中午日头太毒，硬撑容易中暑，歇足了精神后头才干得动。","action.dashu.rest.result":"摘下草帽伴着窗外的蝉鸣睡了一觉，醒来灌下半壶凉白开，身上松快多了。","action.dashu.inspect_pests.label":"扒开稻丛查查虫口与蛛网","action.dashu.inspect_pests.detail":"看看叶背和稻脚有没有虫卵枯鞘，摸清田里的青蛙蜘蛛压不压得住虫。","action.dashu.inspect_pests.result":"你拨开十来丛稻子细看，蜘蛛网结得密，害虫没成气候。","action.liqiu.topdress.label":"看准顶叶深浅，酌情补把穗肥","action.liqiu.topdress.detail":"抽穗前看叶下肥：学过同学 A 的比色表或提前看过叶就能精准控量；要是苗旺还猛撒氮肥反而伤米质。","action.liqiu.topdress.result":"你照着苗情把肥撒进田里，刚破口探头的稻穗有了后续底气。","action.liqiu.dry_field.label":"不追氮肥，浅水透气养根保口感","action.liqiu.dry_field.detail":"听老周的话，叶绿就不多喂肥，靠浅水落干透气养住白根，煮出来的米饭又软又香。","action.liqiu.dry_field.result":"水口扒开一道窄缝，田面浅水自然落干透气，顶叶挺括精神。","action.liqiu.ask_classmate_b.label":"喊同学 B 来田头拍组稻花特写","action.liqiu.ask_classmate_b.detail":"那家伙嘴上嫌你这一亩地土，可微距镜头下稻花盛开的片子是真好看，秋后卖粮能当招牌。","action.liqiu.ask_classmate_b.result":"同学 B 嘴里抱怨着泥巴脏了鞋，却趴在田埂上认认真真拍了上百张稻花特写。","action.liqiu.inspect_leaves.label":"迎光比一比最顶上叶片的深浅","action.liqiu.inspect_leaves.detail":"先看清顶上的「剑叶」到底缺不缺肥，免得闭着眼乱撒化肥催出光长叶不熟穗的贪青苗。","action.liqiu.inspect_leaves.result":"你迎着光比了比顶叶颜色，对地里的肥力底子心里有数了。","action.bailu.accept_order.label":"接下老陈的包销单，收下定金","action.bailu.accept_order.detail":"定下 {quantity} 斤优质干谷，{price} 元/斤，当场拿 {deposit} 元定金；秋后交粮品质不能低于 {quality} 分。","action.bailu.accept_order.result":"老陈痛快地点出二百四现钱递过来，拍拍皮包：「秋分磅房见，我可只认足干的好谷子。」","action.bailu.ask_b_promote.label":"请同学 B 把生态稻宣传片发出去","action.bailu.ask_b_promote.detail":"趁着开镰前把这亩京西生态稻的名声打出去，卖粮时能引来识货的高价买家。","action.bailu.ask_b_promote.result":"同学 B 熬夜剪了条短片发上网，嘴硬说只是拿你练手，转头就把问价的米坊客户全推给了你。","action.bailu.dry_field.label":"退去深水走「跑马水」，临收前再断干","action.bailu.dry_field.detail":"照老周教的法子：薄水润过一层就自然落干，既保住老根最后半月不枯死，又让泥底慢慢紧实好下脚。","action.bailu.dry_field.result":"一层跑马薄水润过田面又很快排净，金黄的稻穗粒粒饱满，泥底也一天天紧实起来。","action.bailu.inspect_grain.label":"掐几粒稻谷试试里头硬实了没有","action.bailu.inspect_grain.detail":"看看谷粒里的白米浆凝实了没有、整穗饱粒率到没到火候。","action.bailu.inspect_grain.result":"你搓开几粒稻谷试了试软硬，对今年的灌浆成色心里有了准数。","action.qiufen.harvest_now.label":"趁天晴，今天直接挥镰收谷","action.qiufen.harvest_now.detail":"九成黄熟、落袋为安，不赌后面几天的天气，省得夜长梦多。","action.qiufen.harvest_now.result":"镰刀挥起，带锯齿的钢刃贴地划过，一捆捆沉甸甸的稻穗稳稳当当收进了场院。","action.qiufen.wait_three_days.label":"再晒三天秋阳，等晚熟谷粒彻底长满","action.qiufen.wait_three_days.detail":"赌这三天晴空万里——赌赢了斤两和成色双涨；要是撞上秋雨，掉粒裂纹可就要吃亏。","action.qiufen.wait_three_days.result":"你按捺住性子没动镰刀，每天抬头看三回天色。","action.qiufen.wait_three_days.result.good":"连着三天秋高气爽，连穗根底下的晚熟谷粒也长得饱饱的，咬开嘎嘣脆！","action.qiufen.wait_three_days.result.rain":"偏偏第三天撞上一场秋淋雨，稻穗泡湿掉粒不说，米粒里还多了晒裂的细纹。","action.qiufen.return_shovel.label":"把铁锹拿井水刷得锃亮，送还老周","action.qiufen.return_shovel.detail":"有借有还，再借不难，顺道请老周过目一眼今年的稻穗。","action.qiufen.return_shovel.result":"老周接过擦得锃亮的铁锹，顺手抓了把你的新谷放嘴里嚼了嚼：「嗯，这孩今年没白忙活。」","action.qiufen.taste_grain.label":"剥一粒新谷放进嘴里咬咬看","action.qiufen.taste_grain.detail":"学老周的土法子：拿牙齿咬一下，要是嘎嘣脆响不粘牙，就说明干透熟透了。","action.qiufen.taste_grain.result":"嘎嘣一声脆响，断面齐整不粘牙，嘴里满是新米的清甜气。","action.harvest.to_market.label":"装车，拉去镇粮站卖粮","action.harvest.to_market.detail":"干谷斤两已经过清，拉去磅房看看今年能卖个什么价。","action.harvest.to_market.result":"三轮车突突突地驶上村道，车斗里的麻袋堆得像座小山。","action.market.cancel_order.label":"跟老陈直说交不上，把单子退了","action.market.cancel_order.detail":"谷子不够数或成色差口气，定金是拿不回来了，好歹把事情了结掉。","action.market.cancel_order.result":"老陈叹了口气，把单据撕下来揣回兜里：「行吧，定金抵违约，明年看准了再签。」","action.market.finish_market.label":"袋子抖空，揣着钱回屋算总账","action.market.finish_market.detail":"仓里的粮全出手了，订单也交割清楚，该回去盘盘这一季挣了多少。","action.market.finish_market.result":"你把空麻袋卷成一捆扛在肩上，摸了摸鼓起来的衣兜，往回走去。","action.settlement.close_season.label":"合上账本，给这一季画个句号","action.settlement.close_season.detail":"收支落定，歇过这个冬天，明年开春再战。","action.settlement.close_season.result":"笔帽扣上，窗外蛙声早歇了，空旷的稻田在月色下安安静静。","fact.soil_center_soft.name":"田心泥软","fact.soil_center_soft.desc":"低洼处黏泥稀软，排水慢，夏至晒田不拉腰沟容易汪水。","fact.soil_firm.name":"泥底瓷实","fact.soil_firm.desc":"油沙壤底软硬适中，踩下去只陷半寸，排灌都省心。","fact.soil_leaky.name":"田埂暗漏","fact.soil_leaky.desc":"外侧埂脚有湿印，蓄水时得防备顺着黄鳝洞半夜跑水。","fact.roots_shallow.name":"白根浮浅","fact.roots_shallow.desc":"根须多盘在表层软泥里，夏至得晒田逼根往下扎。","fact.weeds_flush.name":"稗草冒头","fact.weeds_flush.desc":"水口边蹿出了几撮嫩稗草，不压住就要跟稻苗抢光抢肥。","fact.water_tight.name":"渠水偏紧","fact.water_tight.desc":"今年上游来水少，后半季怀穗抽穗用水得精打细算。","fact.seed_quality.name":"红皮良种","fact.seed_quality.desc":"原种站裹过防病药衣的新种，不闹怪苗，出苗齐整。","fact.leaf_color.name":"顶叶浓绿","fact.leaf_color.desc":"顶上的剑叶绿得发沉，地里肥力还足，切忌再重施氮肥免得光长叶不熟穗。","fact.pests_light.name":"虫口轻微","fact.pests_light.desc":"田里有青蛙和蜘蛛看家，零星小虫不成气候。","fact.grain_filling.name":"米浆凝实","fact.grain_filling.desc":"谷粒里的白浆已凝成半硬玉色，靠跑马水再养几日就能全硬。","fact.ditch_clear.name":"沟渠通畅","fact.ditch_clear.desc":"进出水沟提前掏干净了，引水晒田都痛快。","fact.fertilizer_bought.name":"备下化肥","fact.fertilizer_bought.desc":"托人从镇上捎回一袋尿素，撒完的编织袋还结实，你顺手收进了工具房。","item.straw_hat.name":"宽檐草帽","item.straw_hat.desc":"一顶竹篾编的宽檐旧草帽，帽顶晒得有些发白。大日头底下扣在头上，能遮住脸和后脖颈（烈日干活省力气）。","item.rubber_boots.name":"高筒胶鞋","item.rubber_boots.desc":"一双齐膝高的黑胶鞋，踩进深泥里不至于拔不出脚（下泥田省力气，沾满厚泥后可去渠边冲净）。","item.zhou_shovel.name":"老周的锹","item.zhou_shovel.desc":"老周借你的木把铁锹，把子被汗手盘得溜光，刃口快（挖腰沟、拍田埂必备，秋分前得刷净归还）。","item.water_ruler.name":"不锈钢水尺","item.water_ruler.desc":"半截不锈钢尺子，红漆刻度掉了点，揣在裤兜里，往田口一插就知道水深几寸。","person.zhou.name":"老周","person.zhou.role":"村里老农技员","person.zhou.desc":"五十七岁，揣着杆黄铜旱烟袋在这片稻田摸爬了四十年。嘴上爱嫌你笨，手底下最护苗，满肚子老农谚。","person.classmate_a.name":"同学 A","person.classmate_a.role":"河西试验田同届","person.classmate_a.desc":"总穿着洗得发白的旧衬衫在马路对面种对照田。话极少，只认本子上的实测数据，却常来你田埂边对账。","person.classmate_b.name":"同学 B","person.classmate_b.role":"农大新媒体同级","person.classmate_b.desc":"成天扛着云台和相机，嘴上嫌你这一亩地土得掉渣，却把最好的镜头和宣传全砸在了你田里。","person.chen.name":"老陈","person.chen.role":"收粮经纪人","person.chen.desc":"常年夹着皮包在镇粮站和各村之间转悠，眼神毒、算盘精，认好谷也认守信的人。","method.leaf_color.name":"看叶色补穗肥","method.leaf_color.desc":"从同学 A 的对照本上抄来的门道：看最顶上那片剑叶的深浅定氮肥，不瞎猜，也不怕催出光长叶不结穗的贪青苗。","memory.zhou.shovel_returned":"秋分前把铁锹刷得锃亮还了回去，老周嘴角翘了翘，说下回要用自己来墙角拿。","memory.zhou.shovel_missed":"借的铁锹拖过秋分都没还，老周见了面没吭声，但下回再借怕是难了。","memory.classmate_a.helped":"夏至如约去河西帮记了半天数据，临走时同学 A 把手抄的看叶色补肥表塞给了你。","memory.classmate_a.missed":"答应去河西帮忙却放了鸽子，同学 A 后来在路上碰见只点个头，再没提过数据的事。","memory.classmate_b.promoted":"同学 B 替你的稻田拍了一组大片发上网，好几个精品米坊买家顺着照片找了过来。","memory.chen.order_delivered":"保质保量交齐了二百斤订单好谷，老陈拔出验粮铁管直点头，说你这学生办事靠谱。","memory.chen.order_cancelled":"白露签的订单到头来没交上货，老陈扣下了定金，脸色也冷了几分。","commitment.classmate_a.records.title":"夏至去帮同学 A 记数据","commitment.classmate_a.records.desc":"立夏应下的事：夏至抽半天工夫去河西试验田帮忙记录对照数据。","commitment.zhou.shovel.title":"秋分前归还老周的锹","commitment.zhou.shovel.desc":"借老周的木把铁锹，说好了秋分收割前刷干净送回去。","commitment.chen.order.title":"给老陈交 200 斤优质干谷","commitment.chen.order.desc":"单价 3.1 元/斤，已收定金 240 元，要求实交 200 斤且成色不低于 55 分。","order.chen.rice.title":"老陈的包销单","order.chen.rice.desc":"200 斤优质干谷，3.1 元/斤，已收定金 240 元。","product.rice.name":"新稻谷","journal.season.start":"开春下田。今年赶上{year}，脚下是块{soil}。兜里揣着 {cash} 元本钱，体力 {stamina}。","journal.season.startNext":"又是一年开春。手头有 {cash} 元本钱，去年的门道和家伙事都还在。","journal.cause.trench.resolved":"夏至拉的那道腰沟立了功：急雨下来时，田心积水顺着沟槽排得飞快。","journal.cause.trench.expired":"夏至挖的腰沟这一阵没遇上大雨，慢慢被软泥淤平了。","journal.cause.hold.resolved":"夏至蓄下的那一田深水，在大暑天旱时帮稻苗顶过了难关。","journal.cause.hold.seep":"夏至没拍实的渗水田埂在大雨里豁了口子，田水跑了一截。","journal.cause.ditch.resolved":"立夏提前掏通了进水沟，夏至管水时水头一直很顺。","journal.cause.marketing":"同学 B 拍的那组稻田照片传开了，不少买家打听你这亩新谷。","journal.commitment.favor.missed":"忙忘了河西的事，失了同学 A 的约。","journal.commitment.loan.missed":"过了秋分也没把铁锹还给老周。","journal.commitment.order.delivered":"给老陈的二百斤订单好谷顺利交割，结清了尾款。","journal.commitment.order.cancelled":"老陈的订单没交上，二百四定金打了水漂。","journal.commitment.favor.fulfilled":"如约去河西帮同学 A 记完了数据。","journal.commitment.loan.returned":"把老周的铁锹刷干净送还了。","journal.harvest":"晒干过秤：实收干谷 {quantity} 斤，品质 {quality} 分（{grade}）。","journal.sale":"卖掉 {quantity} 斤干谷，进账 {amount} 元。","journal.settlement":"本季盘账：共收干谷 {quantity} 斤，总进账 {income} 元，总花销 {expense} 元，净挣 {net} 元。","journal.season.completed":"第 {season} 季账本合上，安稳过冬。","journal.term.begin":"交了{term}节气。{weather}","journal.rest":"在工具房竹床上歇了半天，缓过一口气来。","journal.commitment.open":"记下一桩事：{title}。","journal.commitment.fulfilled":"办妥了：{title}。","journal.commitment.missed":"失约了：{title}。","journal.commitment.cancelled":"退掉了：{title}。","journal.method.learned":"记下了新门道：{method}。","journal.item.gained":"添了件家什：{item}。","ledger.action_cost":"农事开销","ledger.deposit":"老陈预付定金","ledger.order_tail":"老陈订单尾款","ledger.sale_standard":"粮站统收卖粮","ledger.sale_premium":"精品原粮售粮","ledger.hire_help":"芒种雇工插秧","ledger.seed_coated":"买原种站红皮包衣种","ledger.seed_soak":"药水泡种催芽开销","ledger.ruler":"添置不锈钢水尺","ledger.fertilizer":"买叶面营养肥","ledger.irrigation_fee":"抽水引渠花费","ledger.help_watch":"请人代看水口","error.stale_revision":"田里的进度已经往前走了，请刷新页面再看。","error.wrong_run":"这是上一季的旧指令，用不到这一季里。","error.invalid_phase":"眼下这个节骨眼做不了这事。","error.scene_mismatch":"眼前的光景已经变了。","error.action_unavailable":"这活儿眼下干不了。","error.insufficient_resource":"差一口气：{resource}不够用了。","error.quote_expired":"这个收购价已经过去了。","error.commitment_state":"这桩事的进度已经变了。","error.inventory_shortage":"仓里的干谷不够数。","error.command_id_conflict":"操作指令重了，请重试一下。","error.content_incompatible":"这份存档跟现在的游戏版本对不上。","error.invariant_violation":"账目没对上，刚才这一步没算数。","error.detail.cash":"现钱","error.detail.stamina":"体力","error.reason.stamina":"力气不够了","error.re 割省力气，少掉粒，多收干谷）。","item.enamel_basin.name":"磕掉瓷的白盆","item.enamel_basin.desc":"原本是洗脸的白搪瓷盆，磕掉了几块瓷，如今专门斜插进稻丛底下拍查稻飞虱（看虫时能数清飞虱与蜘蛛，生态好的田可少打药）。","item.moisture_meter.name":"谷物水分仪","item.moisture_meter.desc":"同学 A 借你的小黑盒，抓一撮谷子拧紧就能测出含水率是不是到了十四点五以下（卖粮时防压秤扣水，单价高些）。","ui.gear.sectionTitle":"行头与家什","ui.gear.empty":"还没添置行头。","ui.gear.equipped":"已带在手边","ui.gear.stored":"收在工具房","ui.gear.borrowed":"借来","ui.gear.equip":"带上","ui.gear.unequip":"卸下","ui.gear.clean":"刷洗","ui.gear.repair":"修补/磨快","ui.gear.durability":"耐久 {value}%","ui.gear.muddy":"沾泥","ui.gear.broken":"用坏了","ui.gear.cleanHint":"冲净泥污，耐久回一点","ui.gear.repairHint":"花 {cash} 元修整","ui.gear.cleanDone":"已刷洗干净。","ui.gear.repairDone":"已修整好。","ui.gear.equipDone":"已带在手边。","ui.gear.unequipDone":"已卸下收好。","ui.gear.slot.head":"头部","ui.gear.slot.body":"身上","ui.gear.slot.feet":"脚上","ui.gear.slot.tool":"工具","ui.gear.slot.measure":"随身","ui.gear.comfort.good.sun":"草帽遮住后脖颈，还算凉快","ui.gear.comfort.warn.sun":"日头直晒头皮，有些燥热","ui.gear.comfort.good.rain":"高筒胶鞋护住小腿，踩泥踏实","ui.gear.comfort.warn.rain":"泥水灌进鞋窝，拔腿费劲","ui.gear.comfort.warn.muddy":"鞋帮裹满厚泥，迈步略沉","ui.gear.bonusNote":"随身家什按天气和活计省体力，也会磨损；沾泥后记得刷洗。","ui.actions.hintTouchConfirm":"点开细情，再点「确认拍板」。","gear.discovery.apron.narrative":"撒完肥，空化肥袋没舍得扔。你剪开洗净，在工具房里缝成一条围裙。","gear.discovery.basin.narrative":"你去工具房找家伙，角落里翻出个磕掉瓷的白搪瓷盆——正好拿去稻丛底下拍虫。","gear.discovery.meter.narrative":"同学 A 把一只测水分的小黑盒塞给你：「上回帮我记数据，这个你先用着。」","action.bailu.buy_sickle.label":"去镇上买把钢镰","action.bailu.buy_sickle.detail":"白露前后把镰刀备好，开镰时少掉粒。","action.bailu.buy_sickle.result":"你在五金铺挑了把细齿弯月钢镰，攥在手里正合手。","ledger.sickle":"买钢镰","ledger.gear_repair":"修整家什","ui.change.gearDurability":"{item}耐用度 {before} → {after}","ui.gear.repairFree":"磨一磨就好，不花钱","title.couplet.left":"春种一粒粟","title.couplet.right":"秋收万颗子","title.bannerAlt":"春山远岫，晨光水田，青秧初立","ui.nav.journal":"手记","ui.nav.people":"人物","ui.nav.items":"穿戴/藏品","ui.tab.journal":"手记","ui.tab.ledger":"流水","ui.tab.field":"田况","ui.tab.settings":"设置","ui.comfort.rowName":"体感","ui.comfort.none":"身上松快，没什么拖累","ui.action ":"你迎光比过这节的顶叶，知道了眼下肥劲的深浅。","fact.spider_nursery.name":"蛛网里有幼蛛","fact.spider_nursery.desc":"白瓷盆衬出了稻丛里的小蛛，田里有自己的看家帮手。","item.enamel_basin.desc":"旧白瓷盆，衬着虫样看得清。察看虫口少费一点体力，也更容易认出幼蛛。","item.moisture_meter.desc":"同学 A 借课题组余款送来的水分仪。粮晒干后验得明白，散卖时每斤少扣一角五的水杂价。","action.market.cancel_order.label":"与老陈退单，把预付款还清","action.market.cancel_order.detail":"退还已收的 {deposit} 元预付款，另付约好的 {fee} 元改单费；未卖的粮仍归你。现钱不够时，余款继续记账，后续收入先结清。","action.market.cancel_order.result":"你与老陈核对预付款和改单费，在单上划掉了这笔约定。已付多少、还欠多少，都照实记到账上；粮仍在袋里。","action.bailu.accept_order.label":"接下老陈的包销单","action.bailu.accept_order.detail":"约定 {quantity} 斤、{price} 元/斤，先收 {deposit} 元预付款，成色至少 {quality} 分。退单须退款，另付 {fee} 元改单费；不足的退款会结转，不能凭空抹去。","action.bailu.accept_order.result":"数量、成色和退单办法都写明了。老陈把预付款点给你，秋后按这张单交粮。","action.mangzhong.reserve_order.label":"先与老陈定下秋后的包销","action.mangzhong.reserve_order.detail":"先定住一部分销路；单价、预付款和退单办法都写在单上，后面的水肥得顾着这份成色。","action.mangzhong.reserve_order.result":"你在插秧前和老陈把条款说透，接下这一份固定价。往后的安排，心里多了一件要保住的事。","scene.bailu.p2":"老陈走到田头，问你要不要定下秋后的一份包销。数量、价钱和成色都得照单说清。","scene.mangzhong.p1":"老周念叨「春稻不插六月秧」。芒种一到，秧苗挪进大田，伤根先蔫几天。","scene.mangzhong.p2":"一亩田自己插太吃力；请两个快手，半天就能收工。","scene.market.p1":"镇粮站门口排满送粮车。老陈夹着皮包，老远朝你的车斗瞄了一眼。","scene.market.p2":"统收省事，过磅结现钱；谷子饱满或拍过照，也能走精品原粮多挣一笔。","scene.mangzhong.order":"老陈在路边问：秋后的干谷，要不要先定一份？","scene.xiazhi.order":"手里有老陈的包销单。守成色和赶这节农事，得一起盘算。","scene.lixia.overdue":"墙角那把锹还是老周的。上季没还，这季先把事情说清；东西还在，欠下的归还也还在。","scene.lixia.trusted":"上季刷净送回的锹，老周还记着。他说这回真有急用，先拿去，不必绕着话开口。","scene.lixia.a_return":"同学 A 又递来一张记录表：上次一起做过，这回看叶的办法你已经熟了，约不约仍由你自己安排。","scene.liqiu.b_return":"同学 B 还记得上季那组稻花照片，这回少了客套，可以直接商量拍摄和收粮的事。","scene.bailu.chen_return":"上季的粮足干足秤，老陈愿意在这一季把收粮数目让宽一点，价钱和成色照单说。","action.lixia.return_overdue.label":"先刷净铁锹，把上季欠的归还了","action.lixia.return_overdue.detail":"东西还给老周，这节仍可继续安排农事。借来的物件不能当自家的藏品留下。","action.lixia.return_overdue.result":"你把锹刃和木把都刷净送到门口。老周接过去试了试，点点头，这件旧事总算结清。","journal.water.drought":"到了{term}，水留得太少，稻子吃了一阵缺水的苦。根与穗的余地都受了影响。","journal.water.logged":"到了{term}，田心的水排不出去，根下憋闷；前面的排水准备这时才显出差别。","journal.water.ready":"{term}这一阵水接得上、也退得动，稻根稳稳接住了长势。","journal.water.drying":"夏至落干有了分寸，泥面透过气，根往下探了一截；后面还得接得上水。","journal.water.rain_trench":"雨来时，先前通开的沟把余水带走了。这一手准备在这时派上用场。","journal.water.hold_dry":"先前留下的一层水撑过了这阵干热，赴约也没有让田里断了照应。","journal.loan.carried":"铁锹还在手里，归还的事也随它留到下季，不能当作自家的物件。","journal.order.debt":"现钱暂时不足，尚欠的 {amount} 元已单独记账；接下来的卖粮收入会先结清这笔款。","journal.order.refund":"退单应退预付款 {deposit} 元，另付改单费 {fee} 元；实际支付见流水，未付部分继续记账。","journal.opportunity.none":"这回没碰上合适的旧家伙，事情就这样过去了。","journal.method.auto":"用上季攒下的看叶办法，你顺手辨清了这节的叶色，不必再反复查问。","ledger.order_debt_payment":"清偿退单未付款","ledger.order_refund":"退还老陈预付款","ledger.order_cancel_fee":"订单改单费","memory.chen.order_cancelled":"这份订单撤销了，已付与未付款项都有账可查。老陈记着这回事，下一次仍得把握好成色再应下。","journal.commitment.order.cancelled":"订单已退，预付款和改单费都有流水可查。","ui.change.causePending":"这次安排已记下，后面看实际条件","ui.quote.insufficient":"散卖的余粮不够；先照应已经答应的数量","ui.market.reserved":"给老陈留着 {quantity} 斤，未交割前不拿去散卖。","ui.receipt.more":"展开完整变化","ui.estimate.note":"田里估个约数，晒干上秤才是实数","prologue.tip2.text":"先读眼前的田况与约定。额外察看只帮你辨清问题，不会凭空让田里增产。","ui.notice.migrated":"旧档已转换，并保留一份原始备份；借物与未结订单也一起核对过了。","ui.notice.recovery":"这份存档暂时读不进来。原文仍保留着，可以先导出备份，再选择其他存档。","ui.settings.persistent":"进度已存入当前浏览器","ui.settings.memoryOnly":"本次只能暂存在内存，请及时导出备份"});j.facts["fact.spider_nursery"]={id:"fact.spider_nursery",nameKey:"fact.spider_nursery.name",descriptionKey:"fact.spider_nursery.desc"};for(const t of Object.values(j.orders))t.cancellationFeeFen=2e3;const qt=(t,e)=>({id:t,ruleId:e,labelKey:t+".label",detailKey:t+".detail",resultKey:t+".result",kind:"main",detailParams:null,costDescriptionKey:null,showIf:null,repeatable:!1});j.actions["action.mangzhong.reserve_order"]=qt("action.mangzhong.reserve_order","rule.bailu.accept_order");j.actions["action.lixia.return_overdue"]=qt("action.lixia.return_overdue","rule.qiufen.return_shovel");j.actions["action.mangzhong.reserve_order"].showIf={kind:"not",of:{kind:"any",of:["open","fulfilled","cancelled"].map(t=>({kind:"commitmentStatus",definitionId:"commitment.chen.order",status
