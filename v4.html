        ]},
    ]}},

  { id:"观测点", 重:58, 谁:"带队老师 · 组会前", 题:"这块地动不动得", 当:S=>S.flags["数-照实"]&&S.名望>=15,
    说:"「数是你自己填的，一个没动。」老师把表放下，\n「这块地别换人，你那本记录本留下来，我们做长期观测用。」",
    问:{ options:[
      { text:"留，我接着记",
        sub:() => "往后每一季都得照实填。填错一年，这块地的长期数据就废了",
        续题:"这块地往后几年归你记",
        续简:"长期观测点一记就是好几年。中间断一年，前面那些全白记。",
        续谁:"带队老师 · 组会前",
        续话:"他把表收进包里，抬头看你，等你往下说。",
        续:[
          { text:"问他：我这地是租的，换地了怎么办",
            sub:() => "地是租的，租约一年一签。这话现在不问，往后就是个坑",
            pick:st => { st.flags["后-接着记"] = true; st.flags["后-问换地"] = true;
                         记象(st, { 师: 3 }); 记象(st, { 主: 2 }); },
            后:"他想了想说：「换地就得重新起。所以这话你得先跟田主落死。」\n后来那条租约上多写了一行：换人提前一季说。" },
          { text:"先应下来，别的往后再说",
            sub:() => "长期观测点挂在你这儿，往后几年都得照实填",
            pick:st => { st.flags["后-接着记"] = true; 记象(st, { 师: 2 }); 记象(st, { 主: 1 }); },
            后:"他在表上填了你的名字。往后每年秋后多一张表，不多，一页。" },
        ]},
      { text:"留，但得先跟田主说一声",
        sub:() => "地是租的。观测点要挂好几年，换人换地就断了，这话得他点头",
        续题:"跟田主怎么开这个口",
        续简:"地是人家的。往人家地上挂点东西，说得再客气也是麻烦人家。",
        续谁:"带队老师 · 组会前",
        续话:"老师点了点头，说这话该说。笔搁下了，等你。",
        续:[
          { text:"把观测点这事原原本本跟田主说",
            sub:() => "挂几年、每年几趟、来的人动不动地。说全了，他才能拿主意",
            pick:st => { st.flags["后-挂观测点"] = true; st.flags["后-跟田主说了"] = true;
                         记象(st, { 主: 3 }); 记象(st, { 师: 1 }); },
            后:"田主听完只问了一句：「动我的地不？」\n你说不动，就是年年要看几趟。他说那行。后来他每年秋后都替你把田埂上的草锄了。" },
          { text:"先问他明年还租不租给我",
            sub:() => "挂不挂是后话。先得知道这一亩明年还是不是你的",
            pick:st => { st.flags["后-挂观测点"] = true; 记象(st, { 主: 2 }); },
            后:"田主说租，明年还租你。你这才把观测点的事说出口。\n两件事分开说，都比合在一起说省事。" },
        ]},
      { text:"算了，本子我自己留着",
        sub:() => "记录本是你的。你舍不得交出去",
        续题:"他没劝你",
        续简:"老师把包拉上了。这一句停在半空里，谁都没接。",
        续谁:"带队老师 · 组会前",
        续话:"他说「也行」，把包拉上。手在拉链上停了半秒。",
        续:[
          { text:"改口：留，但本子我留个底",
            sub:() => "观测点要的是那份表，不是你这一个本子",
            pick:st => { st.flags["后-接着记"] = true; st.flags["后-留底"] = true;
                         记象(st, { 师: 2 }); },
            后:"他说这样最好。往后每年他给你的那份表，你自己抄一份留着。\n后来那两份年年都对得上，一笔不差。" },
          { text:"不改口",
            sub:() => "本子是自己的，这点你分得清楚",
            pick:st => { 记象(st, { 师: -1 }); },
            后:"他走了以后，你把本子收回抽屉最里头。\n那一季再没人来问过你的数。" },
        ]},
    ]}},

  { id:"书呆", 重:66, 谁:"同学", 题:"本子厚了，米还是那个米", 当:S=>Object.keys(S.说法).length>=10&&S.stats.quality<45,
    说:"你抄了一本子的说法，一条一条背得出来。可田里的米还是那个等级。\n同学翻了翻你的本子，说：「这些我也能抄。」",
    问:{ options:[
      { text:"把本子合上，先去田里蹲半天",
        sub:() => "抄来的话一条没用上，那就先别抄了",
        续题:"田里那半天怎么过",
        续简:"本子合上了，可你手里没别的。抄的那些话还在脑子里，就看落不落得下去。",
        续谁:"同学",
        续话:"他没拦你，把本子推回给你，说了句「那你去」。",
        续:[
          { text:"挑抄得最熟的那一条，去田里对着看",
            sub:() => "背得最熟的那条，多半就是最没用上的那条",
            pick:st => { st.flags["后-下田"] = true; st.flags["后-对一条"] = true;
                         记象(st, { 周: 3 }); 记象(st, { 同: 1 }); },
            后:"你在田里蹲了一下午，把那条对着看了三遍。\n看出来的东西跟你背的不一样 —— 你那条背的是大田，你这是一亩。" },
          { text:"什么也不带，就蹲着看",
            sub:() => "不带本子去，看多少算多少",
            pick:st => { st.flags["后-下田"] = true; 记象(st, { 周: 2 }); 记象(st, { 同: 1 }); },
            后:"蹲到天擦黑，什么结论也没得出来。\n但你记住了虫子是从哪一侧爬上叶子的 —— 这个书上没写。" },
        ]},
      { text:"接着抄。抄完总比不抄强",
        sub:() => "本子厚了总是好事，这是你信的那套",
        续题:"本子又厚了一沓",
        续简:"抄这件事本身不坏。坏的是抄完之后那一亩还是老样子。",
        续谁:"同学",
        续话:"他看你又摊开本子，什么也没说，走了。",
        续:[
          { text:"挑几条这季用得上的，抄完就用",
            sub:() => "抄是为了用。哪条这季用得上，你自己清楚",
            pick:st => { 记象(st, { 同: 1 }); 记象(st, { 周: 1 }); },
            后:"这一季你真用上了两条。米没升等，但稗子比去年少了一成。" },
          { text:"从头抄到尾，一条不落",
            sub:() => "厚就好。这是你信的那套",
            pick:st => { 记象(st, { 同: -1 }); },
            后:"本子又厚了一沓。秋后过磅，米还是那个等级。\n同学没再翻过你的本子。" },
        ]},
      { text:"拿这本子去找老周，一条一条念给他听",
        sub:() => "让他告诉你，哪几条在你这一亩上根本不成立",
        续题:"他搬了个小凳坐下",
        续简:"他说「你念」。本子上有些话，在别处对，在你这块地上不对。",
        续谁:"老周",
        续话:"他搬了个小凳在田埂上坐下，说：「你念。」",
        续:[
          { text:"一条一条念完，等他说",
            sub:() => "念完再听。他要说的就在那几条上",
            pick:st => { st.flags["后-念给周听"] = true; 记象(st, { 周: 3 }); },
            后:"你念到第九条他开口了：「这条在我这儿不成立。前年试过。」\n你问他为什么，他说了两个字：「水凉。」" },
          { text:"念到一半就问：哪几条在你这儿不成立",
            sub:() => "省时间，但他得把话头接过去",
            pick:st => { st.flags["后-念给周听"] = true; st.flags["后-直接问"] = true;
                         记象(st, { 周: 3 }); st.名望 = (st.名望 || 0) + 8; },
            后:"他想了想，给你点了四条。四条里有三条书上写得明明白白。\n「书是老书，地在变。」他说。" },
        ]},
    ]}},

  { id:"土专", 重:72, 谁:"田里", 题:"比他快那一截", 当:S=>Object.keys(S.codex).length>=10&&S.名望>=40,
    说:"叶子刚泛黄，你蹲下去掰开基部看了一眼，就知道是什么了，不用再翻书。\n老周在旁边看着，说：「你现在比我快。」",
    问:{ options:[
      { text:"哪儿啊，我这也是跟您学的",
        sub:() => "实话，也是给他留面子",
        续题:"他没接这句客气话",
        续简:"他种了四十年。你这一句客气话，他听得出来。",
        续谁:"老周",
        续话:"他嗯了一声，眼睛还看着田里，没接你这句话。",
        续:[
          { text:"再补一句：那本本子我抄了三回",
            sub:() => "快不是白来的。三回抄本子这事他没看见",
            pick:st => { 记象(st, { 周: 3 }); },
            后:"他这回转过头来看了你一眼，说：「抄三回，那是笨功夫。」\n过了一会儿又添一句：「笨功夫管用。」" },
          { text:"把话岔开，问他这块地明年种什么",
            sub:() => "这一句到这儿就够了，不用往深里说",
            pick:st => { 记象(st, { 周: 2 }); },
            后:"他跟你说了个种法，说完就走了。\n那年秋天他确实照那个种法种的。" },
        ]},
      { text:"那您再教我一件事",
        sub:() => "他肯教你的就那几手了。趁他还在这一片",
        续题:"他想了想",
        续简:"手上的活已经交得差不多了。再教，教什么是个事。",
        续谁:"老周",
        续话:"他蹲下去，从兜里摸出烟，没点，就那么在手里捏着。",
        续:[
          { text:"问他：您看这块地，哪一步我做错了",
            sub:() => "他天天从这儿过。问他哪一步岔了，他答得出来",
            pick:st => { st.flags["后-再学一手"] = true; 记象(st, { 周: 4 }); },
            后:"他说：「不在这儿。在你秋天收得太早。」\n你愣住了。那一季你确实抢了三天。" },
          { text:"问他：您种了四十年，最不放心哪一步",
            sub:() => "他这四十年上栽过的跟头，比手上的活值钱",
            pick:st => { st.flags["后-再学一手"] = true; st.flags["后-问不放心"] = true;
                         记象(st, { 周: 3 }); st.名望 = (st.名望 || 0) + 12; },
            后:"他想了好一会儿，说了三个字：「看水的人。」\n水口那一摊事全靠人盯着。他说这话的时候，你听出来他不是在说技术。" },
        ]},
      { text:"嗯，是比您快了",
        sub:() => "他愣了一下，笑了。这话他听得进去",
        续题:"他笑了",
        续简:"这话不客气。可四十年的人听这种话，跟别人不一样。",
        续谁:"老周",
        续话:"他愣了一下，笑了。笑完把烟点上了，抽了两口才说话。",
        续:[
          { text:"再问他一句：是不是我哪儿还差着",
            sub:() => "他笑了不等于他没话。这句问出来，他才肯说",
            pick:st => { st.flags["后-认快"] = true; 记象(st, { 周: 3 }); },
            后:"他说：「你差的不是手。是种了两年就想改种法。」\n这话他记了一年多，今天才说出口。" },
          { text:"不说话了，接着干你的活",
            sub:() => "话说完了，田里的活还等着",
            pick:st => { st.flags["后-认快"] = true; 记象(st, { 周: 1 });
                         st.名望 = (st.名望 || 0) + 10; },
            后:"他抽完烟走了。往后这一片再有人问，他会说农大那个「比我看得快」。" },
        ]},
    ]}},

  { id:"同友", 重:50, 谁:"同学A", 题:"说了两年的那顿饭", 当:S=>S.印象.同>=4,
    说:"同学A 说，毕业前请你吃个饭，就去学校南门那家。\n「你那一季，我后来想了很久。」他说，「我当时要是也去看一眼就好了。」",
    问:{ options:[
      { text:"去，这顿饭得吃",
        sub:() => "他说这话不是客套。这顿饭你要是推了，往后就真推了",
        续题:"坐下来点了菜，话怎么起头",
        续简:"他说他想了很久。这句是起头，往下就看你怎么接。",

        续话:"他把菜单推给你，说「你点」，完了自己倒了杯水，没喝，就那么端着。",
        续:[
          { text:"跟他说：那阵子我也没想着叫你",
            sub:() => "他记着的就是这个。你先说，比他说省事",

            后:"他把杯子放下，说：「我知道。我就是觉得，看一眼也不耽误什么。」\n这顿饭后来吃了三个钟头。" },
          { text:"跟他说：想看现在看也不晚",
            sub:() => "田还在。他也还在。这一句比什么都实在",

            后:"他说行。第二天真跟你去了田里，蹲了半下午。\n蹲完他说：「我以为就是块地。」" },

      { text:"去，顺便叫他再来田里一趟",
        sub:() => "饭吃完了人还在。让他自己看看那一亩到底什么样",
        续题:"他来了田里",
        续简:"嘴上说一百遍不如让他蹲一次。可他来了之后看不看，不由你。",
        续谁:"同学A",
        续话:"他站在田埂上，手插在兜里，看了半天没吭声。",
        续:[
          { text:"把这一季的账翻给他看",
            sub:() => "八个节气哪一步花了多少、收回来多少，都在本子上",
            pick:st => { st.flags["后-吃那顿饭"] = true; st.flags["后-带同下田"] = true;
                         记象(st, { 同: 3 }); st.名望 = (st.名望 || 0) + 8; },
            后:"他翻了两页，说：「这个我会算。」\n翻到第五页他不说话了，一直翻到底。" },
          { text:"不给他看账，让他自己下田踩一脚",
            sub:() => "账是冷的。田是泥的",
            pick:st => { st.flags["后-吃那顿饭"] = true; st.flags["后-带同下田"] = true;
                         记象(st, { 同: 4 }); },
            后:"他脱了鞋下去踩了一脚，上来的时候脚上全是泥。\n「这么深。」他说。这一句比前面那些话都管用。" },
        ]},
      { text:"改天吧，田里走不开",
        sub:() => "他也没多说。这顿饭拖到毕业也没吃成",
        续题:"他说了句「行」",
        续简:"这个「行」跟上一个「行」不一样。你没接住，他也没再递。",
        续谁:"同学A",
        续话:"他说了句「行」，把手机收起来了，低头扒了两口饭。",
        续:[
          { text:"补一句：等收完这季我请你",
            sub:() => "话补得回来，日子补不回来。但补一句总比不补强",
            pick:st => { 记象(st, { 同: 1 }); },
            后:"他说好。收完那一季你想起来的时候，他已经回家过暑假了。\n再开学就是大四。" },
          { text:"不补。这顿饭就是没吃成",
            sub:() => "田里的事排在前头，这是你自己排的",
            pick:st => { 记象(st, { 同: -2 }); },
            后:"那顿饭一直没吃。毕业那天他跟你合了张影，笑得很正常。\n后来他在群里发过一张别的田的照片，没配字。" },
        ]},
    ]}},
  { id:"同冷", 重:55, 谁:"学院楼", 题:"楼道里那一声", 当:S=>S.印象.同<=-4,
    说:"在楼道里碰见同学A，他看见你，拐进了另一条走廊。\n后来你听人说，他那件事最后还是算在了他头上，带他的老师背了指导责任。",
    问:{ options:[
      { text:"喊住他",
        sub:() => "楼道里人来人往。你喊了一声，他停了一下",
        续题:"他停下来了，可没转身",
        续简:"他站住了，手还插在兜里，眼睛看的是楼道尽头那扇窗。",
        续谁:"同学A",
        续话:"你喊了一声，他站住了。没回头。",
        续:[
          { text:"走过去，站到他跟前说",
            sub:() => "他背对着你。话说给人听，得站在人跟前说",
            pick:st => { st.flags["后-叫住同"] = true; st.flags["后-当面说"] = true;
                         记象(st, { 同: 4 }); },
            后:"他听完了，说：「那事跟你没关系。」\n话说得挺硬，可他说完之后站着没走，等你先说下一句。" },
          { text:"先跟他说：那件事是我欠你的",
            sub:() => "他要听的是这一句。别的说再多都是绕",
            pick:st => { st.flags["后-叫住同"] = true; 记象(st, { 同: 4 }); },
            后:"他转过来了。「我又没让你赔。」他说。\n两个人就站在楼道里，一直到下课铃响。" },
        ]},
      { text:"装作没看见，错过去",
        sub:() => "两个人就这么走过去了",
        续题:"走过去之后，你回头看了一眼",
        续简:"他已经拐进那条走廊了。这一回你没喊，下一回就喊不出口了。",
        续谁:"同学A",
        续话:"走廊里就你们两个人。他拐进去了，你往前走了三步。",
        续:[
          { text:"停下，回头追过去",
            sub:() => "刚走过去三步。追回去还来得及",
            pick:st => { st.flags["后-叫住同"] = true; 记象(st, { 同: 3 }); },
            后:"你追到那条走廊口，他正靠着墙站着，没走。\n「我等你回头呢。」他说。" },
          { text:"往前走，不回头",
            sub:() => "这一步迈出去，往后就是两条路",
            pick:st => { 记象(st, { 同: -2 }); },
            后:"他那件事最后算在了他头上，带他的老师背了指导责任。\n这一条你在心里记了一季。" },
        ]},
      { text:"晚上给他发条消息，把话说清楚",
        sub:() => "当面说不出口的，写下来能写清楚",
        续题:"消息写完，停在发送键上",
        续简:"写下来的话，一次说不清楚就还能改。可发出去就收不回来了。",
        续谁:"同学A",
        续话:"你把那段话删了三遍。最后剩了两行，停在发送键上。",
        续:[
          { text:"发出去，两行就两行",
            sub:() => "短的那两行，比长的那段管用",
            pick:st => { st.flags["后-给同发消息"] = true; 记象(st, { 同: 3 }); },
            后:"他隔了半个钟头回了两个字：「知道。」\n第二天在食堂碰见，他端着盘子坐到你对面了。" },
          { text:"先删了，明天当面说",
            sub:() => "消息发出去就是证据。当面说，说完就过去了",
            pick:st => { st.flags["后-给同发消息"] = true; st.flags["后-当面说"] = true;
                         记象(st, { 同: 2 }); },
            后:"第二天食堂里你刚坐下，他就端着盘子过来了。\n你还没开口，他先说：「昨天那条，你发了我看见了。」" },
        ]},
    ]}},

  /* ── 收粮这条线 ──
     老陈的印象从哪来：合同不签、价先谈（−1/−2），把话写在纸上（+3）、
     跟他去粮站看着过磅（+3）、按说好的结工钱（+2）；
     或者倒过来：收了白条（−3）、条上要加两个点（−3）、工钱拖着（−3）。 */
  { id:"陈友", 重:50, 谁:"老陈 · 粮站", 题:"价给你留着", 当:S=>S.印象.陈>=4,
    说:"老陈打电话来，说今年的价他先给你留着，什么时候出米什么时候算。\n「你这个人，」他说，「数上不糊弄。」",
    问:{ options:[
      { text:"那就谢了。什么时候出米什么时候算",
        sub:() => "他信你，你也别端着",
        续题:"价留着，可留着的不只是一个数",
        续简:"这一季的谷子还没出米。价是按今天的行情定的，往后涨跌都归他担着。",
        续谁:"老陈",
        续话:"他在电话那头说行。停了一下，又说了句「今年雨少，你那边水够不够」。",
        续:[
          { text:"跟他说水够，顺口问一句他那边收成怎么样",
            sub:() => "他问了一句田里的事。你也问他一句",
            pick:st => { 记象(st, { 陈: 3 }); },
            后:"他说收得一般。又说：「不过我这库空着，你出多少我收多少。」\n这话比那个价实在。" },
          { text:"先把价定死在一张纸上",
            sub:() => "话在电话里，纸上什么都没有。定死了，往后谁也不亏",
            pick:st => { st.flags["后-价写纸上"] = true; 记象(st, { 陈: 4 }); },
            后:"他让你过去一趟，当着面把价写在单子上，两个人各按了个手印。\n「你这个人就是麻烦。」他说，说完把单子收进抽屉里了。" },
        ]},
      { text:"问他一句：这个数你自己担不担风险",
        sub:() => "价留着，粮跌了是他自己吃亏。这话得问出口",
        续题:"他笑了一声",
        续简:"这话他做了这些年，没人问过。他自己也没跟人算过。",
        续谁:"老陈",
        续话:"他笑了一声，说：「你问这个干嘛。」",
        续:[
          { text:"说：不能让你白担着，跌了按跌的算",
            sub:() => "话说到这份上，两个人的账才算真摊开",
            pick:st => { st.flags["后-问陈风险"] = true; st.flags["后-分摊"] = true;
                         记象(st, { 陈: 5 }); st.名望 = (st.名望 || 0) + 8; },
            后:"他想了半天，说：「按你说的办。」\n那一季粮价真跌了。他按跌的给你结的，一分没含糊。" },
          { text:"说：就是随口问问",
            sub:() => "问出口了又收回来，他看着呢",
            pick:st => { st.flags["后-问陈风险"] = true; 记象(st, { 陈: 3 }); },
            后:"他说：「我不担谁担。」把话头岔过去了。\n这一季他按留的价给你结的，比市价高了一毛二。" },
        ]},
      { text:"还是按市价走吧，别为我担着",
        sub:() => "该多少是多少，你不想欠这份人情",
        续题:"他说了句什么",
        续简:"这话是给他省事，也是给自己省事。可他不是图省事才这么干的。",
        续谁:"老陈",
        续话:"他嗯了一声，说：「行，那就按市价。」完了又把话头拉回来，「不过你那谷子出米率高，这个我照给。」",
        续:[
          { text:"谢他，出米率那部分照数结",
            sub:() => "该拿的拿着，不该拿的不拿",
            pick:st => { 记象(st, { 陈: 2 }); },
            后:"过磅那天你自己去了，站在秤边上看着他记数。\n「你倒是盯着。」他说。你说：「不是盯你，是记账。」" },
          { text:"连出米率那部分也推了，一律按市价",
            sub:() => "推干净了，往后见面清清爽爽",
            pick:st => { 记象(st, { 陈: 1 }); },
            后:"他没再坚持，按市价结了。\n结完他把一张单子推给你，说：「明年的，你先看看。」" },
        ]},
    ]}},

  { id:"陈断", 重:75, 谁:"镇上的粮站", 题:"没人来收了", 当:S=>S.flags["条-加价"],
    说:"转过年来，你的谷子没人来收。都嫌你事多。\n老陈没说不收，只是把价压得比谁都低。",
    问:{ options:[
      { text:"上门去，把去年那几条当面说清楚",
        sub:() => "价压得低是明摆着的。你去，是为了让他知道你知道",
        续题:"这话怎么开口",
        续简:"他那台秤就摆在门口。说软了没用，说硬了往后更难。",
        续谁:"老陈",
        续话:"他看见你来了，没起身，把算盘往边上推了推。",
        续:[
          { text:"把去年的单子摊在秤上，一条一条对",
            sub:() => "写清楚的那几条都在这儿。你把纸推过去，不说话",
            pick:st => { st.flags["后-找老陈"] = true; 记象(st, { 陈: 4 }); },
            后:"他对着看了半天，说：「你这一条，是我签的。」\n那一季他按市价给你收的。往后那几条他再没提过。" },
          { text:"先说软话，把这一季的谷先卖出去",
            sub:() => "价低就低，先把本钱收回来。话留到明年再说",
            pick:st => { st.flags["后-找老陈"] = true; st.flags["后-先低头"] = true;
                         记象(st, { 陈: 1 }); },
            后:"他压的那个价，你认了。过磅的时候他多给你算了二十斤。\n「这一季算我占你便宜。」他说。往后他还照压。" },
        ]},
      { text:"换一家，不跟他打交道了",
        sub:() => "这一片收粮的就那几个。换一家，谷还是要过他的磅",
        续题:"换的这一家，磅还是他那台",
        续简:"这一片就那几台秤。换人不换秤，等于什么都没换。",
        续谁:"老陈",
        续话:"你换的那家姓王。过磅那天你才看见，磅是老陈的，人也是老陈的伙计。",
        续:[
          { text:"认了，往后就当不知道",
            sub:() => "价按王家算的，磅按老陈的。这事在这一片是常事",
            pick:st => { st.flags["后-换粮商"] = true; 记象(st, { 陈: -2 }); },
            后:"这一季的价按王家算的，跟老陈那个低价差不多。\n这一片的事，你到第三年才算看明白。" },
          { text:"掉头回去找老陈，把话说明白",
            sub:() => "绕了一圈还是他。早知道就不绕这一圈了",
            pick:st => { st.flags["后-换粮商"] = true; st.flags["后-找老陈"] = true;
                         记象(st, { 陈: 3 }); },
            后:"他看你回来了，笑了一下，说：「绕一圈，还得来。」\n这回他没压价。" },
        ]},
      { text:"自己拉进城卖，不经过他",
        sub:() => "路是你自己找的，价也是你自己谈的",
        续题:"车装到一半，他过来了",
        续简:"这一片的粮都是过他手的。你自己拉走，等于把这一条路封了。",
        续谁:"老陈",
        续话:"你往车上装谷的时候，他背着手站在粮站门口看着，一直看到装完。",
        续:[
          { text:"接着装，装完就走",
            sub:() => "路是自己找的。他不来拦，你也不去打招呼",
            pick:st => { st.名望 = (st.名望 || 0) + 10; 记象(st, { 陈: -1 }); },
            后:"车开出镇口的时候你从后视镜里看了一眼，他还站在那儿。\n那一年城里的价确实高，可来回的运费和误工，你没算进去。" },
          { text:"装完过去跟他说一声：明年还卖给你",
            sub:() => "这一趟是探路，往后还得在这一片种",
            pick:st => { st.flags["后-留一条路"] = true; st.名望 = (st.名望 || 0) + 10;
                         记象(st, { 陈: 2 }); },
            后:"他说：「随你。」又说，「城里那家我认得，价高不高不好说。」\n第二年你才知道，他这句话是提醒你。" },
        ]},
    ]}},

  { id:"现钱", 重:62, 谁:"这一片", 题:"白条收不收", 当:S=>S.flags["条-要现钱"]&&S.印象.陈>=0,
    说:"后来这一片收粮的都知道，农大那个学生不收白条。\n有人嫌麻烦，也有人专门找他，现钱结的，省心。",
    问:{ options:[
      { text:"那就立个规矩，往后一律现钱",
        sub:() => "话许出去收不回来。往后有人拿白条来，你都得挡回去",
        续题:"规矩立了，来的人就杂了",
        续简:"找上门的有本村的，也有外村的。挡回去的人多了，话就多。",
        续谁:"这一片",
        续话:"头一个月来了四家。第三家是外村的，说了半天好话。",
        续:[
          { text:"一家一家挡回去，一条都不松",
            sub:() => "规矩就是用来挡人的。松一条，往后每一条都得松",
            pick:st => { st.flags["后-立规矩"] = true; 记象(st, { 陈: 3 });
                         st.名望 = (st.名望 || 0) + 12; },
            后:"挡到第四家，人家转身就走了。\n可从那以后，找你的人先问一句「现钱收不收」，再谈价。" },
          { text:"挡回去，但给人家指条路：去粮站找老陈",
            sub:() => "你不收，总得给人留个去处",
            pick:st => { st.flags["后-立规矩"] = true; st.flags["后-指条路"] = true;
                         记象(st, { 陈: 2 }); st.名望 = (st.名望 || 0) + 15; },
            后:"老陈后来听说了，跟你说了句：「你倒会做人。」\n「我这儿收白条。」他说，「可我记性好。」" },
        ]},
      { text:"熟人的白条可以收，别的一律现钱",
        sub:() => "留个口子，往后好说话",
        续题:"口子一留，就有人往里钻",
        续简:"熟人这两个字没边。谁算熟人，得你自己说了算。",
        续谁:"这一片",
        续话:"口子留了不到一季，就有人托熟人来问。",
        续:[
          { text:"把口子收死：只认本村，也只认三家",
            sub:() => "熟人得有数。不数清楚，口子就是洞",
            pick:st => { st.flags["后-立规矩"] = true; st.flags["后-口子收死"] = true;
                         记象(st, { 陈: 2 }); st.名望 = (st.名望 || 0) + 10; },
            后:"本村的就那三家。往后谁托人来说，你一句「你不在这三家里」，话就完了。" },
          { text:"谁来说都行，只要是熟人引的",
            sub:() => "这一片就是熟人社会。谁引的谁担着",
            pick:st => { 记象(st, { 陈: 1 }); },
            后:"到了秋天有两张白条没兑上。引荐那个人自己上门把钱送来了，脸很难看。\n第二季你把这条规矩改了。" },
        ]},
      { text:"有人专门来找，那就把这一条做成名声",
        sub:() => "现钱结的省心。这是你手上唯一比老陈强的地方",
        续题:"名声要做，就得立得住",
        续简:"名声是别人给的，可撑着名声的是你自己。哪一季你现钱结不出来了，名声当场就塌。",
        续谁:"这一片",
        续话:"有人专门从别的村过来找你。车停在田边，人下来先问现钱。",
        续:[
          { text:"跟他把话说死：米一过磅，当天结钱",
            sub:() => "当天结这条最难，也最值钱",
            pick:st => { st.flags["后-立规矩"] = true; st.flags["后-做成名声"] = true;
                         st.名望 = (st.名望 || 0) + 25; 记象(st, { 陈: 1 }); },
            后:"那天你手上现钱不够，跟同学借了两万，当天结了。\n这事传出去以后，来找你的人越来越多 —— 「农大那个，当天结。」" },
          { text:"先不打这个包票，按能结多少结多少",
            sub:() => "当天结的话说出去，遇上紧的月份就是打自己的脸",
            pick:st => { st.flags["后-立规矩"] = true; st.flags["后-现钱不打包票"] = true;
                         记象(st, { 陈: 2 }); st.名望 = (st.名望 || 0) + 12; },
            后:"你说了个期限：七天。七天这事办得到，办了三年没差过一天。\n名声没有当天结那么响，可也一直没塌。" },
        ]},
    ]}},

  /* ── 三产这条线 ── */
  { id:"认养", 重:68, 谁:"田边 · 五月", 题:"明年还认这份", 当:S=>S.third==="认养"&&S.stats.ecology>=60,
    说:"认养的人在田边站了一下午，孩子蹲下去摸稻叶，问这个是不是米。\n走的时候她说，明年还认这份。",
    问:{ options:[
      { text:"跟她说，明年这片田还在",
        sub:() => "话许出去容易。明年生态掉下来，你就兑不出这份米了",
        续题:"话许出去了",
        续简:"认养这份靠的是田里养得住。哪一年生态掉下来，人家的米就跟别人的一样了。",
        续谁:"认养的人",
        续话:"她笑了，说那就说定了。孩子问你要不要去看看他们家那盆花。",
        续:[
          { text:"记下来，明年的米按今年的养法出",
            sub:() => "认养这份，认的是这一亩养出来的米。养法一改，这份就没了",
            pick:st => { st.flags["后-续认养"] = true; st.flags["后-照今年的养法"] = true;
                         记象(st, { 村: 2 }); },
            后:"第二年开春她来电话问，你说照老规矩。\n那一季你为了保住生态，多花了两百多块钱，她不知道。" },
          { text:"先应下来，明年的事明年说",
            sub:() => "农业上的事一年一个样。话许太满，兑不出来更难堪",
            pick:st => { st.flags["后-续认养"] = true; 记象(st, { 村: 1 }); },
            后:"第二年她的孩子上小学了，来得少了。\n米还是照寄，只不过有两回是她自己下田来拿的。" },
        ]},
      { text:"把孩子领到田里，从稻穗讲到米",
        sub:() => "他问这个是不是米。这一句你能答半天",
        续题:"蹲在田边，怎么跟他讲",
        续简:"孩子问的是「这个是不是米」。这个问题不好答，答浅了没意思，答深了他听不懂。",
        续谁:"认养的人",
        续话:"孩子蹲下去揪了一粒，剥开看了看，说「这个是饭」。",
        续:[
          { text:"从这一粒剥到白米，一步一步给他看",
            sub:() => "剥开、搓开、对着光看。手上有的东西最好讲",
            pick:st => { st.flags["后-续认养"] = true; st.flags["后-带孩子看田"] = true;
                         记象(st, { 村: 2 }); st.名望 = (st.名望 || 0) + 10; },
            后:"剥了六粒，他的手上全是米糠。他妈妈在旁边拍了两张照片。\n照片后来发在朋友圈，第一行写的是「原来米饭这么来的」。" },
          { text:"让他自己插一株，秋天来看它变成什么样",
            sub:() => "讲一百句不如让他自己种一株",
            pick:st => { st.flags["后-续认养"] = true; st.flags["后-带孩子看田"] = true;
                         st.flags["后-留一株给他"] = true; 记象(st, { 村: 3 });
                         st.名望 = (st.名望 || 0) + 12; },
            后:"你在田角上给他留了一小片，插了六株。秋天他真来了。\n那六株收下来就一小把，他捧着不撒手。" },
        ]},
      { text:"先别许，等明年开春再说",
        sub:() => "你不敢保证明年生态还撑得住",
        续题:"她愣了一下",
        续简:"她说这话不是来讨的。她站了一下午，就是想说这句话。",
        续谁:"认养的人",
        续话:"她愣了一下，说「也是」，拉着孩子往外走。走到埂上又停下来，回头问了一句：「那明年我要是还想认，找谁？」",
        续:[
          { text:"给她留个话：想认就来找我",
            sub:() => "话没许死，门留着",
            pick:st => { 记象(st, { 村: 1 }); },
            后:"她说好，记了你的手机号。\n第二年她没来。第三年开春她来了，说去年孩子上小学忙。" },
          { text:"跟她说清楚：不是我推，是我真不敢保证",
            sub:() => "实话。她听不听得进去是另一回事",
            pick:st => { st.flags["后-跟她说明白"] = true; 记象(st, { 村: 1 }); },
            后:"她听完说：「能说这话的人不多。」\n她走了之后，那个下午你在田边坐到天黑。" },
        ]},
    ]}},

  { id:"研学", 重:68, 谁:"田边 · 秋分前", 题:"挂不挂这个点", 当:S=>S.third==="研学"&&S.stats.ecology>=60,
    说:"来的那批孩子一人拔了一根稗子，说要带回去给同学看。\n老师临走问你，能不能把这块田挂成学校的校外实践点。",
    问:{ options:[
      { text:"挂，我这边接着带",
        sub:() => "往后每年都得接几批孩子，田也得一直这么养着",
        续题:"这个点怎么挂",
        续简:"牌子挂上去容易。挂上去之后每年来的人、每年要出的力，都得先想清楚。",
        续谁:"带队老师",
        续话:"老师掏出笔来准备记。他说：「就写一年两批行不行？」",
        续:[
          { text:"一年接两批，我自己带",
            sub:() => "人不多，你带得过来。来的孩子能下田，不是站在埂上看",
            pick:st => { st.flags["后-挂实践点"] = true; 记象(st, { 师: 2 });
                         st.名望 = (st.名望 || 0) + 20; },
            后:"第一批来了四十二个孩子。下田的那半天，你嗓子全喊哑了。\n回去的时候有个孩子把稗子忘在田埂上了，你替他收着，收了三季。" },
          { text:"挂个名就行，来的人让村里接",
            sub:() => "你腾不出手。牌子挂着，人来了往村里领",
            pick:st => { st.flags["后-挂实践点"] = true; 记象(st, { 师: -1 });
                         记象(st, { 村: 2 }); st.名望 = (st.名望 || 0) + 10; },
            后:"村里接了头一年，第二年就跟你抱怨人多。\n牌子还挂着。来的孩子站在田埂上拍了照就走。" },
        ]},
      { text:"挂，但得先跟田主说一声",
        sub:() => "地是租的。牌子挂在别人地上，还得他点头",
        续题:"去跟田主开这个口",
        续简:"地里来来往往一大群孩子，踩的是人家的地。他点了头，这事才算数。",
        续谁:"田主",
        续话:"田主听完了，先问了一句：「不要钱吧？」",
        续:[
          { text:"跟他说清楚：不要钱，但来的人会踩地",
            sub:() => "不糊弄他。踩坏了哪一块，你赔",
            pick:st => { st.flags["后-挂实践点"] = true; st.flags["后-问了田主"] = true;
                         记象(st, { 主: 3 }); 记象(st, { 师: 1 });
                         st.名望 = (st.名望 || 0) + 18; },
            后:"他说：「踩就踩吧，我小时候也在田里踩。」\n又说了一句：「来的人要是踩了别人家的，你别管。」" },
          { text:"跟他说：来的人多了，村里能给他点好处",
            sub:() => "拿村里的好处去许，这话你说不算",
            pick:st => { st.flags["后-挂实践点"] = true; st.flags["后-许了田主"] = true;
                         记象(st, { 主: 1 }); 记象(st, { 村: -1 }); },
            后:"他去村里问了一趟，什么也没问着，回来脸不太好。\n牌子还是挂上了。往后他见了你话比从前少。" },
        ]},
      { text:"不挂。来的人多了，田就没法种",
        sub:() => "这一亩是拿来种稻子的，不是拿来当教室的",
        续题:"老师没再劝",
        续简:"他点了点头，把那张表收回去了。表上原本空着一栏，是田块编号。",
        续谁:"带队老师",
        续话:"他说「也行」，把表收进包里。收的时候那张表折了一下。",
        续:[
          { text:"跟他说明年再说，今年的稻子实在走不开",
            sub:() => "留个后年。田种得住，点挂得起来",
            pick:st => { st.flags["后-不挂"] = true; 记象(st, { 师: 1 }); },
            后:"他说：「明年你可得想着。」\n第二年开春他真又问了。你答应了，就是这版里那个点。" },
          { text:"不改口。就是不带人看田",
            sub:() => "这一亩是你的，你说了算",
            pick:st => { st.flags["后-不挂"] = true; 记象(st, { 师: -1 }); },
            后:"那一批孩子后来去了别的村。\n你的田埂上清净了，只是从那以后，再没人来问过你的种法。" },
        ]},
    ]}},

  /* ── 名声这条线 ── */
  { id:"名人", 重:88, 谁:"村里 · 开春", 题:"人家来问你种什么", 当:S=>S.名望>=60,
    说:"开春有人来问你今年种什么、什么时候插。问完还记在本子上。\n你才发现，这一带已经把你当成一个懂行的人了。",
    问:{ options:[
      { text:"从头到尾给他讲一遍",
        sub:() => "你才种了几季。可他问的时候是认真的",
        续题:"他记到第三行停下了",
        续简:"他本子上的字写得慢。写到「晒田」那两个字的时候，笔停住了。",
        续谁:"来问的人",
        续话:"他抬起头问你：「晒到什么样算够？」\n这一句把你问住了 —— 你自己是按手感的，说不上来。",
        续:[
          { text:"照实说：这个我说不精确，得看田面开没开缝",
            sub:() => "说不精确就说说不精确。含混过去，他回去是要照做的",
            pick:st => { st.flags["后-带人看田"] = true; 记象(st, { 村: 2 });
                         st.名望 = (st.名望 || 0) + 15; },
            后:"他把「田面开缝」四个字记上了，又在旁边画了个歪歪的小人蹲着。\n第二年他照做了，收成比前一年好。他见人就说这一句是你教的。" },
          { text:"给他讲个大概的日期，让他自己看着办",
            sub:() => "给日期比给手感到省事。可日期在那块地上不一定对",
            pick:st => { st.flags["后-带人看田"] = true; st.名望 = (st.名望 || 0) + 10; },
            后:"他记了日期，谢了你，走了。\n那年他按日期晒的，晒过了两天。稻子没死，但穗小了一圈。他没来找你说这事。" },
        ]},
      { text:"不讲了，领他到田里指着说",
        sub:() => "嘴上的都是书上的。田里的东西，得蹲下去看",
        续题:"蹲在田埂上，怎么指",
        续简:"指着说的事，你就得当场答得上来。田不会替你说。",
        续谁:"老周",
        续话:"你领他往田里走，路上碰见老周。老周看了你们一眼，没过来，站在远处看着。",
        续:[
          { text:"蹲下去，一样一样指给他看",
            sub:() => "水口、裂纹、叶色、基部。指到哪说到哪",
            pick:st => { st.flags["后-带人看田"] = true; 记象(st, { 村: 3 });
                         st.名望 = (st.名望 || 0) + 20; },
            后:"蹲了半个钟头，两个人都是一腿泥。\n老周一直站在远处。等你们起来，他转身走了。" },
          { text:"请老周过来一起说",
            sub:() => "这一片的事他比你熟。让他说，你在旁边听",
            pick:st => { st.flags["后-带人看田"] = true; st.flags["后-请周一起"] = true;
                         记象(st, { 周: 3 }); 记象(st, { 村: 2 });
                         st.名望 = (st.名望 || 0) + 20; },
            后:"老周过来蹲下，先没说话，用手把田面扒开给他看。\n「缝开到这个份上，」他说，「就够。」说完看了你一眼。" },
        ]},
      { text:"别把我当懂行的，我也在学",
        sub:() => "实话。这话说出去，有人觉得你实在，也有人觉得你不行",
        续题:"他愣住了",
        续简:"他来问，是因为人家告诉他这一片有个懂行的。你这一句把那个说法推翻了。",
        续谁:"来问的人",
        续话:"他愣在那儿，本子还摊着，笔停在半空。",
        续:[
          { text:"补一句：你要问，咱们一块儿去问老周",
            sub:() => "自己不懂，就把人指对。这是你能做的最实在的一件事",
            pick:st => { 记象(st, { 村: 2 }); 记象(st, { 周: 1 });
                         st.名望 = (st.名望 || 0) + 8; },
            后:"他真去找老周了。老周那天讲了一下午。\n后来这一片的人有事还是先来找你 —— 「农大那个，他不懂的会给你指对地方。」" },
          { text:"就这一句，说完接着干你的活",
            sub:() => "话到这儿就完了",
            pick:st => { 记象(st, { 村: 1 }); },
            后:"他把本子合上走了。后来再没人来问过你种什么。" },
        ]},
    ]}},

  /* ── 反向的、搞笑的 ── */
  { id:"照片", 重:60, 谁:"公众号", 题:"名字没写上", 当:S=>S.flags["拍-配合"],
    说:"那组照片最后还是用了，配的说明写的是「镇里的青年返乡创业」。\n底下评论说这片田种得好。你的名字没出现。",
    问:{ options:[
      { text:"找公众号，让他们把名补上",
        sub:() => "地不是你的，可这一季的稻子是你种的",
        续题:"电话打过去了",
        续简:"公众号是镇上的。那边接电话的人挺客气，说这个得问领导。",
        续谁:"公众号",
        续话:"那边说：「照片是镇里的，说明文字也是镇里定的。」停了一下又说，「你说怎么改？」",
        续:[
          { text:"就说加一句「由农大学生种植管理」",
            sub:() => "争的是这一句。名字加不加在其次",
            pick:st => { st.flags["后-要署名"] = true; st.名望 = (st.名望 || 0) + 15;
                         记象(st, { 村: -1 }); },
            后:"第二天那行字加上了，加在末尾，字号比正文小一号。\n村里有人看见了，说你这人爱较真。" },
          { text:"说：把我的名字加上，别的不用改",
            sub:() => "要的就是名字。这是你这一季的东西",
            pick:st => { st.flags["后-要署名"] = true; st.flags["后-点名"] = true;
                         st.名望 = (st.名望 || 0) + 18; 记象(st, { 村: -2 }); },
            后:"名字加上了，挂在「种植指导」四个字后头。\n镇里那边打电话来问了一句，语气不算好。这事你后来没跟人提。" },
        ]},
      { text:"算了。田种在那儿，谁拍的都一样",
        sub:() => "底下说这片田种得好，这就够了",
        续题:"这事你没再提",
        续简:"照片底下那一行字，你翻来覆去看了两遍，关掉了。",
        续谁:"老周",
        续话:"过了几天老周在地头跟你说：「那张照片，我看着眼熟。」他没往下说。",
        续:[
          { text:"跟他说：照片拍的就是这块地",
            sub:() => "他看得出来。这一片哪块地什么样，他比照片清楚",
            pick:st => { 记象(st, { 周: 2 }); 记象(st, { 村: 2 }); },
            后:"他说：「拍得好。就是没写谁种的。」\n他说完就扛着锹走了。这一句话你在心里放了一季。" },
          { text:"嗯一声，不接话",
            sub:() => "照片的事到这儿就过去了",
            pick:st => { 记象(st, { 村: 2 }); },
            后:"那一组照片在镇上的公众号里挂了一整年。\n你后来自己转了一次，配了一行字：「地是租的，稻子是种的。」" },
        ]},
      { text:"自己拍一组，每个节气拍一张",
        sub:() => "别人拍的是风景，你拍的是账",
        续题:"拍了六个节气了",
        续简:"一开始拍得挺顺。拍到第六张你才发现，前面几张的角度全是一样的。",
        续谁:"同学A",
        续话:"同学A 看了眼你的相册，说：「你这六张，我分不出哪张是哪天。」",
        续:[
          { text:"从下一季开始连人一起拍",
            sub:() => "地是一样的，人是变的。有人站在里头，那年那季就看得出来",
            pick:st => { st.flags["后-自己拍"] = true; st.flags["后-把人也拍进去"] = true;
                         st.名望 = (st.名望 || 0) + 15; },
            后:"老周肯站在田埂上让你拍 —— 条件是不许拍脸。\n两年攒下来那一组，田主看了半天，说想留一份。" },
          { text:"接着拍地，把日子写在照片角上",
            sub:() => "一样的角度才好对比。写上日子，就分得清了",
            pick:st => { st.flags["后-自己拍"] = true; st.名望 = (st.名望 || 0) + 10; },
            后:"八个节气八张，一个角度。三年下来二十四张摞在一起。\n翻到最后那张，你自己也愣了一下。" },
        ]},
    ]}},

  { id:"租牌", 重:55, 谁:"田埂上", 题:"新牌子钉在木桩上", 当:S=>S.flags["牌-拔了"],
    说:"镇上来人补了一块新牌子，这回是钉在木桩上的，拔不动。\n路过的人拍照，位置还是你这一亩。",
    问:{ options:[
      { text:"就这样吧，位置还是这一亩",
        sub:() => "牌子上没你的名字，地里种的是你的稻子",
        续题:"拍照的人一天比一天多",
        续简:"周末有人在田埂上摆了三脚架。稻子还没熟，田埂先踩出一条道来。",
        续谁:"老赵",
        续话:"老赵从田埂上过，绕开了那几个拍照的，脸上没什么表情。",
        续:[
          { text:"跟老赵聊两句，问他村里怎么看这块牌子",
            sub:() => "牌子的位置是你这一亩。村里人天天从这儿过",
            pick:st => { 记象(st, { 村: 2 }); 记象(st, { 赵: 2 }); },
            后:"老赵说：「牌子是镇里的，地是田主的，稻子是你的。三个人三样东西。」\n他说完就走了。这一句话比什么都清楚。" },
          { text:"什么也不说，回去接着干",
            sub:() => "牌子立在那儿也不耽误种地",
            pick:st => { 记象(st, { 村: 1 }); },
            后:"那一季来拍照的人踩坏了两垄。\n你在田埂上插了根竹竿，拉了一条绳。没人看那根绳。" },
        ]},
      { text:"去镇上问一句，这块田是我在种",
        sub:() => "争的是一块牌子，也是一句话",
        续题:"镇上的办公室里",
        续简:"接待你的人挺客气，问了半天才明白你说的是哪块地。",
        续谁:"镇上的",
        续话:"他把手里的文件放下，说：「牌子是宣传口立的，你说的这个我得问问。」",
        续:[
          { text:"把话说完：不是要牌子，是要别写错",
            sub:() => "不争面子，争的是别让人认错地方",
            pick:st => { st.flags["后-争牌子"] = true; st.名望 = (st.名望 || 0) + 18;
                         记象(st, { 村: -1 }); },
            后:"牌子后来改了一行，加在背面：「本块田由农大学生种植管理」。\n字小，得凑近了才看得见。但那是你自己去争来的。" },
          { text:"问到底：这个牌子谁定的、按什么定的",
            sub:() => "话问到底了，人家就得给个说法",
            pick:st => { st.flags["后-争牌子"] = true; st.flags["后-问到底"] = true;
                         st.名望 = (st.名望 || 0) + 12; 记象(st, { 村: -2 }); },
            后:"他翻了半天材料，最后说：「定的时候没想那么多。」\n这话你信。可村里从那以后见了你，客气是客气，话少了。" },
        ]},
      { text:"自己在田边立一块，写清楚是谁在种",
        sub:() => "不跟谁争。就是让路过的人知道这一亩有人管",
        续题:"自己这块牌子上写什么",
        续简:"一块牌子能写下的字不多。写什么，就看你最在意哪一样。",
        续谁:"田主",
        续话:"你拿着板子去田边的时候，田主正蹲在埂上。他抬头问你：「你也立一块？」",
        续:[
          { text:"写：这一亩由农大学生种植管理",
            sub:() => "跟镇里那块避开，但把话说明白",
            pick:st => { st.flags["后-自己立牌"] = true; 记象(st, { 主: 2 });
                         st.名望 = (st.名望 || 0) + 12; },
            后:"牌子立上了，比镇里那块矮一截。\n有人拍照的时候两块都拍进去，评论区里有人问：怎么有两块牌子。" },
          { text:"写：这一亩，田主某某，种的人某某",
            sub:() => "把两个人的名字都写上。地是人家的，这没什么好藏的",
            pick:st => { st.flags["后-自己立牌"] = true; st.flags["后-写上田主"] = true;
                         记象(st, { 主: 4 }); st.名望 = (st.名望 || 0) + 15; },
            后:"田主蹲在那儿看了半天，说：「我名字写小点儿。」\n后来他每年开春都拿布把那块牌子擦一遍。" },
        ]},

  { id:"不种", 重:64, 谁:"老周", 题:"今年到底种不种", 当:S=>(S.问周总||0)+(S.问周||0)>=6,

  /* ══ 130 往后那四扇门（v5.9.8 新加）══

     他选的补救是「130 之后再加新门和新内容」。

     实测（_望涨.mjs，真跨季 24 季）：130 那道门第 11 季就推开了，
     到第 24 季名望 389 —— 后面十三季，这四扇门一扇都没有，
     攒下来的全是死数。这就是"很容易就拉到很高"的实话：
     不是名望涨得太快，是**涨到 130 之后就没地方去了**。
     所以这四条不是"再给点好处"，是把 130 往后的路接上：
        170 立会 —— 这一片议事情，喊得动人来
        220 代言 —— 镇里往外说这一带，稿子里有你这一句
        280 传种 —— 你留的种、你的种法，别人照着做
        360 入志 —— 镇志里这一亩单记一笔
     一条比一条难，一条比一条沉。最后那条落在"记一笔"上，
     是因为这一亩本来就是京西稻的遗产地 —— 玩家种到最后，
     种的不是米，是这一片还有人记得怎么种。

     ⚠ 四条的 当 都只读 名望，不读别的。理由跟低名望那三件一样：
       名望是跨季攒的数，读它最稳；再叠一个条件（比如"认得"够不够），
       就会出现"名望够了可这条永远不出现"的死条目，而且不会报错。 */

/* ── 后话 ──
   用户原话：「我想的"转过年来"那些不仅是给几段文字，最好再是那种可以进一步
   互动和多次决策、能解锁成就的具体事件」。所以这一块从**一段话**改成了
   **一趟路**：结算屏上只留一眼看得见的一行引子，点「去走一趟」进去，
   一件一件是真事，每件有一屏选项（有的还带第二层），走完才记账、才发牌子。

   ⚠ 什么算"走过"：玩家**真走完那一趟**，不是你把它渲染出来。
     原来那个版本在 后话() 里就 存档({见后话}) —— 渲染函数顺手改存档，
     是这个文件里最不该有的东西：viewYearEnd() 一屏会被渲染两次
     （结算一次、牌子发完再一次），第二遍 见后话 里已经有这几条了，
     于是整块「转过年来」当场消失。实测：第一遍 3 条 + 标题，第二遍连标题都没了。
     现在 后话() 是纯的 —— 同一屏渲染一百遍，印出来的是同一份。

   ⚠ 滚动账（v5.9.7）：见后话 里记的从 `true` 改成**季号**，判
     "隔 NUM.后话冷场 季可以再来一趟"。原来记的是永久一次性账 ——
     走过就不再走，系统只会枯竭；40 季真打下来，22 条里 12 条一次没露过脸。
     不是够不着，是排不上队。老档里的 `true` 一律当成"很久以前"处理，
     让它回到队里 —— 不然用户手上那一档永远看不到新的。 */
const 后话一屏 = 3;                       // 一趟最多几件。多了就成了清单，没人走得完
const 已走过 = (S, id) => {
  const v = (S.见后话 || {})[id];
  if (!v) return false;
  if (v === true) return false;           // v5.9.6 及以前的老档：让它回到队里重排
  return (S.季 || 1) - v < NUM.后话冷场;
};
function 待后话(S) {
  return ECHO.filter(e => { try { return !!e.当(S); } catch (err) { return false; } })
    .filter(e => !已走过(S, e.id))
    .sort((a, b) => b.重 - a.重);
}
/* 引子那一行 —— 取第一句，长了截断。这一行是"要不要去走这趟"的钩子，
   不是正文；正文在链子上，那儿整段都在。 */
const 引子 = s => {
  const 一 = String(s).split("\n")[0];
  return 一.length > 34 ? 一.slice(0, 34) + "…" : 一;
};
/* 这一季走过了没有 —— 账本上那一块靠它决定还给不给按钮。
   记的是**季号**，不是 true：跟 见后话 一个道理，跨季的账得能自己作废。
   ⚠ 它落在档里（收年话 存档 时带上），因为玩家可能走完就关掉页面，
     下回打开是"这一季的后半截" —— 不存的话按钮会重新冒出来，
     又变成点进去发现没得走。 */
const 本季走过后话 = S => (S.后话趟 || 0) === (S.季 || 1);

function 后话(S, r) {
  const 中 = 待后话(S);
  if (!中.length) return "";
  const 走了 = 本季走过后话(S);
  const 显 = 中.slice(0, 后话一屏), 剩 = 中.length - 显.length;
  /* ⚠ 走过这一趟之后，这一块换个说法，**按钮拿掉**。
     留着按钮的话，玩家点进去发现还是那三件（其实下次是另外三件），
     走完又摔回这张一模一样的屏 —— 一季连点三趟，人就不认识自己在哪儿了。
     用户原话：「一直在那里循环，让人摸不着头脑」。
     现在换成一句有数的话：还剩几件、排在后面几季。 */
  const 头 = 走了
    ? `<h3 class="title" style="font-size:17px">转 过 年 来</h3>
       <p class="grade-note" style="margin:-2px 0 10px">这一季走完了。剩下 ${中.length} 件，排在后面几季。</p>`
    : `<h3 class="title" style="font-size:17px">转 过 年 来</h3>
       <p class="grade-note" style="margin:-2px 0 10px">这些是前几季攒下的，到今天才轮得上。</p>`;
  const 尾 = 走了 ? "" : `<button class="go" onclick="to年话()">去 走 一 趟</button>`;
  return `${头}
    ${显.map((e, i) => `<div class="say" style="animation-delay:${i * .09}s">
      <span class="who">${esc(e.谁)}</span>
      <p style="white-space:pre-line">${esc(引子(e.说))}</p></div>`).join("")}
    ${!走了 && 剩 ? `<p class="grade-note">还有 ${剩} 件排在后面。</p>` : ""}
    ${尾}`;
}

/* ── 把待办的后话搭成一条链 ──
   形状跟 S.后段 一模一样（见 建后段），因为走的是同一套机器
   （viewChain / onChain 的 续、回、设）。一件后话 = 一步。
   ⚠ 没写 问 的那些，仍然给一个"知道了"的按钮，不直接跳过去 ——
     不然那一趟走着走着突然自己翻页，玩家会以为卡了。 */
function 建年话(S) {
  return 待后话(S).slice(0, 后话一屏).map(e => ({
    id: e.id, 后话: e,
    term: "年 后", who: e.谁,
    title: e.题 || "转 过 年 来",
    brief: e.引 || "这些是前几季攒下的，到今天才轮得上。",
    say: e.说,
    options: e.问 ? e.问.options
      : [{ text: "知道了", sub: () => "这一趟就到这儿", pick: () => {} }],
  }));
}
/* 走完一趟：记账（按季号），再把这一趟换来的牌子补上。
   ⚠ 牌子必须在**这里**补一次 结成就：年终那一趟早就跑过了，
     后话里立的旗要是不补扫，得等到明年年终才发 ——
     玩家刚做完的事，隔一年才给牌子，那就不叫反馈了。
     传 r=null 跟季中那三次 扫成就 一样：金牌的 when 全要 r，不会误发。 */
function 收年话(S) {
  const 链 = S.年话 || [];
  const 见 = { ...(S.见后话 || {}) };
  链.forEach(c => { 见[c.id] = S.季 || 1; });
  S.见后话 = 见;
  /* ⚠ 这一趟改的那些跨季量，得在这儿落一次档。
     年终() 是写 名望/存/印象/前事 的地方，可它**跑在这一趟之前** ——
     后话里挣来的印象、名声、钱、旗子，不在这儿补一笔，
     出了这一屏就没了：下一季 newSeason 从档里读，读回来的是年后的旧数。
     ⚠ 这一季的 前事（= 下一季的 S.旧）在这儿被抄了第二遍，是有意的：
       它跟 年终 那一次是**同一个季**，一前一后，抄的是同一本账的最终版。
       别的地方再抄就真错了（见 年终 里那条注释）。 */
  S.后话趟 = S.季 || 1;                   // 这一季这一趟走完了（见 本季走过后话）
  存档({ 见后话: 见, 后话趟: S.后话趟, 名望: S.名望 || 0, 存: Math.round(S.现金 || 0),
          印象: { ...(S.印象 || {}) }, 前事: { ...S.flags } });
  const got = 结成就(S, null);
  if (got.length) 发牌(got);
  return got;
}

/* ── 图鉴 / 成就 ── */
const 分类 = ["田里的", "手上的", "肥", "水", "虫", "收", "药", "灾"];
function viewBook() {
  const keys = Object.keys(CODEX);
  const got = keys.filter(k => S.codex[k]).length;
  const groups = 分类.filter(c => keys.some(k => CODEX[k][0] === c));
  let body;
  if (tab === "成就") {
    /* 按档位分组，每组标出 x/y —— 差一块金牌没拿到，比"成就 7/24"勾人 */
    body = ["金","银","铜"].map(级 => {
      const 组 = ACH.filter(a => (a.级 || "铜") === 级);
      if (!组.length) return "";
      const 得 = 组.filter(a => S.ach[a.id]).length;
      return `<h3 class="title" style="font-size:15px;letter-spacing:.14em;margin:20px 0 6px">
          <span class="lvdot ${级}"></span>${级}牌 · ${得}/${组.length}</h3>`
        + 组.map(a => {
          const has = S.ach[a.id];
          if (!has) return `<div class="cx lock"><div class="h">
            <b>？ ？ ？</b><span class="cat">还没拿到</span></div></div>`;
          return `<div class="cx"><div class="h"><b>${esc(a.名)}</b></div>
            <p>${esc(a.说)}</p></div>`;
        }).join("");
    }).join("");
  } else if (tab === "全部") {
    body = keys.map(k => {
      const has = S.codex[k], [cat, txt] = CODEX[k];
      return has
        ? `<div class="cx"><div class="h"><b>${k}</b><span class="cat">${cat}</span></div><p>${txt}</p></div>`
        : `<div class="cx lock"><div class="h"><b>？ ？ ？</b><span class="cat">${cat}　还没见过</span></div></div>`;
    }).join("");
  } else {
    body = 分类.filter(c => c !== "肥" || tab === "肥").map(c => {
      const inC = keys.filter(k => CODEX[k][0] === c);
      if (!inC.length) return "";
      return `<h3 class="title" style="font-size:15px;color:var(--dim);letter-spacing:.14em;margin:20px 0 4px">${c}</h3>`
        + inC.map(k => {
          const has = S.codex[k];
          return has
            ? `<div class="cx"><div class="h"><b>${k}</b></div><p>${CODEX[k][1]}</p></div>`
            : `<div class="cx lock"><div class="h"><b>？ ？ ？</b><span class="cat">还没见过</span></div></div>`;
        }).join("");
    }).join("");
  }
  const 成就数 = ACH.filter(a => S.ach[a.id]).length;
  return `<div class="step">这一季记住的东西</div>
    <div class="tabs">
      <button class="${tab==="田"?"on":""}" onclick="setTab('田')">田里的</button>
      <button class="${tab==="手上的"?"on":""}" onclick="setTab('手上的')">手上的</button>
      <button class="${tab==="全部"?"on":""}" onclick="setTab('全部')">全部 ${got}/${keys.length}</button>
      <button class="${tab==="成就"?"on":""}" onclick="setTab('成就')">成就 ${成就数}/${ACH.length}</button>
    </div>${body}<div class="spacer"></div>
    <button class="go sm ghost" onclick="backToGame()">${书来源 === "封面" ? "回 到 封 面" : "回 到 田 里"}</button>`;
}

function render() {
  app.innerHTML =
    screen === "practice" ? viewPractice() :
    screen === "cover"    ? viewCover()    :
    screen === "pull"     ? viewPull()     :
    screen === "event"    ? viewEvent()    :
    screen === "decision" ? viewDecision() :
    screen === "result"   ? viewResult()   :
    screen === "note"     ? viewNote()     :
    screen === "miban"    ? viewMiban()    :
    screen === "hangqing"? viewHangqing()  :
    screen === "chain"    ? viewChain()    :
    screen === "年话完"   ? view年话完()   :
    screen === "book"     ? viewBook()     :
    screen === "log"      ? viewLog()      :
                            viewYearEnd();
  const p = screen === "cover" || screen === "practice" || screen === "pull" || screen === "log" ? 0
    : screen === "hangqing" ? 8/13
    : screen === "chain" ? (8 + (S.chainIndex||0)) / (8 + (当前链().length||5))
    : screen === "年话完" ? 1
    : screen === "miban" ? 8/12
    : Math.min(S.termIndex, 8) / 12;
  document.getElementById("bar").style.transform = `scaleX(${p})`;
  showFieldEventResult();
  起动画();
  window.scrollTo(0, 0);
  triggerFieldEvent();
}

/* ── 流程 ── */
function nextTerm() {
  pendingEvents = dueEvents(S, S.termIndex);
  事件位 = 0;
  flash = {};
  pendingEvents.forEach(e => { for (const k in e.delta) if (e.delta[k]) flash[k] = e.delta[k]; });
  screen = pendingEvents.length ? "event" : "decision";
  render();
  扫成就(null);   // 回响落地，顺手看看这一下有没有撞出个什么
}

window.startGame = function () {
  S.termIndex = 0; screen = "pull"; render();
  /* 抽卡的动静按档位给 —— 上上/下下的琶音，其余只翻个页 */
  const y = S.年景, 级 = y.级 || "R";
  响(级 === "SSR" ? (y.色 === "d" ? "凶" : "金") : "抽");
};
window.toField   = function () { nextTerm(); };
window.toDecision = function () { screen = "decision"; render(); };

/* ── 事件一条一条过 ── */
window.nextEvent = function () {
  事件位++;
  if (事件位 >= pendingEvents.length) { 事件位 = 0; toDecision(); return; }
  render();
};

/* 蹲下去看 / 问老周 —— 每一下换回来一条线索。
   线索是攒着的，不是一问就有答案：攒够 z.成 点，才认得出那是什么。
   攒不够也没关系，"先记着，回头再说"就是那条收手的路 ——
   有时候它是对的（体力见底的时候），有时候你就是白丢了一季的眼力。 */
window.onDiag = function (i) {
  const e = pendingEvents[事件位];
  if (!e || !e.诊 || e.诊.点过[i] || e.诊.完) return;
  const s = e.诊.步[i];
  if (!s) return;
  e.诊.点过[i] = true;
  const 分 = s.值 === undefined ? 1 : s.值;
  /* 这一条的分量够不够单独立案。够的话它就是"定案的那一处" ——
     名字马上出来，所以这一条既是过程也是结论，得让玩家看见是它定的案。 */
  e.诊.得.push({ wh: s.wh || s.text, 得: s.得, 定: 分 >= e.诊.成 });
  if (s.收) e.诊.完 = true;                       // 自己说不看了，就不看了
  else e.诊.值 += 分;
  if (s.费) S.stamina = Math.max(0, S.stamina - s.费);
  /* 探查也要花体力，所以这两笔在这儿也得记 ——
     只记在 choose 里的话，一季下来全是查看、没怎么选的人会被漏掉。 */
  if (S.stamina < (S.最低体力 === undefined ? 99 : S.最低体力)) S.最低体力 = S.stamina;
  S.体力花 = (S.体力花 || 0) + (s.费 || 0);
  /* 「你种不种」—— 遇到事情就往老周那儿跑的次数。标在选项上，不按 wh 的字面猜。 */
  if (s.问周) S.问周 = (S.问周 || 0) + 1;
  /* 亲手看了一条线索。整季一条没看的，和每条都看全的，是两种人。 */
  S.探查 = (S.探查 || 0) + 1;
  响(s.收 ? "坏" : "tap");
  render();
};

/* 治 —— 认出来了才有这一步。dueEvents 已经按最坏的那笔账扣过了，
   处置给的是**补回来的差价**（o.补），所以同一件事，
   看出来了和没看出来，最后落在数上的不是同一个数。 */
window.onTreat = function (i) {
  const e = pendingEvents[事件位];
  if (!e || !e.诊 || e.诊.治) return;
  const o = (e.诊.处置 || [])[i];
  if (!o) return;
  /* ⚠ 画的时候不画按钮，这里还得再拦一道 —— 判定只有 开着() 这一个出口，
     跟渲染那一处共用同一个条件，免得两边漂掉（小字 那回就是这么漂的）。 */
  if (!开着(o, S)) return;
  /* ── 分层的口子（v5.9 午饭用）──
     o.续 的意思是"这一条只是往哪儿走，还没到这一顿"。
     把 续 里的 问 / 处置 换上来当新的一层，重画，然后**什么都别记** ——
     第一层是导航，不是消费。所以这一段必须在下面那些 解() 之前。
     ⚠ 不设 e.诊.治。设了就成"已经处置过了"，渲染器直接跳到结账那一屏，
       第二层永远出不来，而且不报错。
     ⚠ e.诊 是活的对象（挂在 pendingEvents 上），改它就是改这一屏的状态，
       不用另外存一份。上 只是留下来给以后写台词用的。 */
  if (o.续) {
    (e.诊.上 || (e.诊.上 = [])).push(o.text);
    e.诊.问 = o.续.问 || e.诊.问;
    e.诊.处置 = o.续.处置 || [];
    响("tap"); render();
    return;
  }
  /* ══ 先把所有认函数的口子算清，再动手改 S ══
     ⚠ 这两句话是踩出来的，不是讲究。
       原来 费/钱 在最前头算、象 在中间算、回/说 在最后算，
       而下面 `记隐` 会把 食堂 / 蹭饭 / 厨艺 这些计数加一 ——
       于是同一条选项里，钱按"没去过几回"报了 22 块（久），
       说 却按"跑熟了"写成和园八块（熟）。**数字说颐园，散文说和园，
       两边都不报错，只是互相打脸。**
       蹭饭那条更隐蔽：象 / 回 / 说 明明都调 蹭饭账()，看着完全同源，
       可 象 在记隐前算、回 和 说 在之后算 —— c=4 那一下，
       象 报半熟（不赏不罚），说 报难看（撵你走）。
       同源的函数救不了不同源的时机。
     ⚠ 规矩：凡是能在同一条选项里读到计数的地方，一律在**计数被改之前**算完。
       算完再动手，顺序就不影响结果了。
     ⚠ 费 / 钱 本来连函数都不认，是 _v582s 塞了个 `钱: S => ...` 才炸出来的
       （`S.cost += 函数对象` = NaN，同样不报错）。一并收进来。
     小字 不在这儿 —— 它是在按钮上、点之前渲染的，本来就取点击前的状态，对。 */
  const 解 = v => 算(v, S);
  const 费 = 解(o.费) || 0;
  const 钱 = 解(o.钱) || 0;
  const 象 = 解(o.象);
  const 回 = 解(o.回) || 0;
  const 说 = 解(o.说);
  const 补 = 解(o.补) || {};

  if (费) { S.stamina = Math.max(0, S.stamina - 费); S.体力花 = (S.体力花 || 0) + 费; }
  if (钱) { S.cost += 钱; S.现金 = Math.max(0, S.现金 - 钱); }
  /* 岔路插的旗 —— 人事这一手当场不结账，账挂在旗上，
     到后面那个阶段（EVENTS 里 when: s => s.flags[...]）才显形。
     这是这个游戏的老规矩：A 做的事，C 才看见。 */
  if (o.旗) S.flags[o.旗] = true;
  /* ── 印象 ──
     跟 旗 分开：旗是"这事还没了结，账挂到后面某个阶段"，
     印象是"他怎么看你"，那一刻就定了，而且**跨季**带着走。
     ⚠ 存得跟 说法 一样急（当场就 存档），不等年终 ——
       不然玩到一半关掉，这一季攒的印象全没了，
       而印象恰恰是那种"要攒好几局才看得出来"的数。 */
  /* 象 / 隐 —— 一顿饭让老周怎么看你，吃得好和吃闭门羹不可能记同一组数。
     （记象 自己会 clamp + 存档，跟原来一样。）
     ⚠ 象 取的是上面 解() 出来的那份，也就是**这一顿之前的**关系。
       这一顿吃完才 记隐 改计数 —— 进门时的交情决定这顿吃得怎么样，
       吃完再把这顿记到账上。反过来就成了"因为吃了这顿，所以吃上了这顿"。 */
  if (象) 记象(S, 象);
  if (o.隐) 记隐(S, o.隐);
  /* ── 回：体力回复 ──
     原来只有 费（扣体力），没有往回加的口子 —— 夜里那两点恢复走的是 onNight。
     午饭不给这个口子，就只剩"扣多少"能表达，一顿好饭和一顿对付就没法分开。
     ⚠ 不走 费 的负数：费 是负的会被记进 S.体力花，那等于"懒惰的大学生"
       把吃好饭算成了干活。 */
  if (回) S.stamina += 回;
  /* 「你种不种」—— 遇到事情就往老周那儿跑的次数。
     标注在那些"去问老周"的选项上（见 _v582b），不猜、不按旗的字面推。 */
  if (o.问周) S.问周 = (S.问周 || 0) + 1;
  const 前 = { ...S.stats };
  const delta = applyEffect(S, 补);
  /* 说 也认函数。不认的话 esc() 会把函数源码原样印在屏幕上 ——
     那个错很难一眼看出来，因为别的选项都正常。
     ⚠ 说 用的是上面 解() 出来的那份 —— 跟 象 / 回 同一个时刻，
       所以"报什么数"和"讲什么话"一定对得上。 */
  e.诊.治 = { ...o, 说, delta, 前, 后: { ...S.stats } };
  flash = {};
  for (const k in delta) if (delta[k]) flash[k] = delta[k];
  /* 岔路（人事）不表态：三条路本来就没有对错，好/坏是**有倾向**的两个音，
     当场响等于替玩家判了一下，而账要到后面那个阶段才结。
     给一声 tap —— 手碰到了东西的动静，不说是好是坏。 */
  响(e.诊.岔 ? "tap" : (o.好 ? "好" : "坏"));
  render();
};

/* ── 夜里二选一 ──
   这是这一版新长出来的一道岔口：翻书和睡觉抢的是同一个晚上。

     文案跟数字错开了两版，v5.8 才对齐。）
   翻书还有个附加条件：精神得剩得住（体力 ≥ 灵感体力线），
   不然只剩字、出不来念头。条件明码写在按钮上，玩家不用猜。 */
window.onNight = function (选) {

     拿加完恢复之后的数去比，玩家就会算不明白"为什么这次又没出"。 */
  const 睡前 = S.stamina;
  S.stamina += 读 ? NUM.翻书恢复 : NUM.睡觉恢复;
  S.夜里 = 读 ? "读" : "睡";
  if (!读) {
    响("tap");
    toast(`睡了 · 体力 +${NUM.睡觉恢复}`);
    onContinue();
    return;
  }
  /* 白天那一手到底对不对，翻到书上才知道 */
  S.待查 = lastResult ? lastResult.查 : null;
  const 可灵 = !!(S.待查 && S.待查.灵) && !S.灵感[S.待查.灵] && 睡前 >= NUM.灵感体力线;
  S.新灵感 = 可灵 ? S.待查.灵 : null;
  if (可灵) S.灵感[可灵] = true;
  /* 说法：这一晚抄下来的那句。跟灵感不一样，它**不挑晚上** ——
     有 查资料 就有 法，翻书就落袋。这是翻书保底的那一份收益。
     存进档是立刻的（跟图鉴一个路子），不等年终 ——
     不然玩到一半关掉，刚抄的那几条就没了，跨季就白做。 */
  const 法 = S.待查 && S.待查.法;
  S.新说法 = 法 && !S.说法[法] ? 法 : null;
  if (S.新说法) {
    S.说法[S.新说法] = true;
    存档({ 说法: { ...S.说法 } });
  }
  /* 页边上的铅笔字 —— 抽过的不再抽，抽完为止。
     ⚠ 存的是**下标**，所以 0 是合法值，判空得用 !== null，
       写成 if (S.新批注) 的话第 0 条永远抽不出来（而且不报错）。 */
  const 剩 = 边批.map((_, i) => i).filter(i => !(S.批过 || {})[i]);
  S.新批注 = (剩.length && Math.random() < NUM.边批概率)
    ? 剩[Math.floor(Math.random() * 剩.length)] : null;
  if (S.新批注 !== null) {
    (S.批过 || (S.批过 = {}))[S.新批注] = true;
    存档({ 批过: { ...S.批过 } });
  }
  S.查过[S.节气[S.termIndex].term] = true;
  响(可灵 ? "好" : "tap");
  screen = "note"; render();
};

window.onContinue = function () {

    dueEvents(S, S.节气.length);   // 收尾那一趟：粮进场了才回过味来的账
    flash = {};
    S.log.forEach(e => { for (const k in e.delta) if (e.delta[k]) flash[k] = e.delta[k]; });
    S.grain = S.stats.harvest;

window.toChain = function () {

window.toChainGo = function () { 链名 = "后段"; screen = "chain"; render(); };

/* ── 走到底：选第 i 条路，底下还有层就照着 子 给的号往下走 ──
   ⚠ 这是给**回归测试**用的，不是给游戏用的。游戏里每一层都是玩家自己点的
     （见下面 onChain 的 续/回）。
   ⚠ 加它是因为：大雪那屏一加第二层，18 个测试文件里的
     `步.options[i].pick(S)` 同时炸了 —— 带 续 的选项**没有 pick**
     （onChain 里 续 抢在它前头 return 了）。
     修法不是在 18 个地方各写一遍 if，是让它们都问这一个函数。
   ⚠ 子 不给就走每一层的第 0 条，所以**第 0 条必须是"照旧的来"那一条**
     （见 盒层 / 酒层）。这么排既是为了测试方便，也是因为一个
     "多说两句"的层，头一条本来就该是"懒得想，按老规矩"。
   ⚠ 走不通就抛，不悄悄兜底。悄悄兜底的话，测试会绿着，
     而绿的是一条玩家根本走不到的路 —— 那比红更坏。 */
function 选到底(S, c, i, 子) {
  const 层 = 子 || [];
  let 当 = c.options[i];
  for (let k = 0; 当 && k < 8; k++) {
    if (当.设) 当.设(S);
    if (当.续) { 当 = 当.续[层[k] || 0]; continue; }
    if (typeof 当.pick !== "function")
      throw new Error("选到底：这条路上没有 pick —— " + (当 && 当.text));
    当.pick(S);
    return 当;
  }
  throw new Error("选到底：续 套得太深，绕不出来（第 " + i + " 条）");
}

window.onChain = function (i) {
  const c = 当前链()[S.chainIndex];
  /* 连点、越界、锁住的，直接吞掉。锁跟渲染走同一个判据 ——
     两处各写一遍迟一拍就会错开：屏幕上按钮是灰的、点下去却成了，
     比死锁更让人懵。 */
  if (!c) return;
  /* ⚠⚠ 反应屏上不许再吃一下选项（v5.9.8 补）。
     反应屏上 c.options 还挂着第二层那几条，所以下面那个越界判断拦不住 ——
     玩家手快连点两下，第二下会把同一条的 pick 再跑一遍：印象加两遍、
     旗子倒是不会变，可名望和好感会白白多一份。
     浏览器里按钮那时候已经被换掉了，正常点不着，但手快是点得着的
     （两次点击落在同一帧里，第一次的 render 还没换掉 DOM）。
     所以：反应挂着的时候，这一下当"知道了"收掉，不重跑任何东西。
     ⚠ 测试里更明显：_年后.mjs 那段是 while(screen==="chain") onChain(0)，
       没有这一句会原地空转到步数上限。 */
  if (c.反应) { 反应完(); return; }
  if (!c.options[i]) return;
  const o = c.options[i];
  const lk = o.锁;
  if (lk === true || (typeof lk === "function" && lk(S))) return;
  /* ── 续 / 回：后段的"多说两句" ──
     前半段的 处置 早就支持 续（点一下进下一层），后段一直只有一层。
     结果是收粮那一屏永远只有"卖一半 / 不卖"两个按钮 —— 用户原话：
     「选项太少且太死」。
     续：这一下不往下走，只把这一步的选项换成下一层。
     回：第二层做完退回第一层，**chainIndex 不推进**。
     两个配起来才做得出"先跟他磨两句，再看着新价决定卖不卖"——
     磨完那一步不算走完一步，它只是让你多知道一点。
     ⚠ 备 挂在步骤自己身上，不挂 S：它是这一屏的临时态，
       不是这一季的状态，存档不该带上它（后段本来也不存档）。 */
  /* ⚠ 备 原来只存 options。现在第二层要换标题、换 brief、换说话的人 ——
     "这米卖给谁"底下再问一层"盒子怎么做"，标题还杵在"这米卖给谁"
     就说不通了。所以 备 存**整屏**，回的时候整屏还原。
     ⚠ 设：这一下不结算，但先把一件事定下来。
        续 会抢在 pick 前头返回（下一行），所以"选了盒子怎么做、
        接着还要问酒厂怎么谈"这种两层的路子，第一层定下来的东西没处放。
        设 就是给它的：点一下先落下标记，结算留给最后那一层。 */
  /* ⚠ 备 必须是**栈**，不能是一个格子。
     买了设备那条路是两层的（盒子怎么做 → 跟酒厂怎么谈），
     单格的话第二层进来就把第一层那格盖掉了，等从第二层退回来，
     再点"算了，我再想想"就**退无可退** —— 它会一路掉到 pick(S)，
     然后 chainIndex++，等于没选走法就跳过了这一屏。 */
  if (o.设) o.设(S);
  /* ── 一句当场反应（v5.9.8 新加）──
     用户原话：「选完之后也没有后续和npc反应，没头没尾的」。
     原来 pick 只写旗和印象，屏幕上**什么都不发生** —— 点一下，直接翻页。
     现在写了 o.后 的，pick 完先停一屏，把对方那一下反应演出来，
     点「知道了」再往下走（第二层 / 下一件 / 退回上一层，一个都不少）。
     ⚠⚠ 顺序是 pick **先跑**、反应**后出**。所以 o.后 里读到的 S 是
       "已经选完"的 —— 想写"他看见你把本子推回去"这种，得读 pick 立的旗。
       反过来的话，那句话说的事情根本还没发生。
     ⚠ 反应屏不推进 chainIndex（它不是一步，只是给刚才那一下一个交代），
       所以下面 链进() 那一段得原样再来一次 —— 抽成函数，两处共用一份。
       抄第二遍的话，"第二层 / 退回 / 收尾"三条路里总有一条会漂。 */
  /* ⚠⚠ 续 必须**抢在 pick 前头**返回（上面那段注释里的老规矩）。
     这种选项故意不写 pick —— 它只是"往下再问一层"，这一下不结账。
     把 pick 挪到它前头就会当场 TypeError：_年后环.mjs 一跑就炸在这儿，
     因为后段"盒子怎么做 / 跟酒厂怎么谈"那条两层的路，第一层就是这么写的。 */
  if (o.续) {
    (c.备 = c.备 || []).push({ 项: c.options, 题: c.title, 简: c.brief, 话: c.say, 谁: c.who });
    c.options = o.续;
    if (o.续题 !== undefined) c.title = o.续题;
    if (o.续简 !== undefined) c.brief = o.续简;
    if (o.续话 !== undefined) c.say = o.续话;
    if (o.续谁 !== undefined) c.who = o.续谁;
    响("tap"); render(); return;
  }
  o.pick(S);
  /* 反应在 pick **之后**：o.后 里读到的 S 是"已经选完"的。 */
  if (o.后) {
    c.反应 = { 说: o.后, 谁: o.后谁 !== undefined ? o.后谁 : c.who, 进: o };
    响("tap"); render(); return;
  }
  链进(S, c, o);
};

/* pick 跑完之后该去哪儿。反应屏上那个「知道了」也要走这一段，
   所以它必须是独立的一份，不能留在 onChain 里头。
   ⚠ 这里**不管 续**（上一段已经返回掉了），只管"退回去"和"往前走"两条。 */
function 链进(S, c, o) {
  if (o.回 && c.备 && c.备.length) {
    const p = c.备.pop();
    c.options = p.项; c.title = p.题; c.brief = p.简; c.say = p.话; c.who = p.谁;
    响("tap"); render(); return;
  }
  S.chainIndex++;
  if (S.chainIndex >= 当前链().length) {
    /* 这里不再弹牌，年终这一屏本身就是发奖的地方，
       弹一遍再列一遍是打自己的脸。
       ⚠ 但**不弹牌 ≠ 不存档**。年终是七块金牌唯一的判定口
         （它们的 when 要 r，季中那三次 扫成就 传的 r 是 null），
         所以这一行走的是 结成就 而不是 扫成就 —— 存档在 结成就 里面，
         见那个函数头上的注释。 */
    if (链名 === "年话") {
      /* ── 年后这一趟走完了，先垫一屏收束，再回账本 ──
         ⚠ 不能再调一次 年终()：它里头有 Math.random（认养份数那些），
           重跑一遍数就变了，玩家会眼睁睁看着账本自己改了数。
           result 还是刚才那一份，一字不动。
         记账和补牌子在 收年话 里（见那个函数头上的注释）。
         ⚠ v5.9.8：原来这儿是直接 screen = "yearend" 摔回账本。可账本上
           那一块「转过年来」长得跟进来之前**一模一样**，按钮还在，
           于是玩家以为没走成、再点一次 —— 一季能连点三趟，每趟回到同一张屏。
           用户原话：「一直在那里循环，让人摸不着头脑」。
           现在中间垫一屏把话说完，账本上那个按钮也不再出现（见 后话）。
           _年后环.mjs 数这件事：改之前一季能按 3 次，改之后 0 次。 */
      收年话(S);
      链名 = "后段";
      newAch = S.本季成就; screen = "年话完";
    } else {
      result = 年终(S); 结成就(S, result); newAch = S.本季成就; screen = "yearend";
    }
  }
  响(S.chainIndex >= 当前链().length ? "钱" : "tap");
  render();
}

/* 反应屏上那个「知道了」：把刚才压下的 o 取回来，接着走 链进 那一段。 */
window.反应完 = function () {
  const c = 当前链()[S.chainIndex];
  if (!c || !c.反应) return;          // 连点第二下：反应已经收了，吞掉
  const o = c.反应.进;
  delete c.反应;
  链进(S, c, o);
};

/* ── 进「转过年来」那一趟 ──
   ⚠ 链子在这儿才建、才挂到 S 上。放渲染里建的话，又是"渲染顺手改状态"，
     跟原来那个 后话() 是同一个病（见 后话 上头那段）。 */
window.to年话 = function () {
  S.年话 = 建年话(S);
  if (!S.年话.length) return;              // 手慢了一步，已经没得走了
  S.chainIndex = 0;
  链名 = "年话";
  screen = "chain";
  响("tap"); render();
};

window.setTab = function (t) { tab = t; render(); };
/* 书从哪儿翻开的，就回哪儿去。原来是写死的"回田里" ——
   从封面点进来的，回田里就成了"田还没下呢先给你看田"，说不通。 */
window.backToGame = function () {
  screen = 书来源 === "封面" ? "cover"
    : S.termIndex >= S.节气.length ? "yearend" : "decision";
  书来源 = "田";
  render();
};
let 书来源 = "田";
window.openBook = function (从) {
  书来源 = 从 || "田";
  /* 从封面进来先看成就 —— 那是"攒下来的"，是这一屏要回答的问题。
     图鉴得先认得东西才有得看，顺序反过来。 */
  if (从 === "封面") tab = "成就";
  screen = "book"; render();
};
window.restart = function () {
  /* 季数在这儿加，不在 reset 里 —— 一局当中刷新页面不该涨季数。
     它落在档里，因为它是"这个玩家"的属性，不是这一局的属性。 */
  存档({ 季: (档().季 || 1) + 1 });
  reset(); 成就队 = []; 弹牌(); render();
};


/* 处理结果留在本节气田地图下，动画只覆盖田图、不挡住操作。 */
function showFieldEventResult() {
  if (!["decision", "result", "event", "note"].includes(screen)) return;
  const event = (S.fieldEvents || []).filter(e => e.term === S.termIndex).slice(-1)[0];
  if (!event) return;
  const field = app.querySelector(".bigfield, .field");
  if (!field) return;
  field.insertAdjacentHTML("afterend", `<div class="field-event-result" role="status"><b>${event.won ? "✓ 处理完成" : "本次处理结果"}</b><p>${esc(event.line)}</p></div>`);
  const svg = field.querySelector("svg.tian");
  if (!svg) return;
  const positions = [[65,85],[125,100],[195,80],[255,105]];
  const marks = positions.map(([x,y],i) => {
    const style = `style="animation-delay:${i*.15}s"`;
    if (event.kind === "drought") return `<g class="event-water" ${style}><path d="M${x} ${y-30}q-12 15 0 18q12-3 0-18" fill="#5eaec4"/><ellipse cx="${x}" cy="${y}" rx="18" ry="5" fill="none" stroke="#c4eef5" stroke-width="2"/></g>`;
    if (event.kind === "weeds") return `<g class="event-weed" ${style}><path d="M${x} ${y}v-25m0 12q-18 0-15-15q15 0 15 15m0 4q17-1 15-16q-14 0-15 16" fill="#658d36" stroke="#42662c" stroke-width="2"/><path d="M${x-4} ${y+5}l4-5 4 5" fill="none" stroke="#957245"/></g>`;
    return `<g class="event-pest" ${style}><ellipse cx="${x}" cy="${y}" rx="7" ry="10" fill="#80613d"/><path d="M${x-10} ${y-4}h20m-20 8h20" stroke="#59472d" stroke-width="2"/><path d="M${x+9} ${y-12}l4 4 8-10" fill="none" stroke="#fdf5d8" stroke-width="3"/></g>`;
  }).join("");
  svg.insertAdjacentHTML("beforeend", `<g class="field-event-animation" aria-hidden="true">${event.caught ? marks : ""}<rect x="65" y="12" width="190" height="23" rx="11" fill="#fffcf1" opacity=".94"/><text x="160" y="28" text-anchor="middle" font-size="11" fill="#41603a">${practiceEvents[event.kind].action} · ${event.won ? "处理完成" : "已处理，仍有遗漏"}</text></g>`);
}

/* 首页练习独立于正式季节进度，不写入收成、成就或存档。 */
const practiceEvents = {
  pest: { name: "虫害来袭 · 移动靶", action: "除虫", target: "虫子", verb: "清除", title: "点掉叶片上的虫子", win: "虫子清光了！", hint: "追着移动的虫子点，每只点三下才能清除，数字表示剩余次数。", icon: "🐛", hits: 3, seconds: 20, insect: true, moving: true },
  pestFixed: { name: "虫害来袭 · 固定靶", action: "除虫", target: "虫子", verb: "清除", title: "清除停在叶片上的虫子", win: "虫子清光了！", hint: "虫子停在原地，每只点三下才能清除，数字表示剩余次数。", icon: "🐛", hits: 3, seconds: 20, insect: true, moving: false },
  drought: { name: "旱情告急", action: "浇水", target: "干土", verb: "浇透", title: "给干裂的田地浇水", win: "田地喝饱水了！", hint: "每块干土点击两次：第一次润湿，第二次浇透。", icon: "💧", hits: 2, seconds: 10 },
  weeds: { name: "杂草冒头", action: "拔草", target: "杂草", verb: "拔除", title: "拔掉稻苗间的杂草", win: "杂草拔干净了！", hint: "点击带标记的杂草，把养分留给稻苗。", icon: "🌿", hits: 1, seconds: 10 }
};
function openPractice() { screen = "practice"; render(); }
function leavePractice() { screen = "cover"; render(); }
function viewPractice() {
  return `<div class="pest-kicker">田间练习场</div><h1 class="term">突发事件练习</h1>
    <p class="brief">先练练手，再从容下田。选择一种事件，准备好后开始挑战。虫害 20 秒，浇水和拔草各 10 秒。</p>
    <p class="pest-copy">随时重玩，不消耗体力，也不影响收成和存档。</p>
    ${Object.entries(practiceEvents).map(([key,c]) => `<button class="practice-card" onclick="openPests(true,'${key}')">
      <span class="practice-icon" aria-hidden="true">${c.icon}</span><span><b>${c.name}</b><small>${c.hint}</small><em>${c.seconds} 秒 · 开始${c.action} →</em></span></button>`).join("")}
    <button class="go sm ghost" onclick="leavePractice()">回 到 首 页</button>`;
}

/* 突发事件只在前台种植决策时触发，每个节气至多一次；练习不改账。 */
const pestDialog = document.getElementById("pest-dialog");
let pestEvent = null, pestLastTick = performance.now();
const pestTerms = new Set();
document.addEventListener("visibilitychange", () => { pestLastTick = performance.now(); });
pestDialog.addEventListener("cancel", event => {
  event.preventDefault();
  if (pestEvent?.phase === "done") closePests();
  else finishPests(true);
});
function openPests(practice = false, kind = "pest") {
  if (pestEvent || (practice ? screen !== "practice" : screen !== "decision" || S.选了 !== null)) return;
  const config = practiceEvents[kind];
  if (!config || (!practice && S.fieldEventSeen?.[kind])) return;
  const count = kind === "pestFixed" ? 5 : config.insect ? 3 : 3 + Math.floor(Math.random() * 3);
  pestEvent = { practice, kind, config, hits: {}, count, caught: new Set(), remaining: config.seconds * 1000, duration: config.seconds * 1000, phase: "ready", season: S };
  if (!practice) {
    pestTerms.add(S.termIndex);
    if (!S.fieldEventSeen) S.fieldEventSeen = {};
    S.fieldEventSeen[kind] = true;
  }
  pestDialog.innerHTML = `<div class="pest-kicker">${practice ? "田间练习 · 不影响收成" : "突发事件 · " + config.name}</div>
    <h2 id="pest-title">${config.name}</h2>
    <p class="pest-copy">这次有 ${count} 处${config.target}需要处理。${config.hint} 准备好后开始 ${config.seconds} 秒计时，也可用 Tab 和回车操作。</p>
    <p class="pest-copy">${practice ? "放心练手，不奖励也不扣产量。" : "全部处理完成奖励 8 斤产量；每遗漏一处减产 2 斤。"} 切到后台会暂停。</p>
    <button class="go" onclick="beginPests()">准备好了 · 开始${config.action}</button>
    <button class="pest-practice" onclick="finishPests(true)">${practice ? "退出练习" : "这次交给自然"}</button>`;
  pestDialog.showModal();
  响("tap");
}
function beginPests() {
  const e = pestEvent;
  if (!e || e.phase !== "ready") return;
  e.phase = "playing";
  const config = e.config;
  const positions = [[18,30],[50,28],[82,35],[32,72],[70,73]];
  // 打乱固定分区，保留手机上互不重叠的点击范围。
  for (let i = positions.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [positions[i], positions[j]] = [positions[j], positions[i]];
  }
  e.positions = positions.slice(0,e.count);
  pestDialog.innerHTML = `<div class="pest-kicker">${e.practice ? config.name + " · 练习" : "突发事件 · " + config.name}</div>
    <h2 id="pest-title">${config.title}</h2>
    <div class="pest-meta"><span id="pest-progress" role="status">已${config.verb} 0 / ${e.count}</span><b id="pest-time">${config.seconds}.0 秒</b></div>
    <div class="pest-meter"><span id="pest-bar"></span></div>
    <div class="pest-field">${田的画(S)}${positions.slice(0,e.count).map(([x,y],i) =>
      `<button class="pest-bug ${e.kind}" data-pest-id="${i}" data-left="${config.hits}" style="left:${x}%;top:${y}%;animation-delay:-${i*.2}s" aria-label="${config.action}：第 ${i+1} 处${config.target}" onclick="catchPest(${i},this)">
        ${config.insect ? `<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M13 17 5 12M13 25 4 26M15 33 7 39M35 17 43 12M35 25 44 26M33 33 41 39" stroke="#614a2b" stroke-width="3" stroke-linecap="round"/><ellipse cx="24" cy="27" rx="12" ry="15" fill="#8f663a"/><path d="M24 14v28M15 25h18M16 33h16" stroke="#503b24" stroke-width="2"/><circle cx="24" cy="12" r="8" fill="#526438"/><circle cx="21" cy="10" r="2" fill="#fff"/><circle cx="27" cy="10" r="2" fill="#fff"/></svg>` : `<span aria-hidden="true">${config === practiceEvents.drought ? "🏜️" : "🌿"}</span>`}
      </button>`).join("")}</div>
    <p class="pest-copy">${config.hint} 离开页面自动暂停</p>
    <button class="pest-practice" onclick="finishPests(true)">${e.practice ? "结束练习" : "结束处理，按剩余数量结算"}</button>`;
  pestLastTick = performance.now();
  pestDialog.querySelector(".pest-bug").focus();
}
function catchPest(id, button) {
  const e = pestEvent;
  if (!e || e.phase !== "playing" || e.caught.has(id)) return;
  e.hits[id] = (e.hits[id] || 0) + 1;
  if (e.hits[id] < e.config.hits) {
    const left = e.config.hits - e.hits[id];
    button.setAttribute("data-left", left);
    button.setAttribute("aria-label", `${e.config.action}：第 ${id+1} 处${e.config.target}，还需 ${left} 次`);
    if (e.kind === "drought") {
      button.innerHTML = '<span aria-hidden="true">💧</span>';
      button.style.background = "#cce3dd";
    } else button.style.background = left === 2 ? "#ffe5b0" : "#ffd0a6";
    响("tap"); return;
  }
  e.caught.add(id); button.disabled = true; button.classList.add("caught");
  响("tap");
  document.getElementById("pest-progress").textContent = `已${e.config.verb} ${e.caught.size} / ${e.count}`;
  if (e.caught.size === e.count) finishPests();
  else pestDialog.querySelector(".pest-bug:not(:disabled)").focus({ preventScroll: true });
}
function finishPests(skipped = false) {
  const e = pestEvent;
  if (!e || e.phase === "done") return;
  e.phase = "done";
  const missed = e.count - e.caught.size, won = missed === 0;
  let message = "练习结束，不影响本季收成。";
  if (!e.practice && e.season === S) {
    const delta = applyEffect(S, { harvest: won ? 8 : -missed * 2 });
    message = `本季产量 ${delta.harvest >= 0 ? "+" : ""}${delta.harvest} 斤。`;
    const line = `${e.config.name}：已${e.config.verb} ${e.caught.size}/${e.count} 处${e.config.target}。${message}`;
    S.log.push({ term: S.节气[S.termIndex].term, line, delta });
    if (!S.fieldEvents) S.fieldEvents = [];
    S.fieldEvents.push({ term: S.termIndex, kind: e.kind, line, won, caught: e.caught.size });
  }
  pestDialog.innerHTML = `<div class="pest-kicker">${e.practice ? "练习完成" : e.config.name + " · 处理结果"}</div>
    <h2 id="pest-title">${won ? e.config.win : skipped ? "这次先到这里" : "时间到了"}</h2>
    <p class="pest-copy">已${e.config.verb} ${e.caught.size} / ${e.count} 处${e.config.target}。${won ? "稻苗又能安心生长了。" : `还有 ${missed} 处没处理好，下次再加把劲。`}</p>
    <p>${message}</p><button class="go" onclick="closePests()">${e.practice ? "返回练习场" : "回到田里"}</button>`;
  响(won ? "好" : "tap");
  pestDialog.querySelector(".go").focus();
}
function closePests(refresh = true) {
  pestDialog.close(); pestEvent = null;
  if (refresh) render();
}
// 进入决策页立即触发；每季每种只出现一次，退出或未完成也算已出现。
function triggerFieldEvent() {
  if (document.hidden || pestEvent || screen !== "decision" || S.选了 !== null
      || S.termIndex < 1 || S.termIndex >= S.节气.length - 1 || pestTerms.has(S.termIndex)) return;
  const kinds = ["drought", "weeds", "pest", "pestFixed"];
  openPests(false, kinds[(S.termIndex - 1) % kinds.length]);
}
setInterval(() => {
  const now = performance.now(), elapsed = Math.min(now - pestLastTick, 250);
  pestLastTick = now;
  if (document.hidden) return;
  if (pestEvent?.phase === "playing") {
    pestEvent.remaining = Math.max(0, pestEvent.remaining - elapsed);
    document.getElementById("pest-time").textContent = `${(pestEvent.remaining/1000).toFixed(1)} 秒`;
    document.getElementById("pest-bar").style.width = `${pestEvent.remaining/pestEvent.duration*100}%`;
    if (pestEvent.config.moving) {
      const t = (pestEvent.duration - pestEvent.remaining) / 1000;
      pestEvent.positions.forEach(([x,y],i) => {
        if (pestEvent.caught.has(i)) return;
        const button = pestDialog.querySelector(`[data-pest-id="${i}"]`);
        button.style.left = `${x + Math.sin(t * 1.7 + i) * 5}%`;
        button.style.top = `${y + Math.sin(t * 1.3 + i * 2) * 7}%`;
      });
    }
    if (!pestEvent.remaining) finishPests();
  } else triggerFieldEvent();
}, 100);

render();
</script>
</body>
</html>
