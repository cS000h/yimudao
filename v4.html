/* ── 成就 ──
   两件事跟以前不一样：
   ① 中途就发牌，不是憋到年终一起倒给你。种到一半蹦出一块金牌，
      这一局才有"再往下走一步看看"的劲儿。
   ② 发牌本身是个动作 —— 有牌子、有响、有档位。拿金牌那一下，
      跟拿铜牌不是同一种感觉。
   收尾时 r 传进来，那些要看账本的成就才判得出来。 */
function 结成就(S, r) {
  const got = [];
  ACH.forEach(a => { if (!S.ach[a.id] && a.when(S, r)) { S.ach[a.id] = true; S.本季成就.push(a); got.push(a); } });
  /* ⚠ 存档就在这里，不在调用者那边。
     v5.8.1 之前的写法是反的：扫成就 存、年终那趟不存。
     偏偏七块金牌的 when 全是 (S,r) => r && ...，r 是年终账本，
     季中那三次 扫成就 传的 r 是 null，金牌一次都进不去；年终传真账本，
     金牌只在这一刻发得出来，可那一刻走的正是**不存档**的那条路。
     结果：金牌年年照发、年年不落档，下一季 newSeason 从档里读 ach，
     到手的牌子又锁回去了（用户：「上一局打出来的金色成就，在第二局就被吞了」）。
     同一条漏网的还有 等外 / 赔本 / 贡米 / 扛住 / 老周 五块银铜牌。
     放这儿是因为这是全篇唯一改 S.ach 的地方：以后再加调用口也漏不了，
     不用靠"记得存一下"。 */
  if (got.length) 存档({ ach: { ...S.ach } });
  return got;
}

/* 发牌队列 —— 一次结算可能同时中好几块，排队一块一块弹 */
let 成就队 = [], 牌计时 = null;
function 发牌(ach) { ach.forEach(a => 成就队.push(a)); 弹牌(); }
function 弹牌() {
  const el = document.getElementById("pop");
  if (!el) return;
  const a = 成就队[0];
  clearTimeout(牌计时);
  if (!a) { el.className = "pop"; el.innerHTML = ""; return; }
  el.className = "pop on " + (a.级 || "铜");
  el.innerHTML = `<span class="lv">${a.级 || "铜"}</span>
    <div><b>${esc(a.名)}</b><p>${esc(a.说)}</p></div>`;
  响(a.级 === "金" ? "金" : a.级 === "银" ? "好" : "tap");
  牌计时 = setTimeout(收牌, a.级 === "金" ? 4000 : 3000);
}
function 收牌() { 成就队.shift(); 弹牌(); }
window.onPop = function () { if (成就队.length) 收牌(); else { 成就队 = []; 弹牌(); } };

/* 中途也会发牌：每次选完、每次回响落地，都重新扫一遍 */
function 扫成就(r) {
  /* 档在 结成就 里已经存过了，这里只管弹牌 */
  const got = 结成就(S, r);
  if (got.length) 发牌(got);
  return got;
}

/* ── 声音（WebAudio 现场合成，不引任何文件） ──
   一个单文件原型不该为几声动静多背几百 KB。 */
let 声 = null, 开声 = true;
function 音(频, 起, 长, 型, 量) {
  const o = 声.createOscillator(), g = 声.createGain();
  const t = 声.currentTime + 起;
  o.type = 型; o.frequency.value = 频;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(量, t + .012);
  g.gain.exponentialRampToValueAtTime(.0001, t + 长);
  o.connect(g); g.connect(声.destination);
  o.start(t); o.stop(t + 长 + .03);
}
function 响(k) {
  if (!开声) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!声) 声 = new AC();
    if (声.state === "suspended") 声.resume();
    (音效[k] || 音效.tap)();
  } catch (e) { /* 静音就静音，不能把游戏搞崩 */ }
}
const 音效 = {
  tap:  () => 音(620, 0, .07, "triangle", .08),
  好:   () => { 音(587, 0, .13, "sine", .11); 音(880, .085, .20, "sine", .10); },
  坏:   () => { 音(392, 0, .15, "sine", .11); 音(262, .10, .26, "sine", .11); },
  钱:   () => { 音(1046, 0, .09, "square", .06); 音(1318, .07, .18, "square", .05); },
  翻:   () => 音(440, 0, .06, "triangle", .05),
  抽:   () => { for (let i = 0; i < 7; i++) 音(240 + i * 46, i * .035, .18, "triangle", .045); },
  /* 上上 / 下下 独有的三个音 —— 稀有的东西该有稀有的动静 */
  金:   () => [523, 659, 784, 1047].forEach((f, i) => 音(f, i * .085, .55, "triangle", .10)),
  凶:   () => [330, 262, 196, 165].forEach((f, i) => 音(f, i * .10, .55, "sawtooth", .06)),
};

/* ── 人情那一条 ──
   ⚠ 这一条是 v5.9 补的。名望和印象 v5.8.2 就做出来了 —— 算名望() 每季都算，
     年终() 也把 望 一起返回了 —— 可从头到尾没往屏幕上画过一次。
     玩家的体感于是成了"有些选项莫名其妙就变了"。
     攒下来的东西不给人看见，等于没攒。
   ⚠ 名望是**跨季**的，一季里不动；印象也是跨季的。
     所以这两样显示的是"到现在为止"，不是"这一季" —— 本季的增量在结算屏那张卡上。
     两个不同的东西摆在一起会串味，所以这里只印总数。 */
function 人情条() {
  if (screen === "cover" || screen === "practice") return "";
  if (S.名望 === undefined && !S.印象) return "";
  const 望 = Math.round(S.名望 || 0);
  /* ⚠ 九个人一起摆着，不按"见过没见过"过滤。
     过滤看着更干净，可玩家就永远不知道有这几个人 ——
     而这一条恰恰是唯一说"这一带还有谁"的地方。
     字号小、能换行，摆得下。
     ⚠ 同学B（乙）v5.9.6 加在最后。他跟同学A 是一对：
       A 跟你比着种，B 管的是种出来怎么出去。 */
  const 人 = [["周", "老周"], ["陈", "老陈"], ["同", "同学A"], ["赵", "老赵"], ["师", "老师"],
              ["主", "田主"], ["村", "村长"], ["农", "农资店"], ["乙", "同学B"]].map(([k, 名]) => {
    const v = (S.印象 || {})[k] || 0;
    /* 只在"明显有交情"和"明显结了梁子"两头标色。中间那一段不标 ——
       全都标色就等于全都没标。 */
    /* ⚠ 阈值跟着上限走（12→24）。原来标的是 4 / -2，放在 24 的刻度上
       就成了一条"刚认识就标绿"的线 —— 全都标色等于全都没标。 */
    const c = v >= 8 ? "a" : v <= -3 ? "d" : "";
    return `<button class="pn ${c}${说数 === k ? " on" : ""}"
      onclick="onWhy('${k}')">${名} ${v > 0 ? "+" : ""}${v}</button>`;
  }).join("");
  const 开 = 说数
    ? (说数 === "望" ? ["名 望", String(望), 名望说(望)]
       : [人里找(说数).名, 有正负((S.印象 || {})[说数] || 0), 印象说(说数, (S.印象 || {})[说数] || 0)])
    : null;
  /* 点名望摊开的是**两段**，不是一段：上头说这一带怎么看你（名望说），
     下头说这会儿办得成什么事（名望门）。一个管味道，一个管用 ——
     用户要的"名望有用"是后半段，可只给后半段，这一条就成了任务栏。 */
  const 门 = 说数 === "望" ? 名望门(望) : "";
  /* ⚠ 名望和八个人**分两行摆**。
     原来全塞在同一个 .yrow 里（那是 flex-wrap），窄屏上折成两行，
     还夹着"点数字有话说"那个提示 —— 一行里十几样东西，用户原话：
     「名望的那个排版好挤啊，堆了一堆小字」。
     名望是玩家最常盯的那个数，它该有自己的一行。
     ⚠ 摊开的那段话**跟在它自己那一行底下**，不双双堆在最下面 ——
       堆在一起的话，点"老周"弹出来的话会跑到八个人的下头去，
       离你点的那个 chip 隔着一整排，得自己找。 */
  const 看人 = 说数 && 说数 !== "望";
  return `<div class="yrow">
    <span class="k">名 望</span>
    <button class="pn w${说数 === "望" ? " on" : ""}" onclick="onWhy('望')"><b>${望}</b>名望</button>
    <span class="tip">${说数 === "望" ? "再 点 一 下 收 起 来" : "点 数 字 有 话 说"}</span></div>
    ${说数 === "望" ? `<div class="whysay"><b>${开[0]} ${开[1]}</b>${esc(开[2])}</div>` : ""}
    ${说数 === "望" && 门 ? `<div class="whysay"><b>名 望 能 办 的 事</b>${门}</div>` : ""}
    <div class="yrow">
    <span class="k">人 情</span>
    ${人}<span class="tip">${看人 ? "再 点 一 下 收 起 来" : ""}</span></div>
    ${看人 ? `<div class="whysay"><b>${开[0]} ${开[1]}</b>${esc(开[2])}</div>` : ""}`;
}

/* ── 名望这会儿开着哪几扇门 ──
   用户原话：「名望这个属性的用处太小了，这和真实的人情世故不符合」。
   到底有没有用，玩家得**看得见**才算数。灰着的那一条（见 望锁）只在
   碰见那件事的时候才出现，而一件事一年未必轮到一回 —— 光靠那个，
   名望在屏幕上是隐形的。这一行把它摊开，点一下名望就看得见：
   现在开着的门是哪几扇，下一扇还差多少。
   ⚠ 线从 望线 那张表里读，一个字都不另抄（理由见 望线 上头那段）。
   ⚠ 关着的**只印最近那一扇**。全印出来就是一张任务清单，
     玩家会照着单子刷名望 —— 那就不是在村里过日子了。 */
function 名望门(n) {
  const 列 = Object.keys(望线).map(k => 望线[k]).sort((a, b) => a.线 - b.线);
  const 开 = 列.filter(x => n >= x.线), 关 = 列.filter(x => n < x.线);
  if (!开.length && !关.length) return "";
  /* ⚠ 一行一个 <p>。原来这几行是**一句拼出来的**（行.join("")），
     标签又是个定宽的 inline-block —— 换行靠的是文字自己折行，
     于是标签和话绕在一起，两句话糊成一条。用户原话：
     「该换行的地方用的是空格，排版乱乱的不好看」。
     换行得是块级换的：标签占一列，话占一列，各归各。 */
  /* ⚠ 两行是**二选一**的，不是各写各的。
     原来"已经开着"和"都开完了"是两条独立的分支，于是名望一高两行一起出：
       「已经开着 报表上敢落自己的名字。这样的门一共 8 扇。
         都开完了 这一片能替你办的事，你都办得成了。」
     八扇全开着的时候，"已经开着哪扇"就不成信息了 —— 那两行只会互相打架。 */
  const 行 = [];
  if (关.length) {
    /* ⚠ 这一句必须再问一遍 开.length。开头的 `!开.length && !关.length` 只挡住
       "两边都空"，而 名望 40 以下 是**一扇没开、后头全关** ——
       少了这一问就是 开[开.length-1] 取到 undefined 再读 .门，
       开局那一眼直接白屏。_望门 逮住的。 */
    if (开.length)
      行.push(`<p class="ml"><em>已经开着</em><span>${esc(开[开.length - 1].门)}。`
        + `这样的门一共 ${开.length} 扇。</span></p>`);
    行.push(`<p class="ml"><em>下一扇还差 ${关[0].线 - Math.round(n)} 点</em>`
      + `<span>${esc(关[0].门)}。</span></p>`);
  } else
    行.push(`<p class="ml"><em>都开完了</em><span>${列.length} 扇门全开着。`
      + `这一片能替你办的事，你都办得成了。</span></p>`);
  return 行.join("");
}

const 人里找 = k => ({ 周: { 名: "老 周" }, 陈: { 名: "老 陈" }, 同: { 名: "同 学 A" },
  赵: { 名: "米厂的老赵" }, 师: { 名: "老 师" },
  主: { 名: "田 主" }, 村: { 名: "村 长" }, 农: { 名: "农 资 店" },
  乙: { 名: "同 学 B" } }[k] || { 名: k });
const 有正负 = v => (v > 0 ? "+" + v : String(v));

/* ── 名望分档 ── 六档。
   用户原话：「给名望和印象这几个数值添加点击后能显示小字解释，
   比如"你和他不熟，见面也没什么话说"等等。至少六个阶段配有六种说明」。
   ⚠ 分档的线是量出来的，不是拍脑袋：一季约 +12（_望.mjs 实测），
     种到第 6 季 70 上下、第 14 季 180 上下 —— 所以线定在 20/60/130/260/450，
     每一档都要有几季活得出来，不然玩家永远看不到后三档。
   ⚠ 说"这一带怎么看你"，不说"你的分数是多少"。数是给玩家算的，
     这句话是替村里人说的。 */
function 名望说(n) {
  if (n < 20)  return "你是外来的学生，租了一亩地。村里知道有这么个人，叫不出名字。";
  if (n < 60)  return "路上碰见会点个头。谁家办席不叫你，但也没人躲着你。";
  if (n < 130) return "他们知道你是农大来的那个学生了。买农资能赊两天账。";
  if (n < 260) return "这一片拿你当自己人。有人专门绕过来看你这块稻子是怎么种的。";
  if (n < 450) return "镇上管农业的也知道你。写材料、拍片子、开会，都要喊你一声。";
  return "你不用再解释了。你说这块地该怎么种，旁边的人照做。";
}

/* ── 印象分档 ── 六档，按人分开说。
   ⚠ 为什么每个字都要不一样：这九个人在你这儿的处境本来就不同 ——
     老周是带你的人，老陈是收你粮的，同学A 是跟你比着种的，
     同学B 是管卖的那一个，老赵是碾你米的，老师是管你毕业的，
     田主是有地的那个人，村长是盖章的那个人，
     农资店是你每季都要进门的那个人。
     共用一个模板的话，点开谁看到的都是同一句话，那这个功能就白做了。
   ⚠ 印象封在 ±24（印象上下），六档在 24 个刻度里切：
     -24~-15 / -14~-7 / -6~1 / 2~8 / 9~17 / 18~24。
   ⚠ 中间那两档（2~8、9~17）是**照着门的位置**切的，不是均分：
     开门的线在 2 / 4 / 6 / 8，落在"他肯跟你说实话"那一档里 ——
     玩家看到的字和实际开得开的口子得对得上，对不上这个分档就是装饰。 */
function 印象说(k, v) {
  const 表 = {
    周: ["他看见你就当没看见，田埂上碰见也绕着走。",
         "他还是给你指点，但话只说到一半。你问第二句他就不接了。",
         "你和他不熟。见面也就是点个头，没什么话说。",
         "他肯跟你说实话了。你问什么，他答什么。",
         "他路过你这块田会停下来看两眼。有事你不用叫他，他自己就来了。",
         "他把你当自己人。那本记了四十年的本子，他愿意给你翻。"],
    陈: ["你的事他不接。电话打过去，他说忙。",
         "他收你的谷子挑得比谁都细，价却按最低的算。",
         "见面就是生意。过磅、结账，多一句都没有。",
         "他愿意跟你把价先谈好再动手，不跟你绕。",
         "你的谷子他先给你留着，什么时候出米什么时候算。",
         "他信你这人不糊弄数。别人嫌你事多，他专找你这样的。"],
    同: ["他在楼道里看见你，拐进另一条走廊。",
         "他跟你说话客气，客气得像不认识。",
         "你们是一起下田的同学。除了课上的事，没什么来往。",
         "他会把他田里的数拿给你看，也问你两句。",
         "他遇上拿不准的事会来找你，不管他老师怎么说。",
         "他把你说的记在本子上，一条一条照着改。"],
    /* 老赵是生意上的关系 —— 六档说到底就是"他把你当不当自己人"。
       ⚠ 生意人和种田人不一样：老周那六档说的是交情，老赵这六档
         说的是**他肯不肯把行里的实话告诉你**。这是他身上唯一值钱的东西。 */
    赵: ["他见了你就说机器忙。你那点谷子，他让你拉回去。",
         "碾你的米他不上心，出米率报得比谁家都低。",
         "你们只是买卖。他把机器开着，你等着，碾完拉走，没别的话。",
         "他愿意跟你多说两句，告诉你哪一批米该早点碾。",
         "他给你留着机器，你什么时候来什么时候碾。",
         "他会跟你说行里的实话：今年什么光景、哪家在压价。这话他不跟外人讲。"],
    /* 老师这一列是**这件事的另一头** —— 田里的事和学校的事，
       在别人眼里是两回事，在你这儿是一件事。 */
    师: ["他把你叫到办公室，问你到底还想不想念了。",
         "他在组会上不点你的名，可你知道他在说谁。",
         "你是他带的学生。你下田，他知道，也就是知道。",
         "他会问你田里的数，问得挺细。",
         "他把你的数据要过去看，说这个能写。",
         "他跟别人提起你，说这是他带的学生。"],
    /* 田主 —— 这块地是他的，你租的。
       ⚠ 这是一个**所有玩家都绕不开、却一直没露过脸**的人：
         你从第一季就在种他的地，交了四季租，可他一句台词都没有。
         他关心的东西跟别人都不一样：别人关心稻子，他只关心地。
       ⚠ 六档说的其实是一件事：他放不放心把地交给你。 */
    主: ["他说这块地明年不打算租了。",
         "他隔三差五来田里转一圈，转完什么也不说就走。",
         "你们只在交租的时候见。他把钱点了，你走人。",
         "他会问一句今年怎么样，问完就骑车走了。",
         "他愿意让你在田边搭个棚，没多要钱。",
         "他跟别人说，这块地租给你，他不操心。"],
    /* 村长 —— 管水、管补贴、管检查组。
       ⚠ 他不是"官"，他是**所有表格和所有检查组进村的那道口子**。
         跟他的交情不影响稻子长什么样，影响的是你办不办得成事。 */
    村: ["他说你这个事，村里不好办。",
         "你去盖章，他让你过两天再来。",
         "你会在这条埂上碰见他，点个头，各走各的。",
         "你去找他，他肯把政策跟你讲一遍。",
         "村里有什么名额，他先想到你这一块田。",
         "他跟上面来的人说，这块地是我们村的样板。"],
    /* 农资店 —— 你每一季都要进门的那个人。
       ⚠ 这一列写的是"他给不给你一句实话"。农资店最值钱的东西不是货，
         是那句"这个牌子你别买"。 */
    农: ["他见你进门就说没有。",
         "他给你的价，比给别人的高。",
         "一手交钱一手交货。他不问你种什么。",
         "他会跟你说哪个牌子别买。",
         "赊账本上给你留了一页。",
         "进了新货他先给你留一份，说这个你用得上。"],
    /* 同学B —— 他不下田，他管的是这一亩种出来的东西怎么出去。
       ⚠ 六档说的是**他拿不拿你当回事**。他跟同学A 不重样：
         A 那六档是"他服不服你种的"，B 这六档是"他愿不愿意把他那套东西
         往你身上使" —— 他手里那点本事（怎么卖、怎么讲），给不给你用，
         就是他跟你的交情本身。 */
    乙: ["他在群里说话，你一进去，话题就换了一个。",
         "他找你只为一件事：让你把田里的照片给他发两张。",
         "你们是同学。他做他的，你种你的，各忙各的。",
         "他肯把他那套怎么卖的想法讲给你听了。",
         "他上新品之前会先问你一句：这个你会不会买。",
         "他把你这一亩写进了他的方案里，署了你的名字。"],
  };
  const 档 = (表[k] || 表.周);
  if (v <= -15) return 档[0];
  if (v <= -7)  return 档[1];
  if (v <= 1)   return 档[2];
  if (v <= 8)   return 档[3];
  if (v <= 17)  return 档[4];
  return 档[5];
}

function 节气条() {
  if (screen === "cover") return "";
  const 全收 = screen === "miban" || screen === "chain" || screen === "yearend"
            || S.termIndex >= S.节气.length;
  const cells = S.节气.map((d, i) => {
    const cls = 全收 || i < S.termIndex ? "过" : i === S.termIndex ? "今" : "";
    return `<div class="td ${cls}"><i></i><span>${d.term}</span></div>`;
  }).join("");
  return `<div class="tstrip">${cells}</div>`;
}

/* 品质底下那一行。为什么要显示这个 ——
   米价是跳档的（等外 3 / 二级 8 / 一级 15 / 特级 25），不是按点数涨的。
   所以"品质 +9"这个按钮的价值，全看它有没有把你顶过下一条线：
   从 76 加到 78，一亩多卖好几百；从 84 加到 93，一分钱不多，还白搭了 40 斤产量。
   玩家看不见线，就只能一路堆品质 —— 那不是他不会玩，是这局没给他能玩的信息。
   这里只给事实（你在哪一档、离下一档差几点）。
   为什么是 78 这条线、为什么要整精米率，那属于"回宿舍翻资料"那头。

   ⚠ 线会跟着年景挪，所以这里必须传 S.移线。箭头不是装饰：
   它说的是"今年的线和往年不一样" —— 那个数在年景卡上。 */
function 品阶行(q, 移线 = 0) {
  const g = gradeOf(q, 移线);
  const 下 = 等级表.find(x => x.min > 0 && x.min + 移线 > q);
  const 标 = 移线 ? `<b class="${移线 > 0 ? "up" : "dn"}">${移线 > 0 ? "↑" : "↓"}</b>` : "";
  if (!下) return `<i class="top">${g.名} · 到顶了${标}</i>`;
  const 差 = 下.min + 移线 - q;
  return `<i class="${差 <= 4 ? "near" : ""}">${g.名} · 差 ${差} 点到${下.名}${标}</i>`;
}

function hud(withField) {
  const cells = ["harvest","quality","ecology"].map(k => {
    const v = S.stats[k], f = flash[k];
    const cls = f > 0 ? "up" : f < 0 ? "dn" : (v <= 25 ? "low" : "");
    /* 把上一次显示的数写进 DOM —— 渲染完再滚过去，数字才是"变"出来的 */
    const 从 = S.显数[k], 滚 = (f && 从 !== undefined && 从 !== v) ? ` data-from="${从}"` : "";
    S.显数[k] = v;
    return `<div class="c ${cls}"><b${滚}>${v}</b>${LABEL[k]}${k === "quality" ? 品阶行(v, S.移线) : ""}</div>`;
  }).join("");
  /* 种地那一段看"已投入"，收完之后看"手里还剩多少" —— 后半段的每一步都是拿这笔钱换的 */
  const 后段中 = screen === "hangqing" || screen === "chain";
  const 钱 = 后段中
    ? `<div class="c m"><b>${S.现金 < 0 ? "-" + yuan(-S.现金) : yuan(Math.round(S.现金))}</b>手头现金</div>`
    : `<div class="c m"><b>${S.cost ? "-" + yuan(S.cost) : "0"}</b>已投入</div>`;
  return `<div class="head"><div class="hud">${cells}
    <div class="c s ${S.stamina <= 15 ? "low" : ""}"><b>${S.stamina}</b>体力</div>
    ${钱}
    <div class="c snd ${开声 ? "" : "off"}" onclick="onSound()">${开声 ? "♪" : "×"}</div>
  </div>${人情条()}${年景条()}${节气条()}</div>${withField
    ? `<div class="field">${田的画(S)}<span class="wh">田 里 的 样 子</span>${esc(田的样子(S))}</div>`
    : ""}`;
}

/* 渲染之后的动作：数字滚过去、条形长出来 —— 都是"变"给人看的 */
function 起动画() {
  if (!app.querySelectorAll) return;
  /* 数字滚动：从上一个值爬到新值，爬的过程本身就是一个反馈 */
  app.querySelectorAll("[data-from]").forEach(el => {
    const 从 = +el.dataset.from, 到 = +el.textContent;
    delete el.dataset.from;
    if (从 === 到 || !isFinite(从) || !isFinite(到)) return;
    const t0 = performance.now(), 时长 = 430;
    const 走 = t => {
      const p = Math.min(1, (t - t0) / 时长);
      el.textContent = Math.round(从 + (到 - 从) * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(走); else el.textContent = 到;
    };
    requestAnimationFrame(走);
  });
  /* 验米那三条：一条一条长出来，比一起蹦出来有看头 */
  app.querySelectorAll("[data-w]").forEach((el, i) => {
    const 宽 = el.dataset.w;
    setTimeout(() => {
      el.style.transition = "width .85s cubic-bezier(.2,.8,.3,1)";
      el.style.width = 宽;
    }, 150 + i * 130);
  });
  /* 净收益：从 0 爬到那个数。爬的过程就是"这一季攒出来了"的过程 */
  app.querySelectorAll("[data-count]").forEach(el => {
    const 到 = +el.dataset.count;
    delete el.dataset.count;
    if (!isFinite(到)) return;
    const 负 = 到 < 0, t0 = performance.now(), 时长 = 1150;
    const 走 = t => {
      const p = Math.min(1, (t - t0) / 时长);
      const v = Math.round(到 * (1 - Math.pow(1 - p, 3)));
      el.textContent = (负 && v !== 0 ? "−" : "") + Math.abs(v).toLocaleString("zh-CN");
      if (p < 1) requestAnimationFrame(走);
      else el.textContent = (负 ? "−" : "") + Math.abs(到).toLocaleString("zh-CN");
    };
    setTimeout(() => requestAnimationFrame(走), 320);
  });
  /* 收入构成那条横条：整体从左往右擦出来，不逐段长 —— 逐段会长得参差不齐 */
  app.querySelectorAll("[data-wipe]").forEach(el => {
    /* 加的是 wiped 不是 go —— 见 .mixbar.wiped 那条注释 */
    setTimeout(() => el.classList.add("wiped"), 260);
  });
}

function deltaText(d) {
  return Object.keys(d).filter(k => d[k])
    .map(k => `${LABEL[k]} ${d[k] > 0 ? "+" : ""}${d[k]}${UNIT[k]}`).join("　");
}

/* 年景卡 —— 开局那一屏和每局的决策屏都用它，保证抽到什么都长一个样。
   ⚠ 线挪过的年份，这里必须把今年的线印出来。这是整张卡最要紧的一行：
   "今年特级要 93" 是一个能拿去做决定的事实，"今年年景差"不是。 */
function 年景卡(y) {
  const 移 = y.移线 || 0;
  const 名 = ["二级", "一级", "特级"];
  const 线 = 移
    ? `<p class="ln">今年验米的线　${等级表.slice(1).map((x, i) => `${名[i]} <b>${x.min + 移}</b>`).join("　")}
       <span>往常是 ${等级表.slice(1).map(x => x.min).join(" / ")}。${移 > 0
         ? "今年籽粒不实，碾出来碎米多，线往上抬。" : "今年籽粒灌得饱，整米多，线往下走。"}</span></p>`
    : "";
  return `<div class="yc ${y.级 || "R"} ${y.色 === "d" ? "xiong" : ""}">
    <span class="tier">${y.签 || ""}</span>
    <span class="k">今 年 的 年 景</span>
    <b class="${y.色}">${y.名}</b>
    <p>${esc(y.说)}</p>
    <p style="color:#a8b8a2">${esc(y.报)}</p>${线}</div>`;
}

/* ── 开场 ── */
function viewCover() {
  return `<div class="cover">
    <h1 class="name">一亩稻</h1>
    <p class="sub">京 西 稻 · 第 ${档().季 || 1} 季</p>
    <div class="lead">
      <p>玉泉山的水从西边流过来。清代，这一带的水田种出来的稻子，是要送进宫的。鼎盛的时候，海淀有近十万亩稻田。</p>
      <p>2000 年，京密引水渠不再给农田供水。稻田一年少一两万亩。到今天，全区剩下约两千亩，是当年的百分之二。</p>
      <p>这剩下的两千亩，靠一个农业文化遗产的名头，靠一亩地九百块的粮补，靠一家三十个人的镇属公司年年往里贴，才留下来。</p>
      <p>你是农大农学院的学生。这个夏天，学院安排你到上庄生产实习一季。</p>
      <p>带你的人是老周，上庄镇农业公司的技术员，五十七岁，这一带的稻子他种了四十年。头一天见面，他上下看了你一眼，没问你学过什么，只说了一句：</p>
      <p><em>「来了就先看。别急着动手。」</em></p>
      <p>公司划出一亩试验田，让你从头跟一季。<em>种成什么样，你自己负责。</em></p>
    </div>
    ${攒下来(S)}
    <button class="go" onclick="startGame()">下 田</button>
    <button class="go sm ghost" onclick="openPractice()">突 发 事 件 练 习</button>
    <button class="go sm ghost" onclick="openBook('封面')">看 看 攒 下 的 东 西</button>
    <p class="foot">八 个 节 气 　·　验 米 　·　卖 米</p>
  </div>`;
}

/* ── 攒下来的 ──
   放在封面上，因为"攒了多少"这个问题，玩家是在**开局**问的，不是在田里。
   原来图鉴和成就只能种到一半、从田里点进去看，看完还只能回田里 ——
   最该看的东西，偏偏在最不该看的时候才能看。
   头一季不摆：什么都还没有，摆一排 0 是寒碜人。 */
function 攒下来(S) {
  if ((S.季 || 1) < 2) return "";
  const keys = Object.keys(CODEX);
  const 认得 = keys.filter(k => S.codex[k]).length;
  const 成就 = ACH.filter(a => S.ach[a.id]).length;
  const 金 = ACH.filter(a => (a.级 || "铜") === "金" && S.ach[a.id]).length;
  const 金总 = ACH.filter(a => (a.级 || "铜") === "金").length;
  return `<div class="kan">
    <span class="k">这 一 季 开 局 带 着 的</span>
    <b>田里的毛病，你认得 ${认得} / ${keys.length} 样</b>
    <p>认出来一次就忘不掉。再碰上，白送你一条线索，只送一条，
    剩下两条还得自己蹲下去看。</p>
    <b>成就 ${成就} / ${ACH.length} 块，其中金牌 ${金} / ${金总}</b>
    <p>上一季的收成扣掉花销，两成留下来做了这一季的本钱；
    在田里练出来的力气，也带过来了一点。</p>
  </div>`;
}

/* ── 抽年景 ──
   开局这一屏单独给年景。它是这一局的底牌 —— 值得停一下再翻。 */
function viewPull() {
  return `<div class="pull">
    <p class="lead2">今 年 的 天</p>
    ${年景卡(S.年景)}
    ${带过来(S)}
    <p class="grade-note" style="color:#7d8a6e;font-size:14.5px;margin:2px 0 0">
      这一季就这个天。先看清楚，再决定怎么种，天改不了，怎么应对是你的事。</p>
  </div>
  <div class="spacer"></div>
  <button class="go" onclick="toField()">看 看 田 里</button>`;
}

/* ── 事件屏 ──
   一条一屏。以前是一个节气的所有事堆一屏，出三件就是三张卡片摞着 ——
   读到第三张已经忘了第一张。而且带诊的那一条要动手，它必须独占一屏。

   ── 带诊的那一条：v5.0 最要紧的改动 ──
   旧写法第一句就是结论（"恶苗病。由种子带菌，病菌分泌赤霉素……"）。
   谜面和谜底一起给，玩家读到的是农技资料，不是一亩田 —— 这就是
   "太专业、太客观、有点失真"。真实的田里没有字幕。
   现在第一句只写眼睛能看见的：颜色、斑点、形状、手感、气味。
   要知道那是什么，你得蹲下去拔一根、或者去问老周 —— 自己凑出来。

   而且认出来是**真有用**的：认得出是二化螟，"现在打药还来得及"这个选项
   才会出现。认不出来，dueEvents 里那笔最坏的账已经扣下去了，你只能照吃。
   这就是哑巴亏，也是这个游戏最想让人尝到的东西。 */
function viewEvent() {
  const e = pendingEvents[事件位];
  if (!e) return "";
  const d = S.节气[Math.min(S.termIndex, S.节气.length - 1)];
  const 负 = Object.keys(e.delta).some(k => e.delta[k] < 0);
  const dt = deltaText(e.delta);
  const 标 = e.from && e.from[0] === "年景" ? `今 年 的 天 · ${S.年景.签 || ""}`
    /* 午饭那条既不是"好事"也不是"出事了" —— 它是过日子。
       不给它一个自己的标签，它会顶着「出 事 了」四个字出现，那不像吃饭。 */
    : e.家常 ? "吃 饭 了"
    : e.mood === "good" ? "有 回 响" : "出 事 了";
  const 多 = pendingEvents.length > 1
    ? ` · 这个节气第 ${事件位 + 1} 件，共 ${pendingEvents.length} 件` : "";
  const 末 = 事件位 + 1 < pendingEvents.length ? "还 有 一 件" : "继 续";
  /* 田就画在这儿 —— "出事了"这四个字底下的稻子已经倒了。
     倒下去的那一下只演一次，正好是你读到这条消息的时候。 */
  const 头 = `${hud(true)}
    <div class="step">第 ${S.termIndex + 1} / ${S.节气.length} 个节气${多}</div>
    <h2 class="term">${d.term}<small>${d.date}</small></h2>`;

  /* ── 不用诊的（天灾、年景、好事）：照旧一张卡 ── */
  if (!e.诊) {
    return `${头}<div class="spacer"></div>
      <div class="event ${e.mood}">
        <span class="tag">${标}</span>
        <p>${重(e.line)}</p>
        ${dt ? `<span class="dl ${负?"neg":"pos"}">${dt}</span>` : ""}
        ${e.from ? `<span class="from">这笔账来自 <b>${e.from.join(" ")}</b></span>` : ""}
      </div>${查块(e.查)}<div class="spacer"></div>
      <button class="go" onclick="nextEvent()">${末}</button>`;
  }

  /* ══ 要诊的那一条 ══ */
  const z = e.诊;
  const 能 = z.步.map((s, i) => ({ s, i })).filter(x => !z.点过[x.i]);
  const 够 = z.值 >= z.成;
  /* 三种完法：看够了 / 自己说"先记着" / 手上没得看了 */
  const 完 = z.完 || 够 || !能.length;
  /* 人事那几条不走诊断（步是空的、成是 0），看见的是事情不是田，
     标签和结论块都得换掉 —— 不换的话会出来「你 认 出 来 了」，认出的却是一片空白。 */
  const 看见 = `<div class="kan"><span class="k">${
    z.岔 ? "这 么 档 子 事" : "田 里 是 什 么 样"}</span><p>${重(e.line)}</p></div>`;
  const 事件题 = z.岔 && z.题
    ? `<h3 class="title" style="font-size:19px">${esc(z.题)}</h3>` : "";
  const 线索 = z.得.length
    ? `<div class="zh">${z.得.map(x =>
        `<div class="cond${x.定 ? " 定" : ""}"><span class="wh">${esc(x.wh)}</span>${重(x.得)}${
          x.定 ? '<span class="ding">这 一 处 够 了</span>' : ""}</div>`).join("")}</div>`
    : "";
  /* 提示行 —— 原来的"看两处，心里才有底"是写死的，等于告诉玩家这是个计数器。
     现在它说的是"还差什么"，而且分三种说法，对应三条不同的推理路子：
       成1        → 这毛病扎眼，一眼的事
       还有定案的一处没找到 → 告诉他"可能有那么一处"，但不说是哪一处
       没有定案的一处       → 直说"得两处对起来看"，省得他白费体力 */
  const 有定案 = 能.some(x => (x.s.值 === undefined ? 1 : x.s.值) >= z.成);
  const 提点 = 够 ? ""
    : z.成 === 1   ? "这毛病扎眼，找对地方，一眼就认得出来。"
    : 有定案       ? (z.得.length
        ? "还差一点。剩这几处里，说不定有一处就够。"
        : "说不定一处就够，看你找的是不是那一处。")
    :                (z.得.length
        ? "看了一处，可光一处说不准，得两处对起来看。"
        : "这毛病光看一处说不准，得两处对起来看。");
  /* 上季认过的，提点前面挂一句 —— 白送的那一条得让人知道是从哪儿来的 */
  const 提点全 = 提点 && z.熟 ? "上季你认过它。" + 提点 : 提点;

  /* ① 还没看明白，手上还有得看 —— 出动作 */
  if (!完) {
    return `${头}
      <h3 class="title" style="font-size:19px">${esc(z.题 || "这是怎么了")}</h3>
      ${看见}${线索}
      <p class="brief">光站在田埂上看不出来。你打算怎么办？</p>
      <div class="spacer"></div>
      ${能.map(x => `<button class="btn" onclick="onDiag(${x.i})">${重(x.s.text)}
        <span class="cost">${x.s.费 ? `花 ${x.s.费} 点体力` : "不费什么"}${x.s.收 ? "　·　这一条看过就算完了" : ""}</span></button>`).join("")}
      <p class="tianhint">${提点全}</p>
      <div class="spacer"></div>`;
  }

  /* ② 看明白了 —— 名字落地，然后是处置 */
  if (够) {
    const c = CODEX[z.名];
    const 结 = z.岔 ? "" : `<div class="zh"><div class="got">
      <span class="lb">你 认 出 来 了</span>
      <span class="nm">${esc(z.名)}</span>
      ${c ? `<p><b style="font-weight:600">书上说</b>　${重(c[1])}</p>` : ""}
      ${z.白 ? `<p><b style="font-weight:600">说白了</b>　${重(z.白)}</p>` : ""}
    </div></div>`;

    /* 处置过了 —— 出结果 */
    if (z.治) {
      const t = z.治, d2 = deltaText(t.delta);
      return `${头}${事件题}${看见}${线索}${结}
        <div class="event ${z.岔 ? "" : (t.好 ? "good" : "bad")}">
          <span class="tag">${z.岔 ? "你 拿 了 主 意" : "你 动 手 了"}</span>
          <p>${重(t.说)}</p>
          ${d2 ? `<span class="dl ${t.好?"pos":"neg"}">${d2}</span>` : ""}
        </div><div class="spacer"></div>
        <button class="go" onclick="nextEvent()">${末}</button>`;
    }

    /* 还没处置 —— 出处置选项；没有可处置的就直接收 */
    const 处 = z.处置 || [];
    if (!处.length) {
      return `${头}${看见}${线索}${结}<div class="spacer"></div>
        <button class="go" onclick="nextEvent()">${末}</button>`;
    }
    return `${头}${事件题}${看见}${线索}${结}
      <p class="brief">${esc(z.问 || "知道是什么了。这一手还救不救得回来，你得拿个主意。")}</p>
      <div class="spacer"></div>
      ${处.map((o, i) => {
        /* ⚠ 锁着的**不过滤掉**，只把按钮换成一行灰字（见下面那段）。
           一过滤，onTreat(i) 里那个 i 就整体前移，点第二条打第三条的账，还不报错。 */
        if (!开着(o, S)) return "";
        /* 小字：挂在按钮底下的一行灰字，看当前状态现算。
           ⚠ 是"提示"不是"数据" —— 半句含糊话，一个数都不给。
             给了数就变成刷数值，这张桌子就不像饭桌了。
           ⚠ 走 小字文() 而不是直接读 o.小字 —— 理由见 注文 上头那段漂名的事。 */
        const 小 = 小字文(o, S);
        /* ⚠ 费 / 钱 一律走 算数()。直接读 o.费 / o.钱 的话，
           碰上写成函数的那几条（午饭那组）会印出「掏 NaN 元」——
           用户报的就是这个。见 算 上头那段。 */
        const 费 = 算数(o.费, S), 钱 = 算数(o.钱, S);
        return `<button class="btn" onclick="onTreat(${i})">${重(o.text)}
        <span class="cost">${[费 ? `花 ${费} 点体力` : "", 钱 ? `掏 ${yuan(钱)} 元` : ""].filter(Boolean).join("　·　") || "不费什么"}</span>${小 ? `<span class="cost" style="color:var(--dim);opacity:.8">${esc(小)}</span>` : ""}</button>`;
      }).join("")}
      ${(() => {
        /* 够不着的那几条，露在这儿。用的是决策屏那套 .lk / .locks —— 两边长一样，
           玩家看到的也是同一句话。处置屏以前不认 开，写了等于没写。 */
        const 行 = 处.map((o, i) => 开着(o, S) ? "" : (() => {
          const 因 = typeof o.锁说 === "function" ? o.锁说(S) : o.锁说;
          return `<div class="lk"><b>${重(o.text)}</b><span>${esc(因 || "还差一步")}</span></div>`;
        })()).join("");
        return 行 ? `<div class="locks">${行}</div>` : "";
      })()}
      <div class="spacer"></div>`;
  }

  /* ③ 没看出来 —— 账照吃，人还是糊涂的 */
  return `${头}${看见}${线索}
    <div class="zh"><div class="blind">你在田里转了两圈，蹲下去又站起来，还是没看出这是个什么。
      该记的账还是记上了，只是你到现在也不知道，那是什么。</div></div>
    <div class="spacer"></div>
    <button class="go" onclick="nextEvent()">${末}</button>`;
}

/* ── 决策屏 ── */
function viewDecision() {
  const d = S.节气[S.termIndex];
  if (大田屏(d)) return 田里点(d);
  const buttons = 有位(d).map(i => {
    const o = d.options[i];
    const 缺口 = Math.max(0, o.stam - S.stamina);
    const 钱 = o.cost + 缺口 * NUM.雇工价;
    const bits = [`${o.stam} 点体力`];
    if (缺口 > 0) bits.push(`自己干不完，雇 ${缺口} 个人工 <i class="hard">+${yuan(缺口*NUM.雇工价)} 元</i>`);
    if (o.cost > 0) bits.push(`花 <i>${yuan(o.cost)} 元</i>`);
    return `<button class="btn" onclick="onChoose(${i})">
      ${esc(o.text)}<span class="cost">${bits.join("　·　")}</span>${注文(o, S)}</button>`;
  }).join("");

  return `${hud(true)}
    <div class="step">第 ${S.termIndex + 1} / ${S.节气.length} 个节气</div>
    <h2 class="term cmp">${d.term}<small>${d.date}</small></h2>
    <h3 class="title cmp">${esc(d.title)}</h3>
    ${说话(d)}
    <p class="brief cmp">${esc(d.brief)}</p>
    <div class="spacer"></div>${buttons}${锁条(d)}<div class="spacer"></div>`;
}

/* ── 田里点 ──
   跟上面那屏的差别只有一处：**选项不写在按钮上，写在田里**。
   你点的不是"露地育秧"这四个字，是那片敞着的秧田；不是"盖膜育秧"，
   是田埂上那摞膜。点哪儿，就是把哪儿的事做了。

   为什么非要做成这样 —— 现在这一屏是「一段故事 + 两个按钮」，
   玩家三分钟里读了两千字，手上一下没动过。人的手不动，就不觉得在玩。
   而这里的手是有分量的：你点下去的是田里那个东西，不是一条选项。

   ⚠ 热区的坐标是 SVG viewBox(320×140) 里的坐标，靠百分比铺到画面上，
     所以田放大缩小时气泡跟着走。田本身现在也大了 —— 原来它只是 HUD
     底下一条小图，跟正文抢不到注意力，"你有一块地"这件事立不住。

   ⚠ 这里必须 hud(false)。hud(true) 会把那一小块田连同"田里的样子"一起画在顶上，
     于是同一屏里出现两块田 —— 一块小的摆在那儿不能点，一块大的能点，
     玩家第一反应是去点小的那块。田这一屏只该有一块，就是能点的这块，
     田的样子那句话降级成图注（.tsay）跟在它下面。 */

/* 这一屏真能点哪几条。
   ⚠ 田里点、决策屏、家什层三处必须走同一个表 —— 各写各的 filter，
     迟早会出现"看得见点不着"或者"点得着看不见"。
   锁着的选项一律排在最后，所以滤掉它前头的下标一个不动。

   ── 两种锁 ──
   要灵：翻书翻出来的那一手。走的是 灵感 表，翻到那一页才有。
   开  ：通用那条，o.开(S) 判。写"完成某件事之后才出现的新选项"就用它 ——
         可以读 flags、旧（上一季的账）、印象、名望、查过、认得，随便读。
   ⚠ 抽出 开 是因为再写第二条 if 就该抽了。写死第二条的话，
     第三条、第四条迟早会以稍微不一样的写法散在三个渲染函数里。 */
const 开着 = (o, S) => !(o.要灵 && !S.灵感[o.要灵]) && !(o.开 && !o.开(S));
const 有位 = d => (d.options || []).map((o, i) => i)
  .filter(i => 开着(d.options[i], S));
/* 锁着的那些 —— 用来在屏幕底下露一条灰的（见 锁条）。 */
const 锁着 = d => (d.options || []).map((o, i) => i)
  .filter(i => !开着(d.options[i], S));

/* 田下面那张单子 ── 这一屏的几处，一条条摊开。
   ⚠ 为什么非要有它：田里的气泡只挂得住「标 + 几体力几钱」，挂不下 o.注 那句。
     三处气泡一起加注解，实测互压 10 处（_量.py）。所以 注 从气泡上撤下来，
     撤到这儿印。字写在数据里就得有个地方印，不然就是白写 ——
     这个文件自己在 5688 行附近警告过一回（v5.9 那五条新路就是这么哑掉的）。
   ⚠ 锁着的几条**也列**，灰着列。原来这一栏叫 锁条，只列锁着的；
     现在跟田里对上了 —— 田里三个点，这儿三行，一一对应。
   ⚠ 点得着的那几行做成按钮，跟田里的点同一条路（onHot）。想点田里就点田里，
     想在字上点就在字上点。 */
function 田里单(d) {
  const 行 = (d.options || []).map((o, i) => {
    const h = d.热区[i] || {};
    const 标 = h.标 || o.text || "";
    if (开着(o, S)) {
      const 注 = 小字文(o, S);
      return `<button class="r" onclick="onHot(${i})"><b><em>${圈码(i)}</em>${esc(标)}</b>${
        注 ? `<i>${esc(注)}</i>` : ""}</button>`;
    }
    const 因 = typeof o.锁说 === "function" ? o.锁说(S) : o.锁说;
    return `<div class="r lk"><b><em>${圈码(i)}</em>${esc(标)}</b><i>${esc(因 || "还差一步")}</i></div>`;
  }).join("");
  return `<div class="roster">${行}</div>`;
}

/* 锁着的那一条长什么样。给的只是"差什么"，不是"怎么攒" ——
   怎么攒是留给玩家自己想的那部分。 */
function 锁条(d) {
  const 锁 = 锁着(d);
  if (!锁.length) return "";
  const 行 = 锁.map(i => {
    const o = d.options[i];
    const 因 = typeof o.锁说 === "function" ? o.锁说(S) : o.锁说;
    return `<div class="lk"><b>${esc(o.text)}</b><span>${esc(因 || "还差一步")}</span></div>`;
  }).join("");
  /* 标题按"锁的是哪一类"来 —— 全是要灵就是翻书，全是要开就是别的事，
     混着就都叫"还没到时候"。三种情况各说各的，别一句糊过去。 */
  const 全是灵 = 锁.every(i => d.options[i].要灵);
  const 全是开 = 锁.every(i => d.options[i].开);
  const 题 = 全是灵 ? "翻过书，才想得起这几手" : 全是开 ? "还有几条路，你还没走到" : "还有几条路，你还没走到";
  return `<div class="locks">${行}</div>`;
}

/* 田里那几个点的号。①②③… 跟下面那张单子上的号是**同一个号** ——
   用户报「田里和下面的选项都可以改，我都不知道该点哪个了」，
   根子就是两个入口看不出是同一批事。编上号，一眼就是"这三个"。
   ⚠ 第 10 个往后没有圈码字了，退回普通数字 —— 现在最多 4 个选项，够用。 */
const 圈码 = i => "①②③④⑤⑥⑦⑧⑨"[i] || String(i + 1);

function 田里点(d) {
  /* ⚠ 这里原来是 有位(d).map —— 只画点得着的那几处。于是新玩家每一屏的田里
     都只有两个点，看着像"这游戏就两个选择"（用户报的原话）。
     现在三条全画：点得着的挂气泡，点不着的画个灰点、挂 onclick 去问它为什么锁着。
     家什层还是只认 有位()，所以锁着的那处的家什不会先长在田里 ——
     看见了却点不着，比不画更难受，这条原来的判断是对的。 */
  const 点 = (d.options || []).map((o, i) => {
    const h = d.热区[i] || {};
    const 左 = h.x / 320 * 100, 上 = h.y / 140 * 100;
    if (!开着(o, S)) return `<button class="hot lk"
        style="left:${左.toFixed(2)}%;top:${上.toFixed(2)}%"
        onclick="onLock(${i})" aria-label="${esc(o.text)}"><span class="dot"></span></button>`;
    const 缺口 = Math.max(0, o.stam - S.stamina);
    const bits = [`${o.stam} 体力`];
    if (缺口 > 0) bits.push(`雇工 +${yuan(缺口 * NUM.雇工价)}`);
    if (o.cost > 0) bits.push(`${yuan(o.cost)} 元`);
    /* 气泡往哪边飘：靠右的点就把气泡摆到左边去，别顶出屏幕。
       ⚠ 摆过去之后**小尖嘴也得跟着挪** —— 尖嘴默认在气泡正中（居中那套是对的），
         可气泡一旦改成贴边，正中就飘到别处去了，指着空气。所以顺带带个类名，
         让 CSS 把尖嘴挪到挨着圆点的那一头。 */
    const 靠右 = h.x > 210, 靠左 = h.x < 90;
    /* ⚠ 偏移是相对**按钮盒的中心**算的，不是相对一个零大的点。按钮盒 58×58，
       所以 50% 就是那个中心；贴边的两套写 calc(50% + 6px)，气泡边离中心 6px，
       小尖嘴正好跨在中心上（见 .bub.l/.bub.r 的 ::after）。 */
    /* 气泡一律挂在点**上方**，纵向交给 CSS（.bub 的 bottom:50% + margin-bottom），
       这儿只摆横向 + 「抬」。

       ⚠ 这里原来还带着 transform:translateY(-100%)，那是个重复扣减：
         .bub{bottom:50%} 已经让气泡底边落在圆点中心（按钮盒 58px，50% 就是中心），
         margin-bottom:26px 再往上推 26px —— 到这儿气泡底边离圆点 26px，正好。
         再加一个 translateY(-100%) 就是**又往上挪了一整个气泡高**，
         于是气泡浮在圆点上方 26+高 的位置：96px 高的气泡，底边跑到 122px 上头。
         田只有 140 个单位高，气泡整个跑到田外，压在节气条和数值条上 ——
         玩家看到的就是"太靠上，显示不完全"。
         _量.py 实测（v5.9.2 提交版）：43 个气泡出顶 6~80px，无一例外。

       ⚠ 去掉之后 43 个全回到田里，可三处气泡又互相压住了。原来 h.下 那一处
         挂在点**下方**，正好落进另外两处的带子里 —— 实测压住 10~13 处。
         现在 h.抬 的意思是"这一处再往上一截"，抬 20px 就够错开。
         _量.py 实测：出顶 0、出底 0、互压 0。抬 16/22 也干净，30 就开始出顶。 */
    const 抬 = h.抬 ? "translateY(-20px)" : "";
    const 位 = 靠右 ? `right:calc(50% + 6px);transform:${抬}`
      : 靠左 ? `left:calc(50% + 6px);transform:${抬}`
      : `left:50%;transform:translateX(-50%) ${抬}`;
    /* 有家什的那一处，**家什自己就是记号** —— 不再画圆点。
       圆点 30px 压在一件 45px 宽的家什上，等于把它糊住了：玩家看见的是个白圈，
       不是"田埂上那摞膜"。记号只有一个，要么是家什（它在呼吸），
       要么是圆点（指田本身的那种，没东西可指，就得给个点）。 */
    return `<button class="hot" style="left:${左.toFixed(2)}%;top:${上.toFixed(2)}%"
        onclick="onHot(${i})" aria-label="${esc(o.text)}">
      <span class="bub ${靠右 ? "r" : 靠左 ? "l" : "c"}" style="${位}"><b><em>${圈码(i)}</em>${esc(h.标)}</b><i>${bits.join(" · ")}</i></span>
      ${h.画 ? "" : `<span class="dot"></span>`}</button>`;
  }).join("");

  return `${hud(false)}
    <div class="bigfield">${田的画(S)}${点}</div>
    <p class="tsay"><span class="wh">田 里 的 样 子</span>${esc(田的样子(S))}</p>
    <div class="step">第 ${S.termIndex + 1} / ${S.节气.length} 个节气</div>
    <h2 class="term cmp">${d.term}<small>${d.date}</small> · ${esc(d.title)}</h2>
    ${说话(d)}
    <p class="brief cmp">${esc(d.brief)}</p>
    <p class="tianhint">田里的 ①②③ 和下面这张单子是同一批事，点哪个都一样。</p>
    ${田里单(d)}
    <div class="spacer"></div>`;
}

/* ── 反馈屏 ──
   一屏只说一件事：这一手把三个数变成了什么样。
   老表格式的三行"前→后"删了 —— 顶上那条随时在显示当前值，重复一遍就是噪音。
   查资料挪去它自己那屏（见 viewNote）—— 白天动手、晚上翻书，本来就是两件事。 */
function viewResult() {
  const d = S.节气[S.termIndex], R = lastResult;
  const 大 = ["harvest","quality","ecology"].filter(k => R.delta[k]).map((k, n) => {
    const v = R.delta[k];
    return `<div class="dl-big ${v > 0 ? "u" : "d"}" style="animation-delay:${n*.08}s">
      <b>${v > 0 ? "+" : ""}${v}</b><span>${LABEL[k]}${UNIT[k]}</span></div>`;
  }).join("");
  const 体 = R.体力前 - R.体力;
  /* ── 今晚这一段值不值得熬 ──
     不给这句话，翻书就是个盲赌：全季二十来个选项里只有几个带灵感，
     玩家算下来"大概率白扔两点体力"，就不翻了 —— 那正是他抱怨的
     「翻书翻不出什么灵感」。给了信号，翻书才变回取舍：拿体力换念头。
     而且这一句是"人"话，不是系统的提示 —— 今天这活儿，让我想起在哪儿看过。
     ⚠ 读的是 R.查，不是 S.待查：S.待查 要到 onNight 里才写，
       按钮这一屏它还是上一晚留下的 null。
     ⚠ 已经得过的那条不再提示（可灵 里也是这么判的）——
       否则玩家会为了一个拿不到的东西熬夜。 */
  const 有念 = !!(R.查 && R.查.灵 && !S.灵感[R.查.灵]);
  const 够力 = S.stamina >= NUM.灵感体力线;
  /* ⚠ 少了「今天这一手书上根本没有」这一种。原来那种情况下 夜话 是**空的**，
     按钮上只有"翻到半夜 · 今晚只回 6 点"—— 玩家看不见任何提示，
     点下去，那一屏是白的。1/3 的选项不带 查资料（逐格量过 1440 次里 480 次），
     所以这不是边角，是三步一回。用户报的「小暑 · 宿舍 · 熄灯前 一片白」就是它。
     翻书比睡觉少回 6 点体力，不知道里头是空的，等于拿体力买白屏。 */
  const 夜话 = !R.查 ? " · 今天这一手，书上没有对应的那一页"
    : !有念 ? (够力 ? " · 这事儿上回翻到过，今晚顶多再抄一遍"
                   : " · 精神不够，翻不出念头")
    : 够力 ? " · 今天这事儿，我好像在哪儿看过"
    : " · 今天这事儿我好像在哪儿看过，可就这点精神，怕是熬不出来";
  const 花 = [];
  if (R.花销) 花.push(`花 ${yuan(R.花销)} 元`);
  if (R.雇工费) 花.push(`自己干不动，请了 ${R.缺口} 个人工，${yuan(R.雇工费)} 元`);
  if (体) 花.push(`出力 ${体} 点`);
  /* 在田里点过的那一屏，做完把田**再摆一遍** —— 位置跟刚才一模一样，
     只有一样东西变了。这就是"我这一手干了什么"最直接的答复：
     盖膜那一下，田里真的蒙上了一层；不盖，田还是敞着的。
     ⚠ 只有点过田的那一屏这么干。其余屏照旧不带田（hud() 不传参 = 不要那块小的），
       别顺手全给加上 —— 那是八个屏一起变样，得先说一声。 */
  const 大田 = 大田屏(d);
  return `${hud(大田 ? false : undefined)}
    ${大田 ? `<div class="bigfield">${田的画(S)}</div>
      <p class="tianhint" style="margin:2px 0 12px">田还摆在这儿，是让你回头看一眼这一手干了什么。这一屏不用点。</p>` : ""}
    <div class="step">${d.term} · ${esc(d.title)}</div>
    ${大 ? `<div class="deltas">${大}</div>` : ""}
    <p style="font-size:18px">${esc(R.text)}</p>
    ${R.note ? `<p style="color:var(--dim);font-size:15px">${esc(R.note)}</p>` : ""}
    ${R.说 ? `<div class="kan">
      <span class="k">这 一 手 跟 什 么 有 关</span>
      <b>${esc(R.关)}</b>
      <p>${重(R.说)}</p></div>` : ""}
    ${花.length ? `<p style="color:var(--clay);font-size:14.5px;margin:14px 0 0">
      ${花.join("　·　")}　·　本季已投入 ${yuan(S.cost)} 元</p>` : ""}
    <div class="spacer"></div>
    <p class="tianhint">天 黑 了 · 宿 舍 · 熄 灯 前</p>
    <button class="go" onclick="onNight('读')">翻 翻 书
      <small>翻到半夜 · 今晚只回 ${NUM.翻书恢复} 点体力${夜话}</small></button>
    <button class="go sm ghost" style="margin-top:10px" onclick="onNight('睡')">倒 头 就 睡
      <small>今晚回 ${NUM.睡觉恢复} 点体力${有念 ? " · 那点念头，只好先放着" : " · 什么也不多"}</small></button>`;
}

/* ── note 屏底下那块「抄在本子上了」 ──
   ⚠ 原来这儿是写死的一句话：「到灌浆那阵子，老周会考你一回。」
     三个毛病，用户一次全指出来了：
       ① 每次翻书都是这一句，读到第三遍就当它不存在了
          （原话："结果只能是到灌浆那阵子老周会考你一回，太单调"）；
       ② 那时候田里已经有五处用得上说法的地方（随机池里挂 书: true 的那五件，
          苗期/分蘖/孕穗/灌浆/成熟各一件），可屏幕上只提了灌浆那一件 ——
          机制早就不单一了，是**界面没告诉玩家**；
       ③ "灌浆"是行话，全文件没有一处跟玩家解释过（原话："我根本不知道灌浆
          是什么"）。一句要玩家看懂的预告，用了玩家不认识的词，等于没写。
     现在读真实状态：今晚抄的这条开了哪扇门、本子攒了几条、五扇门开了几扇。
     而且**抄到重复的那一晚也有话说** —— 原来整块不印，玩家看到的就是
     "我熬到半夜，什么也没落着"。 */
function 法块文() {
  const 条 = Object.keys(S.说法 || {}).length;
  const 开 = 书门(S), 总 = 书门总数();
  /* 这条说法**自己**开了哪扇门 —— 拿"抽掉它之后"跟现在比。
     ⚠ 不认外部传进来的"之前"快照（原先是 onNight 存 S.门前、onContinue 清）：
       那种状态要在一处存、在另一处清，中间隔着整整一屏，
       迟早有一次忘了清，屏幕上就会说错话 —— 而且不报错。
       这么算多跑一遍 filter，但它是**自证**的：改坏了当场看得出来。 */
  const 没这条 = { ...S.说法 };
  if (S.新说法) delete 没这条[S.新说法];
  const 门前 = 书门({ 说法: 没这条 });
  const 新开 = (S.新说法 ? 开 : []).filter(x => !门前.includes(x));
  /* ⚠ find 必须带上 e.书 —— 同阶段有一堆别的事件（苗期就十来件），
     只按 at 找会抓到一个没有 书说 的，印出来就是"这条用得上。undefined"。
     ⚠ 一次可能开两扇门（抄到第 3 条，分蘖 和 灌浆 可能同时跨线），
     所以是 map 不是 find —— 只报一扇，另一扇就静默地开了，玩家还以为没开。 */
  const 新件 = 新开.map(a => 随机池.find(e => e.书 && e.at === a)).filter(Boolean);
  /* 进度那句不印阶段名 —— "苗期/分蘖/孕穗/灌浆/成熟"在这儿列出来只会更长，
     而要看懂它们得先学会五个行话。数数就够：玩家看到 2/5 自己会想凑齐。
     阶段名的白话在 段白 那张表里，留给真要印名字的地方用。 */
  const 进度 = `从种下到开镰，一共有 ${总} 处地方用得上抄来的话。` +
               `本子上 ${条} 条，已经开了 ${开.length} 处。`;
  if (S.新说法) return `<div class="fa"><span class="k">抄 在 本 子 上 了</span>
      <b>${esc(S.新说法)}</b>
      ${新件.map(x => `<span class="where">这条用得上。${esc(x.书说)}</span>`).join("")}
      <span class="where">${进度}</span></div>`;
  const 法 = S.待查 && S.待查.法;
  if (!法) return "";
  return `<div class="fa 旧"><span class="k">这 条 早 就 抄 过 了</span>
      <b>${esc(法)}</b>
      <span class="where">${进度}</span></div>`;
}

/* ── 回宿舍翻资料 ──
   单独一屏。白天那个没想明白的事儿，晚上翻书翻出来了 —— 它值一屏的注意力。 */
function viewNote() {
  const d = S.节气[S.termIndex];
  const 灵 = S.新灵感 ? 灵感[S.新灵感] : null;
  /* 三种晚上，得说三种话 —— 玩家要靠这个学会"哪天值得熬"：
       真出念头了   → 摆出来，并告诉他这东西哪天用得上
       书上有灵、精神不够 → **把规则明说**（不到 30 只剩字），不然他会以为是随机的
       这段书本来就没念头 → 不提，免得每屏都在吊胃口 */
  const 欠 = !灵 && S.待查 && S.待查.灵;
  /* 抄下来的那句。没有它，玩家翻完书只看到一段长长的"书 上 说"，
     合上就忘 —— 有它才知道"这一晚我落了什么"。 */
  const 法块 = 法块文();
  /* 页边上的铅笔字。
     ⚠ S.新批注 存的是**下标**，0 是合法值 —— 判空得用 !== null，
       写成 if (S.新批注) 的话第 0 条永远印不出来，而且不报错。 */
  const 批块 = (S.新批注 !== null && S.新批注 !== undefined && 边批[S.新批注])
    ? `<div class="pi"><span class="k">页 边 有 铅 笔 字</span>
        <p>${esc(边批[S.新批注])}</p></div>` : "";
  const 旁 = 灵
    ? `<div class="ling"><span class="k">脑 子 里 多 出 个 念 头</span>
        <p>${重(灵.得)}</p>
        <span class="where">等 ${灵.落} 那一天，田里会多出一处你能点的东西。</span></div>`
    : 欠
    ? `<div class="ling 欠"><span class="k">今 晚 翻 不 动</span>
        <p>眼睛在字上走，念头起不来。今天在地里太乏了。</p>
        <span class="where">体力不到 ${NUM.灵感体力线} 的晚上，翻书只剩字。想熬出东西，白天就得省着点力气。</span></div>`
    : "";
  /* ⚠ 兜底：翻书**什么也没翻出来**的那一晚。
     四个块全是"有才印"，于是这一屏能空到只剩一行标题和一个按钮 ——
     玩家点的是"翻翻书"，得到的是一片白，还不知道自己为什么白。
     而且翻书比睡觉少回 6 点体力，这一晚是拿体力买了个空屏。
     ⚠ 1/3 的选项不带 查资料（逐格量过 1440 次里 480 次），所以这是三步一回，
       不是边角。用户报的「小暑 · 宿舍 · 熄灯前，什么都没加载，一片白」就是它。
     ⚠ 判据要连 批块 一起看：边批是抽的，抽着了这一屏就不空，那就别报"白熬"。 */
  const 翻空 = !S.待查 && !灵 && !法块 && !批块
    ? `<div class="ling 欠"><span class="k">今 晚 翻 空 了</span>
        <p>翻到半夜，没翻出跟今天这一手对得上的那一页。</p>
        <span class="where">书是按"你白天怎么做的"分篇的，不是每一手都有对应的一页。
          睡 觉比翻书多回 ${NUM.睡觉恢复 - NUM.翻书恢复} 点体力，往后看一眼结果屏上那行小字再定。</span></div>`
    : "";
  return `${hud()}
    <div class="step">${d.term} · 宿舍 · 熄灯前</div>
    ${查块(S.待查)}${旁}${法块}${批块}${翻空}
    <div class="spacer"></div>
    <button class="go" onclick="onContinue()">${
      S.termIndex + 1 >= S.节气.length ? "收 割" : "睡 了 · 明 天 再 说"}</button>`;
}

/* ── 验米 ── */
/* ── 验米揭晓 ──
   这是全季攒了八个节气之后第一次听见响。
   每一档都得有排面 —— 特级是特级那一种，等外是等外那一种，
   但都得是"你种出来的"这件事被正正经经地摆上台面。
   档位（气）不同，舞台不同：金光、银绿、青绿、土黄。
   不变的只有一件事 —— 先夸人，再讲米。 */
function viewMiban() {
  const g = miban.grade, 气 = g.气 || "c";
  /* 星芒数量跟档位走：特级五颗，一级三颗，二级一颗，等外没有 */
  const 星数 = { a: 5, b: 3, c: 1, d: 0 }[气];
  const 位置 = [[22,26],[74,20],[48,14],[30,64],[68,58]];
  const 星 = 位置.slice(0, 星数)
    .map(([x,y],i) => `<span class="spark" style="left:${x}%;top:${y}%;animation-delay:${.45+i*.14}s"></span>`).join("");
  const 牌 = { a: "够 得 上 贡 米", b: "地 头 现 碾 鲜 米", c: "收 粮 等 级", d: "这 一 季 的 米" }[气];
  /* 条形不用 transition，交给渲染后的 起动画() 一条一条长出来 */
  const bar = (k, v) => {
    const pct = k === "harvest" ? clamp((v-400)/8, 0, 100) : clamp(v, 0, 100);
    return `<div style="display:flex;align-items:center;gap:10px;font-size:13px;color:var(--dim);margin-bottom:7px">
      <span style="width:34px;flex:none">${LABEL[k]}</span>
      <span style="flex:1;height:6px;background:#e6e0cf;border-radius:3px;overflow:hidden">
        <span data-w="${pct}%" style="display:block;height:100%;border-radius:3px;width:0;
          background:${气 === "a" ? "var(--gold)" : 气 === "d" ? "#c2a878" : "var(--green)"}"></span></span>
      <span style="width:38px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)">${v}${UNIT[k]}</span></div>`;
  };
  return `<div style="margin:0 0 16px">${节气条()}</div>
    <div class="step">秋分之后 · 验米</div>
    <div class="grade-wrap ${气}">${星}
      <div class="grade-name ${气}">${g.名}</div>
      <div class="grade-tag">${牌}</div>
      <p class="praise">${esc(g.夸)}</p></div>
    <p class="grade-note" style="margin-top:0">${esc(miban.眼力)}</p>
    <div style="margin:14px 0 0">${bar("harvest",S.stats.harvest)}${bar("quality",S.stats.quality)}${bar("ecology",S.stats.ecology)}</div>
    <p class="grade-note" style="color:var(--dim)">这个等级决定了你的米按什么价走，${yuan(g.价)} 元一斤。${esc(g.口感)}。</p>
    <div class="field" style="margin-top:18px">${田的画(S)}<span class="wh">这 一 季 的 田</span>${esc(田的样子(S))}</div>
    ${S.log.length ? `<h3 class="title" style="font-size:17px">地里的账</h3>
      ${S.log.map(e => `<p class="note-line">${重(e.line)}</p>`).join("")}` : ""}
    <div class="spacer"></div>
    <button class="go" onclick="toChain()">把 粮 拉 回 去</button>`;
}

/* ── 二三产 ── */
/* ── 行情揭晓 —— 后半段的抽卡，跟年景同一套排面 ── */
function viewHangqing() {
  return `<div class="pull">
    <p class="lead2">今 年 的 市</p>
    ${行情卡(S.行情)}
    <p class="grade-note" style="color:#7d8a6e;font-size:14.5px;margin:2px 0 0">
      稻子已经收上来了，市什么样，现在才知道。种是一回事，卖是另一回事。</p>
  </div>
  <div class="spacer"></div>
  <button class="go" onclick="toChainGo()">开 磅 秤</button>`;
}

/* ── 链子：收完之后那一条 ──
   ⚠ 现在有**两条**链走这台机器：S.后段（收粮、碾米、卖米、三产）和
     S.年话（转过年来那一趟）。两边的形状是一样的（term/who/title/brief/
     say/options，选项支持 续 / 回 / 设 / 锁），差别只在头上那两行小字。
     所以共用一个 viewChain / onChain，靠 链名 分流 ——
     另起一份渲染的话，续/回/设那套逻辑就得抄第二遍，抄完就开始漂。 */
let 链名 = "后段";
const 当前链 = () => (链名 === "年话" ? (S.年话 || []) : (S.后段 || []));

function viewChain() {
  const 年 = 链名 === "年话", 链 = 当前链();
  const step = S.chainIndex || 0, c = 链[step];
  if (!c) return viewYearEnd();
  const 取值 = v => typeof v === "function" ? v(S) : v;
  /* ── 反应屏 ──
     刚点完一条路，先别翻页，把对方那一下演出来（见 onChain 里的 o.后）。
     ⚠ 它盖在**同一格**上，标题那一行照旧（还是第 N / M 步）——
       玩家不会以为"冒出来一件新事"，只会以为"这一步还没完"。
       那正是它该有的手感：这一步的账还没结完。
     ⚠ 一定要是**单独一屏**，不能把那句话塞进选项的 sub 里：
       sub 在点之前就印在按钮上了，等于把他的反应提前剧透。 */
  if (c.反应) return `${hud()}
    <div class="step">${年 ? "转过年来" : esc(c.term) + " · 收完之后"} 第 ${step + 1} / ${链.length} 步</div>
    <h2 class="term cmp">${esc(c.term)}<small>${年 ? "转 过 年 来" : "收 完 之 后"}</small></h2>
    <div class="say"><span class="who">${esc(取值(c.反应.谁))}</span><p style="white-space:pre-line">${esc(取值(c.反应.说))}</p></div>
    <div class="spacer"></div>
    <button class="go" onclick="反应完()">知 道 了</button><div class="spacer"></div>`;
  const buttons = c.options.map((o, i) => {
    /* 锁可以是 true（死锁），也可以是个谓词 —— 谓词当场读 live 状态。
       有的条件（手头够不够）是在这一屏**之前**才定下来的。 */
    const 锁 = o.锁 === true || (typeof o.锁 === "function" && o.锁(S));
    return `<button class="btn${锁 ? " lockbtn" : ""}" ${锁 ? "disabled" : `onclick="onChain(${i})"`}>
      ${esc(o.text)}<span class="cost">${esc(取值(o.sub))}</span></button>`;
  }).join("");
  return `${hud()}
    <div class="step">${年 ? "转过年来" : esc(c.term) + " · 收完之后"} 第 ${step + 1} / ${链.length} 步</div>
    <h2 class="term cmp">${esc(c.term)}<small>${年 ? "转 过 年 来" : "收 完 之 后"}</small></h2>
    <h3 class="title cmp">${esc(c.title)}</h3>
    <p class="brief cmp">${esc(c.brief)}</p>
    ${c.say ? `<div class="say"><span class="who">${esc(c.who)}</span><p style="white-space:pre-line">${esc(取值(c.say))}</p></div>` : ""}
    <div class="spacer"></div>${buttons}<div class="spacer"></div>`;
}

/* ── 「转过年来」走完那一趟的收束屏 ──
   为什么中间要垫这一屏，而不是直接回账本：账本上那一块跟进来之前长得
   一模一样，玩家认不出"这一趟已经走完了"（用户原话：「一直在那里循环，
   让人摸不着头脑」）。垫一屏把话说完整：走了几件、还剩几件、哪儿去了。
   ⚠ 它**不是**结算，账本上的数已经算完了，这一屏一个数都不改 ——
     所以上头那句话得说"记下了"，不能说"算出来了"。
   ⚠ 剩下那几件说的是**队里还排着多少**，不是"明年一次全给你"：
     一季只走一趟，20 条要七八季才看得完。说"明年"会让人以为明年一堆。 */
function view年话完() {
  const 剩 = 待后话(S).length;
  const 本趟 = (S.年话 || []).length;
  return `${hud()}
    <div class="step">转过年来</div>
    <h2 class="term cmp" style="font-size:30px">走 完 了<small>转 过 年 来</small></h2>
    <p class="brief cmp">这一趟 ${本趟} 件，都记在账上了。</p>
    <div class="spacer"></div>
    <div class="sf-wrap">
      <div class="sf-tag">这 一 季 到 这 儿</div>
      <div class="sf-name">${剩 ? `还有 ${剩} 件` : "都走完了"}</div>
      <p class="sf-why">${
        剩 ? `这些是历年攒下的，一季只走一趟。剩下的排在后面几季，跑不了。`
           : `攒下的都走完了。往后还会有新的，一件一件来。`}</p>
    </div>
    <div class="spacer"></div>
    <button class="go" onclick="回到账本()">回 到 账 本</button>`;
}

window.回到账本 = function () { screen = "yearend"; 响("tap"); render(); };

/* ── 年终账本 ── */
/* ── 年终 ──
   全季的收口。八个节气的因，到这里合成一个数。
   一个数是不够的 —— 得让人看清楚这个数是怎么来的（收入构成），
   得有人对着一季说一句话（季评），也得把这一季攒下的牌子摆出来（成就）。
   排场是给"你真种了一季"这件事的，不是给分数的 —— 所以每一档都有话说。 */
const 季评 = [
  { 名:"下下", min:-1e9, 气:"d",
    说:"往里贴了钱。镇属那家三十来号人的公司，年年也都在往里贴。京西稻就是这么留下来的，你这一亩今年也算了一份。" },
  { 名:"下",   min:3000, 气:"d",
    说:"贴进去一些，不多。一亩稻头一年种，这本账本来就难平。头一年种的人，都得往里贴这一笔。" },
  { 名:"中",   min:12000, 气:"c",
    说:"收支打平，还余了一点。一亩地头一年能不往里掏钱，这就算站住了。" },
  { 名:"上",   min:17500, 气:"b",
    说:"账是正的，还宽裕。这一亩地今年自己养活了自己，还余出钱来。在海淀，这件事已经不常听见了。" },
  { 名:"上上", min:22000, 气:"a",
    说:"一亩地挣出了镇上一个人小半年的工钱。京西稻到今天还能留在地里，靠的就是这个数。" },
];
const 评等级 = v => { let g = 季评[0]; 季评.forEach(x => { if (v >= x.min) g = x; }); return g; };

/* ── 这一季，你是个什么种法 ──
   用户报的原话：「没碰到过…多个结局」。病根在 季评 那五档**只看净收益** ——
   你走生态路还是化肥路、村里怎么看你、教没教田主儿子，
   钱一样就是同一个结局。所以钱那一档留着当"收成"，
   另起一句说你这一季是个**什么种法**：同一句"中"，生态路和化肥路读到的不是一段话。

   ⚠ 判据只用**这一季真的做过的事**（三产、二产占比、生态、抄了几条、认了几样），
     不用攒出来的数 —— 名望和印象已经归 人情账 和 后话 管了，再来一遍就是重账。
   ⚠ 从前往后第一个成立的就是它，所以**顺序即优先级**：越特异的越靠前。
     最后一条兜底的一定要有 —— 玩家不能在这儿看见一片空白。 */
function 种法(S, r) {
  const 生 = S.stats.ecology, 毛 = r.毛收入 || 1;
  const 二产占 = (r.二产 || 0) / 毛, 一产占 = (r.一产 || 0) / 毛, 三产占 = (r.三产 || 0) / 毛;
  const 抄 = Object.keys(S.说法 || {}).length, 认 = Object.keys(S.codex || {}).length;
  const 等外 = r.grade.名 === "等外";

  /* ⚠ 顺序按"判词有多具体"排，不按金额大小。
     第一版把 守田的 摆第一，24 季里它吞了 21 季 —— 跟原来"结局只有一种"
     是同一个病。具体的判断（抄书、下猛药）放前头，概括的（钱从哪来）放后头。 */
  if (抄 >= 6 && 等外)
    return { 名: "抄 书 的",
      说: `本子上抄了 ${抄} 条，图鉴认下 ${认} 样。可这一季的米卖的是「等外」的价。`
        + `抄下来的那些话，还没落到田里。` };
  if (生 <= 35)
    return { 名: "下 猛 药 的",
      说: `田里挑不出毛病来，因为没剩什么活物。生态 ${生}。`
        + `产量是好看的，这一季也确实是靠产量把钱挣回来的。` };
  /* ⚠ 三条产线**比一比谁占得多**，不是按写死的顺序一条条问下来。
     原来写的是"三产占 ≥30% 就判守田的"，排在 卖米的 前头 ——
     于是「二产 48% / 三产 34%」这种季，明明主要靠卖米，却判成守田的。
     实测 24 季（三种打法各 8 季）里这两条线的占比一直是咬着的，
     顺序一动判词就翻 —— 那说明顺序在这儿是有话语权的，不能随手排。
     比大小才是"这一季主要靠哪条线活着"的直话。
     ⚠ 门槛（.30/.45/.55）留着：占比最大但只有两三成，那不叫靠它活着，
       叫什么都干了一点 —— 让它掉到 种地的 那条兜底去，比硬安一个名头诚实。 */
  const 大 = Math.max(一产占, 二产占, 三产占);
  if (三产占 === 大 && 三产占 >= .3)
    return { 名: "守 田 的",
      说: `生态 ${生} 撑着，${r.三产说明}。这一季 ${Math.round(三产占 * 100)}% 的进项`
        + `不是从谷子上来的 —— 你是把这一亩当一块地养着，不是当一季庄稼收。` };
  if (二产占 === 大 && 二产占 >= .45)
    return { 名: "卖 米 的",
      说: `谷子进了碾房再出来，价就不是那个价了。这一季 ${Math.round(二产占 * 100)}% 的进项`
        + `是在米上挣的 —— 种得好不好，到最后是碾出来才认。` };
  if (一产占 === 大 && 一产占 >= .55)
    return { 名: "交 粮 的",
      说: `谷子过完磅就拉走了，省心。这一季 ${Math.round(一产占 * 100)}% 的进项是原粮，`
        + `也就是那个价：粮库收多少就是多少，不看你这一年费了多少心。` };
  if ((S.季 || 1) < 2)
    return { 名: "刚 开 张 的",
      说: `第一季。这块地上一回种的人不是你，它的脾气你还没摸出来。`
        + `一亩稻头一年种，这本账本来就难平。` };
  return { 名: "种 地 的",
    说: `没走哪条出奇的路。八个节气一步没落，该薅的薅了，该灌的灌了，`
      + `收上来的也就是这个数。一亩地一年本来就是这样。` };
}

/* ── 翻翻这几步 ──
   用户原话：「可以增加回看机制，看到上一步的情况摘要，方便决策。
   比如我玩着玩着就忘了今年是什么年景、或者刚才搭棚了或者别的什么。」

   刻意**不用 hud()**：hud() 会写 S.显数[k]（滚动数字的起点），
   在只读的一屏上写它，下一屏真渲染时那个数字就不滚了。
   这一屏是回看，不是游戏状态的一部分，不该有任何副作用。 */
function viewLog() {
  const 走 = S.选择 || [];
  /* 走到新的一段就插一行小标题，把行话和白话一起印出来。
     只在**换段**那一条前面插 —— 每条都插就成了刷屏，那不是记事了。
     （玩家读到"灌浆（抽了穗，米粒正往里长实）"，四个字就有了着落；
       不插的话，日志里只有"立秋/处暑/白露"，看不出它们是一回事。） */
  let 上段 = null;
  const 行 = 走.map((c, i) => {
    const 段 = c.阶段 && c.阶段 !== 上段 ? c.阶段 : null;
    if (c.阶段) 上段 = c.阶段;
    const dl = Object.keys(c.delta || {}).filter(k => c.delta[k])
      .map(k => `<span class="${c.delta[k] > 0 ? "p" : "m"}">${LABEL[k]} ${
        c.delta[k] > 0 ? "+" : ""}${c.delta[k]}${UNIT[k]}</span>`).join("　");
    const 花 = [];
    if (c.cost) 花.push(`${yuan(c.cost)} 元`);
    if (c.雇工费) 花.push(`雇工 ${yuan(c.雇工费)} 元`);
    花.push(`${c.体力前 - c.体力} 点体力`);
    return `${段 ? `<div class="ph">${esc(段带白(段))}</div>` : ""}<div class="it">
      <div class="hd"><b>${esc(c.term)}</b><s>${esc(c.title)}</s>
        <em>第 ${i + 1} 步${花.length ? "　·　" + 花.join("　") : ""}</em></div>
      <p class="tx">${esc(c.text)}</p>
      ${dl ? `<div class="dl">${dl}</div>` : ""}</div>`;
  }).join("");

  return `<div class="step">这 一 季 走 到 哪 儿 了</div>
    ${年景卡(S.年景)}
    ${走.length ? `<div class="lg">${行}</div>`
      : `<p style="color:var(--dim);font-size:15px">还没动手。第一手之前，田里什么都还没发生。</p>`}
    <div class="acc">
      账　已投入 <b>${yuan(S.cost)}</b> 元　·　手头现金 <b>${yuan(Math.round(S.现金))}</b> 元<br>
      力气　还剩 <b>${S.stamina}</b> 点　·　后面还有 <b>${Math.max(0, S.节气.length - S.termIndex - 1)}</b> 个节气<br>
      本子　抄了 <b>${Object.keys(S.说法 || {}).length}</b> 条说法${Object.keys(S.说法 || {}).length ? `　·　最近一条是「${esc(Object.keys(S.说法).pop())}」` : "　·　翻翻书就有了"}
    </div>
    <div class="spacer"></div>
    <button class="go sm ghost" onclick="openBook('田')">看 看 攒 下 的 东 西</button>
    <button class="go sm ghost" onclick="closeLog()">回 去</button>`;
}
/* ⚠ 图鉴原来只有封面那一个入口（openBook('封面')），玩到一半想看自己攒了什么，
   得先退回封面 —— 而"最该看攒了多少的时候"恰恰是开局和局中。
   openBook('田') 和 backToGame() 里那条"回 到 田 里"一直是通的，
   只是没人调它（书来源 那句 let 后面从来没被赋过 "田" 以外的值）。
   挂在日志屏下面：那一屏本来就是"回看"的地方，不用往 HUD 上加行。
   ⚠ 不往 年景条 里塞可点元素 —— 那一行整个挂着 onclick="openLog()"，
     而这个文件里没有一处用 stopPropagation，点它会连带把日志打开。 */

/* 回看从哪一屏翻开的，就回哪一屏 —— screen 是模块级变量，
   不记的话"回到田里"会把事件屏整个跳过去。 */
let 回看从哪儿来 = "decision";
window.openLog = function () { 回看从哪儿来 = screen; screen = "log"; render(); };
window.closeLog = function () { screen = 回看从哪儿来; render(); };

/* ── 今年最赚的一手、最坑的一手 ──
   "哪一步出了问题"这种话，游戏自己算得出来 —— 日志里每一步的因果都在，
   那就直接点名，别让玩家去悟。这一块也是全季唯一一次把因果链摊开讲。 */
function 关键两手(S) {
  const 分 = e => Object.keys(e.delta)
    .reduce((a, k) => a + (k === "harvest" ? e.delta[k] * 0.12 : e.delta[k] * 1.6), 0);
  const 有 = S.log.filter(e => e.from && e.from.length);
  if (有.length < 2) return null;
  const 排 = 有.slice().sort((a, b) => 分(a) - 分(b));
  const 坑 = 排[0], 赚 = 排[排.length - 1];
  const 因 = e => e.from.filter(x => x !== "＋").join("　→　");
  return { 坑: 分(坑) < -1.2 ? { 因: 因(坑), e: 坑 } : null,
           赚: 分(赚) > 1.2 ? { 因: 因(赚), e: 赚 } : null };
}

function viewYearEnd() {
  const r = result, 评 = 评等级(r.净收益), 两手 = 关键两手(S), 种 = 种法(S, r);

  /* 星芒 —— 颗数跟档位走，跟验米那一屏同一张表、同一组坐标。
     那一屏是"这一季种出了什么米"，这一屏是"这一季的账"，两件事同一个收成，
     该长成一个样。 */
  const 星数 = { a: 5, b: 3, c: 1, d: 0 }[评.气] || 0;
  const 星位 = [[22,26],[74,20],[48,14],[30,64],[68,58]];
  const 星 = 星位.slice(0, 星数)
    .map(([x,y],i) => `<span class="spark" style="left:${x}%;top:${y}%;animation-delay:${.45+i*.14}s"></span>`).join("");

  /* 收入构成 —— 一二三产不是三个词，是一条能看出来的比例。
     这条横条是整个结算里最该被看见的东西：钱是从哪条路上来的。 */
  /* ⚠ 二产那一条原来是**一笔**（v 取 r.二产 整个），标签却写死叫「二产 · 礼盒」。
     玩家一斤盒没装、全拉进城卖了，横条上照样写「二产 · 礼盒 100%」——
     用户原话：「我拉进城里卖米怎么…赚的还是礼盒的钱」。
     现在按 r.礼盒钱 / 直销钱 / 加工钱 三条画，各自一色。
     ⚠ 颜色得**看得出来是三样东西**：礼盒沿用原来的金，直销给个锈红
       （自己拉进城，一路的风尘），深加工给深褐（进了坛子）。
       三条都是 0 的时候（比如米全走原粮）它们自己就被 filter 掉。 */
  const 源 = [
    { 名:"一产 · 卖原粮",     v:r.一产,   色:"var(--green)" },
    { 名:"二产 · 礼盒",       v:r.礼盒钱, 色:"var(--gold)" },
    { 名:"二产 · 自己拉进城", v:r.直销钱, 色:"#9e5a35" },
    { 名:"二产 · 深加工",     v:r.加工钱, 色:"#5f5142" },
    { 名:"三产 · " + r.三产说明.split("，")[0], v:r.三产, 色:"var(--clay)" },
    { 名:"政策 · 粮补",       v:r.补贴,   色:"#a8a294" },
  ].filter(x => x.v > 0);
  const 总 = 源.reduce((a, x) => a + x.v, 0) || 1;
  const 条 = 源.map(x => `<span style="width:${(x.v/总*100).toFixed(1)}%;background:${x.色}"></span>`).join("");
  const 图例 = 源.map(x => `<div class="mix-li">
      <span class="dot" style="background:${x.色}"></span>
      <span class="nm">${esc(x.名)}</span>
      <span class="pc">${(x.v/总*100).toFixed(0)}%</span>
      <span class="amt">${yuan(x.v)}</span></div>`).join("");

  const li = (k, v) => `<div class="li"><span class="k">${k}</span><span class="v">${v}</span></div>`;

  /* ⚠ 底账这几行是**算出来的**，不是写死在模板里的。
     v5.9.7 之前底账只有"二产"一个总数，玩家把上面几行加起来对不上，
     还以为自己算错了。现在礼盒、直销、深加工各占一行，加起来正好是二产。 */

  /* 礼盒这一行原来是无条件印的（一斤没装也印「二产 · 礼盒 0 斤，0 元」）。
     底账该记的是**发生过的事**，不是"本来可以"。所以卡在"装得下"上：
     上限是 0（米不够、牌子不够、行情差）就整行不印；
     上限有而一斤没装，才印出来，并且明说本来装得下多少 ——
     那是原作者写「上限本来有 X 斤」时想说的话，别丢。 */
  const 礼盒行 = r.礼盒上限
    ? li("二产 · 礼盒 " + yuan(r.礼盒量) + " 斤"
        + (r.礼盒量 < r.礼盒上限 ? "（装得起这么多，上限本来有 " + yuan(r.礼盒上限) + " 斤）" : ""),
        yuan(r.礼盒钱) + " 元")
    : "";

  /* 成就 —— 按档位从高到低排，金牌先上场 */
  const 序 = { 金:0, 银:1, 铜:2 };
  const 牌 = newAch.slice().sort((a,b) => 序[a.级] - 序[b.级]);
  const ach = 牌.length ? `<h3 class="title" style="font-size:17px">这一季，你得了 ${牌.length} 块牌子</h3>
    ${牌.map((a,i) => `<div class="ach ${a.级}" style="animation-delay:${i*.07}s">
      <span class="d">${a.级}</span><div><b>${esc(a.名)}</b><span>${esc(a.说)}</span></div></div>`).join("")}`
    : `<h3 class="title" style="font-size:17px">这一季，没有牌子</h3>
       <p class="grade-note" style="margin-top:0">走了一条没人走过的路，下一季换个走法试试。</p>`;

  return `<div style="margin:0 0 16px">${节气条()}</div>
    <div class="step">年终 · 账本</div>
    <h2 class="term" style="font-size:30px">一季的账<small>一 亩 地</small></h2>

    <div class="yearend-wrap ${评.气}">${星}
      <div class="yr-name ${评.气}">${评.名}</div>
      <div class="yr-tag">这 一 季 的 收 成</div>
      <p class="praise">${esc(评.说)}</p>
    </div>

    <div class="sf-wrap">
      <div class="sf-tag">这 一 季 是 个 什 么 种 法</div>
      <div class="sf-name">${esc(种.名)}</div>
      <p class="sf-why">${esc(种.说)}</p>
    </div>

    <div class="netbig ${r.净收益 >= 0 ? "u" : "d"}">
      <span class="k">净 收 益</span>
      <b data-count="${r.净收益}">0</b><i>元</i>
      <span class="sub">毛收入 ${yuan(r.毛收入)} 元　－　本季投入 ${yuan(r.成本)} 元</span>
    </div>

    <h3 class="title" style="font-size:17px">钱是从哪条路上来的</h3>
    <div class="mixbar" data-wipe>${条}</div>
    <div class="mix">${图例}</div>

    ${两手 ? `<h3 class="title" style="font-size:17px">这一季的两个转折</h3>
      <div class="keymoves">
        ${两手.赚 ? `<div class="km u"><span class="tag">最赚的一手</span>
          <b>${esc(两手.赚.因)}</b><p>${esc(两手.赚.e.line)}</p></div>` : ""}
        ${两手.坑 ? `<div class="km d"><span class="tag">最亏的一手</span>
          <b>${esc(两手.坑.因)}</b><p>${esc(两手.坑.e.line)}</p></div>` : ""}
      </div>` : ""}

    <h3 class="title" style="font-size:17px">底账</h3>
    <div class="ledger">
      ${li("打下来的稻谷", yuan(S.grain) + " 斤")}
      ${li("验米等级", r.grade.名 + "（" + yuan(r.米价) + " 元/斤）")}
      ${li("今年的行情", r.行情.名 + (r.行情.原粮 !== 1
          ? "（原粮 " + (r.行情.原粮 > 1 ? "+" : "") + Math.round((r.行情.原粮 - 1) * 100) + "%）" : ""))}
      ${li("牌子 · 生态 " + S.stats.ecology + " 撑起来的量", Math.round(r.牌 * 100) + "%")}
      ${li("折成米", yuan(r.米) + " 斤" + (r.兑米 ? "（认养兑走 " + r.兑米 + " 斤）" : ""))}
      ${li("一产 · 卖原粮 " + yuan(r.已卖谷 + r.原粮量) + " 斤 @ " + r.谷价 + " 元"
          + (r.已卖谷 && r.原粮量 ? "（立冬卖掉 " + yuan(r.已卖谷) + " 斤）" : ""), yuan(r.一产) + " 元")}
      ${礼盒行}
      ${r.直销量 ? li("二产 · 自己拉进城 " + yuan(r.直销量) + " 斤 @" + yuan(r.直销单价) + " 元"
          + (r.直 && r.直 !== "敲门" ? "（" + (r.直 === "摆摊" ? "摆摊" : "跑饭馆") + "）" : ""),
          yuan(r.直销钱) + " 元") : ""}
      ${r.加工量 ? li("二产 · 深加工 " + yuan(r.加工量) + " 斤 @" + yuan(Math.round(r.加工钱 / r.加工量 * 100) / 100) + " 元",
          yuan(r.加工钱) + " 元") : ""}
      ${r.原粮量 ? li("没装盒也没加工的米", yuan(r.原粮量) + " 斤，走了原粮") : ""}
      ${r.包装费 ? li("礼盒包装", "-" + yuan(r.包装费) + " 元") : ""}
      ${r.加工费 ? li("深加工费", "-" + yuan(r.加工费) + " 元") : ""}
      ${li("收完粮之后，手里还剩", yuan(r.兜里剩) + " 元" + (r.兜里剩 < NUM.礼盒包装 * 20 ? "（不够再铺一摊了）" : ""))}
      ${li("三产 · " + r.三产说明, yuan(r.三产) + " 元")}
      ${r.额外 ? li("大寒 · " + S.大寒说明, (r.额外 > 0 ? "+" : "") + yuan(r.额外) + " 元") : ""}
    </div>
    ${ach}
    ${人情账(S, r)}
    ${回学校(S, r)}
    ${后话(S, r)}
    ${继承卡(S, r)}
    <div class="spacer"></div>
    <button class="go ghost" onclick="restart()">再 种 一 季</button>
    <p class="foot">换个走法，账就不是这个数</p>`;
}

/* ── 上一季留给这一季的 ──
   一局一局之间总得留下点什么 —— 这一块就是那个"什么"。
   认过的病下一季还认得（诊断时白送一条线索），图鉴和成就都攒着。
   没有这块，第二局跟第一局一模一样，玩家凭什么再种一季。 */
/* ── 人情账 ──
   结算屏上那一张。名望 + 三个人的印象，各带这一季的增量。
   ⚠ 判词按**累积**印象分档。印象是"他怎么看你"，一顿饭改不了，得攒 ——
     所以这里说的是这些天处下来的总账，不是这一季的流水。
     本季那一笔用括号跟在后面，两个数分开摆，不混。 */
const 印象档 = [
  [10, "他跟你交心了。"],
  [6,  "他拿你当自家人。"],
  [4,  "他认你这个后生。"],
  [2,  "见面能说上几句。"],
  [1,  "点头的交情。"],
  [0,  "还没打过几回交道。"],
  [-2, "他不大爱搭理你。"],
  [-5, "他见你绕着走。"],
  [-99, "他不想跟你说话。"]
];
const 印象判 = v => (印象档.find(x => v >= x[0]) || 印象档[印象档.length - 1])[1];
const 人名 = { 周: "老周", 陈: "老陈", 同: "同学A", 赵: "老赵", 师: "老师",
  主: "田主", 村: "村长", 农: "农资店", 乙: "同学B" };

function 人情账(S, r) {
  const 望 = r.望 || {};
  const 本 = 望.本季, 共 = 望.合计 !== undefined ? 望.合计 : (S.名望 || 0);
  const 三 = ["周", "陈", "同", "赵", "师", "主", "村", "农", "乙"].map(k => {
    const 累 = (S.印象 || {})[k] || 0, 季 = (S.本季印象 || {})[k] || 0;
    /* ⚠ 除数、标色线都得跟着 印象上下 走。上限从 12 抬到 24 之后，
       这两处还是旧的（/12、4 和 -2）—— 结果是人情条上一个人是灰的，
       季末人情账上同一个人是绿的，两条屏说不到一块去。
       标色线跟 人情条 用同一对：8 / -3。 */
    const 宽 = Math.min(100, Math.round(Math.abs(累) / (印象上下 || 24) * 100));
    return `<div class="pn2 ${累 >= 8 ? "u" : 累 <= -3 ? "d" : ""}">
        <b>${人名[k]}</b><i>${累 > 0 ? "+" : ""}${累}</i>
        <span>${esc(印象判(累))}</span>${季 ? `<u>本季 ${季 > 0 ? "+" : ""}${季}</u>` : ""}</div>
      <div class="pbar"><i style="width:${宽}%"></i></div>`;
  }).join("");
  return `<div class="kan"><span class="k">人 情 账</span>
    <div class="mz"><b>${Math.round(共)}</b><i>名望</i>
      <em>${本 ? `这一季 ${本 > 0 ? "+" : ""}${Math.round(本)}` : "这一季没动"}</em></div>
    <p>名望是这一带怎么看你。它不换钱，换的是人家肯不肯替你走一趟：
      托人捎个手续、赊一回账、荐个人进去干活、进镇上的门说话。
      攒到哪一档，哪几扇门才开 —— 点上面那个数，能看见现在开着的是哪几扇。
      另外认养和研学的价钱也跟着它走。</p>
    ${三}</div>`;
}

function 继承卡(S, r) {
  const 认得 = Object.keys(S.本季认得 || {});
  const 共 = Object.keys(CODEX).filter(k => S.codex[k]).length;
  const 总 = Object.keys(CODEX).length;
  const 认 = 认得.length
    ? `<b>认得 ${认得.length} 样：${认得.map(k => esc(k)).join("　")}</b>`
    : `<b>这一季没认出新东西，田里的毛病，这一季是绕着走的。</b>`;
  const 带 = 共
    ? `<p>下一季开局，认过的这些还带在身上，再碰上，白送你一条线索。${
        共 < 总 ? `图鉴 ${共} / ${总}，还差 ${总 - 共} 样。` : "图鉴满了。"}</p>`
    : `<p>田里的毛病，得自己蹲下去看才认得出来。认出来一次，往后就忘不掉。</p>`;
  /* 钱和熟练也写在这儿 —— 玩家在这一屏做的是"要不要再来一季"的决定，
     得让他看见"再来一季我不是从零开始"。
     ⚠ 结余在 r 上（result 的 兜里剩），不在 state 上，所以这张卡得接 r。 */
  const 留 = `<p>手上剩的 ${yuan(r.兜里剩)} 元，两成跟着进下一季，
    下一季开局本钱 ${yuan(NUM.本钱 + Math.min(Math.round(r.兜里剩 * NUM.带钱比例 / 10) * 10, NUM.带钱上限))} 元起。
    身体的底子也没白练，下一季多 ${Math.min((S.季 || 1) * NUM.熟练每季, NUM.熟练上限)} 点体力。</p>`;
  return `<div class="kan"><span class="k">这 一 季 你 留 下 了 什 么</span>${认}${带}${留}</div>`;
}

/* ── 从上一季带过来的 ──
   开局第二屏（看完年景）摆一张卡，把"这一季我手里多了什么"说清楚。
   继承这件事最怕的是玩家根本不知道它发生了 —— 卡不摆出来，
   那 +4 点体力和那 647 块钱就等于不存在。
   第 1 季不摆：什么都没有，摆一张空卡是废话。 */
function 带过来(S) {
  if ((S.季 || 1) < 2) return "";
  const 行 = [];
  if (S.底金 > 0)
    行.push(`<b>上季结余 ${yuan(档().存 || 0)} 元，带过来 ${yuan(S.底金)} 元</b>
      <p>上季剩下的钱，两成跟着你进这一季，已经算在开局本钱里了。
      这一季本钱 ${yuan(NUM.本钱 + S.底金)} 元。</p>`);
  if (S.熟练 > 0)
    行.push(`<b>第 ${S.季} 季了，手上的活儿比头一季熟，开局多 ${S.熟练} 点体力</b>
      <p>哪个节气该干什么，不用现琢磨了。省下来的是想事的工夫。</p>`);
  const 认得 = Object.keys(S.codex).length;
  if (认得)
    行.push(`<b>认得 ${认得} 样，还带在身上</b>
      <p>再碰上，白送你一条线索，只送一条，剩下的还得自己蹲下去看。</p>`);
  if (!行.length) return "";
  return `<div class="kan"><span class="k">从 上 一 季 带 过 来 的</span>${行.join("")}</div>`;
}

/* ── 回学校 ──
   你是农大派来实习的学生，一季种完得有个交代。
   带队老师看的是表，老周看的是别的 —— 这一局收在这里。 */
function 回学校(S, r) {
  const 级 = r.grade.名;
  /* 老师这一条按"你留下了什么"分岔，不按分数高低训人 ——
     第一季就下地八个节气，本来就没什么可训的。 */
  const 王 = 级 === "特级"
    ? { t: "「这块地能这么种。」带队老师把表推回来，\n「你把过程写下来，下次组会讲一次。」" }
    : 级 === "一级"
    ? { t: "「一级，可以了。」带队老师说，\n「我以为你们下去就是拍拍照，看来不是。」" }
    : r.净收益 >= 15000
    ? { t: "「账算得不错。」带队老师翻了两页，\n「可我更想知道，你那一亩地明年还能不能这么种。」" }
    : r.三产 > 0
    ? { t: "「你把米卖出去这一手，比米本身有意思。」带队老师说，\n「镇上的公司愁的就是这个。你接着说。」" }
    : { t: "「第一季，正常。」带队老师把表合上，\n「明年下去，把每天干了什么都记上，这个比最后那个数有用。」" };

  const 留 = S.stats.ecology >= 65 || r.三产 > 0;
  const 周 = 留
    ? { t: "老周蹲在田埂上，把最后一捆稻把子码齐。\n「这一亩地，明年还归你。」他说，\n「你要是还来。」" }
    : { t: "老周把锹往肩上一扛，走了两步，回头说：\n「头一年能收回一仓，不赖了。\n我头一年种的，还没你这个数。」" };

  return `<h3 class="title" style="font-size:17px">收完了，回学校</h3>
    <div class="say"><span class="who">带队老师 · 组会前</span><p style="white-space:pre-line">${esc(王.t)}</p></div>
    <div class="say"><span class="who">老周 · 田埂上</span><p style="white-space:pre-line">${esc(周.t)}</p></div>`;
}


/* ══════════════════════════ 9.5 彩蛋后续 ══════════════════════════ */
/* 转过年来才显形的那些事。
   每条读的都是**攒下来的账**：印象、名望、旗、认得、说法、查过。
   够线就开，不判好坏 —— 有的好（老周请你上他家），有的坏（没人再来收你的粮），
   大多数是中性但具体的（照片用了，说明写的不是你的名字）。

   重 = 稀有度。一次最多显 5 条，越难得的越靠前。
   ⚠ 别把 重 写成"好坏"：重 只回答"这条多难碰到"，不回答"这条好不好"。

   ⚠⚠ v5.9.5 把门槛整体拉低了。起因是用户报「我一直遇不到后续结局和彩蛋」，
      量出来的实情是：品质打法前 8 季，第 3、4 季**一条都没有**，6 季只见 3 条 ——
      因为 20 条里 17 条要的是跨季攒的量（印象≥10 要种 5 季、名望≥180 要十几季），
      可玩家不会种到第 40 季。攒的速度是实测的：名望约 +12/季、印象约 +2~4/季、
      说法约 +1~4/季、图鉴约 +1~2/季。新的线按"第几季够得着"定：
      印象 10→4、-6→-4；名望 260→60、180→45、110→40、70→20、45→15；
      说法 12→10；问周 12→6。
   ⚠ 重 也跟着重定了 —— 门槛一降，难易就变了，而排在最前头的必须是真最难那条。 */
const ECHO = [
  /* ══ 这一版（v5.9.8）把 20 条彩蛋全部重写了一遍 ══
     用户原话：「每次也只有一次选择，选完之后也没有后续和npc反应，没头没尾的」。
     实测（_彩蛋层.mjs）：改之前 20 条里 **16 条只有一次决定**，
     而且每条路的 pick 只写旗和印象，屏幕上什么都不发生，点完直接翻页。

     现在的形状，每一条都一样：
        第一屏  他说话 + 三条路
          ↓ 你挑一条
        第二屏  **他当场那一下**（续话）＋ 一个真问题（续）
          ↓ 你再挑一条
        第三屏  **他最后那一下**（后）
          ↓ 下一件
     所以每条路都有两个来回，两次决定，两次反应。

     ⚠ **为什么反应要拆成"续话"和"后"两个东西**（引擎里是两套机制）：
       续话 是开第二层的那一句，它后面**还跟着一个问题**，事情没完；
       后   是这一条路**走完了**的那一句，说完就翻页。
       体感上这是两件事：一个是"他接了你这句话"，一个是"他最后怎么看你"。
       混成一个的话，第二层的问题就会顶着一张"事情已经完了"的脸出来。
     ⚠ 续 那一层不写 pick —— 它只是"往下再问一层"，这一下不结账。
       结账在第二层真正选完的那一条上。这是引擎里 续 抢在 pick 前头返回的原因
       （见 onChain 那段注释），写内容的人必须知道，不然会以为 pick 丢了。
     ⚠ 三条路里**至少留一条能退回去**（回:true）的不用 —— 那是后段那条
       两层的路子要的（"买了设备"那种，第二层进来会盖掉第一层那格）。
       年话这边每一格都是独立事件，退回去没有意义，所以一概不给 回。
       给了的话，玩家会退到上一屏再点一次，等于白走一步。 */

  /* ── 老周这条线 ──
     他的印象从哪来：把水口的事当面问清楚（+3）、翻到书上的话说给他听（+3）、
     替他写材料（+4）、当着面问他那本本子怎么办（+4）、把本子一句句抄下来（+5）。
     往下掉则是：越过他去找公司（−4）、劝他把地签了（−4）、把他的牌子拔了扔沟里（−3）。 */
  { id:"周友", 重:50, 谁:"老周 · 家里", 题:"炕桌上那本本子", 当:S=>S.印象.周>=4,
    说:"他让你上家里坐。炕桌上摊着那本本子，封皮是牛皮纸的，用线缝过两回。\n「你随便翻。」他说，「翻坏了也没事，本来就是记给自己看的。」",
    问:{ options:[
      { text:"翻开看看，一页一页地翻",
        sub:() => "本子就摊在那儿。他不催你，也不解释",
        续题:"翻到第三本，纸都脆了",
        续简:"四十年，字越写越小。去年那一页上画着个歪歪的圈，旁边一个字没有。",
        续谁:"老周",
        续话:"他往椅背上靠了靠，没拦你。灯就在本子上头，他把灯罩往下压了压。",
        续:[
          { text:"问他：这个圈，圈的是什么",
            sub:() => "那一页上就一个圈。你翻来覆去看了三遍，没有别的字",
            pick:st => { st.flags["后-上炕"] = true; st.flags["后-问那个圈"] = true;
                         记象(st, { 周: 3 }); },
            后:"他把本子拉过去，指头在圈上按了一下。「那一片，没了。」\n说完就合上了。你后来才知道，那一年南边那几亩改成了苗圃。" },
          { text:"抄一段走，回去对着看",
            sub:() => "抄的是虫情那几页。你自己那本上还空着",
            pick:st => { st.flags["后-上炕"] = true; st.flags["后-抄虫情"] = true;
                         记象(st, { 周: 2 }); },
            后:"他看你抄，没说话，把台灯往你那边推了推。\n你抄到第四页，听见他在旁边说了一句：「抄了就得用。不用就别抄。」" },
          { text:"合上，不翻了",
            sub:() => "翻了一半。他也没问你翻着啥了",
            pick:st => { st.flags["后-上炕"] = true; 记象(st, { 周: 1 }); },
            后:"你把本子合上。他顺手收进柜子，跟没事人一样，转头去灶上添水。" },
        ]},
      { text:"问他一句，这本子为什么记了四十年",
        sub:st => (st.印象.周 || 0) >= 8
          ? "你跟他到这份上了，他肯讲"
          : `得处得够近他才肯讲（印象 ${st.印象.周 || 0} / 8）`,
        锁:st => (st.印象.周 || 0) < 8,
        续题:"他把手里的烟摁灭了",
        续简:"这个话头没人跟他接过。他自己也没主动提过。",
        续谁:"老周",
        续话:"他半天没说话。烟摁灭在缸沿上，摁了两下才灭。",
        续:[
          { text:"问他：这四十年，哪一年最难",
            sub:() => "他记了四十年，总有一年是不想记的",
            pick:st => { st.flags["后-上炕"] = true; st.flags["后-听四十年"] = true;
                         记象(st, { 周: 4 }); },
            后:"他说了个年份，很短。你在心里算了一下，那一年他三十出头。\n别的一个字没多说。你也没再问。" },
          { text:"问他：记这些，到底顶什么用",
            sub:() => "你问的是实话。这个问题你自己也想了两季",
            pick:st => { st.flags["后-上炕"] = true; st.flags["后-听四十年"] = true;
                         记象(st, { 周: 3 }); },
            后:"「顶不了什么。」他说，「就是记着。」\n他想了想又添一句：「哪年记岔了，第二年就对不上。对不上你就知道，自己记岔了。」" },
          { text:"不追问了，给他把茶续上",
            sub:() => "他不想说的时候，问也问不出来",
            pick:st => { st.flags["后-上炕"] = true; 记象(st, { 周: 3 }); },
            后:"他端起茶喝了一口，把话岔到今年雨水上去。\n你走的时候，那本本子还摊在炕桌上，他没收。" },
        ]},
      { text:"茶喝了半杯就走，别打扰他",
        sub:() => "坐了不到一刻钟，你起身告辞",
        续题:"他把你送到门口",
        续简:"他手扶在门框上，站住了。院里那条狗从墙根下抬了下头。",
        续谁:"老周",
        续话:"他送你到门口，没往外走，手扶在门框上。",
        续:[
          { text:"走到院门口，回头问一句今年种什么",
            sub:() => "他种了四十年，问你这一句不亏",
            pick:st => { 记象(st, { 周: 3 }); },
            后:"他想了想，说了个种法。很短，就一句话。\n你走出巷子才反应过来，他把两种种法的先后给你点了。" },
          { text:"走到院门口，跟他说本子的事改天再聊",
            sub:() => "今天不说，等于把话往后推了一年",
            pick:st => { 记象(st, { 周: 1 }); },
            后:"他嗯了一声，把门带上了。\n那本本子一直摊在炕桌上，你隔了一季才又见着它。" },
        ]},
    ]}},

  { id:"周传", 重:78, 谁:"老周 · 田埂上", 题:"往后这本子归谁记", 当:S=>S.flags["周-抄本子"]&&S.印象.周>=4,
    说:"本子你抄完了，厚厚一沓。他拿过来翻了两页，又推回给你。\n「往后这本子归你记。」他说，「我这岗年底就撤了，记了也没人看。」",
    问:{ options:[
      { text:"接过来，往后这本子我记",
        sub:() => "厚厚一沓，从今天起归你写。往下每一季田里的事，都得落进去",
        续题:"往后这本子记什么",
        续简:"接过来了就是接过来了。第一页写什么，往后就照什么记。",
        续谁:"老周",
        续话:"他把本子往你手里一塞，塞完就背过手去，不看你。",
        续:[
          { text:"接着他的记法，一天不落",
            sub:() => "他那本子是按日子记的：几月几号，水多深，虫什么样。笨，但四十年不断",
            pick:st => { st.flags["后-接本子"] = true; st.flags["后-照老记法"] = true;
                         记象(st, { 周: 5 }); },
            后:"他翻到你写的第一页看了看，点了点头，什么也没说。\n过了两天你才发现，他把那页折了个角。" },
          { text:"改成按节气记，一季八页",
            sub:() => "他的记法你用不惯。你自己那一套已经记了一年了",
            pick:st => { st.flags["后-接本子"] = true; 记象(st, { 周: 3 }); },
            后:"「随你。」他说，「记着就行。」\n他嘴上这么说，还是把那本按日子的旧本子留在了你这一摞底下。" },
          { text:"算了，还是您拿着吧",
            sub:() => "退回去，重新挑一个",
            回:true, pick:() => {} },
        ]},
      { text:"本子还是您拿着，我学着记",
        sub:() => "他笑了笑，把本子收回去，顺手从柜子里给你找了个空本子",
        续题:"一旧一新，两本怎么并行",
        续简:"他那本还在他手上，你这本是你自己的。同样一件事，往后有两份记录。",
        续谁:"老周",
        续话:"他从柜子里翻出个空本子，是新的，硬皮，比他那本还讲究。",
        续:[
          { text:"问他：那您这本，往后还给我看吗",
            sub:() => "两本并行，看不看他的，是你的事也是他的事",
            pick:st => { st.flags["后-跟着记"] = true; 记象(st, { 周: 4 }); },
            后:"「你来看就是。」他说，「不看也行。」\n后来每一季你都去翻一回。他那本的字，你慢慢全认得了。" },
          { text:"接过空本子，先说好怎么记",
            sub:() => "你按节气，他按日子。两份记录对起来才看得出哪年不一样",
            pick:st => { st.flags["后-跟着记"] = true; st.flags["后-两本并行"] = true;
                         记象(st, { 周: 3 }); },
            后:"他说行。想了一会儿又问：「按节气的话，一个节气你记几行？」\n你说了个数，他记下了。" },
        ]},
      { text:"这我可接不住",
        sub:() => "四十年的东西，你不敢接",
        续题:"他说了句什么",
        续简:"他没生气。这话他大概自己也想过了。",
        续谁:"老周",
        续话:"他嗯了一声，把本子收回去，动作不快也不慢。",
        续:[
          { text:"跟他把话说完：不是你不想接，是你怕记砸",
            sub:() => "他刚才没问，你也没说。不说清楚，这事就僵在这儿",
            pick:st => { 记象(st, { 周: 2 }); },
            后:"他听完，说：「我记岔过。第三年就岔过一回，后来对上了。」\n「记砸了不要紧，撂下才要紧。」他说完就走了。" },
          { text:"不提了，扭头说田里的事",
            sub:() => "话到此为止",
            pick:st => { 记象(st, { 周: -1 }); },
            后:"他顺着你的话说了下去，两个人都没再提本子。\n往后他照样教你，只是路过田埂时话少了几句。" },
        ]},
    ]}},

  { id:"周冷", 重:55, 谁:"老周", 题:"他绕到南边走了", 当:S=>S.印象.周<=-4,
    说:"他不再路过你这块田了。以前一天两趟，现在绕到南边那条路上走。\n你在地里碰见过他一回，他点了下头，没停脚。",
    问:{ options:[
      { text:"上他家去一趟，把话说开",
        sub:() => "他不开门你也得去。这一片往后还要不要处，就看这一趟",
        续题:"站在他家门口",
        续简:"门开着一条缝。院里没动静，你听见里头有人挪椅子。",
        续谁:"老周",
        续话:"他开了门，站在门里没让开。手还扶在门闩上。",
        续:[
          { text:"不进屋，就在门口把话说完",
            sub:() => "他站着，你也站着。这一片的事，说到底也不复杂",
            pick:st => { st.flags["后-登门"] = true; 记象(st, { 周: 4 }); },
            后:"他听完没说好也没说不好。\n过了两天，你在地头又看见他绕着走 —— 这回是从你田边上走的。" },
          { text:"先说软话，再进屋坐下",
            sub:() => "登门就是低一头。你不低，这趟就白跑了",
            pick:st => { st.flags["后-登门"] = true; st.flags["后-先低头周"] = true;
                         记象(st, { 周: 3 }); },
            后:"他让开了半步。茶是他自己沏的，倒了两杯，一杯推到你面前。\n那一季他都没再教你什么，但也不绕路了。" },
        ]},
      { text:"不吭声，低头种你的田",
        sub:() => "见了面点个头，别的什么也不说",
        续题:"地里的活照做，人不照处",
        续简:"他绕他的，你种你的。这一片就这么大，早晚还得碰上。",
        续谁:"老周",
        续话:"连着两季，你们就这么点着头过去了。",
        续:[
          { text:"第三季，主动问他一件事",
            sub:() => "不道歉，也不提旧账，就是问件事",
            pick:st => { st.flags["后-登门"] = true; 记象(st, { 周: 2 }); },
            后:"他答了。答得很短，答完就走了。\n但这回他停脚了 —— 前两季他是不停的。" },
          { text:"就这么下去",
            sub:() => "点头之交也不耽误种地",
            pick:st => { 记象(st, { 周: 1 }); },
            后:"这一片的事你还是照做，只是再没人提点你哪一步会岔。\n他绕到南边那条路上，一年一年地绕。" },
        ]},
      { text:"绕就绕，谁离不开谁",
        sub:() => "这一片少一个人教你，你照样种",
        续题:"话传到村里去了",
        续简:"田埂上没秘密。谁跟谁不说话，一个夏天就传遍。",
        续谁:"村长",
        续话:"村长在地头碰见你，问了一句你跟老周怎么回事。",
        续:[
          { text:"跟村长说清楚：不是不处，是各有各的种法",
            sub:() => "话由他说出去，比你自己解释管用",
            pick:st => { 记象(st, { 村: 2 }); },
            后:"村长听完笑了：「他那个人，你顺着他一句就完了。」\n这话你记着了，只是没用上。" },
          { text:"不解释，随他们怎么传",
            sub:() => "你的事不用跟谁交代",
            pick:st => { st.flags["后-结下"] = true; 记象(st, { 周: -2 }); 记象(st, { 村: -1 }); },
            后:"村里后来把你们俩的事说成了「农大那个不吃敬酒」。\n这一片是熟人社会，这话传得比你种的稻子还远。" },
        ]},
    ]}},

  { id:"周走", 重:80, 谁:"村口", 题:"立在埂上的那把锹", 当:S=>S.flags["地-劝签"],
    说:"老周的地还是签了。开春动工，他搬去城里跟儿子住。\n走之前把那把锹立在你这块田的田埂上，没留话。",
    问:{ options:[
      { text:"把锹收回去，搁在仓房里",
        sub:() => "他用了几十年的东西。立在埂上，一场雨就锈了",
        续题:"锹收进来了，搁哪儿",
        续简:"仓房里就那么大地方。东西一收进去，就跟收进去别的东西一样，容易忘。",
        续谁:"农资店",
        续话:"农资店的人看见你扛着锹进来，说：「老周那把？他昨天来买过一袋肥，没提这个。」",
        续:[
          { text:"问一句：他昨天买肥，是给自己田里用？",
            sub:() => "他地都签了，还买肥做什么",
            pick:st => { st.flags["后-收锹"] = true; st.flags["后-追一句"] = true;
                         记象(st, { 周: 2 }); },
            后:"「给他兄弟捎的。」农资店说，「他自己那点地，开春就平了。」\n你把锹靠在仓房最里头，锹把上那层包浆你一直没舍得擦。" },
          { text:"不问。把锹收好，付钱走人",
            sub:() => "他搬走了就是搬走了。问出来也不能怎样",
            pick:st => { st.flags["后-收锹"] = true; 记象(st, { 周: 2 }); },
            后:"你把锹靠在仓房最里头。那年秋天翻地，你用的就是它。\n锹口薄，比你自己那把好使。" },
        ]},
      { text:"立在原地，谁也不许动",
        sub:() => "他立在那儿的，你就让它立着",
        续题:"一把锹在埂上立着",
        续简:"路过的人都看得见。有人问你这是谁的，有人说该收起来。",
        续谁:"老赵",
        续话:"老赵从田埂上过，看了一眼那把锹，又看了你一眼。",
        续:[
          { text:"跟老赵说：他立在这儿的，我不动",
            sub:() => "这话得说明白，不然人家以为你懒得收",
            pick:st => { 记象(st, { 周: 2 }); 记象(st, { 赵: 1 }); },
            后:"老赵点了点头，没说什么，走了。\n第二天那把锹还在原地 —— 有人在锹把上系了根红绳。" },
          { text:"不解释。旁边立块小牌子，写上「老周的锹」",
            sub:() => "一块牌子，省得一个个解释",
            pick:st => { st.flags["后-收锹"] = true; st.flags["后-立小牌"] = true;
                         记象(st, { 周: 3 }); },
            后:"牌子立上以后，人人从那儿过都要看一眼。\n后来村里修路，那块牌子被人挪到了新砌的矮墙上。" },
        ]},
      { text:"去村里问一句，他那摊事往后归谁管",
        sub:() => "他那个岗年底撤了。这一片的水、虫、茬口，原来一直是他在记",
        续题:"村委办公室里",
        续简:"他那一摊本来也没个名目。人走了，事就悬着。",
        续谁:"村长",
        续话:"村长给你倒了杯水，说这个事他也在想。",
        续:[
          { text:"说你接：这片的水口、虫情，我来记",
            sub:() => "接下来容易。他的本子在你手上，可往后没人查你了",
            pick:st => { st.flags["后-接老周的岗"] = true; 记象(st, { 周: 3 }); 记象(st, { 村: 2 });
                         st.名望 = (st.名望 || 0) + 15; },
            后:"村长当场就点了头，说年底开会报一声。\n散了会你才想起来，他那个本子是四十年的——你那本才两年。" },
          { text:"先问清楚：这活儿有补助没有",
            sub:() => "问钱不丢人。白干活干不满三年",
            pick:st => { 记象(st, { 村: 1 }); },
            后:"村长说这个得往上申请，一时半会儿批不下来。\n你说了句「那先干着」，他应了。后来那笔钱一直没批下来。" },
        ]},
    ]}},

  /* ── 学校这条线 ──
     读的是 名望（跨季攒）+ 认得（图鉴）+ 说法（抄下来的那 31 句）。 */
  { id:"组会", 重:45, 谁:"组会 · 实验室", 题:"后半句没说完", 当:S=>S.名望>=20&&Object.keys(S.codex).length>=6,
    说:"轮到你讲。你把那一亩地的账投在屏幕上：八个节气，哪一步花了多少，秋天收回来多少。\n讲到「晒田压纹枯病」那段，坐后排的老师抬起头来问了一句：「这是你自己摸出来的？」",
    问:{ options:[
      { text:"是，蹲田里一条一条摸出来的",
        sub:() => "实话。代价是底下的人会接着往下追问细节",
        续题:"他把笔搁下了",
        续简:"这一句说出来，屋里就换了口气。有人把本子往前挪了挪。",
        续谁:"组会 · 实验室",
        续话:"他没说好也没说不好，只把笔搁在桌上，等你往下讲。",
        续:[
          { text:"把晒田那几天的时间点报清楚",
            sub:() => "哪一天开始晒、晒到田面什么样、哪一天回水。报得出来，就说明真蹲过",
            pick:st => { st.flags["后-照实答"] = true; 记象(st, { 师: 3 }); },
            后:"你报完，他在本子上写了一行。散会以后有人过来问你那一亩在哪个村。" },
          { text:"说：有几条我到现在也没弄明白",
            sub:() => "实话往下再走一步。承认没弄明白，比报得漂亮更让人信",
            pick:st => { st.flags["后-照实答"] = true; st.flags["后-说没弄明白"] = true;
                         记象(st, { 师: 4 }); st.名望 = (st.名望 || 0) + 10; },
            后:"他抬起头看了你两秒，说：「没弄明白的那几条，明年接着摸。」\n他这句话比刚才那一问还重。" },
        ]},
      { text:"一半是书上抄的，一半是田里看的",
        sub:() => "把本子摊开，哪条是抄的指哪条",
        续题:"本子摊开了，往下得指着说",
        续简:"抄的和看的都在这一本上头。指哪一条，往后那几个字就跟着你。",
        续谁:"组会 · 实验室",
        续话:"你把本子摊开。前排有人笑了一声，不大。",
        续:[
          { text:"指那几条最扎实的，说这是抄的",
            sub:() => "扎实的那几条多半书上都有。先说清楚，省得人家替你翻书",
            pick:st => { st.flags["后-照实答"] = true; 记象(st, { 师: 2 });
                         st.名望 = (st.名望 || 0) + 8; },
            后:"他点了点头：「抄不丢人，抄了不知道哪条对不上才丢人。」" },
          { text:"专挑书上没有的那几条说",
            sub:() => "这几条是你自己摸出来的，说出来就得担着",
            pick:st => { st.flags["后-照实答"] = true; st.flags["后-指书上没有的"] = true;
                         记象(st, { 师: 3 }); st.名望 = (st.名望 || 0) + 12; },
            后:"他说：「这几条你写成一条一条的，比讲一节课有用。」\n散会后你真去写了。写到一半发现有一条自己也说不圆。" },
        ]},
      { text:"含糊过去，说是查的文献",
        sub:() => "台下没人追问。这一关你过了",
        续题:"过了这一关，可你自己知道",
        续简:"你翻到下一页的时候停了一下。这一页的账，一行一行都是你自己记的。",
        续谁:"组会 · 实验室",
        续话:"你把这一页翻过去了。屋里没人再问。",
        续:[
          { text:"翻过去，接着往下讲",
            sub:() => "这一页翻过去了，后面还有七页",
            pick:st => { 记象(st, { 师: -2 }); },
            后:"讲完散会，没人过来跟你说话。\n你收电脑的时候，后排那位老师已经走了。" },
          { text:"讲到一半自己改口：这几条是田里看的",
            sub:() => "话说到一半改口，比一开始就说是田里看的更难",
            pick:st => { st.flags["后-照实答"] = true; 记象(st, { 师: 2 }); },
            后:"他抬起头看了你一眼，说：「接着讲。」\n就这两个字，可你后半段讲得比前半段稳。" },
        ]},
    ]}},

  { id:"论文", 重:100, 谁:"一年以后", 题:"这一篇署谁的名", 当:S=>S.名望>=45&&Object.keys(S.说法).length>=10&&Object.keys(S.codex).length>=9,
    说:"数据攒够了。老师让你把这一亩地的记录整理成一篇，投出去。\n审稿意见回来只有一条：样本量太小，但记录得比很多大样本细。\n「就按这个发。」老师说，「小有小的写法。」",
    问:{ options:[
      { text:"按他说的，就这样投出去",
        sub:() => "审稿人挑的那一条你也认。东西是真攒下来的",
        续题:"投出去之前，署名怎么写",
        续简:"一亩地的记录，写出来署谁的名。老师、田主、你自己，三方都在这上头。",
        续谁:"一年以后",
        续话:"他把稿子推回来，说改两处格式就能投。笔停在署名那一栏上，没往下写。",
        续:[
          { text:"照他说的写，就署两个人",
            sub:() => "挂名的事有挂名的规矩。他带你，这一篇本来就该这么署",

            后:"老师拿着笔想了想，说行，加在最后。\n老周那边你把样刊拿给他，他翻了两页，放在炕桌上没收起来。" },

      { text:"再攒一季数据，样本太少",
        sub:() => "他说小有小的写法，你还是想再等一年",
        续题:"这一年怎么攒",
        续简:"地还是这一亩，节气管不着你。等的是你自己。",

        续:[
          { text:"这一年按最严的记法记",
            sub:() => "去年有几笔是估的。今年一笔一笔称",

                         记象(st, { 师: 3 }); st.名望 = (st.名望 || 0) + 10; },
            后:"这一年你比去年累。但年终对账的时候，八个节气的数全对得上，一笔不差。" },
          { text:"边攒边把稿子改着",

            pick:st => { st.flags["后-再攒"] = true; 记象(st, { 师: 1 }); },
            后:"稿子改到第七遍，你自己都看不出哪儿不一样了。\n老师看了一眼说：「放着吧。等数据来了再改，改得动。」" },
        ]},
      { text:"先不写，这一亩我自己还没种明白",
        sub:() => "手上就一亩地，写出来的东西你自己都不信",
        续题:"他愣了一下",
        续简:"这不是推辞的话。他带了这些年，推辞的话他听得出来。",
        续谁:"一年以后",
        续话:"他把烟盒放回兜里，问了一句：「哪几条没种明白？」",
        续:[
          { text:"把没种明白的那几条说给他听",
            sub:() => "你自己列过一遍。说得出，就说明不是客气",
            pick:st => { st.flags["后-说没种明白"] = true; 记象(st, { 师: 3 });
                         st.名望 = (st.名望 || 0) + 8; },
            后:"他听完说：「这几条我给你问问人。」\n后来他真给你问回来两条，一条对得上，一条对不上。" },
          { text:"说不上来，就说还想再种一年",
