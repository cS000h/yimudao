/* ══════════════════════════ 4. 二三产 ══════════════════════════ */
/* ══════════════════════ 后半段：收了之后 ══════════════════════
   v4.4 之前这里是一根死管子 —— 永远四步、永远那几个选项、没有人说话。
   现在按前半段的规矩重做：
   ① 三步必走（收粮 / 碾米 / 卖米），后两步从池子里抽；
   ② 有行情 —— 立冬揭晓，跟年景一样是抽卡，有稀有度；
   ③ 有人说话 —— 老陈、米厂的老赵、来认养的人、老周；
   ④ 选项跟着局面走 —— 生态不够就没有认养，手头没钱就上不了设备。
   ────────────────────────────────────────────────────────── */

/* 老陈 —— 收粮的。四十来岁，跑这一带十几年了。
   他不是坏人，可他也不是来做慈善的。 */
const 行情卡 = (y, 已发) => `<div class="yc ${y.级 || "R"} ${y.色 === "d" ? "xiong" : ""}">
  <span class="tier">${y.签 || ""}</span>
  <span class="k">今 年 的 行 情</span>
  <b class="${y.色}">${y.名}</b>
  <p>${esc(y.说)}</p>
  <p style="color:#a8b8a2">${esc(y.报)}</p></div>`;

function 建后段(S) {
  const 现金 = S.现金, 生态 = S.stats.ecology, 牌 = 牌子(生态);
  /* ⚠ cap 必须是**函数**，不能在建屏时算成死数。
     自碾加成（1.5）要等小雪那屏（碾米）才定得下来，而 建后段() 比它早 ——
     于是买了设备的人，大雪那屏上印的还是没乘 1.5 的那个数，
     到手却多出一半。印的数和你真拿到的对不上，比少印一半更伤。
     （_量.py 那一批里"礼盒量 min 52 / max 310"就是这么来的。） */
  const 现碾 = () => S.自碾 ? NUM.自碾礼盒加成 : 1;
  const capOf = (盒名) => {
    const 盒 = 盒款[盒名] || 盒款.成品;
    return Math.round(miban.grade.礼盒 * 牌 * S.行情.礼盒 * 现碾() * 盒.量);
  };
  const 步 = [];

  /* ── 一 · 立冬：收粮的来了 ── */
  步.push({ id:"收粮", term:"立冬", who:"老陈", title:"收粮的来了",
    brief: `老陈的卡车停在田埂上，车斗里放着台磅秤。他按等级给价，现金当场结。今年他这个价，比去年${S.行情.原粮 > 1 ? "高" : S.行情.原粮 < 1 ? "低" : "一样"}。`,
    /* ⚠ say 现在是个函数，不是算好的字符串 —— 因为磨完价之后
       老陈说的那句话得换掉。后段渲染走的是 取值(c.say)，本来就认函数。 */
    say: () => S.磨过话 ? S.磨过话
      : S.行情.原粮 < 1
      ? "「不是我要压你。」老陈把烟掐了，「粮库那边满了，我收回去也是压手里。」\n他踢了踢磅秤，「你卖，我就这个价；你不卖，我也不劝。」"
      : S.行情.原粮 > 1
      ? "「今年这个价，你猜不着吧。」老陈笑得挺高兴，「南边减产，收粮的都往北边跑。」\n他拍了拍秤，「趁这会儿，卖不卖？」"
      : "「还是去年的价。」老陈把秤摆正，「我这儿不兴讨价还价，你也别跟我磨。」",
    options: [
      { text: "卖一半，先把本钱收回来",
        sub: st => `${yuan(Math.round(st.grain*0.5))} 斤当场结 ${yuan(Math.round(st.grain*0.5*谷价(S)))} 元现钱，手头就有 ${yuan(Math.round(st.现金 + st.grain*0.5*谷价(S)))} 元，代价是往后装盒、认养，都只有一半米`,
        pick: st => { st.soldGrain = Math.round(st.grain * 0.5); st.现金 += Math.round(st.soldGrain * 谷价(S)); } },
      { text: "一粒不卖，全留着自己做",
        sub: st => `米全在你手上，往后能装盒、能认养，但后头的设备、包装、加工费，都从这 ${yuan(Math.round(st.现金))} 元里出`,
        pick: st => { st.soldGrain = 0; } },
      /* ── 第三条：不占步数的一次讨价 ──
         用户原话：「凭什么一直只能礼盒和酒厂，选项太少且太死」。
         这一条就是给立冬那屏松绑的：磨完价 回: true，退回这一屏，
         你看着"卖一半"底下那个数变了，再决定卖不卖。
         四个说法各开一扇门：交情、米质、名望、台阶。
         ⚠ 磨过之后这一条就锁上了 —— 不然可以无限磨，价能磨到天上去。 */
      { text: "先别急着卖，跟他磨两句",
        续题: "跟他磨两句",
        续简: "价还没定死。你有几句话可以说 —— 说哪句，他就怎么记你。",
        续谁: "老陈",
        sub: st => st.磨过
          ? `已经磨到 ${yuan(谷价(S))} 元一斤谷。再磨，他今天就不痛快了`
          : `现在是一斤谷 ${yuan(谷价(S))} 元。磨好了多几个点，磨不好他记你一笔`,
        锁: st => st.磨过,
        续: [
          { text: "「隔壁村收得比你这高」",
            sub: st => (st.印象.陈 || 0) >= 2
              ? "他跟你熟，这话唬得住 · 一斤多 8%，可他记你一笔"
              : `得有点交情才唬得住。你跟老陈还没到那份上（印象 ${st.印象.陈 || 0} / 2）`,
            锁: st => (st.印象.陈 || 0) < 2,
            回: true,
            pick: st => { st.谷价补 = (st.谷价补 || 1) * 1.08; st.磨过 = true;
              st.磨过话 = "老陈把烟点上，看了你一会儿。\n「你打听了。」他没争，也没笑，把价往上挪了一截。\n挪完他说：「就这一回。」";
              记象(st, { 陈: -1 }); } },
          { text: "「今年稻子干，出米率高」",
            sub: () => miban.grade.价 >= 15
              ? "你的米在那儿摆着，他挑不出话 · 一斤多 6%"
              : "得是你这一季的米真说得上话才管用（要到一级往上）",
            锁: () => miban.grade.价 < 15,
            回: true,
            pick: st => { st.谷价补 = (st.谷价补 || 1) * 1.06; st.磨过 = true;
              st.磨过话 = "老陈抓了一把，搁嘴里咬了咬，又摊在手心里看了看。\n「……是干。」他说。价往上走了一点。\n他自己也笑：「今年这一片，就你这块田的谷我咬得动。」";
              记象(st, { 陈: 1 }); } },
          { text: "「粮站那边我认得人」",
            sub: st => (st.名望 || 0) >= 90
              ? "名头就是这时候用的 · 一斤多 12%，可这一手他记住了"
              : `这话得有底才说得出口（名望 ${Math.round(st.名望 || 0)} / 90）`,
            锁: st => (st.名望 || 0) < 90,
            回: true,
            pick: st => { st.谷价补 = (st.谷价补 || 1) * 1.12; st.磨过 = true;
              st.磨过话 = "你把话说到这儿，老陈没接。\n他把秤擦了擦，把价改到了你说的那个数上。\n装完车他才开口：「你认得人，我认得路。往后各走各的。」";
              记象(st, { 陈: -2 }); } },
          { text: "「今年都不容易，你看着给」",
            sub: () => "不唬他，也不求他 · 一斤多 3%，这话他爱听",
            回: true,
            pick: st => { st.谷价补 = (st.谷价补 || 1) * 1.03; st.磨过 = true;
              st.磨过话 = "老陈叹了口长气。\n「是不容易。」他把价往上挪了一点点，挪得不多。\n「我上头也压着我。你这一句，比他们会说。」";
              记象(st, { 陈: 2 }); } },
        ]},
    ]});

  /* ── 二 · 小雪：怎么碾 ── */
  /* ⚠ 这个不能在建屏的时候就定死。
     建后段() 在"收粮"那一屏**之前**跑，而"卖一半先把本钱收回来"就在那一屏上。
     先算再卖，等于这笔钱白卖：你为了买设备把谷子卖了一半，设备那一格还是锁着的 ——
     "先把本钱收回来"的后半截（收回来干什么）根本没接上。实测 300 季，
     "卖一半"只赢过 8 次（2.7%），基本是条死选项。
     连老赵的台词都是错的：钱到手了，他还在看你"空着的手"。
     所以锁和台词都改成**当场读 live 现金**。 */
  const 买得起 = () => S.现金 >= NUM.自碾设备费;

  /* ── 老赵那台机器今年的成色 ──
     用户原话：「磨米的概率永远是那两个数值，太单调了」。
     对：原来不管哪一季、哪一年，代碾就是 58%、自碾就是 66%，两个死数。
     真实的代碾出米率年年都不一样 —— 机器新旧、筛网换没换、今年稻子干不干，
     全在里面。所以给它一个 0.94~1.06 的成色，**当场印在按钮上**。
     ⚠ 存在 S 上而不是每次现抽：建后段() 可能被重跑（刷新页面回来），
       重抽一次，玩家已经看见的那个数就变了。 */
  if (!S.机况) S.机况 = NUM.机况下限 + Math.random() * NUM.机况幅度;
  const 代碾率 = Math.round(NUM.出米率_代碾 * S.机况 * 100) / 100;
  const 轻率 = Math.round((代碾率 + 0.04) * 100) / 100;
  const 重率 = Math.round(Math.max(0.45, 代碾率 - 0.03) * 100) / 100;
  /* 一份谷能碾出多少斤米 —— 三个说法各算各的。
     ⚠ 分成两个函数：**算的数**和**印的字**。
     原来只有一个 出米()，它返回的是 yuan() 出来的字符串（带千分位逗号）。
     而下面"碾轻点""碾重点"两条要拿它相减：
         "1,984" - "2,046"  →  NaN
     于是按钮上印着「比正常的少 NaN 斤」。谷子一千斤以下时逗号不出现，
     相减反而正常 —— 所以这个 bug 只在**收成好的那一年**露头，
     玩坏年景的人一辈子遇不上。 */
  const 出米数 = (st, r) => Math.round(st.grain * (1 - (st.soldGrain || 0) / st.grain) * r);
  const 出米 = (st, r) => yuan(出米数(st, r));

  步.push({ id:"碾米", term:"小雪", who:"米厂的老赵", title:"怎么碾",
    brief: "稻谷要变成米，才谈得上价钱。代碾省事，可出米率是人家说了算 —— 碾轻碾重，是两笔账。",
    say: () => 买得起()
      ? `老赵叼着烟在机器边上转。\n「送过来我给你碾，出米率看机器，今年差不多 ${Math.round(代碾率*100)}%。」\n他瞟了一眼你手上的钱，又说：「你要自己买机器也行，一千二。你自己算。」`
      : `老赵叼着烟在机器边上转。\n「送过来我给你碾，今年这台机器差不多 ${Math.round(代碾率*100)}%。」\n「想自己买机器？一千二。」他看了一眼你空着的手，「……你还是送过来吧。」`,
    options: [
      { text: "送米厂代碾",
        sub: st => `出米率 ${Math.round(代碾率*100)}%，出 ${出米(st, 代碾率)} 斤米，一分钱不用掏`,
        pick: st => { st.rate = 代碾率; if (!st.赵来过) { st.赵来过 = true; 记象(st, { 赵: 1 }); } } },
      { text: "让他碾轻点，留胚芽",
        sub: st => `出米率 ${Math.round(轻率*100)}%，出 ${出米(st, 轻率)} 斤米，比正常的${出米数(st, 轻率) - 出米数(st, 代碾率) >= 0 ? "多" : "少"} ${yuan(Math.abs(出米数(st, 轻率) - 出米数(st, 代碾率)))} 斤；可米发黄，卖相粗，一斤米按 ${Math.round(NUM.胚芽折*100)} 折算`,
        pick: st => { st.rate = 轻率; st.米价补 = NUM.胚芽折; if (!st.赵来过) { st.赵来过 = true; 记象(st, { 赵: 1 }); } } },
      { text: "让他碾重点，出雪白的",
        sub: st => `出米率 ${Math.round(重率*100)}%，出 ${出米(st, 重率)} 斤米，比正常的少 ${yuan(Math.abs(出米数(st, 重率) - 出米数(st, 代碾率)))} 斤；可送礼的看这个，一斤米按 ${Math.round(NUM.精白加*100)} 折算`,
        pick: st => { st.rate = 重率; st.米价补 = NUM.精白加; if (!st.赵来过) { st.赵来过 = true; 记象(st, { 赵: 1 }); } } },
      { text: "自己上套小设备",
        sub: st => 买得起()
          ? `出米率 ${Math.round(NUM.出米率_自碾*100)}%，多出 ${yuan(出米数(st, NUM.出米率_自碾) - 出米数(st, 代碾率))} 斤米；礼盒还能多吃下 ${Math.round((NUM.自碾礼盒加成-1)*100)}%，因为"地头现碾鲜米"这六个字，只有自己碾才写得上去。先掏 ${yuan(NUM.自碾设备费)} 元，掏完剩 ${yuan(Math.round(st.现金 - NUM.自碾设备费))} 元做包装`
          : `要 ${yuan(NUM.自碾设备费)} 元，你手头只有 ${yuan(st.现金)}，买不起`,
        锁: st => !(st.现金 >= NUM.自碾设备费),
        pick: st => { st.rate = NUM.出米率_自碾; st.自碾 = true; st.cost += NUM.自碾设备费; st.现金 -= NUM.自碾设备费;
          /* 自己买了设备，等于把老赵的生意绕过去了 —— 他嘴上不说，心里记着 */
          if (!st.赵来过) { st.赵来过 = true; 记象(st, { 赵: -2 }); } } },
    ]});

  /* ── 大雪的第二层：盒子怎么做 / 跟酒厂怎么谈 ──
     ⚠ 两个都写成**函数**，每次点开现造一份新的 —— 后段的 options 是会被
       换掉的（onChain 里 c.options = o.续），共用一份数组迟早串味。
     ⚠ 每条路都让一头，没有一条是纯赚的。见 盒款 上头那段。

     ⚠ 退出这条路得留：第二层是"多说两句"，不是"必须选一个"。
       所以每一层末尾都挂着一条 回 —— 想回去重挑个走法，随时回得去。 */
  const 盒层 = (终) => [
    /* ⚠ 头一条是"照旧的来"。见 _二层.py 上头那段 ——
       "多说两句"的层，头一条得是"懒得想，按老规矩"，
       不然它就从多一个选择变成了多一道关卡。 */
    { text: "就用镇上现成的礼盒，照旧",
      sub: st => `包装 ${NUM.礼盒包装} 元一斤，市场能吃下 ${capOf("成品")} 斤 —— 跟往年一样`,
      设: st => { st.盒 = "成品"; }, ...终 },
    { text: "去镇上开个版，盒子上印自己的名字",
      sub: st => {
        const c0 = capOf("成品"), c1 = capOf("开版");
        return `开版一次 ${yuan(NUM.盒开版费)}，市场能吃下的从 ${c0} 斤到 ${c1} 斤；` +
          `折到每斤上是 ${(NUM.盒开版费 / Math.max(1, c1)).toFixed(1)} 元 —— 装得越多，这笔摊得越薄`;
      },
      设: st => { st.盒 = "开版"; }, ...终 },
    { text: "拿现成的通用盒，贴个标",
      sub: st => `包装 ${NUM.礼盒包装} → ${NUM.盒通用价} 元一斤，可市场能吃下的从 ${capOf("成品")} 斤掉到 ${capOf("通用")} 斤`,
      设: st => { st.盒 = "通用"; }, ...终 },
    { text: "牛皮纸袋，手写的签",
      sub: st => `包装只要 ${NUM.盒纸袋价} 元一斤，可人家不当礼送 —— 一斤的价从 ${yuan(Math.round(miban.grade.价 * NUM.礼盒溢价))} 掉到 ${yuan(Math.round(miban.grade.价 * NUM.盒纸袋溢))}，能吃下的也只剩 ${capOf("纸袋")} 斤`,
      设: st => { st.盒 = "纸袋"; }, ...终 },
    { text: "算了，我再想想",
      sub: () => "退回去，重新挑一个走法", 回: true, pick: () => {} },
  ];

  const 酒层 = (终) => [
    { text: "照老规矩，一手交米一手交钱",
      sub: st => `${NUM.深加工价} 元一斤收，一斤先垫 ${NUM.深加工费} 元；手头 ${yuan(Math.round(st.现金))} 元，能铺多少铺多少`,
      设: st => { st.酒 = "现结"; }, ...终 },
    { text: "跟他说，加工费先欠着",
      sub: st => `不占你的现金，有多少米他碾多少；可一斤少挣 ${NUM.酒赊贴} 元（${NUM.深加工价} → ${NUM.深加工价 - NUM.酒赊贴}），算是他垫这笔钱的利`,
      设: st => { st.酒 = "赊账"; }, ...终 },
    { text: "让他把「京西稻」三个字印酒瓶上",
      sub: st => (st.名望 || 0) >= 望线.说定.线
        ? `一斤米 ${NUM.深加工价} → ${NUM.酒名望价}，少挣 ${NUM.深加工价 - NUM.酒名望价} 元；换名望 +${NUM.酒名望得}。酒卖到哪儿，你这三个字跟到哪儿`
        : `得有分量才谈得下来 —— 酒厂要的是这三个字往外走，你现在还撑不起（名望 ${Math.round(st.名望 || 0)} / ${望线.说定.线}）`,
      锁: st => (st.名望 || 0) < 望线.说定.线,
      设: st => { st.酒 = "名头"; }, ...终 },
    { text: "算了，我再想想",
      sub: () => "退回去，重新挑一个走法", 回: true, pick: () => {} },
  ];

  /* ── 直销的第二层：进了城，这米怎么出手 ──
     用户原话：「我拉进城里卖米怎么没有后续事件，赚的还是礼盒的钱」。
     四条路里只有这一条一直是**一层**的，点一下就定死，补上第二层。

     ⚠ 这一层不能做成"量 vs 价"，代数上不成立：没走掉的米按原粮价
       （0.70）卖给粮库，直销是 2.4 —— 差 3.4 倍。任何"少走点、卖贵点"
       的选项要追平，价得乘到 2.06 以上，那就不叫取舍，叫没有选择。
       所以张力放在**钱 vs 名望**：
         摆摊  走得动（×1.3）但一斤贱（×0.85），还掉名望 —— 名望刚够门的人靠它吃饭
         跑馆  走不动（×0.8）但一斤贵（×1.2），换名望 —— 名望厚的人靠它换名字
       ⚠ 头一条仍然得是"照旧的来"（见 盒层 上头那段）。 */
  const 直销价 = (乘) => miban.grade.价 * (S.米价补 || 1) * NUM.直销溢价 * 乘;
  const 直层 = (终) => [
    { text: "照旧，一家一家敲门",
      sub: st => `一斤 ${yuan(Math.round(直销价(1) * 100) / 100)} 元，名望多少就走多少。不额外搭什么，人家也不多记你一笔`,
      设: st => { st.直 = "敲门"; }, ...终 },
    { text: "在小区门口摆一天摊",
      sub: st => `一斤掉到 ${yuan(Math.round(直销价(NUM.直销摊价) * 100) / 100)} 元，可走得多 ${Math.round((NUM.直销摊乘 - 1) * 100)}%`
        + `。买你米的人记不住你的名字，名望 ${NUM.直销摊望}`,
      设: st => { st.直 = "摆摊"; }, ...终 },
    { text: "先跑饭馆和单位食堂",
      sub: st => `一斤 ${yuan(Math.round(直销价(NUM.直销馆价) * 100) / 100)} 元，可走少 ${Math.round((1 - NUM.直销馆乘) * 100)}%`
        + `。他们认牌子，往后还来 —— 名望 +${NUM.直销馆望}`,
      设: st => { st.直 = "跑馆"; }, ...终 },
    { text: "算了，我再想想",
      sub: () => "退回去，重新挑一个走法", 回: true, pick: () => {} },
  ];

  /* ── 三 · 大雪：这米卖给谁 ──
     三条路各自赢在一种局面上：米少 → 礼盒；米多 → 混合；等级差 → 加工。
     牌子和行情决定礼盒能吃下多少。 */
  /* ⚠ who 是**印在那段引文上头的说话人**（见 say 那行渲染）。
     这一屏底下引的是老陈的原话，标签却一直挂着"你自己" ——
     玩家读到的是「你自己 / 老陈给你算了笔账：…」，说话的人成了你。 */
  步.push({ id:"卖米", term:"大雪", who:"老陈", title:"这米卖给谁",
    brief: "米碾出来了。包装和加工都得先掏现钱，你手上就那么多。",
    say: capOf() > 0
      ? () => `老陈给你算了笔账：「礼盒一斤能顶好几斤散米，可你一斤得先垫 ${NUM.礼盒包装} 块包装钱。」\n「就那么大个市场，你做出三百斤盒子，人家最多要你 ${capOf()} 斤。剩下的你想怎么办？」\n「送米酒厂也行，人家一斤收 ${NUM.深加工费} 块加工费，也是先掏。」`
      : `老陈把话说明白了：「你这个等级，礼盒装不出来，人家送礼不送这个。」\n「送米酒厂吧，一斤 ${NUM.深加工费} 块加工费，先掏。好米这么走是亏的，你这米倒是合适。」`,
    options: [
      { text: "全做品牌礼盒",
        sub: st => capOf() > 0
          ? `封顶 ${capOf()} 斤，这批就压上 ${yuan(capOf() * NUM.礼盒包装)} 元包装钱，装不下的按原粮价卖给粮库`
          : "你的等级装不出礼盒",
        锁: () => capOf() <= 0,
        续: 盒层({ pick: st => { st.channel = "礼盒"; } }),
        续题: "盒子怎么做",
        续简: "礼盒是给人送的东西。装成什么样，人家就怎么看你这一亩。" },
      { text: "礼盒装满，剩下的送米酒厂",
        sub: st => capOf() > 0
          ? `包装 ${yuan(capOf() * NUM.礼盒包装)} 元 + 加工费，你手头 ${yuan(Math.round(st.现金))} 元，够铺多少铺多少`
          : `先垫 ${NUM.深加工费} 元一斤，手头 ${yuan(Math.round(st.现金))} 元能铺多少铺多少`,
        续: 盒层({ 续: 酒层({ pick: st => { st.channel = "混合"; } }) }),
        续题: "盒子怎么做",
        续简: "礼盒这一头先定下来，剩下的米再谈酒厂。" },
      { text: "一斤不包装，全送米酒厂",
        sub: st => `${NUM.深加工价} 元一斤收，先垫 ${NUM.深加工费} 元，省下包装钱，但好米这么走是亏的`,
        续: 酒层({ pick: st => { st.channel = "深加工"; } }),
        续题: "跟酒厂怎么谈",
        续简: "米拉过去，条款是你跟他一条一条谈出来的。" },
      /* ── 第四条：自己拉进城 ──
        用户原话：「凭什么一直只能礼盒和酒厂，选项太少且太死」。
         礼盒要你先垫 12 元一斤的包装钱，这一条**一分钱不垫**；
         代价是人家凭什么开门 —— 凭"京西稻"这三个字，凭你这一亩的名头。
         所以它挂在名望 90 那扇门（望线.招牌）上。能走多少斤也由名望定，
         见 年终 里那段。 */
      { text: "自己拉进城，一家一家问",
        sub: st => (st.名望 || 0) < 望线.招牌.线
          ? `人家肯开门，是因为听过你这一亩的名字。你现在还敲不开（名望 ${Math.round(st.名望 || 0)} / ${望线.招牌.线}）`
          : `一斤按 ${yuan(Math.round(直销价(1) * 100) / 100)} 元走，一分钱包盒钱不用垫，能走多少看你名望。剩下的按原粮价卖给粮库`,
        锁: st => (st.名望 || 0) < 望线.招牌.线,
        续: 直层({ pick: st => { st.channel = "直销"; } }),
        续题: "进了城，这米怎么出手",
        续简: "敲门、摆摊、跑馆，三条路三种走法 —— 一斤的价和往后人家记不记得你，是两回事。" },
    ]});

  /* ── 四 · 小寒：从池子里抽一件 ──
     这一格是后半段真正"随机"的地方 —— 今年来的是谁，看你这一季种成什么样。 */
  const 小寒池 = [
    { 需: 生态 >= NUM.三产门槛, 重: 3, step: {
      id:"认养", term:"小寒", who:"来看田的人", title:"田闲下来了",
      brief: "稻子收了，田空着。有人从城里来看，说这块田能不能认一份。",
      say: "来的是个三十多岁的女的，带着孩子。她在田埂上站了一会儿，说：\n「我们家孩子没见过稻子长什么样。」\n「一年一千五，秋天来割，给我们二十斤米，行不行？」",
      options: [
        { text: "做稻田认养，让城里人认一份",
          sub: () => `${NUM.认养单价} 元一份，兑 ${NUM.认养兑米} 斤米。这条路上庄还没人走`,
          pick: st => { st.third = "认养"; } },
        { text: "算了，田歇着吧", sub: () => "不折腾，也不挣这份钱", pick: st => { st.third = "无"; } },
      ]}},
    { 需: 生态 >= NUM.三产门槛 - 12, 重: 3, step: {
      id:"研学", term:"小寒", who:"小学的老师", title:"学校要来",
      brief: "一个小学老师打电话来，说想带孩子来看看稻子是怎么长的。",
      say: "「我们排了三个班。」老师在电话里说，\n「孩子们没见过真的稻田，就在课本上见过。」\n「一人八十，你看行吗？」",
      options: [
        { text: "接研学团，让学校带孩子来",
          sub: () => `一人 ${NUM.研学单价} 元。他们不看米，只看田，上庄 2022 年靠这个收了 140 万`,
          pick: st => { st.third = "研学"; } },
        { text: "算了，田歇着吧", sub: () => "不折腾，也不挣这份钱", pick: st => { st.third = "无"; } },
      ]}},
    { 需: true, 重: 2, step: {
      id:"歇着", term:"小寒", who:"老周", title:"田闲下来了",
      brief: "稻子收了，田空着。老周过来看了一眼，什么也没说。",
      say: "老周在田埂上蹲了一会儿。\n「这一季的草籽都落在地里了。」他说，\n「明年你要是不管，春天一化冻，全出来。」",
      options: [
        { text: "冬天把田翻一遍，冻一冻",
          sub: () => "费工夫，不出钱，但明年的草能少一半",
          pick: st => { st.third = "无"; st.冬翻 = true; st.stats.ecology = clampStat("ecology", st.stats.ecology + 4); } },
        { text: "算了，田歇着吧", sub: () => "不折腾，也不挣钱", pick: st => { st.third = "无"; } },
      ]}},
  ];
  步.push(抽一步(小寒池));

  /* ── 五 · 大寒：这一季的最后一件小事 ──
     不改变大局，只让这一年收得有个人味儿。 */
  const 大寒池 = [
    { 重: 3, step: { id:"结账", term:"大寒", who:"老陈", title:"老陈来结账",
      brief: "老陈把车开回来，说是尾款算错了，少给了你一点。",

/* 按权重抽一步 —— 需 是建池的时候就算好的布尔值，false 的整条不参与 */
function 抽一步(池) {
  const 能 = 池.filter(x => x.需 !== false);
  const 总 = 能.reduce((a, x) => a + (x.重 || 1), 0);
  let r = Math.random() * 总;
  for (const x of 能) { r -= (x.重 || 1); if (r < 0) return x.step; }
  return 能[0].step;
}

/* 谷价 —— 原粮给价。行情好就高，行情差就低。 */
/* 谷价 —— 原粮给价。行情好就高，行情差就低。
   ⚠ 谷价补 是老陈那个价被磨动了多少（立冬"跟他磨两句"那一下）。
     它只乘在**卖谷**这一条路上，不乘后面的米 —— 米是你自己卖的，
     卖多少钱跟老陈没关系。见 年终 里的 谷价v。 */
const 谷价 = S => Math.round(miban.grade.价 * NUM.原粮折扣 * NUM.出米率_代碾 * (S.行情 ? S.行情.原粮 : 1) * (S.谷价补 || 1) * 10) / 10;

  /* ── 白露 ── */

  "年景-伏旱": { 法: "旱在哪期差得远", 问: "旱一旱，稻子不是更抗倒吗？",

  "年景-秋淋": { 法: "穗上发芽就废了", 问: "下场雨而已，至于吗？",

  "年景-暖春": { 法: "膜是给冷天用的", 问: "回暖早不是好事吗？怎么会烧苗？",

  "年景-雨水匀": { 法: "沟通雨是肥", 问: "雨下得正好，还需要做什么吗？",

    书: "灌浆期昼夜温差大有利于光合产物向籽粒转运、减少呼吸消耗，直链淀粉含量与蛋白质含量趋于适宜区间，整精米率提高。粳稻灌浆最适日均温 21–23℃，且需较大温差。",

/* ══════════════════════════ 6. 图鉴 ══════════════════════════
   三条线：田里的（你在这块地上会碰到的）/ 手上的（农事）/ 这一带（设定）

const CODEX = {
  /* ── 田里的 ── */
  "稗草": ["田里的", "稻子有叶舌和叶耳，稗草两样都没有；稻子叶脉绿、叶面粗有毛，稗草叶脉白、叶面光滑。它分蘖能到上百枝，抢肥比稻子狠。移栽稻田一年有两个出草高峰，栽后 5–15 天和 20–25 天，所以一次用药必然除不净。"],
  "抗性稗草": ["田里的", "长期单一用药，稗草会进化出抗性。江苏已有种群对噁唑酰草胺抗性 13.71 倍，而且对好几种药交叉抗性。最要命的是：农户施药前无从预判，打了才知道白打。"],
  "二化螟": ["田里的", "北方稻区主要害虫之一，北京一年发生两代。一代幼虫六月下旬蛀茎造成枯心苗，二代八月上旬造成白穗。幼虫蛀入茎秆后药液无法触及，故防治窗口在卵孵高峰前后，而非见枯心苗之后。"],
  "纹枯病": ["田里的", "病菌以菌核在土壤中越冬。灌水整田后菌核比重小于水，浮于水面随水漂移，接触稻株基部后萌发侵入。晒田之所以有效，在于水干后菌核无法漂浮传播，且株间相对湿度由 92%–96% 降至 80%–90%，低于 90% 即不发病。"],
  "天敌": ["田里的", "蜘蛛、青蛙、寄生蜂，田里自己长出来的防线。打一遍广谱农药，虫和天敌一起死；虫繁殖快，天敌繁殖慢，下一批虫上来就没人管了。实测稻鸭田的蜘蛛是常规田的 1.66–2.61 倍。"],
  "稻瘟病": ["田里的", "北方稻区第一位病害，损失最重的是穗颈瘟。两条最反直觉：一，它不从气孔侵入，是靠附着胞产生侵入丝穿破角质层；二，出叶当天最易感，5 天后抗性渐强，13 天后几乎不感病。所以必须打「破口初期」，等看到白穗，已经不可逆了。"],
  "灰飞虱": ["田里的", "北京在北纬 40°，褐飞虱、白背飞虱都不能在这儿越冬，也不在全国农技中心的北方稻区防控名单里。北方真正要盯的是灰飞虱，它传条纹叶枯病。"],
  "稻潜叶蝇": ["田里的", "幼虫潜叶为害，钻在叶片上下表皮之间取食叶肉，仅留一层透明表皮，故田间所见为白条而非缺刻。虫体藏于两层表皮之间，药液接触不到，这是它最难防治之处。稻鸭共作可显著压低虫口：鸭并不取食叶内幼虫，而是趟动稻株使幼虫落水，落水后无法再上叶。"],
  "稻曲病": ["田里的", "仅为害穗部，且集中于穗上发育最饱满的谷粒。病粒整个膨大为墨绿色孢子球，体积数倍于健粒。氮肥偏多、穗型偏大时发病加重。孢子球极易散落，摘除须轻拿并装袋带出田外；病粒混入碾米会使整批米发灰并带毒。"],
  "穗颈瘟": ["灾", "稻瘟病中为害最重的一种，病斑位于穗颈，穗子自此抽出。穗颈一经缢缩，全穗输水输养中断，结实率极低。病菌不由气孔侵入，而以附着胞产生侵入丝直接穿透角质层；水稻出叶当天抗性最弱，5 日后渐强。故防治窗口仅在破口初期数日，见白穗已迟。"],

  "倒伏": ["灾", "两种。根倒：长期深水，根扎得浅，风一吹整株平躺。茎倒：氮肥多，基部节间拉长、茎壁变薄，穗一沉就折。倒伏虽然发生在后期，根子却在前期和中期的管理上。灌浆期倒伏一般减产 20% 以上。"],
  "早霜": ["灾", "秋天第一场霜。来得早，还在灌浆的稻子直接停住，米长不足，青粒多。插秧晚一天，灌浆期就往后推一天，撞上的概率就大一分。"],
  "青枯": ["灾", "生理性病害，非病原侵染。秧苗在棚内高温高湿下徒长，根系弱、根冠比小；久雨骤晴后骤然揭膜，棚内相对湿度骤降而温度仍高，叶片蒸腾骤增，根系吸水供不上，苗体失水青枯，成团成片死亡。保温育秧，是把「冻害」的风险换成了「揭膜」的风险。"],

  /* ── 手上的 ── */
  "盐水选种": ["手上的", "盐水比重比水大，瘪谷浮、饱谷沉。粳稻比重 1.10–1.13，用鲜鸡蛋试，蛋壳露出水面约一枚硬币大就对了。泡不超过 5 分钟，选完必须用清水冲两三遍。但它选的是饱满度：稻瘟病粒、恶苗病粒照样沉底，所以盐水选替代不了药剂消毒。"],
  "恶苗病": ["手上的", "由种子带菌，病菌分泌赤霉素让苗徒长，又细又高、颜色发黄，根却是烂的。可防不可治，「发病株率即损失率」，一般减产 10%–20%，重的过半。现在咪鲜胺、氰烯菌酯抗性都上来了，稳妥做法是先包衣、再浸种。"],
  "露地育秧": ["手上的", "不起棚，让秧苗在真实气温里长。省膜省工，秧苗皮实。风险只有一个：倒春寒。北京五月上旬历史极端最低 2.5℃；日均温连续 3–5 天低于 12℃，就要烂秧。"],
  "返青": ["手上的", "秧插下去根受伤，要重新长出新根才能恢复生长。这几天气色发黄是正常的。插得太早、水温低，返青就慢。"],
  "安全齐穗": ["手上的", "粳稻抽穗开花要求日均温稳定在 20℃ 以上，连续两天低于 19℃ 就可能受害。北京麦茬稻必须争取 8 月 28 日前安全齐穗。所以「晚熟品种 + 适期早插」是光温资源最大化，但晚熟与安全，在北京是同一个赌注的两面。"],
  "深水": ["水", "深水能保温、能压草，但代价是两条：一是叶鞘被淹，通气断了，分蘖节往上抬，低位蘖发不出来，有效穗就少；二是深水施氮的利用率只有约 20%（浅水层施是 60%），氨挥发跑掉了。"],
  "晒田": ["水", "也叫搁田。口诀是「苗到不等时，时到不等苗」：苗数够了就晒，进了分蘖末期就算苗不够也得晒。效果：基部节间变短、秆壁增厚，实测基部节间距 −21%、壁厚 +30%；株间湿度降下来，纹枯病就压住了。火候是土壤含水量 60%±5%，裂成鸡爪纹就够了，裂大了断根，复水后光合要十多天才能恢复。"],
  "稻鸭共作": ["虫", "国家推荐的参数是：分蘖初期放 15–20 日龄的雏鸭，每亩 10 只左右，齐穗前必须收鸭。鸭子吃虫、吃草、踩泥，粪便是肥。实测对稻飞虱防效 82.7%、对杂草 40 天后 94.2%。它压纹枯病不是因为吃菌核，是踩踏把基部枯叶蹬掉、通风透光了，和晒田一个机理。但有一条：鸭不碰稗草。"],

  /* ── 手上的（肥与收） ── */
  "氮肥与食味": ["肥", "籽粒蛋白质含量和氮肥用量正相关，而且后期追的氮比基肥影响更大。蛋白质在胚乳里形成蛋白体，包在淀粉粒之间，阻碍淀粉糊化吸水，米饭就发硬、黏弹性下降。粳稻蛋白质含量与食味值的相关系数 r = −0.923。京西稻地理标志规范直接写：后期不施粒肥，蛋白质 6%–8%。"],
  "灌浆": ["收", "抽穗后米粒一点点填进淀粉。这时候最怕两件事：一是断水太早，灌不满；二是往后拖，赶上秋雨和早霜。实测：以抽穗后 55 天收割为 100%，50 天是 94.2%，45 天 89.1%，40 天 85.7%，大约每早割一天减产 1%。"],
  "适期收获": ["收", "京西稻的规范口径是「完熟期，黄颖壳粒 95% 左右收割」。收早了青粒多、整精米率低；收晚了掉粒断穗、穗发芽，而且稻谷水分过低反而整精米率偏低、脆裂粒增加。两头都不行。"],
  "除草剂": ["药", "一遍下去草就黄了，省工省力。但它分不清杂草和天敌，也分不清哪棵草长在田埂上。而且稗草抗性上得很快，江苏、安徽、吉林、黑龙江都已有抗性种群。"],
  "打药": ["药", "见效最快的一手。关键是窗口：二化螟要在卵孵高峰、蛀入之前；穗颈瘟要在破口初期。过了窗口，药不是没打，是打晚了。代价是田里所有的活物一起清空。"],

  /* ── 补的 12 条 ──
     这 12 个名字早就被 codex: 引用了，表里却一直没有，玩家认得也翻不到。
     一口气补齐，按原来的分类放。 */
  "品种退化": ["手上的", "常规稻可以自己留种，但连年在同一块地上留，群体里的杂株和变异株一年年攒下来，抽穗早晚不齐、株高不齐，米质就一点点散了。杂交稻干脆不能留，它是两个亲本的杂交一代，第二代性状要分离，长出来高的高矮的矮。所以常规种也得提纯复壮，隔两三年换一次原种。"],
  "催芽": ["手上的", "稻种得先吸够水才萌动，吸到种子重量的 25% 上下。催芽分开两段：破胸那一段要 30–32℃，破胸之后降到 25–28℃ 长芽。芽长到半粒谷就够了，再长播种时容易折断。堆温过了 40℃ 会烧芽，所以中间要翻堆、要淋水，催芽是个要看着的活，不是堆在那儿等。"],
  "分蘖": ["田里的", "分蘖有同伸规律：主茎第 4 叶出生的时候，第 1 个分蘖才从它的叶腋里冒头，分蘖和母茎的叶位差是 3。所以「n 叶期」和「第 n−3 个分蘖」是一起动的。分蘖不是越多越好，后发的那些来不及抽穗结实，到分蘖末期自己就死了，白耗养分。算不算数看三条：有没有长出 3 片自己的叶、有没有自己的根、有没有赶上时候。"],
  "淹稗": ["水", "深水淹稗靠的不是稗草怕水，稗草本身也耐水。它靠的是苗高差：移栽的时候稻苗已经比刚冒头的稗草高出一截，灌 10–15 厘米，把稗草的顶叶压到水面以下。叶子见不着光就没法光合，几天下来先黄的是它。难就难在这几天的水要稳，灌得进、退得出、不冲不漫，全看沟。"],
  "田埂": ["田里的", "田埂不只是走人的路，它管三件事。蓄水：田里那层水全靠它兜着，埂一漏，水带着肥一起漏。虫源：二化螟、灰飞虱在埂上的杂草里越冬，第二年先从埂上回到田里，所以清埂等于压低基数。通行：机器下田的口子也在这儿。它不是一圈可有可无的土。"],
  "涝害": ["灾", "稻田怕的不是水多，是水不动。淹水之后土壤里没了氧，根系只能走无氧呼吸，攒下的乙醇和有机酸把根泡黑泡臭，根一坏，上面跟着黄。水稻比旱作物耐涝，是因为茎叶里有通气组织能把氧往下送，可这能力有上限，没顶几天、水温一高，一样撑不住。水退下去也别马上猛追肥，得先让它缓过来。"],
  "暗沟": ["水", "明沟排得掉地表明水，排不掉耕层底下那层滞水。稻田的渍害就是这么来的：地面看不见水，一脚踩下去冒浆，根系整季泡在一层排不出去的水里。暗沟是埋在耕层底下的排水道：填秸秆、铺砖石或者埋暗管，让那层水有地方去。它看不见，可有没有它，正是一块田能不能及时落干的分界。"],
  "断水": ["水", "收之前要把田里那层水放掉，好下脚、好进机器。北方稻区一般推荐收获前 7–10 天断水。早了不行：灌浆还没结束就断了，籽粒充实度下降、垩白增加、整精米率掉下来。晚了也不行：土壤含水量太高，机器进不去，损失率反倒上去。合适的火候是人踩下去不下陷，土还带着潮气。"],
  "分段断水": ["水", "一块田不是平的。高处水浅、地温高、熟得早；低处水深、地温低、熟得晚。同一天断水，等于让低处那片提前收了工。分片断水就是按高差分日子：高的先断先收，低的再留几天把浆灌完。代价是多跑一趟机器、多请一遍人；换来的是低处那几成没被提前掐掉的粒重。"],
  "磷酸二氢钾": ["肥", "叶面上喷的磷钾肥。作用是促光合产物往籽粒里走，提高结实率和粒重，破口期和灌浆期都能喷，常用浓度 0.2%–0.3%。它见效快、用量小，可也正因为量小，顶不了土壤施肥的缺，只在基肥追肥到位的前提下补一把。还有一条常被忘掉：叶面肥补的是磷钾，后期再回头追氮就走反了，米会发硬。"],
  "功能叶": ["收", "抽穗以后，籽粒里那些淀粉主要不是茎秆里存下来的，是抽穗后这几片叶子现光合出来的。剑叶、倒二叶、倒三叶，合起来叫功能叶。它们多绿一天，粒重就多进一点。所以灌浆期要保叶：水断了、根伤了、病上来了，叶先衰，粮就轻。可也别反着来，氮肥一味往后拖，叶子贪青不落黄，成熟推迟，撞上早霜一样白搭。"],
  "对照田": ["手上的", "要证明一个做法有效，不能靠「我去年这么干收成不错」。得设对照：同一块田、同一个品种、同一天插秧、同一套管法，只让一个因素不一样。再好的田也要做重复，田里本来就有地方肥、有地方瘦，差别可能是地力带来的，不是你那一手带来的。收的时候分开打、分开称、分开算，这样得出来的结论，才不怕人问你凭什么。"],
};

/* ══════════════════════════ 8. 逻辑层（不碰 DOM） ══════════════════════════ */

const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
const clampStat = (k, n) => { const [lo,hi] = LIMITS[k]||[0,100]; return clamp(n,lo,hi); };

/* 一局的节气表 = 4 个必经 + 4 个随机抽，再按物候排序。
   谷雨(序1) 一定在最前、秋分(序11) 一定在最后 —— 这是物理必然，不参与抽签。
   抽中的 4 个从池子里出，所以每一局你要做的那 8 个决定，有 4 个是不一样的。 */
const 一局节气 = () => {
  const 锚 = DECISIONS.filter(d => d.锚);
  const 池 = DECISIONS.filter(d => !d.锚).slice();
  for (let i = 池.length - 1; i > 0; i--) {          // Fisher–Yates
    const j = Math.floor(Math.random() * (i + 1));
    [池[i], 池[j]] = [池[j], 池[i]];
  }
  return 锚.concat(池.slice(0, 8 - 锚.length)).sort((a, b) => a.序 - b.序);
};

/* 按权重抽年景 —— 平年最多，上上和下下都少见 */
function 抽年景() {
  const 总 = 年景池.reduce((a, y) => a + (y.重 || 1), 0);
  let r = Math.random() * 总;
  for (const y of 年景池) { r -= (y.重 || 1); if (r < 0) return y; }
  return 年景池[0];
}

   ────────────────────────────────────────────────────────────── */

function 抽行情() {
  const 总 = 行情池.reduce((a, y) => a + (y.重 || 1), 0);
  let r = Math.random() * 总;
  for (const y of 行情池) { r -= (y.重 || 1); if (r < 0) return y; }
  return 行情池[0];
}

/* 牌子系数 —— 生态换来的不是分，是别人买不买你的账 */
const 牌子 = 生态 => clamp(生态 / NUM.牌子基数, NUM.牌子下限, NUM.牌子上限);

/* ── 名望 ──
   一个数，跨季攒。它回答的是「这一带怎么看你」。

   只算三样，因为这三样玩家在年终屏上都看得见、能自己核对：
       等级　米种得怎么样
       生态　田养得干不干净
       人情　这一季好回响比坏回响多几记
   **故意不算"挣了多少钱"** —— 那是账本，不是名声。
   一下子挣两万可以是赶上丰年，跟这一带觉不觉得你靠谱是两回事。

   顺带说清楚它不是什么：它不是经验值，不能换东西。
   它只开两条路：三产的口碑系数，和后面几条人事上多出来的选项。 */
const 名望表 = { 特级: 8, 一级: 5, 二级: 2, 等外: -2 };
function 算名望(S, g) {
  const 等级 = 名望表[g.名] !== undefined ? 名望表[g.名] : 0;
  /* 生态 35 分以下就是**负的**：田养坏了这一带看得见，不是"没加分"，
     是"减分"。少了这一档，名望就成了一条只涨不跌的线，攒起来没手感。 */
  const e = S.stats.ecology;
  const 生态 = e >= 85 ? 5 : e >= 70 ? 3 : e >= 50 ? 1 : e >= 35 ? 0 : -2;
  const 人情 = clamp(S.回响 - S.负面, -3, 5);
  /* 酒瓶上印了「京西稻」—— 那不是米本身换来的名声，是这三个字往外走了一趟。
     所以它单独一栏，不混进 等级 里（等级说的是"你这一季种成什么样"）。 */
  const 名头 = S.酒 === "名头" ? NUM.酒名望得 : 0;
  /* 直销的第二层也换名望：摆摊掉、跑馆涨（见 建后段 的 直层）。
     跟 名头 一样单独一栏 —— 它不是"你这一季种成什么样"换来的，
     是"你怎么把米卖出去的"换来的。跑馆那 +5 是这一层唯一的正项，
     也是它跟摆摊之间真正的取舍（钱 vs 名字，不是量 vs 价）。 */
  const 门路 = S.channel === "直销"
    ? (S.直 === "摆摊" ? NUM.直销摊望 : S.直 === "跑馆" ? NUM.直销馆望 : 0) : 0;
  const 本季 = 等级 + 生态 + 人情 + 名头 + 门路;
  return { 等级, 生态, 人情, 名头, 门路, 本季, 前: S.名望 || 0, 合计: Math.max(0, (S.名望 || 0) + 本季) };
}

/* 口碑 —— 名望换来的那一份。认养和研学是"人传人"的生意：
   这一带认不认得你，直接决定有多少人愿意来。
   ⚠ 只乘三产，不乘礼盒。礼盒看的是米本身和行情，
     "认识你"不能把米变多，只能把人叫来。
   ⚠ 是**饱和曲线**，不是直线。原来写的 1 + 名望/150 第 5 季就顶死 1.45，
     后面几十季一动不动 —— 实测 80 季名望中位数 539~1898，全都远超 67 那个点。
     现在渐近 1.30，永远够不满：长线一直有得涨，但越来越慢。 */
const 口碑 = 名望 => 1 + 0.30 * (名望 || 0) / ((名望 || 0) + 200);

/* ── 印象 ── 每个 NPC 一条，封在 ±24。
   上界是必须的：印象只进不出的话，玩够多季就自动满，
   新档第一季又永远够不到 —— 那种"关系"是假的。

   ⚠ v5.9.6：12 → 24。用户报「上限分有点低，我刷了几把就快满了」。
     只抬顶、**不动任何一扇门**：现有的门（≥2/≥4/≥6/≥8、≤-6）全在 12 以下，
     每次加的「象」也没动 —— 所以够门要花几手完全不变，
     变的只有"顶到上限要花几手"，翻了一倍。那正是玩家报的那个毛病。
   ⚠ 别把门也一起翻倍：翻倍+抬顶 = 只是号码大一号，难度一模一样，白改。 */
const 印象上下 = 24;

/* 厨艺 0–9，蹭饭 0–99。厨艺封顶是因为它只在饭桌上用，越大越没意义；
   蹭饭不封顶 —— 蹭得越多越难看，这条曲线本来就该一直往下走。 */
const 厨艺上下 = 9;

/* 跟 记象 一个路子：clamp 完当场存档，不等年终。
   理由也一样 —— 玩到一半关掉，今晚这顿饭就不该白做。 */
function 记隐(S, 隐) {
  for (const k in 隐) {
    if (k === "厨艺") S.厨艺 = clamp((S.厨艺 || 0) + 隐[k], 0, 厨艺上下);
    /* 别的都是只增不减的计数（蹭饭、食堂）。都不封顶 ——
       次数越多越说明一件事，不是越攒越强。
       ⚠ 负数在这儿的语义是"回到零"，不是"变负"。 */
    else S[k] = Math.max(0, (S[k] || 0) + 隐[k]);
  }
  存档({ 厨艺: S.厨艺 || 0, 蹭饭: S.蹭饭 || 0, 食堂: S.食堂 || 0 });
}
function 记象(S, 象) {
  for (const k in 象) {
    S.印象[k] = clamp((S.印象[k] || 0) + 象[k], -印象上下, 印象上下);
    /* 本季印象不封顶：它只是"这一季你干了什么"的流水，给年终那屏看的。
       封顶的是 印象 本身，那个才是带进下一季的东西。 */
    S.本季印象[k] = (S.本季印象[k] || 0) + 象[k];
  }
  存档({ 印象: { ...S.印象 } });     // 当场存，不等年终（理由见 onTreat）
}

/* 一件人事"是谁的事" —— 看它的处置里记了谁的象。
   ⚠ 续 可能是**函数**（后段那几条路每次点开现造一份），不是数组，
     直接递归会炸在 forEach 上。所以只认数组那一半。
   ⚠ 人名单从 state.印象 的键来，不另抄一份 —— 哪天添了人，
     这儿自动跟上；抄一份的话，新人永远不会被算进"冷门"里。 */
function 谁的事(ev) {
  const 出 = new Set();
  const 扫 = 处 => (处 || []).forEach(ch => {
    if (ch && ch.象) Object.keys(ch.象).forEach(k => 出.add(k));
    if (ch && Array.isArray(ch.续)) 扫(ch.续);
  });
  if (ev && ev.诊) 扫(ev.诊.处置);
  return 出;
}

function newSeason(固定) {
  const f = 固定 || {};
  const 节气 = f.节气 || 一局节气();
  const 年景 = f.年景 || 抽年景();
  /* 随机事件池：开局就把这一局会撞上哪几条定下来。
     ── 但"人事"不走骰子 ──
     诊里带 岔 的那几条是人，不是天气。骰子的问题不是"随机不好"，是它会
     **静默地**让一整季一个人也不出现：三条人事的 p 加起来期望只有 0.69 件，
     46% 的季一件都碰不到，而且不报错 —— 玩家只会得出"这游戏没剧情"。
     "这一季撞上了什么人"是这个游戏唯一的故事线，故事线不能靠运气发不发。
     改成配额：保底 NUM.人事保底 件，另有 NUM.人事加件 的概率多一件。
     变的是**有没有**，不是**是哪件** —— 后者仍然随机。

     ── 但配额还不够，还得管"抽哪儿" ──
     保底 1 件只保证**季里有戏**，不保证**中间有戏**。两件可以都落在灌浆，
     前六步照样一个人都不出现 —— 玩家说的"玩到中间几乎没有剧情"，说的是这个。
     （v5.5.2 把人事从 3 件写到 9 件，其中 7 件本来就在分蘖/孕穗/灌浆，
       内容上早就不缺中间。缺的是**排布**。）
     所以现在顺序反过来：先洗阶段，再从每个阶段里抽一件。
     两件 → 两个不同的阶段；三件 → 三个。 */
  const 抽中 = 随机池.map(e => Math.random() < e.p);
  /* 只在**这一季真的有的阶段**里挑人事。
     一季 8 个节气 = 4 个锚点（谷雨/芒种/大暑/秋分）+ 7 选 4。灌浆段一个锚点
     都没有 —— 立秋/处暑/白露全在随机池里等着被抽。所以有的季压根没有灌浆的
     节气，dueEvents 里 `段` 一次都不会等于"灌浆"，抽中的灌浆人事就永远排不上，
     而且是静默的：不报错，不出场。实测 0.33%，漏的全是灌浆那三件。
     这跟 轮到() 那个漏是同一类毛病换了个人口 —— 保底"1 件"这句话，
     得在所有入口上都成立才叫保底。 */
  const 本季段 = new Set(节气.map(d => d.阶段));
  /* ⚠⚠ 午饭（家常）从骰子改成保底 —— v5.9.2。
     v5.8.3 把它的 p 从 0.42 抬到 0.90，理由是"90% 之后一季一顿基本是常态"。
     抬完量了一遍（_午饭3.mjs，500 局）：出场 91.0%，对 p=0.90 做二项检验
     z=0.75 —— **骰子是准的，代码也是通的，45 局没出场的拦因全是"没抽中"，
     没有第二种原因。** 可用户玩完 5.9 还是那句"我又没遇到午饭"。
     要改的就是这个：90% 的意思是十季里有一季不过这个日子，
     而玩家**分不出"这季没轮上"和"游戏坏了"** —— 他只会再报一次同样的 bug。
     （"不报错的错最贵"这条对**没发生的事**同样成立：它连没发生都不告诉你。）
     所以不留骰子了：分蘖段在，它就一定出场。
     ── 为什么不干脆挪进人事配额 ──
     配额是给"人"的：一件人事占掉一个名额，就挤掉另一个人。
     午饭不占名额（它不是人，是每天要过的日子），所以要的是**自己那份保底**，
     不是去分人事那杯羹。
     ⚠ 仍然认 本季段 —— 哪天分蘖不再是锚点（现在是芒种顶着），它会跟着
       静默失效，而不是挂一个永不满足的条件假装还活着。
     ⚠ 这条没有 需。**哪天给它加了 需，这里必须跟着查** ——
       否则它会被无条件保底，到 dueEvents 再静默地不满足 需，白占一个节气。 */
  {
    const 家 = 随机池.findIndex(e => e.家常);
    if (家 >= 0) 抽中[家] = 本季段.has(随机池[家].at);
  }
  /* ⚠ 需 也得在这儿过一遍。
     原来只有 dueEvents 里查 需（那是"真要发生的时候"），配额这边不查 ——
     于是一条你**够不着**的人事照样被抽进配额占掉名额，到点再静默地不满足 需，
     那一季就白少一件。玩家读到的是一季没戏，我们读到的一切正常。
     （这跟"阶段挑不到的那一季不出场"是同一个漏换的第三个入口。
       保底"1 件"这句话得在每个入口上都成立，才叫保底。）
     ⚠ 这里只能拿 档() 拼一个探针 —— state 还没建出来。
       所以**只挂跨季的量**（说法 / codex / 印象 / 名望 / 季）。
       季内才有的量（查过、flags、stats）到这儿一律是空的，
       挂上去 = 永远不满足 = 这件人事永远不出场，而且照样占名额。
       要挂季内的门，就挂到非人事的随机事件上去（那条路 需 是在 dueEvents 里查的）。 */
  const 探 = {
    说法: 档().说法 || {}, codex: { ...(档().认得 || {}) },
    /* ⚠ 印象从三个人扩到八个（v5.9.3 加老赵、老师，v5.9.4 加田主、村长、农资店）。
       用户原话：「好感怎么只有这三个人，可交互性太低了」，
       后来又提了一回：「印象只有这三个人 太少」，
       最后一句是「可以加更多的npc及其人事和印象，以及他们对后续事件选项的影响」。
       八个人分两拨：老赵（米厂）、老师（组会）本来就是故事里的人，只是没人格；
       田主、村长、农资店是**本来就该在、却一句台词都没有**的人 ——
       你种的是田主的地、补贴是村长报的、化肥是农资店卖的。
       ⚠ 不给新人取名字：用户明确说过「不用给npc同学专门取名字」，
         所以就是"老赵""老师"，跟"老周""老陈"一个叫法。
       ⚠ 展开写 ...(档().印象) 这一手老档也接得住：旧档里只有三个键，
         新键落回 0，不会变成 undefined。 */
    印象: { 周: 0, 陈: 0, 同: 0, 赵: 0, 师: 0, 主: 0, 村: 0, 农: 0, 乙: 0,
            ...(档().印象 || {}) },
    名望: 档().名望 || 0, 季: 档().季 || 1,
    查过: {}, flags: {}, stats: {},
  };
  const 人事位 = [];
  随机池.forEach((e, i) => {
    if (!(e.诊 && e.诊.岔)) return;
    /* ⚠⚠ 家常 那句必须在**作废骰子之前**。
       午饭那条同时带 岔 和 家常：岔 让它进这个循环，家常 让它不进配额。
       原来 抽中[i] = false 排在家常前面 —— 于是它的骰子被作废、配额又没它的份，
       **两个入口全堵上，一次都不可能出场**，而且不报错。
       玩家问过两回"午饭啥时候能玩上"，实测 300 季 0 次。
       顶上那句"所以它照旧走 o.p 的骰子"想的是对的，写的位置是错的。

       ⚠ 两条同时挂在一个事件上是正常的：岔 说的是"这条长得像人事"
         （要走「你 拿 了 主 意」那套文案），家常 说的是"它不是人事，别占名额"。
         所以不能靠"别同时写"绕过去，只能把顺序摆对：
         **先认亲（是不是人事），再分家（走骰子还是走配额）。** */
    if (e.家常) return;                     // 家常走骰子，不算人事
    /* ⚠ 作废骰子这句必须在 需 之前 ——
       写成"先看门、门不开就 return"，那些够不着的人事就留着骰子给的 true，
       到 dueEvents 再因为 需 不满足而不发生：名额照占，戏照少。
       看着像修了，其实一点没动。 */
    抽中[i] = false;                        // 骰子对人事一律作废
    if (e.需 && !e.需(探)) return;
    if (本季段.has(e.at)) 人事位.push(i);   // 挑不到阶段的，这一季就不出场
  });
  /* ── 名望还没挣出来的那三件，给一次插队权 ──
     ⚠ 它们的窗口只有头四季（名望 0 / 15 / 25 / 35，第五季就过 40 了），
       而池子里有三十来件人事、一季只放三个名额。实测二十四季**一件都不出** ——
       用户要的是"名望低的时候有额外事件"，写出来了、也测试过了，
       可它在真游戏里一次都没露过脸，那跟没写一样。
     ⚠ 为什么走 抽中 而不是塞进 人事位：名额分配是按**阶段**洗牌后
       一轮一轮挑的，塞进去也只是多一个候选，照样可能排不上。
       低名望的日子就那么几年，这几年得**确定**看得见。
       .7 是留一点余地：不是说年年必须有，是"多半会有"。 */
  if (!够望("生人")(探)) {
    const 低 = 人事位.filter(k => 随机池[k].低望);
    if (低.length && Math.random() < .7) {
      const k = 低[Math.floor(Math.random() * 低.length)];
      抽中[k] = true;
      人事位.splice(人事位.indexOf(k), 1);   // 划掉，免得配额那边再抽一遍
    }
  }
  /* ── 冷门的人，每季保底占一个名额 ──
     用户原话：「我就没见到哪里可以刷到新npc，他们的事件有点少」，
     第二次是「其他几个npc还是几乎都没怎么见过」。
     ⚠ 池子里**有**他们的事：_人事盘.mjs 数得清清楚楚，九个人没有一个是 0 件。
       缺的不是内容，是**轮得上**。一季就 3~4 个名额，老周一个人占掉 1.5 件
       （他是带你的人，这个占比是设计），剩下的人去分那两三个位置 ——
       分到谁全看阶段怎么洗牌，于是同一个人连着几季不露面是常态。
       ⚠ 为什么不能靠"把冷门的人的 p 调大"：p 在这儿已经不是"会不会发生"，
         而是"要发生的话多大概率挑中它"，而阶段那一轮洗牌在前头 ——
         阶段没轮上的人，p 调到 1 也照样不出场。这跟 低望 那条是同一个坑，
         所以用同一个办法：**直接写 抽中，绕开算概率那一套。**
     ── 跟 低望 的区别 ──
     低望 是"头几季才有的机会"，带骰子（.7），而且**额外占名额**。
     这条是常年生效、不带骰子、**从保底名额里出** ——
     不然每季凭空多一件人事，密度就变了，那是数值改动，不该顺手做。
     所以下面 要 减掉这一件。 */
  const 季数 = 档().季 || 1;
  let 冷门用掉 = 0;
  {
    const 见人 = 档().见人 || {};
    /* 人名单从 探.印象 的键来 —— 添人的时候这儿自动跟上 */
    const 人头 = {};
    for (const k of 人事位) for (const w of 谁的事(随机池[k])) (人头[w] = 人头[w] || []).push(k);
    const 候选 = Object.keys(探.印象).filter(w => 人头[w] && 人头[w].length);
    if (候选.length) {
      /* 冷度 = 到这一季为止，几季没露面了。
         ⚠ 没露过面的人档里根本没有这个键，|| 0 兜底 → 冷度 = 季数，
           是所有可能值里最大的那个。方向正好：**越没见过的越靠前**。
           （反过来要是兜底成 1，新人就成了"上一季刚来过"，永远排在后面，
             那就把这个保底做反了。） */
      const 冷度 = w => 季数 - (见人[w] || 0);
      const 最冷 = Math.max(...候选.map(冷度));
      const 并列 = 候选.filter(w => 冷度(w) === 最冷);
      const 人选 = 并列[Math.floor(Math.random() * 并列.length)];
      const 池 = 人头[人选];
      /* 挑哪一件跟配额那边一个规矩：p 是轻重，不是门槛 */
      let 总 = 0;
      for (const k of 池) 总 += 随机池[k].p || .2;
      let r = Math.random() * 总, 选 = 池[池.length - 1];
      for (const k of 池) { r -= (随机池[k].p || .2); if (r <= 0) { 选 = k; break; } }
      抽中[选] = true;
      人事位.splice(人事位.indexOf(选), 1);
      冷门用掉 = 1;
    }
  }
  {
    /* 按阶段分组。抽的顺序是"阶段 → 件"，不是"件"。 */
    const 按段 = new Map();
    for (const k of 人事位) {
      const a = 随机池[k].at;
      if (!按段.has(a)) 按段.set(a, []);
      按段.get(a).push(k);
    }
    /* 洗阶段 —— 这一季轮上哪几个阶段，得是随机的。
       不洗的话永远从苗期开始铺，熟脸永远先出现。 */
    const 段列 = [...按段.keys()];
    for (let i = 段列.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [段列[i], 段列[j]] = [段列[j], 段列[i]];
    }
    /* ⚠ 减去 冷门用掉 —— 那一件是从保底名额里出的，不是额外的。
       不减的话每季凭空多一件人事，整季的密度就变了（见上面那段）。 */
    const 要 = Math.max(0, Math.min(人事位.length,
      NUM.人事保底 + (Math.random() < NUM.人事加件 ? 1 : 0)) - 冷门用掉);
    for (let i = 0; i < 要; i++) {
      /* 从第 i 个阶段开始往后找，第一个还没抽空的就用它。
         池子够大时这就是"第 i 个阶段"；绕回来是兜底（人事比阶段少的时候）。 */
      let 段 = null;
      for (let k = 0; k < 段列.length; k++) {
        const 试 = 段列[(i + k) % 段列.length];
        if (按段.get(试).length) { 段 = 试; break; }
      }
      if (!段) break;
      const 池 = 按段.get(段);
      /* 加权：p 在这儿的意思从"这一季会不会发生"变成"要发生的话，
         多大概率是这一件"。所以给 p 的人事有轻重，没给的一律按 .2 算。 */
      let 总 = 0;
      for (const k of 池) 总 += 随机池[k].p || .2;
      let r = Math.random() * 总, 选 = 池[池.length - 1];
      for (const k of 池) { r -= (随机池[k].p || .2); if (r <= 0) { 选 = k; break; } }
      抽中[选] = true;
      池.splice(池.indexOf(选), 1);
    }
  }
  /* ── 从上一季带过来的那两样，在这儿算 ──
     季数从档里读，不读 state —— state 还没建出来。 */
  const 熟练 = Math.min((季数 - 1) * NUM.熟练每季, NUM.熟练上限);
  /* 取整到 10 元：647 比 646.8 好看，而且省得账本上蹦出小数点 */
  const 底金 = Math.min(Math.round((档().存 || 0) * NUM.带钱比例 / 10) * 10, NUM.带钱上限);
  return {
    stats: { harvest: NUM.亩产基准, quality: NUM.品质基准, ecology: NUM.生态基准 },
    stamina: NUM.体力基准 + 熟练,
    cost: 0, flags: {}, fired: {}, log: [],
    /* ── 旧：上一季那本账 ──
       人事里面最能出戏的几件（捡穗、工钱、夜里有人、白条）全在成熟段，
       而成熟是最后一阶段 —— 同季没有下一步，旗插下去就跟着这一季一起没了。
       它们的账本来只能烂在那儿。有了这一本，明年才接得上。
       ⚠ 只读，不写。这一季的新旗照旧进 flags，年终才整本抄回去。 */
    旧: { ...(档().前事 || {}) },
    /* 跨季带过来的三样。codex 开局就是"上季认得的那一堆" ——
       所以 unlock 只在**头一回**认出来的时候才报"记下了"，
       上季认过的再碰见，不会再弹一次。 */
    codex: { ...(档().认得 || {}) }, ach: { ...(档().ach || {}) },
    季: 季数, 本季认得: {},
    /* 这两样挂出来给开局那张卡看 —— 卡得能说出"带过来多少"，
       不然玩家根本不知道继承发生了。 */
    熟练, 底金,
    /* 上一季验出什么米 —— 谷雨那一屏的自留种读它。第一季是 null。 */
    种: 档().种 || null,
    查过: {}, 本季成就: [],
    /* 灵感 —— 熬夜翻书换来的念头，是**跨屏**的：今晚得的，后面某屏才长出来。
       待查 / 新灵感 只管当晚那一屏。 */
    灵感: {}, 新灵感: null,
    /* 抄下来的说法 —— 翻书那晚从 查资料.法 落进来，跨季带着走。
       见 查资料 头上那段：这是"翻书有收益"唯一的兑现口。 */
    说法: 档().说法 || {}, 新说法: null,
    /* 翻到过哪几处页边批注（存下标，跨季不重复）。见 边批。 */
    批过: 档().批过 || {}, 新批注: null,
    /* 已经露过面的后话（存 id，跨季不重复）。见 后话()。
       ⚠ 为什么非得记这个：后话的判据多半是"攒够了就一直成立"
         （印象·周>=10、名望>=70、认得>=6），不记"露过没有"的话，
         那一条**每一年都原样再来一遍**。玩家看到的是同一张清单，
         自然会觉得"彩蛋太少了，一直遇不到别的"（用户报的原话）。
         实测 `品质` 打法 40 季：22 条里 12 条一次没露过脸 ——
         不是够不着，是每年都被同几个高权重的挤掉了（一次只显 4 条）。
         记上之后，攒到一条露一条，露过的不再占位。 */
    见后话: { ...(档().见后话 || {}) },
    /* ── 谁上一回露面是第几季 ──
       给 newSeason 那条"冷门的人每季保底一个名额"用的。
       ⚠ 记的是**真出场**，不是"抽中" —— 抽中只是发了票，
         阶段没轮上、需 不满足，人照样没露面（见 dueEvents ③）。
         拿 抽中 当账的话，保底会去补一个玩家根本没见过的"已见过"的人。
       ⚠ 没露过面的不写 0：0 比 1 还小，会被当成"刚露过面"，
         正好反了。所以只在真出场的时候写，读的时候 undefined → 用季数兜底。 */
    见人: { ...(档().见人 || {}) },
    /* ── 餐桌上那两样（见 午餐 那条事件）──
       厨艺 和 蹭饭 都是跨季攒的，都**没有界面**：不进 HUD、不进年终账。
       它们只在午饭那张桌上说话，而且只说含糊话 —— 用户要的就是这个：
       「这些可以在合适的时候由小字给出，进行相对比较模糊和隐式的提示，
         就当作小彩蛋了」。
       ⚠ 不给它们做数字显示。一显示就成了刷数值，不再像过日子。 */
    厨艺: 档().厨艺 || 0,
    蹭饭: 档().蹭饭 || 0,
    /* 在学校食堂吃过几顿。用户给的素材是"偶尔会怀念颐园食堂的菜" ——
       重点在**偶尔**：天天去就没得怀念了。所以这条计数只用来分档说话，
       不给任何数。 */
    食堂: 档().食堂 || 0,
    /* ── 名望 ── 跨季。这一带怎么看你。只在 年终 结算（见 算名望）。
       季中挂在这儿是为了让 hud 和「需」读得到 —— 它是**开局那一刻**的值，
       本季新挣的那部分到年终才加上去。 */
    名望: 档().名望 || 0, 本季名望: null,
    /* ── 印象 ── 跨季，每个 NPC 一份。人事的处置当场就改（见 onTreat）。
       默认给三个键摆着：就算一季没碰见，读数也在，玩家知道有这回事。 */
    /* ⚠ 印象从三个人扩到八个（v5.9.3 加老赵、老师，v5.9.4 加田主、村长、农资店）。
       用户原话：「好感怎么只有这三个人，可交互性太低了」，
       后来又提了一回：「印象只有这三个人 太少」，
       最后一句是「可以加更多的npc及其人事和印象，以及他们对后续事件选项的影响」。
       八个人分两拨：老赵（米厂）、老师（组会）本来就是故事里的人，只是没人格；
       田主、村长、农资店是**本来就该在、却一句台词都没有**的人 ——
       你种的是田主的地、补贴是村长报的、化肥是农资店卖的。
       ⚠ 不给新人取名字：用户明确说过「不用给npc同学专门取名字」，
         所以就是"老赵""老师"，跟"老周""老陈"一个叫法。
       ⚠ 展开写 ...(档().印象) 这一手老档也接得住：旧档里只有三个键，
         新键落回 0，不会变成 undefined。 */
    印象: { 周: 0, 陈: 0, 同: 0, 赵: 0, 师: 0, 主: 0, 村: 0, 农: 0, 乙: 0,
            ...(档().印象 || {}) },
    本季印象: {},
    /* 「懒惰的大学生」要的三个计数器。都不是新机制，
       只是把本来就在发生、但没人记下来的事记下来。 */
    最低体力: 99, 体力花: 0, 问周: 0, 探查: 0,
    /* 问周 每季清零（它是"这一季你多没主意"），可「不种」那条笑话要的是
       "你一直问" —— 那是跨季的账，所以单开一个总次数。 */
    问周总: 档().问周总 || 0,
    雇过: false, 回响: 0, 负面: 0,
    显数: {}, 待查: null,
    termIndex: 0, chainIndex: 0,
    节气, 年景, 抽中, 年景已发: false,
    /* 今年的验米线整体挪多少点。开局就按年景定下来 —— 因为它印在年景卡上，
       玩家一上来就得看见今年要冲到多少。年景真翻牌那一下会再改一次（对冲改动它）。 */
    移线: 年景.移线 || 0,
    grain: 0, soldGrain: 0, rate: 0, channel: "", third: "",
    /* 现金 —— 学院拨的实习经费。一季的开销从这里出，出剩下的就是手头活钱。
       收完粮以后买设备、做包装都看它。不卖原粮，手上就是没有活钱。 */
    现金: NUM.本钱 + 底金, 行情: null, 后段: [], 额外: 0, 大寒说明: "",
    /* 田里点的时候，手指按住的那个热区。非 null = 这一下已经认了，别再收第二次 */
    选了: null,
    /* 走过的那几步 —— 「翻翻这几步」读的就是它。
       ⚠ 以前一样都不记：choose() 只改数，S.log 里全是"事件"（回响），
         玩家那一手只以 flags 的布尔值间接存在。所以玩到一半想回头看一眼
         "我方才到底选了什么"，是没有地方可看的。 */
    选择: [],
  };
}

function applyEffect(state, effect) {
  /* ⚠ 有些账得看着**这一局的状态**才算得出来 —— 自留种的成色读的是
     上一季验出什么米，那袋种好不好，第一季和第二季不是一回事。
     所以 effect 允许写成 (state) => ({...})。
     这是全游戏唯一落 effect 的地方（决策 / 事件 / 年景三条路都走它），
     在这儿认一次就够，别处不用各认一遍。 */
  if (typeof effect === "function") effect = effect(state);
  const d = {};
  for (const k in (effect || {})) {
    const before = state.stats[k];
    state.stats[k] = clampStat(k, state.stats[k] + effect[k]);
    d[k] = state.stats[k] - before;
  }
  return d;
}
/* ══ 跨季的存档 ══
   一局一局之间得留下点什么，不然第二局跟第一局一模一样。
   只有三样：认得（图鉴）、季（第几季）、ach（成就）。
   ⚠ 整块用 try 包住：file:// 上有的浏览器不让写 localStorage。
     存不了档是小毛病，打不开游戏是大毛病 —— 不能让它把游戏搞崩。 */
const 存档键 = "yimudao.档.v1";
let 内存档 = {};                       // 写不进去的时候，至少这一场里还能用
function 档() {
  try { return JSON.parse(localStorage.getItem(存档键)) || 内存档 || {}; }
  catch (e) { return 内存档 || {}; }
}
function 存档(补) {
  /* ⚠⚠ 合的是 档()，不是 内存档。这一行是全文件最贵的一行。
     原来写的是 `内存档 = { ...(内存档 || {}), ...补 }`。看着像合并，
     其实是**覆盖** —— 内存档 是"localStorage 写不进去时的备胎"，
     页面刚打开的时候它是 {}，不是"已经读出来的那一份"。
     于是**刷新页面之后的第一次 存档()**，写下去的是 {这一次的那一项}，
     把 localStorage 里其余的键全抹了。
     而 再种一季 的第一件事就是 存档({ 季 }) —— 所以这个 bug 的触发方式
     恰好是玩家每次都会做的那一下：**刷一下页面，再种一季。**
       认得 清零  → 「田里的毛病，你认得 0 / 38 样」
       成就 清零  → 「上一局打出来的金牌成就，第二局就没了」
       名望 清零  → 攒了几季的人情白攒（"名望这个好少啊"有一半是它）
     用户报过两回，我两回都去查了别处（图鉴那条、成就那条）——
     因为**它只在刷新之后才发作**，一季一季连着玩，内存档 一直是满的，
     怎么试都是好的。现在它有自己的测试：_吞.mjs（那个测试必须模拟两次
     "页面加载"，跑季循环是测不出来的）。
     ⚠ 补 一律是整份（认得 / 印象 / 说法 / ach 都是 {...} 全拷），
       所以这儿的浅合并是对的：合并的是"哪些键"，不是"键里头的内容"。 */
  const 旧 = 档();
  内存档 = { ...旧, ...补 };
  try { localStorage.setItem(存档键, JSON.stringify(内存档)); } catch (e) {}
}

const unlock = (state, k) => {
  /* ⚠ 必须查一次表。原来不看 CODEX，引用一个写错的名字、或者引用一条还没写的
     条目，也照样把 state.codex[k] 记上 —— 于是图鉴里一个字看不见（那一屏是按
     Object.keys(CODEX) 渲染的），"认得"的计数却虚高，而 全认得 / 土专 这两个
     按 codex.length >= 12 判的成就，光靠幽灵就能凭空点亮。 */
  if (k && CODEX[k] && !state.codex[k]) {
    state.codex[k] = true;
    (state.本季认得 || (state.本季认得 = {}))[k] = true;
    存档({ 认得: { ...state.codex } });
    return k;
  }
  return null;
};

/* 某个生长阶段的最后一步是哪一步 —— 年景要等这一步做完才翻牌。
   为什么不是第一步？因为"对冲"这个动作就发生在同阶段的某一步上，
   提前翻了，玩家就没有补救的机会，那不叫难，叫不讲理。 */
function 阶段末位(state, 阶段) {
  let last = -1;
  state.节气.forEach((d, i) => { if (d.阶段 === 阶段) last = i; });
  return last;
}

/* 开一次诊断。
   上季亲手认过的，这一季白送一条线索 —— 但**只送一条**，
   而且绝不送"定案的那一处"（值 >= 成 的那种），也绝不送"看过就算完了"的那种。
   送多了这一屏就变成白给，知识就不再是练出来的了。
   成线是 1 的（稻曲病那种一眼的事）不送 —— 那本来就只有一步。 */
function 开诊(state, 诊) {
  if (!诊) return null;
  const z = { ...诊, 点过: {}, 值: 0, 得: [], 完: false, 治: null,
              熟: !!state.codex[诊.名] };
  if (!z.熟 || z.成 <= 1) return z;
  const 白 = z.步.findIndex(x => !x.收 && (x.值 === undefined ? 1 : x.值) < z.成);
  if (白 < 0) return z;
  z.点过[白] = true;
  z.得.push({ wh: "上 季 你 认 过 它", 旧: true,
    得: "这个你上季亲手认过，长什么样、长在哪儿、该往哪处看，都还有印象。" });
  z.值 += 1;
  return z;
}

function dueEvents(state, termIndex) {
  const out = [];
  const push = (line, mood, effect, from, codex, 查, 诊) => {
    if (codex) unlock(state, codex);
    const 前 = { ...state.stats };
    const delta = applyEffect(state, effect);
    const item = { line, mood, delta, from: from || null, 查: 查 || null,
                   前, 后: { ...state.stats },
                   /* 要诊的那一条：line 里装的已经是"你看见的"，结论挂在这儿。
                      点过 / 值 / 得 是**这一次诊断的过程**，挂在条目上，不放全局 ——
                      一个节气可能连着出两条要诊的，用一个全局变量会串台。
                      effect 在这儿是照常扣的：看不出来，亏也照吃 —— 这就是哑巴亏。
                      诊出来再治，差价由处置那一步补回来（见 on治）。 */
                   诊: 开诊(state, 诊) };
    if (mood === "bad") state.负面++; else if (mood === "good") state.回响++;
    out.push(item); state.log.push(item);
  };
  const here = state.节气[termIndex];
  const 名 = here ? here.term : "收尾";
  const 段 = here ? here.阶段 : "收尾";

  /* 一个阶段可能摊到好几个节气（苗期最多能有三个）。
     抽中的意外要摊开落，不能全砸在第一个节气上 —— 那是刷屏，不是节奏。 */
  const 同位 = state.节气.map((d, i) => (d.阶段 === 段 ? i : -1)).filter(i => i >= 0);
  const 槽 = 同位.indexOf(termIndex);
  const 轮到 = ev => {
    /* 人事不摊 —— 摊到它那个阶段的哪个节气都该发生。
       被 轮到 排掉是**静默**的：玩家不会知道这件本该发生的事没发生，
       我们也不会。随机事件才需要摊开，那是为了别刷屏。 */
    if (ev.诊 && ev.诊.岔) return true;
    if (同位.length <= 1) return true;
    const 同阶 = 随机池.filter(e => e.at === 段);
    return 同阶.indexOf(ev) % 同位.length === 槽;
  };

  /* ① 年景 —— 这一局的底牌，到它那个阶段的事全办完了才翻。
       ⚠ 原来写的是"阶段最后一步就翻"，可那一步往往**正是**做对冲的那一步 ——
         而这一步是先出事件、再让你决定的。于是你读到"寒潮来了"的时候，
         盖膜那个按钮还没弹出来。实测：倒春寒只有 29% 的局算数，
         伏旱和秋淋干脆是 0% —— 那两条对冲等于死代码。
       推后一步：阶段末位的下一次 dueEvents 再算。那会儿该做的都做完了。
       （成熟是最后一阶段，末位＝秋分，下一次正好是收粮那趟收尾。narratively 也对得上。） */
  const Y = state.年景;
  const 年景末 = Y && Y.hit ? 阶段末位(state, Y.hit) : -1;
  if (Y && Y.hit && !state.年景已发 && 年景末 >= 0 && 年景末 === termIndex - 1) {
    state.年景已发 = true;
    /* 三种下场，按这个顺序判：
         撞上  —— 年景给了台阶，你走反了。好年景也会罚你（暖春盖膜 → 烧苗）。
         挡住  —— 你做的事正好接住了这一年的脾气。这是"知识压过年景"的唯一时刻，
                  所以它必须真的赚，而不只是"少亏一点"。
         都不是 —— 年景按它自己的脾气来。
       反 跟 对冲 永远是同一个决策的两个选项（清沟/未清沟、早插/晚插……），
       不可能同时命中，所以顺序怎么排都一样。 */
    const 撞上 = Y.反 && state.flags[Y.反];
    const 挡住 = !撞上 && Y.对冲 && state.flags[Y.对冲];
    const 用 = 撞上 ? { line: Y.反线 || Y.line, effect: Y.反后 || Y.effect, 移: Y.反移 }
             : 挡住 ? { line: Y.对冲线 || Y.line, effect: Y.对冲后 || Y.effect, 移: Y.冲移 }
             : { line: Y.line, effect: Y.effect, 移: Y.移线 };
    const 有账 = Object.keys(用.effect || {}).length > 0;
    push(用.line,
         撞上 ? "bad" : 挡住 ? "good" : (Y.色 === "a" ? "good" : 有账 ? "bad" : ""),
         用.effect,
         ["年景", Y.名], null, 查资料["年景-" + Y.名]);
    /* 线挪在这儿落地。开局那张年景卡上已经写过一遍了（state.移线 在 newSeason 就设好），
       这里改的是"对冲真的起了作用"的那一下 —— 挡住 → 线回落，撞上 → 线再抬。
       不挂到 event 上的话，玩家只会看见 HUD 上那个箭头方向变了，不知道是谁改的。 */
    if (用.移 !== undefined && 用.移 !== state.移线) {
      const 条 = out[out.length - 1];
      条.移线前 = state.移线; 条.移线 = 用.移;
      state.移线 = 用.移;
    }
  }

  /* ② 你埋的因 —— 到点结果。at 可以是节气名，也可以是阶段名 */
  EVENTS.forEach((ev, i) => {
    if (state.fired[i] || (ev.at !== 名 && ev.at !== 段) || !ev.when(state)) return;
    state.fired[i] = true;
    push(ev.看见 || ev.line, ev.mood, ev.effect, ev.from, ev.codex, ev.查, ev.诊);
  });

  /* ③ 这一局抽中的意外 —— 同一件事，种法不同挨的程度不同 */
  随机池.forEach((ev, i) => {
    if (!state.抽中[i] || state.fired["r" + i] || ev.at !== 段) return;
    if (ev.需 && !ev.需(state)) return;
    if (!轮到(ev)) return;
    state.fired["r" + i] = true;
    /* 人事真出场了才记账 —— 上面三道门（扫中 / 需 / 轮到）都过了才到这儿。
       记在这儿而不是 newSeason 发配额那儿，是因为发出去的票不等于人到了：
       阶段挑不到、需 不满足的那件，玩家这一季根本没见过他。 */
    if (ev.诊 && ev.诊.岔 && !ev.家常) {
      const 人 = 谁的事(ev);
      if (人.size) {
        let 脏 = false;
        for (const w of 人) { state.见人[w] = state.季; 脏 = true; }
        if (脏) 存档({ 见人: { ...state.见人 } });
      }
    }
    const 挡住 = ev.对冲 && state.flags[ev.对冲];
    /* 挡住的时候，连"你看见的"也换一份 —— 天还是那个天，可你田里的样子不一样。
       但**诊还是要诊**：你还是得自己看出来那是什么，只是今年的后果轻一些。
       挡住能少亏，不能替你认字。 */
    const 文 = 挡住 ? (ev.对冲看见 || ev.看见 || ev.对冲线 || ev.line)
                    : (ev.看见 || ev.line);
    push(文, ev.mood,
         挡住 ? (ev.对冲后 || ev.effect) : ev.effect, null, null, ev.查, ev.诊);
  });

  return out;
}

function choose(state, decisionIndex, optionIndex) {
  const d = state.节气[decisionIndex];
  const o = d.options[optionIndex];
  const 前 = { ...state.stats }, 体力前 = state.stamina;
  const 缺口 = Math.max(0, o.stam - state.stamina);
  state.stamina = Math.max(0, state.stamina - o.stam);
  /* 这一季最低掉到过多少 —— 「懒惰的大学生」看的就是它。
     记在这儿是因为这是**唯一**扣体力的地方（夜里回体力不走 choose）。 */
  if (state.stamina < (state.最低体力 === undefined ? 99 : state.最低体力))
    state.最低体力 = state.stamina;
  /* 自己掏的那部分体力。缺口是雇工顶的，那不算你干的 ——
     「懒惰的大学生」看的正是"你有没有花钱把活包出去"。 */
  state.体力花 = (state.体力花 || 0) + Math.max(0, o.stam - 缺口);
  const 雇工费 = 缺口 * NUM.雇工价;
  if (雇工费 > 0) state.雇过 = true;
  state.cost += o.cost + 雇工费;
  /* 现金跟着走 —— 季末剩多少，决定后段能干什么。
     见底就停在 0：超支的部分账上已经记进 cost 了，没必要再让玩家看一个负数。 */
  state.现金 = Math.max(0, state.现金 - o.cost - 雇工费);
  const delta = applyEffect(state, o.effect);
  (o.flags || []).forEach(f => { state.flags[f] = true; });
  const 新图鉴 = unlock(state, o.codex);
  /* 晚上回宿舍 —— 这个决定到底对不对，你翻了资料才知道。
     翻不翻由你定：看了才记进 查过，"一季没翻过书"那块牌子才算数。 */
  const 查 = 查资料[`${d.term}-${optionIndex}`] || null;
  /* 记流水。放在最后记 —— 前头那些都要读 state，这里只读已经落定的数。 */
  (state.选择 || (state.选择 = [])).push({
    序: decisionIndex, term: d.term, title: d.title,
    /* ⚠ 阶段 也得记一笔 —— 日志屏拿它分组，顺带把"灌浆"这种行话
       跟白话一起印出来（见 段白）。原先只记 term，于是玩家在日志里
       看得到"立秋"，看不到"立秋属于灌浆期"，也就一直不知道灌浆是什么。 */
    阶段: d.阶段,
    下标: optionIndex, text: o.text, delta,
    cost: o.cost, 雇工费, 体力前, 体力: state.stamina,
  });
  return { text: o.result, note: o.note || null, delta, 查, 节气名: d.term,
           关: o.关 || null, 说: o.说 || null,
           前, 后: { ...state.stats }, 体力前, 体力: state.stamina, 花销: o.cost,
           雇工费, 缺口, 新图鉴 };
}

/* 分级线不是钉死的 —— 三条线会跟着年景整体挪。
   ⚠ 挪的是"米厂门口那条线"，不是田里的分。灌浆期低温、收获期淋雨、早霜，
   伤的都是**整精米率**（碾出来碎米多不多），而整精米率正是国标划级的那一项。
   所以"你田里种得怎么样"和"这一年算你几级"是两件事 —— 年景改的是后一件。
   为什么非得这么改：原来年景直接扣品质，玩家看到的是自己的数往下掉，
   只能认；改成挪线之后，是一样的账，但玩家能看见"今年要 90 不是 78"，
   于是那八格决策每一年要买到的品质点数都不一样了 —— 同一个决定，不同的一年，
   答案不同。这才是"选项对错看年景"真正落地的地方。 */
function gradeOf(quality, 移线) {
  移线 = 移线 || 0;
  let g = 等级表[0];
  等级表.forEach(x => { if (x.min > 0 && quality >= x.min + 移线) g = x; });
  return g;
}

/* ══════════════════════════ 田 —— 看得见的那一亩 ══════════════════════════
   这块图的唯一职责，是把"延迟后果"从一行字变成一眼就能看见的事：
   夏至灌了深水，当时田里什么反应都没有；立秋那天你回到田边，稻子倒了一片。
   读不读文字都无所谓 —— 你看见了。

   三个数字各管一层，不重复：
     生态 → 水色（清到能看见螺蛳，还是浑得发白膜）、有没有鸭子
     品质 → 叶色（正当绿，还是贪青黑绿）
     产量 → 稀不稀（缺苗的田，风一吹能看见地皮）
   年景管天。                                        */
const 阶段高 = { 苗期: 0.30, 分蘖: 0.52, 孕穗: 0.74, 灌浆: 0.90, 成熟: 1.00 };
let 已倒过 = false;    // 倒伏只演一次

/* ══════════════════════════ 家什 ══════════════════════════
   田埂上、稻丛里摆着的那些东西：簸箕、种袋、秧把、水口、稗草、药桶、
   化肥袋、镰刀、铁锹。它们不是装饰 —— **每一件都是那一屏里能点的一处**。

   为什么非得画出来，而不是把选项写成按钮上的字：
     「打除草剂」四个字，谁都点得下去；可田埂上立着个药桶、稻丛里插着一棵
     稗子，你得先认出哪个是稗子 —— 而"稗子没有叶舌和叶耳"正是小暑那一屏
     要教的东西。**画出来，知识就从一段话挪到了手上。**
   这是这一版全部的道理：选项长在田里，玩家才是蹲在田边上的人。

   画风跟田里已有的东西（蛙、螺、膜卷）一路：几个形状、平涂、不描阴影、
   锚点画在物体中心（热区的圆点要落在正中间，所以原点就是中心）。 */
const 家什 = {
  /* 簸箕 —— 谷雨·自家留的种，摊在里头晒 */
  簸箕: (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})">
    <ellipse cx="0" cy="6" rx="15" ry="2.4" fill="#5f6b58" opacity=".2"/>
    <path d="M-15 -2 q15 10 30 0 q-2 7.6 -15 7.6 q-13 0 -15 -7.6Z" fill="#c4a877"/>
    <path d="M-15 -2 q15 10 30 0" stroke="#9c8253" stroke-width="1" fill="none"/>
    <ellipse cx="0" cy="-1.6" rx="10.5" ry="3.2" fill="#dcc98e"/>
    <path d="M-6.5 -1.8 l1.5 -1.1 M-1.5 -2.4 l1.3 -1.1 M3.5 -2.2 l1.5 -1.1"
      stroke="#b8a468" stroke-width="1" stroke-linecap="round"/>
    </g>`,

  /* 种袋 —— 谷雨·原种站买来的新种。袋上那点红是"包过衣"（种衣剂） */
  种袋: (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})">
    <ellipse cx="0" cy="7" rx="11" ry="2.2" fill="#5f6b58" opacity=".2"/>
    <path d="M-9 6.4 V-4 q0 -6 9 -6 q9 0 9 6 V6.4Z" fill="#d9ceb5" stroke="#a89a7c" stroke-width="1"/>
    <path d="M-9 -4 q9 3.2 18 0" stroke="#a89a7c" stroke-width="1" fill="none"/>
    <path d="M-3.6 -9.6 q3.6 -2.6 7.2 0" stroke="#8a7f66" stroke-width="1.4" fill="none"/>
    <circle cx="0" cy="1.4" r="2.8" fill="#a84a35"/>
    </g>`,

  /* 换种袋 —— 谷雨·托老周从邻村换来的种。
     跟 种袋 是同一路东西，但两处不同：麻袋本色（没染过）、袋口系绳挂便条。
     最要紧的是**不点那粒红** —— 红是"包过衣"，而换来的常规种不包衣。 */
  换种袋: (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})">
    <ellipse cx="0" cy="7" rx="11" ry="2.2" fill="#5f6b58" opacity=".2"/>
    <path d="M-9.4 6.4 V-2.6 q0 -7 9.4 -7 q9.4 0 9.4 7 V6.4Z"
      fill="#cdbd97" stroke="#a2906a" stroke-width="1"/>
    <path d="M-9.4 1.6 q9.4 2.6 18.8 0" stroke="#a2906a" stroke-width=".8" fill="none"/>
    <path d="M-9.4 -2.6 q9.4 3 18.8 0" stroke="#a2906a" stroke-width="1" fill="none"/>
    <path d="M-4.6 -8.6 q4.6 -3.4 9.2 0" stroke="#8a7f66" stroke-width="1.4" fill="none"/>
    <path d="M-3.4 -6.6 q3.4 -2.4 6.8 0" stroke="#b8a97f" stroke-width="2.2" fill="none"/>
    <path d="M4.6 -6.2 l3 -2.6" stroke="#8a7f66" stroke-width=".9"/>
    <g transform="rotate(9 8 -9)">
      <rect x="4.4" y="-11.4" width="7.6" height="5.4" rx=".6"
        fill="#f4efe0" stroke="#c3bba2" stroke-width=".8"/>
      <path d="M5.8 -10.2 h4.8 M5.8 -8.9 h3.4" stroke="#b3a98e" stroke-width=".7"/>
    </g>
    </g>`,

  /* 膜卷 —— 立夏·盖膜。一卷没拆开的塑料膜 */
  膜卷: (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})">
    <ellipse cx="0" cy="6.5" rx="16" ry="2.6" fill="#5f6b58" opacity=".22"/>
    <rect x="-15" y="-5.5" width="30" height="11" rx="5.5" fill="#f4f8f5" stroke="#93a69a" stroke-width="1"/>
    <ellipse cx="15" cy="0" rx="3" ry="5.5" fill="#e3ebe5" stroke="#93a69a" stroke-width=".9"/>
    <ellipse cx="15" cy="0" rx="1.1" ry="2.2" fill="#b6c6bb"/>
    <path d="M-9 -5.5 v11 M-3 -5.5 v11" stroke="#d3ddd7" stroke-width=".8"/>
    </g>`,

  /* 秧铲 —— 芒种·灵感。铲秧用的：连土把秧端起来，根不断。
     这柄铲子是翻完那一晚的书才出现在田埂上的。 */
  秧铲: (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})">
    <ellipse cx="0" cy="7" rx="9" ry="2" fill="#5f6b58" opacity=".2"/>
    <path d="M0 -13 v9" stroke="#a8763f" stroke-width="2.6" stroke-linecap="round"/>

    <path d="M-7 -4 h14 v6.6 q-1.6 5.4 -7 5.4 q-5.4 0 -7 -5.4Z"
      fill="#b9c2c6" stroke="#87949a" stroke-width="1"/>

  /* 搪瓷盆 —— 大暑·灵感。拍查虫口用的：把稻丛往盆里一拍，数掉下来几只。
     白底蓝口的那种，埂上放一个，一眼就认得。 */
  搪瓷盆: (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})">
    <ellipse cx="0" cy="6.4" rx="10.5" ry="2.2" fill="#5f6b58" opacity=".2"/>
    <path d="M-11 -2 q11 12.4 22 0" fill="#eef1f2" stroke="#a9b4b8" stroke-width="1"/>
    <ellipse cx="0" cy="-2" rx="11" ry="3.6" fill="#f8fafa" stroke="#a9b4b8" stroke-width="1"/>
    <ellipse cx="0" cy="-1.5" rx="8.4" ry="2.4" fill="#dde5e7"/>
    <path d="M-11 -2 q11 -7.4 22 0" fill="none" stroke="#4a7fa8" stroke-width="1.7"/>

  /* 叶色卡 —— 立秋·灵感。一张比叶色的卡：四个格子，从浅绿到墨绿。
     老周是拿眼睛看，你拿卡比 —— 这就是"学生"和"老农"的分工。 */
  叶色卡: (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})">
    <ellipse cx="0" cy="8" rx="9" ry="2" fill="#5f6b58" opacity=".2"/>
    <g transform="rotate(-6)">
      <rect x="-12" y="-9" width="24" height="18" rx="1.6" fill="#f8f3e4"

      ${["#8aa35c", "#6a8f3e", "#48742c", "#2a4d1c"].map((c, i) =>
        '<rect x="' + (-10 + i * 5.4) + '" y="-6.4" width="4.6" height="7.4" rx=".8" fill="' + c + '"/>').join("")}
      <rect x="-10" y="2.8" width="20" height="1.6" rx=".8" fill="#c3bba2"/>
    </g>
    </g>`,

  /* 芽谷 —— 立夏·灵感。催出芽来的谷子，摊在浅竹匾里晾。
     白芽尖朝上 —— 三样东西里只有它是"还没落地的"。 */
  芽谷: (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})">
    <ellipse cx="0" cy="6.6" rx="11" ry="2.2" fill="#5f6b58" opacity=".2"/>
    <path d="M-11 -1.4 q11 9.6 22 0" fill="#d9c69c" stroke="#b3966a" stroke-width="1"/>

    <ellipse cx="0" cy="-1.2" rx="8.2" ry="2.5" fill="#d2bf90"/>
    ${[-7, -3.6, 0, 3.6, 7].map((d, i) => {
      const 斜 = (i - 2) * .85;
      const 尖 = `M${d} -2 q${斜} -3.4 ${斜 * 1.6} -6`;
      return `<path d="${尖}" stroke="#eef3e0" stroke-width="2.2" fill="none" stroke-linecap="round"/>`
        + `<path d="${尖}" stroke="#9dc267" stroke-width="1.1" fill="none" stroke-linecap="round"/>`;
    }).join("")}
    </g>`,

  /* 水尺 —— 夏至·灵感。插在泥里的一根木尺，露出水面的那截有几道刻痕。
     水位是这条线的意思：不要把水闷在上头，也不要让田干着。 */
  水尺: (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})">
    <ellipse cx="0" cy="8.6" rx="8" ry="2" fill="#5f6b58" opacity=".2"/>
    <rect x="-1.5" y="-19" width="3" height="27" rx=".9" fill="#e6d9b6"
      stroke="#b3a077" stroke-width=".8"/>
    <path d="M-1.5 -13.6 h3 M-1.5 -8.6 h3 M-1.5 -3.6 h3" stroke="#7d6a44" stroke-width="1.1"/>
    <path d="M-1.5 -17.6 h3" stroke="#a8442f" stroke-width="1.4"/>
    <path d="M-14 1.2 q14 3.4 28 0" stroke="#8fb6c9" stroke-width="1.5" fill="none"/>
    <path d="M-14 1.2 q14 3.4 28 0 v4.4 q-14 3.4 -28 0Z" fill="#a9cbdb" opacity=".5"/>
    </g>`,

  /* 空秆 —— 秋分·灵感。一根折过颈的稻秆，穗子低着头。
     捏在手里是瘪的 —— 虫早蛀空了，灌不进浆。 */
  空秆: (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})">
    <ellipse cx="0" cy="9" rx="10" ry="2.2" fill="#4a3d22" opacity=".26"/>
    ${["M-6 9 q2.4 -9.5 5 -16", "M-1 -7 q4.8 -1.4 8 -6.4"]
      .map((d, i) => `<path d="${d}" stroke="#f6efd8" stroke-width="${i ? 3.8 : 4.4}"
        fill="none" stroke-linecap="round"/>`).join("")}
    ${["M-6 9 q2.4 -9.5 5 -16", "M-1 -7 q4.8 -1.4 8 -6.4"]
      .map(d => `<path d="${d}" stroke="#6b5730" stroke-width="1.1"
        fill="none" stroke-linecap="round"/>`).join("")}
    /* 「空」就在这一笔：断口是个洞，一眼能看进去 */
    <ellipse cx="-1.1" cy="-6.6" rx="2.7" ry="1.5" fill="#3d3016"
      transform="rotate(-38 -1.1 -6.6)"/>
    <path d="M-4 1.6 q1.8 .7 3.4 0" stroke="#6b5730" stroke-width="1.2" fill="none"/>
    ${[-5.2, -2.6, 0, 2.6, 5.2].map(d =>
      `<path d="M${7 + d * .42} ${-13.4 + Math.abs(d) * .6} q${d * .8} 3.8 ${d * 1.1} 6.2"
        stroke="#f6efd8" stroke-width="2.6" fill="none" stroke-linecap="round"/>`).join("")}
    ${[-5.2, -2.6, 0, 2.6, 5.2].map(d =>
      `<path d="M${7 + d * .42} ${-13.4 + Math.abs(d) * .6} q${d * .8} 3.8 ${d * 1.1} 6.2"
        stroke="#6b5730" stroke-width=".75" fill="none" stroke-linecap="round"/>`).join("")}
    </g>`,

  /* 秧把 —— 芒种·今天插。扎好的一把秧，等着往田里插 */
  秧把: (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})">
    <ellipse cx="0" cy="6" rx="12" ry="2.2" fill="#5f6b58" opacity=".2"/>
    ${[-9, -4.5, 0, 4.5, 9].map(d =>
      `<path d="M0 5 Q${(d * .55).toFixed(1)} -2 ${d} -11" stroke="${Math.abs(d) > 6 ? "#5f9c42" : "#4b8434"}"
        stroke-width="2" fill="none" stroke-linecap="round"/>`).join("")}
    <path d="M-4.4 3.4 q4.4 -2.4 8.8 0" stroke="#b4915c" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    </g>`,

  /* 水口 —— 夏至·灌深水，处暑·早断水。三块闸板的水口，抽一块水就流 */
  水口: (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})">
    <ellipse cx="0" cy="7" rx="12" ry="2.2" fill="#5f6b58" opacity=".2"/>
    <rect x="-11" y="-9" width="22" height="16" rx="1.5" fill="#7f8a68"/>

    </g>`,

  /* 稗草 —— 小暑·人工薅。跟稻子几乎一样，差别是**没有叶舌叶耳**，
     叶脉发白、叶面光滑。所以这儿画得比稻子淡一档、叶子更披散。 */
  稗草: (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})">
    ${[-13, -4.5, 4, 12.5].map((d, i) =>

  /* 药桶 —— 小暑·除草剂，大暑·打药，白露·叶面肥。背的桶加一根喷杆 */
  药桶: (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})">

    <rect x="-8" y="-7" width="16" height="14" rx="3" fill="#dfe6da" stroke="#6e7f68" stroke-width="1.1"/>

  /* 化肥袋 —— 立秋·多施氮。白袋子，蓝标上一个 N */
  化肥袋: (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})">

    <path d="M-8 6.4 V-5 q0 -5 8 -5 q8 0 8 5 V6.4Z" fill="#e8e4d5" stroke="#a9a48d" stroke-width="1"/>

  镰刀: (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})">

    <path d="M-13 4 Q-14.4 -8.6 -0.6 -9.6" stroke="#c6cac3" stroke-width="3.4" fill="none" stroke-linecap="round"/>

  铁锹: (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})">

  沟: (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})">

    <path d="M-26 0 q26 7 52 0" stroke="#5c5943" stroke-width="1" fill="none"/>
    <rect x="-19" y="-1.4" width="38" height="2.6" rx="1.3" fill="#4f4c3a" opacity=".75"/>
    <path d="M-14 2.4 q6 1.6 12 0.6 M4 3 q6 1 11 -0.4" stroke="#7c7660" stroke-width="1.1"
      fill="none" stroke-linecap="round"/>
    </g>`,
};

/* ══ 年景画成天 ══
   参考图给的最大启发：手游用天表达状态。原来这儿只有三种天色，五张灾年卡
   共用同一种灰 —— 抬头看不出今年是什么年。

   每一层都是纯装饰：不动数值，不改判定，年景仍然只由那张明牌说了算。
   写在这儿而不是写进 年景池，是因为年景池是"规则"，这是"画"。 */

/* 雨丝 —— 斜的，不是竖的。位置用取模散开，不引随机数：
   同一个年景每次画出来得一样，不然截图的对比就没意义了。 */
const 落雨 = n => Array.from({ length: n }, (_, i) => {
  const x = (i * 37 + 11) % 332 - 8, y = (i * 23 + 5) % 118;
  return `<path d="M${x} ${y} l4.6 12" stroke="#ffffff" stroke-width=".75"`
    + ` opacity=".42" stroke-linecap="round"/>`;
}).join("");

/* 雨点砸在水面上的圈，一圈一圈荡开 */
const 涟漪 = 位 => 位.map(([x, y], i) =>
  `<ellipse cx="${x}" cy="${y}" rx="${5 + i * 1.1}" ry="${1.5 + i * .3}"`
  + ` fill="none" stroke="#ffffff" stroke-width=".7" opacity=".34"/>`).join("");

/* 霜 —— 一层白压在下半部，叶尖上挂几点没化开的 */
const 挂霜 = () => `<rect y="72" width="320" height="68" fill="#f4f8fa" opacity=".3"/>`
  + Array.from({ length: 16 }, (_, i) => {
      const x = (i * 41 + 7) % 320, y = 58 + (i * 17) % 54;
      return `<circle cx="${x}" cy="${y}" r="${(.9 + (i % 3) * .35).toFixed(2)}"`
        + ` fill="#ffffff" opacity=".6"/>`;
    }).join("");

/* 旱 —— 水位在掉：远山底下晒出一条泥，水线退下去。
   年景卡的原话是"水库的水位一直在掉"、"灌一次水两天就渗没了" ——
   画地裂是画错了重点，旱最先看见的是水浅了。 */
const 退水 = () => `<rect y="47" width="320" height="21" fill="#b5a67c"/>`
  + `<rect y="47" width="320" height="21" fill="url(#旱泥)" opacity=".55"/>`
  + `<path d="M0 68.5 q62 -3.4 132 -1.2 q88 2.6 188 -1.4" stroke="#8b7d55"`
  + ` stroke-width="1.3" fill="none" opacity=".85"/>`
  + [14, 52, 96, 140, 188, 236, 282].map((x, i) =>
      `<path d="M${x} 49 l${i % 2 ? 3.2 : -3.8} 5.4 l${i % 3 ? -2.4 : 3.2} 7.4"`
      + ` stroke="#8b7d55" stroke-width=".95" fill="none" opacity=".5"/>`).join("");

/* 寒 —— 冷色压一层，埂边留一片没化开的 */
const 压寒 = () => `<rect y="26" width="320" height="114" fill="#b9cfe0" opacity=".17"/>`
  + `<rect y="120" width="320" height="20" fill="#eef4f8" opacity=".38"/>`;

/* 晴 —— 好年：右上角一团柔光，一圈一圈叠出来的，没有硬边 */
const 放晴 = () => `<ellipse cx="288" cy="4" rx="126" ry="92" fill="#fff3c4" opacity=".17"/>`
  + `<ellipse cx="298" cy="0" rx="78" ry="58" fill="#fff8dc" opacity=".2"/>`
  + `<ellipse cx="306" cy="-4" rx="40" ry="31" fill="#fffdf0" opacity=".26"/>`;

const 年景天 = {
  秋淋:   { 天: ["#8d979c", "#c2cacc"], 山: ".62",
            层: () => 落雨(34) + 涟漪([[52, 62], [148, 74], [246, 58], [104, 96], [286, 88]]) },
  早霜:   { 天: ["#b6c4ce", "#eef3f5"], 山: ".5",  层: () => 挂霜() },
  凉夏:   { 天: ["#c4c9c4", "#d3d8d2"], 山: ".2",
            /* 连阴天：天色是平的（两头几乎同色），飘几丝悬着的细雨。
               跟秋淋分得开 —— 秋淋是砸下来的雨点加涟漪，这个是毛毛雨。 */
            层: () => `<rect y="14" width="320" height="126" fill="#e6e9e2" opacity=".3"/>`
                    + Array.from({ length: 15 }, (_, i) => {
                        const x = (i * 53 + 17) % 334 - 8, y = (i * 31 + 9) % 110;
                        return `<path d="M${x} ${y} l2 6.5" stroke="#ffffff"`
                          + ` stroke-width=".6" opacity=".32" stroke-linecap="round"/>`;
                      }).join("") },
  伏旱:   { 天: ["#d9d2ae", "#f8f5e2"], 山: ".34", 层: () => 退水() },
  倒春寒: { 天: ["#a6b4c0", "#dde6ea"], 山: ".55", 层: () => 压寒() },
  暖春:   { 天: ["#cfe2c6", "#fbfcf2"], 山: ".5",  层: () => "" },
  丰年:   { 天: ["#d3e6c8", "#fdfef6"], 山: ".55", 层: () => 放晴() },
  雨水匀: { 天: ["#cfe0d4", "#f8fbf4"], 山: ".55", 层: () => "" },
  暖秋:   { 天: ["#d9e3c2", "#fbfaf0"], 山: ".5",  层: () => 放晴() },
};

/* 这一屏是不是「田里点」那一屏 —— 热区得跟选项一一对应才算。
   ⚠ 这个判据原来在三个地方各写了一遍（田里点 / 结果屏 / 家什层），
     而第三处多写了半句 `|| screen === "event"`。于是事件屏上家什照画、
     可点的一个也没有 —— 玩家看着两个带光晕的物件，点下去没反应。
     实测 82% 的节气会先过一张事件屏，所以几乎每局都撞得到。
     现在三处共用这一个，写一遍就不会再漂。 */
const 大田屏 = d => !!(d && d.热区 && d.options && d.热区.length === d.options.length);

/* 选项上那行小字。注 允许写成 (S) => "..."，返回空串就是不印。
   ⚠ 提到一处来是因为两个屏都要印它（田里点的气泡、决策屏的按钮），
     各写一遍迟早会像 大田屏 那样漂掉。

   ⚠⚠ 字段名漂过：诊断那一屏（人事 / 午饭）读 o.小字，决策屏和田里点读 o.注，
      同一个东西两个名字。**在决策选项上写了 小字 = 白写**，一个字不出现，
      也不报错 —— v5.9 那五条新路就是这么一起哑掉的（五条写了五条没上屏）。
      现在两个名字都认，出口只有这一个。新写的用 注。 */
const 小字文 = (o, S) => {
  if (!o) return "";
  const v = o.注 !== undefined ? o.注 : o.小字;
  if (v === undefined || v === null) return "";
  const t = typeof v === "function" ? v(S) : v;
  return t || "";
};

/* ── 「这个字段可能是个数，也可能是个函数」的唯一出口 ──
   费 / 钱 / 象 / 回 / 说 / 补 都能写成函数，按当前状态现算（午饭那一组全是）。
   ⚠ 用户报的原话：「回食堂吃饭显示的是花费 NaN 元」。
     根子就是**两处读同一个字段，只有一处认函数**：
       onTreat 里那处（点下去扣多少钱）→ 认，是 `解()`；
       渲染按钮那处（按钮上印什么）→ 不认，直接读 o.钱。
     函数是真值，于是按钮上印出「掏 NaN 元」（yuan(函数) → Number(函数) → NaN）。
     ⚠ 这个错特别难看出来，因为**同一条选项里别的字都正常**，
       而且不报错、不进日志，只有那一行数字变成 NaN。
       所以出口收成一个（这儿），两边都走它 —— 跟 小字文 是同一个道理。
   ⚠ 时机：渲染时算的是"点之前"的状态，点下去时算的是"改之前"的状态
     （onTreat 那一段的长注释讲过为什么），两边读到的必须是同一份，
     不然就又会出现"数字说颐园、散文说和园"那种打脸。 */
const 算 = (v, S) => (typeof v === "function" ? v(S) : v);
const 算数 = (v, S) => 算(v, S) || 0;

const 注文 = (o, S) => {
  const t = 小字文(o, S);
  return t ? `<span class="sz">${esc(t)}</span>` : "";
};

/* 有人说两句的那一屏。story.text 允许写成 (S) => "..." ——
   老周那句评语得看着簸箕里那袋种说：种档是「壮」还是「劣」，
   他要说的话不是一句。（跟 effect 一个路子，见 applyEffect。） */
const 说话 = d => {
  if (!d || !d.story) return "";
  const t = typeof d.story.text === "function" ? d.story.text(S) : d.story.text;
  return `<div class="say"><span class="who">${esc(d.story.who)}</span>${para(t)}</div>`;
};

function 田的画(S) {
  const e = S.stats.ecology, q = S.stats.quality, h = S.stats.harvest;
  const 割了 = S.termIndex >= S.节气.length;
  const 段 = 割了 ? "成熟" : ((S.节气[S.termIndex] || {}).阶段 || "成熟");
  const 倒 = !!S.codex["倒伏"];
  const 新倒 = 倒 && !已倒过;
  if (倒) 已倒过 = true;
  const k = (阶段高[段] || 1) * (割了 ? 0.20 : 1);      // 收完只剩稻桩

  /* 天看年景 —— 先按名字找，找不到再退回三色（平年那种没什么可画的） */
  const 年色 = S.年景 ? S.年景.色 : "";
  const 今景 = 年景天[S.年景 ? S.年景.名 : ""];
  const 天 = 今景 ? 今景.天
          : 年色 === "d" ? ["#a7aeae", "#d2d6d0"]
          : 年色 === "a" ? ["#cadfc4", "#f6f9ee"]
          : ["#bccfc8", "#e9efe4"];
  /* 水看生态 */
  const 水 = e >= 85 ? "#a9c9bb" : e >= 70 ? "#9cb8a6" : e >= 50 ? "#93a08c"
           : e >= 32 ? "#8b917f" : "#858878";
  /* 叶看品质 —— 熟了不看品质，一片金 */
  const 熟 = 割了 || 段 === "成熟";
  const 叶 = 熟 ? "#c8a03c" : q >= 78 ? "#63a04b" : q >= 62 ? "#579041"
           : q >= 45 ? "#3d7030" : "#274d1f";
  const 穗色 = 熟 ? "#dcbb52" : 段 === "灌浆" ? "#a8b95c" : 叶;
  const 稀 = h < 700;

  const 丛 = [];
  /* 三排 —— 远排小、淡、密；近排大、实、疏。站田埂上往前看就是这个样子。 */
  const 排 = [
    { y: 58, s: 0.50, n: 13, 淡: 0.34, w: 1.5 },
    { y: 84, s: 0.76, n: 11, 淡: 0.14, w: 1.9 },
    { y: 116, s: 1.08, n: 9, 淡: 0, w: 2.4 },
  ];
  排.forEach((R, ri) => {
    const 步 = 320 / R.n;
    for (let i = 0; i < R.n; i++) {
      /* 缺苗要成片地缺，不能均匀地少几株 —— 那样看不出来。
         按段跳，前排缺得最明显：风一吹能看见地皮。 */
      const 段位 = Math.floor(i / 3);
      if (稀 && (ri === 2 ? 段位 % 2 === 0 : ri === 1 ? 段位 % 3 === 1 : false)) continue;
      const x = 步 * (i + 0.5) + (ri % 2 ? 步 * 0.5 : 0);
      if (x > 318) continue;
      const 高 = 84 * R.s * k;
      /* 叶片从基部往两边撇开，越靠外的越短 —— 一丛就该是这个形状 */
      const 叶片 = [-17, -8, 0, 8, 17].map(偏 => {
        const hh = 高 * (1 - Math.abs(偏) / 34), dx = 偏 * 0.62;
        return `<path d="M${x.toFixed(1)} ${R.y} Q${(x + dx * 1.8).toFixed(1)} ${(R.y - hh * 0.58).toFixed(1)} `
             + `${(x + dx).toFixed(1)} ${(R.y - hh).toFixed(1)}" stroke="${叶}" stroke-width="${R.w.toFixed(1)}" `
             + `fill="none" stroke-linecap="round"/>`;
      }).join("");
      /* 灌浆之后穗才压出来：一截粗的、往外垂的，熟了是金的 */
      const 有穗 = !割了 && (段 === "灌浆" || 段 === "成熟");
      const 穗 = 有穗 ? [-17, 0, 17].map(偏 => {
        const hh = 高 * (1 - Math.abs(偏) / 34), dx = 偏 * 0.62, d = 偏 >= 0 ? 1 : -1;
        const 垂 = 段 === "成熟" ? 1.6 : 0.7;                    // 越熟垂得越狠
        return `<path d="M${(x + dx).toFixed(1)} ${(R.y - hh).toFixed(1)} `
             + `q${(d * 3).toFixed(1)} ${(垂 * 3).toFixed(1)} ${(d * 7).toFixed(1)} ${(垂 * 5).toFixed(1)}" `
             + `stroke="${穗色}" stroke-width="${(R.w * 1.7).toFixed(1)}" fill="none" stroke-linecap="round"/>`;
      }).join("") : "";
      /* 倒伏：前排基本全躺下，中排倒七成，后排还立着 —— 像风从前面扫过去 */
      const 这株倒 = 倒 && (ri === 2 || (ri === 1 && i % 4 !== 0) || (ri === 0 && i % 5 === 2));
      const cls = 这株倒 ? (新倒 ? "clump fall" : "clump lie") : "clump";
      const st = 这株倒 ? ` style="--lie:${(58 + (i % 5) * 6).toFixed(0)}deg"` : "";
      丛.push(`<g class="${cls}"${st} opacity="${(1 - R.淡).toFixed(2)}">${叶片}${穗}</g>`);
    }
  });

  /* ── 田里的活物 ──
     画什么必须跟田的样子()那几句话对得上，而且只能画玩家自己弄出来的东西：
       · 鸭子 ← 是「大暑 赶鸭子下田」那一步的结果，不是生态的赠品。
                没走那步，生态再高也不该冒出一只鸭 —— 那是游戏在撒谎。
       · 青蛙 / 螺蛳 / 小虫 ← 生态养出来的，水越干净越多。
                生态掉到 50 以下，文案写的是"没什么活物"，那就一只都不画。 */
  const 有鸭 = !!(S.flags && S.flags["稻鸭"]);
  const 蛙数 = e >= 85 ? 3 : e >= 70 ? 2 : 0;

  /* ── 膜 ──
     立夏那一步选了什么，田里就得看出来。这是"点了有反应"最要紧的一处：
     你点了那摞膜，膜就真的盖在秧上；你点了空地，那就是空着。
     只在苗期画 —— 芒种插秧一翻，膜就该撤了，留着是穿帮。 */
  const 苗期 = !割了 && 段 === "苗期";
  const 盖了膜 = !!(S.flags && S.flags["盖膜"]) && 苗期;
  const 今 = (S.节气[S.termIndex] || {});

  /* ── 家什层 ──
     这一屏能点的那几件东西，按热区的坐标摆出来。
     ⚠ 只在"还没动手"的那一屏摆。翻到结果屏就该没了 —— 家什已经动过了，
       还杵在埂上就是穿帮。判据用 screen，因为 termIndex 到结果屏还没往前走。
     ⚠ 一件家什只有一个出处：热区数据。画在哪儿、点在哪儿，是同一个 x/y。
       以前膜卷是单独写死的（画在 266,122，热区写 266,118），差那 4 点，
       圆点就没落在膜卷上 —— 这种"两处各写一遍"的东西迟早会错开。 */
  /* ⚠ 只认 decision。事件屏由 viewEvent 经 hud(true) 画田，
     那儿**没有 .hot** —— 家什画出来就是给人白点的。 */
  const 待动手 = 大田屏(今) && screen === "decision";
  /* ⚠ 这里按**热区下标**取家什，所以得跟 有位() 走同一份表：
     没翻过那晚的书，那件东西就不该先长在田里 —— 看见了却点不着，比不画更难受。 */
  const 家什层 = 待动手
    ? 有位(今).map(i => {
        const h = 今.热区[i];
        return h && h.画 && 家什[h.画]
          ? `<g class="shi s${i}">${家什[h.画](h.x, h.y, h.尺 || 1.5)}</g>` : "";
      }).join("")
    : "";

  /* 田埂 —— 你站的地方。青蛙蹲在上头，螺蛳爬在边上，白膜也积在这儿。 */
  const 埂色 = e >= 70 ? "#93a06d" : e >= 50 ? "#8b916a" : "#88885f";
  const 埂 = `<path d="M0 126.5 q56 -3.6 112 -1.4 q78 3 208 -1.4 V140 H0Z" fill="${埂色}"/>`
    + `<path d="M0 126.5 q56 -3.6 112 -1.4 q78 3 208 -1.4" stroke="#ffffff" stroke-width="1"`
    + ` fill="none" opacity=".25"/>`;

  /* 青蛙：宽身子 + 两只鼓在头顶的眼睛，这个剪影一眼就认得出 */
  const 蛙 = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})">`
    + `<ellipse cx="0" cy="0" rx="7.2" ry="4.2" fill="#6f9a38"/>`
    + `<path d="M-6.4 2 l-3.6 1.8" stroke="#6f9a38" stroke-width="2.6" stroke-linecap="round"/>`
    + `<path d="M6 1.8 l3.2 1.6" stroke="#6f9a38" stroke-width="2" stroke-linecap="round"/>`
    + `<circle cx="-2.4" cy="-4" r="2.3" fill="#7cab41"/><circle cx="2.6" cy="-4.2" r="2.1" fill="#7cab41"/>`
    + `<circle cx="-2.4" cy="-4" r="1.05" fill="#2b3026"/><circle cx="2.6" cy="-4.2" r="0.95" fill="#2b3026"/>`
    + `<path d="M-4.6 -0.6 q4.6 -2 9.2 0" stroke="#5b8030" stroke-width="0.8" fill="none" opacity=".75"/>`
    + `</g>`;
  const 蛙位 = [[64, 131.5, 1.15], [172, 134, 0.9], [258, 131, 1.05]].slice(0, 蛙数);

  /* 螺蛳：贴着泥走。这个尺寸上画不成螺壳，就一小坨带点反光的深色 */
  const 螺 = (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})">`
    + `<ellipse cx="0" cy="0" rx="3.4" ry="2.4" fill="#6b6250"/>`
    + `<path d="M-1.6 0.3 q1.8 -1.9 3.4 -0.5" stroke="#a99e86" stroke-width="0.9" fill="none"/>`
    + `</g>`;
  const 螺位 = [[27, 131], [124, 133], [213, 130.6], [296, 132.4]];

  /* 小虫：水黾。水面上一排小黑点，带几道划水的腿 */
  const 虫 = (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})">`
    + `<ellipse cx="0" cy="0" rx="2.4" ry="1" fill="#3c4432" opacity=".85"/>`
    + `<path d="M-1.4 0.6 l-2.4 1.8 M1.4 0.6 l2.4 1.8 M0 0.6 l0 2.2" stroke="#3c4432"`
    + ` stroke-width="0.55" fill="none" opacity=".7"/></g>`;
  const 虫位 = [[46, 104], [150, 96], [232, 110], [292, 100]];

  /* 水里那一层，画在稻子后头 */
  let 水里 = "";
  if (有鸭) {
    水里 += `<g opacity=".95"><ellipse cx="58" cy="78" rx="13" ry="6.6" fill="#fdfcf6"/>`
      + `<circle cx="71" cy="71.6" r="4.4" fill="#fdfcf6"/><path d="M75 71.6 l5.4 -1.7" stroke="#d09a2c" stroke-width="2.4"/>`
      + `<path d="M46 78 q-4 -3 -1 -6" stroke="#e6e2d2" stroke-width="2" fill="none"/></g>`
      + `<g opacity=".92"><ellipse cx="252" cy="90" rx="11" ry="5.6" fill="#f9f7ee"/>`
      + `<circle cx="263" cy="84.4" r="3.8" fill="#f9f7ee"/><path d="M266.6 84.4 l4.6 -1.5" stroke="#d09a2c" stroke-width="2"/>`
      + `<path d="M242 90 q-3.6 -2.6 -1 -5.2" stroke="#e6e2d2" stroke-width="1.8" fill="none"/></g>`;
  }
  if (e >= 70) 水里 += 虫位.map(([x, y]) => 虫(x, y)).join("");
  if (e < 32) {
    /* 白膜积在埂边 —— 文案说的就是"田埂边积着一层白膜"，那它就得贴着埂 */
    水里 += `<rect x="48" y="112" width="126" height="2.2" fill="#eceae0" opacity=".55"/>`
      + `<rect x="192" y="104" width="98" height="2.4" fill="#eceae0" opacity=".4"/>`
      + `<rect x="0" y="122" width="320" height="3.8" fill="#eceae0" opacity=".85"/>`;
  }
  /* 天那一层 —— 压在稻子上头、田埂下头。雨是下在稻子上的，
     可你站的这道埂在雨里头，埂上的家什得能看清，所以天气不盖住近前。 */
  const 天气层 = 今景 && 今景.层 ? 今景.层() : "";

  /* 田埂和它上头的东西压在最前面 —— 那是离你最近的一层 */
  const 近前 = 埂
    + (e >= 85 ? 螺位.map(([x, y]) => 螺(x, y)).join("") : "")
    + 蛙位.map(([x, y, s]) => 蛙(x, y, s)).join("")
    + 家什层;   // 家什压在最上头 —— 它得能一眼看见，不然不知道点哪儿

  /* 膜盖在稻子上头 —— 画在最后，把稻子罩住。半透的，因为本来就是"看得见里头"。
     拱条是竹片，京西稻育秧真用的是竹片弯的拱。 */
  const 膜层 = 盖了膜
    ? `<path d="M2 140 V68 q0 -11 11 -11 H307 q11 0 11 11 V140Z" fill="#eff6f1" opacity=".34"/>`
      + [26, 74, 122, 170, 218, 266, 300].map(x =>
          `<path d="M${x} 140 V68" stroke="#7e9488" stroke-width="1" opacity=".34"/>`).join("")
      + `<path d="M2 140 V68 q0 -11 11 -11 H307 q11 0 11 11 V140" fill="none"
           stroke="#b9cbc0" stroke-width="1.3" opacity=".85"/>`
      + `<path d="M8 74 q152 -16 304 0" stroke="#ffffff" stroke-width="2.4" fill="none" opacity=".5"/>`
      + `<text x="12" y="64" font-size="9" fill="#5d7268" opacity=".9">膜 底 下</text>`
    : "";

  /* ── 棚架 ──
     苗期那层膜画的是"蒙着膜"，这一层画的是"膜撕了、架子还杵着"。
     玩家选了"不拆"，那这件事就得在田里看得见 —— 不然它只是账上一行字。
     ⚠ 稻丛已经画完了，这层补不了"棚底下那分地长得矮"，
       所以用一条压暗的带子代过去，跟文字里说的"矮半头"是一处。 */
  const 棚没拆 = !!(S.flags && S.flags["盖膜"] && S.flags["棚-没拆"]) && !苗期;
  const 棚架层 = 棚没拆
    ? `<g>
        <rect x="0" y="52" width="112" height="88" fill="#3f4a3a" opacity=".15"/>
        ${[12, 42, 72, 100].map(x => `<path d="M${x} 140 V72 q0 -10 10 -10" stroke="#8d7c56" stroke-width="1.7" fill="none" opacity=".92"/>`).join("")}
        <path d="M112 140 V72 q0 -10 -9 -10" stroke="#8d7c56" stroke-width="1.7" fill="none" opacity=".92"/>
        <path d="M12 68 H104" stroke="#8d7c56" stroke-width="1.2" fill="none" opacity=".6"/>
        <path d="M42 140 V80 M42 84 q7 -5 13 -1" stroke="#9c8a63" stroke-width="1.1" fill="none" opacity=".75"/>
        <path d="M100 92 q-5 6 -1 13" stroke="#eef4ef" stroke-width="1.4" fill="none" opacity=".5"/>
        <text x="10" y="60" font-size="9" fill="#6d7861" opacity=".9">棚 还 立 着</text>
      </g>`
    : "";

  return `<svg class="tian" viewBox="0 0 320 140" role="img"
      aria-label="你的田：${esc(段)}，生态 ${e}，品质 ${q}，产量 ${h} 斤${倒 ? "，已倒伏" : ""}">
    <defs><linearGradient id="tianSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${天[0]}"/><stop offset="1" stop-color="${天[1]}"/>
    </linearGradient>
    <linearGradient id="旱泥" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c8b5e"/><stop offset="1" stop-color="#cbbd92"/>
    </linearGradient></defs>
    <rect width="320" height="46" fill="url(#tianSky)"/>
    <path d="M0 44 q42 -13 88 -4 q44 9 82 -2 q58 -13 150 5 v9 H0Z" fill="#7d8f72" opacity="${今景 ? 今景.山 : (年色 === "d" ? ".42" : ".58")}"/>
    <rect y="46" width="320" height="94" fill="${水}"/>
    <rect y="46" width="320" height="1.8" fill="#ffffff" opacity=".3"/>
    ${水里}
    ${丛.join("")}
    ${天气层}
    ${近前}
    ${棚架层}
    ${膜层}
  </svg>`;
}

/* 田的样子 —— 把干瘪的数字翻译成"你现在看到什么" */
function 田的样子(S) {
  const { ecology: e, quality: q, harvest: h } = S.stats, out = [];
  if (e >= 85) out.push("田水清，看得见螺蛳贴着泥走。天一黑，蛙声一大片。");
  else if (e >= 70) out.push("田埂上能碰见青蛙，水里也有小虫在游。");
  else if (e >= 50) out.push("田里不算脏，可也没什么活物。土踩上去是实的。");
  else if (e >= 32) out.push("土有点板。蹲下去翻，蚯蚓少见。");
  else out.push("水发浑，田埂边积着一层白膜。田里静得吓人，一声虫叫都没有。");

  /* 画里有鸭子，字里就得有 —— 两边对不上，比不画还糟 */
  if (S.flags && S.flags["稻鸭"]) out.push("鸭子还在秧行间一趟一趟地趟。");

  if (q >= 78) out.push("叶片挺，颜色正，秆子捏着硬。");
  else if (q >= 62) out.push("长势中规中矩，看不出什么毛病。");
  else if (q >= 45) out.push("叶色偏深，有点贪青，剑叶还黑绿着不褪。");
  else out.push("叶子黑绿得发亮，秆子捏着发软，基部节间拉得老长，长得太猛了。");

  if (h >= 1100) out.push("稻子密，人走进去要拨开。");
  else if (h <= 600) out.push("田里稀，风一吹能看见地皮。");
  return out.join("");
}

function 验米(state) {
  const g = gradeOf(state.stats.quality, state.移线);
  let 眼力;
  if (g.名 === "特级") 眼力 = "抓一把摊在手心，米粒匀、透亮，没白肚。他捏了几粒放进嘴里嚼，点了点头，没说话。";
  else if (g.名 === "一级") 眼力 = "摊开看了看，米是好米，就是有几粒不太匀。他说：够得上一级。";
  else if (g.名 === "二级") 眼力 = "捏起来搓了搓，穗上带下来的青粒不少。他皱了皱眉：按二级走吧。";
  else 眼力 = "他抓了一把，看了看就放下了：这米，按商品粮收吧，进不了等级。";
  /* 线挪过就必须说清楚 —— 不说，玩家只会觉得"我明明跟去年种得一样"。
     这一句是"年景改的是验米的那条线，不是你田里的米"真正落地的地方。 */
  const 移 = state.移线 || 0, 二线 = 等级表[1].min;
  if (移 > 0)
    眼力 += `\n他没急着报价，先把米倒进量器又碾了一道：「不是你的米不好，今年这天，籽粒不实，整精米率上不去。往日里 ${二线} 分就够二级，今年得 ${二线 + 移}。」`;
  else if (移 < 0)
    眼力 += `\n他碾了一道，抬头说：「今年这米实。整精米率高，往常二级要 ${二线} 分，今年 ${二线 + 移} 就够。」`;
  return { grade: g, 眼力 };
}

function 年终(state) {
  /* ⚠ 米价补 —— 碾得轻还是碾得重，卖相不一样，价钱也不一样（见 建后段 碾米那屏）。
     1 是"正常碾法"。碾轻了出米多、可米糙；碾重了出米少、可米白。
     乘在这儿，礼盒 / 直销 / 原粮三条路一起受影响 —— 因为它改的是**米本身**。 */
  const g = gradeOf(state.stats.quality, state.移线),
        米价 = Math.round(g.价 * (state.米价补 || 1) * 100) / 100;
  const 行情 = state.行情 || { 原粮: 1, 礼盒: 1 };
  const 谷价v = Math.round(米价 * NUM.原粮折扣 * NUM.出米率_代碾 * 行情.原粮 * (state.谷价补 || 1) * 10) / 10;
  const 已卖谷 = state.soldGrain, 留谷 = state.grain - 已卖谷;
  const 米 = Math.round(留谷 * state.rate);

  /* 牌子 —— 生态养得好不好，直接决定人家买不买你的账。
     礼盒能吃下多少、认养能签出多少份，都乘这个系数。 */
  const 牌 = 牌子(state.stats.ecology);
  /* 名望在这里算 —— 它要等级和账本，只有这儿有。
     口碑乘在三产上（认养、研学），礼盒那边不乘。 */
  const 望 = 算名望(state, g);
  const 碑 = 口碑(望.前);

  /* 认养的人要兑米 —— 那部分米不能再卖一遍 */
  let 兑米 = 0, 份 = 0, 人 = 0, 三产 = 0, 三产说明 = "田闲着，一分钱没挣";
  if (state.third !== "无") {
    /* 生态不挡人，只压量：30 分以下没人愿意来，往上越养越多 */
    const 系数 = clamp((state.stats.ecology - 30) / 50, 0, 1.25);
    if (state.third === "认养") {
      /* ⚠ 份数封顶在 NUM.认养份数（8 份）里，另加一层浮动。
         用户原话：「认领也太赚钱了，几乎每次刷到必定赚大钱」。
         原来写的是 份 = 8 × 系数 × 牌 × 碑 —— 生态满、名望高的时候
         能冲到 15 份，一亩地认出去 22500 元，比整季二产还多，
         而且零成本零风险。
         真实的那条线是**这块田就这么大**：一亩地认 8 份、兑 160 斤米，
         到头了。牌子（生态）和口碑（名望）该决定的是"能不能凑满 8 份"，
         不是"能超卖到几份"—— 超卖的那部分你兑不出米，是空头。
         再加一层浮动：今年到底有多少人愿意认，本来就没准，
         年年都正好是 8 份才叫假。0.75~1.25 之后，能拿满 8 份是运气好的年。 */
      份 = Math.round(NUM.认养份数 * Math.min(1, 系数 * 碑) * (0.75 + Math.random() * 0.5));
      份 = Math.max(0, Math.min(份, NUM.认养份数, Math.floor(米 / NUM.认养兑米)));
      兑米 = 份 * NUM.认养兑米;
      三产 = Math.round(份 * NUM.认养单价);
      三产说明 = `${份} 份被认养，兑出去 ${兑米} 斤米`;
    } else {
      人 = Math.round(NUM.研学人数 * 系数 * 牌 * 碑);
      三产 = Math.round(人 * NUM.研学单价);
       if (人 < 1) { 人 = 0; 三产说明 = "田里没什么可看的，没人来"; }
      else 三产说明 = `${人} 人次来研学`;
    }
  } else if (state.third !== "无") 三产说明 = "生态没养起来，没人愿意来";

  /* ── 三产之后，米还剩多少 ── */
  const 可售米 = Math.max(0, 米 - 兑米);

  /* ── 二产：两条路抢同一笔现金 ──
     礼盒要现钱买包装（12 元/斤），加工要现钱付加工费（8 元/斤）——
     手头的钱就这么多，铺了这边就铺不了那边。这是"本钱"真正咬人的地方。
     铺不下去的米不烂在仓里，最后按原粮价卖给粮库 —— 认赔，但认得明明白白。
     闸门顺序：① 等级给的市场容量　② 牌子（生态）　③ 行情　④ 兜里的现金 */
  /* ⚠ 判据从 rate >= 自碾率 换成显式的 自碾 标记。
     原来那个写法靠数比大小 —— 现在代碾率是会浮动的（机况），
     碾轻还能再 +4 个点，迟早会飘到 0.66 上头去，那时候"没买设备"的人
     也吃上了"地头现碾鲜米"的加成。数比大小是会把两件事绑在一起的，
     显式标记才是各说各的。 */
  const 现碾 = state.自碾 ? NUM.自碾礼盒加成 : 1;   // 自己碾的才叫"现碾鲜米"
  /* ── 盒子怎么装（大雪那屏的第二层）──
     没进过第二层的（压根没走到那一屏）拿 成品，
     也就是**改这一版之前的样子** —— 第二层是加上去的，不是把原来那条路换掉。 */
  const 盒 = 盒款[state.盒] || 盒款.成品;
  const 礼盒上限 = Math.min(可售米, Math.round(g.礼盒 * 牌 * 行情.礼盒 * 现碾 * 盒.量));
  let 现金 = Math.max(0, state.现金);
  let 礼盒量 = 0, 加工量 = 0, 直销量 = 0;
  if (state.channel === "礼盒" || state.channel === "混合") {
    礼盒量 = Math.min(礼盒上限, Math.floor(现金 / 盒.价));
    现金 -= 礼盒量 * 盒.价;
  }
  /* ── 直销：自己拉进城，一家一家问 ──
     用户原话：「凭什么一直只能礼盒和酒厂，选项太少且太死」。
     它跟礼盒最不一样的地方是**一分钱不垫**，所以不归现金那一关管。
     管它的是名望：一户人家肯买你一袋米，是因为听过你这一亩的名字。
     再一个天花板是"你就一个人一辆车"——可售米的七成五，
     跑不过来的那部分，按原粮价卖给粮库（认赔，但认得明白）。

     ⚠ 第二层（进 直层 挑的走法）改的是**乘数**，不是另起一套算法。
       摆摊走量、跑馆走不动，都是在上面那个"一个人一辆车"的底子上乘。
       没进过第二层的（没走到那一屏 / 直接关掉）拿 敲门 = ×1，就是原来的样子。 */
  const 直 = state.直 || "敲门";
  const 直乘 = 直 === "摆摊" ? NUM.直销摊乘 : 直 === "跑馆" ? NUM.直销馆乘 : 1;
  const 直价 = 直 === "摆摊" ? NUM.直销摊价 : 直 === "跑馆" ? NUM.直销馆价 : 1;
  if (state.channel === "直销") {
    直销量 = Math.max(0, Math.min(可售米,
      Math.round(Math.min(可售米, Math.round((望.前 || 0) * 2), Math.round(可售米 * 0.75)) * 直乘)));
  }
  const 余米 = Math.max(0, 可售米 - 礼盒量 - 直销量);
  /* ── 跟酒厂怎么谈（大雪那屏的第二层）──
     ⚠ 赊账这一条是这个第二层里最有嚼头的一条：它动的是**现金那一关**，
       而"本钱咬人"正是二产这一层的全部张力（见上头那段"两条路抢同一笔现金"）。
       一斤少挣 1 元，换的是"有多少米他就收多少米"，不再看你兜里剩多少。 */
  const 赊账 = state.酒 === "赊账";
  const 酒价 = state.酒 === "名头" ? NUM.酒名望价
             : 赊账 ? NUM.深加工价 - NUM.酒赊贴 : NUM.深加工价;
  if (state.channel === "混合" || state.channel === "深加工") {
    加工量 = 赊账 ? 余米 : Math.min(余米, Math.floor(现金 / NUM.深加工费));
  }
  const 原粮量 = 余米 - 加工量;                    // 装不起也加工不起的，走原粮
  /* ⚠ 开版费只在**真装了盒**的时候才掏。一斤没装盒也扣 600 块，
     那不叫选择，那叫陷阱 —— 玩家点"看看"都要付钱。 */
  const 包装费 = Math.round(礼盒量 * 盒.价) + (礼盒量 > 0 ? 盒.费 : 0);
  const 加工费 = Math.round(加工量 * NUM.深加工费);
  /* ⚠ 二产这**一个数**底下是三条路。原来结算屏上那条"钱是从哪条路上来的"
     横条写死叫「二产 · 礼盒」，v 却取的是 二产 整个 —— 玩家一斤盒没装、
     全拉进城卖了，横条上照样写「二产 · 礼盒 100%」。用户原话：
     「我拉进城里卖米…赚的还是礼盒的钱」。数没错，是标签把三笔钱认成了一笔。
     所以在这儿拆成三个数，让横条按实际构成画（见 viewYearEnd 的 源）。
     ⚠ 拆开各自取整再相加，跟原来一次取整会差 ±1 元 —— 换来的是底账那几行
       加起来**正好等于**二产，玩家拿计算器敲得平。这个更值。 */
  const 礼盒钱 = Math.round(礼盒量 * 米价 * 盒.溢);
  const 直销钱 = Math.round(直销量 * 米价 * NUM.直销溢价 * 直价);
  const 加工钱 = Math.round(加工量 * 酒价);
  const 二产 = 礼盒钱 + 直销钱 + 加工钱;
  /* 一产 = 立冬提前卖掉的谷（按斤谷算）+ 年末没装盒的米（按斤米算）。
     ⚠ 两者单位不同：谷价是「元/斤谷」，原粮量是「斤米」——
       一斤米要 1/出米率 斤谷才碾得出来，所以米的原粮价 = 米价 × 0.7。 */
  const 原粮价 = 米价 * NUM.原粮折扣 * 行情.原粮;
  const 一产 = Math.round(已卖谷 * 谷价v + 原粮量 * 原粮价);

  /* 大寒那一步 —— 都是小钱，但让这一年收得有个人味儿 */
  const 额外 = state.额外 || 0;
  const 毛收入 = 一产 + 二产 + 三产 + NUM.粮补 + 额外;
  const 成本 = state.cost + 包装费 + 加工费;
  /* 手上的结余存进档里 —— 下一季开局按两成带过去。
     就存在这儿：账已经算完了，数不会再变；年终() 一局只跑一次。 */
  /* ⚠ 种档按**不挪线**的等级算（gradeOf(..., 0)）。
     年景挪线挪的是"今年米厂门口那条线"，挪的是收购标准，不是米本身。
     籽粒实在不实在，跟今年线划在哪儿没关系 —— 留种留的是谷子。 */
  /* 名望和印象也一并落下。印象在 onTreat 里已经存过（那一手改完就存），
     这里再存一次是**兜底**：万一半路出岔子，年终这一趟是全季最后一次机会。
     名望只能在这儿存 —— 它的三个输入到这里才齐。 */
  存档({ 存: Math.round(现金), 种: gradeOf(state.stats.quality, 0).名,
          名望: 望.合计, 印象: { ...(state.印象 || {}) },
          厨艺: state.厨艺 || 0, 蹭饭: state.蹭饭 || 0,
          食堂: state.食堂 || 0,
          问周总: (state.问周总 || 0) + (state.问周 || 0),
          /* 这一季的账本整本抄下来，下一季当 state.旧 用。
             ⚠ 只在这一处抄。中途抄的话，一个还没走完的季会盖掉上一季的记忆 ——
               而那正是"我上一季到底干了什么"唯一的来源。 */
          前事: { ...state.flags } });
  return { grade: g, 米价, 谷价: 谷价v, 牌, 碑, 望, 行情, 米, 已卖谷, 留谷, 兑米, 可售米,

           礼盒钱, 直销钱, 加工钱, 直销单价: Math.round(米价 * NUM.直销溢价 * 直价 * 100) / 100,
           直, 门路: 望.门路,
