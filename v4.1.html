<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2efe4">
<title>一亩稻</title>
<style>
  :root{
    --paper:#f2efe4; --card:#fffdf6; --ink:#282c22; --dim:#8a8574;
    --green:#41603a; --green-d:#2b3f26; --gold:#a87d24; --gold-l:#f7efd8;
    --line:#ddd6c2; --bad:#9e4029; --good:#37623f; --clay:#8a6b4a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;min-height:100%}
  body{
    background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:17px;line-height:1.85;-webkit-font-smoothing:antialiased;
    display:flex;justify-content:center;
  }
  #app{width:100%;max-width:520px;min-height:100vh;min-height:100dvh;
    padding:24px 22px 40px;display:flex;flex-direction:column}

  /* 手机上选项在下面，数值在上面，翻下去看选项就看不见数了。
     所以这一条钉在顶上 —— 你读选项的时候，账一直摆在眼前。 */
  .hud{position:sticky;top:0;z-index:8;background:var(--paper);
    display:flex;gap:4px;font-size:12px;line-height:1.35;color:var(--dim);
    margin:0 -22px 20px;padding:15px 22px 12px;
    border-bottom:1px solid var(--line);
    box-shadow:0 7px 14px -12px rgba(0,0,0,.5)}
  .hud .c{flex:1;text-align:center}
  .hud .c b{display:block;font-size:18px;font-weight:600;color:var(--ink);
    font-variant-numeric:tabular-nums;transition:color .35s}
  .hud .c.up b{color:var(--good)} .hud .c.dn b{color:var(--bad)}
  .hud .c.low b{color:var(--bad);opacity:.6}
  .hud .c.m b{font-size:15px;color:var(--gold);padding-top:3px}
  .hud .c.s b{font-size:15px;color:var(--clay);padding-top:3px}
  .hud .c.s.low b{color:var(--bad);opacity:1}

  .step{font-size:12.5px;color:var(--dim);letter-spacing:.16em;margin-bottom:8px}
  .term{font-size:38px;line-height:1.2;font-weight:600;letter-spacing:.06em;color:var(--green-d);margin:0}
  .term small{display:block;font-size:12.5px;font-weight:400;letter-spacing:.2em;color:var(--dim);margin-top:6px}
  /* 决策屏的抬头收小一点 —— 手机上选项得尽早露出来 */
  .term.cmp{font-size:27px}
  .term.cmp small{display:inline;margin:0 0 0 12px;letter-spacing:.14em}
  .title{font-size:21px;font-weight:600;margin:18px 0 8px}
  .title.cmp{font-size:19px;margin:8px 0 7px}
  .brief{color:#5a5f4e;margin:0 0 18px}
  .brief.cmp{margin:0 0 14px;font-size:16px;line-height:1.75}
  .spacer{flex:1;min-height:16px}

  .field{background:#eef1e6;border-radius:10px;padding:13px 16px;margin:0 0 16px;
    font-size:15px;color:#4e5744;line-height:1.75}
  .field .wh{display:block;font-size:11.5px;letter-spacing:.18em;color:#7d8a6e;margin-bottom:3px}

  .say{background:var(--card);border-left:3px solid var(--clay);
    border-radius:0 10px 10px 0;padding:13px 16px;margin:0 0 16px}
  .say .who{font-size:12px;letter-spacing:.14em;color:var(--clay);display:block;margin-bottom:3px}
  .say p{margin:0}
  .say p+p{margin-top:8px}

  /* 找人问 —— 老周给你的是判断，同学A给你的是数。
     两个都要花体力，所以问之前你得先想清楚这一问值不值。 */
  .ask{display:flex;gap:9px;margin:0 0 16px}
  .ask button{flex:1;background:transparent;border:1px dashed #c4b393;color:#8a6b4a;
    border-radius:11px;padding:10px 8px;font:inherit;font-size:14.5px;cursor:pointer;
    line-height:1.45;transition:background .15s,transform .1s}
  .ask button:hover{background:#f8f5ec}
  .ask button:active{transform:scale(.98)}
  .ask button i{font-style:normal;display:block;font-size:11.5px;opacity:.72;margin-top:2px}
  .ask button:disabled{border-color:#ddd6c2;color:#c3bead;cursor:default}

  .talk{background:#f5f2e7;border:1px solid #e1dac5;border-radius:12px;
    padding:13px 16px;margin:0 0 13px;
    opacity:0;transform:translateY(6px);animation:rise .4s ease-out forwards}
  .talk .who{font-size:11.5px;letter-spacing:.16em;color:var(--clay);
    display:block;margin-bottom:5px}
  .talk p{margin:0;white-space:pre-line}
  .talk.同学{border-color:#cfd6c4;background:#f0f3ea}
  .talk.同学 .who{color:var(--green)}

  .event{background:var(--gold-l);border-left:3px solid var(--gold);
    border-radius:0 10px 10px 0;padding:13px 16px;margin-bottom:11px;
    opacity:0;transform:translateY(8px);animation:rise .45s ease-out forwards}
  .event .tag{font-size:11.5px;letter-spacing:.16em;color:var(--gold);display:block;margin-bottom:3px}
  .event p{margin:0}
  .event .from{display:block;margin-top:7px;font-size:12px;color:var(--clay);
    letter-spacing:.02em;border-top:1px dashed #ddd0b4;padding-top:6px}
  .event .from b{font-weight:600;color:#7a5c3c}
  .event .dl{display:block;margin-top:5px;font-size:13px;font-variant-numeric:tabular-nums}
  .event .dl.neg{color:var(--bad)} .event .dl.pos{color:var(--good)}
  .event.bad{border-left-color:var(--bad);background:#f9efea} .event.bad .tag{color:var(--bad)}
  .event.good{border-left-color:var(--good);background:#eef4ee} .event.good .tag{color:var(--good)}

  /* 年景是这一局的底牌 —— 抽到哪一档，一眼就得看出来。
     上上（金·扫光）/ 上（青）/ 中（素）/ 下（暗红）/ 下下（深红·扫光） */
  .yc{background:var(--green-d);color:#f0ede0;border-radius:12px;
    padding:16px 18px;margin:0 0 22px;position:relative;overflow:hidden;
    animation:flip .52s cubic-bezier(.2,.8,.3,1) both}
  .yc .tier{position:absolute;top:0;right:0;font-size:12px;letter-spacing:.2em;
    text-indent:.2em;padding:5px 13px;border-radius:0 12px 0 10px;
    background:rgba(255,255,255,.08);color:#b6c2b0}
  .yc .k{font-size:11.5px;letter-spacing:.24em;color:#9fb39a;display:block;margin-bottom:5px}
  .yc b{font-size:22px;font-weight:600;letter-spacing:.08em}
  .yc b.a{color:#e8c86a} .yc b.d{color:#e79a7e}
  .yc p{margin:7px 0 0;font-size:14.5px;color:#c9d3c4;line-height:1.7}

  .yc.SR{border:1px solid rgba(150,182,136,.5);
    box-shadow:0 8px 24px -12px rgba(0,0,0,.6)}
  .yc.SR .tier{background:rgba(150,182,136,.2);color:#d6e2cf}
  .yc.SSR{border:1px solid #c9a227;
    box-shadow:0 0 0 1px rgba(201,162,39,.25), 0 10px 30px -10px rgba(201,162,39,.55)}
  .yc.SSR .tier{background:linear-gradient(180deg,#e8c86a,#c9a227);color:#3a2c08;font-weight:600}
  .yc.xiong{border-color:rgba(200,84,58,.5);
    box-shadow:0 8px 24px -12px rgba(0,0,0,.6)}
  .yc.xiong .tier{background:rgba(200,84,58,.22);color:#f0c3b4}
  .yc.xiong.SSR{border-color:#c8543a;
    box-shadow:0 0 0 1px rgba(200,84,58,.28), 0 10px 30px -10px rgba(200,84,58,.6)}
  .yc.xiong.SSR .tier{background:linear-gradient(180deg,#e79a7e,#c8543a);color:#3a1008;font-weight:600}
  /* 上上和下下独有的那道扫光 —— 稀有的东西该有稀有的动静 */
  .yc.SSR::after{content:"";position:absolute;inset:0;border-radius:inherit;
    background:linear-gradient(105deg,transparent 38%,rgba(255,240,200,.32) 50%,transparent 62%);
    animation:sweep 1.15s .35s ease-out both}
  @keyframes sweep{from{transform:translateX(-135%)}to{transform:translateX(135%)}}
  @keyframes flip{0%{opacity:0;transform:translateY(16px) scale(1.045)}
                  100%{opacity:1;transform:none}}

  /* 翻牌那一屏：整张卡单独占一屏，抽完再进田 */
  .pull{display:flex;flex-direction:column;justify-content:center;flex:1;
    padding:8px 0 22px}
  .pull .lead2{text-align:center;font-size:12.5px;letter-spacing:.34em;
    text-indent:.34em;color:var(--dim);margin:0 0 18px}

  /* 晚上回宿舍 —— 白天那个没想明白的事儿，翻书翻出来了。
     术语全部锁在「书上说」这一层，后面必须跟一句人话。 */
  .note{background:#f6f3ea;border:1px solid #e2dbc6;border-radius:12px;
    padding:15px 17px;margin:16px 0 14px;
    opacity:0;transform:translateY(8px);animation:rise .5s .18s ease-out forwards}
  .note .k{font-size:11.5px;letter-spacing:.22em;color:var(--clay);
    display:block;margin-bottom:11px}
  .note .q{font-weight:600;color:#3f4636;margin:0 0 11px;font-size:15.5px;line-height:1.7}
  .note .s{font-size:13.5px;color:#7a7867;line-height:1.72;margin:0 0 11px;
    padding-left:12px;border-left:2px solid #ded7c2}
  .note .s b{display:block;font-size:10.5px;font-weight:600;letter-spacing:.18em;
    color:#a8a28e;margin-bottom:3px}
  .note .p{font-size:15.5px;color:#333a2c;margin:0;line-height:1.85}
  .note .p b{display:block;font-size:10.5px;font-weight:600;letter-spacing:.18em;
    color:var(--green);margin-bottom:3px}

  .fb{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;margin-bottom:14px}
  .fb .k{font-size:11.5px;letter-spacing:.2em;color:var(--dim);display:block;margin-bottom:7px}
  .fb .row{display:flex;align-items:center;gap:9px;font-size:13.5px;margin-bottom:6px}
  .fb .row:last-child{margin-bottom:0}
  .fb .row .n{width:32px;flex:none;color:var(--dim)}
  .fb .row .a{color:#b0aa98;width:44px;text-align:right;font-variant-numeric:tabular-nums}
  .fb .row .ar{color:#c9c3b0;flex:none;font-size:11px}
  .fb .row .b{width:48px;font-weight:600;font-variant-numeric:tabular-nums}
  .fb .row .b.up{color:var(--good)} .fb .row .b.dn{color:var(--bad)}

  .btn{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);
    border:1px solid var(--line);border-radius:12px;padding:15px 17px;
    font:inherit;line-height:1.7;cursor:pointer;margin-bottom:9px;
    transition:border-color .15s,transform .1s,background .15s}
  .btn:hover{border-color:#bdb598;background:#fff}
  .btn:active{transform:scale(.986)}
  .btn .cost{display:block;font-size:12.5px;color:var(--dim);margin-top:6px;letter-spacing:.02em}
  .btn .cost i{font-style:normal;color:var(--clay)}
  .btn .cost i.hard{color:var(--bad)}

  .go{display:block;width:100%;background:var(--green);color:#fff;border:none;
    border-radius:12px;padding:15px;font:inherit;font-size:17px;letter-spacing:.14em;
    cursor:pointer;margin-top:4px}
  .go:active{transform:scale(.986)}
  .go.ghost{background:transparent;color:var(--green-d);border:1px solid var(--green);font-weight:600}
  .go.sm{padding:12px;font-size:15px;letter-spacing:.08em}

  .cover{flex:1;display:flex;flex-direction:column;justify-content:center;padding:14px 0 26px}
  .cover .name{font-size:50px;font-weight:600;letter-spacing:.2em;text-indent:.2em;
    color:var(--green-d);margin:0;text-align:center}
  .cover .sub{font-size:12.5px;letter-spacing:.3em;text-indent:.3em;color:var(--dim);
    margin:12px 0 30px;text-align:center}
  .cover .lead{color:#4e5343;margin:0 0 26px;font-size:16.5px}
  .cover .lead p{margin:0 0 14px}
  .cover .lead em{font-style:normal;color:var(--green-d);font-weight:600}

  .grade-wrap{text-align:center;padding:16px 0 4px}
  .grade-name{font-size:46px;font-weight:600;letter-spacing:.16em;text-indent:.16em;color:var(--green-d)}
  .grade-name.a{color:var(--gold)} .grade-name.d{color:var(--bad)}
  .grade-tag{font-size:12.5px;letter-spacing:.24em;color:var(--dim);margin-top:6px}
  .grade-note{color:#5a5f4e;margin:22px 0 0}

  .ledger{margin:4px 0 0}
  .ledger .li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;
    border-bottom:1px solid var(--line);font-size:15.5px;
    opacity:0;transform:translateY(6px);animation:rise .42s ease-out forwards}
  .ledger .li .k{color:#5a5f4e}
  .ledger .li .v{font-variant-numeric:tabular-nums;white-space:nowrap}
  .ledger .li.sub{padding-left:16px;font-size:14.5px;color:var(--dim)}
  .ledger .li.sub .k{color:var(--dim)}
  .ledger .li.sum{border-bottom:none;border-top:2px solid var(--ink);margin-top:4px;
    padding-top:12px;font-weight:600;font-size:17px}
  .ledger .li.big .v{font-size:26px;font-weight:600;color:var(--green-d)}
  .ledger .li .v.neg{color:var(--bad)}
  @keyframes rise{to{opacity:1;transform:translateY(0)}}

  .note-line{padding:10px 0;border-top:1px solid var(--line);margin:0;color:#4c5142;font-size:15px}
  .note-line:last-child{border-bottom:1px solid var(--line)}

  .ach{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
  .ach .d{width:9px;height:9px;border-radius:50%;background:var(--gold);flex:none;margin-top:9px}
  .ach b{font-weight:600}
  .ach span{display:block;font-size:13.5px;color:var(--dim);line-height:1.6}

  .cx{border-bottom:1px solid var(--line);padding:13px 0}
  .cx .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .cx b{font-weight:600;font-size:16.5px}
  .cx .cat{font-size:11.5px;letter-spacing:.14em;color:var(--dim);flex:none}
  .cx p{margin:5px 0 0;font-size:14.5px;color:#525a48;line-height:1.75}
  .cx.lock b{color:#b9b4a3} .cx.lock p{color:#c3bead;font-size:13.5px}

  .tabs{display:flex;gap:8px;margin-bottom:18px}
  .tabs button{flex:1;padding:9px;border:1px solid var(--line);background:var(--card);
    border-radius:9px;font:inherit;font-size:14px;color:var(--dim);cursor:pointer}
  .tabs button.on{background:var(--green);color:#fff;border-color:var(--green)}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    background:var(--green-d);color:#fff;padding:11px 20px;border-radius:24px;
    font-size:14.5px;letter-spacing:.04em;opacity:0;pointer-events:none;
    transition:opacity .3s,transform .3s;z-index:9;max-width:88vw;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}

  .foot{text-align:center;font-size:12.5px;color:var(--dim);letter-spacing:.08em;margin-top:18px}
  .bar{position:fixed;top:0;left:0;right:0;height:3px;background:var(--green);
    transform-origin:0 50%;transition:transform .4s;z-index:20}
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ==========================================================================
   《一亩稻》 v4.1

   数字全部来自本轮调研，出处标在注释里。凡调研明确"未查到"的，不编。

   v1 病根：决策只有"省事/费事"一个轴 → 退化成拿钱买分数
   v2 修了：选项改成两难、本钱改成账本上的一行成本、加上一二三产变现
   v3 补的是"像不像在种地"：体力 / 田的样子 / 图鉴 / 成就 / 剧情
   v4.1 补的是"像不像京西稻"：北方稻区的真实病虫害、地理标志规范、
        经营主体的真实处境。三处被调研推翻的设定见下方 ⚠ 标注。
   ========================================================================== */


/* ══════════════════════════ 1. 数值 ══════════════════════════ */

const NUM = {
  /* 亩产：联拓口径「由 650 斤提升至 850 斤以上」（北京日报 2025-01-24）
     政府目标 500 公斤/亩＝1000 斤（海政发〔2023〕9号）—— 本作里的"理想结局" */
  亩产基准: 850,
  品质基准: 50, 生态基准: 50,

  /* 体力＝你一季能投进去的工夫。不够就得雇工（北京农村日工价） */
  体力基准: 70, 雇工价: 160,

  /* 出米率 ≈58.8%，由「精米亩产 500 斤 ÷ 稻谷亩产 850 斤」推算（官媒口径） */
  出米率_代碾: 0.58, 出米率_自碾: 0.64, 自碾设备费: 1800,
  原粮折扣: 0.70,

  /* 礼盒溢价 2.2：特级 25×2.2＝55 元/斤，落在公开报道的礼盒价格带 50–80 内 */
  礼盒溢价: 2.2, 深加工价: 6,

  三产门槛: 58,
  /* 认养：官方唯一可考数字是 2011 年 15000 元/亩（海淀区信息公开大厅 11F/2011-33111）。
     ⚠ v3 把它错写成 5 份 × 1500 = 7500 元/亩 —— 只有调研数字的一半，导致生态路线不挣钱。
     10 份 × 1500 才是那个 15000。稻田认养不是京西稻现有业务 —— 游戏里标为"你想出来的新路子"。 */
  认养份数: 10, 认养单价: 1500, 认养兑米: 20,
  /* 研学：2022 年基地研学收入 140 万元 / 1200 亩 ≈ 1170 元/亩。
     单价 80 元/人是公开报价；人数按一亩地一年能接下多少团估。 */
  研学人数: 45, 研学单价: 80,

  /* 区级粮食生产补贴 900 元/亩·年（海农发〔2026〕1号）。
     限定：补贴对象是"本区从事粮食和蔬菜种植的集体经济组织及国有农场" */
  粮补: 900,
};

const LIMITS = { harvest: [400, 1250], quality: [0, 100], ecology: [0, 100] };

/* 等级价：一级 15 元/斤 = 北京日报 2023-11-07 报道的地头现碾鲜米实价。
   普通东北粳米批发 2.15–3.36 元/斤（新发地 2026-09-20）→ 京西稻溢价约 5–6 倍 */
const 等级表 = [
  { 名: "等外", min: 0,  价: 3,  ico: "d", 礼盒: 0,   口感: "跟普通粳米一个价，进不了等级" },
  { 名: "二级", min: 45, 价: 8,  ico: "",  礼盒: 240, 口感: "家常吃着没问题，端不上席" },
  { 名: "一级", min: 62, 价: 15, ico: "",  礼盒: 400, 口感: "米粒匀、有光。这就是地头现碾鲜米的实价" },
  { 名: "特级", min: 78, 价: 25, ico: "a", 礼盒: 300, 口感: "透亮、没白肚。装礼盒走，一斤能卖到五十往上" },
];


/* ══════════════════════════ 2. 八个节气 ══════════════════════════
   cost 单位＝元　stam＝体力　两个方向都得有代价，没有正确答案
   ────────────────────────────────────────────────────────────── */
const DECISIONS = [
  {
    term: "谷雨", date: "4月20日前后", title: "落谷", 序: 1, 阶段: "苗期", 锚: true,
    brief: "泡种之前，先定用哪一路种子。",
    story: { who: "老周", text: "老周从田埂上走过来，蹲下抓了把你摊在簸箕里的种。\n「我小时候，这一片都用这个种。」他把手一松，谷子落回去，「现在人家都买新种了。你这，杂。」" },
    options: [
      { text: "用自家留的种，晒一天、盐水选一遍再下缸",
        cost: 0, stam: 8, effect: { quality: -6, harvest: -25 }, flags: ["老品种"],
        result: "盐水兑到鸡蛋能浮出硬币大一块。瘪谷漂上来，捞掉；沉底的才是壮苗。选完拿清水冲了两遍 —— 盐分不冲掉，会烧种胚。",

/* ══════════════════════════ 5b. 人 ══════════════════════════
   扣题：你是中国农业大学派到上庄实习的学生。老周不是一个背景板 ——
   他是你能"找"的人。找他要花体力，换来的是一条判断。

   这一块最关键的地方在于：老周从来不告诉你选哪个。
   他告诉你「蹲下去看什么」。教的是怎么看，不是背答案。
   ────────────────────────────────────────────────────────────── */
const 人 = {
  周:   { 名: "老周",  费: 3, 谁: "上庄镇农业公司技术员，五十七岁。这一带的稻子，他种了四十年。" },
  同学: { 名: "同学A", 费: 2, 谁: "跟你一块儿下来的同学，比你早到两周。" },
};

const 节气是 = (s, t) => { const d = s.节气[s.termIndex]; return !!d && d.term === t; };
const 有     = (s, flag) => !!s.flags[flag];
const 今年是 = (s, name) => !!s.年景 && s.年景.名 === name;

/* ══════════════════════════ 8. 逻辑层（不碰 DOM） ══════════════════════════ */

const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
const clampStat = (k, n) => { const [lo,hi] = LIMITS[k]||[0,100]; return clamp(n,lo,hi); };

/* 一局的节气表 = 4 个必经 + 4 个随机抽，再按物候排序。
   谷雨(序1) 一定在最前、秋分(序11) 一定在最后 —— 这是物理必然，不参与抽签。
   抽中的 4 个从池子里出，所以每一局你要做的那 8 个决定，有 4 个是不一样的。 */
const 一局节气 = () => {
  const 锚 = DECISIONS.filter(d => d.锚);
  const 池 = DECISIONS.filter(d => !d.锚).slice();
  for (let i = 池.length - 1; i > 0; i--) {          // Fisher–Yates
    const j = Math.floor(Math.random() * (i + 1));
    [池[i], 池[j]] = [池[j], 池[i]];
  }
  return 锚.concat(池.slice(0, 8 - 锚.length)).sort((a, b) => a.序 - b.序);
};

/* 按权重抽年景 —— 平年最多，上上和下下都少见 */
function 抽年景() {
  const 总 = 年景池.reduce((a, y) => a + (y.重 || 1), 0);
  let r = Math.random() * 总;
  for (const y of 年景池) { r -= (y.重 || 1); if (r < 0) return y; }
  return 年景池[0];
}

function newSeason(固定) {
  const f = 固定 || {};
  const 节气 = f.节气 || 一局节气();
  const 年景 = f.年景 || 抽年景();
  /* 随机事件池：开局就把这一局会撞上哪几条定下来 */
  const 抽中 = 随机池.map(e => Math.random() < e.p);
  return {
    stats: { harvest: NUM.亩产基准, quality: NUM.品质基准, ecology: NUM.生态基准 },
    stamina: NUM.体力基准,
    cost: 0, flags: {}, fired: {}, log: [],
    codex: {}, ach: {}, 查过: {},
    聊过: { 周: {}, 同学: {} }, 话: [],
    termIndex: 0, chainIndex: 0,
    节气, 年景, 抽中, 年景已发: false,
    grain: 0, soldGrain: 0, rate: 0, channel: "", third: "",
  };
}

function applyEffect(state, effect) {
  const d = {};
  for (const k in (effect || {})) {
    const before = state.stats[k];
    state.stats[k] = clampStat(k, state.stats[k] + effect[k]);
    d[k] = state.stats[k] - before;
  }
  return d;
}
const unlock = (state, k) => { if (k && !state.codex[k]) { state.codex[k] = true; return k; } return null; };

/* 某个生长阶段的最后一步是哪一步 —— 年景要等这一步做完才翻牌。
   为什么不是第一步？因为"对冲"这个动作就发生在同阶段的某一步上，
   提前翻了，玩家就没有补救的机会，那不叫难，叫不讲理。 */
function 阶段末位(state, 阶段) {
  let last = -1;
  state.节气.forEach((d, i) => { if (d.阶段 === 阶段) last = i; });
  return last;
}

function dueEvents(state, termIndex) {
  const out = [];
  const push = (line, mood, effect, from, codex, 查) => {
    if (codex) unlock(state, codex);
    const 前 = { ...state.stats };
    const delta = applyEffect(state, effect);
    const item = { line, mood, delta, from: from || null, 查: 查 || null,
                   前, 后: { ...state.stats } };
    out.push(item); state.log.push(item);
  };
  const here = state.节气[termIndex];
  const 名 = here ? here.term : "收尾";
  const 段 = here ? here.阶段 : "收尾";

  /* 一个阶段可能摊到好几个节气（苗期最多能有三个）。
     抽中的意外要摊开落，不能全砸在第一个节气上 —— 那是刷屏，不是节奏。 */
  const 同位 = state.节气.map((d, i) => (d.阶段 === 段 ? i : -1)).filter(i => i >= 0);
  const 槽 = 同位.indexOf(termIndex);
  const 轮到 = ev => {
    if (同位.length <= 1) return true;
    const 同阶 = 随机池.filter(e => e.at === 段);
    return 同阶.indexOf(ev) % 同位.length === 槽;
  };

  /* ① 年景 —— 这一局的底牌，到它那个阶段的最后一步才翻。
       你要是提前做了对冲的活儿，这一下就砸不实。 */
  const Y = state.年景;
  if (Y && Y.hit && !state.年景已发 && 阶段末位(state, Y.hit) === termIndex) {
    state.年景已发 = true;
    const 挡住 = Y.对冲 && state.flags[Y.对冲];
    push(挡住 && Y.对冲线 ? Y.对冲线 : Y.line,
         Y.色 === "a" ? "good" : "bad",
         挡住 ? (Y.对冲后 || Y.effect) : Y.effect,
         ["年景", Y.名], null, 查资料["年景-" + Y.名]);
  }

  /* ② 你埋的因 —— 到点结果。at 可以是节气名，也可以是阶段名 */
  EVENTS.forEach((ev, i) => {
    if (state.fired[i] || (ev.at !== 名 && ev.at !== 段) || !ev.when(state)) return;
    state.fired[i] = true;
    push(ev.line, ev.mood, ev.effect, ev.from, ev.codex, ev.查);
  });

  /* ③ 这一局抽中的意外 —— 同一件事，种法不同挨的程度不同 */
  随机池.forEach((ev, i) => {
    if (!state.抽中[i] || state.fired["r" + i] || ev.at !== 段) return;
    if (ev.需 && !ev.需(state)) return;
    if (!轮到(ev)) return;
    state.fired["r" + i] = true;
    const 挡住 = ev.对冲 && state.flags[ev.对冲];
    push(挡住 && ev.对冲线 ? ev.对冲线 : ev.line, ev.mood,
         挡住 ? (ev.对冲后 || ev.effect) : ev.effect, null, null, ev.查);
  });

  return out;
}

function choose(state, decisionIndex, optionIndex) {
  const d = state.节气[decisionIndex];
  const o = d.options[optionIndex];
  const 前 = { ...state.stats }, 体力前 = state.stamina;
  const 缺口 = Math.max(0, o.stam - state.stamina);
  state.stamina = Math.max(0, state.stamina - o.stam);
  const 雇工费 = 缺口 * NUM.雇工价;
  state.cost += o.cost + 雇工费;
  const delta = applyEffect(state, o.effect);
  (o.flags || []).forEach(f => { state.flags[f] = true; });
  const 新图鉴 = unlock(state, o.codex);
  /* 晚上回宿舍 —— 这个决定到底对不对，你翻了资料才知道 */
  const 查 = 查资料[`${d.term}-${optionIndex}`] || null;
  if (查) state.查过[d.term] = true;
  return { text: o.result, note: o.note || null, delta, 查, 节气名: d.term,
           前, 后: { ...state.stats }, 体力前, 体力: state.stamina, 花销: o.cost,
           雇工费, 缺口, 新图鉴 };
}

/* ── 找人问 ────────────────────────────────────────────────────
   老周给的是判断，同学A给的是数。两个都花体力 ——
   所以每问一句，都是拿地里的工换一个"知道"。这就是交互的代价。
   ────────────────────────────────────────────────────────────── */
function 问人(state, 谁) {
  const 表 = 谁 === "周" ? 老周的话 : 同学A的话;
  const 用过 = state.聊过[谁];
  return 表.find(l => !用过[l.id] && l.当(state)) || null;
}

function 找人聊(state, 谁) {
  const p = 人[谁];
  if (state.stamina < p.费) return null;
  const hit = 问人(state, 谁);
  if (!hit) return null;
  state.聊过[谁][hit.id] = true;
  state.stamina -= p.费;
  const 条 = { 谁: p.名, 费: p.费, 说: hit.说, 同学: 谁 === "同学" };
  state.话.push(条);
  return 条;
}

function gradeOf(quality) {
  let g = 等级表[0]; 等级表.forEach(x => { if (quality >= x.min) g = x; }); return g;
}

/* 田的样子 —— 把干瘪的数字翻译成"你现在看到什么" */
function 田的样子(S) {
  const { ecology: e, quality: q, harvest: h } = S.stats, out = [];
  if (e >= 85) out.push("田水清，看得见螺蛳贴着泥走。天一黑，蛙声一大片。");
  else if (e >= 70) out.push("田埂上能碰见青蛙，水里也有小虫在游。");
  else if (e >= 50) out.push("田里不算脏，可也没什么活物。土踩上去是实的。");
  else if (e >= 32) out.push("土有点板。蹲下去翻，蚯蚓少见。");
  else out.push("水发浑，田埂边积着一层白膜。田里静得吓人，一声虫叫都没有。");

  if (q >= 78) out.push("叶片挺，颜色正，秆子捏着硬。");
  else if (q >= 62) out.push("长势中规中矩，看不出什么毛病。");
  else if (q >= 45) out.push("叶色偏深，有点贪青 —— 剑叶还黑绿着不褪。");
  else out.push("叶子黑绿得发亮，秆子捏着发软，基部节间拉得老长 —— 长得太猛了。");

  if (h >= 1100) out.push("稻子密，人走进去要拨开。");
  else if (h <= 600) out.push("田里稀，风一吹能看见地皮。");
  return out.join("");
}

function 验米(state) {
  const g = gradeOf(state.stats.quality);
  let 眼力;
  if (g.名 === "特级") 眼力 = "抓一把摊在手心，米粒匀、透亮，没白肚。他捏了几粒放进嘴里嚼，点了点头，没说话。";
  else if (g.名 === "一级") 眼力 = "摊开看了看，米是好米，就是有几粒不太匀。他说：够得上一级。";
  else if (g.名 === "二级") 眼力 = "捏起来搓了搓，穗上带下来的青粒不少。他皱了皱眉：按二级走吧。";
  else 眼力 = "他抓了一把，看了看就放下了：这米，按商品粮收吧，进不了等级。";
  return { grade: g, 眼力 };
}

function 年终(state) {
  const g = gradeOf(state.stats.quality), 米价 = g.价;
  const 谷价 = Math.round(米价 * NUM.原粮折扣 * NUM.出米率_代碾 * 10) / 10;
  const 已卖谷 = state.soldGrain, 留谷 = state.grain - 已卖谷;
  const 米 = Math.round(留谷 * state.rate);
  const 一产 = Math.round(已卖谷 * 谷价);

  /* 认养的人要兑米 —— 那部分米不能再卖一遍 */
  let 兑米 = 0, 份 = 0, 人 = 0, 三产 = 0, 三产说明 = "田闲着，一分钱没挣";
  const 生态够 = state.stats.ecology >= NUM.三产门槛;
  if (state.third !== "无" && 生态够) {
    const 系数 = clamp((state.stats.ecology - NUM.三产门槛) / 30, 0.5, 1.25);
    if (state.third === "认养") {
      份 = Math.round(NUM.认养份数 * 系数);
      份 = Math.min(份, Math.floor(米 / NUM.认养兑米));   // 你手里得真有这些米才兑得出
      兑米 = 份 * NUM.认养兑米;
      三产 = Math.round(份 * NUM.认养单价);
      三产说明 = `${份} 份被认养，兑出去 ${兑米} 斤米`;
    } else {
      人 = Math.round(NUM.研学人数 * 系数);
      三产 = Math.round(人 * NUM.研学单价);
      三产说明 = `${人} 人次来研学`;
    }
  } else if (state.third !== "无") 三产说明 = "生态没养起来，没人愿意来";

  const 可售米 = Math.max(0, 米 - 兑米);
  const cap = g.礼盒;
  let 礼盒量 = 0, 加工量 = 0;
  if (state.channel === "礼盒") { 礼盒量 = Math.min(可售米, cap); 加工量 = 可售米 - 礼盒量; }
  else if (state.channel === "深加工") { 加工量 = 可售米; }
  else { 礼盒量 = Math.min(可售米, cap); 加工量 = 可售米 - 礼盒量; }
  const 二产 = Math.round(礼盒量 * 米价 * NUM.礼盒溢价 + 加工量 * NUM.深加工价);

  const 毛收入 = 一产 + 二产 + 三产 + NUM.粮补;
  return { grade: g, 米价, 谷价, 米, 已卖谷, 留谷, 兑米, 可售米,
           一产, 二产, 三产, 三产说明, 礼盒量, 加工量,
           毛收入, 补贴: NUM.粮补, 成本: state.cost, 净收益: 毛收入 - state.cost };
}

function 结成就(S, r) {
  const got = [];
  ACH.forEach(a => { if (!S.ach[a.id] && a.when(S, r)) { S.ach[a.id] = true; got.push(a); } });
  return got;
}

const app = document.getElementById('app');

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");

function hud(withField) {
  const cells = ["harvest","quality","ecology"].map(k => {
    const v = S.stats[k], f = flash[k];
    const cls = f > 0 ? "up" : f < 0 ? "dn" : (v <= 25 ? "low" : "");
    return `<div class="c ${cls}"><b>${v}</b>${LABEL[k]}</div>`;
  }).join("");
  return `<div class="hud">${cells}
    <div class="c s ${S.stamina <= 15 ? "low" : ""}"><b>${S.stamina}</b>体力</div>

}

function deltaText(d) {
  return Object.keys(d).filter(k => d[k])
    .map(k => `${LABEL[k]} ${d[k] > 0 ? "+" : ""}${d[k]}${UNIT[k]}`).join("　");
}

/* 年景卡 —— 开局那一屏和每局的决策屏都用它，保证抽到什么都长一个样 */

/* ── 开场 ── */

function viewEvent() {

    return `<button class="btn" onclick="onChoose(${i})">
      ${esc(o.text)}<span class="cost">${bits.join("　·　")}</span></button>`;

  /* 找人问 —— 体力是唯一的价码，所以问之前得先掂量这一问值不值 */

      ${S.log.map(e => `<p class="note-line">${esc(e.line)}</p>`).join("")}` : ""}
    <div class="spacer"></div>
    <button class="go" onclick="toChain()">把 粮 拉 回 去</button>`;
}

/* ── 二三产 ── */
function viewChain() {
  const step = S.chainIndex || 0, c = CHAIN[step];
  const buttons = c.options.map((o, i) => `
    <button class="btn" onclick="onChain(${i})">${esc(o.text)}
    <span class="cost">${esc(o.sub)}</span></button>`).join("");
  return `<div class="step">${esc(c.term)} · 第 ${step + 1} / ${CHAIN.length} 步</div>
    <h2 class="term">${esc(c.term)}<small>收 完 之 后</small></h2>
    <h3 class="title">${esc(c.title)}</h3>
    <p class="brief">${esc(c.brief)}</p>
    <div class="spacer"></div>${buttons}<div class="spacer"></div>`;
}

/* ── 年终账本 ── */
function viewYearEnd() {
  const r = result;
  const li = (k, v, cls="") => `<div class="li ${cls}"><span class="k">${k}</span><span class="v ${String(v).startsWith("-")?"neg":""}">${v}</span></div>`;
  const ach = newAch.length ? `<h3 class="title" style="font-size:17px">这一季，你得了</h3>
    ${newAch.map(a => `<div class="ach"><span class="d"></span><div><b>${a.名}</b><span>${a.说}</span></div></div>`).join("")}` : "";
  return `<div class="step">年终 · 账本</div>
    <h2 class="term" style="font-size:32px">一季的账<small>一 亩 地</small></h2>
    <div class="ledger">
      ${li("打下来的稻谷", yuan(S.grain) + " 斤")}
      ${li("验米等级", r.grade.名 + "（" + yuan(r.米价) + " 元/斤）")}
      ${li("折成米", yuan(r.米) + " 斤" + (r.兑米 ? "（认养兑走 " + r.兑米 + " 斤）" : ""))}
      ${li("一产 · 卖原粮", yuan(r.一产) + " 元")}
      ${li("二产 · 礼盒 " + yuan(r.礼盒量) + " 斤", yuan(r.二产) + " 元")}
      ${li("三产 · " + r.三产说明, yuan(r.三产) + " 元")}
      ${li("政策 · 粮补（集体经济组织）", yuan(r.补贴) + " 元")}
      ${li("毛收入", yuan(r.毛收入) + " 元")}
      ${li("本季投入", "-" + yuan(r.成本) + " 元")}
      ${li("净 收 益", yuan(r.净收益) + " 元", "sum big")}
    </div>
    ${ach}
    ${回学校(S, r)}
    <div class="spacer"></div>
    <button class="go ghost" onclick="restart()">再 种 一 季</button>
    <p class="foot">换个走法，账就不是这个数</p>`;
}

/* ── 回学校 ──
   你是农大派来实习的学生，一季种完得有个交代。
   带队老师看的是表，老周看的是别的 —— 这一局收在这里。 */
function 回学校(S, r) {
  const 级 = r.grade.名;
  const 王 = 级 === "特级"
    ? { t: "「这块地能这么种。」带队老师把表推回来，\n「你把过程写下来，下次组会讲一次。」" }
    : 级 === "一级"
    ? { t: "「一级，可以了。」带队老师说，\n「我以为你们下去就是拍拍照 —— 看来不是。」" }
    : r.净收益 >= 15000
    ? { t: "「账算得不错。」带队老师翻了两页，\n「可我更想知道，你那一亩地明年还能不能这么种。」" }
    : { t: "带队老师看了很久，才开口：\n「你先说说，哪一步是你最有把握的。」\n（你想了半天，答不上来。）" };

  const 留 = S.stats.ecology >= 65 || r.三产 > 0;
  const 周 = 留
    ? { t: "老周蹲在田埂上，把最后一捆稻把子码齐。\n「这一亩地，明年还归你。」他说，\n「你要是还来。」" }
    : { t: "老周没多说什么。把锹往肩上一扛，走了两步，\n回头丢下一句：\n「地不骗人。」" };

  return `<h3 class="title" style="font-size:17px">收完了，回学校</h3>
    <div class="say"><span class="who">带队老师 · 组会前</span><p style="white-space:pre-line">${esc(王.t)}</p></div>
    <div class="say"><span class="who">老周 · 田埂上</span><p style="white-space:pre-line">${esc(周.t)}</p></div>`;
}

/* ── 图鉴 / 成就 ── */
const 分类 = ["田里的", "手上的", "肥", "水", "虫", "收", "药", "灾"];
function viewBook() {
  const keys = Object.keys(CODEX);
  const got = keys.filter(k => S.codex[k]).length;
  const groups = 分类.filter(c => keys.some(k => CODEX[k][0] === c));
  let body;
  if (tab === "成就") {
    body = ACH.map(a => {
      const has = S.ach[a.id];
      return `<div class="cx ${has?"":"lock"}"><div class="h"><b>${has ? a.名 : "？ ？ ？"}</b></div><p>${has ? a.说 : "还没拿到"}</p></div>`;
    }).join("");
  } else if (tab === "全部") {
    body = keys.map(k => {
      const has = S.codex[k], [cat, txt] = CODEX[k];
      return has
        ? `<div class="cx"><div class="h"><b>${k}</b><span class="cat">${cat}</span></div><p>${txt}</p></div>`
        : `<div class="cx lock"><div class="h"><b>？ ？ ？</b><span class="cat">${cat}</span></div><p>还没见过</p></div>`;
    }).join("");
  } else {
    body = 分类.filter(c => c !== "肥" || tab === "肥").map(c => {
      const inC = keys.filter(k => CODEX[k][0] === c);
      if (!inC.length) return "";
      return `<h3 class="title" style="font-size:15px;color:var(--dim);letter-spacing:.14em;margin:20px 0 4px">${c}</h3>`
        + inC.map(k => {
          const has = S.codex[k];
          return `<div class="cx ${has?"":"lock"}"><div class="h"><b>${has ? k : "？ ？ ？"}</b></div><p>${has ? CODEX[k][1] : "还没见过"}</p></div>`;
        }).join("");
    }).join("");
  }
  const 成就数 = ACH.filter(a => S.ach[a.id]).length;
  return `<div class="step">这一季记住的东西</div>
    <div class="tabs">
      <button class="${tab==="田"?"on":""}" onclick="setTab('田')">田里的</button>
      <button class="${tab==="手上的"?"on":""}" onclick="setTab('手上的')">手上的</button>
      <button class="${tab==="全部"?"on":""}" onclick="setTab('全部')">全部 ${got}/${keys.length}</button>
      <button class="${tab==="成就"?"on":""}" onclick="setTab('成就')">成就 ${成就数}</button>
    </div>${body}<div class="spacer"></div>
    <button class="go sm ghost" onclick="backToGame()">回 到 田 里</button>`;
}

function render() {
  app.innerHTML =
    screen === "cover"    ? viewCover()    :
    screen === "pull"     ? viewPull()     :
    screen === "event"    ? viewEvent()    :
    screen === "decision" ? viewDecision() :
    screen === "result"   ? viewResult()   :
    screen === "miban"    ? viewMiban()    :
    screen === "chain"    ? viewChain()    :
    screen === "book"     ? viewBook()     :
                            viewYearEnd();
  const p = screen === "cover" || screen === "pull" ? 0
    : screen === "chain" ? (8 + (S.chainIndex||0)) / 12
    : screen === "miban" ? 8/12
    : Math.min(S.termIndex, 8) / 12;
  document.getElementById("bar").style.transform = `scaleX(${p})`;
  window.scrollTo(0, 0);
}

/* ── 流程 ── */
function nextTerm() {
  S.话 = [];                       // 上个节气问过的话，翻篇了
  pendingEvents = dueEvents(S, S.termIndex);
  flash = {};
  pendingEvents.forEach(e => { for (const k in e.delta) if (e.delta[k]) flash[k] = e.delta[k]; });
  screen = pendingEvents.length ? "event" : "decision";
  render();
}

window.startGame = function () { S.termIndex = 0; screen = "pull"; render(); };
window.toField   = function () { nextTerm(); };
window.toDecision = function () { screen = "decision"; render(); };

/* 找人问 —— 老周给你判断，同学A给你数。都要花体力。 */
window.onAsk = function (k) {
  if (S.stamina < 人[k].费) { toast(`体力不够了 —— 先顾地里的活`); return; }
  if (!找人聊(S, k)) { toast(`${人[k].名}没话了`); return; }
  render();
};

window.onChoose = function (i) {
  lastResult = choose(S, S.termIndex, i);
  flash = {};
  for (const k in lastResult.delta) if (lastResult.delta[k]) flash[k] = lastResult.delta[k];
  if (lastResult.新图鉴) toast(`记下了 · ${lastResult.新图鉴}`);
  screen = "result"; render();
};

window.onContinue = function () {
  S.termIndex++; flash = {};
  if (S.termIndex >= S.节气.length) {
    dueEvents(S, S.节气.length);   // 收尾那一趟：粮进场了才回过味来的账
    flash = {};
    S.log.forEach(e => { for (const k in e.delta) if (e.delta[k]) flash[k] = e.delta[k]; });
    S.grain = S.stats.harvest;
    miban = 验米(S);
    screen = "miban"; render();
  } else nextTerm();
};

window.toChain = function () { S.chainIndex = 0; screen = "chain"; render(); };

window.onChain = function (i) {
  const c = CHAIN[S.chainIndex];
  if (!c || !c.options[i]) return;   // 连点或越界，直接吞掉，别把最后一屏点崩
  c.options[i].pick(S);
  S.chainIndex++;
  if (S.chainIndex >= CHAIN.length) { result = 年终(S); newAch = 结成就(S, result); screen = "yearend"; }
  render();
};

window.setTab = function (t) { tab = t; render(); };
window.backToGame = function () { screen = S.termIndex >= S.节气.length ? "yearend" : "decision"; render(); };
window.openBook = function () { screen = "book"; render(); };
window.restart = function () { reset(); render(); };

render();
</script>
</body>
</html>
