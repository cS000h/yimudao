    <path d="M-14 2.4 q6 1.6 12 0.6 M4 3 q6 1 11 -0.4" stroke="#7c7660" stroke-width="1.1"
      fill="none" stroke-linecap="round"/>
    </g>`,
};

/* ══ 年景画成天 ══
   参考图给的最大启发：手游用天表达状态。原来这儿只有三种天色，五张灾年卡
   共用同一种灰 —— 抬头看不出今年是什么年。

   每一层都是纯装饰：不动数值，不改判定，年景仍然只由那张明牌说了算。
   写在这儿而不是写进 年景池，是因为年景池是"规则"，这是"画"。 */

/* 雨丝 —— 斜的，不是竖的。位置用取模散开，不引随机数：
   同一个年景每次画出来得一样，不然截图的对比就没意义了。 */
const 落雨 = n => Array.from({ length: n }, (_, i) => {
  const x = (i * 37 + 11) % 332 - 8, y = (i * 23 + 5) % 118;
  return `<path d="M${x} ${y} l4.6 12" stroke="#ffffff" stroke-width=".75"`
    + ` opacity=".42" stroke-linecap="round"/>`;
}).join("");

/* 雨点砸在水面上的圈，一圈一圈荡开 */
const 涟漪 = 位 => 位.map(([x, y], i) =>
  `<ellipse cx="${x}" cy="${y}" rx="${5 + i * 1.1}" ry="${1.5 + i * .3}"`
  + ` fill="none" stroke="#ffffff" stroke-width=".7" opacity=".34"/>`).join("");

/* 霜 —— 一层白压在下半部，叶尖上挂几点没化开的 */
const 挂霜 = () => `<rect y="72" width="320" height="68" fill="#f4f8fa" opacity=".3"/>`
  + Array.from({ length: 16 }, (_, i) => {
      const x = (i * 41 + 7) % 320, y = 58 + (i * 17) % 54;
      return `<circle cx="${x}" cy="${y}" r="${(.9 + (i % 3) * .35).toFixed(2)}"`
        + ` fill="#ffffff" opacity=".6"/>`;
    }).join("");

/* 旱 —— 水位在掉：远山底下晒出一条泥，水线退下去。
   年景卡的原话是"水库的水位一直在掉"、"灌一次水两天就渗没了" ——
   画地裂是画错了重点，旱最先看见的是水浅了。 */
const 退水 = () => `<rect y="47" width="320" height="21" fill="#b5a67c"/>`
  + `<rect y="47" width="320" height="21" fill="url(#旱泥)" opacity=".55"/>`
  + `<path d="M0 68.5 q62 -3.4 132 -1.2 q88 2.6 188 -1.4" stroke="#8b7d55"`
  + ` stroke-width="1.3" fill="none" opacity=".85"/>`
  + [14, 52, 96, 140, 188, 236, 282].map((x, i) =>
      `<path d="M${x} 49 l${i % 2 ? 3.2 : -3.8} 5.4 l${i % 3 ? -2.4 : 3.2} 7.4"`
      + ` stroke="#8b7d55" stroke-width=".95" fill="none" opacity=".5"/>`).join("");

/* 寒 —— 冷色压一层，埂边留一片没化开的 */
const 压寒 = () => `<rect y="26" width="320" height="114" fill="#b9cfe0" opacity=".17"/>`
  + `<rect y="120" width="320" height="20" fill="#eef4f8" opacity=".38"/>`;

/* 晴 —— 好年：右上角一团柔光，一圈一圈叠出来的，没有硬边 */
const 放晴 = () => `<ellipse cx="288" cy="4" rx="126" ry="92" fill="#fff3c4" opacity=".17"/>`
  + `<ellipse cx="298" cy="0" rx="78" ry="58" fill="#fff8dc" opacity=".2"/>`
  + `<ellipse cx="306" cy="-4" rx="40" ry="31" fill="#fffdf0" opacity=".26"/>`;

const 年景天 = {
  秋淋:   { 天: ["#8d979c", "#c2cacc"], 山: ".62",
            层: () => 落雨(34) + 涟漪([[52, 62], [148, 74], [246, 58], [104, 96], [286, 88]]) },
  早霜:   { 天: ["#b6c4ce", "#eef3f5"], 山: ".5",  层: () => 挂霜() },
  凉夏:   { 天: ["#c4c9c4", "#d3d8d2"], 山: ".2",
            /* 连阴天：天色是平的（两头几乎同色），飘几丝悬着的细雨。
               跟秋淋分得开 —— 秋淋是砸下来的雨点加涟漪，这个是毛毛雨。 */
            层: () => `<rect y="14" width="320" height="126" fill="#e6e9e2" opacity=".3"/>`
                    + Array.from({ length: 15 }, (_, i) => {
                        const x = (i * 53 + 17) % 334 - 8, y = (i * 31 + 9) % 110;
                        return `<path d="M${x} ${y} l2 6.5" stroke="#ffffff"`
                          + ` stroke-width=".6" opacity=".32" stroke-linecap="round"/>`;
                      }).join("") },
  伏旱:   { 天: ["#d9d2ae", "#f8f5e2"], 山: ".34", 层: () => 退水() },
  倒春寒: { 天: ["#a6b4c0", "#dde6ea"], 山: ".55", 层: () => 压寒() },
  暖春:   { 天: ["#cfe2c6", "#fbfcf2"], 山: ".5",  层: () => "" },
  丰年:   { 天: ["#d3e6c8", "#fdfef6"], 山: ".55", 层: () => 放晴() },
  雨水匀: { 天: ["#cfe0d4", "#f8fbf4"], 山: ".55", 层: () => "" },
  暖秋:   { 天: ["#d9e3c2", "#fbfaf0"], 山: ".5",  层: () => 放晴() },
};

function 田的画(S) {
  const e = S.stats.ecology, q = S.stats.quality, h = S.stats.harvest;
  const 割了 = S.termIndex >= S.节气.length;
  const 段 = 割了 ? "成熟" : ((S.节气[S.termIndex] || {}).阶段 || "成熟");
  const 倒 = !!S.codex["倒伏"];
  const 新倒 = 倒 && !已倒过;
  if (倒) 已倒过 = true;
  const k = (阶段高[段] || 1) * (割了 ? 0.20 : 1);      // 收完只剩稻桩

  /* 天看年景 —— 先按名字找，找不到再退回三色（平年那种没什么可画的） */
  const 年色 = S.年景 ? S.年景.色 : "";
  const 今景 = 年景天[S.年景 ? S.年景.名 : ""];
  const 天 = 今景 ? 今景.天
          : 年色 === "d" ? ["#a7aeae", "#d2d6d0"]
          : 年色 === "a" ? ["#cadfc4", "#f6f9ee"]
          : ["#bccfc8", "#e9efe4"];
  /* 水看生态 */
  const 水 = e >= 85 ? "#a9c9bb" : e >= 70 ? "#9cb8a6" : e >= 50 ? "#93a08c"
           : e >= 32 ? "#8b917f" : "#858878";
  /* 叶看品质 —— 熟了不看品质，一片金 */
  const 熟 = 割了 || 段 === "成熟";
  const 叶 = 熟 ? "#c8a03c" : q >= 78 ? "#63a04b" : q >= 62 ? "#579041"
           : q >= 45 ? "#3d7030" : "#274d1f";
  const 穗色 = 熟 ? "#dcbb52" : 段 === "灌浆" ? "#a8b95c" : 叶;
  const 稀 = h < 700;

  const 丛 = [];
  /* 三排 —— 远排小、淡、密；近排大、实、疏。站田埂上往前看就是这个样子。 */
  const 排 = [
    { y: 58, s: 0.50, n: 13, 淡: 0.34, w: 1.5 },
    { y: 84, s: 0.76, n: 11, 淡: 0.14, w: 1.9 },
    { y: 116, s: 1.08, n: 9, 淡: 0, w: 2.4 },
  ];
  排.forEach((R, ri) => {
    const 步 = 320 / R.n;
    for (let i = 0; i < R.n; i++) {
      /* 缺苗要成片地缺，不能均匀地少几株 —— 那样看不出来。
         按段跳，前排缺得最明显：风一吹能看见地皮。 */
      const 段位 = Math.floor(i / 3);
      if (稀 && (ri === 2 ? 段位 % 2 === 0 : ri === 1 ? 段位 % 3 === 1 : false)) continue;
      const x = 步 * (i + 0.5) + (ri % 2 ? 步 * 0.5 : 0);
      if (x > 318) continue;
      const 高 = 84 * R.s * k;
      /* 叶片从基部往两边撇开，越靠外的越短 —— 一丛就该是这个形状 */
      const 叶片 = [-17, -8, 0, 8, 17].map(偏 => {
        const hh = 高 * (1 - Math.abs(偏) / 34), dx = 偏 * 0.62;
        return `<path d="M${x.toFixed(1)} ${R.y} Q${(x + dx * 1.8).toFixed(1)} ${(R.y - hh * 0.58).toFixed(1)} `
             + `${(x + dx).toFixed(1)} ${(R.y - hh).toFixed(1)}" stroke="${叶}" stroke-width="${R.w.toFixed(1)}" `
             + `fill="none" stroke-linecap="round"/>`;
      }).join("");
      /* 灌浆之后穗才压出来：一截粗的、往外垂的，熟了是金的 */
      const 有穗 = !割了 && (段 === "灌浆" || 段 === "成熟");
      const 穗 = 有穗 ? [-17, 0, 17].map(偏 => {
        const hh = 高 * (1 - Math.abs(偏) / 34), dx = 偏 * 0.62, d = 偏 >= 0 ? 1 : -1;
        const 垂 = 段 === "成熟" ? 1.6 : 0.7;                    // 越熟垂得越狠
        return `<path d="M${(x + dx).toFixed(1)} ${(R.y - hh).toFixed(1)} `
             + `q${(d * 3).toFixed(1)} ${(垂 * 3).toFixed(1)} ${(d * 7).toFixed(1)} ${(垂 * 5).toFixed(1)}" `
             + `stroke="${穗色}" stroke-width="${(R.w * 1.7).toFixed(1)}" fill="none" stroke-linecap="round"/>`;
      }).join("") : "";
      /* 倒伏：前排基本全躺下，中排倒七成，后排还立着 —— 像风从前面扫过去 */
      const 这株倒 = 倒 && (ri === 2 || (ri === 1 && i % 4 !== 0) || (ri === 0 && i % 5 === 2));
      const cls = 这株倒 ? (新倒 ? "clump fall" : "clump lie") : "clump";
      const st = 这株倒 ? ` style="--lie:${(58 + (i % 5) * 6).toFixed(0)}deg"` : "";
      丛.push(`<g class="${cls}"${st} opacity="${(1 - R.淡).toFixed(2)}">${叶片}${穗}</g>`);
    }
  });

  /* ── 田里的活物 ──
     画什么必须跟田的样子()那几句话对得上，而且只能画玩家自己弄出来的东西：
       · 鸭子 ← 是「大暑 赶鸭子下田」那一步的结果，不是生态的赠品。
                没走那步，生态再高也不该冒出一只鸭 —— 那是游戏在撒谎。
       · 青蛙 / 螺蛳 / 小虫 ← 生态养出来的，水越干净越多。
                生态掉到 50 以下，文案写的是"没什么活物"，那就一只都不画。 */
  const 有鸭 = !!(S.flags && S.flags["稻鸭"]);
  const 蛙数 = e >= 85 ? 3 : e >= 70 ? 2 : 0;

  /* ── 膜 ──
     立夏那一步选了什么，田里就得看出来。这是"点了有反应"最要紧的一处：
     你点了那摞膜，膜就真的盖在秧上；你点了空地，那就是空着。
     只在苗期画 —— 芒种插秧一翻，膜就该撤了，留着是穿帮。 */
  const 苗期 = !割了 && 段 === "苗期";
  const 盖了膜 = !!(S.flags && S.flags["盖膜"]) && 苗期;
  const 今 = (S.节气[S.termIndex] || {});

  /* ── 家什层 ──
     这一屏能点的那几件东西，按热区的坐标摆出来。
     ⚠ 只在"还没动手"的那一屏摆。翻到结果屏就该没了 —— 家什已经动过了，
       还杵在埂上就是穿帮。判据用 screen，因为 termIndex 到结果屏还没往前走。
     ⚠ 一件家什只有一个出处：热区数据。画在哪儿、点在哪儿，是同一个 x/y。
       以前膜卷是单独写死的（画在 266,122，热区写 266,118），差那 4 点，
       圆点就没落在膜卷上 —— 这种"两处各写一遍"的东西迟早会错开。 */
  const 待动手 = 今.热区 && (screen === "decision" || screen === "event");
  /* ⚠ 这里按**热区下标**取家什，所以得跟 有位() 走同一份表：
     没翻过那晚的书，那件东西就不该先长在田里 —— 看见了却点不着，比不画更难受。 */
  const 家什层 = 待动手
    ? 有位(今).map(i => {
        const h = 今.热区[i];
        return h && h.画 && 家什[h.画]
          ? `<g class="shi s${i}">${家什[h.画](h.x, h.y, h.尺 || 1.5)}</g>` : "";
      }).join("")
    : "";

  /* 田埂 —— 你站的地方。青蛙蹲在上头，螺蛳爬在边上，白膜也积在这儿。 */
  const 埂色 = e >= 70 ? "#93a06d" : e >= 50 ? "#8b916a" : "#88885f";
  const 埂 = `<path d="M0 126.5 q56 -3.6 112 -1.4 q78 3 208 -1.4 V140 H0Z" fill="${埂色}"/>`
    + `<path d="M0 126.5 q56 -3.6 112 -1.4 q78 3 208 -1.4" stroke="#ffffff" stroke-width="1"`
    + ` fill="none" opacity=".25"/>`;

  /* 青蛙：宽身子 + 两只鼓在头顶的眼睛，这个剪影一眼就认得出 */
  const 蛙 = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})">`
    + `<ellipse cx="0" cy="0" rx="7.2" ry="4.2" fill="#6f9a38"/>`
    + `<path d="M-6.4 2 l-3.6 1.8" stroke="#6f9a38" stroke-width="2.6" stroke-linecap="round"/>`
    + `<path d="M6 1.8 l3.2 1.6" stroke="#6f9a38" stroke-width="2" stroke-linecap="round"/>`
    + `<circle cx="-2.4" cy="-4" r="2.3" fill="#7cab41"/><circle cx="2.6" cy="-4.2" r="2.1" fill="#7cab41"/>`
    + `<circle cx="-2.4" cy="-4" r="1.05" fill="#2b3026"/><circle cx="2.6" cy="-4.2" r="0.95" fill="#2b3026"/>`
    + `<path d="M-4.6 -0.6 q4.6 -2 9.2 0" stroke="#5b8030" stroke-width="0.8" fill="none" opacity=".75"/>`
    + `</g>`;
  const 蛙位 = [[64, 131.5, 1.15], [172, 134, 0.9], [258, 131, 1.05]].slice(0, 蛙数);

  /* 螺蛳：贴着泥走。这个尺寸上画不成螺壳，就一小坨带点反光的深色 */
  const 螺 = (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})">`
    + `<ellipse cx="0" cy="0" rx="3.4" ry="2.4" fill="#6b6250"/>`
    + `<path d="M-1.6 0.3 q1.8 -1.9 3.4 -0.5" stroke="#a99e86" stroke-width="0.9" fill="none"/>`
    + `</g>`;
  const 螺位 = [[27, 131], [124, 133], [213, 130.6], [296, 132.4]];

  /* 小虫：水黾。水面上一排小黑点，带几道划水的腿 */
  const 虫 = (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})">`
    + `<ellipse cx="0" cy="0" rx="2.4" ry="1" fill="#3c4432" opacity=".85"/>`
    + `<path d="M-1.4 0.6 l-2.4 1.8 M1.4 0.6 l2.4 1.8 M0 0.6 l0 2.2" stroke="#3c4432"`
    + ` stroke-width="0.55" fill="none" opacity=".7"/></g>`;
  const 虫位 = [[46, 104], [150, 96], [232, 110], [292, 100]];

  /* 水里那一层，画在稻子后头 */
  let 水里 = "";
  if (有鸭) {
    水里 += `<g opacity=".95"><ellipse cx="58" cy="78" rx="13" ry="6.6" fill="#fdfcf6"/>`
      + `<circle cx="71" cy="71.6" r="4.4" fill="#fdfcf6"/><path d="M75 71.6 l5.4 -1.7" stroke="#d09a2c" stroke-width="2.4"/>`
      + `<path d="M46 78 q-4 -3 -1 -6" stroke="#e6e2d2" stroke-width="2" fill="none"/></g>`
      + `<g opacity=".92"><ellipse cx="252" cy="90" rx="11" ry="5.6" fill="#f9f7ee"/>`
      + `<circle cx="263" cy="84.4" r="3.8" fill="#f9f7ee"/><path d="M266.6 84.4 l4.6 -1.5" stroke="#d09a2c" stroke-width="2"/>`
      + `<path d="M242 90 q-3.6 -2.6 -1 -5.2" stroke="#e6e2d2" stroke-width="1.8" fill="none"/></g>`;
  }
  if (e >= 70) 水里 += 虫位.map(([x, y]) => 虫(x, y)).join("");
  if (e < 32) {
    /* 白膜积在埂边 —— 文案说的就是"田埂边积着一层白膜"，那它就得贴着埂 */
    水里 += `<rect x="48" y="112" width="126" height="2.2" fill="#eceae0" opacity=".55"/>`
      + `<rect x="192" y="104" width="98" height="2.4" fill="#eceae0" opacity=".4"/>`
      + `<rect x="0" y="122" width="320" height="3.8" fill="#eceae0" opacity=".85"/>`;
  }
  /* 天那一层 —— 压在稻子上头、田埂下头。雨是下在稻子上的，
     可你站的这道埂在雨里头，埂上的家什得能看清，所以天气不盖住近前。 */
  const 天气层 = 今景 && 今景.层 ? 今景.层() : "";

  /* 田埂和它上头的东西压在最前面 —— 那是离你最近的一层 */
  const 近前 = 埂
    + (e >= 85 ? 螺位.map(([x, y]) => 螺(x, y)).join("") : "")
    + 蛙位.map(([x, y, s]) => 蛙(x, y, s)).join("")
    + 家什层;   // 家什压在最上头 —— 它得能一眼看见，不然不知道点哪儿

  /* 膜盖在稻子上头 —— 画在最后，把稻子罩住。半透的，因为本来就是"看得见里头"。
     拱条是竹片，京西稻育秧真用的是竹片弯的拱。 */
  const 膜层 = 盖了膜
    ? `<path d="M2 140 V68 q0 -11 11 -11 H307 q11 0 11 11 V140Z" fill="#eff6f1" opacity=".34"/>`
      + [26, 74, 122, 170, 218, 266, 300].map(x =>
          `<path d="M${x} 140 V68" stroke="#7e9488" stroke-width="1" opacity=".34"/>`).join("")
      + `<path d="M2 140 V68 q0 -11 11 -11 H307 q11 0 11 11 V140" fill="none"
           stroke="#b9cbc0" stroke-width="1.3" opacity=".85"/>`
      + `<path d="M8 74 q152 -16 304 0" stroke="#ffffff" stroke-width="2.4" fill="none" opacity=".5"/>`
      + `<text x="12" y="64" font-size="9" fill="#5d7268" opacity=".9">膜 底 下</text>`
    : "";

  return `<svg class="tian" viewBox="0 0 320 140" role="img"
      aria-label="你的田：${esc(段)}，生态 ${e}，品质 ${q}，产量 ${h} 斤${倒 ? "，已倒伏" : ""}">
    <defs><linearGradient id="tianSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${天[0]}"/><stop offset="1" stop-color="${天[1]}"/>
    </linearGradient>
    <linearGradient id="旱泥" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c8b5e"/><stop offset="1" stop-color="#cbbd92"/>
    </linearGradient></defs>
    <rect width="320" height="46" fill="url(#tianSky)"/>
    <path d="M0 44 q42 -13 88 -4 q44 9 82 -2 q58 -13 150 5 v9 H0Z" fill="#7d8f72" opacity="${今景 ? 今景.山 : (年色 === "d" ? ".42" : ".58")}"/>
    <rect y="46" width="320" height="94" fill="${水}"/>
    <rect y="46" width="320" height="1.8" fill="#ffffff" opacity=".3"/>
    ${水里}
    ${丛.join("")}
    ${天气层}
    ${近前}
    ${膜层}
  </svg>`;
}

/* 田的样子 —— 把干瘪的数字翻译成"你现在看到什么" */
function 田的样子(S) {
  const { ecology: e, quality: q, harvest: h } = S.stats, out = [];
  if (e >= 85) out.push("田水清，看得见螺蛳贴着泥走。天一黑，蛙声一大片。");
  else if (e >= 70) out.push("田埂上能碰见青蛙，水里也有小虫在游。");
  else if (e >= 50) out.push("田里不算脏，可也没什么活物。土踩上去是实的。");
  else if (e >= 32) out.push("土有点板。蹲下去翻，蚯蚓少见。");
  else out.push("水发浑，田埂边积着一层白膜。田里静得吓人，一声虫叫都没有。");

  /* 画里有鸭子，字里就得有 —— 两边对不上，比不画还糟 */
  if (S.flags && S.flags["稻鸭"]) out.push("鸭子还在秧行间一趟一趟地趟。");

  if (q >= 78) out.push("叶片挺，颜色正，秆子捏着硬。");
  else if (q >= 62) out.push("长势中规中矩，看不出什么毛病。");
  else if (q >= 45) out.push("叶色偏深，有点贪青 —— 剑叶还黑绿着不褪。");
  else out.push("叶子黑绿得发亮，秆子捏着发软，基部节间拉得老长 —— 长得太猛了。");

  if (h >= 1100) out.push("稻子密，人走进去要拨开。");
  else if (h <= 600) out.push("田里稀，风一吹能看见地皮。");
  return out.join("");
}

function 验米(state) {
  const g = gradeOf(state.stats.quality, state.移线);
  let 眼力;
  if (g.名 === "特级") 眼力 = "抓一把摊在手心，米粒匀、透亮，没白肚。他捏了几粒放进嘴里嚼，点了点头，没说话。";
  else if (g.名 === "一级") 眼力 = "摊开看了看，米是好米，就是有几粒不太匀。他说：够得上一级。";
  else if (g.名 === "二级") 眼力 = "捏起来搓了搓，穗上带下来的青粒不少。他皱了皱眉：按二级走吧。";
  else 眼力 = "他抓了一把，看了看就放下了：这米，按商品粮收吧，进不了等级。";
  /* 线挪过就必须说清楚 —— 不说，玩家只会觉得"我明明跟去年种得一样"。
     这一句是"年景改的是验米的那条线，不是你田里的米"真正落地的地方。 */
  const 移 = state.移线 || 0, 二线 = 等级表[1].min;
  if (移 > 0)
    眼力 += `\n他没急着报价，先把米倒进量器又碾了一道：「不是你的米不好 —— 今年这天，籽粒不实，整精米率上不去。往日里 ${二线} 分就够二级，今年得 ${二线 + 移}。」`;
  else if (移 < 0)
    眼力 += `\n他碾了一道，抬头说：「今年这米实。整精米率高 —— 往常二级要 ${二线} 分，今年 ${二线 + 移} 就够。」`;
  return { grade: g, 眼力 };
}

function 年终(state) {
  const g = gradeOf(state.stats.quality, state.移线), 米价 = g.价;
  const 行情 = state.行情 || { 原粮: 1, 礼盒: 1 };
  const 谷价v = Math.round(米价 * NUM.原粮折扣 * NUM.出米率_代碾 * 行情.原粮 * 10) / 10;
  const 已卖谷 = state.soldGrain, 留谷 = state.grain - 已卖谷;
  const 米 = Math.round(留谷 * state.rate);

  /* 牌子 —— 生态养得好不好，直接决定人家买不买你的账。
     礼盒能吃下多少、认养能签出多少份，都乘这个系数。 */
  const 牌 = 牌子(state.stats.ecology);

  /* 认养的人要兑米 —— 那部分米不能再卖一遍 */
  let 兑米 = 0, 份 = 0, 人 = 0, 三产 = 0, 三产说明 = "田闲着，一分钱没挣";
  if (state.third !== "无") {
    /* 生态不挡人，只压量：30 分以下没人愿意来，往上越养越多 */
    const 系数 = clamp((state.stats.ecology - 30) / 50, 0, 1.25);
    if (state.third === "认养") {
      份 = Math.max(1, Math.round(NUM.认养份数 * 系数 * 牌));
      份 = Math.min(份, Math.floor(米 / NUM.认养兑米));   // 你手里得真有这些米才兑得出
      兑米 = 份 * NUM.认养兑米;
      三产 = Math.round(份 * NUM.认养单价);
      三产说明 = `${份} 份被认养，兑出去 ${兑米} 斤米`;
    } else {
      人 = Math.round(NUM.研学人数 * 系数 * 牌);
      三产 = Math.round(人 * NUM.研学单价);
       if (人 < 1) { 人 = 0; 三产说明 = "田里没什么可看的，没人来"; }
      else 三产说明 = `${人} 人次来研学`;
    }
  } else if (state.third !== "无") 三产说明 = "生态没养起来，没人愿意来";

  /* ── 三产之后，米还剩多少 ── */
  const 可售米 = Math.max(0, 米 - 兑米);

  /* ── 二产：两条路抢同一笔现金 ──
     礼盒要现钱买包装（12 元/斤），加工要现钱付加工费（8 元/斤）——
     手头的钱就这么多，铺了这边就铺不了那边。这是"本钱"真正咬人的地方。
     铺不下去的米不烂在仓里，最后按原粮价卖给粮库 —— 认赔，但认得明明白白。
     闸门顺序：① 等级给的市场容量　② 牌子（生态）　③ 行情　④ 兜里的现金 */
  const 现碾 = state.rate >= NUM.出米率_自碾 ? NUM.自碾礼盒加成 : 1;   // 自己碾的才叫"现碾鲜米"
  const 礼盒上限 = Math.min(可售米, Math.round(g.礼盒 * 牌 * 行情.礼盒 * 现碾));
  let 现金 = Math.max(0, state.现金);
  let 礼盒量 = 0, 加工量 = 0;
  if (state.channel === "礼盒" || state.channel === "混合") {
    礼盒量 = Math.min(礼盒上限, Math.floor(现金 / NUM.礼盒包装));
    现金 -= 礼盒量 * NUM.礼盒包装;
  }
  const 余米 = 可售米 - 礼盒量;
  if (state.channel === "混合" || state.channel === "深加工") {
    加工量 = Math.min(余米, Math.floor(现金 / NUM.深加工费));
  }
  const 原粮量 = 余米 - 加工量;                    // 装不起也加工不起的，走原粮
  const 包装费 = Math.round(礼盒量 * NUM.礼盒包装);
  const 加工费 = Math.round(加工量 * NUM.深加工费);
  const 二产 = Math.round(礼盒量 * 米价 * NUM.礼盒溢价 + 加工量 * NUM.深加工价);
  /* 一产 = 立冬提前卖掉的谷（按斤谷算）+ 年末没装盒的米（按斤米算）。
     ⚠ 两者单位不同：谷价是「元/斤谷」，原粮量是「斤米」——
       一斤米要 1/出米率 斤谷才碾得出来，所以米的原粮价 = 米价 × 0.7。 */
  const 原粮价 = 米价 * NUM.原粮折扣 * 行情.原粮;
  const 一产 = Math.round(已卖谷 * 谷价v + 原粮量 * 原粮价);

  /* 大寒那一步 —— 都是小钱，但让这一年收得有个人味儿 */
  const 额外 = state.额外 || 0;
  const 毛收入 = 一产 + 二产 + 三产 + NUM.粮补 + 额外;
  const 成本 = state.cost + 包装费 + 加工费;
  /* 手上的结余存进档里 —— 下一季开局按两成带过去。
     就存在这儿：账已经算完了，数不会再变；年终() 一局只跑一次。 */
  存档({ 存: Math.round(现金) });
  return { grade: g, 米价, 谷价: 谷价v, 牌, 行情, 米, 已卖谷, 留谷, 兑米, 可售米,
           一产, 二产, 三产, 三产说明, 礼盒量, 加工量, 原粮量, 礼盒上限,
           包装费, 加工费, 额外, 兜里剩: Math.round(现金),
           毛收入, 补贴: NUM.粮补, 成本, 净收益: 毛收入 - 成本 };
}

/* ── 成就 ──
   两件事跟以前不一样：
   ① 中途就发牌，不是憋到年终一起倒给你。种到一半蹦出一块金牌，
      这一局才有"再往下走一步看看"的劲儿。
   ② 发牌本身是个动作 —— 有牌子、有响、有档位。拿金牌那一下，
      跟拿铜牌不是同一种感觉。
   收尾时 r 传进来，那些要看账本的成就才判得出来。 */
function 结成就(S, r) {
  const got = [];
  ACH.forEach(a => { if (!S.ach[a.id] && a.when(S, r)) { S.ach[a.id] = true; S.本季成就.push(a); got.push(a); } });
  return got;
}

/* 发牌队列 —— 一次结算可能同时中好几块，排队一块一块弹 */
let 成就队 = [], 牌计时 = null;
function 发牌(ach) { ach.forEach(a => 成就队.push(a)); 弹牌(); }
function 弹牌() {
  const el = document.getElementById("pop");
  if (!el) return;
  const a = 成就队[0];
  clearTimeout(牌计时);
  if (!a) { el.className = "pop"; el.innerHTML = ""; return; }
  el.className = "pop on " + (a.级 || "铜");
  el.innerHTML = `<span class="lv">${a.级 || "铜"}</span>
    <div><b>${esc(a.名)}</b><p>${esc(a.说)}</p></div>`;
  响(a.级 === "金" ? "金" : a.级 === "银" ? "好" : "tap");
  牌计时 = setTimeout(收牌, a.级 === "金" ? 4000 : 3000);
}
function 收牌() { 成就队.shift(); 弹牌(); }
window.onPop = function () { if (成就队.length) 收牌(); else { 成就队 = []; 弹牌(); } };

/* 中途也会发牌：每次选完、每次回响落地，都重新扫一遍 */
function 扫成就(r) {
  const got = 结成就(S, r);
  if (got.length) { 发牌(got); 存档({ ach: { ...S.ach } }); }
  return got;
}


/* ══════════════════════════ 9. 渲染层 ══════════════════════════ */

const app = document.getElementById('app');
const LABEL = { harvest: "产量", quality: "品质", ecology: "生态" };
const UNIT  = { harvest: "斤", quality: "分", ecology: "分" };

let S = newSeason();
let screen = "cover", pendingEvents = [], lastResult = null, flash = {},
    miban = null, result = null, newAch = [], toastTimer = null, tab = "田";
/* 一个节气可能撞上好几件事。以前是全堆在一屏里 —— 出三件就是三张卡片摞着，
   读到第三张已经忘了第一张。现在一条一屏，这条指到第几件。 */
let 事件位 = 0;

function reset() {
  S = newSeason(); screen = "cover"; pendingEvents = []; lastResult = null;
  已倒过 = false; 事件位 = 0;
  flash = {}; miban = null; result = null; newAch = [];
}
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
/* 书上说 / 说白了 里用 **…** 圈出来的那几个字是要害。先 esc 再换 <b> ——
   顺序不能反，反了就是把用户输入当 HTML 用。只认这一种写法，不做完整 Markdown。 */
const 重 = s => esc(s).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
/* 白天动手，晚上翻书 —— 这一块是"农大实习生"这个身份真正落地的地方 */
const 查块 = c => !c ? "" : `<div class="note">
  <span class="k">晚 上 回 宿 舍 · 翻 资 料</span>
  <p class="q">${esc(c.问)}</p>
  <p class="s"><b>书 上 说</b>${esc(c.书)}</p>
  <p class="p"><b>说 白 了</b>${esc(c.白)}</p></div>`;
const yuan = n => Number(n).toLocaleString("zh-CN");
const para = s => String(s).split("\n").map(l => `<p>${esc(l)}</p>`).join("");

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), 2300);
}

/* ── 声音（WebAudio 现场合成，不引任何文件） ──
   一个单文件原型不该为几声动静多背几百 KB。 */
let 声 = null, 开声 = true;
function 音(频, 起, 长, 型, 量) {
  const o = 声.createOscillator(), g = 声.createGain();
  const t = 声.currentTime + 起;
  o.type = 型; o.frequency.value = 频;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(量, t + .012);
  g.gain.exponentialRampToValueAtTime(.0001, t + 长);
  o.connect(g); g.connect(声.destination);
  o.start(t); o.stop(t + 长 + .03);
}
function 响(k) {
  if (!开声) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!声) 声 = new AC();
    if (声.state === "suspended") 声.resume();
    (音效[k] || 音效.tap)();
  } catch (e) { /* 静音就静音，不能把游戏搞崩 */ }
}
const 音效 = {
  tap:  () => 音(620, 0, .07, "triangle", .08),
  好:   () => { 音(587, 0, .13, "sine", .11); 音(880, .085, .20, "sine", .10); },
  坏:   () => { 音(392, 0, .15, "sine", .11); 音(262, .10, .26, "sine", .11); },
  钱:   () => { 音(1046, 0, .09, "square", .06); 音(1318, .07, .18, "square", .05); },
  翻:   () => 音(440, 0, .06, "triangle", .05),
  抽:   () => { for (let i = 0; i < 7; i++) 音(240 + i * 46, i * .035, .18, "triangle", .045); },
  /* 上上 / 下下 独有的三个音 —— 稀有的东西该有稀有的动静 */
  金:   () => [523, 659, 784, 1047].forEach((f, i) => 音(f, i * .085, .55, "triangle", .10)),
  凶:   () => [330, 262, 196, 165].forEach((f, i) => 音(f, i * .10, .55, "sawtooth", .06)),
};

/* ── 进度表：八个格子，走过的沉下去，眼下的点着 ── */
function 节气条() {
  if (screen === "cover") return "";
  const 全收 = screen === "miban" || screen === "chain" || screen === "yearend"
            || S.termIndex >= S.节气.length;
  const cells = S.节气.map((d, i) => {
    const cls = 全收 || i < S.termIndex ? "过" : i === S.termIndex ? "今" : "";
    return `<div class="td ${cls}"><i></i><span>${d.term}</span></div>`;
  }).join("");
  return `<div class="tstrip">${cells}</div>`;
}

/* 品质底下那一行。为什么要显示这个 ——
   米价是跳档的（等外 3 / 二级 8 / 一级 15 / 特级 25），不是按点数涨的。
   所以"品质 +9"这个按钮的价值，全看它有没有把你顶过下一条线：
   从 76 加到 78，一亩多卖好几百；从 84 加到 93，一分钱不多，还白搭了 40 斤产量。
   玩家看不见线，就只能一路堆品质 —— 那不是他不会玩，是这局没给他能玩的信息。
   这里只给事实（你在哪一档、离下一档差几点）。
   为什么是 78 这条线、为什么要整精米率，那属于"回宿舍翻资料"那头。

   ⚠ 线会跟着年景挪，所以这里必须传 S.移线。箭头不是装饰：
   它说的是"今年的线和往年不一样" —— 那个数在年景卡上。 */
function 品阶行(q, 移线 = 0) {
  const g = gradeOf(q, 移线);
  const 下 = 等级表.find(x => x.min > 0 && x.min + 移线 > q);
  const 标 = 移线 ? `<b class="${移线 > 0 ? "up" : "dn"}">${移线 > 0 ? "↑" : "↓"}</b>` : "";
  if (!下) return `<i class="top">${g.名} · 到顶了${标}</i>`;
  const 差 = 下.min + 移线 - q;
  return `<i class="${差 <= 4 ? "near" : ""}">${g.名} · 差 ${差} 点到${下.名}${标}</i>`;
}

function hud(withField) {
  const cells = ["harvest","quality","ecology"].map(k => {
    const v = S.stats[k], f = flash[k];
    const cls = f > 0 ? "up" : f < 0 ? "dn" : (v <= 25 ? "low" : "");
    /* 把上一次显示的数写进 DOM —— 渲染完再滚过去，数字才是"变"出来的 */
    const 从 = S.显数[k], 滚 = (f && 从 !== undefined && 从 !== v) ? ` data-from="${从}"` : "";
    S.显数[k] = v;
    return `<div class="c ${cls}"><b${滚}>${v}</b>${LABEL[k]}${k === "quality" ? 品阶行(v, S.移线) : ""}</div>`;
  }).join("");
  /* 种地那一段看"已投入"，收完之后看"手里还剩多少" —— 后半段的每一步都是拿这笔钱换的 */
  const 后段中 = screen === "hangqing" || screen === "chain";
  const 钱 = 后段中
    ? `<div class="c m"><b>${S.现金 < 0 ? "-" + yuan(-S.现金) : yuan(Math.round(S.现金))}</b>手头现金</div>`
    : `<div class="c m"><b>${S.cost ? "-" + yuan(S.cost) : "0"}</b>已投入</div>`;
  return `<div class="head"><div class="hud">${cells}
    <div class="c s ${S.stamina <= 15 ? "low" : ""}"><b>${S.stamina}</b>体力</div>
    ${钱}
    <div class="c snd ${开声 ? "" : "off"}" onclick="onSound()">${开声 ? "♪" : "×"}</div>
  </div>${节气条()}</div>${withField
    ? `<div class="field">${田的画(S)}<span class="wh">田 里 的 样 子</span>${esc(田的样子(S))}</div>`
    : ""}`;
}

/* 渲染之后的动作：数字滚过去、条形长出来 —— 都是"变"给人看的 */
function 起动画() {
  if (!app.querySelectorAll) return;
  /* 数字滚动：从上一个值爬到新值，爬的过程本身就是一个反馈 */
  app.querySelectorAll("[data-from]").forEach(el => {
    const 从 = +el.dataset.from, 到 = +el.textContent;
    delete el.dataset.from;
    if (从 === 到 || !isFinite(从) || !isFinite(到)) return;
    const t0 = performance.now(), 时长 = 430;
    const 走 = t => {
      const p = Math.min(1, (t - t0) / 时长);
      el.textContent = Math.round(从 + (到 - 从) * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(走); else el.textContent = 到;
    };
    requestAnimationFrame(走);
  });
  /* 验米那三条：一条一条长出来，比一起蹦出来有看头 */
  app.querySelectorAll("[data-w]").forEach((el, i) => {
    const 宽 = el.dataset.w;
    setTimeout(() => {
      el.style.transition = "width .85s cubic-bezier(.2,.8,.3,1)";
      el.style.width = 宽;
    }, 150 + i * 130);
  });
  /* 净收益：从 0 爬到那个数。爬的过程就是"这一季攒出来了"的过程 */
  app.querySelectorAll("[data-count]").forEach(el => {
    const 到 = +el.dataset.count;
    delete el.dataset.count;
    if (!isFinite(到)) return;
    const 负 = 到 < 0, t0 = performance.now(), 时长 = 1150;
    const 走 = t => {
      const p = Math.min(1, (t - t0) / 时长);
      const v = Math.round(到 * (1 - Math.pow(1 - p, 3)));
      el.textContent = (负 && v !== 0 ? "−" : "") + Math.abs(v).toLocaleString("zh-CN");
      if (p < 1) requestAnimationFrame(走);
      else el.textContent = (负 ? "−" : "") + Math.abs(到).toLocaleString("zh-CN");
    };
    setTimeout(() => requestAnimationFrame(走), 320);
  });
  /* 收入构成那条横条：整体从左往右擦出来，不逐段长 —— 逐段会长得参差不齐 */
  app.querySelectorAll("[data-wipe]").forEach(el => {
    setTimeout(() => el.classList.add("go"), 260);
  });
}

function deltaText(d) {
  return Object.keys(d).filter(k => d[k])
    .map(k => `${LABEL[k]} ${d[k] > 0 ? "+" : ""}${d[k]}${UNIT[k]}`).join("　");
}

/* 年景卡 —— 开局那一屏和每局的决策屏都用它，保证抽到什么都长一个样。
   ⚠ 线挪过的年份，这里必须把今年的线印出来。这是整张卡最要紧的一行：
   "今年特级要 93" 是一个能拿去做决定的事实，"今年年景差"不是。 */
function 年景卡(y) {
  const 移 = y.移线 || 0;
  const 名 = ["二级", "一级", "特级"];
  const 线 = 移
    ? `<p class="ln">今年验米的线　${等级表.slice(1).map((x, i) => `${名[i]} <b>${x.min + 移}</b>`).join("　")}
       <span>往常是 ${等级表.slice(1).map(x => x.min).join(" / ")}。${移 > 0
         ? "今年籽粒不实，碾出来碎米多 —— 线往上抬。" : "今年籽粒灌得饱，整米多 —— 线往下走。"}</span></p>`
    : "";
  return `<div class="yc ${y.级 || "R"} ${y.色 === "d" ? "xiong" : ""}">
    <span class="tier">${y.签 || ""}</span>
    <span class="k">今 年 的 年 景</span>
    <b class="${y.色}">${y.名}</b>
    <p>${esc(y.说)}</p>
    <p style="color:#a8b8a2">${esc(y.报)}</p>${线}</div>`;
}

/* ── 开场 ── */
function viewCover() {
  return `<div class="cover">
    <h1 class="name">一亩稻</h1>
    <p class="sub">京 西 稻 · 第 ${档().季 || 1} 季</p>
    <div class="lead">
      <p>玉泉山的水从西边流过来。清代，这一带的水田种出来的稻子，是要送进宫的。鼎盛的时候，海淀有近十万亩稻田。</p>
      <p>2000 年，京密引水渠不再给农田供水。稻田一年少一两万亩。到今天，全区剩下约两千亩 —— 是当年的百分之二。</p>
      <p>这剩下的两千亩，靠一个农业文化遗产的名头，靠一亩地九百块的粮补，靠一家三十个人的镇属公司年年往里贴，才留下来。</p>
      <p>你是农大农学院的学生。这个夏天，学院安排你到上庄生产实习一季。</p>
      <p>带你的人是老周 —— 上庄镇农业公司的技术员，五十七岁，这一带的稻子他种了四十年。头一天见面，他上下看了你一眼，没问你学过什么，只说了一句：</p>
      <p><em>「来了就先看。别急着动手。」</em></p>
      <p>公司划出一亩试验田，让你从头跟一季。<em>种成什么样，你自己负责。</em></p>
    </div>
    ${攒下来(S)}
    <button class="go" onclick="startGame()">下 田</button>
    <button class="go sm ghost" onclick="openBook('封面')">看 看 攒 下 的 东 西</button>
    <p class="foot">八 个 节 气 　·　验 米 　·　卖 米</p>
  </div>`;
}

/* ── 攒下来的 ──
   放在封面上，因为"攒了多少"这个问题，玩家是在**开局**问的，不是在田里。
   原来图鉴和成就只能种到一半、从田里点进去看，看完还只能回田里 ——
   最该看的东西，偏偏在最不该看的时候才能看。
   头一季不摆：什么都还没有，摆一排 0 是寒碜人。 */
function 攒下来(S) {
  if ((S.季 || 1) < 2) return "";
  const keys = Object.keys(CODEX);
  const 认得 = keys.filter(k => S.codex[k]).length;
  const 成就 = ACH.filter(a => S.ach[a.id]).length;
  const 金 = ACH.filter(a => (a.级 || "铜") === "金" && S.ach[a.id]).length;
  const 金总 = ACH.filter(a => (a.级 || "铜") === "金").length;
  return `<div class="kan">
    <span class="k">这 一 季 开 局 带 着 的</span>
    <b>田里的毛病，你认得 ${认得} / ${keys.length} 样</b>
    <p>认出来一次就忘不掉。再碰上，白送你一条线索 —— 只送一条，
    剩下两条还得自己蹲下去看。</p>
    <b>成就 ${成就} / ${ACH.length} 块，其中金牌 ${金} / ${金总}</b>
    <p>上一季的收成扣掉花销，两成留下来做了这一季的本钱；
    在田里练出来的力气，也带过来了一点。</p>
  </div>`;
}

/* ── 抽年景 ──
   开局这一屏单独给年景。它是这一局的底牌 —— 值得停一下再翻。 */
function viewPull() {
  return `<div class="pull">
    <p class="lead2">今 年 的 天</p>
    ${年景卡(S.年景)}
    ${带过来(S)}
    <p class="grade-note" style="color:#7d8a6e;font-size:14.5px;margin:2px 0 0">
      这一季就这个天。先看清楚，再决定怎么种 —— 天改不了，怎么应对是你的事。</p>
  </div>
  <div class="spacer"></div>
  <button class="go" onclick="toField()">看 看 田 里</button>`;
}

/* ── 事件屏 ──
   一条一屏。以前是一个节气的所有事堆一屏，出三件就是三张卡片摞着 ——
   读到第三张已经忘了第一张。而且带诊的那一条要动手，它必须独占一屏。

   ── 带诊的那一条：v5.0 最要紧的改动 ──
   旧写法第一句就是结论（"恶苗病。由种子带菌，病菌分泌赤霉素……"）。
   谜面和谜底一起给，玩家读到的是农技资料，不是一亩田 —— 这就是
   "太专业、太客观、有点失真"。真实的田里没有字幕。
   现在第一句只写眼睛能看见的：颜色、斑点、形状、手感、气味。
   要知道那是什么，你得蹲下去拔一根、或者去问老周 —— 自己凑出来。

   而且认出来是**真有用**的：认得出是二化螟，"现在打药还来得及"这个选项
   才会出现。认不出来，dueEvents 里那笔最坏的账已经扣下去了，你只能照吃。
   这就是哑巴亏，也是这个游戏最想让人尝到的东西。 */
function viewEvent() {
  const e = pendingEvents[事件位];
  if (!e) return "";
  const d = S.节气[Math.min(S.termIndex, S.节气.length - 1)];
  const 负 = Object.keys(e.delta).some(k => e.delta[k] < 0);
  const dt = deltaText(e.delta);
  const 标 = e.from && e.from[0] === "年景" ? `今 年 的 天 · ${S.年景.签 || ""}`
    : e.mood === "good" ? "有 回 响" : "出 事 了";
  const 多 = pendingEvents.length > 1
    ? ` · 这个节气第 ${事件位 + 1} 件，共 ${pendingEvents.length} 件` : "";
  const 末 = 事件位 + 1 < pendingEvents.length ? "还 有 一 件" : "继 续";
  /* 田就画在这儿 —— "出事了"这四个字底下的稻子已经倒了。
     倒下去的那一下只演一次，正好是你读到这条消息的时候。 */
  const 头 = `${hud(true)}
    <div class="step">第 ${S.termIndex + 1} / ${S.节气.length} 个节气${多}</div>
    <h2 class="term">${d.term}<small>${d.date}</small></h2>`;

  /* ── 不用诊的（天灾、年景、好事）：照旧一张卡 ── */
  if (!e.诊) {
    return `${头}<div class="spacer"></div>
      <div class="event ${e.mood}">
        <span class="tag">${标}</span>
        <p>${重(e.line)}</p>
        ${dt ? `<span class="dl ${负?"neg":"pos"}">${dt}</span>` : ""}
        ${e.from ? `<span class="from">这笔账来自 <b>${e.from.join(" ")}</b></span>` : ""}
      </div>${查块(e.查)}<div class="spacer"></div>
      <button class="go" onclick="nextEvent()">${末}</button>`;
  }

  /* ══ 要诊的那一条 ══ */
  const z = e.诊;
  const 能 = z.步.map((s, i) => ({ s, i })).filter(x => !z.点过[x.i]);
  const 够 = z.值 >= z.成;
  /* 三种完法：看够了 / 自己说"先记着" / 手上没得看了 */
  const 完 = z.完 || 够 || !能.length;
  /* 人事那几条不走诊断（步是空的、成是 0），看见的是事情不是田，
     标签和结论块都得换掉 —— 不换的话会出来「你 认 出 来 了」，认出的却是一片空白。 */
  const 看见 = `<div class="kan"><span class="k">${
    z.岔 ? "这 么 档 子 事" : "田 里 是 什 么 样"}</span><p>${重(e.line)}</p></div>`;
  const 事件题 = z.岔 && z.题
    ? `<h3 class="title" style="font-size:19px">${esc(z.题)}</h3>` : "";
  const 线索 = z.得.length
    ? `<div class="zh">${z.得.map(x =>
        `<div class="cond${x.定 ? " 定" : ""}"><span class="wh">${esc(x.wh)}</span>${重(x.得)}${
          x.定 ? '<span class="ding">这 一 处 够 了</span>' : ""}</div>`).join("")}</div>`
    : "";
  /* 提示行 —— 原来的"看两处，心里才有底"是写死的，等于告诉玩家这是个计数器。
     现在它说的是"还差什么"，而且分三种说法，对应三条不同的推理路子：
       成1        → 这毛病扎眼，一眼的事
       还有定案的一处没找到 → 告诉他"可能有那么一处"，但不说是哪一处
       没有定案的一处       → 直说"得两处对起来看"，省得他白费体力 */
  const 有定案 = 能.some(x => (x.s.值 === undefined ? 1 : x.s.值) >= z.成);
  const 提点 = 够 ? ""
    : z.成 === 1   ? "这毛病扎眼 —— 找对地方，一眼就认得出来。"
    : 有定案       ? (z.得.length
        ? "还差一点。剩这几处里，说不定有一处就够。"
        : "说不定一处就够 —— 看你找的是不是那一处。")
    :                (z.得.length
        ? "看了一处，可光一处说不准 —— 得两处对起来看。"
        : "这毛病光看一处说不准 —— 得两处对起来看。");
  /* 上季认过的，提点前面挂一句 —— 白送的那一条得让人知道是从哪儿来的 */
  const 提点全 = 提点 && z.熟 ? "上季你认过它。" + 提点 : 提点;

  /* ① 还没看明白，手上还有得看 —— 出动作 */
  if (!完) {
    return `${头}
      <h3 class="title" style="font-size:19px">${esc(z.题 || "这是怎么了")}</h3>
      ${看见}${线索}
      <p class="brief">光站在田埂上看不出来。你打算怎么办？</p>
      <div class="spacer"></div>
      ${能.map(x => `<button class="btn" onclick="onDiag(${x.i})">${重(x.s.text)}
        <span class="cost">${x.s.费 ? `花 ${x.s.费} 点体力` : "不费什么"}${x.s.收 ? "　·　这一条看过就算完了" : ""}</span></button>`).join("")}
      <p class="tianhint">${提点全}</p>
      <div class="spacer"></div>`;
  }

  /* ② 看明白了 —— 名字落地，然后是处置 */
  if (够) {
    const c = CODEX[z.名];
    const 结 = z.岔 ? "" : `<div class="zh"><div class="got">
      <span class="lb">你 认 出 来 了</span>
      <span class="nm">${esc(z.名)}</span>
      ${c ? `<p><b style="font-weight:600">书上说</b>　${重(c[1])}</p>` : ""}
      ${z.白 ? `<p><b style="font-weight:600">说白了</b>　${重(z.白)}</p>` : ""}
    </div></div>`;

    /* 处置过了 —— 出结果 */
    if (z.治) {
      const t = z.治, d2 = deltaText(t.delta);
      return `${头}${事件题}${看见}${线索}${结}
        <div class="event ${z.岔 ? "" : (t.好 ? "good" : "bad")}">
          <span class="tag">${z.岔 ? "你 拿 了 主 意" : "你 动 手 了"}</span>
          <p>${重(t.说)}</p>
          ${d2 ? `<span class="dl ${t.好?"pos":"neg"}">${d2}</span>` : ""}
        </div><div class="spacer"></div>
        <button class="go" onclick="nextEvent()">${末}</button>`;
    }

    /* 还没处置 —— 出处置选项；没有可处置的就直接收 */
    const 处 = z.处置 || [];
    if (!处.length) {
      return `${头}${看见}${线索}${结}<div class="spacer"></div>
        <button class="go" onclick="nextEvent()">${末}</button>`;
    }
    return `${头}${事件题}${看见}${线索}${结}
      <p class="brief">${esc(z.问 || "知道是什么了。这一手还救不救得回来，你得拿个主意。")}</p>
      <div class="spacer"></div>
      ${处.map((o, i) => `<button class="btn" onclick="onTreat(${i})">${重(o.text)}
        <span class="cost">${[o.费 ? `花 ${o.费} 点体力` : "", o.钱 ? `掏 ${yuan(o.钱)} 元` : ""].filter(Boolean).join("　·　") || "不费什么"}</span></button>`).join("")}
      <div class="spacer"></div>`;
  }

  /* ③ 没看出来 —— 账照吃，人还是糊涂的 */
  return `${头}${看见}${线索}
    <div class="zh"><div class="blind">你在田里转了两圈，蹲下去又站起来，还是没看出这是个什么。
      该记的账还是记上了 —— 只是你到现在也不知道，那是什么。</div></div>
    <div class="spacer"></div>
    <button class="go" onclick="nextEvent()">${末}</button>`;
}

/* ── 决策屏 ── */
function viewDecision() {
  const d = S.节气[S.termIndex];
  if (d.热区 && d.热区.length === d.options.length) return 田里点(d);
  const buttons = 有位(d).map(i => {
    const o = d.options[i];
    const 缺口 = Math.max(0, o.stam - S.stamina);
    const 钱 = o.cost + 缺口 * NUM.雇工价;
    const bits = [`${o.stam} 点体力`];
    if (缺口 > 0) bits.push(`自己干不完，雇 ${缺口} 个人工 <i class="hard">+${yuan(缺口*NUM.雇工价)} 元</i>`);
    if (o.cost > 0) bits.push(`花 <i>${yuan(o.cost)} 元</i>`);
    return `<button class="btn" onclick="onChoose(${i})">
      ${esc(o.text)}<span class="cost">${bits.join("　·　")}</span></button>`;
  }).join("");

  return `${hud(true)}
    <div class="step">第 ${S.termIndex + 1} / ${S.节气.length} 个节气</div>
    <h2 class="term cmp">${d.term}<small>${d.date}</small></h2>
    <h3 class="title cmp">${esc(d.title)}</h3>
    ${d.story ? `<div class="say"><span class="who">${esc(d.story.who)}</span>${para(d.story.text)}</div>` : ""}
    <p class="brief cmp">${esc(d.brief)}</p>
    <div class="spacer"></div>${buttons}<div class="spacer"></div>`;
}

/* ── 田里点 ──
   跟上面那屏的差别只有一处：**选项不写在按钮上，写在田里**。
   你点的不是"露地育秧"这四个字，是那片敞着的秧田；不是"盖膜育秧"，
   是田埂上那摞膜。点哪儿，就是把哪儿的事做了。

   为什么非要做成这样 —— 现在这一屏是「一段故事 + 两个按钮」，
   玩家三分钟里读了两千字，手上一下没动过。人的手不动，就不觉得在玩。
   而这里的手是有分量的：你点下去的是田里那个东西，不是一条选项。

   ⚠ 热区的坐标是 SVG viewBox(320×140) 里的坐标，靠百分比铺到画面上，
     所以田放大缩小时气泡跟着走。田本身现在也大了 —— 原来它只是 HUD
     底下一条小图，跟正文抢不到注意力，"你有一块地"这件事立不住。

   ⚠ 这里必须 hud(false)。hud(true) 会把那一小块田连同"田里的样子"一起画在顶上，
     于是同一屏里出现两块田 —— 一块小的摆在那儿不能点，一块大的能点，
     玩家第一反应是去点小的那块。田这一屏只该有一块，就是能点的这块，
     田的样子那句话降级成图注（.tsay）跟在它下面。 */

/* 这一屏真能点哪几条。灵感带出来的那一条，没翻过那一晚的书就不在表里。
   ⚠ 田里点、决策屏、家什层三处必须走同一个表 —— 各写各的 filter，
     迟早会出现"看得见点不着"或者"点得着看不见"。
   灵感选项一律排在最后，所以滤掉它前头的下标一个不动。 */
const 有位 = d => (d.options || []).map((o, i) => i)
  .filter(i => !d.options[i].要灵 || S.灵感[d.options[i].要灵]);

function 田里点(d) {
  const 点 = 有位(d).map(i => {
    const h = d.热区[i];
    const o = d.options[i];
    const 缺口 = Math.max(0, o.stam - S.stamina);
    const bits = [`${o.stam} 体力`];
    if (缺口 > 0) bits.push(`雇工 +${yuan(缺口 * NUM.雇工价)}`);
    if (o.cost > 0) bits.push(`${yuan(o.cost)} 元`);
    const 左 = h.x / 320 * 100, 上 = h.y / 140 * 100;
    /* 气泡往哪边飘：靠右的点就把气泡摆到左边去，别顶出屏幕。
       ⚠ 摆过去之后**小尖嘴也得跟着挪** —— 尖嘴默认在气泡正中（居中那套是对的），
         可气泡一旦改成贴边，正中就飘到别处去了，指着空气。所以顺带带个类名，
         让 CSS 把尖嘴挪到挨着圆点的那一头。 */
    const 靠右 = h.x > 210, 靠左 = h.x < 90;
    /* ⚠ 偏移是相对**按钮盒的中心**算的，不是相对一个零大的点。按钮盒 58×58，
       所以 50% 就是那个中心；贴边的两套写 calc(50% + 6px)，气泡边离中心 6px，
       小尖嘴正好跨在中心上（见 .bub.l/.bub.r 的 ::after）。 */
    /* h.下 = 这一处的气泡挂在点**下方**（三点一屏时用来错开）。
       横着那两套照旧，只把纵向的 -100% 去掉 —— 上下由 .bub.d 那几条 CSS 管。 */
    const 位 = h.下
      ? (靠右 ? "right:calc(50% + 6px);transform:translateY(0)"
         : 靠左 ? "left:calc(50% + 6px);transform:translateY(0)"
         : "left:50%;transform:translate(-50%,0)")
      : (靠右 ? "right:calc(50% + 6px);transform:translateY(-100%)"
         : 靠左 ? "left:calc(50% + 6px);transform:translateY(-100%)"
         : "left:50%;transform:translate(-50%,-100%)");
    /* 有家什的那一处，**家什自己就是记号** —— 不再画圆点。
       圆点 30px 压在一件 45px 宽的家什上，等于把它糊住了：玩家看见的是个白圈，
       不是"田埂上那摞膜"。记号只有一个，要么是家什（它在呼吸），
       要么是圆点（指田本身的那种，没东西可指，就得给个点）。 */
    return `<button class="hot" style="left:${左.toFixed(2)}%;top:${上.toFixed(2)}%"
        onclick="onHot(${i})" aria-label="${esc(o.text)}">
      <span class="bub ${靠右 ? "r" : 靠左 ? "l" : "c"}${h.下 ? " d" : ""}" style="${位}"><b>${esc(h.标)}</b><i>${bits.join(" · ")}</i></span>
      ${h.画 ? "" : `<span class="dot"></span>`}</button>`;
  }).join("");

  return `${hud(false)}
    <div class="bigfield">${田的画(S)}${点}</div>
    <p class="tsay"><span class="wh">田 里 的 样 子</span>${esc(田的样子(S))}</p>
    <div class="step">第 ${S.termIndex + 1} / ${S.节气.length} 个节气</div>
    <h2 class="term cmp">${d.term}<small>${d.date}</small> · ${esc(d.title)}</h2>
    ${d.story ? `<div class="say"><span class="who">${esc(d.story.who)}</span>${para(d.story.text)}</div>` : ""}
    <p class="brief cmp">${esc(d.brief)}</p>
    <p class="tianhint">点田里的东西 —— 点哪儿，就是把哪儿的事做了。</p>
    <div class="spacer"></div>`;
}

/* ── 反馈屏 ──
   一屏只说一件事：这一手把三个数变成了什么样。
   老表格式的三行"前→后"删了 —— 顶上那条随时在显示当前值，重复一遍就是噪音。
   查资料挪去它自己那屏（见 viewNote）—— 白天动手、晚上翻书，本来就是两件事。 */
function viewResult() {
  const d = S.节气[S.termIndex], R = lastResult;
  const 大 = ["harvest","quality","ecology"].filter(k => R.delta[k]).map((k, n) => {
    const v = R.delta[k];
    return `<div class="dl-big ${v > 0 ? "u" : "d"}" style="animation-delay:${n*.08}s">
      <b>${v > 0 ? "+" : ""}${v}</b><span>${LABEL[k]}${UNIT[k]}</span></div>`;
  }).join("");
  const 体 = R.体力前 - R.体力;
  /* ── 今晚这一段值不值得熬 ──
     不给这句话，翻书就是个盲赌：全季二十来个选项里只有几个带灵感，
     玩家算下来"大概率白扔两点体力"，就不翻了 —— 那正是他抱怨的
     「翻书翻不出什么灵感」。给了信号，翻书才变回取舍：拿体力换念头。
     而且这一句是"人"话，不是系统的提示 —— 今天这活儿，让我想起在哪儿看过。
     ⚠ 读的是 R.查，不是 S.待查：S.待查 要到 onNight 里才写，
       按钮这一屏它还是上一晚留下的 null。
     ⚠ 已经得过的那条不再提示（可灵 里也是这么判的）——
       否则玩家会为了一个拿不到的东西熬夜。 */
  const 有念 = !!(R.查 && R.查.灵 && !S.灵感[R.查.灵]);
  const 够力 = S.stamina >= NUM.灵感体力线;
  const 夜话 = !有念 ? (够力 ? "" : " · 精神不够，翻不出念头")
    : 够力 ? " · 今天这事儿，我好像在哪儿看过"
    : " · 今天这事儿我好像在哪儿看过 —— 可就这点精神，怕是熬不出来";
  const 花 = [];
  if (R.花销) 花.push(`花 ${yuan(R.花销)} 元`);
  if (R.雇工费) 花.push(`自己干不动，请了 ${R.缺口} 个人工，${yuan(R.雇工费)} 元`);
  if (体) 花.push(`出力 ${体} 点`);
  /* 在田里点过的那一屏，做完把田**再摆一遍** —— 位置跟刚才一模一样，
     只有一样东西变了。这就是"我这一手干了什么"最直接的答复：
     盖膜那一下，田里真的蒙上了一层；不盖，田还是敞着的。
     ⚠ 只有点过田的那一屏这么干。其余屏照旧不带田（hud() 不传参 = 不要那块小的），
       别顺手全给加上 —— 那是八个屏一起变样，得先说一声。 */
  const 大田 = d.热区 && d.热区.length === d.options.length;
  return `${hud(大田 ? false : undefined)}
    ${大田 ? `<div class="bigfield">${田的画(S)}</div>` : ""}
    <div class="step">${d.term} · ${esc(d.title)}</div>
    ${大 ? `<div class="deltas">${大}</div>` : ""}
    <p style="font-size:18px">${esc(R.text)}</p>
    ${R.note ? `<p style="color:var(--dim);font-size:15px">${esc(R.note)}</p>` : ""}
    ${R.说 ? `<div class="kan">
      <span class="k">这 一 手 跟 什 么 有 关</span>
      <b>${esc(R.关)}</b>
      <p>${重(R.说)}</p></div>` : ""}
    ${花.length ? `<p style="color:var(--clay);font-size:14.5px;margin:14px 0 0">
      ${花.join("　·　")}　·　本季已投入 ${yuan(S.cost)} 元</p>` : ""}
    <div class="spacer"></div>
    <p class="tianhint">天 黑 了 · 宿 舍 · 熄 灯 前</p>
    <button class="go" onclick="onNight('读')">翻 翻 书
      <small>翻到半夜 · 今晚只回 ${NUM.翻书恢复} 点体力${夜话}</small></button>
    <button class="go sm ghost" style="margin-top:10px" onclick="onNight('睡')">倒 头 就 睡
      <small>今晚回 ${NUM.睡觉恢复} 点体力${有念 ? " · 那点念头，只好先放着" : " · 什么也不多"}</small></button>`;
}

/* ── 回宿舍翻资料 ──
   单独一屏。白天那个没想明白的事儿，晚上翻书翻出来了 —— 它值一屏的注意力。 */
function viewNote() {
  const d = S.节气[S.termIndex];
  const 灵 = S.新灵感 ? 灵感[S.新灵感] : null;
  /* 三种晚上，得说三种话 —— 玩家要靠这个学会"哪天值得熬"：
       真出念头了   → 摆出来，并告诉他这东西哪天用得上
       书上有灵、精神不够 → **把规则明说**（不到 30 只剩字），不然他会以为是随机的
       这段书本来就没念头 → 不提，免得每屏都在吊胃口 */
  const 欠 = !灵 && S.待查 && S.待查.灵;
  const 旁 = 灵
    ? `<div class="ling"><span class="k">脑 子 里 多 出 个 念 头</span>
        <p>${重(灵.得)}</p>
        <span class="where">等 ${灵.落} 那一天，田里会多出一处你能点的东西。</span></div>`
    : 欠
    ? `<div class="ling 欠"><span class="k">今 晚 翻 不 动</span>
        <p>眼睛在字上走，念头起不来。今天在地里太乏了。</p>
        <span class="where">体力不到 ${NUM.灵感体力线} 的晚上，翻书只剩字。想熬出东西，白天就得省着点力气。</span></div>`
    : "";
  return `${hud()}
    <div class="step">${d.term} · 宿舍 · 熄灯前</div>
    ${查块(S.待查)}${旁}
    <div class="spacer"></div>
    <button class="go" onclick="onContinue()">${
      S.termIndex + 1 >= S.节气.length ? "收 割" : "睡 了 · 明 天 再 说"}</button>`;
}

/* ── 验米 ── */
/* ── 验米揭晓 ──
   这是全季攒了八个节气之后第一次听见响。
   每一档都得有排面 —— 特级是特级那一种，等外是等外那一种，
   但都得是"你种出来的"这件事被正正经经地摆上台面。
   档位（气）不同，舞台不同：金光、银绿、青绿、土黄。
   不变的只有一件事 —— 先夸人，再讲米。 */
function viewMiban() {
  const g = miban.grade, 气 = g.气 || "c";
  /* 星芒数量跟档位走：特级五颗，一级三颗，二级一颗，等外没有 */
  const 星数 = { a: 5, b: 3, c: 1, d: 0 }[气];
  const 位置 = [[22,26],[74,20],[48,14],[30,64],[68,58]];
  const 星 = 位置.slice(0, 星数)
    .map(([x,y],i) => `<span class="spark" style="left:${x}%;top:${y}%;animation-delay:${.45+i*.14}s"></span>`).join("");
  const 牌 = { a: "够 得 上 贡 米", b: "地 头 现 碾 鲜 米", c: "收 粮 等 级", d: "这 一 季 的 米" }[气];
  /* 条形不用 transition，交给渲染后的 起动画() 一条一条长出来 */
  const bar = (k, v) => {
    const pct = k === "harvest" ? clamp((v-400)/8, 0, 100) : clamp(v, 0, 100);
    return `<div style="display:flex;align-items:center;gap:10px;font-size:13px;color:var(--dim);margin-bottom:7px">
      <span style="width:34px;flex:none">${LABEL[k]}</span>
      <span style="flex:1;height:6px;background:#e6e0cf;border-radius:3px;overflow:hidden">
        <span data-w="${pct}%" style="display:block;height:100%;border-radius:3px;width:0;
          background:${气 === "a" ? "var(--gold)" : 气 === "d" ? "#c2a878" : "var(--green)"}"></span></span>
      <span style="width:38px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)">${v}${UNIT[k]}</span></div>`;
  };
  return `<div style="margin:0 0 16px">${节气条()}</div>
    <div class="step">秋分之后 · 验米</div>
    <div class="grade-wrap ${气}">${星}
      <div class="grade-name ${气}">${g.名}</div>
      <div class="grade-tag">${牌}</div>
      <p class="praise">${esc(g.夸)}</p></div>
    <p class="grade-note" style="margin-top:0">${esc(miban.眼力)}</p>
    <div style="margin:14px 0 0">${bar("harvest",S.stats.harvest)}${bar("quality",S.stats.quality)}${bar("ecology",S.stats.ecology)}</div>
    <p class="grade-note" style="color:var(--dim)">这个等级决定了你的米按什么价走 —— ${yuan(g.价)} 元一斤。${esc(g.口感)}。</p>
    <div class="field" style="margin-top:18px">${田的画(S)}<span class="wh">这 一 季 的 田</span>${esc(田的样子(S))}</div>
    ${S.log.length ? `<h3 class="title" style="font-size:17px">地里的账</h3>
      ${S.log.map(e => `<p class="note-line">${重(e.line)}</p>`).join("")}` : ""}
    <div class="spacer"></div>
    <button class="go" onclick="toChain()">把 粮 拉 回 去</button>`;
}

/* ── 二三产 ── */
/* ── 行情揭晓 —— 后半段的抽卡，跟年景同一套排面 ── */
function viewHangqing() {
  return `<div class="pull">
    <p class="lead2">今 年 的 市</p>
    ${行情卡(S.行情)}
    <p class="grade-note" style="color:#7d8a6e;font-size:14.5px;margin:2px 0 0">
      稻子已经收上来了，市什么样，现在才知道。种是一回事，卖是另一回事。</p>
  </div>
  <div class="spacer"></div>
  <button class="go" onclick="toChainGo()">开 磅 秤</button>`;
}

function viewChain() {
  const step = S.chainIndex || 0, c = S.后段[step];
  if (!c) return viewYearEnd();
  const 取值 = v => typeof v === "function" ? v(S) : v;
  const buttons = c.options.map((o, i) => {
    /* 锁可以是 true（死锁），也可以是个谓词 —— 谓词当场读 live 状态。
       有的条件（手头够不够）是在这一屏**之前**才定下来的。 */
    const 锁 = o.锁 === true || (typeof o.锁 === "function" && o.锁(S));
    return `<button class="btn${锁 ? " lockbtn" : ""}" ${锁 ? "disabled" : `onclick="onChain(${i})"`}>
      ${esc(o.text)}<span class="cost">${esc(取值(o.sub))}</span></button>`;
  }).join("");
  return `${hud()}
    <div class="step">${esc(c.term)} · 收完之后 第 ${step + 1} / ${S.后段.length} 步</div>
    <h2 class="term cmp">${esc(c.term)}<small>收 完 之 后</small></h2>
    <h3 class="title cmp">${esc(c.title)}</h3>
    <p class="brief cmp">${esc(c.brief)}</p>
    ${c.say ? `<div class="say"><span class="who">${esc(c.who)}</span><p style="white-space:pre-line">${esc(取值(c.say))}</p></div>` : ""}
    <div class="spacer"></div>${buttons}<div class="spacer"></div>`;
}

/* ── 年终账本 ── */
/* ── 年终 ──
   全季的收口。八个节气的因，到这里合成一个数。
   一个数是不够的 —— 得让人看清楚这个数是怎么来的（收入构成），
   得有人对着一季说一句话（季评），也得把这一季攒下的牌子摆出来（成就）。
   排场是给"你真种了一季"这件事的，不是给分数的 —— 所以每一档都有话说。 */
const 季评 = [
  { 名:"下下", min:-1e9, 气:"d",
    说:"往里贴了钱。镇属那家三十来号人的公司，年年也都在往里贴 —— 京西稻就是这么留下来的，你这一亩今年也算了一份。" },
  { 名:"下",   min:3000, 气:"d",
    说:"贴进去一些，不多。一亩稻头一年种，这本账本来就难平 —— 不是你的问题，是这行当的问题。" },
  { 名:"中",   min:12000, 气:"c",
    说:"收支打平，还余了一点。一亩地头一年能不往里掏钱，这就算站住了。" },
  { 名:"上",   min:17500, 气:"b",
    说:"账是正的，还宽裕。这一亩地今年自己养活了自己，还余出钱来 —— 在海淀，这件事已经不常听见了。" },
  { 名:"上上", min:22000, 气:"a",
    说:"一亩地挣出了镇上一个人小半年的工钱。京西稻到今天还能留在地里，靠的就是这个数。" },
];
const 评等级 = v => { let g = 季评[0]; 季评.forEach(x => { if (v >= x.min) g = x; }); return g; };

/* ── 今年最赚的一手、最坑的一手 ──
   "哪一步出了问题"这种话，游戏自己算得出来 —— 日志里每一步的因果都在，
   那就直接点名，别让玩家去悟。这一块也是全季唯一一次把因果链摊开讲。 */
function 关键两手(S) {
  const 分 = e => Object.keys(e.delta)
    .reduce((a, k) => a + (k === "harvest" ? e.delta[k] * 0.12 : e.delta[k] * 1.6), 0);
  const 有 = S.log.filter(e => e.from && e.from.length);
  if (有.length < 2) return null;
  const 排 = 有.slice().sort((a, b) => 分(a) - 分(b));
  const 坑 = 排[0], 赚 = 排[排.length - 1];
  const 因 = e => e.from.filter(x => x !== "＋").join("　→　");
  return { 坑: 分(坑) < -1.2 ? { 因: 因(坑), e: 坑 } : null,
           赚: 分(赚) > 1.2 ? { 因: 因(赚), e: 赚 } : null };
}

function viewYearEnd() {
  const r = result, 评 = 评等级(r.净收益), 两手 = 关键两手(S);

  /* 收入构成 —— 一二三产不是三个词，是一条能看出来的比例。
     这条横条是整个结算里最该被看见的东西：钱是从哪条路上来的。 */
  const 源 = [
    { 名:"一产 · 卖原粮", v:r.一产, 色:"var(--green)" },
    { 名:"二产 · 礼盒",   v:r.二产, 色:"var(--gold)" },
    { 名:"三产 · " + r.三产说明.split("，")[0], v:r.三产, 色:"var(--clay)" },
    { 名:"政策 · 粮补",   v:r.补贴, 色:"#a8a294" },
  ].filter(x => x.v > 0);
  const 总 = 源.reduce((a, x) => a + x.v, 0) || 1;
  const 条 = 源.map(x => `<span style="width:${(x.v/总*100).toFixed(1)}%;background:${x.色}"></span>`).join("");
  const 图例 = 源.map(x => `<div class="mix-li">
      <span class="dot" style="background:${x.色}"></span>
      <span class="nm">${esc(x.名)}</span>
      <span class="pc">${(x.v/总*100).toFixed(0)}%</span>
      <span class="amt">${yuan(x.v)}</span></div>`).join("");

  const li = (k, v) => `<div class="li"><span class="k">${k}</span><span class="v">${v}</span></div>`;

  /* 成就 —— 按档位从高到低排，金牌先上场 */
  const 序 = { 金:0, 银:1, 铜:2 };
  const 牌 = newAch.slice().sort((a,b) => 序[a.级] - 序[b.级]);
  const ach = 牌.length ? `<h3 class="title" style="font-size:17px">这一季，你得了 ${牌.length} 块牌子</h3>
    ${牌.map((a,i) => `<div class="ach ${a.级}" style="animation-delay:${i*.07}s">
      <span class="d">${a.级}</span><div><b>${esc(a.名)}</b><span>${esc(a.说)}</span></div></div>`).join("")}`
    : `<h3 class="title" style="font-size:17px">这一季，没有牌子</h3>
       <p class="grade-note" style="margin-top:0">走了一条没人走过的路 —— 下一季换个走法试试。</p>`;

  return `<div style="margin:0 0 16px">${节气条()}</div>
    <div class="step">年终 · 账本</div>
    <h2 class="term" style="font-size:30px">一季的账<small>一 亩 地</small></h2>

    <div class="yearend-wrap ${评.气}">
      <div class="yr-name ${评.气}">${评.名}</div>
      <div class="yr-tag">这 一 季 的 收 成</div>
      <p class="praise">${esc(评.说)}</p>
    </div>

    <div class="netbig ${r.净收益 >= 0 ? "u" : "d"}">
      <span class="k">净 收 益</span>
      <b data-count="${r.净收益}">0</b><i>元</i>
      <span class="sub">毛收入 ${yuan(r.毛收入)} 元　－　本季投入 ${yuan(r.成本)} 元</span>
    </div>

    <h3 class="title" style="font-size:17px">钱是从哪条路上来的</h3>
    <div class="mixbar" data-wipe>${条}</div>
    <div class="mix">${图例}</div>

    ${两手 ? `<h3 class="title" style="font-size:17px">这一季的两个转折</h3>
      <div class="keymoves">
        ${两手.赚 ? `<div class="km u"><span class="tag">最赚的一手</span>
          <b>${esc(两手.赚.因)}</b><p>${esc(两手.赚.e.line)}</p></div>` : ""}
        ${两手.坑 ? `<div class="km d"><span class="tag">最亏的一手</span>
          <b>${esc(两手.坑.因)}</b><p>${esc(两手.坑.e.line)}</p></div>` : ""}
      </div>` : ""}

    <h3 class="title" style="font-size:17px">底账</h3>
    <div class="ledger">
      ${li("打下来的稻谷", yuan(S.grain) + " 斤")}
      ${li("验米等级", r.grade.名 + "（" + yuan(r.米价) + " 元/斤）")}
      ${li("今年的行情", r.行情.名 + (r.行情.原粮 !== 1
          ? "（原粮 " + (r.行情.原粮 > 1 ? "+" : "") + Math.round((r.行情.原粮 - 1) * 100) + "%）" : ""))}
      ${li("牌子 · 生态 " + S.stats.ecology + " 撑起来的量", Math.round(r.牌 * 100) + "%")}
      ${li("折成米", yuan(r.米) + " 斤" + (r.兑米 ? "（认养兑走 " + r.兑米 + " 斤）" : ""))}
      ${li("一产 · 卖原粮 " + yuan(r.已卖谷 + r.原粮量) + " 斤 @ " + r.谷价 + " 元"
          + (r.已卖谷 && r.原粮量 ? "（立冬卖掉 " + yuan(r.已卖谷) + " 斤）" : ""), yuan(r.一产) + " 元")}
      ${li("二产 · 礼盒 " + yuan(r.礼盒量) + " 斤"
          + (r.礼盒量 < r.礼盒上限 ? "（装得起这么多，上限本来有 " + yuan(r.礼盒上限) + " 斤）" : ""),
          yuan(Math.round(r.礼盒量 * r.米价 * NUM.礼盒溢价)) + " 元")}
      ${li("二产 · 深加工 " + yuan(r.加工量) + " 斤", yuan(Math.round(r.加工量 * NUM.深加工价)) + " 元")}
      ${r.原粮量 ? li("没装盒也没加工的米", yuan(r.原粮量) + " 斤 —— 走了原粮") : ""}
      ${r.包装费 ? li("礼盒包装", "-" + yuan(r.包装费) + " 元") : ""}
      ${r.加工费 ? li("深加工费", "-" + yuan(r.加工费) + " 元") : ""}
      ${li("收完粮之后，手里还剩", yuan(r.兜里剩) + " 元" + (r.兜里剩 < NUM.礼盒包装 * 20 ? "（不够再铺一摊了）" : ""))}
      ${li("三产 · " + r.三产说明, yuan(r.三产) + " 元")}
      ${r.额外 ? li("大寒 · " + S.大寒说明, (r.额外 > 0 ? "+" : "") + yuan(r.额外) + " 元") : ""}
    </div>
    ${ach}
    ${回学校(S, r)}
    ${继承卡(S, r)}
    <div class="spacer"></div>
    <button class="go ghost" onclick="restart()">再 种 一 季</button>
    <p class="foot">换个走法，账就不是这个数</p>`;
}

/* ── 上一季留给这一季的 ──
   一局一局之间总得留下点什么 —— 这一块就是那个"什么"。
   认过的病下一季还认得（诊断时白送一条线索），图鉴和成就都攒着。
   没有这块，第二局跟第一局一模一样，玩家凭什么再种一季。 */
function 继承卡(S, r) {
  const 认得 = Object.keys(S.本季认得 || {});
  const 共 = Object.keys(CODEX).filter(k => S.codex[k]).length;
  const 总 = Object.keys(CODEX).length;
  const 认 = 认得.length
    ? `<b>认得 ${认得.length} 样：${认得.map(k => esc(k)).join("　")}</b>`
    : `<b>这一季没认出新东西 —— 田里的毛病，这一季是绕着走的。</b>`;
  const 带 = 共
    ? `<p>下一季开局，认过的这些还带在身上 —— 再碰上，白送你一条线索。${
        共 < 总 ? `图鉴 ${共} / ${总}，还差 ${总 - 共} 样。` : "图鉴满了。"}</p>`
    : `<p>田里的毛病，得自己蹲下去看才认得出来。认出来一次，往后就忘不掉。</p>`;
  /* 钱和熟练也写在这儿 —— 玩家在这一屏做的是"要不要再来一季"的决定，
     得让他看见"再来一季我不是从零开始"。
     ⚠ 结余在 r 上（result 的 兜里剩），不在 state 上，所以这张卡得接 r。 */
  const 留 = `<p>手上剩的 ${yuan(r.兜里剩)} 元，两成跟着进下一季 ——
    下一季开局本钱 ${yuan(NUM.本钱 + Math.min(Math.round(r.兜里剩 * NUM.带钱比例 / 10) * 10, NUM.带钱上限))} 元起。
    身体的底子也没白练，下一季多 ${Math.min((S.季 || 1) * NUM.熟练每季, NUM.熟练上限)} 点体力。</p>`;
  return `<div class="kan"><span class="k">这 一 季 你 留 下 了 什 么</span>${认}${带}${留}</div>`;
}

/* ── 从上一季带过来的 ──
   开局第二屏（看完年景）摆一张卡，把"这一季我手里多了什么"说清楚。
   继承这件事最怕的是玩家根本不知道它发生了 —— 卡不摆出来，
   那 +4 点体力和那 647 块钱就等于不存在。
   第 1 季不摆：什么都没有，摆一张空卡是废话。 */
function 带过来(S) {
  if ((S.季 || 1) < 2) return "";
  const 行 = [];
  if (S.底金 > 0)
    行.push(`<b>上季结余 ${yuan(档().存 || 0)} 元，带过来 ${yuan(S.底金)} 元</b>
      <p>上季剩下的钱，两成跟着你进这一季 —— 已经算在开局本钱里了。
      这一季本钱 ${yuan(NUM.本钱 + S.底金)} 元。</p>`);
  if (S.熟练 > 0)
    行.push(`<b>第 ${S.季} 季了，手上的活儿比头一季熟 —— 开局多 ${S.熟练} 点体力</b>
      <p>哪个节气该干什么，不用现琢磨了。省下来的是想事的工夫。</p>`);
  const 认得 = Object.keys(S.codex).length;
  if (认得)
    行.push(`<b>认得 ${认得} 样，还带在身上</b>
      <p>再碰上，白送你一条线索 —— 只送一条，剩下的还得自己蹲下去看。</p>`);
  if (!行.length) return "";
  return `<div class="kan"><span class="k">从 上 一 季 带 过 来 的</span>${行.join("")}</div>`;
}

/* ── 回学校 ──
   你是农大派来实习的学生，一季种完得有个交代。
   带队老师看的是表，老周看的是别的 —— 这一局收在这里。 */
function 回学校(S, r) {
  const 级 = r.grade.名;
  /* 老师这一条按"你留下了什么"分岔，不按分数高低训人 ——
     第一季就下地八个节气，本来就没什么可训的。 */
  const 王 = 级 === "特级"
    ? { t: "「这块地能这么种。」带队老师把表推回来，\n「你把过程写下来，下次组会讲一次。」" }
    : 级 === "一级"
    ? { t: "「一级，可以了。」带队老师说，\n「我以为你们下去就是拍拍照 —— 看来不是。」" }
    : r.净收益 >= 15000
    ? { t: "「账算得不错。」带队老师翻了两页，\n「可我更想知道，你那一亩地明年还能不能这么种。」" }
    : r.三产 > 0
    ? { t: "「你把米卖出去这一手，比米本身有意思。」带队老师说，\n「镇上的公司愁的就是这个。你接着说。」" }
    : { t: "「第一季，正常。」带队老师把表合上，\n「明年下去，把每天干了什么都记上 —— 这个比最后那个数有用。」" };

  const 留 = S.stats.ecology >= 65 || r.三产 > 0;
  const 周 = 留
    ? { t: "老周蹲在田埂上，把最后一捆稻把子码齐。\n「这一亩地，明年还归你。」他说，\n「你要是还来。」" }
    : { t: "老周把锹往肩上一扛，走了两步，回头说：\n「头一年能收回一仓，不赖了。\n我头一年种的，还没你这个数。」" };

  return `<h3 class="title" style="font-size:17px">收完了，回学校</h3>
    <div class="say"><span class="who">带队老师 · 组会前</span><p style="white-space:pre-line">${esc(王.t)}</p></div>
    <div class="say"><span class="who">老周 · 田埂上</span><p style="white-space:pre-line">${esc(周.t)}</p></div>`;
}

/* ── 图鉴 / 成就 ── */
const 分类 = ["田里的", "手上的", "肥", "水", "虫", "收", "药", "灾"];
function viewBook() {
  const keys = Object.keys(CODEX);
  const got = keys.filter(k => S.codex[k]).length;
  const groups = 分类.filter(c => keys.some(k => CODEX[k][0] === c));
  let body;
  if (tab === "成就") {
    /* 按档位分组，每组标出 x/y —— 差一块金牌没拿到，比"成就 7/24"勾人 */
    body = ["金","银","铜"].map(级 => {
      const 组 = ACH.filter(a => (a.级 || "铜") === 级);
      if (!组.length) return "";
      const 得 = 组.filter(a => S.ach[a.id]).length;
      return `<h3 class="title" style="font-size:15px;letter-spacing:.14em;margin:20px 0 6px">
          <span class="lvdot ${级}"></span>${级}牌 · ${得}/${组.length}</h3>`
        + 组.map(a => {
          const has = S.ach[a.id];
          return `<div class="cx ${has?"":"lock"}"><div class="h">
            <b>${has ? esc(a.名) : "？ ？ ？"}</b></div>
            <p>${has ? esc(a.说) : "还没拿到"}</p></div>`;
        }).join("");
    }).join("");
  } else if (tab === "全部") {
    body = keys.map(k => {
      const has = S.codex[k], [cat, txt] = CODEX[k];
      return has
        ? `<div class="cx"><div class="h"><b>${k}</b><span class="cat">${cat}</span></div><p>${txt}</p></div>`
        : `<div class="cx lock"><div class="h"><b>？ ？ ？</b><span class="cat">${cat}</span></div><p>还没见过</p></div>`;
    }).join("");
  } else {
    body = 分类.filter(c => c !== "肥" || tab === "肥").map(c => {
      const inC = keys.filter(k => CODEX[k][0] === c);
      if (!inC.length) return "";
      return `<h3 class="title" style="font-size:15px;color:var(--dim);letter-spacing:.14em;margin:20px 0 4px">${c}</h3>`
        + inC.map(k => {
          const has = S.codex[k];
          return `<div class="cx ${has?"":"lock"}"><div class="h"><b>${has ? k : "？ ？ ？"}</b></div><p>${has ? CODEX[k][1] : "还没见过"}</p></div>`;
        }).join("");
    }).join("");
  }
  const 成就数 = ACH.filter(a => S.ach[a.id]).length;
  return `<div class="step">这一季记住的东西</div>
    <div class="tabs">
      <button class="${tab==="田"?"on":""}" onclick="setTab('田')">田里的</button>
      <button class="${tab==="手上的"?"on":""}" onclick="setTab('手上的')">手上的</button>
      <button class="${tab==="全部"?"on":""}" onclick="setTab('全部')">全部 ${got}/${keys.length}</button>
      <button class="${tab==="成就"?"on":""}" onclick="setTab('成就')">成就 ${成就数}/${ACH.length}</button>
    </div>${body}<div class="spacer"></div>
    <button class="go sm ghost" onclick="backToGame()">${书来源 === "封面" ? "回 到 封 面" : "回 到 田 里"}</button>`;
}

function render() {
  app.innerHTML =
    screen === "cover"    ? viewCover()    :
    screen === "pull"     ? viewPull()     :
    screen === "event"    ? viewEvent()    :
    screen === "decision" ? viewDecision() :
    screen === "result"   ? viewResult()   :
    screen === "note"     ? viewNote()     :
    screen === "miban"    ? viewMiban()    :
    screen === "hangqing"? viewHangqing()  :
    screen === "chain"    ? viewChain()    :
    screen === "book"     ? viewBook()     :
                            viewYearEnd();
  const p = screen === "cover" || screen === "pull" ? 0
    : screen === "hangqing" ? 8/13
    : screen === "chain" ? (8 + (S.chainIndex||0)) / (8 + (S.后段.length||5))
    : screen === "miban" ? 8/12
    : Math.min(S.termIndex, 8) / 12;
  document.getElementById("bar").style.transform = `scaleX(${p})`;
  起动画();
  window.scrollTo(0, 0);
}

/* ── 流程 ── */
function nextTerm() {
  pendingEvents = dueEvents(S, S.termIndex);
  事件位 = 0;
  flash = {};
  pendingEvents.forEach(e => { for (const k in e.delta) if (e.delta[k]) flash[k] = e.delta[k]; });
  screen = pendingEvents.length ? "event" : "decision";
  render();
  扫成就(null);   // 回响落地，顺手看看这一下有没有撞出个什么
}

window.startGame = function () {
  S.termIndex = 0; screen = "pull"; render();
  /* 抽卡的动静按档位给 —— 上上/下下的琶音，其余只翻个页 */
  const y = S.年景, 级 = y.级 || "R";
  响(级 === "SSR" ? (y.色 === "d" ? "凶" : "金") : "抽");
};
window.toField   = function () { nextTerm(); };
window.toDecision = function () { screen = "decision"; render(); };

/* ── 事件一条一条过 ── */
window.nextEvent = function () {
  事件位++;
  if (事件位 >= pendingEvents.length) { 事件位 = 0; toDecision(); return; }
  render();
};

/* 蹲下去看 / 问老周 —— 每一下换回来一条线索。
   线索是攒着的，不是一问就有答案：攒够 z.成 点，才认得出那是什么。
   攒不够也没关系，"先记着，回头再说"就是那条收手的路 ——
   有时候它是对的（体力见底的时候），有时候你就是白丢了一季的眼力。 */
window.onDiag = function (i) {
  const e = pendingEvents[事件位];
  if (!e || !e.诊 || e.诊.点过[i] || e.诊.完) return;
  const s = e.诊.步[i];
  if (!s) return;
  e.诊.点过[i] = true;
  const 分 = s.值 === undefined ? 1 : s.值;
  /* 这一条的分量够不够单独立案。够的话它就是"定案的那一处" ——
     名字马上出来，所以这一条既是过程也是结论，得让玩家看见是它定的案。 */
  e.诊.得.push({ wh: s.wh || s.text, 得: s.得, 定: 分 >= e.诊.成 });
  if (s.收) e.诊.完 = true;                       // 自己说不看了，就不看了
  else e.诊.值 += 分;
  if (s.费) S.stamina = Math.max(0, S.stamina - s.费);
  响(s.收 ? "坏" : "tap");
  render();
};

/* 治 —— 认出来了才有这一步。dueEvents 已经按最坏的那笔账扣过了，
   处置给的是**补回来的差价**（o.补），所以同一件事，
   看出来了和没看出来，最后落在数上的不是同一个数。 */
window.onTreat = function (i) {
  const e = pendingEvents[事件位];
  if (!e || !e.诊 || e.诊.治) return;
  const o = (e.诊.处置 || [])[i];
  if (!o) return;
  if (o.费) S.stamina = Math.max(0, S.stamina - o.费);
  if (o.钱) { S.cost += o.钱; S.现金 = Math.max(0, S.现金 - o.钱); }
  /* 岔路插的旗 —— 人事这一手当场不结账，账挂在旗上，
     到后面那个阶段（EVENTS 里 when: s => s.flags[...]）才显形。
     这是这个游戏的老规矩：A 做的事，C 才看见。 */
  if (o.旗) S.flags[o.旗] = true;
  const 前 = { ...S.stats };
  const delta = applyEffect(S, o.补 || {});
  e.诊.治 = { ...o, delta, 前, 后: { ...S.stats } };
  flash = {};
  for (const k in delta) if (delta[k]) flash[k] = delta[k];
  /* 岔路（人事）不表态：三条路本来就没有对错，好/坏是**有倾向**的两个音，
     当场响等于替玩家判了一下，而账要到后面那个阶段才结。
     给一声 tap —— 手碰到了东西的动静，不说是好是坏。 */
  响(e.诊.岔 ? "tap" : (o.好 ? "好" : "坏"));
  render();
};

/* 点了田里那处地方。
   ⚠ 这儿必须**先给一下手感再换屏**：直接 onChoose 的话，手指抬起来屏幕就变了，
     人根本没看清自己点的是哪儿。所以先把那个点按住（.on），响一声，
     等 280ms 再走 —— 这一下延迟就是"手碰到了东西"的感觉。 */
window.onHot = function (i) {
  if (S.选了 !== null) return;        // 手指抖两下点了同一个点，只算一次
  S.选了 = i;
  响("tap");
  const 全部 = app.querySelectorAll ? app.querySelectorAll(".hot") : [];
  if (全部[i] && 全部[i].classList) 全部[i].classList.add("on");
  /* 有家什的那一处，记号是 svg 里的家什本人，不在按钮里 —— 得单独点亮它。
     不然点下去只有气泡变色，那件东西一动不动，手感是断的。
     ⚠ 不能按 "第几个 .shi" 去找：不是每处都有家什（立夏那屏第 0 处指的是田，
       没有东西可点），一有缺口，序号就跟热区下标错开了。按带下标的名字找。 */
  const 件 = app.querySelectorAll ? app.querySelectorAll(".shi.s" + i)[0] : null;
  if (件 && 件.classList) 件.classList.add("on");
  /* 没 DOM（测试脚本）就直接走，别卡在这儿 */
  if (!app.querySelectorAll || !setTimeout) { S.选了 = null; onChoose(i); return; }
  setTimeout(() => { S.选了 = null; onChoose(i); }, 280);
};

window.onSound = function () {
  开声 = !开声;
  if (开声) 响("tap");
  render();
};

window.onChoose = function (i) {
  /* 先用一下按下的手感，再翻屏 —— 不然"我选了"这个动作没有落点 */
  const btn = document.querySelectorAll ? document.querySelectorAll(".btn")[i] : null;
  if (btn) btn.classList.add("pick");
  响("tap");
  setTimeout(() => {
    lastResult = choose(S, S.termIndex, i);
    flash = {};
    for (const k in lastResult.delta) if (lastResult.delta[k]) flash[k] = lastResult.delta[k];
    if (lastResult.新图鉴) toast(`记下了 · ${lastResult.新图鉴}`);
    screen = "result"; render();
    响(Object.keys(lastResult.delta).some(k => lastResult.delta[k] < 0) ? "坏" : "好");
    扫成就(null);
  }, 160);
};

/* ── 夜里二选一 ──
   这是这一版新长出来的一道岔口：翻书和睡觉抢的是同一个晚上。
   睡觉回 12 点，翻书回 4 点 —— 差的这 8 点力气，就是"学"的价钱。
   翻书还有个附加条件：精神得剩得住（体力 ≥ 灵感体力线），
   不然只剩字、出不来念头。条件明码写在按钮上，玩家不用猜。 */
window.onNight = function (选) {
  const 读 = 选 === "读";
  /* ⚠ 门槛看的是**睡前**的体力 —— 也就是他刚才在屏幕上看见的那个数。
     拿加完恢复之后的数去比，玩家就会算不明白"为什么这次又没出"。 */
  const 睡前 = S.stamina;
  S.stamina += 读 ? NUM.翻书恢复 : NUM.睡觉恢复;
  S.夜里 = 读 ? "读" : "睡";
  if (!读) {
    响("tap");
    toast(`睡了 · 体力 +${NUM.睡觉恢复}`);
    onContinue();
    return;
  }
  /* 白天那一手到底对不对，翻到书上才知道 */
  S.待查 = lastResult ? lastResult.查 : null;
  const 可灵 = !!(S.待查 && S.待查.灵) && !S.灵感[S.待查.灵] && 睡前 >= NUM.灵感体力线;
  S.新灵感 = 可灵 ? S.待查.灵 : null;
  if (可灵) S.灵感[可灵] = true;
  S.查过[S.节气[S.termIndex].term] = true;
  响(可灵 ? "好" : "tap");
  screen = "note"; render();
};

window.onContinue = function () {
  S.待查 = null; S.新灵感 = null;
  S.termIndex++; flash = {};
  if (S.termIndex >= S.节气.length) {
    dueEvents(S, S.节气.length);   // 收尾那一趟：粮进场了才回过味来的账
    flash = {};
    S.log.forEach(e => { for (const k in e.delta) if (e.delta[k]) flash[k] = e.delta[k]; });
    S.grain = S.stats.harvest;
    miban = 验米(S);
    screen = "miban"; render();
    响(miban.grade.名 === "特级" ? "金" : miban.grade.名 === "等外" ? "坏" : "好");
    扫成就(null);
  } else nextTerm();
};

window.toChain = function () {
  /* 稻子进仓了，市才揭晓 —— 后半段的抽卡 */
  if (!S.行情) S.行情 = 抽行情();
  S.后段 = 建后段(S);
  S.chainIndex = 0; screen = "hangqing"; render();
  响(S.行情.级 === "SSR" ? (S.行情.色 === "d" ? "凶" : "金") : "抽");
};
window.toChainGo = function () { screen = "chain"; render(); };

window.onChain = function (i) {
  const c = S.后段[S.chainIndex];
  /* 连点、越界、锁住的，直接吞掉。锁跟渲染走同一个判据 ——
     两处各写一遍迟一拍就会错开：屏幕上按钮是灰的、点下去却成了，
     比死锁更让人懵。 */
  if (!c || !c.options[i]) return;
  const lk = c.options[i].锁;
  if (lk === true || (typeof lk === "function" && lk(S))) return;
  c.options[i].pick(S);
  S.chainIndex++;
  if (S.chainIndex >= S.后段.length) {
    /* 这里不再弹牌 —— 年终这一屏本身就是发奖的地方，
       弹一遍再列一遍，是打自己的脸 */
    result = 年终(S); 结成就(S, result); newAch = S.本季成就; screen = "yearend";
  }
  响(S.chainIndex >= S.后段.length ? "钱" : "tap");
  render();
};

window.setTab = function (t) { tab = t; render(); };
/* 书从哪儿翻开的，就回哪儿去。原来是写死的"回田里" ——
   从封面点进来的，回田里就成了"田还没下呢先给你看田"，说不通。 */
window.backToGame = function () {
  screen = 书来源 === "封面" ? "cover"
    : S.termIndex >= S.节气.length ? "yearend" : "decision";
  书来源 = "田";
  render();
};
let 书来源 = "田";
window.openBook = function (从) {
  书来源 = 从 || "田";
  /* 从封面进来先看成就 —— 那是"攒下来的"，是这一屏要回答的问题。
     图鉴得先认得东西才有得看，顺序反过来。 */
  if (从 === "封面") tab = "成就";
  screen = "book"; render();
};
window.restart = function () {
  /* 季数在这儿加，不在 reset 里 —— 一局当中刷新页面不该涨季数。
     它落在档里，因为它是"这个玩家"的属性，不是这一局的属性。 */
  存档({ 季: (档().季 || 1) + 1 });
  reset(); 成就队 = []; 弹牌(); render();
};

render();
</script>
</body>
