/* ============================================================================
   ◆ ENGINE —— 第二层：核心逻辑引擎
   ----------------------------------------------------------------------------
   这一层不碰 document / window / localStorage，纯状态 + 纯函数。
   想单独验它：抠出来在 node 里跑（C:\tmp\ymd7\验引擎.mjs 就是这么干的）。
   搬 Cocos：原样复制，前面加 export。

   ── GameState 的形状（照 spec） ──────────────────────────────
   {
     time:   { solarTermIndex, day, minutes, weather },
     player: { stamina, stress, money, location,
               equipment: { head, feet, tool, accessory }, relics: [] },
     field:  { trueYield, trueQuality, yieldErrorMargin, qualityErrorMargin,
               modifiers: [] },
     npcs:   { [npcId]: { opinion, opinionLogs: [], hooks } },
     flags:  {}
   }

   ── ActionOption 的形状（照 spec） ───────────────────────────
   {
     id, label, costTimeMinutes, costStamina, costMoney, costHookNpc,
     check: { baseChance, modifiers: [{ source, bonus }],
              onSuccessText, onFailText }
   }
   另外几条是我加的，用来把数值落到实处：
     detail / hinge / pitch / requires / blockedHint /
     onSuccess / onFail（结构化效果，跟 onSuccessText 配套）
     sleepToHour / grants / equipAfterGrant / opensPresale / staminaTag
   ============================================================================ */

/**
 * 定种子的随机数发生器（线性同余）。
 * 同一个种子必然给出同一串数 —— 也就是说同一局能一字不差地重演。
 * 测试全靠它；正式玩不传，用 Math.random。
 *
 * 头一下先把种子搅乱：不搅的话 1、2、3 这样挨着的种子，
 * 第一发都落在 23 上下（常数项把种子的那点差别盖住了），等于没分种子。
 */
function makeRng(seed) {
  let s = (Math.imul(seed >>> 0, 2654435761) ^ 0x9e3779b9) >>> 0;
  return function () {
    // 用 Math.imul 走 32 位乘法，别让 s * 1664525 掉进双精度的舍入里
    s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

const SLOTS = ['head', 'feet', 'tool', 'accessory'];
const SLOT_NAMES = { head:'头', feet:'脚', tool:'工具', accessory:'随身' };

class GameEngine {
  /**
   * @param {object}   data   GameData
   * @param {function} [rng]  随机数发生器。传定种子的进来，同一局能复现。
   */
  constructor(data, rng) {
    this.data = data;
    this.rng = rng || Math.random;
    this.events = [];
    this.newGame();
  }

  /* ══════════════════════════════════════════════════════════════
     开局
     ══════════════════════════════════════════════════════════════ */

  newGame() {
    const s = this.data.startup;

    /** @type {object} GameState */
    this.state = {
      time: { solarTermIndex:s.solarTermIndex, day:s.day,
              minutes:s.minutes, weather:s.weather },
      player: {
        stamina:s.stamina, stress:s.stress, money:s.money, location:s.location,
        equipment: { head:null, feet:{ ...this.data.starterGear, states:[],
                                      effect:{ ...this.data.starterGear.effect } },
                     tool:null, accessory:null },
        relics: []
      },
      field: {
        trueYield:s.trueYield, trueQuality:s.trueQuality,
        yieldErrorMargin:s.yieldErrorMargin, qualityErrorMargin:s.qualityErrorMargin,
        modifiers: []
      },
      npcs: {},
      flags: {}
    };
    for (const n of this.data.npcs) {
      this.state.npcs[n.id] = { opinion:0, opinionLogs:[], hooks:0 };
    }
    for (const o of this.data.openingOpinion) {
      this.changeOpinion(o.npcId, o.delta, o.reason);
    }
    this.events = [];
  }

  /* ══════════════════════════════════════════════════════════════
     时间
     ══════════════════════════════════════════════════════════════ */

  get currentTerm() { return this.data.solarTerms[this.state.time.solarTermIndex]; }

  /** 推进时间。跨日就结算，跨节气就报一声。 */
  advanceTime(minutes) {
    if (!minutes) return;
    this.state.time.minutes += minutes;
    let guard = 0;
    while (this.state.time.minutes >= 24 * 60) {
      this.state.time.minutes -= 24 * 60;
      this.state.time.day++;
      if (this.state.time.day > this.currentTerm.days) {
        this.state.time.day = 1;
        this.state.time.solarTermIndex =
          (this.state.time.solarTermIndex + 1) % this.data.solarTerms.length;
        this.pushEvent('sys', `交节了。${this.currentTerm.id}。`);
      }
      this.onNewDay();
      // 保险丝。正常调用最多跨一两天，4000 是给「一口气推到秋后」那种测试留的余量
      if (++guard > 4000) break;
    }
  }

  onNewDay() {
    this.changeStamina(25);
    this.changeStress(-15);
    const pool = this.data.weatherPool;
    this.state.time.weather = pool[Math.floor(this.rng() * pool.length)];
  }

  clockText() {
    const m = this.state.time.minutes;
    const hh = String(Math.floor(m / 60)).padStart(2, '0');
    const mm = String(m % 60).padStart(2, '0');
    const seg = m < 7*60 ? '天没亮' : m < 11*60 ? '清晨' : m < 13*60 ? '晌午'
              : m < 17*60 ? '后晌'  : m < 19*60 ? '傍晚' : '天黑了';
    return `${this.currentTerm.id} · 第${this.state.time.day}天 ${hh}:${mm}（${seg}）`;
  }

  /* ══════════════════════════════════════════════════════════════
     地点与移动
     ══════════════════════════════════════════════════════════════ */

  location(id) { return this.data.locations.find(l => l.id === id); }

  /** 从 a 走到 b 要几分钟。穿戴在这儿起作用。 */
  walkMinutes(fromId, toId) {
    if (fromId === toId) return 0;
    const a = this.location(fromId), b = this.location(toId);
    if (!a || !b) return 0;
    const dist = Math.round(Math.hypot(b.x - a.x, b.y - a.y));
    let factor = 1;
    for (const item of this.getWorn()) {
      const v = item.effect?.travel;
      if (v) factor *= (1 - v);     // 正数是省时间，负数是费时间
    }
    return Math.max(1, Math.round(dist * factor));
  }

  /** 身上所有带效果的物件：四个槽 + 不带槽的家什。 */
  getWorn() {
    const out = [];
    for (const slot of SLOTS) {
      const item = this.state.player.equipment[slot];
      if (item && item.effect) out.push(item);
    }
    for (const id of this.state.player.relics) {
      const r = this.findRelic(id);
      if (r && r.effect && !r.slot) out.push(r);
    }
    return out;
  }

  /** @spec moveTo(locationId) */
  moveTo(locationId) {
    const from = this.state.player.location;
    if (locationId === from) return null;
    if (!this.location(locationId)) return { error:'没有这个地方' };

    const minutes = this.walkMinutes(from, locationId);
    this.state.player.location = locationId;
    this.advanceTime(minutes);

    const result = { minutes, from, to:locationId, travelEvent:null };
    if (this.rng() < 0.35) {
      const pool = this.data.travelEvents;
      result.travelEvent = pool[Math.floor(this.rng() * pool.length)];
      this.pushEvent('travel', result.travelEvent);
    }
    return result;
  }

  /* ══════════════════════════════════════════════════════════════
     体力 / 压力
     ══════════════════════════════════════════════════════════════ */

  changeStamina(delta) {
    this.state.player.stamina =
      Math.max(0, Math.min(100, this.state.player.stamina + delta));
  }

  /**
   * 干活耗体力。穿戴里的 stamina.all / .sun / .ditch / .transplant 在这儿扣。
   * @param {string} [tag] 活儿的路数：'sun' | 'ditch' | 'transplant'
   */
  spendStamina(base, tag) {
    let factor = 1;
    for (const item of this.getWorn()) {
      const st = item.effect?.stamina; if (!st) continue;
      if (st.all) factor *= (1 - st.all);
      if (tag && st[tag]) factor *= (1 - st[tag]);
    }
    const actual = Math.max(1, Math.round(base * factor));
    this.changeStamina(-actual);
    this.changeStress(actual * 0.35);
    return actual;
  }

  changeStress(delta) {
    const before = this.state.player.stress;
    this.state.player.stress = Math.max(0, Math.min(100, before + delta));
    if (before < 80 && this.state.player.stress >= 80) this.breakDown();
  }

  /** 压力顶到头，来一段失控。用旗子挡住，免得层层递归。 */
  breakDown() {
    if (this.state.flags._breaking) return;
    this.state.flags._breaking = true;
    const pool = this.data.stressBreaks;
    const e = pool[Math.floor(this.rng() * pool.length)];
    this.state.player.stress = Math.max(0, this.state.player.stress + e.stressDelta);
    this.advanceTime(e.costTimeMinutes);
    this.changeStamina(e.staminaDelta || 0);
    this.pushEvent('break', e.text);
    this.state.flags._breaking = false;
  }

  /* ══════════════════════════════════════════════════════════════
     钱
     ══════════════════════════════════════════════════════════════ */

  spendMoney(amount) {
    if (this.state.player.money < amount) return false;
    this.state.player.money -= amount;
    return true;
  }
  earnMoney(amount) { this.state.player.money += amount; }

  /* ══════════════════════════════════════════════════════════════
     好感 / 人情筹码
     ══════════════════════════════════════════════════════════════ */

  changeOpinion(npcId, delta, reason) {
    const n = this.state.npcs[npcId];
    if (!n || !delta) return;
    const before = n.opinion;
    n.opinion = Math.max(-100, Math.min(100, before + delta));
    const actual = n.opinion - before;
    if (actual) n.opinionLogs.unshift({ reason, delta:actual });
    if (before < 60 && n.opinion >= 60) {
      n.hooks++;
      this.pushEvent('good', `${this.npcName(npcId)} 记你一份人情。手里多了一个筹码。`);
    }
  }

  /** 好感阶梯：每 20 点一档，最多三档。 */
  opinionTier(perTier, npcId) {
    const op = this.state.npcs[npcId]?.opinion ?? 0;
    if (op <= 0) return 0;
    return Math.min(3, Math.floor(op / 20)) * perTier;
  }

  useHook(npcId) {
    const n = this.state.npcs[npcId];
    if (!n || n.hooks <= 0) return false;
    n.hooks--;
    return true;
  }

  npcName(id) { return this.data.npcs.find(n => n.id === id)?.name ?? id; }

  /* ══════════════════════════════════════════════════════════════
     藏品 / 穿戴
     ══════════════════════════════════════════════════════════════ */

  findRelic(id) { return id ? (this.data.relics.find(r => r.id === id) || null) : null; }

  /** 这东西还在身上吗？册子里算，哪个槽上穿着也算。 */
  hasItem(id) {
    if (!id) return false;
    if (this.state.player.relics.includes(id)) return true;
    return SLOTS.some(s => this.state.player.equipment[s]?.id === id);
  }

  /** 找一件东西：先当家什找，再当身上穿的找。 */
  findItem(id) {
    if (!id) return null;
    const r = this.findRelic(id);
    if (r) return r;
    for (const slot of SLOTS) {
      if (this.state.player.equipment[slot]?.id === id) {
        return this.state.player.equipment[slot];
      }
    }
    return null;
  }

  acquire(id) {
    const relic = this.findRelic(id);
    if (!relic) return false;
    if (this.state.player.relics.includes(id)) return false;
    this.state.player.relics.push(id);
    this.pushEvent('good', `得了件东西：${relic.name}。`);
    return true;
  }

  equip(id) {
    const relic = this.findRelic(id);
    if (!relic || !relic.slot) return false;
    this.state.player.equipment[relic.slot] = {
      id:relic.id, name:relic.name, slot:relic.slot, durability:100, states:[],
      quote:relic.quote, effect:relic.effect
    };
    this.sweepModifiers();
    return true;
  }

  /**
   * 挂在某件东西上的词条，东西一下身就跟着撤。
   * 运动鞋那条「走泥路慢一半」是鞋的账 —— 换上胶鞋，这条就不该还挂在田况里。
   */
  sweepModifiers() {
    this.state.field.modifiers =
      this.state.field.modifiers.filter(m => !m.tiedTo || this.hasItem(m.tiedTo));
  }

  /* ══════════════════════════════════════════════════════════════
     检定（CK3 那一套）
     ══════════════════════════════════════════════════════════════ */

  /**
   * 把一次检定的加减项一条条摊开 —— 面板上逐行显示的就是它。
   * 没到手的加成也列出来（让人知道自己错过了什么），只是记 0 分。
   * @returns {{name, baseChance, entries:[{source,bonus,applied,active}], chance}}
   */
  resolveCheck(check) {
    const entries = [];
    for (const m of (check.modifiers || [])) {
      let applied = 0;
      if (m.requires?.opinionTier) {
        applied = this.opinionTier(m.bonus, m.requires.opinionTier);
      } else if (this.meetsRequirement(m.requires)) {
        applied = m.bonus;
      }
      entries.push({ source:m.source, bonus:m.bonus, applied, active:applied > 0 });
    }
    // 全局修正：一沓名片（找个懂行的问一句）
    let global = 0;
    for (const id of this.state.player.relics) {
      const g = this.findRelic(id)?.effect?.globalCheck;
      if (g) global += g;
    }
    if (global) {
      entries.push({ source:'一沓名片（打电话问了一句）',
                     bonus:global, applied:global, active:true, global:true });
    }
    const total = entries.reduce((a, b) => a + b.applied, 0);
    return { name:check.name, baseChance:check.baseChance, entries,
             chance:Math.max(5, Math.min(95, check.baseChance + total)) };
  }

  /** 掷一颗 d100，点数不超过成功率就算过。 */
  rollCheck(check) {
    const panel = this.resolveCheck(check);
    const d100 = Math.floor(this.rng() * 100) + 1;
    return { ...panel, d100, passed:d100 <= panel.chance };
  }

  /* ══════════════════════════════════════════════════════════════
     条件判断
     ══════════════════════════════════════════════════════════════ */

  /**
   * 条件写成对象，一眼看得懂：
   *   { relic:'08' }            有这个藏品
   *   { opinion:{ zhou:20 } }   好感够不够
   *   { opinionTier:'zhou' }    每 20 点一档（在 resolveCheck 里单独算）
   *   { slot:'tool' }           某个槽上有东西
   */
  meetsRequirement(req) {
    if (!req) return true;
    // 注意：opinionTier 由 resolveCheck 自己算（它要按档位给分），这儿不管。
    // 也别写成「看到 opinionTier 就 return true」—— 那样跟 relic 混在一起会漏判。
    if (req.flag) return !!this.state.flags[req.flag];
    if (req.slot) return !!this.state.player.equipment[req.slot];
    if (req.relic) return this.state.player.relics.includes(req.relic);
    if (req.opinion) {
      for (const id in req.opinion) {
        if ((this.state.npcs[id]?.opinion ?? 0) < req.opinion[id]) return false;
      }
    }
    return true;
  }

  /** 缺什么：按钮锁不锁，全看这个。返回一句给人看的白话，或 null。 */
  describeBlocker(option) {
    if (!option) return '没有这个动作';
    if (option.costHookNpc && (this.state.npcs[option.costHookNpc]?.hooks ?? 0) <= 0) {
      return '手里没有人情筹码';
    }
    if (option.requires?.slot && !this.state.player.equipment[option.requires.slot]) {
      return `身上没有能用的${SLOT_NAMES[option.requires.slot]}类家什`;
    }
    if (option.requires?.relic && !this.state.player.relics.includes(option.requires.relic)) {
      return '手边没有这件东西';
    }
    // 缺的是「先前那一步没做」：比如小满没清沟，小暑就灌不起深水
    if (option.requires?.flag && !this.state.flags[option.requires.flag]) {
      return option.blockedHint || '前头那一步没走，这条现在走不通';
    }
    if (option.requires?.opinion) {
      for (const id in option.requires.opinion) {
        if ((this.state.npcs[id]?.opinion ?? 0) < option.requires.opinion[id]) {
          return option.blockedHint || `${this.npcName(id)} 跟你还没到那份上`;
        }
      }
    }
    return null;
  }

  /* ══════════════════════════════════════════════════════════════
     效果落地
     ══════════════════════════════════════════════════════════════ */

  applyEffect(effect, sourceLabel) {
    if (!effect) return;
    if (effect.yieldDelta)   this.shiftField('yield', effect.yieldDelta);
    if (effect.qualityDelta) this.shiftField('quality', effect.qualityDelta);
    if (effect.moneyDelta)   this.earnMoney(effect.moneyDelta);
    if (effect.staminaDelta) this.changeStamina(effect.staminaDelta);
    if (effect.stressDelta)  this.changeStress(effect.stressDelta);
    if (effect.yieldMarginDelta) {
      this.state.field.yieldErrorMargin =
        Math.max(15, this.state.field.yieldErrorMargin + effect.yieldMarginDelta);
    }
    if (effect.qualityMarginDelta) {
      this.state.field.qualityErrorMargin =
        Math.max(2, this.state.field.qualityErrorMargin + effect.qualityMarginDelta);
    }
    if (effect.opinionDelta) {
      for (const id in effect.opinionDelta) {
        this.changeOpinion(id, effect.opinionDelta[id], sourceLabel);
      }
    }
    if (effect.flags) Object.assign(this.state.flags, effect.flags);
    if (effect.modifiers) {
      for (const m of effect.modifiers) {
        if (this.state.field.modifiers.some(x => x.name === m.name)) continue;
        this.state.field.modifiers.push(m);
      }
    }
    if (effect.text) this.pushEvent('norm', effect.text);
  }

  shiftField(which, delta) {
    const f = this.state.field;
    if (which === 'yield') f.trueYield = Math.max(300, f.trueYield + delta);
    else f.trueQuality = Math.max(30, Math.min(100, f.trueQuality + delta));
  }

  /* ══════════════════════════════════════════════════════════════
     动作
     ══════════════════════════════════════════════════════════════ */

  /** 当前地点能做的动作：地点自己的 + 在场同窗的。 */
  actionsHere(locationId) {
    const here = locationId ?? this.state.player.location;
    const list = (this.data.actions[here] || []).slice();
    const scene = this.data.classmateScenes[here];
    if (scene) list.push(...scene.actions);
    return list;
  }

  findAction(actionId) {
    return this.actionsHere().find(a => a.id === actionId) || null;
  }

  /**
   * @spec executeAction(actionId)
   * @returns {{error?, opensDecision?, opensPresale?, check?, effect?, action?, text?}}
   */
  executeAction(actionId) {
    const a = this.findAction(actionId);
    if (!a) return { error:'没有这个动作' };

    const blocked = this.describeBlocker(a);
    if (blocked) return { error:blocked };
    if (a.opensDecision) return { opensDecision:true };
    if (a.opensPresale)  return { opensPresale:true };
    if (a.costMoney && this.state.player.money < a.costMoney) {
      return { error:`钱不够，还差 ${a.costMoney - this.state.player.money} 元` };
    }
    if (a.costHookNpc && !this.useHook(a.costHookNpc)) {
      return { error:'手里没有人情筹码' };
    }
    return this.commit(a);
  }

  /** 花钱、走时间、扣体力，然后把结果记上。动作和决策选项走的是同一条路。 */
  commit(a) {
    if (a.costMoney) this.spendMoney(a.costMoney);

    // 睡到天亮：推到明天的那个钟点，已经过了就多绕一天
    if (a.sleepToHour !== undefined) {
      const target = a.sleepToHour * 60;
      let delta = target - this.state.time.minutes;
      if (delta <= 0) delta += 24 * 60;
      this.advanceTime(delta);
    }
    if (a.costTimeMinutes) this.advanceTime(a.costTimeMinutes);

    if (a.costStamina > 0) this.spendStamina(a.costStamina, a.staminaTag);
    else if (a.costStamina < 0) this.changeStamina(-a.costStamina);
    if (a.stressDelta) this.changeStress(a.stressDelta);
    if (a.yieldMarginDelta) {
      this.state.field.yieldErrorMargin =
        Math.max(15, this.state.field.yieldErrorMargin + a.yieldMarginDelta);
    }
    if (a.qualityMarginDelta) {
      this.state.field.qualityErrorMargin =
        Math.max(2, this.state.field.qualityErrorMargin + a.qualityMarginDelta);
    }

    // 这一步干出来的结果，先落进状态、再落进叙事
    let check = null, effect, text;
    if (a.check) {
      check = this.rollCheck(a.check);
      effect = check.passed ? a.check.onSuccess : a.check.onFail;
      text   = check.passed ? a.check.onSuccessText : a.check.onFailText;
      this.applyEffect(effect, a.check.name);
    } else {
      effect = a.onSuccess;
      text   = a.onSuccessText;
      this.applyEffect(effect, a.label);
    }
    // 没有检定的动作也要把话记上 —— 不然点了按钮屏上什么都不动
    if (text) this.pushEvent('norm', text);

    // 话记完了，再看这一脚有没有踩进泥里：意外永远压在最上头
    this.maybeSpringMudTrap();

    if (a.grants) { this.acquire(a.grants); if (a.equipAfterGrant) this.equip(a.grants); }

    return { action:a, check, effect, text };
  }

  /**
   * 陷泥：穿着那双运动鞋，头一回真下水田干活，必出。
   * 异常挂在鞋本身上（角标才挂得上去「运动鞋:陷过泥」），
   * 同时也在田况词条里留一笔，两边都看得见。
   */
  maybeSpringMudTrap() {
    const p = this.state.player;
    if (p.location !== 'field') return;
    if (this.state.flags.mudTrapSprung) return;
    if (p.equipment.feet?.id !== this.data.starterGear.id) return;

    this.state.flags.mudTrapSprung = true;
    if (!p.equipment.feet.states.includes('陷过泥')) p.equipment.feet.states.push('陷过泥');
    const mod = this.data.mudTrap.modifier;
    if (!this.state.field.modifiers.some(m => m.name === mod.name)) {
      this.state.field.modifiers.push(mod);
    }
    this.pushEvent('bad', this.data.mudTrap.text);
    this.pushEvent('sys', this.data.mudTrap.hint);
  }

  /* ══════════════════════════════════════════════════════════════
     节气主决策
     ══════════════════════════════════════════════════════════════ */

  /**
   * 当前该定哪个决策。
   * 规则：按节气顺序找第一个没做的，只要它的节气已经到了就算 ——
   * 迟做可以，但不能不做（欠着的会堆在日程里）。
   */
  currentDecision() {
    // 挑**最早**该定而没定的那一件，不是数组里靠前的那一件。
    // 数组里三屏老决策排在八屏新的前头（谷雨、夏至、立秋、立夏…），
    // 要是照数组顺序取，一个把立夏小满芒种都拖着的玩家，到夏至会先被问夏至。
    let found = null, foundIndex = Infinity;
    for (const d of this.data.decisions) {
      if (this.state.flags['done_' + d.id]) continue;
      const i = this.data.solarTerms.findIndex(t => t.id === d.solarTerm);
      if (i >= 0 && i <= this.state.time.solarTermIndex && i < foundIndex) {
        found = d; foundIndex = i;
      }
    }
    return found;
  }

  overdueDecisions() {
    return this.data.decisions.filter(d => {
      const i = this.data.solarTerms.findIndex(t => t.id === d.solarTerm);
      return !this.state.flags['done_' + d.id] &&
             i >= 0 && i < this.state.time.solarTermIndex;
    });
  }

  chooseDecision(decisionId, optionId) {
    const d = this.data.decisions.find(x => x.id === decisionId);
    if (!d) return { error:'没有这个决策' };
    const o = d.options.find(x => x.id === optionId);
    if (!o) return { error:'没有这个选项' };

    const blocked = this.describeBlocker(o);
    if (blocked) return { error:blocked };
    if (o.costMoney && this.state.player.money < o.costMoney) return { error:'钱不够' };

    const result = this.commit(o);
    this.state.flags['done_' + d.id] = optionId;
    return { ...result, decision:d, option:o };
  }

  /* ══════════════════════════════════════════════════════════════
     新米预售
     ══════════════════════════════════════════════════════════════ */

  takePresale(optionId) {
    const o = this.data.presale.options.find(x => x.id === optionId);
    if (!o) return null;
    this.applyEffect(o.onSuccess, '新米预售');
    this.state.flags.presaleTaken = true;
    return o;
  }

  /* ══════════════════════════════════════════════════════════════
     事件队列（给视图层取）
     ══════════════════════════════════════════════════════════════ */

  pushEvent(kind, text) {
    this.events.push({ kind, text });
    // 只留最近这些条，叙事区就是拿它当滚动窗看的，没必要一直攒着
    if (this.events.length > 60) this.events.splice(0, this.events.length - 60);
  }
  drainEvents() { const e = this.events; this.events = []; return e; }
  /** 最近 n 条，早的在后。 */
  peekEvents(n) { return this.events.slice(-n); }

  /* ══════════════════════════════════════════════════════════════
     给视图层读的快照
     ══════════════════════════════════════════════════════════════ */

  /**
   * 手上的信息类家什，一直在替你把那两把尺子收紧 ——
   * 不用做什么，东西在你手里，你就量得比昨天准。
   * （一把水尺插在田口，往后每次看水都作数。）
   */
  relicMargin() {
    let yieldMargin = 0, qualityMargin = 0;
    for (const id of this.state.player.relics) {
      const e = this.findRelic(id)?.effect;
      if (e?.margin?.yield)   yieldMargin   += e.margin.yield;
      if (e?.margin?.quality) qualityMargin += e.margin.quality;
    }
    return { yield:yieldMargin, quality:qualityMargin };
  }

  /** 底：再准也准不到哪儿去，留一条线，别让区间收成一根刺。 */
  yieldErrorMargin() {
    return Math.max(15, this.state.field.yieldErrorMargin + this.relicMargin().yield);
  }
  qualityErrorMargin() {
    return Math.max(2, this.state.field.qualityErrorMargin + this.relicMargin().quality);
  }

  yieldRange() {
    const y = this.state.field.trueYield, e = this.yieldErrorMargin();
    return [y - e, y + e];
  }
  qualityRange() {
    const q = this.state.field.trueQuality, e = this.qualityErrorMargin();
    return [Math.max(0, Math.round(q - e)), Math.min(100, Math.round(q + e))];
  }

  /**
   * 顶栏上挂的角标，最多三条。
   * 排在最前的是当下最该管的：身上的毛病 → 撑不住 → 田里的坏账 → 田里的好账。
   * 所以只挂得下三条时，被挤掉的总是好消息。
   */
  statusChips() {
    const bad = [], good = [];
    for (const slot of SLOTS) {
      const item = this.state.player.equipment[slot];
      if (item?.states?.length) bad.push({ good:false, text:`${item.name}:${item.states[0]}` });
    }
    if (this.state.player.stress >= 80) bad.push({ good:false, text:'撑不住了' });
    for (const m of this.state.field.modifiers) {
      (m.good ? good : bad).push({ good:!!m.good, text:m.name });
    }
    return bad.concat(good).slice(0, 3);
  }

  /** 当前地点有没有同窗，有的话把那一幕的描述给出来。 */
  classmateHere(locationId) {
    const scene = this.data.classmateScenes[locationId ?? this.state.player.location];
    if (!scene) return null;
    return { npcId:scene.npcId, name:this.npcName(scene.npcId),
             presenceText:scene.presenceText };
  }
}

/* ============================================================================
   ◆ VIEW —— 第三层：视图渲染
   ----------------------------------------------------------------------------
   从这一行往下才开始碰 document。所有 DOM 操作都在这儿。
   搬 Cocos 时这一层整个不要，换成一个「读 GameEngine 快照、摆节点」的脚本。
   ============================================================================ */

class UIRenderer {
  constructor(engine, data, root) {
    this.engine = engine;
    this.data = data;
    this.root = root;
    this.tab = 'field';
    this.selectedRelic = null;
    this.el = {
      time:      root.querySelector('#tbTime'),
      weather:   root.querySelector('#tbWeather'),
      stamina:   root.querySelector('#tbStamina'),
      stress:    root.querySelector('#tbStress'),
      money:     root.querySelector('#tbMoney'),
      dotStamina:root.querySelector('#dotStamina'),
      dotStress: root.querySelector('#dotStress'),
      barStamina:root.querySelector('#barStamina'),
      barStress: root.querySelector('#barStress'),
      chips:     root.querySelector('#tbChips'),
      sceneName: root.querySelector('#sceneName'),
      sceneWho:  root.querySelector('#sceneWho'),
      narr:      root.querySelector('#narr'),
      actions:   root.querySelector('#actions'),
      navbar:    root.querySelector('#navbar'),
      mask:      root.querySelector('#mask'),
      drawer:    root.querySelector('#drawer'),
      drawerBody:root.querySelector('#drawerBody'),
      modal:     root.querySelector('#modal'),
      sheet:     root.querySelector('#sheet'),
      toast:     root.querySelector('#toast')
    };
  }

  /* ── 接线 ─────────────────────────────────────────────────── */
  mount() {
    this.root.querySelector('#drawerBtn').onclick = () => this.openDrawer();
    this.el.mask.onclick = () => this.closeDrawer();
    this.el.modal.onclick = e => { if (e.target === this.el.modal) this.closeSheet(); };
    this.root.querySelectorAll('.tab').forEach(t => {
      t.onclick = () => {
        this.root.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
        t.classList.add('on');
        this.tab = t.dataset.tab;
        this.renderDrawer();
      };
    });
    // 浏览器窗口拉过 1024 那条线时，抽屉从「抽出来」变成「常驻」，
    // 或者反过来 —— 两边都得重画一次，不然那栏里会是空的／是旧的。
    let wasWide = UIRenderer.isWide();
    window.addEventListener('resize', () => {
      if (UIRenderer.isWide() === wasWide) return;
      wasWide = UIRenderer.isWide();
      if (!wasWide) this.closeDrawer();
      this.renderAll();
    });
    this.engine.drainEvents();
    this.renderAll();
  }

  /* ── 小工具 ───────────────────────────────────────────────── */
  static toastTimer = null;
  toast(text) {
    const t = this.el.toast;
    t.textContent = text;
    t.className = 'on';
    clearTimeout(UIRenderer.toastTimer);
    UIRenderer.toastTimer = setTimeout(() => { t.className = ''; }, 1900);
  }
  static gaugeColor(v, higherIsBetter) {
    const good = higherIsBetter ? v >= 60 : v <= 40;
    const bad  = higherIsBetter ? v <= 25 : v >= 75;
    return good ? 'var(--ok)' : bad ? 'var(--bad)' : 'var(--warn)';
  }
  static duration(minutes) {
    if (minutes < 60) return `${minutes}分`;
    const h = minutes / 60;
    return (h % 1 === 0 ? h : h.toFixed(1)) + '小时';
  }
  /** 把一段带换行的文本铺成 <p>。 */
  static paragraphs(text) {
    return (text || '').split('\n').map(line => `<p>${line}</p>`).join('');
  }
  /** 开销那一串：耗时 / 体力 / 钱 / 筹码。
   *  动作池的按钮和决策方案共用同一套写法 —— 说好每个选项都要先把成本摆出来的，
   *  决策那屏早先漏了这一段，一屏一千二的插秧机点下去才知道要花钱。 */
  static costs(a) {
    const bits = [];
    if (a.costTimeMinutes) bits.push(`耗时${UIRenderer.duration(a.costTimeMinutes)}`);
    if (a.costStamina > 0) bits.push(`体力-${a.costStamina}`);
    if (a.costStamina < 0) bits.push(`体力+${-a.costStamina}`);
    if (a.costMoney) bits.push(`${a.costMoney}元`);
    if (a.costHookNpc) bits.push('🪝 一个筹码');
    // 压力也摆出来：歇会儿、焖锅饭这一类，回的那口气全在压力上，
    // 不写出来就只剩「体力+20」，看着像白捡的。
    if (a.stressDelta) bits.push(`压力${a.stressDelta > 0 ? '+' : ''}${a.stressDelta}`);
    // 每一项都包个 span 再回去。.act-sub 是个 flex，
    // 光把几个字符串扔进去，它们会并成**一块**匿名文本 —— 中间那个间距就不生效了，
    // 读出来是「耗时30分体力-6」。包成元素才各自是一个 flex item。
    return bits.map(t => `<span class="bit">${t}</span>`);
  }
  /** 效果里那几个数字，缩成一行「这一步的账」。 */
  static ledger(effect) {
    if (!effect) return '';
    const parts = [];
    if (effect.yieldDelta)   parts.push(`亩产 ${effect.yieldDelta > 0 ? '+' : ''}${effect.yieldDelta}`);
    if (effect.qualityDelta) parts.push(`米质 ${effect.qualityDelta > 0 ? '+' : ''}${effect.qualityDelta}`);
    if (effect.moneyDelta)   parts.push(`钱 ${effect.moneyDelta > 0 ? '+' : ''}${effect.moneyDelta}`);
    return parts.join(' · ');
  }
  static modifierRows(effect) {
    if (!effect?.modifiers) return '';
    return effect.modifiers.map(m =>
      `<div class="chk-row"><span>${m.good ? '🟩' : '🟥'} ${m.name}</span>
       <span class="mk">${m.desc}</span></div>`).join('');
  }

  /* ── 总渲染 ───────────────────────────────────────────────── */
  renderAll() {
    this.renderTopBar();
    const scene = this.renderScene();
    this.renderNarrative(scene);
    this.renderActions();
    this.renderLocationBar();
    if (this.drawerVisible()) this.renderDrawer();
  }

  /** 体力、压力这两样的满格是多少。引擎那边没这个常数 ——
   *  开局的 100 / 0 是配置里的数值，不是上限定义。这儿只为画进度条，
   *  所以夹一下就够了，别把它当成一条真规则到处用。 */
  static STAT_MAX = 100;

  renderTopBar() {
    const st = this.engine.state;
    const w = this.data.weather[st.time.weather];
    this.renderClock();
    this.el.weather.textContent = `${w.icon} ${w.label}`;
    this.el.stamina.textContent = st.player.stamina;
    this.el.stress.textContent = st.player.stress;
    this.el.money.textContent = st.player.money;

    // 圆点和进度条一个色。光晕在这儿一起写进去 ——
    // 样式里只能写 currentColor，那是奶白的，配红的绿的圆点不对。
    const tint = (dot, bar, v, higherIsBetter) => {
      const c = UIRenderer.gaugeColor(v, higherIsBetter);
      dot.style.background = c;
      dot.style.boxShadow = `0 0 7px -1px ${c}`;
      bar.style.background = c;
      bar.style.width = Math.max(0, Math.min(100,
        v / UIRenderer.STAT_MAX * 100)).toFixed(0) + '%';
    };
    tint(this.el.dotStamina, this.el.barStamina, st.player.stamina, true);
    tint(this.el.dotStress,  this.el.barStress,  st.player.stress,  false);

    this.el.chips.innerHTML = this.engine.statusChips()
      .map(c => `<span class="buff ${c.good ? 'good' : 'bad'}">${c.text}</span>`).join('');
  }

  /** 顶栏那一行时间：节气做成一枚金印，钟点另起一小段灰字。
   *  clockText() 本来就是「谷雨 · 第1天 08:00（清晨）」一整句，
   *  这儿只是把开头那个节气名切出来单独上色 —— 所以切不动就整句照放，
   *  文案是引擎那边出的，视图不许自己拼。 */
  renderClock() {
    const term = this.engine.currentTerm.id;
    const text = this.engine.clockText();
    const rest = text.startsWith(term) ? text.slice(term.length) : '';
    this.el.time.innerHTML = rest
      ? `<span class="tb-term">${term}</span><span class="tb-clock">${rest}</span>`
      : `<span class="tb-clock">${text}</span>`;
  }

  renderScene() {
    const loc = this.engine.location(this.engine.state.player.location);
    const mate = this.engine.classmateHere();
    this.el.sceneName.textContent = loc.name;
    // 那枚圆点是 CSS 的 ::before 画的，不进 textContent ——
    // 不在场时这里得**空着**，空才落得上 :empty 那条「别挂个空胶囊」。
    this.el.sceneWho.textContent = mate ? `${mate.name} 在此` : '';
    return mate;
  }

  /**
   * 叙事区：地点一句话 + 在场的人 + 刚发生的事。
   * 事情那一截是滚动窗，最多留三条 —— 一次动作有时候会连出好几笔
   * （比如陷进泥里：干了什么、出了什么事、该怎么办）。
   */
  renderNarrative(mate) {
    // 头一句是交代地方，不是正文，压暗一档分开
    const parts = [`<p class="scene-desc">${
      this.engine.location(this.engine.state.player.location).desc}</p>`];
    if (mate) parts.push(`<p class="said">${mate.presenceText.replace(/\n/g, '<br>')}</p>`);
    let first = true;
    for (const e of this.engine.peekEvents(3)) {
      const cls = (e.kind === 'sys' || e.kind === 'travel') ? 'sys' : 'ev';
      // 新发生的第一笔上面划一道虚线 —— 这一窗里哪几行是刚出来的，一眼看得出
      parts.push(`<p class="${cls}${first ? ' ev-first' : ''}">${
        e.text.replace(/\n/g, '<br>')}</p>`);
      first = false;
    }
    const box = this.el.narr;
    box.innerHTML = parts.join('');
    box.scrollTop = box.scrollHeight;      // 最新的那笔得看得见
  }

  renderActions() {
    const box = this.el.actions;
    box.innerHTML = '';

    const decision = this.engine.currentDecision();
    if (decision) {
      // 按钮上那行用的是日程表里的 taskWindow（泡种落谷 / 控水晒田 / 除草 …），
      // 整句照搬，不改字也不截字。
      // 早先写的是「该${屏名}了」—— 遇上屏名是「水」「草」「虫」的几屏，读出来不成话。
      const termRow = this.data.solarTerms.find(t => t.id === decision.solarTerm);
      box.appendChild(this.actionButton({
        id:'decision_' + decision.id,
        label: termRow ? `${termRow.taskWindow}的时候到了` : `该${decision.screenName}了`,
        detail:'这一步定下去，秋后才见账',
        isDecision:true
      }));
    }
    for (const a of this.engine.actionsHere()) {
      if (a.opensPresale && this.engine.state.flags.presaleTaken) continue;
      box.appendChild(this.actionButton(a));
    }
    if (!box.children.length) {
      const d = document.createElement('div');
      d.className = 'act locked';
      d.innerHTML = '<div class="act-body"><div class="act-main">这儿这会儿没什么可干的</div></div>';
      box.appendChild(d);
    }
  }

  /** 成功率按三档上色。检定面板和动作按钮共用同一个档位，
   *  免得同一个数在列表里是绿的、点进去变黄的。 */
  static chanceClass(chance) {
    return chance > 75 ? 'good' : chance > 50 ? 'mid' : 'low';
  }

  actionButton(a) {
    const el = document.createElement('div');
    const blocked = this.engine.describeBlocker(a);
    // 卡片没有图标了：原来那个 emoji（⚡/💰/🎲）既说不清是什么事，
    // 又跟左边的色条、右边的徽章各说各话。现在「是什么」靠色条，
    // 「多大把握」靠徽章，都比一个闪电准。
    el.className = 'act' + (blocked ? ' locked' : '') + (a.isDecision ? ' decision' : '')
      + (a.check ? ' check' : '');

    const bits = UIRenderer.costs(a);
    // 说明另起一行。跟开销挤在同一行过 —— 说明里本来就常写着「30分 · 体力-6」，
    // 跟左边那几个数一对，看着像是重了一遍。
    const note = a.detail ? `<div class="act-note">${a.detail}</div>` : '';

    // 带检定的往右挂一枚概率徽章：大数字 + 小字注明这是「检定」
    let badge = '';
    if (a.check) {
      const chance = this.engine.resolveCheck(a.check).chance;
      badge = `<div class="act-badge ${UIRenderer.chanceClass(chance)}">
        <b>${chance}</b><span>检定</span></div>`;
    }

    el.innerHTML =
      // .act-body 这一层不能省：.act 是 flex 行，
      // 里头几个块要是直接当 flex item，就会**并排**摊开，
      // 说明和开销会跑到标题右边去。包一层，里头才是正常的竖着堆。
      `<div class="act-body">` +
        (a.isDecision ? `<div class="act-kind">农时</div>` : '') +
        `<div class="act-main">${a.label}</div>` +
        `<div class="act-sub">${bits.join('')}</div>` +
        note +
        (blocked ? `<div class="act-why">${blocked}</div>` : '') +
      `</div>` + badge;

    if (!blocked) el.onclick = () => {
      if (a.isDecision) return this.openDecisionSheet();
      if (a.opensPresale) return this.openPresaleSheet();
      const r = this.engine.executeAction(a.id);
      if (r.error) return this.toast(r.error);
      this.renderAll();
      if (r.check) this.showCheckResult(a.label, r.check, r.effect, r.text);
    };
    return el;
  }

  /** 五个地点各配一个图标。键是 location.id，加地点得跟着补一个，
   *  漏了就用最后一格那个垫底 —— 不认字总比认不出好。 */
  static LOC_ICON = { field:'🌾', shed:'🛖', plot:'🧪', village:'🏡', town:'🏮' };

  renderLocationBar() {
    const bar = this.el.navbar;
    bar.innerHTML = '';
    const here = this.engine.state.player.location;
    for (const loc of this.data.locations) {
      const isHere = loc.id === here;
      const minutes = isHere ? 0 : this.engine.walkMinutes(here, loc.id);
      // 直线距离就是「不穿鞋也不陷泥」时的耗时（见 engine.walkMinutes）——
      // 视图自己拿坐标算，不必再问引擎要一个「没加成要多久」的重载。
      // 比它慢，就是身上那身行头拖的（胶鞋走泥路慢一半），标成麦芽黄。
      const pure = Math.round(Math.hypot(loc.x - this.engine.location(here).x,
                                        loc.y - this.engine.location(here).y));
      const slowed = !isHere && minutes > pure;

      const b = document.createElement('div');
      b.className = 'loc' + (isHere ? ' here' : '') + (slowed ? ' far' : '');
      b.innerHTML =
        `<div class="loc-ic">${UIRenderer.LOC_ICON[loc.id] || '📍'}</div>
         <div class="loc-n">${loc.name}</div>
         <div class="loc-t">${isHere ? '就在这儿'
           : `<span class="wl">${minutes} 分钟</span>`}</div>`;
      if (!isHere) b.onclick = () => {
        const r = this.engine.moveTo(loc.id);
        this.renderAll();
        if (r?.travelEvent) this.toast(r.travelEvent);
      };
      bar.appendChild(b);
    }
  }

  /* ── 抽屉 ─────────────────────────────────────────────────── */
  /** 宽屏上抽屉是**常驻**的：CSS 里把它摆到了右栏，不再抽进抽出。
   *  所以「抽屉开着没开着」这件事不能只看 .on 那个 class —— 宽屏上永远没有它。
   *  这个 1024 跟样式里那一段是同一个数，改要一起改。 */
  static isWide() {
    return typeof window.matchMedia === 'function'
      && window.matchMedia('(min-width:1024px)').matches;
  }
  /** 抽屉这会儿看不看得见 —— 宽屏常驻，窄屏看 .on。 */
  drawerVisible() {
    return UIRenderer.isWide() || this.el.drawer.classList.contains('on');
  }
  openDrawer() {
    // 宽屏上它本来就在那儿，再按一次不该弹出一层遮罩来
    if (UIRenderer.isWide()) { this.renderDrawer(); return; }
    this.el.drawer.classList.add('on');
    this.el.mask.classList.add('on');
    this.renderDrawer();
  }
  closeDrawer() {
    this.el.drawer.classList.remove('on');
    this.el.mask.classList.remove('on');
  }
  renderDrawer() {
    ({ field:this.renderFieldTab, schedule:this.renderScheduleTab,
       people:this.renderPeopleTab, relics:this.renderRelicTab })[this.tab]
      .call(this, this.el.drawerBody);
  }

  /* ① 田况与穿戴 */
  /** 一张数据看板：大数字 + 一条「误差半径」带子。
   *  带子中间那道准星是估值的中点，两边铺开的宽窄就是这颗心的虚实 ——
   *  越宽越没数。误差范围是引擎给的，视图只负责画出来。
   *  满量程取多少：亩产按 1200 斤封顶，米质按 100 分。*/
  static gaugeCard(label, unit, lo, hi, margin, span) {
    const mid = (lo + hi) / 2;
    const width = Math.min(100, margin * 2 / span * 100);
    const pct = v => Math.max(0, Math.min(100, v / span * 100));
    // 单位前面那个空格是**留着的**，不是手滑：
    // 「840 ~ 920 斤」这句是连着读的，单位贴死在数上会读成「920斤」一坨。
    return `<div class="stat">
      <div class="stat-l">${label}</div>
      <div class="stat-v">${lo} ~ ${hi}<span class="stat-u"> ${unit}</span></div>
      <div class="radius">
        <div class="radius-bar">
          <div class="radius-band" style="left:${pct(mid - margin).toFixed(1)}%;
            width:${width.toFixed(1)}%"></div>
          <div class="radius-mid" style="left:${pct(mid).toFixed(1)}%"></div>
        </div>
        <div class="radius-foot">误差 ±${margin} ${unit}</div>
      </div>
    </div>`;
  }

  renderFieldTab(box) {
    const e = this.engine;
    const [y0, y1] = e.yieldRange(), [q0, q1] = e.qualityRange();
    const margin = e.yieldErrorMargin(), qMargin = e.qualityErrorMargin();
    const passive = e.relicMargin().yield;
    const fit = margin <= 35 ? '收得挺窄了' : margin <= 55 ? '大致有数' : '还虚着';

    box.innerHTML = `
      <h3>田里的估值</h3>
      <div class="stat-cards">
        ${UIRenderer.gaugeCard('预估亩产', '斤', y0, y1, margin, 1200)}
        ${UIRenderer.gaugeCard('预估米质', '分', q0, q1, qMargin, 100)}
      </div>
      <div class="mod plain"><span>这把尺子</span>
        <span class="why">${fit}${passive
          ? ` · 手里的家什替你收窄了 ${-passive} 斤` : ''}</span></div>
      <h3>田况词条</h3>
      ${e.state.field.modifiers.length
        ? e.state.field.modifiers.map(m => `
            <div class="mod ${m.good ? '' : 'bad'}">
              <span>${m.name} <span class="why">（${m.desc}）</span></span></div>`).join('')
        : '<div class="mod plain">还没什么攒下来</div>'}
      <h3>身上的穿戴</h3>
      ${this.slotRow('head','🎩')}${this.slotRow('feet','👟')}
      ${this.slotRow('tool','🔧')}${this.slotRow('accessory','🎒')}`;
  }

  slotRow(slot, icon) {
    const item = this.engine.state.player.equipment[slot];
    if (!item) {
      return `<div class="slot"><div class="slot-row">
        <div class="slot-ic">${icon}</div>
        <div class="slot-b"><div class="slot-t slot-empty">${
          SLOT_NAMES[slot]}位空着</div></div></div></div>`;
    }
    const states = (item.states || []).map(s => `<span class="tag">${s}</span>`).join('');
    const good = item.effect?.desc ? `<span class="tag g">${item.effect.desc}</span>` : '';
    const dur = item.durability;
    return `<div class="slot">
      <div class="slot-row">
        <div class="slot-ic">${icon}</div>
        <div class="slot-b">
          <div class="slot-t">${item.name}</div>
          <div class="slot-e">${item.quote || ''}</div>
          <div class="tags">${states}${good}</div>
        </div>
        ${dur === undefined ? '' : `<div class="dur"><span>耐久</span><b>${dur}%</b></div>`}
      </div>
      ${dur === undefined ? '' :
        `<div class="dur-bar"><i class="${dur <= 30 ? 'low' : ''}" style="width:${dur}%"></i></div>`}
    </div>`;
  }

  /* ② 日程与农时 */
  renderScheduleTab(box) {
    const e = this.engine, st = e.state, term = e.currentTerm;
    const total = term.days * 24 * 60;
    const elapsed = (st.time.day - 1) * 24 * 60 + st.time.minutes;
    const left = Math.max(0, total - elapsed);
    const next = this.data.solarTerms[
      (st.time.solarTermIndex + 1) % this.data.solarTerms.length];
    const now = e.currentDecision(), late = e.overdueDecisions();

    box.innerHTML = `
      <h3>农时窗口</h3>
      <div class="clock">
        <div class="clock-t">距【${next.id}·${next.taskWindow}】开始<br>
          <b>${Math.floor(left / 60)} 小时 ${left % 60} 分</b></div>
        <div class="bar"><i style="width:${Math.round(elapsed / total * 100)}%"></i></div>
        <div style="font-size:11px;color:var(--dim);margin-top:6px">
          ${term.id} 第 ${st.time.day} / ${term.days} 天 · 这个节气的事：${term.work}</div>
      </div>
      <h3>备忘录</h3>
      ${now ? `<div class="memo soon">【${now.solarTerm}·${now.screenName}】还没定。
        这一步定下去，秋后才见账。</div>` : ''}
      ${late.map(d => `<div class="memo soon">【${d.solarTerm}·${d.screenName}】拖过了，还欠着。</div>`).join('')}
      ${(!now && !late.length) ? '<div class="memo done">到这会儿的正事都定了</div>' : ''}
      ${st.flags.presaleOwed
        ? '<div class="memo soon">欠着一百份预售的米。秋天交不出来，钱得退。</div>' : ''}
      ${st.player.stress >= 60 ? '<div class="memo soon">压力快到顶了。找个地方歇一歇。</div>' : ''}
      <div class="memo">镇上粮站挂着今年的收购价。</div>`;
  }

  /* ③ 人物 */
  /** 圆形头像里放什么：老周是姓，两位同窗是自己名字末尾那个「A」「B」。
   *  两个同窗全程去性别化 —— 头像也得是字母，不能是头像剪影。 */
  static avatarOf(n) {
    if (n.id === 'zhou') return n.name.slice(-1);
    const m = n.name.match(/[A-Z]$/);
    return m ? m[0] : n.name.slice(0, 1);
  }

  renderPeopleTab(box) {
    // 好感度是 -100 ~ +100 的两极条（引擎那边起始 0）。
    // 底数写成常数，免得三处各写一个 100。
    const OPINION_MAX = 100;
    /** 好坏只看「正负」，浓淡看「多少」—— 三档色 */
    const tint = v => v >= 30 ? 'var(--green)' : v < 0 ? 'var(--bad)' : 'var(--warn)';

    box.innerHTML = '<h3>人物关系</h3>' + this.data.npcs.map((n, i) => {
      const s = this.engine.state.npcs[n.id];
      const stage = s.opinion >= 60 ? '能开口求事' : s.opinion >= 30 ? '说得上话'
                  : s.opinion >= 0 ? '点头之交' : s.opinion > -30 ? '不太待见你' : '躲着你走';
      const color = tint(s.opinion);
      // 条子从中线往一边长。正的长右边，负的长左边 ——
      // 半格就是对满 100（不是整格）：+100 正好顶到右端，
      // 写成整格的话 +100 会长出条子外头去。
      const pct = Math.min(50, Math.abs(s.opinion) / OPINION_MAX * 50).toFixed(1);
      const barSide = s.opinion >= 0
        ? `<i class="opi-fill p" style="width:${pct}%"></i>`
        : `<i class="opi-fill m" style="width:${pct}%"></i>`;
      return `<div class="npc">
        <div class="npc-h">
          <div class="npc-av c${i % 3}">${UIRenderer.avatarOf(n)}</div>
          <div class="npc-hd">
            <div class="npc-n">${n.name}</div>
            <div class="npc-r">${n.role}</div>
          </div>
          <div class="npc-o" style="color:${color}">${s.opinion >= 0 ? '+' : ''}${s.opinion}</div>
        </div>
        <div class="opi">
          <div class="opi-mid"></div>${barSide}
        </div>
        <div class="opi-foot"><span>-100</span><span>0</span><span>+100</span></div>
        <div class="npc-d">${stage}${s.hooks ? ` · 🪝 人情筹码 ${s.hooks}` : ''}</div>
        <div class="npc-d">${n.voice}</div>
        <div class="npc-log">
          ${s.opinionLogs.length
            ? s.opinionLogs.map(l => `<div><span>${l.reason}</span>
                <b style="color:${l.delta >= 0 ? 'var(--ok)' : 'var(--bad)'}">
                ${l.delta >= 0 ? '+' : ''}${l.delta}</b></div>`).join('')
            : '<div><span>还没有来往</span><b></b></div>'}
        </div></div>`;
    }).join('');

    box.querySelectorAll('.npc').forEach(el => {
      el.querySelector('.npc-h').onclick = () => el.classList.toggle('open');
    });
  }

  /* ④ 藏品册 */
  renderRelicTab(box) {
    const owned = this.engine.state.player.relics;
    box.innerHTML =
      `<h3>藏品册 ${owned.length} / 36</h3><div class="relics" id="relicGrid"></div>`;
    const grid = box.querySelector('#relicGrid');

    for (const r of this.data.relics) {
      const has = owned.includes(r.id);
      const el = document.createElement('div');
      el.className = 'relic' + (has ? '' : ' lock') +
                     (this.selectedRelic === r.id ? ' sel' : '');
      // 类别次序照 relics 自己的排列（见 GameData 的注释）：
      // 免灾 01–06、免代价 07–12、换信息 13–18、换人情 19–24、换钱 25–30、顶货 31–36。
      // 一格一个色调，翻册子时一眼能看出是哪一路。
      el.dataset.cat = String(Math.floor((Number(r.id) - 1) / 6));
      // 角上挂个编号。没到手的那格也挂 —— 缺的是第几号，本来就该看得见。
      el.innerHTML = `<div class="relic-no">${r.id}</div>
                      <div class="relic-n">${has ? r.name : '？？'}</div>
                      <div class="relic-c">${has ? r.category : '未到手'}</div>`;
      if (has) el.onclick = () => {
        this.selectedRelic = this.selectedRelic === r.id ? null : r.id;
        this.renderRelicTab(box);
      };
      grid.appendChild(el);
    }

    const sel = this.selectedRelic ? this.engine.findRelic(this.selectedRelic) : null;
    if (sel) {
      const d = document.createElement('div');
      d.className = 'relic-d';
      d.innerHTML = `<div class="t">${sel.id} ${sel.name}
          <em>${sel.category}类${
            sel.slot ? ' · 可穿戴：' + SLOT_NAMES[sel.slot] : ''}</em></div>
        <div>${sel.quote}</div>
        <div class="q">来历：${sel.origin}</div>
        ${sel.effect?.desc ? `<div class="e">▸ ${sel.effect.desc}</div>` : ''}`;
      grid.appendChild(d);
    }
  }

  /* ── 决策层：CK3 式三选一 ─────────────────────────────────── */
  openDecisionSheet() {
    const d = this.engine.currentDecision();
    if (!d) return this.toast('这会儿没有要定的事');

    const rows = d.options.map(o => {
      const blocked = this.engine.describeBlocker(o);
      const panel = o.check ? this.engine.resolveCheck(o.check) : null;
      const color = panel ? (panel.chance >= 75 ? 'var(--ok)'
                           : panel.chance >= 50 ? 'var(--warn)' : 'var(--bad)')
                          : 'var(--dim)';
      const bits = UIRenderer.costs(o);
      if (panel) bits.push(`<span style="color:${color}">🎲 检定 ${panel.chance}%</span>`);
      else if (UIRenderer.ledger(o.onSuccess)) bits.push(UIRenderer.ledger(o.onSuccess));
      return `<div class="act${blocked ? ' locked' : ''}" data-option="${o.id}">
        <div class="act-main">${o.label}</div>
        <div class="act-sub">${bits.join('')}</div>
        <div class="act-note">${o.detail}</div>
        ${blocked ? `<div class="act-why">${blocked}</div>` : ''}</div>`;
    }).join('');

    this.setSheet(`
      <div class="sh-title">${d.solarTerm} · ${d.screenName}</div>
      <div class="sh-sub">${d.brief}</div>
      <div class="sh-body">${UIRenderer.paragraphs(d.story)}</div>
      <div class="sh-sec">这一步怎么走</div>
      ${rows}
      <button class="sh-btn ghost" id="sheetClose">再想想</button>`);

    this.el.sheet.querySelectorAll('[data-option]').forEach(el => {
      if (el.classList.contains('locked')) return;
      el.onclick = () => this.openOptionDetail(
        d, d.options.find(o => o.id === el.dataset.option));
    });
    this.el.sheet.querySelector('#sheetClose').onclick = () => this.closeSheet();
  }

  /* ── 选项详情：完整检定面板 ───────────────────────────────── */
  openOptionDetail(decision, o) {
    let html = `<div class="sh-title">${o.label}</div>
      <div class="sh-sub">${o.hinge || ''}</div>
      <div class="sh-body">${UIRenderer.paragraphs(o.pitch)}</div>`;

    if (o.check) {
      const panel = this.engine.resolveCheck(o.check);
      const cls = panel.chance >= 75 ? '' : panel.chance >= 50 ? 'mid' : 'low';
      // 那只环靠 --p 画：conic-gradient 走到百分之几，就是成功率百分之几。
      html += `<div class="sh-sec">检定 · ${panel.name}</div>
        <div class="chk-big">
          <div class="chk-num ${cls}" style="--p:${panel.chance}"><span>${panel.chance}%</span></div>
          <div class="chk-lbl">掷一颗 d100，掷出不超过这个数就算过<br>
            底子 <b>${panel.baseChance}</b>，底下每一笔加减都摊开了</div></div>
        <div class="chk-row base"><span>基础成功率</span><b>${panel.baseChance}%</b></div>`;
      // 加上了的正常列（绿），没加上的一律灰着、写明差在哪 ——
      // 原来没加成的只写「没加成」，看不出到底是没这个条件还是条件不够。
      for (const m of panel.entries) {
        if (m.applied > 0) {
          html += `<div class="chk-row"><span>${m.source}</span>
            <b class="p">+${m.applied}%</b></div>`;
        } else {
          const why = m.global ? '缺一条' : '未持有 / 未达标';
          html += `<div class="chk-row off"><span>${m.source}
            <span class="mk">· ${why}</span></span><b class="m">${
              m.applied < 0 ? m.applied + '%' : '0'}</b></div>`;
        }
      }
      html += `<div class="sh-sec">万一不过</div>
        <div class="chk-row risk"><span>${(o.check.onFailText || '').split('\n')[0]}</span>
          <b>${UIRenderer.ledger(o.check.onFail) || '—'}</b></div>`;
    } else {
      html += `<div class="sh-sec">这一步干了什么</div>
        <div class="chk-row"><span>这一步的账</span>
          <b>${UIRenderer.ledger(o.onSuccess) || '不亏不赚'}</b></div>
        ${UIRenderer.modifierRows(o.onSuccess)}`;
    }

    html += `<button class="sh-btn" id="sheetGo">就这么办</button>
             <button class="sh-btn ghost" id="sheetBack">退回去</button>`;
    this.setSheet(html);

    this.el.sheet.querySelector('#sheetGo').onclick = () => {
      const r = this.engine.chooseDecision(decision.id, o.id);
      if (r.error) return this.toast(r.error);
      this.closeSheet();
      this.renderAll();
      this.showCheckResult(`${decision.solarTerm}·${decision.screenName} · ${o.label}`,
                           r.check, r.effect, r.text);
    };
    this.el.sheet.querySelector('#sheetBack').onclick = () => this.openDecisionSheet();
  }

  /* ── 预售层 ───────────────────────────────────────────────── */
  openPresaleSheet() {
    const p = this.data.presale;
    this.setSheet(`
      <div class="sh-title">新米预售</div>
      <div class="sh-sub">同学B 出的主意 · 一百份，一份五十</div>
      <div class="sh-body">${UIRenderer.paragraphs(p.intro)}</div>
      <div class="sh-sec">挂多少</div>
      ${p.options.map(o => `<div class="act" data-presale="${o.id}">
        <div class="act-body"><div class="act-main">${o.label}</div>
        <div class="act-sub"><span class="bit">${o.detail}</span></div></div></div>`).join('')}
      <button class="sh-btn ghost" id="sheetClose">先不提这事</button>`);

    this.el.sheet.querySelectorAll('[data-presale]').forEach(el => {
      el.onclick = () => {
        const o = this.engine.takePresale(el.dataset.presale);
        this.closeSheet();
          this.renderAll();
        this.showCheckResult('新米预售 · ' + o.label, null, o.onSuccess, o.onSuccessText);
      };
    });
    this.el.sheet.querySelector('#sheetClose').onclick = () => this.closeSheet();
  }

  /* ── 结果层 ───────────────────────────────────────────────── */
  showCheckResult(title, check, effect, text) {
    let html = `<div class="sh-title">${title}</div>`;
    if (check) {
      html += `<div class="sh-sub">检定 · ${check.name}</div>
        <div class="chk-big">
          <!-- 这只环这回画的是掷出来的点数：指针走到 68，就是掷出了 68 -->
          <div class="chk-num ${check.passed ? '' : 'low'}"
               style="--p:${check.d100}"><span>${check.d100}</span></div>
          <div class="chk-lbl">掷出 ${check.d100}，要不超过 ${check.chance} ——
            <b style="color:${check.passed ? 'var(--ok)' : 'var(--bad)'}">
              ${check.passed ? '过了' : '没过'}</b></div>
        </div>`;
    }
    html += `<div class="sh-body">${UIRenderer.paragraphs(text)}</div>`;
    if (UIRenderer.ledger(effect)) {
      html += `<div class="chk-row"><span>这一步的账</span>
        <b>${UIRenderer.ledger(effect)}</b></div>`;
    }
    html += UIRenderer.modifierRows(effect);
    html += `<button class="sh-btn" id="sheetClose">知道了</button>`;
    this.setSheet(html);
    this.el.sheet.querySelector('#sheetClose').onclick = () => this.closeSheet();
  }

  /** 每张弹层顶上那条把手，统一在这儿加 —— 三个 open* 各写一遍容易漏。
   *  宽屏上弹层是个居中对话框，那条把手就没意义了，CSS 里收掉。 */
  setSheet(html) {
    this.el.sheet.innerHTML = `<div class="sh-grab"></div>` + html;
    this.el.modal.className = 'on';
  }
  closeSheet() { this.el.modal.className = ''; }
}

/* ============================================================================
   ◆ BOOT —— 引导：把 DOM 和引擎接起来
   ============================================================================ */
const engine   = new GameEngine(GameData);
const renderer = new UIRenderer(engine, GameData, document.getElementById('phone'));
renderer.mount();
</script>
